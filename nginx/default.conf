server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Meteorologická data připravuje hostitelský server každých deset minut.
  # Návštěvník proto nečeká na externí API a při jeho výpadku zůstane dostupná
  # poslední ověřená kopie.
  location = /api/pocasi-predpoved.json {
    try_files /api/pocasi-predpoved.json =503;
    default_type application/json;
    add_header Cache-Control "public, max-age=600, stale-if-error=21600" always;
  }

  location ~ "^/api/chmi-pocasi/(10m-0-20000-0-11438-[0-9]{8}\.json)$" {
    try_files /api/chmi-pocasi/$1 =404;
    default_type application/json;
    add_header Cache-Control "public, max-age=600, stale-if-error=21600" always;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # HTML a často měněné skripty/styly se musí po nasazení vždy znovu ověřit.
  location ~* \.(css|js)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Obrázky lze bezpečně držet déle v cache.
  location ~* \.(jpg|jpeg|png|webp|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
