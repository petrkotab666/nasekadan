proxy_cache_path /var/cache/nginx/weather levels=1:2 keys_zone=weather_cache:10m max_size=50m inactive=12h use_temp_path=off;

server {
  resolver 127.0.0.11 valid=300s ipv6=off;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Bodová předpověď pro střed Kadaně. Požadavek jde přes server, takže
  # meteorologická služba dostane řádnou identifikaci a ne IP návštěvníka.
  location = /api/pocasi-predpoved.json {
    set $met_upstream api.met.no;
    proxy_pass https://$met_upstream/weatherapi/locationforecast/2.0/compact?lat=50.3760&lon=13.2713&altitude=300;
    proxy_set_header Host $met_upstream;
    proxy_set_header User-Agent "nasekadan.cz info@nasekadan.cz";
    proxy_ssl_server_name on;
    proxy_ssl_name $met_upstream;
    proxy_cache weather_cache;
    proxy_cache_key "met-kadan-v1";
    proxy_cache_valid 200 15m;
    proxy_cache_valid any 2m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=900, stale-if-error=21600" always;
    add_header X-Weather-Cache $upstream_cache_status always;
  }

  # Desetiminutová měření ČHMÚ. Regulární výraz dovolí pouze soubor
  # profesionální stanice Tušimice a zabrání zneužití proxy pro jiné cesty.
  location ~ "^/api/chmi-pocasi/(10m-0-20000-0-11438-[0-9]{8}\.json)$" {
    set $chmi_upstream opendata.chmi.cz;
    proxy_pass https://$chmi_upstream/meteorology/climate/now/data/$1;
    proxy_set_header Host $chmi_upstream;
    proxy_set_header User-Agent "nasekadan.cz info@nasekadan.cz";
    proxy_ssl_server_name on;
    proxy_ssl_name $chmi_upstream;
    proxy_cache weather_cache;
    proxy_cache_key "chmi-$1";
    proxy_cache_valid 200 10m;
    proxy_cache_valid 404 1m;
    proxy_cache_valid any 2m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=600, stale-if-error=21600" always;
    add_header X-Weather-Cache $upstream_cache_status always;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # HTML a často měněné skripty/styly se musí po nasazení vždy znovu ověřit.
  location ~* \.(css|js)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Obrázky lze bezpečně držet déle v cache.
  location ~* \.(jpg|jpeg|png|webp|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
