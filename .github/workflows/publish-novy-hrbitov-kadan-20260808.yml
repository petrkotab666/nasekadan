name: Publikovat nový hřbitov Kadaň 2026

on:
  push:
    branches: [main]
    paths:
      - 'data/publish-novy-hrbitov-20260808.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-novy-hrbitov-kadan-20260808
  cancel-in-progress: false

env:
  SLUG: novy-hrbitov-kadan-architektonicka-studie-2026
  ARTICLE_URL: https://nasekadan.cz/clanky/novy-hrbitov-kadan-architektonicka-studie-2026.html
  TITLE: 'Kadaň posouvá plán nového hřbitova. Architektonická studie bude stát 580 tisíc korun'

jobs:
  publish:
    runs-on: [self-hosted, ovh, lastminuteslevy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit, zda už není publikace kompletní
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          q="pre-${GITHUB_RUN_ID}-$(date +%s)"
          article="$(curl -kfsS -L --max-time 25 "$ARTICLE_URL?v=$q" || true)"
          home="$(curl -kfsS -L --max-time 25 "https://nasekadan.cz/?v=$q" || true)"
          rss="$(curl -kfsS -L --max-time 25 "https://nasekadan.cz/rss.xml?v=$q" || true)"
          complete=0
          if grep -Fq "$TITLE" <<<"$article" \
            && grep -Fq 'Ve hře byly pozemky u současného hřbitova, směr Tušimice i Úhošťany' <<<"$article" \
            && grep -Fq "data-latest-article-href=\"/clanky/$SLUG.html\"" <<<"$home" \
            && [[ "$(grep -o "$SLUG.html" <<<"$rss" | wc -l | tr -d ' ')" == 1 ]]; then
            complete=1
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Vygenerovat a atomicky uložit publikaci
        if: steps.precheck.outputs.complete != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – nový hřbitov'
          git config user.email 'info@nasekadan.cz'
          success=0
          for attempt in 1 2 3 4 5; do
            git fetch --prune origin main
            git reset --hard origin/main
            export ARTICLE_SOURCE_COMMIT="$(git rev-parse HEAD)"
            python3 scripts/publish_novy_hrbitov_kadan_20260808.py
            git diff --check
            git add -A
            if git diff --cached --quiet; then
              success=1
              break
            fi
            git commit -m 'Publikovat článek o přípravě nového hřbitova v Kadani'
            if git push origin HEAD:main; then
              success=1
              break
            fi
            sleep $((attempt * 3))
          done
          [[ "$success" == 1 ]]
          git fetch --prune origin main
          git reset --hard origin/main
          echo "DEPLOYED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Kanonicky nasadit aktuální main na OVH
        if: steps.precheck.outputs.complete != '1'
        shell: bash
        run: |
          set -euo pipefail
          export NASEKADAN_SKIP_AUTOMATION_INSTALL=1
          bash deploy/sync-production.sh

      - name: Veřejně ověřit článek a všechny kanály
        if: steps.precheck.outputs.complete != '1'
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 12); do
            q="${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            article="$(curl -kfsS -L --max-time 35 "$ARTICLE_URL?v=$q" || true)"
            home="$(curl -kfsS -L --max-time 35 "https://nasekadan.cz/?v=$q" || true)"
            archive="$(curl -kfsS -L --max-time 35 "https://nasekadan.cz/clanky/?v=$q" || true)"
            rss="$(curl -kfsS -L --max-time 35 "https://nasekadan.cz/rss.xml?v=$q" || true)"
            sitemap="$(curl -kfsS -L --max-time 35 "https://nasekadan.cz/sitemap.xml?v=$q" || true)"
            news="$(curl -kfsS -L --max-time 35 "https://nasekadan.cz/news-sitemap.xml?v=$q" || true)"
            llms="$(curl -kfsS -L --max-time 35 "https://nasekadan.cz/llms.txt?v=$q" || true)"
            registry="$(curl -kfsS -L --max-time 35 "https://nasekadan.cz/data/published-content-index.json?v=$q" || true)"
            health="$(curl -kfsS -L --max-time 35 "https://nasekadan.cz/deployment-health.txt?v=$q" || true)"
            ok=1
            grep -Fq "<h1>$TITLE</h1>" <<<"$article" || ok=0
            grep -Fq '<meta name="robots" content="index,follow' <<<"$article" || ok=0
            grep -Fq "<link rel=\"canonical\" href=\"$ARTICLE_URL\">" <<<"$article" || ok=0
            grep -Fq 'Tušimice i Úhošťany' <<<"$article" || ok=0
            grep -Fq "data-latest-article-href=\"/clanky/$SLUG.html\"" <<<"$home" || ok=0
            grep -Fq "$SLUG.html" <<<"$archive" || ok=0
            [[ "$(grep -o "$SLUG.html" <<<"$rss" | wc -l | tr -d ' ')" == 1 ]] || ok=0
            [[ "$(grep -o "$SLUG.html" <<<"$sitemap" | wc -l | tr -d ' ')" == 1 ]] || ok=0
            [[ "$(grep -o "$SLUG.html" <<<"$news" | wc -l | tr -d ' ')" == 1 ]] || ok=0
            grep -Fq "$SLUG.html" <<<"$llms" || ok=0
            grep -Fq "$SLUG.html" <<<"$registry" || ok=0
            grep -Fq "source=$DEPLOYED_SHA" <<<"$health" || ok=0
            if [[ "$ok" == 1 ]]; then
              curl -kfsS -L --max-time 35 "https://nasekadan.cz/social/$SLUG.png?v=$q" -o /tmp/novy-hrbitov-social.png
              python3 - <<'PY'
          from PIL import Image
          with Image.open('/tmp/novy-hrbitov-social.png') as im:
              assert im.format == 'PNG', im.format
              assert im.size == (1200, 630), im.size
          PY
              success=1
              break
            fi
            sleep $((attempt * 4))
          done
          [[ "$success" == 1 ]]
          echo 'HOTOVO: článek o novém hřbitově je veřejně ověřený včetně grafiky, titulky, archivu, RSS a sitemap.'

      - name: Už bylo správně zveřejněno
        if: steps.precheck.outputs.complete == '1'
        run: echo 'Publikace už byla veřejně kompletní; nevytvářím duplicitní commit ani deploy.'
