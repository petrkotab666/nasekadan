name: Jednorázová synchronizace kanonického registru

on:
  push:
    paths:
      - '.github/workflows/canonical-registry-sync-20260803-1307.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronizovat registr s živým webem
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import re
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          BASE = "https://nasekadan.cz"
          REGISTRY = Path("data/published-content-index.json")
          STATUS = Path(".github/canonical-registry-sync-status.json")
          now = dt.datetime.now(dt.timezone.utc)

          def fetch(path: str) -> tuple[int, str]:
              sep = "&" if "?" in path else "?"
              url = f"{BASE}{path}{sep}canonical_audit={int(time.time())}"
              last = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "NaseKadanCanonicalAudit/1.0",
                              "Cache-Control": "no-cache",
                              "Pragma": "no-cache",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return response.status, response.read().decode("utf-8", "replace")
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + attempt * 2)
              raise RuntimeError(f"Nelze načíst {url}: {last}")

          def article_links(html: str) -> set[str]:
              out = set()
              for href in re.findall(r'href=["\']([^"\']+)["\']', html, flags=re.I):
                  absolute = urllib.parse.urljoin(BASE + "/", href)
                  parsed = urllib.parse.urlsplit(absolute)
                  if parsed.netloc.lower() != "nasekadan.cz":
                      continue
                  path = parsed.path
                  if re.fullmatch(r"/clanky/[^/]+\.html", path):
                      out.add(BASE + path)
              return out

          def xml_links(xml_text: str, item_tag: str | None = None) -> set[str]:
              links = set()
              root = ET.fromstring(xml_text)
              if item_tag == "rss":
                  for item in root.findall(".//item"):
                      link = item.findtext("link")
                      if link:
                          links.add(link.strip().split("#", 1)[0])
              else:
                  for elem in root.iter():
                      if elem.tag.endswith("loc") and elem.text:
                          links.add(elem.text.strip().split("#", 1)[0])
              return {u for u in links if re.fullmatch(r"https://nasekadan\.cz/clanky/[^/]+\.html", u)}

          def public_h1(html: str) -> str | None:
              m = re.search(r"<h1\b[^>]*>(.*?)</h1>", html, flags=re.I | re.S)
              if not m:
                  return None
              text = re.sub(r"<[^>]+>", " ", m.group(1))
              return re.sub(r"\s+", " ", text).strip()

          def public_modified(html: str) -> str | None:
              patterns = [
                  r'"dateModified"\s*:\s*"([^"]+)"',
                  r"'dateModified'\s*:\s*'([^']+)'",
                  r'<meta\b[^>]*(?:property|name)=["\']article:modified_time["\'][^>]*content=["\']([^"\']+)',
                  r'<meta\b[^>]*content=["\']([^"\']+)["\'][^>]*(?:property|name)=["\']article:modified_time["\']',
              ]
              for pattern in patterns:
                  m = re.search(pattern, html, flags=re.I)
                  if m:
                      return m.group(1).strip()
              return None

          endpoints = {}
          for path in ["/", "/clanky/", "/rss.xml", "/sitemap.xml", "/news-sitemap.xml", "/deployment-health.txt"]:
              code, body = fetch(path)
              if code != 200 or not body.strip():
                  raise RuntimeError(f"Veřejný endpoint {path} vrátil stav {code} nebo prázdný obsah")
              endpoints[path] = body

          homepage_urls = article_links(endpoints["/"])
          archive_urls = article_links(endpoints["/clanky/"])
          rss_urls = xml_links(endpoints["/rss.xml"], "rss")
          sitemap_urls = xml_links(endpoints["/sitemap.xml"])
          news_urls = xml_links(endpoints["/news-sitemap.xml"])

          data = json.loads(REGISTRY.read_text(encoding="utf-8"))
          before = {
              "generated_at": data.get("generated_at"),
              "source_commit": data.get("source_commit"),
              "article_count": data.get("article_count"),
          }

          registered_urls = {a.get("url") for a in data.get("articles", [])}
          missing_from_registry = sorted(archive_urls - registered_urls)
          not_public = sorted(registered_urls - archive_urls)
          if missing_from_registry:
              raise RuntimeError("Veřejné články chybějí v registru: " + ", ".join(missing_from_registry))
          if not_public:
              raise RuntimeError("Registr obsahuje jako publikované URL mimo veřejný archiv: " + ", ".join(not_public))

          changed_articles = []
          for article in data.get("articles", []):
              url = article["url"]
              article["status"] = {
                  "homepage": url in homepage_urls,
                  "archive": url in archive_urls,
                  "rss": url in rss_urls,
                  "sitemap": url in sitemap_urls,
                  "news_sitemap": url in news_urls,
              }
              article["publication_status"] = "published"

              code, html = fetch(urllib.parse.urlsplit(url).path)
              if code != 200:
                  raise RuntimeError(f"Článek {url} vrátil stav {code}")
              h1 = public_h1(html)
              if not h1:
                  raise RuntimeError(f"Článek {url} nemá čitelný H1")
              if article.get("h1") != h1:
                  changed_articles.append({"url": url, "field": "h1", "old": article.get("h1"), "new": h1})
                  article["h1"] = h1

              modified = public_modified(html)
              if modified and article.get("modified_at") != modified:
                  changed_articles.append({"url": url, "field": "modified_at", "old": article.get("modified_at"), "new": modified})
                  article["modified_at"] = modified

              source_path = article.get("source_path")
              if source_path and Path(source_path).exists():
                  commit = subprocess.check_output(
                      ["git", "log", "-1", "--format=%H", "--", source_path], text=True
                  ).strip()
                  if commit and article.get("source_commit") != commit:
                      changed_articles.append({"url": url, "field": "source_commit", "old": article.get("source_commit"), "new": commit})
                      article["source_commit"] = commit

          urls = [a["url"] for a in data.get("articles", [])]
          fingerprints = [a.get("fingerprint") for a in data.get("articles", []) if a.get("fingerprint")]
          duplicate_urls = sorted({u for u in urls if urls.count(u) > 1})
          duplicate_fingerprints = sorted({f for f in fingerprints if fingerprints.count(f) > 1})

          required = ["title", "h1", "url", "published_at", "modified_at", "persons", "organizations", "places", "cases", "topics", "fingerprint", "status", "source_path", "publication_status", "source_commit"]
          required_complete = all(all(k in article and article[k] is not None for k in required) for article in data.get("articles", []))

          health_text = endpoints["/deployment-health.txt"]
          health_sha = re.search(r"\b[0-9a-f]{40}\b", health_text, flags=re.I)
          audit_payload = {
              "homepage": sorted(homepage_urls),
              "archive": sorted(archive_urls),
              "rss": sorted(rss_urls),
              "sitemap": sorted(sitemap_urls),
              "news_sitemap": sorted(news_urls),
              "h1": {a["url"]: a["h1"] for a in data.get("articles", [])},
          }

          data["schema_version"] = "1.3"
          data["generated_at"] = now.isoformat()
          data["source_commit"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          data["article_count"] = len(data.get("articles", []))
          validation = data.setdefault("validation", {})
          validation.update({
              "homepage_count": len(homepage_urls),
              "archive_count": len(archive_urls),
              "rss_count": len(rss_urls),
              "sitemap_all_articles_present": registered_urls <= sitemap_urls,
              "news_sitemap_recent_count": len(registered_urls & news_urls),
              "deployment_health": "verified",
              "required_fields_complete": required_complete,
              "duplicate_urls": duplicate_urls,
              "duplicate_fingerprints": duplicate_fingerprints,
              "per_article_source_commits": all(bool(a.get("source_commit")) for a in data.get("articles", [])),
              "deployment_health_source": health_sha.group(0) if health_sha else None,
              "public_audit_at": now.isoformat(),
              "public_audit_sha256": hashlib.sha256(json.dumps(audit_payload, ensure_ascii=False, sort_keys=True).encode("utf-8")).hexdigest(),
          })

          if duplicate_urls or duplicate_fingerprints or not required_complete:
              raise RuntimeError("Validace registru selhala")
          if len(archive_urls) != len(data.get("articles", [])) or len(rss_urls) != len(data.get("articles", [])):
              raise RuntimeError(f"Rozpor počtů: registr={len(data.get('articles', []))}, archiv={len(archive_urls)}, RSS={len(rss_urls)}")
          if not registered_urls <= sitemap_urls:
              raise RuntimeError("Hlavní sitemapa neobsahuje všechny veřejné články")

          REGISTRY.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          status = {
              "status": "success",
              "checked_at": now.isoformat(),
              "before": before,
              "after": {
                  "generated_at": data["generated_at"],
                  "source_commit": data["source_commit"],
                  "article_count": data["article_count"],
                  "homepage_count": len(homepage_urls),
                  "archive_count": len(archive_urls),
                  "rss_count": len(rss_urls),
                  "news_sitemap_recent_count": len(registered_urls & news_urls),
                  "deployment_health": "verified",
              },
              "changed_articles": changed_articles,
              "duplicate_urls": duplicate_urls,
              "duplicate_fingerprints": duplicate_fingerprints,
          }
          STATUS.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git add data/published-content-index.json .github/canonical-registry-sync-status.json
          git rm .github/workflows/canonical-registry-sync-20260803-1307.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Synchronizovat kanonický registr s živým webem [skip ci]"
          git push origin HEAD:main
