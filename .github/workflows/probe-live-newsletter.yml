name: Prověřit živý newsletter
run-name: Diagnostika nasazení, API a poštovní infrastruktury

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-live-newsletter.yml'
      - '.github/probe-live-newsletter-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-live-newsletter-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prověřit veřejné služby
        id: probe
        shell: bash
        run: |
          set -u
          health_body="$(curl -kfsS --max-time 20 'https://nasekadan.cz/deployment-health.txt?newsletter-probe='"$GITHUB_SHA" 2>/dev/null || true)"
          api_body="$(curl -kfsS --max-time 20 'https://nasekadan.cz/api/newsletter/health?newsletter-probe='"$GITHUB_SHA" 2>/dev/null || true)"
          join_code="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 20 'https://nasekadan.cz/zapojte-se/?newsletter-probe='"$GITHUB_SHA" 2>/dev/null || true)"
          mx_records="$(dig +short MX nasekadan.cz 2>/dev/null | sort || true)"
          smtp_tcp=false
          if timeout 12 bash -c '</dev/tcp/smtp.seznam.cz/465' 2>/dev/null; then smtp_tcp=true; fi

          printf '%s' "$health_body" > /tmp/deployment-health.txt
          printf '%s' "$api_body" > /tmp/api-health.txt
          printf '%s' "$mx_records" > /tmp/mx.txt

          echo "join_code=${join_code:-0}" >> "$GITHUB_OUTPUT"
          echo "smtp_tcp=$smtp_tcp" >> "$GITHUB_OUTPUT"

      - name: Zapsat bezpečný diagnostický výsledek
        uses: actions/github-script@v7
        env:
          JOIN_CODE: ${{ steps.probe.outputs.join_code }}
          SMTP_TCP: ${{ steps.probe.outputs.smtp_tcp }}
        with:
          script: |
            const fs = require('fs');
            const health = fs.readFileSync('/tmp/deployment-health.txt', 'utf8').trim();
            const api = fs.readFileSync('/tmp/api-health.txt', 'utf8').trim();
            const mx = fs.readFileSync('/tmp/mx.txt', 'utf8').trim().split(/\r?\n/).filter(Boolean);
            const sourceMatch = health.match(/^source=(.+)$/m);
            const report = {
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              live_deployment_source: sourceMatch ? sourceMatch[1].trim() : null,
              deployment_health_reachable: health.length > 0,
              newsletter_api_health: api || null,
              join_page_http_status: Number(process.env.JOIN_CODE || 0),
              smtp_seznam_port_465_reachable: process.env.SMTP_TCP === 'true',
              mx_records: mx
            };
            const path = 'live-newsletter-probe.json';
            const content = Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: 'Zapsat diagnostiku živého newsletteru',
              content,
              ...(sha ? {sha} : {})
            });
