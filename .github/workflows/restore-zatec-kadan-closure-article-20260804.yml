name: Vrátit článek o uzavírkách Žatec–Kadaň
# trigger-version: 2026-08-04-0809

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-zatec-kadan-closure-article-20260804.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARTICLE: clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html
      URL: https://nasekadan.cz/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html
      SLUG: silnice-zatec-kadan-prejezd-uzavirka-srpen-2026
      EXPECTED_H1: 'Dva přejezdy, dva termíny: silnice Žatec–Kadaň se zavře už 4. srpna'
      KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Zkontrolovat aktuální zdroj
        run: |
          set -euo pipefail
          grep -Fq "<h1>${EXPECTED_H1}</h1>" "$ARTICLE"
          grep -Fq "/clanky/${SLUG}.html" index.html clanky/index.html doprava/index.html
          grep -Fq '/clanky/cisarsky-den-kadan-historie-2026.html' index.html clanky/index.html
          grep -Fq "$URL" rss.xml sitemap.xml news-sitemap.xml

      - name: Nasadit aktuální soubory na OVH
        run: |
          set -euo pipefail
          key="${KEY_A:-${KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          b="$RUNNER_TEMP/bundle"
          mkdir -p "$b/clanky" "$b/doprava" "$b/social" "$b/data"
          cp "$ARTICLE" "$b/clanky/"
          cp clanky/index.html "$b/clanky/index.html"
          cp doprava/index.html "$b/doprava/index.html"
          cp social/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026-ce0241987f.png "$b/social/"
          cp data/published-content-index.json "$b/data/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt "$b/"
          printf 'status=ok\nsource=%s\narticle=%s\n' "$(git rev-parse HEAD)" "$URL" > "$b/deployment-health.txt"
          scp -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$b" ubuntu@57.129.43.215:/tmp/zatec-restore
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          s=/tmp/zatec-restore
          r=/var/www/nasekadan
          sudo install -d -m 0755 "$r/clanky" "$r/doprava" "$r/social" "$r/data"
          sudo install -m 0644 "$s/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html" "$r/clanky/"
          sudo install -m 0644 "$s/clanky/index.html" "$r/clanky/index.html"
          sudo install -m 0644 "$s/doprava/index.html" "$r/doprava/index.html"
          sudo install -m 0644 "$s/social/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026-ce0241987f.png" "$r/social/"
          sudo install -m 0644 "$s/data/published-content-index.json" "$r/data/"
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo install -m 0644 "$s/$f" "$r/$f"; done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/doprava /usr/share/nginx/html/social /usr/share/nginx/html/data
            sudo docker cp "$s/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html" nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$s/clanky/index.html" nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker cp "$s/doprava/index.html" nasekadan-web:/usr/share/nginx/html/doprava/index.html
            sudo docker cp "$s/social/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026-ce0241987f.png" nasekadan-web:/usr/share/nginx/html/social/
            sudo docker cp "$s/data/published-content-index.json" nasekadan-web:/usr/share/nginx/html/data/
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo docker cp "$s/$f" "nasekadan-web:/usr/share/nginx/html/$f"; done
          fi
          rm -rf "$s"
          REMOTE

      - name: Ověřit živý web bez cache
        run: |
          set -euo pipefail
          ok=false
          for n in $(seq 1 20); do
            q="${GITHUB_RUN_ID}-$(date +%s)-$n"
            a="$(curl -4 -kfsSL --max-time 35 "$URL?v=$q" 2>/dev/null || true)"
            h="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/?v=$q" 2>/dev/null || true)"
            c="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/clanky/?v=$q" 2>/dev/null || true)"
            d="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/doprava/?v=$q" 2>/dev/null || true)"
            if grep -Fq "<h1>${EXPECTED_H1}</h1>" <<<"$a" && grep -Fq "/clanky/${SLUG}.html" <<<"$h" && grep -Fq '/clanky/cisarsky-den-kadan-historie-2026.html' <<<"$h" && grep -Fq "/clanky/${SLUG}.html" <<<"$c" && grep -Fq "/clanky/${SLUG}.html" <<<"$d"; then ok=true; break; fi
            sleep 6
          done
          test "$ok" = true

      - name: Zapsat potvrzení
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,path='.github/zatec-kadan-live-restored-status.json';
            const body={status:'success',checked_at:new Date().toISOString(),run_id:String(context.runId),article:'https://nasekadan.cz/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html',homepage:true,archive:true,traffic_page:true,cisarsky_article_preserved:true};
            let sha;try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',sha,message:'Potvrdit obnovení dopravního článku [skip ci]',content:Buffer.from(JSON.stringify(body,null,2)+'\n').toString('base64')});
