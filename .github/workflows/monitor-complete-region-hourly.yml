# Recovery trigger 2026-08-06T22:58Z: stav monitoringu byl starší než sedm hodin.
name: Kompletní hodinový monitoring Kadaně a širokého regionu

on:
  workflow_dispatch:
  schedule:
    - cron: '8 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/run_complete_regional_monitor.py'
      - 'scripts/monitor_all_kadansko.py'
      - 'scripts/monitor_national_kadan.py'
      - 'scripts/update_city_news.py'
      - 'data/regional-sources.json'
      - 'data/kadansko-extra-sources.json'
      - 'data/city-sources.json'
      - 'data/organizations.json'
      - '.github/workflows/monitor-complete-region-hourly.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: complete-region-hourly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Načíst aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit monitorovací programy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/update_city_news.py \
            scripts/monitor_national_kadan.py \
            scripts/monitor_all_kadansko.py \
            scripts/run_complete_regional_monitor.py \
            scripts/upsert_github_issue.py

      - name: Spustit kompletní regionální monitoring s opakováním
        id: monitor
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/complete-region-alerts.json"
          success=0
          for attempt in 1 2 3; do
            echo "Kompletní průchod – pokus ${attempt}/3"
            if python3 scripts/run_complete_regional_monitor.py \
              --state data/all-kadansko-monitoring-state.json \
              --status data/all-kadansko-monitoring-status.json \
              --output "$output"; then
              success=1
              break
            fi
            sleep $((attempt * 25))
          done
          test "$success" -eq 1
          test -s "$output"
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Nezávisle ověřit rozsah a čerstvost
        shell: bash
        env:
          OUTPUT: ${{ steps.monitor.outputs.output }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status=json.loads(Path('data/all-kadansko-monitoring-status.json').read_text(encoding='utf-8'))
          output=json.loads(Path(os.environ['OUTPUT']).read_text(encoding='utf-8'))
          coverage=status.get('coverage') or {}
          checked=datetime.fromisoformat(str(status.get('checkedAt') or '').replace('Z','+00:00'))
          if checked.tzinfo is None:
              checked=checked.replace(tzinfo=timezone.utc)
          age=(datetime.now(timezone.utc)-checked.astimezone(timezone.utc)).total_seconds()/60
          source_count=int(status.get('sourceCount') or 0)
          checked_sources=int(status.get('checkedSources') or 0)
          if age>15:
              raise SystemExit(f'Stav je už při dokončení starý {age:.1f} minuty.')
          if source_count<140:
              raise SystemExit(f'V registru je jen {source_count} zdrojů.')
          if checked_sources<max(75,int(source_count*0.65)):
              raise SystemExit(f'Dostupných bylo jen {checked_sources}/{source_count} zdrojů.')
          if int(coverage.get('regionalMunicipalities') or 0)<57:
              raise SystemExit('Nejsou potvrzeny všechny obce a města širokého registru.')
          if not coverage.get('regionalRegistryComplete'):
              raise SystemExit('Regionální registr není označen jako úplný.')
          if output.get('status',{}).get('checkedAt')!=status.get('checkedAt'):
              raise SystemExit('Výstup upozornění a stavový soubor si neodpovídají.')
          print(f'Ověřeno: {checked_sources}/{source_count} zdrojů, '
                f'{coverage.get("regionalMunicipalities")} obcí a měst, '
                f'{coverage.get("regionalNamedInstitutions")} institucí.')
          PY

      - name: Založit redakční upozornění pro skutečně nové nálezy
        shell: bash
        env:
          OUTPUT: ${{ steps.monitor.outputs.output }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          payload=json.loads(Path(os.environ['OUTPUT']).read_text(encoding='utf-8'))
          alerts=payload.get('alerts') or []
          for alert in alerts:
              fingerprint=str(alert.get('fingerprint') or '').strip()
              if not fingerprint:
                  continue
              title=str(alert.get('title') or 'Nový regionální nález').strip()
              issue_title=f'[MONITORING REGION] {title[:150]} [{fingerprint}]'
              description=str(alert.get('description') or '').strip()
              local=', '.join(alert.get('localMatches') or []) or 'přímý regionální zdroj'
              body=[
                  '## Nový nález z kompletního hodinového monitoringu',
                  '',
                  f'**Zdroj:** {alert.get("sourceName") or "neuvedeno"}',
                  f'**Oblast:** {alert.get("category") or "neuvedeno"}',
                  f'**Závažnost:** {alert.get("severity") or "medium"}',
                  f'**Místní vazba:** {local}',
                  f'**Publikováno zdrojem:** {alert.get("published") or "neuvedeno"}',
                  '',
                  f'### {title}',
                  '',
                  description or '_Zdroj neposkytl použitelný popis._',
                  '',
                  '### Primární nebo přímý zdroj',
                  f'- {alert.get("url") or alert.get("sourceUrl") or "neuvedeno"}',
                  '',
                  '### Redakční postup',
                  'Otevřít zdroj, ověřit datum a místní dopad, porovnat s již publikovanými články '
                  'a rozhodnout o nové zprávě, aktualizaci nebo uložení jako podkladu.',
                  '',
                  '_Nález prošel deduplikací, kontrolou čerstvosti a filtrem redakční významnosti._',
              ]
              with tempfile.NamedTemporaryFile('w',encoding='utf-8',delete=False,suffix='.md') as handle:
                  handle.write('\n'.join(body)+'\n')
                  body_path=handle.name
              try:
                  subprocess.run([
                      'python3','scripts/upsert_github_issue.py',
                      '--fingerprint',fingerprint,
                      '--title',issue_title,
                      '--body-file',body_path,
                      '--assignee','petrkotab666',
                  ],check=True)
              finally:
                  Path(body_path).unlink(missing_ok=True)
          print(f'Zpracováno nových upozornění: {len(alerts)}')
          PY

      - name: Atomicky uložit stav a deduplikační paměť
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/all-kadansko-monitoring-state.json \
            data/all-kadansko-monitoring-status.json
          if git diff --cached --quiet; then
            echo 'Monitorovací stav se nezměnil.'
            exit 0
          fi
          git commit -m 'Hodinový kompletní monitoring širokého regionu'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
          done
          exit 1

      - name: Uzavřít incident po úspěšném kompletním průchodu
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/monitor-ok.md" <<EOF
          ## Kompletní monitoring je opět zdravý

          Úspěšně skončil hodinový průchod:
          - run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - kontrola všech zdrojů: dokončena
          - široký registr obcí a institucí: ověřen
          - stav a deduplikační paměť: uloženy do hlavní větve
          EOF
          python3 scripts/upsert_github_issue.py \
            --fingerprint complete-region-monitor-failed \
            --title '[MONITORING REGION] Kompletní monitoring selhal [complete-region-monitor-failed]' \
            --body-file "$RUNNER_TEMP/monitor-ok.md" \
            --close --comment-existing

      - name: Zapsat incident při selhání
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/monitor-failed.md" <<EOF
          ## Kompletní hodinový monitoring selhal

          - run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - pokus workflow: ${GITHUB_RUN_ATTEMPT}
          - čas UTC: $(date -u +%FT%TZ)

          Automatická záchrana workflow se pokusí selhaný běh zopakovat. Nezávislý watchdog zároveň kontroluje čerstvost stavu několikrát za hodinu.
          EOF
          python3 scripts/upsert_github_issue.py \
            --fingerprint complete-region-monitor-failed \
            --title '[MONITORING REGION] Kompletní monitoring selhal [complete-region-monitor-failed]' \
            --body-file "$RUNNER_TEMP/monitor-failed.md" \
            --assignee petrkotab666 \
            --comment-existing
