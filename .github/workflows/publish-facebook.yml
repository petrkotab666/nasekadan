name: Publikovat nový článek na Facebook

on:
  push:
    branches: [main]
    paths:
      - "clanky/*.html"
      - ".github/facebook-publish-trigger.txt"
      - ".github/facebook-publisher-config.json"
      - "scripts/remove_unpublished_articles.py"
      - "scripts/publish_avies_article.py"
      - "scripts/publish_facebook.py"
      - "scripts/process_facebook_queue.py"
      - "scripts/process_facebook_queue_live.py"
      - ".github/workflows/publish-facebook.yml"
  workflow_dispatch:
    inputs:
      article_path:
        description: "Cesta k článku, například clanky/petice-nemocnice-kadan.html"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: nasekadan-facebook
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Najít články určené ke zveřejnění
        id: articles
        shell: bash
        run: |
          set -euo pipefail
          declare -a candidates=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            article="${{ inputs.article_path }}"
            if [[ -n "$article" ]]; then
              candidates+=("$article")
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" =~ ^0+$ ]]; then
              before="${after}^"
            fi
            while IFS= read -r article; do
              [[ -n "$article" ]] && candidates+=("$article")
            done < <(git diff --diff-filter=AM --name-only "$before" "$after" -- 'clanky/*.html')

            if [[ -f .github/facebook-publish-trigger.txt ]]; then
              while IFS= read -r article; do
                [[ -n "$article" ]] && candidates+=("$article")
              done < .github/facebook-publish-trigger.txt
            fi
          fi

          {
            echo 'paths<<EOF'
            printf '%s\n' "${candidates[@]:-}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Vyřadit neschválené texty a připravit produkční metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/remove_unpublished_articles.py
          python3 scripts/publish_avies_article.py
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py

      - name: Ověřit přihlášení, počkat na živý web a zveřejnit frontu
        id: facebook
        continue-on-error: true
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          FACEBOOK_WAIT_TIMEOUT: "1200"
          ARTICLE_PATHS: ${{ steps.articles.outputs.paths }}
        shell: bash
        run: |
          set -euo pipefail
          declare -a args=()
          while IFS= read -r article; do
            [[ -n "$article" ]] && args+=("$article")
          done <<< "$ARTICLE_PATHS"
          python3 scripts/process_facebook_queue_live.py "${args[@]}"

      - name: Uložit frontu a záznam zveřejnění
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň Facebook automat'
          git config user.email 'info@nasekadan.cz'

          [[ -f .github/facebook-publish-pending.txt ]] && git add -A -- .github/facebook-publish-pending.txt
          [[ -f .github/facebook-last-status.json ]] && git add -A -- .github/facebook-last-status.json
          [[ -d .github/facebook-published ]] && git add -A -- .github/facebook-published

          if git diff --cached --quiet; then
            echo 'Stav Facebook fronty je beze změny.'
            exit 0
          fi

          git commit -m 'Aktualizovat stav publikování na Facebook'

          # Příprava sociálních obrázků a metadat mění pracovní kopii, ale tyto
          # produkční změny se v tomto workflow neukládají. Po vytvoření commitu
          # s evidencí zveřejnění je bezpečně zahodíme, aby mohl proběhnout rebase.
          git reset --hard HEAD
          git clean -fd

          git pull --rebase origin main
          git push origin main

      - name: Spravovat upozornění na neplatný token
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Facebook automat vyžaduje obnovení přihlášení';
            let status = {};
            try {
              status = JSON.parse(fs.readFileSync('.github/facebook-last-status.json', 'utf8'));
            } catch {}
            const results = Array.isArray(status.results) ? status.results : [];
            const authFailure = results.some(item =>
              item.state === 'action_required' ||
              String(item.error || '').toLowerCase().includes('access token')
            );
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (authFailure && !existing) {
              const waiting = results.map(item => `- \`${item.article_path || 'neuvedený článek'}\``).join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  'Facebook odmítl uložený Page Access Token.',
                  '',
                  'Na počítači spusťte `tools/nastavit-facebook.ps1`. Skript vytvoří dlouhodobý Page Access Token, uloží ho do GitHub Secrets a nabídne okamžité zpracování fronty.',
                  '',
                  'Čekající články:',
                  waiting || '- žádné'
                ].join('\n')
              });
            }
            if (!authFailure && existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

      - name: Potvrdit úspěšné dokončení
        if: steps.facebook.outcome != 'success'
        shell: bash
        run: |
          echo 'Publikování na Facebook se nezdařilo. Články zůstávají ve frontě a automat je zkusí znovu po obnovení tokenu nebo při dalším hodinovém běhu.' >&2
          exit 1
