name: Publikovat nový článek na Facebook

on:
  push:
    branches: [main]
    paths:
      - "clanky/*.html"
      - ".github/facebook-publish-trigger.txt"
  workflow_dispatch:
    inputs:
      article_path:
        description: "Cesta k článku, například clanky/petice-nemocnice-kadan.html"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: nasekadan-facebook
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Najít články určené ke zveřejnění
        id: articles
        shell: bash
        run: |
          set -euo pipefail
          declare -a candidates=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            article="${{ inputs.article_path }}"
            if [[ -n "$article" ]]; then
              candidates+=("$article")
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" =~ ^0+$ ]]; then
              before="${after}^"
            fi
            while IFS= read -r article; do
              [[ -n "$article" ]] && candidates+=("$article")
            done < <(git diff --diff-filter=AM --name-only "$before" "$after" -- 'clanky/*.html')

            if [[ -f .github/facebook-publish-trigger.txt ]]; then
              while IFS= read -r article; do
                [[ -n "$article" ]] && candidates+=("$article")
              done < .github/facebook-publish-trigger.txt
            fi
          fi

          {
            echo 'paths<<EOF'
            printf '%s\n' "${candidates[@]:-}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Počkat na správný OG obrázek a zveřejnit frontu
        id: facebook
        continue-on-error: true
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          FACEBOOK_WAIT_TIMEOUT: "3600"
          ARTICLE_PATHS: ${{ steps.articles.outputs.paths }}
        shell: bash
        run: |
          set -euo pipefail
          declare -a args=()
          while IFS= read -r article; do
            [[ -n "$article" ]] && args+=("$article")
          done <<< "$ARTICLE_PATHS"
          python3 scripts/process_facebook_queue.py "${args[@]}"

      - name: Uložit frontu a záznam zveřejnění
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň Facebook automat'
          git config user.email 'info@nasekadan.cz'

          [[ -f .github/facebook-publish-pending.txt ]] && git add -A -- .github/facebook-publish-pending.txt
          [[ -f .github/facebook-last-status.json ]] && git add -A -- .github/facebook-last-status.json
          [[ -d .github/facebook-published ]] && git add -A -- .github/facebook-published

          if git diff --cached --quiet; then
            echo 'Stav Facebook fronty je beze změny.'
            exit 0
          fi

          git commit -m 'Aktualizovat stav publikování na Facebook'
          git pull --rebase origin main
          git push origin main

      - name: Potvrdit úspěšné dokončení
        if: steps.facebook.outcome != 'success'
        shell: bash
        run: |
          echo 'Publikování na Facebook se nezdařilo. Článek zůstává ve frontě pro hodinový automatický opakovaný pokus.' >&2
          exit 1
