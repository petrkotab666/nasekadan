name: Publikovat nový článek na Facebook

on:
  push:
    branches: [main]
    paths:
      - "clanky/*.html"
  workflow_dispatch:
    inputs:
      article_path:
        description: "Cesta k článku, například clanky/petice-nemocnice-kadan.html"
        required: true
        type: string

concurrency:
  group: nasekadan-facebook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Stáhnout zdrojový kód
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Najít nově přidané články
        id: articles
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            article="${{ inputs.article_path }}"
            [[ -f "$article" ]] || { echo "Článek neexistuje: $article" >&2; exit 1; }
            printf 'paths<<EOF\n%s\nEOF\n' "$article" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ "$before" =~ ^0+$ ]]; then
            before="${after}^"
          fi
          mapfile -t added < <(git diff --diff-filter=A --name-only "$before" "$after" -- 'clanky/*.html')
          if [[ ${#added[@]} -eq 0 ]]; then
            echo "Nebyl přidán nový článek; upravené články se znovu nesdílejí."
            echo "paths=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'paths<<EOF'
            printf '%s\n' "${added[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Ověřit konfiguraci Facebook stránek
        if: steps.articles.outputs.paths != ''
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$FACEBOOK_PAGES_JSON" ]]; then
            [[ -n "$FACEBOOK_PAGE_ID" ]] || { echo "Chybí secret FACEBOOK_PAGES_JSON nebo FACEBOOK_PAGE_ID" >&2; exit 1; }
            [[ -n "$FACEBOOK_PAGE_ACCESS_TOKEN" ]] || { echo "Chybí secret FACEBOOK_PAGES_JSON nebo FACEBOOK_PAGE_ACCESS_TOKEN" >&2; exit 1; }
          fi
          echo "Cílový klíč stránky: ${FACEBOOK_PAGE_KEY:-nasekadan}"

      - name: Počkat na nasazení a zveřejnit příspěvek
        if: steps.articles.outputs.paths != ''
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          ARTICLE_PATHS: ${{ steps.articles.outputs.paths }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths <<< "$ARTICLE_PATHS"
          python3 scripts/publish_facebook.py "${paths[@]}"
