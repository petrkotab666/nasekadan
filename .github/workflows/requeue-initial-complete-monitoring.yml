name: Jednorázově obnovit upozornění prvního širokého běhu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/requeue-initial-complete-monitoring.yml'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: one-time-complete-monitor-requeue
  cancel-in-progress: false

jobs:
  requeue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Načíst hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vrátit do fronty kandidáty prvního širokého průchodu
        id: purge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path=Path('data/all-kadansko-monitoring-state.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          seen=data.get('seen') if isinstance(data.get('seen'),dict) else {}
          start=datetime.fromisoformat('2026-08-04T19:45:00+00:00')
          end=datetime.fromisoformat('2026-08-04T19:46:30+00:00')
          removed=[]
          kept={}
          for fingerprint,item in seen.items():
              raw=str((item or {}).get('firstSeen') or '')
              try:
                  stamp=datetime.fromisoformat(raw.replace('Z','+00:00'))
                  if stamp.tzinfo is None:
                      stamp=stamp.replace(tzinfo=timezone.utc)
              except ValueError:
                  stamp=None
              if stamp is not None and start <= stamp.astimezone(timezone.utc) <= end:
                  removed.append(fingerprint)
              else:
                  kept[fingerprint]=item
          data['seen']=kept
          data['version']=3
          data['requeueRecovery']={
              'performedAt':datetime.now(timezone.utc).isoformat(),
              'windowStart':start.isoformat(),
              'windowEnd':end.isoformat(),
              'removedFingerprints':len(removed),
              'reason':'Obnovit kandidáty označené jako přečtené před opravou limitu upozornění.',
          }
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(data['requeueRecovery'],ensure_ascii=False))
          PY

      - name: Uložit opravenou frontu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/all-kadansko-monitoring-state.json
          if git diff --cached --quiet; then
            echo 'Fronta už byla obnovena.'
          else
            git commit -m 'Vrátit do fronty nálezy prvního širokého monitoringu'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 4))
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi

      - name: Spustit znovu kompletní monitoring
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            --retry 5 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/monitor-complete-region-hourly.yml/dispatches" \
            -d '{"ref":"main"}'
