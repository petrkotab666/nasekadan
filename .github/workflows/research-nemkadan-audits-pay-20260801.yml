name: Audity a odměňování Nemocnice Kadaň

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-nemkadan-audits-pay-20260801.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Instalovat nástroje
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ces
          python3 -m pip install --quiet requests beautifulsoup4 lxml
      - name: Stáhnout a vytěžit veřejné dokumenty
        shell: bash
        run: |
          set -euo pipefail
          rm -rf result && mkdir -p result/{files,text,metadata,ocr}
          cat > /tmp/research.py <<'PY'
          from __future__ import annotations
          import concurrent.futures, hashlib, json, re, subprocess, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('result')
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 (compatible; NaseKadan public document research; +https://nasekadan.cz/)','Accept-Language':'cs,en;q=0.7'})
          TERMS=[
            'hossner','krušina','krusina','270 000','270.000','140 000','140.000',
            'odměn členům orgán','odmen clenům organ','odměny vedení','odmeny vedeni',
            'spřízněn','spriznen','klíčovému vedení','klicovemu vedeni','osobní náklady','osobni naklady',
            'mzdových výdaj','mzdovych vydaj','pracovní smlouv','pracovni smlouv','dodatek č. 1','dodatek c. 1',
            'pobídková','pobidkova','mimořádná odměna','mimoradna odmena',
            'zpráva auditora','zprava auditora','výrok auditora','vyrok auditora','výbor pro audit','vybor pro audit',
            'vnitřní kontrol','vnitrni kontrol','nedostatek','nesprávnost','nespravnost','management letter',
            'právní předpis','pravni predpis','soulad se zákon','péče řádného hospodáře','pece radneho hospodare',
            '25 979 821','25979821','33 501 347','19 381 575','46 124 046','7 602 533'
          ]
          errors=[]; docs=[]; findings=[]

          def get(url, timeout=120, tries=5):
              last=None
              for i in range(tries):
                  try:
                      r=S.get(url,timeout=timeout,allow_redirects=True)
                      if r.status_code in (429,500,502,503,504): raise RuntimeError(f'HTTP {r.status_code}')
                      r.raise_for_status(); return r
                  except Exception as e:
                      last=e; time.sleep(1+i*2)
              raise last

          def safe(s):
              return re.sub(r'[^A-Za-z0-9._-]+','_',urllib.parse.unquote(s or ''))[:180] or 'document.pdf'

          # Discover all relevant annual reports and all 106 responses.
          seeds=[
            ('annual','https://www.nemkadan.cz/pro-verejnost/o-nas/vyrocni-zpravy/?page=all'),
            ('info106','https://www.nemkadan.cz/pro-verejnost/o-nas/pravidla-pro-podani-zadosti-o-informace-dle-zakona-c-106-1999-sb-2/')
          ]
          urls=[]
          for typ,url in seeds:
              try:
                  r=get(url); soup=BeautifulSoup(r.text,'lxml')
                  (OUT/'metadata'/f'{typ}.html').write_bytes(r.content)
                  for a in soup.find_all('a',href=True):
                      full=urllib.parse.urljoin(r.url,a['href'])
                      text=' '.join(a.get_text(' ',strip=True).split())
                      if typ=='annual':
                          # Keep all annual/accounting/auditor PDFs from 2016 onward.
                          context=(text+' '+full).lower()
                          if ('download.php' in full or '.pdf' in full.lower()) and any(str(y) in context for y in range(2016,2026)):
                              urls.append({'category':typ,'label':text,'url':full})
                      else:
                          if ('e_download.php' in full or '.pdf' in full.lower()) and ('2025' in (text+full) or '2026' in (text+full)):
                              urls.append({'category':typ,'label':text,'url':full})
              except Exception as e: errors.append({'stage':'discover','url':url,'error':repr(e)})

          # Deduplicate URLs.
          uniq=[]; seen=set()
          for x in urls:
              if x['url'] in seen: continue
              seen.add(x['url']); uniq.append(x)
          urls=uniq
          (OUT/'metadata'/'discovered.json').write_text(json.dumps(urls,ensure_ascii=False,indent=2),encoding='utf-8')
          print('DISCOVERED',len(urls))

          def download_one(item):
              try:
                  r=get(item['url'],timeout=180)
                  data=r.content
                  if not data.startswith(b'%PDF'):
                      return {**item,'error':'not PDF','content_type':r.headers.get('content-type'),'bytes':len(data)}
                  sha=hashlib.sha256(data).hexdigest()
                  basename=Path(urllib.parse.urlparse(r.url).path).name
                  # e_download and download.php lack useful names; use category, label and hash.
                  label=safe(item.get('label') or '')
                  name=f"{item['category']}-{label}-{sha[:10]}.pdf"
                  p=OUT/'files'/name; p.write_bytes(data)
                  return {**item,'final_url':r.url,'file':str(p),'bytes':len(data),'sha256':sha}
              except Exception as e: return {**item,'error':repr(e)}

          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              downloaded=list(ex.map(download_one,urls))
          (OUT/'metadata'/'downloads.json').write_text(json.dumps(downloaded,ensure_ascii=False,indent=2),encoding='utf-8')

          def extract(rec):
              if 'file' not in rec: return rec
              p=Path(rec['file']); text=''; method='pdftotext'; pages=0
              try:
                  info=subprocess.run(['pdfinfo',str(p)],capture_output=True,text=True,timeout=60).stdout
                  m=re.search(r'Pages:\s+(\d+)',info); pages=int(m.group(1)) if m else 0
                  q=subprocess.run(['pdftotext','-layout',str(p),'-'],capture_output=True,text=True,timeout=240)
                  text=q.stdout or ''
                  # Full OCR for short info responses; for annual reports OCR only when embedded text is too poor.
                  compact=len(re.sub(r'\s+','',text))
                  need_ocr=(rec['category']=='info106' and compact<1500) or (rec['category']=='annual' and compact<2500)
                  if need_ocr:
                      d=OUT/'ocr'/p.stem; d.mkdir(exist_ok=True)
                      n=min(pages or 1,180)
                      subprocess.run(['pdftoppm','-f','1','-l',str(n),'-r','135','-jpeg','-jpegopt','quality=70',str(p),str(d/'p')],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=600)
                      imgs=sorted(d.glob('p-*.jpg'))
                      def ocr_img(img):
                          try:
                              z=subprocess.run(['tesseract',str(img),'stdout','-l','ces+eng','--psm','6'],capture_output=True,text=True,timeout=120)
                              return z.stdout
                          except Exception: return ''
                      with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
                          parts=list(ex.map(ocr_img,imgs))
                      ocr='\n\n'.join(parts)
                      if len(ocr)>len(text): text=ocr; method='ocr'
                  tp=OUT/'text'/(p.name+'.txt'); tp.write_text(text,encoding='utf-8',errors='replace')
                  low=text.lower(); found=[t for t in TERMS if t.lower() in low]
                  snippets=[]
                  for t in found:
                      i=low.find(t.lower())
                      snippets.append({'term':t,'snippet':re.sub(r'\s+',' ',text[max(0,i-700):i+1800]).strip()})
                  return {**rec,'pages':pages,'text_file':str(tp),'chars':len(text),'method':method,'terms':found,'snippets':snippets}
              except Exception as e: return {**rec,'pages':pages,'error_extract':repr(e)}

          # Parallel extraction at document level but limit to 2 to avoid resource exhaustion.
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:
              extracted=list(ex.map(extract,downloaded))
          (OUT/'metadata'/'extracted.json').write_text(json.dumps(extracted,ensure_ascii=False,indent=2),encoding='utf-8')

          for x in extracted:
              if x.get('terms'): findings.append(x)
          (OUT/'metadata'/'findings.json').write_text(json.dumps(findings,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'metadata'/'errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2),encoding='utf-8')

          lines=['# Audity a odměňování Nemocnice Kadaň','',f'- Nalezené odkazy: {len(urls)}',f'- Stažené PDF: {sum(1 for x in downloaded if x.get("file"))}',f'- Dokumenty se shodou: {len(findings)}','']
          for x in findings:
              lines += [f"## {x.get('label') or Path(x['file']).name}",f"- Kategorie: {x['category']}",f"- Stran: {x.get('pages')}",f"- Metoda: {x.get('method')}",f"- Shody: {', '.join(x.get('terms',[]))}",f"- URL: {x.get('url')}",'']
              for s in x.get('snippets',[])[:14]:
                  lines += [f"**{s['term']}**",s['snippet'],'']
          (OUT/'README.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:30]))
          PY
          python3 /tmp/research.py
      - uses: actions/upload-artifact@v4
        with:
          name: nemkadan-audits-pay
          path: result
          retention-days: 2
