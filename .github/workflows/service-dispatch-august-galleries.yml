name: Servisní spuštění nasazení srpnových galerií

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '/deploy-august-galleries')
    runs-on: ubuntu-latest
    steps:
      - name: Spustit ostré publikační workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-august-galleries-direct.yml',
              ref: 'main'
            });
            core.notice('Ostré nasazení srpnového programu galerií bylo spuštěno.');
