name: Nezávislá pojistka publikace článku o klášteře

on:
  schedule:
    - cron: '30 2 3 8 *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-alzbetinsky-klaster-20260803-watchdog
  cancel-in-progress: false

env:
  ARTICLE_URL: https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Povolit pouze 3. srpna 2026
        shell: bash
        run: |
          test "$(date -u +%Y-%m-%d)" = "2026-08-03" || exit 0

      - name: Nezávisle zkontrolovat všechny veřejné plochy
        id: before
        shell: bash
        run: |
          set +e
          article="$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${ARTICLE_URL}?watchdog=${GITHUB_RUN_ID}" 2>/dev/null)"
          home="$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://nasekadan.cz/?watchdog=${GITHUB_RUN_ID}" 2>/dev/null)"
          archive="$(curl -fsSL --max-time 25 "https://nasekadan.cz/clanky/?watchdog=${GITHUB_RUN_ID}" 2>/dev/null)"
          rss="$(curl -fsSL --max-time 25 "https://nasekadan.cz/rss.xml?watchdog=${GITHUB_RUN_ID}" 2>/dev/null)"
          if grep -Fq 'Kam odešli poslední pacienti?' <<<"$article" &&
             grep -Fq 'data-poll-id="alzbetinsky-klaster-kadan-2026"' <<<"$article" &&
             grep -Fq 'data-latest-article-href="/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html"' <<<"$home" &&
             grep -Fq '/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html' <<<"$archive" &&
             grep -Fq 'https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html' <<<"$rss"; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Stáhnout hlavní větev
        if: steps.before.outputs.present != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Znovu sestavit a uložit publikaci
        if: steps.before.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 scripts/publish_alzbetinsky_klaster_20260803.py
          git config user.name 'Naše Kadaň – watchdog kláštera'
          git config user.email 'info@nasekadan.cz'
          git add clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html social/alzbetinsky-klaster-kadan-pacienti-20260803.png index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml
          git commit -m 'Obnovit chybějící publikaci kláštera [skip ci]' || true
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            [[ "$attempt" == 5 ]] && exit 1
            sleep $((attempt * 5))
          done
          git fetch origin main
          git reset --hard origin/main

      - name: Připravit SSH klíč
        if: steps.before.outputs.present != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"; break; fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nouzově nasadit přímo na server
        if: steps.before.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/alzbetinsky-watchdog.tar.gz" \
            clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html social/alzbetinsky-klaster-kadan-pacienti-20260803.png \
            index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml \
            site.js style.css footer.css mobile.css reklamy.js reklamy-sidebar.js reklamy-sidebar.css \
            reklamy-oprava-obrazku.js obsah-doplnky.js ad-spacing-guard.js analytics.js
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/alzbetinsky-watchdog.tar.gz" ubuntu@57.129.43.215:/tmp/alzbetinsky-watchdog.tar.gz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo tar -xzf /tmp/alzbetinsky-watchdog.tar.gz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/alzbetinsky-watchdog.tar.gz nasekadan-web:/tmp/alzbetinsky-watchdog.tar.gz
            sudo docker exec nasekadan-web tar -xzf /tmp/alzbetinsky-watchdog.tar.gz -C /usr/share/nginx/html
            sudo docker exec nasekadan-web rm -f /tmp/alzbetinsky-watchdog.tar.gz
          fi
          rm -f /tmp/alzbetinsky-watchdog.tar.gz
          REMOTE

      - name: Konečná kontrola po opravě
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            article="$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${ARTICLE_URL}?final=${GITHUB_RUN_ID}-${attempt}" || true)"
            home="$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://nasekadan.cz/?final=${GITHUB_RUN_ID}-${attempt}" || true)"
            archive="$(curl -fsSL --max-time 25 "https://nasekadan.cz/clanky/?final=${GITHUB_RUN_ID}-${attempt}" || true)"
            if grep -Fq 'Kam odešli poslední pacienti?' <<<"$article" &&
               grep -Fq 'data-poll-id="alzbetinsky-klaster-kadan-2026"' <<<"$article" &&
               grep -Fq 'data-promos data-context="sidebar"' <<<"$article" &&
               grep -Fq 'data-latest-article-href="/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html"' <<<"$home" &&
               grep -Fq '/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html' <<<"$archive"; then
              curl -fsSL --max-time 25 "https://nasekadan.cz/api/newsletter/poll/results?poll=alzbetinsky-klaster-kadan-2026" | grep -Fq '"ok": true'
              echo 'ok=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Zapsat výsledek pojistky
        if: always()
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.verify.outputs.ok }}
          WAS_PRESENT: ${{ steps.before.outputs.present }}
        with:
          script: |
            const issue_number = 545;
            const ok = process.env.OK === 'true';
            const body = ok
              ? (process.env.WAS_PRESENT === 'true'
                  ? '✅ Nezávislá pojistka ve 4:30 potvrdila, že článek je veřejný, první na titulní straně a anketa odpovídá.'
                  : '✅ Nezávislá pojistka zjistila neúplnou publikaci, znovu ji sestavila, nasadila a veřejně ověřila.')
              : '🚨 Nezávislá pojistka publikace článku neprošla. Spustí se ještě poslední záchranná kontrola.';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number, body});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number, state: 'closed', state_reason: 'completed'});
