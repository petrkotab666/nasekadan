name: Nasadit a ověřit kulturní přehled 3.–9. srpna

on:
  push:
    branches: [main]
    paths:
      - '.github/weekly-events-direct-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-weekly-events-direct-deploy
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SLUG: kam-v-kadani-a-okoli-3-9-srpna-2026
      EXPECTED_H1: Kam v Kadani a okolí od 3. do 9. srpna: med, móda, dixieland, kino a koupání
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit aktuální main přes OVH SSH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

      - name: Veřejně ověřit článek a všechny publikační plochy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          path="/clanky/${SLUG}.html"
          url="https://nasekadan.cz${path}"
          source_sha="$(git rev-parse HEAD)"
          ok=false
          detail=''
          for attempt in $(seq 1 30); do
            stamp="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            rm -f /tmp/nk-{article,home,archive,rss,sitemap,news,health,og}
            article=false; home=false; archive=false; rss=false; sitemap=false; news=false; health=false; metadata=false; jsonld=false; og=false
            curl -4 -kfsS --max-time 30 "${url}?verify=${stamp}" -o /tmp/nk-article && article=true || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/?verify=${stamp}" -o /tmp/nk-home && home=true || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/clanky/?verify=${stamp}" -o /tmp/nk-archive && archive=true || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/rss.xml?verify=${stamp}" -o /tmp/nk-rss && rss=true || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/sitemap.xml?verify=${stamp}" -o /tmp/nk-sitemap && sitemap=true || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/news-sitemap.xml?verify=${stamp}" -o /tmp/nk-news && news=true || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/deployment-health.txt?verify=${stamp}" -o /tmp/nk-health && health=true || true

            if $article \
              && grep -Fq "<h1>${EXPECTED_H1}</h1>" /tmp/nk-article \
              && grep -Fq '<link rel="canonical" href="https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html">' /tmp/nk-article \
              && grep -Fq 'property="og:image:width" content="1200"' /tmp/nk-article \
              && grep -Fq 'property="og:image:height" content="630"' /tmp/nk-article; then metadata=true; fi
            grep -Fq 'NewsArticle' /tmp/nk-article 2>/dev/null && jsonld=true || true

            og_url="$(sed -n 's/.*property="og:image" content="\([^"]*\)".*/\1/p' /tmp/nk-article 2>/dev/null | head -n1)"
            if [[ -n "$og_url" ]] && curl -4 -kfsS --max-time 30 "${og_url}?verify=${stamp}" -o /tmp/nk-og; then
              if python3 - <<'PY'
import struct
with open('/tmp/nk-og','rb') as f:
    data=f.read(24)
assert data[:8] == b'\x89PNG\r\n\x1a\n'
assert struct.unpack('>II', data[16:24]) == (1200,630)
PY
              then og=true; fi
            fi

            surfaces=true
            for f in /tmp/nk-home /tmp/nk-archive /tmp/nk-rss /tmp/nk-sitemap /tmp/nk-news; do
              [[ -s "$f" ]] && grep -Fq "$path" "$f" || surfaces=false
            done
            source_match=false
            grep -Fq "source=$source_sha" /tmp/nk-health 2>/dev/null && source_match=true || true
            detail="attempt=$attempt article=$article home=$home archive=$archive rss=$rss sitemap=$sitemap news=$news health=$health metadata=$metadata jsonld=$jsonld og=$og surfaces=$surfaces source_match=$source_match source=$source_sha og_url=$og_url"
            echo "$detail"
            if $article && $home && $archive && $rss && $sitemap && $news && $health && $metadata && $jsonld && $og && $surfaces && $source_match; then ok=true; break; fi
            sleep 10
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "source=$source_sha" >> "$GITHUB_OUTPUT"
          echo "og_url=$og_url" >> "$GITHUB_OUTPUT"
          $ok

      - name: Zapsat ověřený výsledek
        if: always()
        shell: bash
        env:
          VERIFY_OK: ${{ steps.verify.outputs.ok }}
          VERIFY_DETAIL: ${{ steps.verify.outputs.detail }}
          VERIFY_SOURCE: ${{ steps.verify.outputs.source }}
          VERIFY_OG: ${{ steps.verify.outputs.og_url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          export VERIFY_OK VERIFY_DETAIL VERIFY_SOURCE VERIFY_OG DEPLOY_OUTCOME
          python3 - <<'PY'
import json, os
from datetime import datetime, timezone
from pathlib import Path
ok=os.environ.get('VERIFY_OK') == 'true'
payload={
  'status':'passed' if ok else 'failed',
  'generatedAt':datetime.now(timezone.utc).isoformat(),
  'source':os.environ.get('VERIFY_SOURCE',''),
  'ogImage':os.environ.get('VERIFY_OG',''),
  'deployOutcome':os.environ.get('DEPLOY_OUTCOME',''),
  'detail':os.environ.get('VERIFY_DETAIL',''),
  'checks':{
    'article':ok,'homepage':ok,'archive':ok,'rss':ok,'sitemap':ok,
    'newsSitemap':ok,'og1200x630':ok,'seoMetadata':ok,
    'canonical':ok,'newsArticleJsonLd':ok,'deploymentHealth':ok
  }
}
Path('.github/weekly-events-direct-deploy-status.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
PY
          git config user.name 'Naše Kadaň živá kontrola'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/weekly-events-direct-deploy-status.json
          git commit -m "Zapsat výsledek kulturního týdne: ${VERIFY_OK:-false} [skip ci]" || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*4))
          done
          exit 1
