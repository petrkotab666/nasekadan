name: Aktualizovat článek o zákazu odběru vody

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/update-surface-water-bans-20260803-trigger.txt'

permissions:
  contents: write
  issues: write

concurrency:
  group: update-surface-water-bans-20260803
  cancel-in-progress: false

env:
  ARTICLE: clanky/zakaz-odberu-povrchovych-vod-kadansko-cervenec-2026.html
  PUBLIC_URL: https://nasekadan.cz/clanky/zakaz-odberu-povrchovych-vod-kadansko-cervenec-2026.html
  EXPECTED_H1: Kvůli suchu platí na Kadaňsku zákaz odběru vody ze čtrnácti toků
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Znovu ověřit oficiální chomutovské opatření
        shell: bash
        run: |
          set -euo pipefail
          official=''
          for attempt in 1 2 3 4 5; do
            official="$(curl -4 -kfsSL --max-time 30 "https://www.jirkov.cz/nabidka-temat/otevrena-radnice/aktuality/zakaz-odberu-povrchovych-vod-7094cs.html?v=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            [[ -n "$official" ]] && break
            sleep $((attempt * 5))
          done
          test -n "$official"
          grep -Fq '30. 6. 2026' <<<"$official"
          grep -Fq 'Prunéřovský potok' <<<"$official"
          grep -Fq '8,700' <<<"$official"
          grep -Fq '16,700' <<<"$official"
          grep -Fq 'zalévání zahrad' <<<"$official"
          if grep -Eqi 'opatření[^<]{0,100}(bylo zrušeno|se zrušuje)|zákaz[^<]{0,100}(byl zrušen|se ruší)' <<<"$official"; then
            echo 'Oficiální zdroj uvádí zrušení opatření; aktualizaci nelze nasadit.' >&2
            exit 1
          fi

      - name: Vytvořit aktualizovanou veřejnou verzi
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/update_surface_water_bans_20260803.py
          python3 scripts/update_surface_water_bans_20260803.py
          test -s "$ARTICLE"
          grep -Fq "<h1>${EXPECTED_H1}</h1>" "$ARTICLE"
          grep -Fq 'WATER-BAN-UPDATE-20260803-START' "$ARTICLE"
          grep -Fq 'Prunéřovský potok, říční km 8,700–16,700' "$ARTICLE"
          grep -Fq 'Dolní část toku v okolí Prunéřova a Kadaně' "$ARTICLE"
          grep -Fq 'Nejde o zákaz vody z kohoutku' "$ARTICLE"
          grep -Fq 'article:modified_time" content="2026-08-03T22:50:00+02:00' "$ARTICLE"
          grep -Fq 'zakaz-odberu-povrchovych-vod-7094cs.html' "$ARTICLE"
          ! grep -Fqi noindex "$ARTICLE"
          grep -Fq "$PUBLIC_URL" rss.xml
          grep -Fq 'Samostatné opatření Chomutova zahrnuje dalších 11 toků' rss.xml
          grep -Fq "$PUBLIC_URL" sitemap.xml
          grep -Fq '<lastmod>2026-08-03</lastmod>' sitemap.xml
          git diff --check

      - name: Uložit aktualizaci do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň aktualizace vody'
          git config user.email 'info@nasekadan.cz'
          for attempt in 1 2 3 4 5; do
            git add -A -- "$ARTICLE" rss.xml sitemap.xml data/published-content-index.json
            if git diff --cached --quiet; then
              echo 'Aktualizace už je v main.'
              break
            fi
            git commit -m 'Aktualizovat: zákaz odběru vody je širší o chomutovské opatření'
            if git push origin HEAD:main; then
              break
            fi
            [[ "$attempt" == 5 ]] && exit 1
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/update_surface_water_bans_20260803.py
            sleep $((attempt * 6))
          done
          git fetch origin main
          git reset --hard origin/main
          echo "PUB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit aktualizovaný článek na OVH
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-water-update"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky"
          cp "$ARTICLE" "$bundle/clanky/"
          cp rss.xml sitemap.xml "$bundle/"
          cat > "$bundle/deployment-health.txt" <<EOF
          status=ok
          source=${PUB_SHA}
          article=${PUBLIC_URL}
          updated_at=2026-08-03T22:50:00+02:00
          deployer=surface-water-ban-update
          workflow_run=${GITHUB_RUN_ID}
          EOF
          uploaded=false
          for attempt in 1 2 3 4; do
            if scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-water-update; then
              uploaded=true
              break
            fi
            sleep $((attempt * 8))
          done
          $uploaded || exit 1
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/nk-water-update
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 "$src/clanky/zakaz-odberu-povrchovych-vod-kadansko-cervenec-2026.html" /var/www/nasekadan/clanky/
          sudo install -m 0644 "$src/rss.xml" /var/www/nasekadan/rss.xml
          sudo install -m 0644 "$src/sitemap.xml" /var/www/nasekadan/sitemap.xml
          sudo install -m 0644 "$src/deployment-health.txt" /var/www/nasekadan/deployment-health.txt
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky
            sudo docker cp "$src/clanky/zakaz-odberu-povrchovych-vod-kadansko-cervenec-2026.html" nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$src/rss.xml" nasekadan-web:/usr/share/nginx/html/rss.xml
            sudo docker cp "$src/sitemap.xml" nasekadan-web:/usr/share/nginx/html/sitemap.xml
            sudo docker cp "$src/deployment-health.txt" nasekadan-web:/usr/share/nginx/html/deployment-health.txt
          fi
          rm -rf "$src"
          REMOTE

      - name: Veřejně ověřit skutečné nasazení
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 36); do
            article="$(curl -4 -kfsS --max-time 25 "${PUBLIC_URL}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?v=${stamp}-${attempt}" 2>/dev/null || true)"
            if grep -Fq "<h1>${EXPECTED_H1}</h1>" <<<"$article" \
              && grep -Fq 'WATER-BAN-UPDATE-20260803-START' <<<"$article" \
              && grep -Fq 'Prunéřovský potok, říční km 8,700–16,700' <<<"$article" \
              && grep -Fq 'Dolní část toku v okolí Prunéřova a Kadaně' <<<"$article" \
              && grep -Fq 'article:modified_time" content="2026-08-03T22:50:00+02:00' <<<"$article" \
              && ! grep -Fqi noindex <<<"$article" \
              && grep -Fq "$PUBLIC_URL" <<<"$rss" \
              && grep -Fq 'Samostatné opatření Chomutova zahrnuje dalších 11 toků' <<<"$rss" \
              && grep -Fq "$PUBLIC_URL" <<<"$sitemap" \
              && grep -Fq '<lastmod>2026-08-03</lastmod>' <<<"$sitemap" \
              && grep -Fq "source=${PUB_SHA}" <<<"$health"; then
              echo 'Aktualizovaný článek je veřejně ověřený.'
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Založit incident při neúspěchu
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Selhala aktualizace článku o zákazu odběru vody'
          body="Aktualizace nebo její veřejné ověření selhaly.\n\nWorkflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nČlánek: ${PUBLIC_URL}\nTrigger commit: ${GITHUB_SHA}"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
