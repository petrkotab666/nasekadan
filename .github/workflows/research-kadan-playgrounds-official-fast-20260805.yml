name: Rychle vytěžit úřední zprávu o kadaňských hřištích

on:
  push:
    branches: [main]
    paths:
      - '.github/research-kadan-playgrounds-official-fast-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-kadan-playgrounds-official-fast-20260805
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nainstalovat nástroje
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ces

      - name: Stáhnout detail úřední desky a vytěžit všechny přílohy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research/kadanska-hriste-official-fast-20260805
          mkdir -p research/kadanska-hriste-official-fast-20260805/attachments /tmp/kadan-hriste-official
          python3 - <<'PY'
          import html, json, re, ssl, subprocess, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          OUT=Path('research/kadanska-hriste-official-fast-20260805')
          TMP=Path('/tmp/kadan-hriste-official')
          URL='https://www.mesto-kadan.cz/redakce/index.php?as4uOriginalDomain=www.mesto-kadan.cz&as4u_protocol=https&clanek=274670&detail_claim=293074&lanG=cs&slozka=219380'
          CTX=ssl._create_unverified_context()
          UA='NaseKadan-official-playground-report/1.0'

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=120,context=CTX) as r:
                  return r.read(), dict(r.headers), r.geturl()

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.text=[]; self.href=None; self.anchor=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='a': self.href=dict(attrs).get('href'); self.anchor=[]
              def handle_endtag(self,tag):
                  if tag.lower()=='a' and self.href:
                      self.links.append((' '.join(self.anchor).strip(),self.href)); self.href=None; self.anchor=[]
              def handle_data(self,data):
                  value=re.sub(r'\s+',' ',html.unescape(data)).strip()
                  if value:
                      self.text.append(value)
                      if self.href is not None: self.anchor.append(value)

          data,headers,final=get(URL)
          (OUT/'page.html').write_bytes(data)
          parser=Parser(); parser.feed(data.decode('utf-8','replace'))
          text='\n'.join(parser.text)
          (OUT/'page.txt').write_text(text,encoding='utf-8')
          links=[]
          candidates=[]
          for label,href in parser.links:
              target=urljoin(final,href)
              row={'label':label,'url':target}
              links.append(row)
              if '/filemanager/files/' in target or re.search(r'\.(pdf|docx?|rtf|odt)(\?|$)',target,re.I):
                  candidates.append(row)
          (OUT/'links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')

          results=[]
          for i,row in enumerate(candidates,1):
              try:
                  blob,hdrs,real=get(row['url'])
                  name=f'attachment-{i:02d}'
                  if blob.startswith(b'%PDF-'):
                      src=TMP/f'{name}.pdf'; src.write_bytes(blob)
                      raw=OUT/'attachments'/f'{name}-pdftotext.txt'
                      subprocess.run(['pdftotext','-layout',str(src),str(raw)],check=False)
                      extracted=raw.read_text(encoding='utf-8',errors='replace') if raw.exists() else ''
                      used_ocr=len(re.sub(r'\s+','',extracted))<300
                      if used_ocr:
                          prefix=TMP/f'{name}-page'
                          subprocess.run(['pdftoppm','-jpeg','-r','220',str(src),str(prefix)],check=False)
                          parts=[]
                          for pageno,img in enumerate(sorted(TMP.glob(f'{name}-page-*.jpg')),1):
                              base=TMP/f'{name}-ocr-{pageno:03d}'
                              subprocess.run(['tesseract',str(img),str(base),'-l','ces+eng','--psm','6'],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                              txt=base.with_suffix('.txt')
                              parts.append(f'\n\n===== STRANA {pageno} / OCR =====\n'+(txt.read_text(encoding='utf-8',errors='replace') if txt.exists() else ''))
                          (OUT/'attachments'/f'{name}-ocr.txt').write_text(extracted+''.join(parts),encoding='utf-8')
                      results.append({**row,'final_url':real,'bytes':len(blob),'content_type':hdrs.get('Content-Type',''),'type':'pdf','used_ocr':used_ocr})
                  else:
                      ext=Path(urlparse(real).path).suffix or '.bin'
                      dest=OUT/'attachments'/f'{name}{ext}'
                      dest.write_bytes(blob)
                      results.append({**row,'final_url':real,'bytes':len(blob),'content_type':hdrs.get('Content-Type',''),'type':'other','saved':str(dest)})
              except Exception as exc:
                  results.append({**row,'error':str(exc)})
          (OUT/'attachments.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'STATUS.json').write_text(json.dumps({'source':URL,'final_url':final,'page_bytes':len(data),'links':len(links),'attachment_candidates':len(candidates),'errors':sum('error' in x for x in results)},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'links':len(links),'attachments':len(candidates),'errors':sum('error' in x for x in results)},ensure_ascii=False))
          PY

      - name: Uložit výsledky
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň dokumentová rešerše'
          git config user.email 'info@nasekadan.cz'
          git add research/kadanska-hriste-official-fast-20260805/
          git commit -m 'Rešerše hřišť: vytěžit oficiální zprávu z úřední desky' || true
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
