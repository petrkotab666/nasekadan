name: Finálně ověřit spisy Hossner v InfoSoudu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-hossner-infosoud-final-20260801.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Vyplnit skutečný formulář a zachytit API
        shell: bash
        run: |
          set -euo pipefail
          OUT=.github/research/hossner-court-2026/infosoud-final
          rm -rf "$OUT"; mkdir -p "$OUT"
          cat > /tmp/final.py <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          O=Path('.github/research/hossner-court-2026/infosoud-final')
          async def query(base,n,hearing=False):
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(locale='cs-CZ',ignore_https_errors=True,user_agent='Mozilla/5.0 Chrome/127')
              page=await c.new_page(); net=[]
              async def capture(r):
                if r.request.resource_type in ('xhr','fetch') or '/api/' in r.url:
                  x={'url':r.url,'status':r.status,'method':r.request.method,'post':r.request.post_data}
                  try: x['body']=(await r.text())[:1000000]
                  except Exception as e: x['error']=repr(e)
                  net.append(x)
              page.on('response',capture)
              rec={'case':f'30 C {n}/2025','kind':'hearing' if hearing else 'case'}
              try:
                await page.goto(base,wait_until='networkidle',timeout=90000)
                await page.wait_for_timeout(1500)
                # Skutečné DOM názvy polí, ověřené z HTML aplikace.
                await page.select_option('select[name="okresniSoud"]',label='Okresní soud Chomutov')
                await page.locator('input[name="znackaSenat"]').fill('30')
                await page.locator('input[name="znackaDruh"]').fill('C')
                await page.locator('input[name="znackaCislo"]').fill(str(n))
                await page.locator('input[name="znackaRok"]').fill('2025')
                await page.screenshot(path=str(O/f'{n}-{rec["kind"]}-before.png'),full_page=True)
                await page.locator('#formSubmitButton').click()
                await page.wait_for_timeout(6000)
                try: await page.wait_for_load_state('networkidle',timeout=30000)
                except: pass
                rec.update({'final_url':page.url,'title':await page.title(),'text':await page.locator('body').inner_text(),'html':await page.content(),'network':net})
                (O/f'{n}-{rec["kind"]}.txt').write_text(rec['text'],encoding='utf-8')
                (O/f'{n}-{rec["kind"]}.html').write_text(rec['html'],encoding='utf-8')
                await page.screenshot(path=str(O/f'{n}-{rec["kind"]}-after.png'),full_page=True)
              except Exception as e:
                rec.update({'error':repr(e),'network':net,'html':await page.content() if page else ''})
              await b.close(); return rec
          async def main():
            rows=[]
            for n in (84,211):
              rows.append(await query('https://infosoud.gov.cz/InfoSoud',n,False))
              rows.append(await query('https://infojednani.gov.cz/InfoJednani',n,True))
            O.joinpath('results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
            md=['# Finální ověření InfoSoud / InfoJednání','']
            for r in rows:
              md += [f"## {r['case']} – {r['kind']}",f"- URL: {r.get('final_url')}",f"- Chyba: {r.get('error')}",'']
              if r.get('text'): md += [r['text'][:30000],'']
              for x in r.get('network',[]):
                if x.get('body') and ('api/' in x['url']): md += [f"### API {x['status']} {x['method']} {x['url']}",x['body'][:50000],'']
            O.joinpath('README.md').write_text('\n'.join(md),encoding='utf-8')
          asyncio.run(main())
          PY
          python3 /tmp/final.py
      - name: Uložit výsledky
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/research/hossner-court-2026/infosoud-final
          git commit -m 'Finálně ověřit spisy Hossner v InfoSoudu' || true
          for i in 1 2 3 4 5; do git pull --rebase origin main || true; git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
