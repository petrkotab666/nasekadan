name: Konečný veřejný audit Slovanu

"on":
  push:
    paths:
      - '.github/dispatch/slovan-public-audit-fixed.trigger'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Konečný audit všech publikačních ploch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vyčkat na nasazení aktuálního mainu
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(git rev-parse HEAD)"
          for attempt in $(seq 1 40); do
            q="health-${GITHUB_RUN_ID}-${attempt}-$(date +%s%N)"
            if health="$(curl -4 -kfsS -L --retry 2 --retry-all-errors --connect-timeout 20 --max-time 60 "https://nasekadan.cz/deployment-health.txt?v=$q")"; then
              if grep -qx 'status=ok' <<<"$health" \
                && grep -qx "source=$expected" <<<"$health" \
                && grep -qx 'article_order=published-time-only' <<<"$health" \
                && grep -qx 'latest=/clanky/slovan-druhy-pokus.html' <<<"$health"; then
                printf '%s\n' "$health"
                exit 0
              fi
              printf 'Pokus %s: čekám na source=%s; nynější stav:\n%s\n' "$attempt" "$expected" "$health"
            fi
            sleep 6
          done
          echo 'Aktuální main nebyl ve stanoveném čase potvrzen deployment-health souborem.' >&2
          exit 1

      - name: Stáhnout a porovnat celý veřejný povrch s mainem
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='https://nasekadan.cz'
          Q="audit-${GITHUB_RUN_ID}-$(date +%s%N)"
          D="$RUNNER_TEMP/slovan-final-audit"
          rm -rf "$D" && mkdir -p "$D/archives"

          fetch() {
            curl -4 -kfsS -L --retry 4 --retry-all-errors --connect-timeout 20 --max-time 60 "$1?v=$Q" -o "$2"
          }

          fetch "$BASE/clanky/slovan-druhy-pokus.html" "$D/article.html"
          fetch "$BASE/" "$D/index.html"
          fetch "$BASE/rss.xml" "$D/rss.xml"
          fetch "$BASE/sitemap.xml" "$D/sitemap.xml"
          fetch "$BASE/news-sitemap.xml" "$D/news-sitemap.xml"
          fetch "$BASE/llms.txt" "$D/llms.txt"
          fetch "$BASE/data/published-content-index.json" "$D/published-content-index.json"
          fetch "$BASE/data/article-integrity-manifest.json" "$D/article-integrity-manifest.json"
          fetch "$BASE/deployment-health.txt" "$D/deployment-health.txt"
          fetch "$BASE/social/slovan-druhy-pokus-20260805.png" "$D/social.png"
          fetch "$BASE/api/pocasi-predpoved.json" "$D/weather.json"
          fetch "$BASE/clanky/" "$D/archives/index.html"

          for local in clanky/strana-*.html; do
            test -e "$local" || continue
            name="$(basename "$local")"
            fetch "$BASE/clanky/$name" "$D/archives/$name"
          done

          # Statické veřejné soubory musí být přesnou kopií aktuálního mainu.
          cmp --silent clanky/slovan-druhy-pokus.html "$D/article.html"
          cmp --silent index.html "$D/index.html"
          cmp --silent rss.xml "$D/rss.xml"
          cmp --silent sitemap.xml "$D/sitemap.xml"
          cmp --silent news-sitemap.xml "$D/news-sitemap.xml"
          cmp --silent llms.txt "$D/llms.txt"
          cmp --silent data/published-content-index.json "$D/published-content-index.json"
          cmp --silent data/article-integrity-manifest.json "$D/article-integrity-manifest.json"
          cmp --silent social/slovan-druhy-pokus-20260805.png "$D/social.png"
          cmp --silent clanky/index.html "$D/archives/index.html"
          for local in clanky/strana-*.html; do
            test -e "$local" || continue
            cmp --silent "$local" "$D/archives/$(basename "$local")"
          done

          D="$D" MAIN_SHA="$(git rev-parse HEAD)" python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          import os
          import re
          import struct
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          d = Path(os.environ['D'])
          main_sha = os.environ['MAIN_SHA']
          title = 'Kadaň vybírá nového stavitele Slovanu za 195 milionů. Účet prvního pokusu stále není veřejný'
          published = '2026-08-05T04:00:00+02:00'
          url = 'https://nasekadan.cz/clanky/slovan-druhy-pokus.html'
          rel = '/clanky/slovan-druhy-pokus.html'

          article_bytes = (d / 'article.html').read_bytes()
          article = article_bytes.decode('utf-8')
          home = (d / 'index.html').read_text(encoding='utf-8')
          llms = (d / 'llms.txt').read_text(encoding='utf-8')
          health = (d / 'deployment-health.txt').read_text(encoding='utf-8')
          archives = '\n'.join(
              p.read_text(encoding='utf-8')
              for p in sorted((d / 'archives').glob('*.html'))
          )

          # Článek, metadata, indexace a čistota produkčního textu.
          assert f'<h1>{title}</h1>' in article
          assert f'<title>{title} | Naše Kadaň</title>' in article
          assert f'<link rel="canonical" href="{url}">' in article
          assert 'index,follow' in article and 'noindex' not in article.lower()
          assert f'"datePublished":"{published}"' in article
          assert f'property="article:published_time" content="{published}"' in article
          assert f'property="og:title" content="{title}"' in article
          assert f'name="twitter:title" content="{title}"' in article
          assert '/social/slovan-druhy-pokus-20260805.png' in article
          assert 'Druhý pokus může Kadani přinést potřebné byty' in article
          forbidden = ('Náhled článku', 'nepublikováno', 'pracovní HTML náhled', 'PŘIPRAVOVANÝ ČLÁNEK', 'Otázky pro město')
          assert not any(x.lower() in article.lower() for x in forbidden)

          # Očekávané pořadí vypočtené stejným kanonickým parserem jako produkční guard.
          spec = importlib.util.spec_from_file_location('visibility', Path('scripts/enforce_article_visibility.py'))
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          expected_items = []
          for path in Path('clanky').glob('*.html'):
              if path.name == 'index.html' or re.fullmatch(r'strana-\d+\.html', path.name):
                  continue
              item = module.article_info(path)
              if item:
                  expected_items.append(item)
          expected_items.sort(key=lambda item: item['dt'], reverse=True)
          expected_hrefs = [item['href'] for item in expected_items]
          assert expected_hrefs[0] == rel

          hero = re.search(r'<section\b[^>]*class="[^"]*\bhero\b[^"]*"[^>]*id="clanky"[^>]*>.*?</section>', home, re.S | re.I)
          assert hero and f'data-latest-article-href="{expected_hrefs[0]}"' in hero.group(0)
          aside = re.search(r'<aside\b[^>]*class="[^"]*current-aside[^"]*"[^>]*>.*?</aside>', hero.group(0), re.S | re.I)
          assert aside and expected_hrefs[1] in aside.group(0)
          home_cards = re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="(/clanky/[^"]+\.html)".*?</article>', home, re.S | re.I)
          assert home_cards and home_cards[0] == expected_hrefs[2]
          archive_cards = re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="(/clanky/[^"]+\.html)".*?</article>', archives, re.S | re.I)
          assert archive_cards == expected_hrefs
          assert len(archive_cards) == len(set(archive_cards))
          assert title in home and rel in home and '/pocasi.js' in home
          assert title in archives and '5. 8. 2026' in archives and '04:00' in archives

          # Kanonický registr, počty, duplicity a stav všech publikačních ploch.
          registry = json.loads((d / 'published-content-index.json').read_text(encoding='utf-8'))
          count = registry['article_count']
          validation = registry['validation']
          assert count == len(expected_hrefs) == len(registry['articles']) == len(archive_cards)
          assert validation['archive_count'] == count
          assert validation['rss_count'] == count
          assert validation['archive_page_count'] == len(list((d / 'archives').glob('*.html')))
          assert validation['duplicate_urls'] == []
          assert validation['duplicate_fingerprints'] == []
          assert validation['repair_pending_public_verification'] is False
          assert validation['last_consistency_audit']['status'] == 'success'
          assert validation['deployment_health'] == 'ok'
          current = next(x for x in registry['articles'] if x['url'] == url)
          assert current['h1'] == title and current['published_at'] == published
          assert current['source_commit'] not in ('', None, 'pending-publication-commit')
          assert all(current['status'][k] for k in ('homepage', 'archive', 'rss', 'sitemap', 'news_sitemap'))
          registry_paths = [urlparse(item['url']).path for item in registry['articles']]
          assert registry_paths == expected_hrefs

          # RSS.
          rss_root = ET.parse(d / 'rss.xml').getroot()
          items = rss_root.findall('./channel/item')
          assert len(items) == count
          rss_urls = [(x.findtext('link') or '').strip() for x in items]
          assert rss_urls == [item['url'] for item in registry['articles']]
          assert len(rss_urls) == len(set(rss_urls))
          matches = [x for x in items if (x.findtext('link') or '').strip() == url]
          assert len(matches) == 1
          assert matches[0].findtext('title') == title
          assert '05 Aug 2026 04:00:00 +0200' in (matches[0].findtext('pubDate') or '')

          # Sitemap a Google News sitemap.
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9', 'n': 'http://www.google.com/schemas/sitemap-news/0.9'}
          sitemap = ET.parse(d / 'sitemap.xml').getroot()
          locs = [x.text for x in sitemap.findall('.//s:loc', ns)]
          assert len(locs) == len(set(locs))
          assert url in locs
          assert all(item['url'] in locs for item in registry['articles'])
          news = ET.parse(d / 'news-sitemap.xml').getroot()
          news_urls = news.findall('s:url', ns)
          assert len(news_urls) == 10
          news_locs = [node.findtext('s:loc', namespaces=ns) for node in news_urls]
          assert len(news_locs) == len(set(news_locs))
          target = [node for node in news_urls if node.findtext('s:loc', namespaces=ns) == url]
          assert len(target) == 1
          assert target[0].findtext('.//n:publication_date', namespaces=ns) == published
          assert target[0].findtext('.//n:title', namespaces=ns) == title

          # llms.txt a manifest integrity.
          assert url in llms and title in llms
          manifest = json.loads((d / 'article-integrity-manifest.json').read_text(encoding='utf-8'))
          assert manifest['article_count'] == count and len(manifest['articles']) == count
          manifest_urls = [x['url'] for x in manifest['articles']]
          assert manifest_urls == [item['url'] for item in registry['articles']]
          assert len(manifest_urls) == len(set(manifest_urls))
          m = next(x for x in manifest['articles'] if x['url'] == url)
          assert m['title'] == title and m['published_at'] == published
          assert m['sha256'] == hashlib.sha256(article_bytes).hexdigest()
          assert m['bytes'] == len(article_bytes)

          # Deployment-health potvrzuje přesně auditovaný main a správnou chronologii.
          assert re.search(r'^status=ok$', health, re.M)
          assert re.search(fr'^source={main_sha}$', health, re.M)
          assert re.search(r'^article_order=published-time-only$', health, re.M)
          assert re.search(fr'^latest={re.escape(expected_hrefs[0])}$', health, re.M)
          assert re.search(fr'^second={re.escape(expected_hrefs[1])}$', health, re.M)
          assert re.search(fr'^third={re.escape(expected_hrefs[2])}$', health, re.M)

          # Sociální grafika a počasí.
          png = (d / 'social.png').read_bytes()
          assert len(png) > 10000 and png[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', png[16:24])
          assert (width, height) == (1200, 630)
          weather = json.loads((d / 'weather.json').read_text(encoding='utf-8'))
          assert isinstance(weather, (dict, list)) and bool(weather)

          result = {
              'status': 'success',
              'main_sha': main_sha,
              'article_url': url,
              'title': title,
              'published_at': published,
              'article_count': count,
              'archive_page_count': validation['archive_page_count'],
              'rss_count': len(items),
              'news_sitemap_count': len(news_urls),
              'article_source_commit': current['source_commit'],
              'social_image': {'bytes': len(png), 'width': width, 'height': height},
              'weather': 'ok',
              'duplicates': 0,
              'order': expected_hrefs[:3],
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          with Path(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')).open('a', encoding='utf-8') as summary:
              summary.write('## Finální audit Slovanu: úspěch\n\n')
              summary.write(f'- main: `{main_sha}`\n')
              summary.write(f'- článků: **{count}**\n')
              summary.write(f'- archivních stran: **{validation["archive_page_count"]}**\n')
              summary.write(f'- RSS položek: **{len(items)}**\n')
              summary.write(f'- News sitemap položek: **{len(news_urls)}**\n')
              summary.write('- duplicity: **0**\n')
              summary.write('- sociální grafika: **1200 × 630 px**\n')
              summary.write('- počasí: **OK**\n')
          PY

      - name: Uzavřít incident až po úplném úspěchu
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            const title='[incident] Konečný audit Slovanu 5. srpna';
            const open=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            for(const issue of open.filter(x=>x.title===title)) {
              await github.rest.issues.createComment({
                owner,repo,issue_number:issue.number,
                body:`Úplný audit živého webu proti aktuálnímu mainu prošel. Článek, metadata, titulka, celý archiv, RSS, obě sitemapy, llms.txt, registr, manifest, deployment-health, sociální grafika, počasí, počty, pořadí i duplicity jsou v pořádku. Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({owner,repo,issue_number:issue.number,state:'closed',state_reason:'completed'});
            }

      - name: Zapsat incident při selhání konečného auditu
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            const title='[incident] Konečný audit Slovanu 5. srpna';
            const body=`Konečný veřejný audit selhal. Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const existing=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            const issue=existing.find(x=>x.title===title);
            if(issue) await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
