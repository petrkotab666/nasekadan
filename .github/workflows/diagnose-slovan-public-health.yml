name: Diagnostika veřejného deployment-health

"on":
  push:
    paths:
      - '.github/dispatch/slovan-health-diagnose.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Uložit veřejný deployment-health bez cache
        shell: bash
        run: |
          set -Eeuo pipefail
          q="${GITHUB_RUN_ID}-$(date +%s%N)"
          mkdir -p data/audits
          curl -4 -kfsS -L --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 "https://nasekadan.cz/deployment-health.txt?v=$q" -o data/audits/public-deployment-health.txt
          printf '\nchecked_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> data/audits/public-deployment-health.txt
          cat data/audits/public-deployment-health.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audits/public-deployment-health.txt
          git commit -m 'Diagnostika: uložit veřejný deployment-health'
          git push origin HEAD:main
