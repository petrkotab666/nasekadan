name: Probe private stats final 20260730
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-private-stats-final-20260730.yml']
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/probe.txt"
          for d in nakupvakci.cz lastminuteslevy.cz testywebu.cz sirupyzbylinek.cz; do
            echo "===== $d =====" >> "$RUNNER_TEMP/probe.txt"
            curl -kLsS -A 'Mozilla/5.0 FinalProbe' --max-time 25 -D /tmp/h "https://$d/statistiky/?final=$(date +%s)" -o /tmp/b || true
            head -n 1 /tmp/h >> "$RUNNER_TEMP/probe.txt" || true
            grep -i '^location:' /tmp/h >> "$RUNNER_TEMP/probe.txt" || true
            grep -o 'statistiky-webu[^"< ]*' /tmp/b | head -n 3 >> "$RUNNER_TEMP/probe.txt" || true
            body=$(curl -kLsS -A 'Mozilla/5.0 FinalProbe' --max-time 25 "https://$d/?final=$(date +%s)" || true)
            if grep -q '_nkstats/tracker.js\|owned-promotion-renderer.js\|__NK_TESTYWEBU_STATS_V1__' <<<"$body"; then echo TRACKER=ANO >> "$RUNNER_TEMP/probe.txt"; else echo TRACKER=NE >> "$RUNNER_TEMP/probe.txt"; fi
          done
          cat "$RUNNER_TEMP/probe.txt"
      - name: Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');let log='';try{log=fs.readFileSync(`${process.env.RUNNER_TEMP}/probe.txt`,'utf8')}catch{};await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:`[POSLEDNÍ SONDA STATISTIK] ${new Date().toISOString()}`,body:'```text\n'+log+'\n```'});
