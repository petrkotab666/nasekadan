name: Probe private stats final 20260730
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-private-stats-final-20260730.yml']
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/probe.txt"
          for d in nakupvakci.cz lastminuteslevy.cz testywebu.cz sirupyzbylinek.cz; do
            echo "===== $d =====" >> "$RUNNER_TEMP/probe.txt"
            curl -kLsS -A 'Mozilla/5.0 FinalProbe' --max-time 25 -D /tmp/h "https://$d/statistiky/?final=$(date +%s)" -o /tmp/b || true
            echo "STATS_FINAL=$(tail -n 1 /tmp/h | tr -d '\r')" >> "$RUNNER_TEMP/probe.txt" || true
            grep -i '^location:' /tmp/h | tail -n 1 >> "$RUNNER_TEMP/probe.txt" || true
            if grep -q 'statistiky-webu' /tmp/b; then echo STATISTIKY=ANO >> "$RUNNER_TEMP/probe.txt"; else echo STATISTIKY=NE >> "$RUNNER_TEMP/probe.txt"; fi
            case "$d" in
              nakupvakci.cz)
                js=$(curl -kLsS --max-time 25 "https://$d/assets/catalog-entry-v3.js?final=$(date +%s)" || true)
                shared=$(curl -kLsS --max-time 25 "https://pojistime.to/assets/owned-promotion-renderer.js?final=$(date +%s)" || true)
                if grep -q 'owned-promotion-renderer.js' <<<"$js" && grep -q '__NK_NETWORK_STATS_V1__' <<<"$shared"; then echo TRACKER=ANO >> "$RUNNER_TEMP/probe.txt"; else echo TRACKER=NE >> "$RUNNER_TEMP/probe.txt"; fi ;;
              lastminuteslevy.cz)
                js=$(curl -kLsS --max-time 25 "https://www.$d/contextual-ads.js?final=$(date +%s)" || true)
                shared=$(curl -kLsS --max-time 25 "https://pojistime.to/assets/owned-promotion-renderer.js?final=$(date +%s)" || true)
                if grep -q 'owned-promotion-renderer.js' <<<"$js" && grep -q '__NK_NETWORK_STATS_V1__' <<<"$shared"; then echo TRACKER=ANO >> "$RUNNER_TEMP/probe.txt"; else echo TRACKER=NE >> "$RUNNER_TEMP/probe.txt"; fi ;;
              testywebu.cz)
                js=$(curl -kLsS --max-time 25 "https://$d/assets/affiliates.js?final=$(date +%s)" || true)
                if grep -q '__NK_TESTYWEBU_STATS_V1__' <<<"$js"; then echo TRACKER=ANO >> "$RUNNER_TEMP/probe.txt"; else echo TRACKER=NE >> "$RUNNER_TEMP/probe.txt"; fi ;;
              sirupyzbylinek.cz)
                body=$(curl -kLsS --max-time 25 "https://www.$d/?final=$(date +%s)" || true)
                if grep -q '_nkstats/tracker.js' <<<"$body"; then echo TRACKER=ANO >> "$RUNNER_TEMP/probe.txt"; else echo TRACKER=NE >> "$RUNNER_TEMP/probe.txt"; fi ;;
            esac
          done
          cat "$RUNNER_TEMP/probe.txt"
      - name: Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');let log='';try{log=fs.readFileSync(`${process.env.RUNNER_TEMP}/probe.txt`,'utf8')}catch{};await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:`[POSLEDNÍ SONDA STATISTIK V2] ${new Date().toISOString()}`,body:'```text\n'+log+'\n```'});
# third push
