name: Nasadit a ověřit úvodní fotografii článku o stříkačkách

on:
  push:
    branches: [main]
    paths:
      - '.github/syringe-hero-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-syringe-hero-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit zdrojové soubory
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-syringe-hero="1"' clanky/strikacky-vchody-drogy-kadan.html
          grep -Fq "url('/assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp')" clanky/strikacky-vchody-drogy-kadan.html
          ! grep -Fq 'data-syringe-illustration="1"' clanky/strikacky-vchody-drogy-kadan.html
          test -s assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/nk-syringe-hero-live"
          mkdir -p "$RUNNER_TEMP/nk-syringe-hero-live/clanky" "$RUNNER_TEMP/nk-syringe-hero-live/assets/clanky"
          cp clanky/strikacky-vchody-drogy-kadan.html "$RUNNER_TEMP/nk-syringe-hero-live/clanky/"
          cp assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp "$RUNNER_TEMP/nk-syringe-hero-live/assets/clanky/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r \
            "$RUNNER_TEMP/nk-syringe-hero-live" ubuntu@57.129.43.215:/tmp/nk-syringe-hero-live
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/assets/clanky
          sudo install -m 0644 /tmp/nk-syringe-hero-live/clanky/strikacky-vchody-drogy-kadan.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-syringe-hero-live/assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp /var/www/nasekadan/assets/clanky/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-syringe-hero-live/clanky/strikacky-vchody-drogy-kadan.html nasekadan-web:/usr/share/nginx/html/clanky/strikacky-vchody-drogy-kadan.html
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/assets/clanky
            sudo docker cp /tmp/nk-syringe-hero-live/assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp nasekadan-web:/usr/share/nginx/html/assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp
          fi
          rm -rf /tmp/nk-syringe-hero-live
          REMOTE

      - name: Veřejně ověřit výsledek
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 20); do
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/strikacky-vchody-drogy-kadan.html?v=${stamp}-${attempt}" -o /tmp/article.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp?v=${stamp}-${attempt}" -o /tmp/image.webp || true
            if grep -Fq 'data-syringe-hero="1"' /tmp/article.html \
              && grep -Fq "url('/assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp')" /tmp/article.html \
              && ! grep -Fq 'data-syringe-illustration="1"' /tmp/article.html \
              && test -s /tmp/image.webp; then
              echo 'Živý článek používá fotografii v pozadí úvodního okna.'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Zapsat stav
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path='syringe-hero-status.json';
            const ok=process.env.DEPLOY==='success'&&process.env.VERIFY==='success';
            const status={status:ok?'success':'failed',checked_at_utc:new Date().toISOString(),trigger_commit:context.sha,run_id:context.runId,server_deploy:process.env.DEPLOY||'skipped',public_verification:process.env.VERIFY||'skipped'};
            const content=Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64');
            let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat stav úvodní fotografie článku: ${status.status}`,content,...(sha?{sha}:{})});
