name: ZABLOKOVÁNO – starý publikační běh Slovanu

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Zastavit zastaralý publikační postup
        shell: bash
        run: |
          echo 'Tento starý workflow je záměrně zablokovaný, protože používal zastaralý článek, aktuální čas a neúplné publikační plochy.' >&2
          echo 'Platný je pouze .github/workflows/publish-slovan-20260805.yml s časem 5. 8. 2026 ve 04:00 a vícevrstvým ověřením.' >&2
          exit 1
