name: Zveřejnit článek o sečení 1. 8. 2026 v 11:00

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-greenery-2026-08-01-1100-v2.yml'
      - 'scripts/prepare_greenery_publication_20260801.py'
      - '.github/drafts/sekani-travniku-kadan-spravci-vysky-2026.html.gz.b64'
      - '.github/drafts/sekani-travniku-kadan-spravci-vysky-2026.html.gz.b64.part2'
  schedule:
    # 09:00 UTC = 11:00 CEST
    - cron: '0 9 1 8 *'
    # Nezávislé opravné běhy při zpoždění scheduleru, souběhu nebo výpadku serveru
    - cron: '7 9 1 8 *'
    - cron: '17 9 1 8 *'
    - cron: '30 9 1 8 *'
    - cron: '45 9 1 8 *'
    - cron: '0 10 1 8 *'
    - cron: '30 10 1 8 *'
  workflow_dispatch:
    inputs:
      force:
        description: Zveřejnit nebo opravit ihned
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-greenery-2026-08-01-1100
  cancel-in-progress: false

env:
  SLUG: sekani-travniku-kadan-spravci-vysky-2026
  ARTICLE: clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  PUBLIC_URL: https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  EXPECTED_TEXT: 'Sedm centimetrů je smluvní minimum jedné konkrétní lokality'
  TARGET_UTC: '2026-08-01T09:00:00Z'
  ISSUE_TITLE: 'Publikace článku o sečení trávníků vyžaduje zásah'
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit zdroj a rozhodnout o publikaci
        id: timing
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/drafts/${SLUG}.html.gz.b64
          test -s .github/drafts/${SLUG}.html.gz.b64.part2
          test -s scripts/prepare_greenery_publication_20260801.py
          cat .github/drafts/${SLUG}.html.gz.b64 .github/drafts/${SLUG}.html.gz.b64.part2 \
            | base64 -d | gzip -dc > "$RUNNER_TEMP/greenery-source.html"
          grep -Fq '<meta name="robots" content="noindex,nofollow">' "$RUNNER_TEMP/greenery-source.html"
          grep -Fq '2026-08-01T11:00:00+02:00' "$RUNNER_TEMP/greenery-source.html"
          grep -Fq 'data-poll-id="sekani-travniku-kadan-2026"' "$RUNNER_TEMP/greenery-source.html"
          grep -Fq "$EXPECTED_TEXT" "$RUNNER_TEMP/greenery-source.html"

          force='${{ inputs.force || false }}'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$force" != 'true' && "$now" < "$TARGET_UTC" ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo "Zdroj je připravený; zveřejnění čeká do $TARGET_UTC."
            exit 0
          fi
          if [[ "${{ github.event_name }}" == 'schedule' && "$(date -u +%F)" != '2026-08-01' ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Jednorázový cron mimo 1. 8. 2026 se ignoruje.'
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"

      - name: Sestavit kompletní veřejnou publikaci
        if: steps.timing.outputs.active == 'true'
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/prepare_greenery_publication_20260801.py
          test -s .github/greenery-publication-bundle.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data=json.loads(Path('.github/greenery-publication-bundle.json').read_text(encoding='utf-8'))
          print('social_file='+data['socialFile'])
          print('social_url='+data['socialUrl'])
          PY

      - name: Uložit článek a veřejné přehledy do main
        if: steps.timing.outputs.active == 'true'
        id: commit
        shell: bash
        env:
          SOCIAL_FILE: ${{ steps.prepare.outputs.social_file }}
        run: |
          set -euo pipefail
          test -s "$SOCIAL_FILE"
          git config user.name 'Naše Kadaň publikační automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- \
            "$ARTICLE" "$SOCIAL_FILE" \
            index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml \
            llms.txt robots.txt \
            .github/facebook-publish-trigger.txt \
            .github/greenery-publication-bundle.json

          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Úplná veřejná verze už je v hlavní větvi.'
            git reset --hard HEAD
            git clean -fd
          else
            git commit -m 'Publikovat: jak Kadaň udržuje městské trávníky'
            git reset --hard HEAD
            git clean -fd
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo 'changed=true' >> "$GITHUB_OUTPUT"
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 8))
              if [[ "$attempt" == 5 ]]; then exit 1; fi
            done
          fi

          git fetch origin main
          git reset --hard origin/main
          grep -Fq "$EXPECTED_TEXT" "$ARTICLE"
          grep -Fq "$PUBLIC_URL" rss.xml

      - name: Připravit přístup na OVH
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přímo na server a do aktivního kontejneru
        if: steps.timing.outputs.active == 'true'
        id: deploy
        shell: bash
        env:
          SOCIAL_FILE: ${{ steps.prepare.outputs.social_file }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-greenery-publication"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$SOCIAL_FILE" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$bundle/"

          for attempt in 1 2 3; do
            if scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-greenery-publication; then
              break
            fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep $((attempt * 10))
          done

          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 /tmp/nk-greenery-publication/clanky/sekani-travniku-kadan-spravci-vysky-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-greenery-publication/clanky/index.html /var/www/nasekadan/clanky/index.html
          find /tmp/nk-greenery-publication/social -maxdepth 1 -type f -name 'sekani-travniku-kadan-spravci-vysky-2026-*.png' -exec sudo install -m 0644 {} /var/www/nasekadan/social/ \;
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do
            sudo install -m 0644 "/tmp/nk-greenery-publication/$f" "/var/www/nasekadan/$f"
          done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp /tmp/nk-greenery-publication/clanky/sekani-travniku-kadan-spravci-vysky-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp /tmp/nk-greenery-publication/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            for f in /tmp/nk-greenery-publication/social/*.png; do
              [[ -f "$f" ]] && sudo docker cp "$f" nasekadan-web:/usr/share/nginx/html/social/
            done
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do
              sudo docker cp "/tmp/nk-greenery-publication/$f" "nasekadan-web:/usr/share/nginx/html/$f"
            done
          fi
          sudo chmod -R a+rX /var/www/nasekadan
          grep -Fq 'Sedm centimetrů je smluvní minimum jedné konkrétní lokality' /var/www/nasekadan/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
          grep -Fq '/clanky/sekani-travniku-kadan-spravci-vysky-2026.html' /var/www/nasekadan/index.html
          grep -Fq 'https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html' /var/www/nasekadan/rss.xml
          rm -rf /tmp/nk-greenery-publication
          REMOTE

      - name: Veřejně ověřit všechny publikační výstupy
        if: steps.timing.outputs.active == 'true'
        id: verify
        shell: bash
        env:
          SOCIAL_URL: ${{ steps.prepare.outputs.social_url }}
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for attempt in $(seq 1 36); do
            article="$(curl -4 -kfsS --max-time 25 "${PUBLIC_URL}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            image="$RUNNER_TEMP/greenery-social-${attempt}.png"
            curl -4 -kfsS --max-time 25 "${SOCIAL_URL}?v=${stamp}-${attempt}" -o "$image" 2>/dev/null || true
            image_ok=false
            if [[ -s "$image" ]] && python3 - "$image" <<'PY'
          import sys
          from PIL import Image
          with Image.open(sys.argv[1]) as im:
              assert im.format == 'PNG'
              assert im.size == (1200,630)
          PY
            then image_ok=true; fi

            if grep -Fq "$EXPECTED_TEXT" <<<"$article" \
              && grep -Fq 'data-poll-id="sekani-travniku-kadan-2026"' <<<"$article" \
              && grep -Fq '/api/analytics/pageview' <<<"$article" \
              && grep -Fq 'index,follow' <<<"$article" \
              && ! grep -Fq 'noindex,nofollow' <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "$PUBLIC_URL" <<<"$rss" \
              && grep -Fq "$PUBLIC_URL" <<<"$sitemap" \
              && grep -Fq "$PUBLIC_URL" <<<"$news" \
              && [[ "$image_ok" == true ]]; then
              echo 'web_ok=true' >> "$GITHUB_OUTPUT"
              echo 'HOTOVO: článek je veřejný, indexovatelný a zařazený do všech přehledů.'
              exit 0
            fi
            sleep 6
          done
          echo 'web_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Zapsat stav a otevřít výstrahu jen při trvající chybě
        if: always() && steps.timing.outputs.active == 'true'
        uses: actions/github-script@v7
        env:
          WEB_OK: ${{ steps.verify.outputs.web_ok }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const ok=process.env.WEB_OK==='true';
            const path='.github/greenery-publication-status.json';
            const payload={status:ok?'passed':'failed',checkedAtUtc:new Date().toISOString(),runId:context.runId,sourceSha:context.sha,serverDeploy:process.env.DEPLOY_OUTCOME||'skipped',publicVerification:ok?'success':'failure',publicUrl:'https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html'};
            const content=Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64');
            let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat publikaci článku o sečení: ${payload.status} [skip ci]`,content,...(sha?{sha}:{})});

            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=issues.find(issue=>!issue.pull_request&&issue.title===process.env.ISSUE_TITLE);
            if(ok&&existing){
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed',state_reason:'completed'});
            } else if(!ok&&!existing){
              await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:process.env.ISSUE_TITLE,body:[
                'Automat zatím nepotvrdil kompletní publikaci článku o sečení trávníků.',
                '',
                `- Nasazení na server: ${process.env.DEPLOY_OUTCOME||'neproběhlo'}`,
                '- Veřejná kontrola: NEOVĚŘENA',
                `- Běh: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Další pojistný cron a následná kontrolní úloha se pokusí stav automaticky napravit.'
              ].join('\n')});
            }
