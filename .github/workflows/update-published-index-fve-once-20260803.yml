name: Jednorázově doplnit FVE do kanonického registru

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-published-index-fve-once-20260803.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-published-index-fve-once-20260803
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Načíst živý web a aktualizovat kanonický registr
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from xml.etree import ElementTree as ET

          base = "https://nasekadan.cz"
          article_url = base + "/clanky/fve-epr-letiste-bess-kadan-2026.html"
          expected_h1 = "ČEZ chce u Kadaně postavit solární park s bateriemi. Jejich velikost, cena i platby městu zůstávají neznámé"
          cache = datetime.now().strftime("%Y%m%d%H%M%S")

          def get(path: str) -> str:
              url = base + path + ("&" if "?" in path else "?") + "canonical-check=" + cache
              req = urllib.request.Request(url, headers={"User-Agent": "NaseKadanCanonicalIndex/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path}: HTTP {response.status}")
                  return response.read().decode("utf-8", "replace")

          home = get("/")
          archive = get("/clanky/")
          rss = get("/rss.xml")
          sitemap = get("/sitemap.xml")
          news = get("/news-sitemap.xml")
          health = get("/deployment-health.txt")
          article = get("/clanky/fve-epr-letiste-bess-kadan-2026.html")

          h1_match = re.search(r"<h1[^>]*>(.*?)</h1>", article, re.I | re.S)
          h1 = re.sub(r"<[^>]+>", "", h1_match.group(1)).strip() if h1_match else ""
          if h1 != expected_h1:
              raise RuntimeError(f"Živý H1 nesouhlasí: {h1!r}")
          if "noindex" in article.lower() or "index,follow" not in article.lower():
              raise RuntimeError("Živý článek není bezpečně indexovatelný")

          def html_article_urls(text: str) -> set[str]:
              paths = set(re.findall(r'''href=["'](?:https://nasekadan\.cz)?(/clanky/[^"'#?]+\.html)''', text, re.I))
              return {base + path for path in paths}

          def rss_article_urls(text: str) -> set[str]:
              root = ET.fromstring(text)
              urls = set()
              for item in root.findall(".//item"):
                  link = item.findtext("link")
                  if link and "/clanky/" in link and link.endswith(".html"):
                      urls.add(link.strip())
              return urls

          def sitemap_article_urls(text: str) -> set[str]:
              root = ET.fromstring(text)
              urls = set()
              for element in root.iter():
                  if element.tag.endswith("loc") and element.text:
                      url = element.text.strip()
                      if "/clanky/" in url and url.endswith(".html"):
                          urls.add(url)
              return urls

          home_urls = html_article_urls(home)
          archive_urls = html_article_urls(archive)
          rss_urls = rss_article_urls(rss)
          sitemap_urls = sitemap_article_urls(sitemap)
          news_urls = sitemap_article_urls(news)

          if article_url not in rss_urls or article_url not in sitemap_urls or article_url not in news_urls:
              raise RuntimeError("Veřejný článek není současně v RSS a obou relevantních sitemapách")

          path = Path("data/published-content-index.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          articles = [a for a in data.get("articles", []) if a.get("url") != article_url]

          for old in articles:
              url = old.get("url", "")
              old["status"] = {
                  "homepage": url in home_urls,
                  "archive": url in archive_urls,
                  "rss": url in rss_urls,
                  "sitemap": url in sitemap_urls,
                  "news_sitemap": url in news_urls,
              }

          fingerprint_source = "fve epr letiste|cez|tusimice|bateriove uloziste|2026"
          new_article = {
              "title": expected_h1,
              "h1": expected_h1,
              "url": article_url,
              "published_at": "2026-08-03T10:30:00+02:00",
              "modified_at": "2026-08-03T10:30:00+02:00",
              "persons": [],
              "organizations": [
                  "ČEZ",
                  "Dopravní a energetický stavební úřad",
                  "Město Kadaň"
              ],
              "places": ["Tušimice", "Kadaň", "Prunéřov"],
              "cases": [
                  "FVE EPR Letiště",
                  "Bateriové úložiště BESS",
                  "Plánovací smlouva města s ČEZ"
              ],
              "topics": [
                  "Energetika",
                  "Obnovitelné zdroje",
                  "Bateriová úložiště",
                  "Veřejné dokumenty"
              ],
              "fingerprint": hashlib.sha256(fingerprint_source.encode("utf-8")).hexdigest()[:24],
              "status": {
                  "homepage": article_url in home_urls,
                  "archive": article_url in archive_urls,
                  "rss": article_url in rss_urls,
                  "sitemap": article_url in sitemap_urls,
                  "news_sitemap": article_url in news_urls,
              },
              "source_path": "clanky/fve-epr-letiste-bess-kadan-2026.html",
              "publication_status": "published",
              "source_commit": "ec89c0efb477195d459baa8087f5aed54a3cd846"
          }
          articles.insert(0, new_article)

          urls = [a["url"] for a in articles]
          fingerprints = [a["fingerprint"] for a in articles]
          duplicate_urls = sorted({u for u in urls if urls.count(u) > 1})
          duplicate_fingerprints = sorted({f for f in fingerprints if fingerprints.count(f) > 1})
          if duplicate_urls or duplicate_fingerprints:
              raise RuntimeError(f"Duplicity: URL={duplicate_urls}, fingerprint={duplicate_fingerprints}")

          required = ("title", "h1", "url", "published_at", "modified_at", "persons", "organizations", "places", "cases", "topics", "fingerprint", "status", "source_path", "publication_status", "source_commit")
          required_complete = all(all(key in item for key in required) for item in articles)
          if not required_complete:
              raise RuntimeError("Některému článku chybí povinné pole")

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          health_source_match = re.search(r"(?m)^source=(\S+)", health)
          health_ok = bool(re.search(r"(?m)^status=ok\s*$", health))

          data["schema_version"] = "1.3"
          data["generated_at"] = datetime.now(ZoneInfo("Europe/Prague")).isoformat(timespec="seconds")
          data["source_commit"] = head
          data["article_count"] = len(articles)
          data["articles"] = articles
          validation = data.setdefault("validation", {})
          validation.update({
              "homepage_count": len(home_urls),
              "archive_count": len(archive_urls),
              "rss_count": len(rss_urls),
              "sitemap_all_articles_present": all(url in sitemap_urls for url in urls),
              "news_sitemap_recent_count": len(news_urls),
              "deployment_health": "verified" if health_ok else "unverified",
              "required_fields_complete": True,
              "duplicate_urls": [],
              "duplicate_fingerprints": [],
              "per_article_source_commits": all(bool(a.get("source_commit")) for a in articles),
              "deployment_health_source": health_source_match.group(1) if health_source_match else None,
          })

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "article_count": len(articles),
              "new_article_status": new_article["status"],
              "homepage_count": len(home_urls),
              "archive_count": len(archive_urls),
              "rss_count": len(rss_urls),
              "sitemap_count": len(sitemap_urls),
              "news_count": len(news_urls),
              "deployment_health_source": validation["deployment_health_source"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Zapsat jedinou bezpečnou opravu a odstranit jednorázový workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-published-index-fve-once-20260803.yml
          git add data/published-content-index.json
          git commit -m "Doplnit FVE EPR Letiště do kanonického registru"
          git push origin HEAD:main
