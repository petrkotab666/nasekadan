name: Jednorázová měřitelná oprava stránkování

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/pagination-live-repair.trigger'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pagination-live-repair-20260807
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix-archive-pagination-live'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit zdrojové stránky 1 až 5
        shell: bash
        run: |
          set -euo pipefail
          test -s clanky/index.html
          for n in 2 3 4 5; do
            test -s "clanky/strana-$n.html"
            grep -Fq "Všechny články – strana $n" "clanky/strana-$n.html"
            grep -Fq 'article-card' "clanky/strana-$n.html"
          done
          grep -Fq 'href="/clanky/strana-2.html"' clanky/index.html

      - name: Připravit SSH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Spustit jediný kanonický produkční skript z čistého main
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/canonical-deploy.log"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' >"$log" 2>&1 <<'REMOTE'
          set -euo pipefail
          work=/tmp/nasekadan-pagination-repair
          sudo rm -rf "$work"
          # Kanonický build může na malém produkčním disku narazit na starou
          # BuildKit cache. Mažeme pouze nepoužívanou build cache a obrazy;
          # obraz běžícího kontejneru Docker zachová.
          sudo docker builder prune -af || true
          sudo docker image prune -af || true
          avail=$(df -Pk / | awk 'NR==2{print $4}')
          test "$avail" -ge 524288
          git clone --depth 1 --branch main https://github.com/petrkotab666/nasekadan.git "$work"
          test -d "$work/.git"
          test -s "$work/clanky/index.html"
          test -s "$work/clanky/strana-2.html"
          chmod +x "$work/deploy/sync-production.sh"
          sudo env GITHUB_WORKSPACE="$work" NASEKADAN_SKIP_AUTOMATION_INSTALL=1 bash "$work/deploy/sync-production.sh"
          sudo rm -rf "$work"
          REMOTE
          rc=$?
          echo "CANONICAL_DEPLOY_EXIT=$rc"
          echo '--- posledních 160 řádků kanonického deploye ---'
          tail -n 160 "$log" || true
          if [[ $rc -ne 0 ]]; then
            echo '--- filtrované chybové řádky ---'
            grep -Ein 'traceback|runtimeerror|error|chyb|selhal|fail|missing|nenalezen|neúpl|kontrola|space' "$log" | tail -n 80 || true
          fi
          exit "$rc"

      - name: Veřejně ověřit klikatelné stránky archivu
        shell: bash
        run: |
          set -euo pipefail
          base='https://nasekadan.cz/clanky'
          for attempt in $(seq 1 12); do
            q="pagination-${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            ok=1
            code=$(curl -4 -ksSL --max-time 35 -o /tmp/p1.html -w '%{http_code}' "$base/?v=$q" || true)
            [[ "$code" == 200 ]] || ok=0
            grep -Fq 'href="/clanky/strana-2.html"' /tmp/p1.html || ok=0
            for n in 2 3 4 5; do
              code=$(curl -4 -ksSL --max-time 35 -o "/tmp/p$n.html" -w '%{http_code}' "$base/strana-$n.html?v=$q" || true)
              [[ "$code" == 200 ]] || ok=0
              grep -Fq "Všechny články – strana $n" "/tmp/p$n.html" || ok=0
              grep -Fq 'article-card' "/tmp/p$n.html" || ok=0
            done
            if [[ "$ok" == 1 ]]; then
              echo 'PAGINATION_LIVE_OK pages=1,2,3,4,5'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Úplný živý kanonický audit po opravě
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_canonical_content_runtime.py scripts/run_canonical_audit_runtime_v2.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit_canonical_content_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if "status=ok" not in health_text:\n        raise RuntimeError("deployment-health.txt nemá status=ok")'''
          new = '''    if (\n        not health_text.strip()\n        or "site=nasekadan.cz" not in health_text\n        or not any(line.startswith("source=") and line.split("=", 1)[1].strip() for line in health_text.splitlines())\n    ):\n        raise RuntimeError("deployment-health.txt je prázdný nebo neplatný")'''
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 scripts/run_canonical_audit_runtime_v2.py --write-status
          python3 scripts/audit_canonical_content_runtime.py --write-status
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('data/published-content-index.json').read_text(encoding='utf-8'))
          status = json.loads(Path('.github/canonical-content-audit-status.json').read_text(encoding='utf-8'))
          validation = registry.get('validation', {})
          assert registry.get('article_count') == 58, registry.get('article_count')
          assert validation.get('duplicate_urls') == [], validation.get('duplicate_urls')
          assert validation.get('duplicate_fingerprints') == [], validation.get('duplicate_fingerprints')
          assert validation.get('archive_count') == 58, validation.get('archive_count')
          assert validation.get('rss_count') == 58, validation.get('rss_count')
          assert validation.get('sitemap_all_articles_present') is True
          assert status.get('status') == 'ok', status
          assert status.get('archive_pages') == 5, status
          assert status.get('rss_count') == 58, status
          assert status.get('news_count') == 9, status
          print('CANONICAL_LIVE_AUDIT_OK articles=58 archive_pages=5 rss=58 sitemap_all=true news=9 duplicates=0')
          PY

      - name: Zapsat výsledek do PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `✅ Stránkování i úplný živý kanonický audit jsou v pořádku. Strany 1–5 jsou veřejně funkční a evidence nemá duplicity. Run ${context.runId}.`
                : `❌ Oprava nebo úplný živý audit selhal. Run ${context.runId}.`
            });
