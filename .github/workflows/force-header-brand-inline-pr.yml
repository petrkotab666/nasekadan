name: Nouzově vynutit celý název Naše Kadaň

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: force-header-brand-inline-pr
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.title == 'SPUSTIT PŘÍMOU OPRAVU NÁZVU NAŠE KADAŇ'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      ARTICLE_FILE: clanky/slovan-druhy-pokus.html
      ARTICLE_URL: https://nasekadan.cz/clanky/slovan-druhy-pokus.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vložit opravu přímo do článku
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          article = Path('clanky/slovan-druhy-pokus.html')
          text = article.read_text(encoding='utf-8')
          inline = '''
  <style id="HEADER-BRAND-INLINE-20260805">
    header[data-site-header="v1"] .head .logo > span:not(.logo-mark){color:#13232d!important}
    header[data-site-header="v1"] .head .logo > span:not(.logo-mark) b{color:#a9232b!important}
  </style>
'''
          if 'HEADER-BRAND-INLINE-20260805' not in text:
              text = text.replace('</head>', inline + '</head>', 1)
              article.write_text(text, encoding='utf-8', newline='\n')

          rule = '''

/* HEADER-BRAND-VISIBILITY-20260805 */
.head .logo > span:not(.logo-mark){color:var(--ink,#13232d)!important}
.head .logo > span:not(.logo-mark) b{color:var(--red,#a9232b)!important}
'''
          for name in ('style.css', 'footer.css'):
              path = Path(name)
              css = path.read_text(encoding='utf-8')
              if 'HEADER-BRAND-VISIBILITY-20260805' not in css:
                  path.write_text(css.rstrip() + rule + '\n', encoding='utf-8', newline='\n')

          final = article.read_text(encoding='utf-8')
          assert 'HEADER-BRAND-INLINE-20260805' in final
          assert '<span>NAŠE <b>KADAŇ</b></span>' in final
          PY

      - name: Uložit změnu do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – přímá oprava hlavičky'
          git config user.email 'info@nasekadan.cz'
          git add "$ARTICLE_FILE" style.css footer.css
          if ! git diff --cached --quiet; then git commit -m 'Vynutit celý název Naše Kadaň přímo v článku'; fi
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          test "$pushed" = 1

      - name: Nasadit článek a styly na OVH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          mkdir -p "$RUNNER_TEMP/fix/clanky"
          cp "$ARTICLE_FILE" "$RUNNER_TEMP/fix/clanky/slovan-druhy-pokus.html"
          cp style.css footer.css "$RUNNER_TEMP/fix/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/fix" ubuntu@57.129.43.215:/tmp/header-brand-inline-fix
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/header-brand-inline-fix
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/clanky"
          sudo install -m 0644 "$src/clanky/slovan-druhy-pokus.html" "$root/clanky/slovan-druhy-pokus.html"
          sudo install -m 0644 "$src/style.css" "$root/style.css"
          sudo install -m 0644 "$src/footer.css" "$root/footer.css"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky
            sudo docker cp "$src/clanky/slovan-druhy-pokus.html" nasekadan-web:/usr/share/nginx/html/clanky/slovan-druhy-pokus.html
            sudo docker cp "$src/style.css" nasekadan-web:/usr/share/nginx/html/style.css
            sudo docker cp "$src/footer.css" nasekadan-web:/usr/share/nginx/html/footer.css
          fi
          rm -rf "$src"
          REMOTE

      - name: Veřejně ověřit opravu bez závislosti na cache
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            q="${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            curl -4 -kfsS -L --max-time 40 "$ARTICLE_URL?v=$q" -o /tmp/article.html || true
            if grep -Fq 'HEADER-BRAND-INLINE-20260805' /tmp/article.html \
              && grep -Fq '<span>NAŠE <b>KADAŇ</b></span>' /tmp/article.html \
              && grep -Fq 'color:#13232d!important' /tmp/article.html; then
              ok=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$ok" = 1

      - name: Zapsat výsledek do PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: ok ? `Přímá oprava byla nasazena a veřejně ověřena. Run ${context.runId}.` : `Přímá oprava selhala. Run ${context.runId}.`});
