name: Zastavit duplicitní zprávu o interní ambulanci
on:
  push:
    branches: [main]
    paths: ['.github/publish-internal-ambulance-trigger.txt']
  workflow_dispatch:
concurrency:
  group: publish-internal-ambulance
  cancel-in-progress: true
jobs:
  stop-duplicate:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Zpráva o uzavření interní ambulance už na webu existuje; duplicitní publikace byla zastavena.'
