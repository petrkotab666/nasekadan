name: Nasadit aktuální přehled srpnových omezení ordinací
run-name: Nasadit redakční verzi přehledu ordinací bez regenerování starého článku

on:
  push:
    branches: [main]
    paths:
      - '.github/gp-august-live-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SLUG: prakticti-lekari-nemocnice-kadan-srpen-2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přesnou verzi z main
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo chown -R ubuntu:ubuntu /opt/nasekadan
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          sudo find . -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          SHA="$(git rev-parse HEAD)"

          # Nasazuje se výhradně hotová redakční verze z main. Starý generátor
          # publish_gp_august_limits.py se zde záměrně nespouští.
          sudo install -d -m 0755 /var/www/nasekadan
          sudo find /var/www/nasekadan -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar \
            --exclude='.git' --exclude='.github' --exclude='Dockerfile' \
            --exclude='docker-compose.yml' --exclude='nginx' --exclude='scripts' \
            --exclude='deploy' -C /opt/nasekadan -cf - . \
            | sudo tar -C /var/www/nasekadan -xf -
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=static-main\n' \
            "$SHA" "$(date -u +%FT%TZ)" \
            | sudo tee /var/www/nasekadan/deployment-health.txt >/dev/null
          sudo chmod -R a+rX /var/www/nasekadan

          page="$(curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 \
            "https://nasekadan.cz/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html?deploy=$SHA")"
          grep -Fq 'Další potvrzená omezení' <<<"$page"
          grep -Fq 'Ordinace MUDr. Kuraková, s.r.o.' <<<"$page"
          grep -Fq 'Očkovací centrum' <<<"$page"
          REMOTE

      - name: Veřejně ověřit aktuální článek
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          stamp="$(date +%s)"
          for attempt in $(seq 1 24); do
            article="$(curl -4 -kfsS --max-time 25 \
              "https://nasekadan.cz/clanky/${SLUG}.html?v=$stamp-$attempt" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 \
              "https://nasekadan.cz/clanky/?v=$stamp-$attempt" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 \
              "https://nasekadan.cz/rss.xml?v=$stamp-$attempt" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 \
              "https://nasekadan.cz/sitemap.xml?v=$stamp-$attempt" 2>/dev/null || true)"
            health="$(curl -4 -kfsS --max-time 25 \
              "https://nasekadan.cz/deployment-health.txt?v=$stamp-$attempt" 2>/dev/null || true)"
            if grep -Fq 'Další potvrzená omezení' <<<"$article" \
              && grep -Fq 'Ordinace MUDr. Kuraková, s.r.o.' <<<"$article" \
              && grep -Fq 'Očkovací centrum' <<<"$article" \
              && grep -Fq "${SLUG}.html" <<<"$archive" \
              && grep -Fq "${SLUG}.html" <<<"$rss" \
              && grep -Fq "${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "source=$SHA" <<<"$health"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const title = '[NASAZENÍ ORDINACÍ] Aktuální rozšířený přehled';
            const ok = process.env.DEPLOY === 'success' && process.env.VERIFY === 'success';
            const body = [
              `## ${ok ? 'ÚSPĚCH' : 'NEÚSPĚCH'}`,
              '',
              `- Serverový deploy: ${process.env.DEPLOY || 'skipped'}`,
              `- Veřejné ověření: ${process.env.VERIFY || 'skipped'}`,
              `- Commit: \`${context.sha}\``,
              `- Běh: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              ok ? 'Živý článek obsahuje rozšířený přehled více ordinací.' : 'Nasazení nebo veřejná kontrola neprošly.'
            ].join('\n');
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100
            });
            const existing = all.find(i => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body, state: ok ? 'closed' : 'open'
              });
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
              if (ok) await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: created.data.number, state: 'closed'
              });
            }
