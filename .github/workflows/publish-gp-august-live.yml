name: Zveřejnit srpnové omezení praktických lékařů

on:
  push:
    branches: [main]
    paths:
      - '.github/gp-august-live-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-gp-august-live
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SLUG: prakticti-lekari-nemocnice-kadan-srpen-2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Připravit článek a sociální kartu
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python scripts/publish_gp_august_limits.py
          python scripts/normalize_footers.py --write --check
          python scripts/normalize_articles.py --write --check
          python scripts/enable_heat_feed.py
          python scripts/generate_social_cards.py --write --check
          grep -Fq 'Praktičtí lékaři v Nemocnici Kadaň omezí v srpnu provoz' "clanky/${SLUG}.html"
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml

      - name: Uložit vygenerovaný veřejný obsah
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "clanky/${SLUG}.html" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml production-content-manifest.json social scripts/enforce_homepage_latest_order.py scripts/ensure_kolobezky_order.py scripts/enforce_production_article_order.py 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Zveřejnit omezení praktických lékařů v srpnu'
            git push origin HEAD:main
          fi

      - name: Připravit SSH klíč
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit článek bez přepsání ostatního živého obsahu
        id: deploy
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          test -f scripts/publish_gp_august_limits.py
          sudo env NASEKADAN_ROOT=/var/www/nasekadan python3 scripts/publish_gp_august_limits.py
          sudo cp "clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html" "/var/www/nasekadan/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html"
          sudo mkdir -p /var/www/nasekadan/social
          sudo cp -a social/. /var/www/nasekadan/social/
          sudo chmod -R a+rX /var/www/nasekadan
          grep -Fq 'Pět pracovních dnů se překryjí dovolené' /var/www/nasekadan/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html
          grep -Fq '/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html' /var/www/nasekadan/index.html
          grep -Fq '/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html' /var/www/nasekadan/clanky/index.html
          grep -Fq 'https://nasekadan.cz/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html' /var/www/nasekadan/rss.xml
          grep -Fq 'https://nasekadan.cz/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html' /var/www/nasekadan/sitemap.xml
          REMOTE

      - name: Ověřit veřejný web
        id: verify
        run: |
          set -euo pipefail
          article_url='https://nasekadan.cz/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html'
          for attempt in $(seq 1 18); do
            suffix="?gp=${GITHUB_SHA}-${attempt}"
            home="$(curl -kfsS --max-time 20 "https://nasekadan.cz/${suffix}" || true)"
            article="$(curl -kfsS --max-time 20 "${article_url}${suffix}" || true)"
            archive="$(curl -kfsS --max-time 20 "https://nasekadan.cz/clanky/${suffix}" || true)"
            rss="$(curl -kfsS --max-time 20 "https://nasekadan.cz/rss.xml${suffix}" || true)"
            sitemap="$(curl -kfsS --max-time 20 "https://nasekadan.cz/sitemap.xml${suffix}" || true)"
            if grep -Fq 'prakticti-lekari-nemocnice-kadan-srpen-2026.html' <<<"$home" \
              && grep -Fq 'Pět pracovních dnů se překryjí dovolené' <<<"$article" \
              && grep -Fq '10.–14. 8.' <<<"$article" \
              && grep -Fq 'prakticti-lekari-nemocnice-kadan-srpen-2026.html' <<<"$archive" \
              && grep -Fq 'prakticti-lekari-nemocnice-kadan-srpen-2026.html' <<<"$rss" \
              && grep -Fq 'prakticti-lekari-nemocnice-kadan-srpen-2026.html' <<<"$sitemap"; then
              image="$(grep -oE 'https://nasekadan.cz/social/[^\" ]+\.png' <<<"$article" | head -n1 || true)"
              test -n "$image"
              curl -kfsS --max-time 20 "${image}?gp=${GITHUB_SHA}" -o /dev/null
              exit 0
            fi
            sleep 10
          done
          exit 30

      - name: Zapsat výsledek publikace
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'gp-august-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              server_deploy: process.env.DEPLOY_OUTCOME || 'skipped',
              public_verification: process.env.VERIFY_OUTCOME || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat stav publikace ambulancí: ${status.status}`,
              content,
              ...(sha ? { sha } : {})
            });
