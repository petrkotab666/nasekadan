name: Cílené hledání příloh Hossner a audit 2026-08-02

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-hossner-attachments-20260802.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-hossner-attachments-20260802
  cancel-in-progress: false

jobs:
  search-public-files:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Instalovat nástroje
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ces
          python3 -m pip install --quiet requests

      - name: Prohledat veřejný filemanager města a známé zdroje
        shell: bash
        run: |
          set -euo pipefail
          OUT=.github/research/hossner-attachments-20260802
          rm -rf "$OUT"
          mkdir -p "$OUT"/{documents,text,metadata}
          cat > /tmp/search.py <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time
          from pathlib import Path
          import requests

          OUT=Path('.github/research/hossner-attachments-20260802')
          for d in ('documents','text','metadata'): (OUT/d).mkdir(parents=True,exist_ok=True)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (compatible; NaseKadan public-document-research/1.0)','Accept-Language':'cs,en;q=0.7'})

          terms=[
            'hossner','nemocnice kadaň','nemocnice kadan','kritéria hodnocení','kriteria hodnoceni',
            'hodnocení ředitele','hodnoceni reditele','výbor pro audit','vybor pro audit',
            'zpráva jednání výboru','zprava jednani vyboru','dodatečná zpráva','dodatecna zprava',
            'pracovní smlouva','pracovni smlouva','11.11.2016','odměna ředitele','odmena reditele',
            'mzdové','mzdove','deloitte','právní prověrka','pravni proverka','shrnutí','shrnuti',
            '614/2024','55/2026','důvěrné','duverne','agis audit'
          ]
          patterns=[re.compile(re.escape(x),re.I) for x in terms]
          hits=[]; checked=[]; errors=[]; seen_hash=set()

          def get(url, method='GET', timeout=25):
              for attempt in range(3):
                  try:
                      r=S.request(method,url,timeout=timeout,allow_redirects=True)
                      if r.status_code in (429,500,502,503,504):
                          time.sleep(1.5*(attempt+1)); continue
                      return r
                  except Exception as e:
                      if attempt==2: raise
                      time.sleep(1.2*(attempt+1))
              return None

          def extract_pdf(path:Path):
              q=subprocess.run(['pdftotext','-layout',str(path),'-'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,check=False)
              text=q.stdout or ''
              if len(re.sub(r'\s+','',text))<80 and path.stat().st_size<12_000_000:
                  tmp=Path('/tmp/ocr_'+path.stem); tmp.mkdir(exist_ok=True)
                  subprocess.run(['pdftoppm','-f','1','-l','8','-r','130','-png',str(path),str(tmp/'p')],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                  parts=[]
                  for img in sorted(tmp.glob('p-*.png')):
                      z=subprocess.run(['tesseract',str(img),'stdout','-l','ces+eng','--psm','6'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,check=False)
                      parts.append(z.stdout)
                  text='\n'.join(parts)
              return text

          centers=[3895222,4957305,3805054,3750240,4871082]
          ranges=[]
          for c in centers:
              ranges.append((c-360,c+360))
          ids=[]
          for lo,hi in ranges: ids.extend(range(lo,hi+1))
          ids=sorted(set(ids))

          for n,fid in enumerate(ids,1):
              url=f'https://www.mesto-kadan.cz/filemanager/files/{fid}.pdf'
              try:
                  r=get(url,'HEAD',12)
                  status=r.status_code if r is not None else 0
                  ctype=(r.headers.get('content-type','') if r is not None else '').lower()
                  size=int(r.headers.get('content-length','0') or 0) if r is not None else 0
                  if status!=200 or (size and size<500):
                      if n%120==0: time.sleep(.15)
                      continue
                  g=get(url,'GET',45)
                  if g is None or g.status_code!=200 or not g.content.startswith(b'%PDF') or len(g.content)>20_000_000:
                      continue
                  sha=hashlib.sha256(g.content).hexdigest()
                  if sha in seen_hash: continue
                  seen_hash.add(sha)
                  p=OUT/'documents'/f'{fid}.pdf'; p.write_bytes(g.content)
                  text=extract_pdf(p)
                  tp=OUT/'text'/f'{fid}.txt'; tp.write_text(text,encoding='utf-8',errors='replace')
                  found=[t for t,rx in zip(terms,patterns) if rx.search(text)]
                  rec={'file_id':fid,'url':url,'bytes':len(g.content),'sha256':sha,'hits':found,'chars':len(text)}
                  checked.append(rec)
                  if found:
                      snippets=[]
                      low=text.lower()
                      for term in found[:20]:
                          i=low.find(term.lower())
                          snippets.append(re.sub(r'\s+',' ',text[max(0,i-350):i+1050]))
                      rec['snippets']=snippets
                      hits.append(rec)
                  else:
                      p.unlink(missing_ok=True); tp.unlink(missing_ok=True)
              except Exception as e:
                  errors.append({'file_id':fid,'error':repr(e)})
              if n%80==0: time.sleep(.2)

          known={
            3895222:'rada-2024-09-26',
            4957305:'rada-2026-02-12',
            3805054:'rada-2024',
            3837143:'rada-2024-09-05'
          }
          for fid,label in known.items():
              url=f'https://www.mesto-kadan.cz/filemanager/files/{fid}.pdf'
              try:
                  g=get(url,'GET',45)
                  if g is None or g.status_code!=200 or not g.content.startswith(b'%PDF'): continue
                  p=OUT/'documents'/f'known-{fid}-{label}.pdf'; p.write_bytes(g.content)
                  text=extract_pdf(p)
                  (OUT/'text'/f'known-{fid}-{label}.txt').write_text(text,encoding='utf-8',errors='replace')
              except Exception as e: errors.append({'known':fid,'error':repr(e)})

          (OUT/'metadata/hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'metadata/checked.json').write_text(json.dumps(checked,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'metadata/errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2),encoding='utf-8')

          lines=['# Cílené hledání příloh – Hossner / audit','',f'- Rozsah prověřených ID: **{len(ids)}**',f'- Platných unikátních PDF: **{len(checked)}**',f'- Dokumentů s relevantními výrazy: **{len(hits)}**',f'- Chyb: **{len(errors)}**','']
          for h in hits:
              lines += [f"## File ID {h['file_id']}",f"- URL: `{h['url']}`",f"- Výrazy: {', '.join(h['hits'])}",f"- Soubor: `documents/{h['file_id']}.pdf`",'']
              for s in h.get('snippets',[])[:8]: lines += ['> '+s[:1400],'']
          if not hits: lines += ['V prohledaných veřejných sousedních ID nebyla nalezena hledaná příloha. To znamená, že přílohy buď nebyly veřejně uloženy, mají jiné ID či formát, nebo k nim veřejný endpoint nevede.']
          (OUT/'README.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:30]))
          PY
          python3 /tmp/search.py

      - name: Uložit výsledky do repozitáře
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/research/hossner-attachments-20260802
          if ! git diff --cached --quiet; then
            git commit -m 'Výsledky cíleného hledání příloh Hossner a audit'
            git push origin main
          fi

# automation rerun 2026-08-02T11:20Z
