name: Přímé nasazení srpnového programu galerií
run-name: Nasadit článek o srpnových výstavách

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-august-galleries-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vytvořit přehledy a sociální obrázek
        run: |
          set -euo pipefail
          pip install --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/normalize_footers.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/enforce_article_visibility.py
          python3 scripts/ensure_all_published_articles_in_rss.py
          python3 scripts/sort_articles_chronologically.py
          python3 scripts/enforce_latest_homepage_hero.py
          python3 scripts/prepare_discovery.py
          python3 scripts/clean_sitemap_technical_entries.py
          grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' index.html
          grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' clanky/index.html
          grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' rss.xml
          grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' sitemap.xml

      - name: Uložit výsledky do repozitáře
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html clanky/index.html clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html rss.xml sitemap.xml social/ llms.txt llms-full.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Zařadit srpnový program galerií na web'
            git push origin HEAD:main || true
          fi

      - name: Připravit SSH
        run: |
          set -euo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"; break; fi
          done
          test -s "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"

      - name: Přenést hotové soubory na OVH
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/galleries-release.tgz" \
            index.html clanky/index.html clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html \
            rss.xml sitemap.xml social llms.txt llms-full.txt
          scp -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$RUNNER_TEMP/galleries-release.tgz" ubuntu@57.129.43.215:/tmp/galleries-release.tgz
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          tmp=$(mktemp -d)
          tar -xzf /tmp/galleries-release.tgz -C "$tmp"
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 "$tmp/index.html" /var/www/nasekadan/index.html
          sudo install -m 0644 "$tmp/clanky/index.html" /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 "$tmp/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html" /var/www/nasekadan/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html
          sudo install -m 0644 "$tmp/rss.xml" /var/www/nasekadan/rss.xml
          sudo install -m 0644 "$tmp/sitemap.xml" /var/www/nasekadan/sitemap.xml
          sudo install -m 0644 "$tmp/llms.txt" /var/www/nasekadan/llms.txt
          sudo install -m 0644 "$tmp/llms-full.txt" /var/www/nasekadan/llms-full.txt
          sudo cp -a "$tmp/social/." /var/www/nasekadan/social/
          sudo chmod -R a+rX /var/www/nasekadan
          sudo nginx -t
          sudo systemctl reload nginx
          rm -rf "$tmp" /tmp/galleries-release.tgz
          REMOTE

      - name: Veřejná kontrola
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 24); do
            token="${GITHUB_SHA}-${attempt}-$(date +%s)"
            curl -fsS --max-time 20 "https://nasekadan.cz/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html?g=$token" -o /tmp/a.html || true
            curl -fsS --max-time 20 "https://nasekadan.cz/?g=$token" -o /tmp/h.html || true
            curl -fsS --max-time 20 "https://nasekadan.cz/rss.xml?g=$token" -o /tmp/r.xml || true
            if grep -Fq 'Srpen v kadaňských galeriích nabídne houby' /tmp/a.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/h.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/r.xml; then
              success=true
              break
            fi
            sleep 8
          done
          test "$success" = true
