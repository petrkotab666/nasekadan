name: Opravit předání domény do společných statistik

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-multisite-hit-domain.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH
        shell: bash
        run: |
          set -Eeuo pipefail; umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"; if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"; break; fi
          done
          test -s "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"
      - name: Opravit Nginx proxy a vše ověřit
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'sudo bash -s' > "$RUNNER_TEMP/out.txt" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          SNIPPET=/etc/nginx/snippets/nasekadan-multisite-collector.conf
          test -s "$SNIPPET"
          cp -a "$SNIPPET" "$SNIPPET.bak-$(date +%Y%m%d-%H%M%S)"
          python3 - "$SNIPPET" <<'PY'
          from pathlib import Path
          import re,sys
          path=Path(sys.argv[1]); text=path.read_text(encoding='utf-8')
          pattern=r'''location = /_nkstats/hit\.gif \{.*?\n\}'''
          replacement='''location = /_nkstats/hit.gif {
            proxy_http_version 1.1;
            proxy_set_header Host $arg_site;
            proxy_set_header X-Stats-Host $arg_site;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:3226;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
          }'''
          new,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if count!=1: raise SystemExit('Blok hit.gif nebyl jednoznačně nalezen')
          path.write_text(new,encoding='utf-8')
          PY
          nginx -t
          systemctl reload nginx

          code=$(curl -kLsS --max-time 12 --resolve nasekadan.cz:443:127.0.0.1 \
            -o /tmp/hit.gif -w '%{http_code}' \
            'https://nasekadan.cz/_nkstats/hit.gif?site=verified-stats.invalid&path=%2Fovereni&ref=')
          echo "HIT_CODE=$code HIT_SIZE=$(wc -c < /tmp/hit.gif)"
          test "$code" = 200
          test "$(wc -c < /tmp/hit.gif)" -gt 20

          AUTH_USER=$(sudo cut -d: -f1 /opt/multisite-stats/.htpasswd | head -n1)
          AUTH_PASS=''
          if [[ -s /opt/nasekadan-stats/access.txt ]]; then AUTH_PASS=$(sed -n '1{s/^[^:]*:[[:space:]]*//;p;}' /opt/nasekadan-stats/access.txt); fi
          if [[ -z "$AUTH_PASS" && -s /opt/nasekadan-stats/login.txt ]]; then AUTH_PASS=$(sed -n -E 's/^Heslo:[[:space:]]*//p' /opt/nasekadan-stats/login.txt | head -n1); fi
          test -n "$AUTH_USER" -a -n "$AUTH_PASS"
          code=$(curl -kLsS --max-time 12 --resolve nasekadan.cz:443:127.0.0.1 \
            -u "$AUTH_USER:$AUTH_PASS" -o /tmp/dash.html -w '%{http_code}' \
            'https://nasekadan.cz/statistiky-webu/?site=verified-stats.invalid')
          echo "DASH_CODE=$code DASH_SIZE=$(wc -c < /tmp/dash.html)"
          test "$code" = 200
          grep -q 'Statistiky webu verified-stats.invalid' /tmp/dash.html
          grep -q 'pages-200' /tmp/dash.html
          echo 'OVERENO: HTTPS tracker, zápis návštěvy a chráněný přehled fungují.'
          REMOTE
      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const fs=require('fs'); let out=''; try{out=fs.readFileSync(`${process.env.RUNNER_TEMP}/out.txt`,'utf8')}catch{}
            const ok=process.env.OUTCOME==='success';
            const issue=await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:`[MULTISITE HIT DOMAIN] ${ok?'Úspěch':'Selhání'} ${new Date().toISOString()}`,body:'```text\n'+out.slice(-40000).replace(/```/g,'---')+'\n```'});
            if(ok) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.data.number,state:'closed',state_reason:'completed'});
      - name: Selhat při neověřeném nasazení
        if: steps.deploy.outcome != 'success'
        run: exit 1
