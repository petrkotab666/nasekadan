name: Odpojit GitHub Pages od produkční domény

on:
  push:
    branches: [main]
    paths:
      - '.github/disable-pages-production-domain-trigger.txt'
      - '.github/workflows/disable-pages-production-domain.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/disable-pages-production-domain-pr-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  pull-requests: write

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vypnout Pages a odstranit vlastní doménu
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before=$(curl -sS -o /tmp/pages-before.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")

          code=$(curl -sS -o /tmp/pages-delete.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")

          cat /tmp/pages-before.json || true
          cat /tmp/pages-delete.json || true
          if [ "$code" != 204 ] && [ "$code" != 404 ]; then
            echo "Vypnutí GitHub Pages selhalo: HTTP $code" >&2
            exit 1
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "delete=$code" >> "$GITHUB_OUTPUT"
          echo 'GitHub Pages už nemůže obsluhovat doménu nasekadan.cz.'

      - name: Zapsat výsledek do PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BEFORE: ${{ steps.pages.outputs.before }}
          DELETE: ${{ steps.pages.outputs.delete }}
        with:
          script: |
            const body = [
              '## Odpojení GitHub Pages od produkční domény',
              '',
              `- stav před vypnutím: HTTP ${process.env.BEFORE || 'neznámý'}`,
              `- výsledek DELETE /pages: HTTP ${process.env.DELETE || 'neznámý'}`,
              '',
              'Produkční doména nyní smí být obsluhována pouze z OVH.'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
