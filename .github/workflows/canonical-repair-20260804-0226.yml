name: Oprava kanonické evidence 2026-08-04 02:26

on:
  push:
    paths:
      - '.github/workflows/canonical-repair-20260804-0226.yml'

permissions:
  contents: write

concurrency:
  group: canonical-published-index-sync
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ověřit živý web a opravit evidenci
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import collections, datetime, hashlib, html, json, re, ssl, subprocess, time, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          BASE='https://nasekadan.cz'
          REG=Path('data/published-content-index.json')
          DIAG=Path('data/canonical-audit-diagnostic-20260804-0222.json')
          ctx=ssl._create_unverified_context()

          def fetch(path):
              url=path if path.startswith('http') else BASE+path
              last=None
              for attempt in range(8):
                  try:
                      sep='&' if '?' in url else '?'
                      req=urllib.request.Request(url+sep+'repair='+str(time.time_ns()), headers={'User-Agent':'NaseKadanCanonicalRepair/2.2','Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
                      with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
                          return r.read().decode('utf-8',errors='replace')
                  except Exception as exc:
                      last=exc; time.sleep(2+attempt)
              raise RuntimeError(f'fetch failed {url}: {last}')

          def unique(seq): return list(dict.fromkeys(seq))
          def links(page):
              paths=re.findall(r'href=["\'](/clanky/[^"\'#?]+\.html)["\']',page,re.I)
              return unique([BASE+p for p in paths if '/parts/' not in p and not re.search(r'/strana-\d+\.html$',p)])
          def h1(page):
              m=re.search(r'<h1\b[^>]*>(.*?)</h1>',page,re.I|re.S)
              return '' if not m else ' '.join(html.unescape(re.sub(r'<[^>]+>','',m.group(1))).split())

          home=fetch('/')
          first=fetch('/clanky/')
          nums=sorted({int(x) for x in re.findall(r'/clanky/strana-(\d+)\.html',first)})
          pages=['/clanky/']+[f'/clanky/strana-{n}.html' for n in nums]
          archive='\n'.join([first]+[fetch(p) for p in pages[1:]])
          rss=fetch('/rss.xml'); sitemap=fetch('/sitemap.xml'); news=fetch('/news-sitemap.xml'); health=fetch('/deployment-health.txt')
          assert health.strip(), 'deployment-health.txt je prázdný.'

          home_urls=links(home); archive_urls=links(archive)
          rr=ET.fromstring(rss)
          rss_urls=unique([(i.findtext('link') or '').strip() for i in rr.findall('.//item') if (i.findtext('link') or '').strip()])
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sr=ET.fromstring(sitemap)
          sitemap_urls=unique([(n.text or '').strip() for n in sr.findall('.//s:loc',ns) if '/clanky/' in (n.text or '') and (n.text or '').endswith('.html') and '/parts/' not in (n.text or '') and not re.search(r'/strana-\d+\.html$',(n.text or ''))])
          nr=ET.fromstring(news)
          news_urls=unique([(n.text or '').strip() for n in nr.findall('.//s:loc',ns) if (n.text or '').strip()])

          data=json.loads(REG.read_text(encoding='utf-8')); articles=data['articles']
          registry_urls=[a['url'] for a in articles]
          fps=[a['fingerprint'] for a in articles]
          duplicate_urls=sorted([u for u,n in collections.Counter(registry_urls).items() if n>1])
          duplicate_fingerprints=sorted([f for f,n in collections.Counter(fps).items() if n>1])
          assert not duplicate_urls, duplicate_urls
          assert not duplicate_fingerprints, duplicate_fingerprints
          assert set(registry_urls)==set(archive_urls), {'missing_in_registry':sorted(set(archive_urls)-set(registry_urls)),'missing_in_archive':sorted(set(registry_urls)-set(archive_urls))}
          assert set(registry_urls)==set(rss_urls), {'missing_in_rss':sorted(set(registry_urls)-set(rss_urls)),'extra_in_rss':sorted(set(rss_urls)-set(registry_urls))}
          assert set(registry_urls)==set(sitemap_urls), {'missing_in_sitemap':sorted(set(registry_urls)-set(sitemap_urls)),'extra_in_sitemap':sorted(set(sitemap_urls)-set(registry_urls))}
          assert rss_urls==archive_urls, 'Pořadí RSS se liší od archivu.'

          changed=[]; metadata=[]
          for a in articles:
              page=fetch(a['url'])
              actual=h1(page)
              assert actual==a['h1'], f'Neshoda H1: {a["url"]}: {actual!r} != {a["h1"]!r}'
              status={'homepage':a['url'] in home_urls,'archive':a['url'] in archive_urls,'rss':a['url'] in rss_urls,'sitemap':a['url'] in sitemap_urls,'news_sitemap':a['url'] in news_urls}
              if a.get('status')!=status: metadata.append({'url':a['url'],'field':'status'})
              a['status']=status; a['publication_status']='published'
              path=a.get('source_path')
              if path:
                  latest=subprocess.check_output(['git','log','-1','--format=%H','--',path],text=True).strip()
                  if latest and latest!=a.get('source_commit'):
                      changed.append({'url':a['url'],'from':a.get('source_commit',''),'to':latest})
                      a['source_commit']=latest
              m=re.search(r'<meta[^>]+property=["\']article:modified_time["\'][^>]+content=["\']([^"\']+)',page,re.I)
              if not m: m=re.search(r'"dateModified"\s*:\s*"([^"]+)"',page)
              if m and a.get('modified_at')!=m.group(1):
                  metadata.append({'url':a['url'],'field':'modified_at','to':m.group(1)})
                  a['modified_at']=m.group(1)

          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          trigger=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          hm=re.search(r'^source=(.+)$',health,re.M); health_source=hm.group(1).strip() if hm else ''
          data['generated_at']=now; data['source_commit']=trigger; data['article_count']=len(articles)
          v=data.setdefault('validation',{})
          v.update({
            'homepage_count':len(home_urls),'archive_count':len(archive_urls),'archive_page_count':len(pages),'rss_count':len(rss_urls),
            'sitemap_all_articles_present':set(registry_urls)==set(sitemap_urls),'news_sitemap_recent_count':len(news_urls),
            'deployment_health':'verified_nonempty','deployment_health_source':health_source,'deployment_health_status_field_present':'status=ok' in health,
            'required_fields_complete':all(all(k in a for k in ('title','h1','url','published_at','modified_at','persons','organizations','places','cases','topics','fingerprint','status','source_commit')) for a in articles),
            'duplicate_urls':duplicate_urls,'duplicate_fingerprints':duplicate_fingerprints,'per_article_source_commits':all(bool(a.get('source_commit')) for a in articles),
            'public_audit_at':now,'public_audit_sha256':hashlib.sha256((home+archive+rss+sitemap+news+health).encode('utf-8')).hexdigest(),
            'repair_pending_public_verification':False,'rss_order_matches_archive':True,
            'public_repair_verification':{'method':'github-actions-live-canonical-repair-paginated-archive-v2.2','homepage_articles':len(home_urls),'archive_articles':len(archive_urls),'archive_pages':len(pages),'rss_articles':len(rss_urls),'sitemap_articles':len(sitemap_urls),'news_sitemap_articles':len(news_urls),'all_public_h1_checked':True,'deployment_health_nonempty':True,'deployment_health_source':health_source,'completed_at':now},
            'last_registry_refresh':{'reason':'synchronize six hospital-series article source commits after later footer and navigation edits; re-audit all live publication channels','trigger_commit':trigger,'classification':'registry_consistency_repair','changed_source_commits':changed,'changed_metadata':metadata,'homepage_articles':len(home_urls),'archive_articles':len(archive_urls),'archive_pages':len(pages),'rss_articles':len(rss_urls),'sitemap_articles':len(sitemap_urls),'news_sitemap_articles':len(news_urls),'completed_at':now}
          })
          REG.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if DIAG.exists(): DIAG.unlink()
          print(json.dumps({'changed_source_commits':changed,'changed_metadata':metadata,'homepage':len(home_urls),'archive':len(archive_urls),'rss':len(rss_urls),'sitemap':len(sitemap_urls),'news_sitemap':len(news_urls),'deployment_health_source':health_source,'deployment_health_status_field_present':'status=ok' in health},ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/published-content-index.json
          git add -u data/canonical-audit-diagnostic-20260804-0222.json || true
          git commit -m 'Opravit kanonickou evidenci zdrojových commitů [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main
            if [ "$attempt" = 4 ]; then exit 1; fi
          done
      - name: Odstranit opravný workflow
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f .github/workflows/canonical-repair-20260804-0226.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add .github/workflows/canonical-repair-20260804-0226.yml
            git commit -m 'Odstranit dokončenou opravu kanonické evidence [skip ci]'
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main
              if [ "$attempt" = 4 ]; then exit 1; fi
            done
          fi
