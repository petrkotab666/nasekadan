name: Publikovat tropické dny – čisté nasazení

on:
  push:
    branches:
      - publish/heat-article-20260728-clean
    paths:
      - .github/workflows/publish-heat-article-clean.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/heat-article-20260728-clean
          fetch-depth: 0

      - name: Přenést článek a fotografie
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clanky obrazky
          SRC="https://raw.githubusercontent.com/petrkotab666/nasekadan/ca8752fb35d42492b6d8628c09b8fee92fa4b5db"
          curl --fail --location --retry 3 "$SRC/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html" -o clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html
          curl --fail --location --retry 3 "$SRC/obrazky/koupaliste-kadan-budova-2026.jpg" -o obrazky/koupaliste-kadan-budova-2026.webp
          curl --fail --location --retry 3 "$SRC/obrazky/koupaliste-kadan-oteviraci-doba-2026.jpg" -o obrazky/koupaliste-kadan-oteviraci-doba-2026.webp
          sed -i 's/koupaliste-kadan-budova-2026\.jpg/koupaliste-kadan-budova-2026.webp/g; s/koupaliste-kadan-oteviraci-doba-2026\.jpg/koupaliste-kadan-oteviraci-doba-2026.webp/g' clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html
          file obrazky/koupaliste-kadan-budova-2026.webp
          file obrazky/koupaliste-kadan-oteviraci-doba-2026.webp
          test -s obrazky/koupaliste-kadan-budova-2026.webp
          test -s obrazky/koupaliste-kadan-oteviraci-doba-2026.webp

      - name: Aktualizovat webové vazby
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          slug = 'kadan-tropicke-dny-koupaliste-cervenec-2026'
          rel = f'/clanky/{slug}.html'
          absolute = 'https://nasekadan.cz' + rel

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8', newline='\n')

          # Titulní stránka
          p = Path('index.html')
          h = read(p)
          hero = '''<article class="lead" data-heat-article-hero>
                <div class="photo" style="background:linear-gradient(rgba(14,34,45,.18),rgba(14,34,45,.58)),url('/obrazky/koupaliste-kadan-budova-2026.webp') center/cover no-repeat"><span>POČASÍ · PRAKTICKÁ KADAŇ</span><strong>AŽ 35 °C</strong></div>
                <div class="copy">
                  <small>KADAŇ · 28. 07. 2026 · 17:45</small>
                  <h1>Kadaň čekají tropické dny. Ve čtvrtek může být až 35 stupňů</h1>
                  <p>Kde se zchladit, jak bude otevřené koupaliště a proč může být nová skluzavka během největšího horka dočasně uzavřena.</p>
                  <a class="btn" href="/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html">Přečíst praktický přehled →</a>
                </div>
              </article>'''
          h, n = re.subn(r'<article class="lead"[^>]*>.*?</article>', hero, h, count=1, flags=re.S)
          if n != 1: raise SystemExit('Nepodařilo se nahradit hlavní článek.')

          aside = '''<aside class="current-aside">
                <p class="aside-label">DALŠÍ AKTUÁLNÍ ČLÁNEK</p>
                <p class="aside-date">28. 7. 2026 v 11:30</p>
                <h2>Odstávky elektřiny omezí provoz restaurace v Autokempu Prunéřov</h2>
                <p>Ve dvou termínech otevře restaurace až po 18. hodině, potřetí po 16. hodině. Recepce zůstane otevřená.</p>
                <a class="aside-button" href="/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html">Přečíst praktické informace →</a>
                <div class="aside-links">
                  <a href="/clanky/arc-med-nemocnice-kadan.html">ARC-MED za 16 milionů</a>
                  <a href="/clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html">Výcvik hasičů na Nechranicích</a>
                  <a href="/clanky/">Všechny články podle data</a>
                </div>
              </aside>'''
          h, n = re.subn(r'<aside class="current-aside">.*?</aside>', aside, h, count=1, flags=re.S)
          if n != 1: raise SystemExit('Nepodařilo se nahradit pravý panel.')

          card = '''
          <article class="article-card service" data-heat-article-card>
            <div class="visual" style="background:linear-gradient(rgba(19,48,68,.15),rgba(169,35,43,.62)),url('/obrazky/koupaliste-kadan-budova-2026.webp') center/cover no-repeat"><strong>Tropické dny v Kadani</strong></div>
            <div class="article-body"><span class="meta">28. 7. 2026 · 17:45 · Počasí a praktické informace</span><h3>Ve čtvrtek může být až 35 stupňů</h3><p>Otevírací doba koupaliště, upozornění na novou skluzavku a tipy, kde se zchladit.</p><a class="read-more" href="/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html">Přečíst článek →</a></div>
          </article>
          '''
          if 'data-heat-article-card' not in h:
              h = h.replace('    <div class="article-list">', '    <div class="article-list">' + card, 1)
          write(p, h)

          # Archiv
          p = Path('clanky/index.html')
          a = read(p)
          item = '''
          <article class="archive-item service" data-heat-article-card>
            <div class="archive-visual" style="background:linear-gradient(rgba(19,48,68,.15),rgba(169,35,43,.62)),url('/obrazky/koupaliste-kadan-budova-2026.webp') center/cover no-repeat"><strong>Tropické dny v Kadani</strong></div>
            <div class="archive-body"><span class="archive-meta">28. července 2026 v 17:45 · Počasí a praktické informace</span><h2>Kadaň čekají tropické dny. Ve čtvrtek může být až 35 stupňů</h2><p>Otevírací doba koupaliště, upozornění na novou skluzavku a přehled míst, kde se během vedra zchladit.</p><a href="/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html">Přečíst článek →</a></div>
          </article>
          '''
          if 'data-heat-article-card' not in a:
              marker = '  <section class="archive-list" aria-label="Chronologický přehled článků">'
              if marker not in a: raise SystemExit('Archiv nemá očekávaný marker.')
              a = a.replace(marker, marker + item, 1)

          scripts = list(re.finditer(r'<script type="application/ld\+json">(.*?)</script>', a, flags=re.S))
          done = False
          for m in scripts:
              raw = m.group(1)
              if 'CollectionPage' not in raw or 'ItemList' not in raw: continue
              data = json.loads(raw)
              graph = data.get('@graph', [])
              listing = next((x for x in graph if x.get('@type') == 'ItemList'), None)
              if not listing: continue
              entries = [x for x in listing.get('itemListElement', []) if x.get('url') != absolute]
              entries.insert(0, {'@type':'ListItem','position':1,'url':absolute,'name':'Kadaň čekají tropické dny. Ve čtvrtek může být až 35 stupňů'})
              for pos, entry in enumerate(entries, 1): entry['position'] = pos
              listing['itemListElement'] = entries
              listing['numberOfItems'] = len(entries)
              replacement = '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False, indent=2) + '</script>'
              a = a[:m.start()] + replacement + a[m.end():]
              done = True
              break
          if not done: raise SystemExit('Nepodařilo se upravit JSON-LD archivu.')
          write(p, a)

          # RSS
          p = Path('rss.xml')
          r = read(p)
          r = re.sub(r'<lastBuildDate>.*?</lastBuildDate>', '<lastBuildDate>Tue, 28 Jul 2026 17:45:00 +0200</lastBuildDate>', r, count=1)
          rss_item = '''
              <item>
                <title>Kadaň čekají tropické dny. Ve čtvrtek může být až 35 stupňů</title>
                <description><![CDATA[Otevírací doba koupaliště, upozornění na novou skluzavku a přehled míst, kde se během vedra zchladit.]]></description>
                <link>https://nasekadan.cz/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html</link>
                <guid isPermaLink="true">https://nasekadan.cz/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html</guid>
                <pubDate>Tue, 28 Jul 2026 17:45:00 +0200</pubDate>
                <category>Počasí</category><category>Praktická Kadaň</category><category>Koupaliště Kadaň</category>
                <szn:image><szn:url>https://nasekadan.cz/obrazky/koupaliste-kadan-budova-2026.webp</szn:url></szn:image>
                <geo:lat>50.375984</geo:lat><geo:long>13.271307</geo:long>
              </item>
          '''
          if absolute not in r:
              anchor = '    <atom:link href="https://nasekadan.cz/rss.xml" rel="self" type="application/rss+xml" />'
              if anchor not in r: raise SystemExit('RSS nemá očekávaný anchor.')
              r = r.replace(anchor, anchor + '\n' + rss_item, 1)
          write(p, r)

          # Sitemap
          p = Path('sitemap.xml')
          s = read(p)
          s = re.sub(r'(<loc>https://nasekadan\.cz/</loc><lastmod>)[^<]+', r'\g<1>2026-07-28', s)
          s = re.sub(r'(<loc>https://nasekadan\.cz/clanky/</loc><lastmod>)[^<]+', r'\g<1>2026-07-28', s)
          entry = '  <url><loc>https://nasekadan.cz/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html</loc><lastmod>2026-07-28</lastmod></url>\n'
          if absolute not in s:
              m = re.search(r'  <url><loc>https://nasekadan\.cz/clanky/</loc><lastmod>[^<]+</lastmod></url>\n?', s)
              if not m: raise SystemExit('Sitemap nemá očekávaný záznam archivu.')
              s = s[:m.end()] + entry + s[m.end():]
          write(p, s)

          required = {
              'clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html':['Ve čtvrtek může být až 35 stupňů','koupaliste-kadan-budova-2026.webp','Nová skluzavka'],
              'index.html':[rel,'data-heat-article-hero','data-heat-article-card'],
              'clanky/index.html':[absolute,'data-heat-article-card'],
              'rss.xml':[absolute,'Tue, 28 Jul 2026 17:45:00 +0200'],
              'sitemap.xml':[absolute,'2026-07-28'],
          }
          for filename, needles in required.items():
              text = read(filename)
              for needle in needles:
                  if needle not in text: raise SystemExit(f'{filename}: chybí {needle}')
          print('Čisté vydání je připravené.')
          PY

      - name: Uklidit workflow a zapsat výsledek
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-heat-article-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publikovat článek o tropických dnech v Kadani"
          git push origin HEAD:publish/heat-article-20260728-clean
