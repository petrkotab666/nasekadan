name: Stáhnout rozpracovaný článek Slovanu

on:
  push:
    branches: [main]
    paths:
      - '.github/unpublish-slovan-trigger.txt'

permissions:
  contents: write

concurrency:
  group: unpublish-slovan
  cancel-in-progress: true

jobs:
  unpublish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Odstranit článek z veřejné části webu
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/unpublish_slovan.py
          ! grep -F '/clanky/slovan-lavka-shell-kadan.html' index.html
          ! grep -F '/clanky/slovan-lavka-shell-kadan.html' clanky/index.html
          ! grep -F 'slovan-lavka-shell-kadan.html' sitemap.xml
          test ! -e clanky/slovan-lavka-shell-kadan.html
          test ! -e assets/slovan-lavka-hero-20260724.jpg
          grep -F '/clanky/nemocnice-kadan.html' index.html >/dev/null
          grep -F '/clanky/nemocnice-kadan.html' clanky/index.html >/dev/null

      - name: Uložit stažení do main
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/publish_slovan.py scripts/unpublish_slovan.py
          rm -f .github/unpublish-slovan-trigger.txt
          rm -f .github/workflows/unpublish-slovan.yml
          git config user.name 'Naše Kadaň automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Stáhnout rozpracovaný článek Slovanu a lávky'
          git push origin main
