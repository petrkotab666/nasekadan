name: Závěrečně ověřit AVIES a všechny články

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-avies-publication-status.yml'
      - '.github/finalize-avies-status-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-avies-publication-status
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vyřadit neschválené texty
        run: python3 scripts/remove_unpublished_articles.py

      - name: Ověřit zdrojové a živé publikované články
        id: integrity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_publication_integrity.py
          python3 scripts/check_live_publication_integrity.py

      - name: Zapsat důkaz dokončení
        if: always()
        env:
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path('.')
          marker_path=root/'.github/facebook-published/avies-nemocnice-kadan-55ee7df917.json'
          probe_path=root/'.github/avies-live-probe.json'
          marker=json.loads(marker_path.read_text(encoding='utf-8')) if marker_path.exists() else {}
          probe=json.loads(probe_path.read_text(encoding='utf-8')) if probe_path.exists() else {}
          integrity=os.environ.get('INTEGRITY_OUTCOME') == 'success'
          marker_valid=(
              marker.get('article_path') == 'clanky/avies-nemocnice-kadan.html'
              and bool(marker.get('facebook_post_id'))
              and marker.get('existing_post_detected') is False
          )
          live_ready=probe.get('ready_for_facebook') is True and all(probe.get('checks',{}).values())
          success=integrity and marker_valid and live_ready
          now=datetime.now(timezone.utc).isoformat()
          completion={
              'checked_at': now,
              'status': 'success' if success else 'failed',
              'all_publication_integrity_checks_passed': integrity,
              'live_probe_ready': live_ready,
              'facebook_marker_valid': marker_valid,
              'article_path': marker.get('article_path'),
              'article_url': marker.get('article_url'),
              'og_image': marker.get('og_image'),
              'facebook_post_id': marker.get('facebook_post_id'),
              'facebook_page_id': marker.get('facebook_page_id'),
              'existing_post_detected': marker.get('existing_post_detected'),
              'published_at': marker.get('published_at'),
          }
          Path('.github/avies-publication-completion.json').write_text(json.dumps(completion,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if success:
              fb={
                  'updated_at': now,
                  'results': [{
                      'state':'published',
                      'article_path':marker['article_path'],
                      'article_url':marker['article_url'],
                      'facebook_post_id':marker['facebook_post_id'],
                      'existing_post_detected':False,
                      'published_at':marker['published_at'],
                  }]
              }
              Path('.github/facebook-last-status.json').write_text(json.dumps(fb,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if not success:
              print(json.dumps(completion,ensure_ascii=False,indent=2))
          PY

      - name: Uložit ověřený stav
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň finální kontrola'
          git config user.email 'info@nasekadan.cz'
          git add -A -- .github/avies-publication-completion.json .github/facebook-last-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Potvrdit dokončené zveřejnění AVIES'
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin main

      - name: Potvrdit úplný úspěch
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('.github/avies-publication-completion.json').read_text(encoding='utf-8'))
          assert data['status']=='success', data
          print('AVIES i všechny publikované články jsou ověřené; Facebook je published.')
          PY
