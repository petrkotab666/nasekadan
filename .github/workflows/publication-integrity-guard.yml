name: Trvalá pojistka zveřejnění – pouze audit

# Tento guard smí pouze kontrolovat. Nesmí nahrávat soubory na OVH,
# přepisovat /var/www, opravovat Docker ani měnit obsah main.
on:
  push:
    branches: [main]
    paths:
      - 'clanky/*.html'
      - 'images/clanky/**'
      - 'social/**'
      - 'index.html'
      - 'clanky/index.html'
      - 'rss.xml'
      - 'sitemap.xml'
      - 'news-sitemap.xml'
      - 'scripts/verify_recent_publications.py'
      - '.github/workflows/publication-integrity-guard.yml'
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-publication-integrity-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit poslední publikace bez samoopravy
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_recent_publications.py manifest --hours 72 --limit 12 > "$RUNNER_TEMP/publication-manifest.json"
          python3 scripts/verify_recent_publications.py check \
            --manifest-file "$RUNNER_TEMP/publication-manifest.json" \
            --status-file "$RUNNER_TEMP/publication-status.json"

          # Trvalé kotvy, které odhalí přesně současnou regresi.
          base='https://nasekadan.cz'
          mp='mestska-policie-kadan-fakta-diskuse-2026.html'
          gym='gymnastika-kadan-treneri-prosinec-2026.html'
          eso='eso-market-rafanda-kadan-24-7.html'
          q="integrity-audit-${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsSL --max-time 40 "$base/?$q" -o /tmp/home.html
          curl -4 -kfsSL --max-time 40 "$base/clanky/?$q" -o /tmp/archive.html
          curl -4 -kfsSL --max-time 40 "$base/clanky/$eso?$q" -o /tmp/eso.html
          grep -Fq "data-latest-article-href=\"/clanky/$mp\"" /tmp/home.html
          grep -Fq "/clanky/$gym" /tmp/home.html
          grep -Fq "/clanky/$eso" /tmp/archive.html
          for img in \
            prodejna-rafanda-24-7.webp \
            navod-vstup-nakup-odchod.webp \
            pravidla-platba-kamery-v2.webp; do
            grep -Fq "/images/clanky/eso-market-rafanda/$img" /tmp/eso.html
            curl -4 -kfsSL --max-time 40 "$base/images/clanky/eso-market-rafanda/$img?$q" -o "/tmp/$img"
            test -s "/tmp/$img"
          done
          echo 'OK: audit posledních publikací prošel; nic nebylo změněno.'

      - name: Nahlásit regresi bez přepisování webu
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[incident] Publikační integrita – audit zjistil regresi'
          body="Živý web neodpovídá kanonickému main nebo chybí asset. Audit produkci záměrně nemění. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
