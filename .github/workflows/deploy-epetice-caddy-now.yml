name: Ruční úplné nasazení Naše Kadaň

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/epetice-deploy-trigger.txt'

permissions:
  contents: read

# Původní jednorázový workflow kopíroval zdrojové soubory přímo do Caddy a
# mohl tak vytvořit jinou verzi než Docker/Nginx. Nyní používá stejný build,
# stejnou kontrolu a stejný zámek jako každé ostatní produkční nasazení.
concurrency:
  group: nasekadan-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, ovh, lastminuteslevy]
    timeout-minutes: 25
    steps:
      - name: Stáhnout aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit celý aktuální web
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/sync-production.sh
          bash deploy/sync-production.sh
