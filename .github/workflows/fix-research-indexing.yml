name: Opravit indexaci neveřejné rešerše

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-research-indexing.yml'

permissions:
  contents: write

concurrency:
  group: fix-research-indexing
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Načíst nejnovější hlavní větev
        shell: bash
        run: git pull --ff-only origin main

      - name: Vyřadit neveřejnou rešerši z indexace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          script = Path('scripts/finalize_launch.py')
          text = script.read_text(encoding='utf-8')
          old = '    "nahled", "newsletter", "nginx", "parts", "scripts", "sdilet", "tools",\n'
          new = '    "nahled", "newsletter", "nginx", "parts", "research", "scripts", "sdilet", "tools",\n'
          if old in text:
              script.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Nelze najít očekávaný seznam EXCLUDE_DIRS')

          sitemap = Path('sitemap.xml')
          lines = sitemap.read_text(encoding='utf-8').splitlines()
          removed = [line for line in lines if '/research/' in line]
          cleaned = [line for line in lines if '/research/' not in line]
          sitemap.write_text('\n'.join(cleaned) + '\n', encoding='utf-8')

          changed = 0
          robots_re = re.compile(r'<meta\b(?=[^>]*\bname=["\']robots["\'])[^>]*>', re.I)
          for path in Path('research').rglob('*.html') if Path('research').exists() else []:
              html = path.read_text(encoding='utf-8', errors='replace')
              replacement = '<meta name="robots" content="noindex,nofollow,noarchive">'
              if robots_re.search(html):
                  updated = robots_re.sub(replacement, html, count=1)
              elif '</head>' in html:
                  updated = html.replace('</head>', replacement + '</head>', 1)
              else:
                  updated = html
              if updated != html:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1

          trigger = Path('.github/water-selfhosted-trigger.txt')
          trigger.write_text(
              'Spuštěno automatickou opravou indexace neveřejné rešerše.\n'
              'Požadavek: nasadit aktuální main včetně sitemap.xml a noindex metadat v /research/.\n'
              'Veřejně ověřit: sitemap.xml nesmí obsahovat /research/ a veřejné rešeršní HTML musí mít noindex.\n'
              'Důvod: interní kopie výsledků Registru smluv byla omylem vedena jako indexovatelná veřejná stránka.\n',
              encoding='utf-8',
          )

          assert '/research/' not in sitemap.read_text(encoding='utf-8')
          assert '"research"' in script.read_text(encoding='utf-8')
          print(f'Odstraněno URL z mapy: {len(removed)}; noindex upraven u {changed} souborů.')
          PY

      - name: Uložit opravu a odstranit jednorázový workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nasekadan-bot"
          git config user.email "nasekadan-bot@users.noreply.github.com"
          git rm .github/workflows/fix-research-indexing.yml
          git add scripts/finalize_launch.py sitemap.xml research .github/water-selfhosted-trigger.txt
          git commit -m "Vyřadit neveřejnou rešerši z indexace"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
