name: Rešerše DESÚ nyní
on:
  push:
    branches: [main]
    paths: ['.github/desu-now-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: |
          set -euo pipefail
          o=.github/research/desu-now; rm -rf "$o"; mkdir -p "$o"
          u='https://www.mesto-kadan.cz/redakce/index.php?as4uOriginalDomain=www.mesto-kadan.cz&as4u_protocol=https&clanek=245914&detail_claim=294869&lanG=cs&slozka=237763'
          curl -kLfsS --retry 3 --max-time 90 -A Mozilla/5.0 "$u" -o "$o/detail.html"
          grep -Eo 'https?://[^" ]+|/filemanager/files/file.php\?file=[0-9]+' "$o/detail.html" | sed 's/&amp;/\&/g' | sort -u > "$o/links.txt" || true
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          p=Path('.github/research/desu-now'); s=p.joinpath('detail.html').read_text(errors='replace')
          t=re.sub(r'<script.*?</script>|<style.*?</style>',' ',s,flags=re.I|re.S); t=re.sub(r'<[^>]+>',' ',t); t=unescape(re.sub(r'\s+',' ',t)).strip(); p.joinpath('detail.txt').write_text(t+'\n')
          ids=sorted(set(re.findall(r'/filemanager/files/file\.php\?file=(\d+)',s)))
          p.joinpath('file-ids.txt').write_text('\n'.join(ids)+'\n')
          PY
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          i=0; while read -r id; do [ -n "$id" ] || continue; i=$((i+1)); curl -kLfsS --retry 3 --max-time 120 -A Mozilla/5.0 "https://www.mesto-kadan.cz/filemanager/files/file.php?file=$id" -o "$o/a$i.pdf"; pdftotext -layout "$o/a$i.pdf" "$o/a$i.txt" || true; done < "$o/file-ids.txt"
          cat "$o/detail.txt" "$o"/a*.txt 2>/dev/null > "$o/report.txt" || cp "$o/detail.txt" "$o/report.txt"
      - run: |
          git config user.name nasekadan-research-bot; git config user.email actions@users.noreply.github.com
          git add .github/research/desu-now; git diff --cached --quiet && exit 0
          git commit -m 'Rešerše: DESÚ 294869 výstup'; git pull --rebase origin main; git push origin HEAD:main
