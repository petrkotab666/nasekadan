name: Nasadit Naše Kadaň spolehlivě přes GitHub cloud
run-name: Produkční nasazení nejnovějšího main na OVH

on:
  push:
    branches: [main]
    paths-ignore:
      - 'cloud-deploy-status.json'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-cloud-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}

    steps:
      - name: Vybrat dostupný SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s\n' "$value" > "$RUNNER_TEMP/nasekadan_ovh_key"
              selected="$name"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo 'Nebyl nalezen žádný použitelný SSH secret.' >&2
            exit 20
          fi
          chmod 600 "$RUNNER_TEMP/nasekadan_ovh_key"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Nasadit nejnovější main přímo na OVH
        id: deploy_server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/nasekadan_ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          if [ ! -d /opt/nasekadan/.git ]; then
            sudo rm -rf /opt/nasekadan
            sudo git clone https://github.com/petrkotab666/nasekadan.git /opt/nasekadan
            sudo chown -R ubuntu:ubuntu /opt/nasekadan
          fi
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          chmod +x deploy/sync-production.sh
          bash deploy/sync-production.sh
          REMOTE

      - name: Ověřit veřejný web
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            homepage="$(curl -fsS --max-time 20 "https://nasekadan.cz/?deploy=${GITHUB_SHA}-${attempt}" || true)"
            kolobezky="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/kolobezky-hriste-detektor-kovu-kadan.html?deploy=${GITHUB_SHA}-${attempt}" || true)"
            kultura="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html?deploy=${GITHUB_SHA}-${attempt}" || true)"
            health="$(curl -fsS --max-time 20 "https://nasekadan.cz/deployment-health.txt?deploy=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq 'Koloběžky pod větším dohledem' <<<"$kolobezky" \
              && grep -Fq 'Karlovy Vary' <<<"$kultura" \
              && grep -Fq 'clanky/' <<<"$homepage" \
              && grep -Fq 'source=' <<<"$health"; then
              echo 'Veřejný web podává aktuální články.'
              exit 0
            fi
            sleep 10
          done
          echo 'Veřejný web ani po čekání nepodává požadovanou verzi.' >&2
          exit 30

      - name: Zapsat výsledek nasazení
        if: always()
        uses: actions/github-script@v7
        env:
          KEY_OUTCOME: ${{ steps.key.outcome }}
          KEY_NAME: ${{ steps.key.outputs.selected }}
          DEPLOY_OUTCOME: ${{ steps.deploy_server.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'cloud-deploy-status.json';
            const status = {
              status: process.env.KEY_OUTCOME === 'success' && process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ssh_key_available: process.env.KEY_OUTCOME === 'success',
              ssh_key_secret_name: process.env.KEY_NAME || null,
              server_deploy: process.env.DEPLOY_OUTCOME || 'skipped',
              public_verification: process.env.VERIFY_OUTCOME || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat výsledek produkčního nasazení: ${status.status}`,
              content,
              ...(sha ? { sha } : {})
            });
