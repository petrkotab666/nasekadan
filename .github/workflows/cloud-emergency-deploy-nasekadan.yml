name: Kanonická produkční pojistka Naše Kadaň
run-name: Ověřit a případně kanonicky nasadit aktuální main

on:
  push:
    branches: [main]
    paths-ignore:
      - 'cloud-deploy-status.json'
      - 'fast-publication-status.json'
      - '.github/facebook-last-status.json'
      - '.github/facebook-publish-pending.txt'
      - '.github/facebook-published/**'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Načíst dynamické údaje aktuálního článku KTK
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from html import unescape
          from pathlib import Path
          import re
          import subprocess

          path = Path('clanky/vypadek-internetu-kadan-kradez-kabelu.html')
          text = path.read_text(encoding='utf-8')

          h1 = re.search(r'<h1\b[^>]*>(.*?)</h1>', text, re.I | re.S)
          if not h1:
              raise SystemExit('Článek KTK nemá H1.')
          title = re.sub(r'\s+', ' ', unescape(re.sub(r'<[^>]+>', ' ', h1.group(1)))).strip()

          modified = re.search(r'"dateModified"\s*:\s*"([^"]+)"', text)
          if not modified:
              raise SystemExit('Článek KTK nemá dateModified.')

          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print(f'source_sha={sha}')
          print(f'ktk_h1={title}')
          print(f'ktk_modified={modified.group(1)}')
          PY

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_OVH_SSH_PRIVATE_KEY"
          printf '%s\n' "$KEY_OVH_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_ovh_key"
          chmod 600 "$RUNNER_TEMP/nasekadan_ovh_key"

      - name: Zjistit, zda je veřejný web aktuální
        id: state
        env:
          SOURCE_SHA: ${{ steps.expected.outputs.source_sha }}
          KTK_H1: ${{ steps.expected.outputs.ktk_h1 }}
          KTK_MODIFIED: ${{ steps.expected.outputs.ktk_modified }}
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-pre-$(date +%s)"
          health="$(curl -4 -kfsSL --max-time 25 "https://nasekadan.cz/deployment-health.txt?check=$stamp" 2>/dev/null || true)"
          article="$(curl -4 -kfsSL --max-time 25 "https://nasekadan.cz/clanky/vypadek-internetu-kadan-kradez-kabelu.html?check=$stamp" 2>/dev/null || true)"
          if grep -Fq "source=$SOURCE_SHA" <<<"$health" \
            && grep -Fq "$KTK_H1" <<<"$article" \
            && grep -Fq "$KTK_MODIFIED" <<<"$article"; then
            echo 'needs_deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Veřejný web již podává aktuální main a aktuální článek KTK.'
          else
            echo 'needs_deploy=true' >> "$GITHUB_OUTPUT"
            echo 'Veřejný web je zastaralý nebo neúplný; bude spuštěn jediný kanonický deploy.'
          fi

      - name: Kanonicky nasadit aktuální main
        if: steps.state.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/nasekadan_ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

      - name: Veřejně ověřit commit, KTK a přehledy
        env:
          SOURCE_SHA: ${{ steps.expected.outputs.source_sha }}
          KTK_H1: ${{ steps.expected.outputs.ktk_h1 }}
          KTK_MODIFIED: ${{ steps.expected.outputs.ktk_modified }}
        shell: bash
        run: |
          set -euo pipefail
          slug='vypadek-internetu-kadan-kradez-kabelu.html'
          ok=0
          for attempt in $(seq 1 40); do
            stamp="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            health="$(curl -4 -kfsSL --max-time 25 "https://nasekadan.cz/deployment-health.txt?verify=$stamp" 2>/dev/null || true)"
            article="$(curl -4 -kfsSL --max-time 25 "https://nasekadan.cz/clanky/$slug?verify=$stamp" 2>/dev/null || true)"
            home="$(curl -4 -kfsSL --max-time 25 "https://nasekadan.cz/?verify=$stamp" 2>/dev/null || true)"
            archive="$(curl -4 -kfsSL --max-time 25 "https://nasekadan.cz/clanky/?verify=$stamp" 2>/dev/null || true)"
            rss="$(curl -4 -kfsSL --max-time 25 "https://nasekadan.cz/rss.xml?verify=$stamp" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsSL --max-time 25 "https://nasekadan.cz/sitemap.xml?verify=$stamp" 2>/dev/null || true)"
            if grep -Fq "source=$SOURCE_SHA" <<<"$health" \
              && grep -Fq "$KTK_H1" <<<"$article" \
              && grep -Fq "$KTK_MODIFIED" <<<"$article" \
              && grep -Fq "$slug" <<<"$home" \
              && grep -Fq "$slug" <<<"$archive" \
              && grep -Fq "$slug" <<<"$rss" \
              && grep -Fq "$slug" <<<"$sitemap"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'Kanonická veřejná kontrola aktuálního main a článku KTK prošla.'
