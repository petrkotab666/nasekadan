name: Okamžitě nasadit článek Martina Kadlece

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud-emergency-deploy-nasekadan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-kadlec-emergency
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OVH_KEY_PRIMARY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_FALLBACK: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Připravit funkční SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          KEY="$OVH_KEY_PRIMARY"
          if [ -z "$KEY" ]; then KEY="$OVH_KEY_FALLBACK"; fi
          test -n "$KEY"
          printf '%s\n' "$KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Okamžitě zkopírovat článek a přehledy na OVH
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          test -s clanky/martin-kadlec-navrat-hokej-kadan-2026.html
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 clanky/martin-kadlec-navrat-hokej-kadan-2026.html /var/www/nasekadan/clanky/martin-kadlec-navrat-hokej-kadan-2026.html
          sudo install -m 0644 index.html /var/www/nasekadan/index.html
          sudo install -m 0644 clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 rss.xml /var/www/nasekadan/rss.xml
          sudo install -m 0644 sitemap.xml /var/www/nasekadan/sitemap.xml
          sudo install -m 0644 news-sitemap.xml /var/www/nasekadan/news-sitemap.xml
          sudo chmod a+r /var/www/nasekadan/clanky/martin-kadlec-navrat-hokej-kadan-2026.html /var/www/nasekadan/index.html /var/www/nasekadan/clanky/index.html /var/www/nasekadan/rss.xml /var/www/nasekadan/sitemap.xml /var/www/nasekadan/news-sitemap.xml
          REMOTE

      - name: Ověřit živý článek
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 20); do
            page="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/clanky/martin-kadlec-navrat-hokej-kadan-2026.html?deploy=${GITHUB_SHA}-${n}" || true)"
            home="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/?deploy=${GITHUB_SHA}-${n}" || true)"
            if grep -Fq 'Martin Kadlec po deseti letech' <<<"$page" && grep -Fq 'martin-kadlec-navrat-hokej-kadan-2026.html' <<<"$home"; then
              echo 'Článek je veřejný.'
              exit 0
            fi
            sleep 3
          done
          exit 1
