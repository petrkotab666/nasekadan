name: Nasadit Naše Kadaň spolehlivě přes GitHub cloud
run-name: Atomické nasazení aktuálního main na OVH

on:
  push:
    branches: [main]
    paths-ignore:
      - 'cloud-deploy-status.json'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-cloud-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

    steps:
      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_OVH_SSH_PRIVATE_KEY"
          printf '%s\n' "$KEY_OVH_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_ovh_key"
          chmod 600 "$RUNNER_TEMP/nasekadan_ovh_key"

      - name: Obnovit aktuální web včetně reklam
        id: deploy_server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/nasekadan_ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd

          # Každý článek musí mít reklamní slot i všechny tři reklamní skripty.
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/normalize_footers.py --write --check

          ARTICLE='clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html'
          test -f "$ARTICLE"
          grep -Fq 'Kadaňští hasiči cvičili na Nechranicích' "$ARTICLE"
          grep -Fq 'data-promos' "$ARTICLE"
          grep -Fq '/reklamy.js' "$ARTICLE"
          grep -Fq '/reklamy-oprava-obrazku.js' "$ARTICLE"
          grep -Fq '/obsah-doplnky.js' "$ARTICLE"
          grep -Fq 'hasici-kadan-vycvik-zachrana-voda-nechranice.html' index.html

          SOURCE_SHA="$(git rev-parse HEAD)"
          STAGE="/var/www/nasekadan.release-$SOURCE_SHA"
          PREVIOUS="/var/www/nasekadan.previous-$SOURCE_SHA"
          sudo rm -rf "$STAGE" "$PREVIOUS"
          sudo mkdir -p "$STAGE"
          sudo tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./scripts' \
            --exclude='./deploy' \
            --exclude='./tools' \
            --exclude='./nginx' \
            --exclude='./docker-entrypoint.d' \
            --exclude='./Dockerfile' \
            --exclude='./docker-compose.yml' \
            --exclude='./cloud-deploy-status.json' \
            -cf - . | sudo tar -C "$STAGE" -xf -
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=direct-main-with-ads\n' \
            "$SOURCE_SHA" "$(date -u +%FT%TZ)" | sudo tee "$STAGE/deployment-health.txt" >/dev/null
          sudo chmod -R a+rX "$STAGE"

          if [ -e /var/www/nasekadan ]; then
            sudo mv /var/www/nasekadan "$PREVIOUS"
          fi
          sudo mv "$STAGE" /var/www/nasekadan
          sudo rm -rf "$PREVIOUS"
          REMOTE

      - name: Ověřit článek a reklamy na živém webu
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            article="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html?deploy=${GITHUB_SHA}-${attempt}" || true)"
            home="$(curl -fsS --max-time 20 "https://nasekadan.cz/?deploy=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq 'Kadaňští hasiči cvičili na Nechranicích' <<<"$article" \
              && grep -Fq 'data-promos' <<<"$article" \
              && grep -Fq '/reklamy.js' <<<"$article" \
              && grep -Fq '/reklamy-oprava-obrazku.js' <<<"$article" \
              && grep -Fq '/obsah-doplnky.js' <<<"$article" \
              && grep -Fq 'hasici-kadan-vycvik-zachrana-voda-nechranice.html' <<<"$home"; then
              echo 'Živý web obsahuje článek i reklamní systém.'
              exit 0
            fi
            sleep 10
          done
          exit 30

      - name: Zapsat výsledek nasazení
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_server.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'cloud-deploy-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              server_deploy: process.env.DEPLOY_OUTCOME || 'skipped',
              public_verification: process.env.VERIFY_OUTCOME || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat výsledek produkčního nasazení: ${status.status}`,
              content,
              ...(sha ? { sha } : {})
            });
