name: Spustit v4 fotografie Od hlubin k nebi
on:
  issues:
    types: [opened, reopened]
permissions:
  actions: write
  issues: write
jobs:
  trigger:
    if: github.event.issue.title == 'Spustit finální v4 Od hlubin k nebi'
    runs-on: ubuntu-latest
    steps:
      - name: Spustit workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-od-hlubin-real-v4.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 8
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-od-hlubin-real-v4.yml --limit 1 --json databaseId,status,conclusion,url,createdAt > /tmp/run.json
          cat /tmp/run.json
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); const r=fs.readFileSync('/tmp/run.json','utf8');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Finální v4 deploy byl explicitně spuštěn.\n\`\`\`json\n${r}\n\`\`\``});
