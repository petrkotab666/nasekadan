name: Záložní trigger fotografií Od hlubin k nebi

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: write
  issues: write

jobs:
  trigger:
    if: github.event.issue.title == 'Spustit přímou opravu Od hlubin k nebi'
    runs-on: ubuntu-latest
    steps:
      - name: Spustit přímý workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run fix-od-hlubin-images-direct.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 7
          gh run list --repo "$GITHUB_REPOSITORY" --workflow fix-od-hlubin-images-direct.yml --limit 1 --json databaseId,status,conclusion,createdAt,url > "$RUNNER_TEMP/run.json"
          cat "$RUNNER_TEMP/run.json"
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let run='[]'; try { run=fs.readFileSync(`${process.env.RUNNER_TEMP}/run.json`,'utf8'); } catch (_) {}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'Přímá oprava fotografií byla explicitně spuštěna. Nejnovější běh:\n```json\n'+run+'\n```'});
