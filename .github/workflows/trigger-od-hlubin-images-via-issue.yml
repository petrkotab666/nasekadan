name: Záložní trigger fotografií Od hlubin k nebi

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: write
  issues: write

jobs:
  trigger:
    if: github.event.issue.title == 'Spustit přímou opravu Od hlubin k nebi'
    runs-on: ubuntu-latest
    steps:
      - name: Spustit přímý workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fix-od-hlubin-images-direct.yml --repo "$GITHUB_REPOSITORY" --ref main
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'Přímá oprava fotografií byla explicitně spuštěna přes workflow_dispatch.'});
