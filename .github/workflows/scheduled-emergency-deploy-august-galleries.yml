name: Jednorázově nasadit srpnový program galerií
run-name: Časované nouzové nasazení článku o galeriích

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-emergency-august-galleries
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Zjistit, zda už je článek živý
        id: live
        shell: bash
        run: |
          set -Eeuo pipefail
          article='https://nasekadan.cz/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html'
          home='https://nasekadan.cz/'
          archive='https://nasekadan.cz/clanky/'
          rss='https://nasekadan.cz/rss.xml'
          token="pre-${GITHUB_RUN_ID}-$(date +%s)"
          curl -fsS --max-time 20 "$article?check=$token" -o /tmp/pre-article.html || true
          curl -fsS --max-time 20 "$home?check=$token" -o /tmp/pre-home.html || true
          curl -fsS --max-time 20 "$archive?check=$token" -o /tmp/pre-archive.html || true
          curl -fsS --max-time 20 "$rss?check=$token" -o /tmp/pre-rss.xml || true
          if grep -Fq 'Srpen v kadaňských galeriích nabídne houby' /tmp/pre-article.html \
            && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/pre-home.html \
            && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/pre-archive.html \
            && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/pre-rss.xml; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Sestavit článek a veřejné přehledy
        if: steps.live.outputs.already != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html
          python3 -m pip install --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/normalize_footers.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/enforce_article_visibility.py
          python3 scripts/ensure_all_published_articles_in_rss.py
          python3 scripts/sort_articles_chronologically.py
          python3 scripts/enforce_latest_homepage_hero.py
          python3 scripts/prepare_discovery.py
          python3 scripts/clean_sitemap_technical_entries.py
          for file in index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml; do
            test -f "$file"
            grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' "$file"
          done
          grep -Fq 'Srpen v kadaňských galeriích nabídne houby' clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html

      - name: Připravit SSH klíč
        if: steps.live.outputs.already != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_key"
              selected="$name"
              break
            fi
          done
          test -n "$selected"
          test -s "$RUNNER_TEMP/nasekadan_key"
          chmod 600 "$RUNNER_TEMP/nasekadan_key"
          echo "Použit SSH klíč: $selected"

      - name: Přenést hotový článek a přehledy na OVH
        if: steps.live.outputs.already != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          social_file=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html').read_text(encoding='utf-8')
          match=re.search(r'https://nasekadan\.cz/(social/[^"\']+)',text)
          if not match:
              raise SystemExit('V článku chybí sociální obrázek')
          print(match.group(1))
          PY
          )
          test -f "$social_file"
          tar -czf "$RUNNER_TEMP/august-galleries-release.tgz" \
            index.html clanky/index.html clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html \
            rss.xml sitemap.xml news-sitemap.xml "$social_file" llms.txt llms-full.txt
          scp -i "$RUNNER_TEMP/nasekadan_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/august-galleries-release.tgz" ubuntu@57.129.43.215:/tmp/august-galleries-release.tgz
          ssh -i "$RUNNER_TEMP/nasekadan_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          tar -xzf /tmp/august-galleries-release.tgz -C "$tmp"
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 "$tmp/index.html" /var/www/nasekadan/index.html
          sudo install -m 0644 "$tmp/clanky/index.html" /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 "$tmp/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html" /var/www/nasekadan/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html
          sudo install -m 0644 "$tmp/rss.xml" /var/www/nasekadan/rss.xml
          sudo install -m 0644 "$tmp/sitemap.xml" /var/www/nasekadan/sitemap.xml
          sudo install -m 0644 "$tmp/news-sitemap.xml" /var/www/nasekadan/news-sitemap.xml
          sudo install -m 0644 "$tmp/llms.txt" /var/www/nasekadan/llms.txt
          sudo install -m 0644 "$tmp/llms-full.txt" /var/www/nasekadan/llms-full.txt
          sudo cp -a "$tmp/social/." /var/www/nasekadan/social/
          sudo chmod -R a+rX /var/www/nasekadan
          sudo nginx -t
          sudo systemctl reload nginx
          rm -rf "$tmp" /tmp/august-galleries-release.tgz
          REMOTE

      - name: Veřejně ověřit nasazení
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          success=false
          for attempt in $(seq 1 36); do
            token="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            curl -fsS --max-time 20 "https://nasekadan.cz/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html?verify=$token" -o /tmp/article.html || true
            curl -fsS --max-time 20 "https://nasekadan.cz/?verify=$token" -o /tmp/home.html || true
            curl -fsS --max-time 20 "https://nasekadan.cz/clanky/?verify=$token" -o /tmp/archive.html || true
            curl -fsS --max-time 20 "https://nasekadan.cz/rss.xml?verify=$token" -o /tmp/rss.xml || true
            curl -fsS --max-time 20 "https://nasekadan.cz/sitemap.xml?verify=$token" -o /tmp/sitemap.xml || true
            if grep -Fq 'Srpen v kadaňských galeriích nabídne houby' /tmp/article.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/home.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/archive.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/rss.xml \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/sitemap.xml; then
              success=true
              break
            fi
            sleep 8
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          test "$success" = true

      - name: Zapsat úspěšný stav a odstranit jednorázový plánovač
        if: always() && steps.verify.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner;
            const repo=context.repo.repo;
            const statusPath='august-galleries-live-status.json';
            const workflowPath='.github/workflows/scheduled-emergency-deploy-august-galleries.yml';
            const status={
              status:'success',
              checked_at_utc:new Date().toISOString(),
              run_id:context.runId,
              trigger:context.eventName,
              article:'https://nasekadan.cz/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html',
              homepage:true,
              archive:true,
              rss:true,
              sitemap:true
            };
            let currentStatus;
            try{const response=await github.rest.repos.getContent({owner,repo,path:statusPath,ref:'main'});if(!Array.isArray(response.data))currentStatus=response.data.sha}catch(error){if(error.status!==404)throw error}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:statusPath,branch:'main',message:'Zapsat úspěšné nasazení srpnového programu galerií',content:Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64'),...(currentStatus?{sha:currentStatus}:{})});
            try{
              const response=await github.rest.repos.getContent({owner,repo,path:workflowPath,ref:'main'});
              if(!Array.isArray(response.data)){
                await github.rest.repos.deleteFile({owner,repo,path:workflowPath,branch:'main',message:'Odstranit dokončený jednorázový plánovač galerií',sha:response.data.sha});
              }
            }catch(error){if(error.status!==404)throw error}
