name: Sestavit zdroj článku o alžbětinském klášteře

on:
  push:
    paths:
      - '.github/bootstrap/alzbetinsky-20260803/manifest.txt'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-alzbetinsky-sources-20260803
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Složit a ověřit zdrojový balíček
        shell: bash
        run: |
          set -euo pipefail
          dir='.github/bootstrap/alzbetinsky-20260803'
          cat "$dir"/chunk_* > "$RUNNER_TEMP/package.tar.gz.b64"
          echo 'af66852ef71d5219cdf9030b4e4821f3dc7095017a9db32f159d8d765759d677  '"$RUNNER_TEMP/package.tar.gz.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/package.tar.gz.b64" > "$RUNNER_TEMP/package.tar.gz"
          echo '6c61280ea596d4863ddb7451db5a3f8c82b3c6b5cad51bf814dbc80086412fa2  '"$RUNNER_TEMP/package.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP/package.tar.gz" -C "$RUNNER_TEMP/package"
          install -m 0644 "$RUNNER_TEMP/package/draft.html" .github/drafts/alzbetinsky-klaster-kadan-20260803.html
          install -m 0755 "$RUNNER_TEMP/package/publish_script.py" scripts/publish_alzbetinsky_klaster_20260803.py
          python3 -m py_compile scripts/publish_alzbetinsky_klaster_20260803.py
          python3 scripts/publish_alzbetinsky_klaster_20260803.py --validate-source-only
          grep -Fq 'Kam odešli poslední pacienti?' .github/drafts/alzbetinsky-klaster-kadan-20260803.html
          grep -Fq 'data-poll-id="alzbetinsky-klaster-kadan-2026"' .github/drafts/alzbetinsky-klaster-kadan-20260803.html
      - name: Uložit hotové zdroje do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – příprava publikace kláštera'
          git config user.email 'info@nasekadan.cz'
          git add .github/drafts/alzbetinsky-klaster-kadan-20260803.html scripts/publish_alzbetinsky_klaster_20260803.py
          git commit -m 'Doplnit úplný zdroj publikace kláštera [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            [[ "$attempt" == 5 ]] && exit 1
            sleep $((attempt * 4))
          done
      - name: Zapsat stav přípravy
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? '✅ Úplný zdroj článku a publikační skript byly sestaveny z kontrolovaného balíčku a uloženy do hlavní větve.'
              : '🚨 Sestavení zdroje článku selhalo. Publikace není připravena a vyžaduje zásah.';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 545, body});
