name: Nastavit heslo newsletteru a statistik
run-name: Bezpečně uložit SMTP heslo a ověřit přihlášení k Seznamu

on:
  push:
    branches: [main]
    paths:
      - '.github/apply-newsletter-smtp-password-trigger.txt'
      - '.github/workflows/apply-newsletter-smtp-password.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-newsletter-password
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      NEWSLETTER_SMTP_PASSWORD: ${{ secrets.NEWSLETTER_SMTP_PASSWORD }}
    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bezpečně uložit heslo na VPS pro newsletter i statistiky
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEWSLETTER_SMTP_PASSWORD:-}" ]; then
            echo 'Chybí repository secret NEWSLETTER_SMTP_PASSWORD.' >&2
            exit 20
          fi

          sudo -n python3 - <<'PY'
          import os
          from pathlib import Path

          password = os.environ['NEWSLETTER_SMTP_PASSWORD']
          if not password:
              raise SystemExit('SMTP heslo je prázdné')

          newsletter_values = {
              'NEWSLETTER_BASE_URL': 'https://nasekadan.cz',
              'NEWSLETTER_FROM': 'info@nasekadan.cz',
              'NEWSLETTER_DB': '/var/lib/nasekadan-newsletter/newsletter.sqlite3',
              'SMTP_HOST': 'smtp.seznam.cz',
              'SMTP_PORT': '465',
              'SMTP_USER': 'info@nasekadan.cz',
              'SMTP_PASSWORD': password,
              'SMTP_TLS': 'ssl',
          }
          stats_values = {
              'SMTP_HOST': 'smtp.seznam.cz',
              'SMTP_PORT': '465',
              'SMTP_USER': 'info@nasekadan.cz',
              'SMTP_PASSWORD': password,
              'SMTP_TLS': 'ssl',
          }

          def update_env(path: Path, values: dict[str, str]) -> None:
              existing = path.read_text(encoding='utf-8').splitlines() if path.exists() else []
              output = []
              seen = set()
              for line in existing:
                  stripped = line.strip()
                  if not stripped or stripped.startswith('#') or '=' not in line:
                      output.append(line)
                      continue
                  key = line.split('=', 1)[0].strip()
                  if key in values:
                      output.append(f'{key}={values[key]}')
                      seen.add(key)
                  else:
                      output.append(line)
              for key, value in values.items():
                  if key not in seen:
                      output.append(f'{key}={value}')
              path.write_text('\n'.join(output).rstrip() + '\n', encoding='utf-8')
              os.chmod(path, 0o600)

          update_env(Path('/etc/nasekadan-newsletter.env'), newsletter_values)
          update_env(Path('/etc/nasekadan-stats-email.env'), stats_values)
          print('SMTP konfigurace newsletteru i statistik byla sjednocena; heslo nebylo vypsáno.')
          PY

          sudo -n systemctl restart nasekadan-newsletter.service
          sudo -n systemctl restart nasekadan-stats-web.service
          sudo -n systemctl is-active --quiet nasekadan-newsletter.service
          sudo -n systemctl is-active --quiet nasekadan-stats-web.service

      - name: Ověřit přihlášení k SMTP bez odeslání zprávy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import smtplib
          import ssl

          password = os.environ['NEWSLETTER_SMTP_PASSWORD']
          context = ssl.create_default_context()
          with smtplib.SMTP_SSL('smtp.seznam.cz', 465, timeout=20, context=context) as smtp:
              smtp.login('info@nasekadan.cz', password)
          print('SMTP přihlášení k Seznamu bylo úspěšně ověřeno.')
          PY

      - name: Ověřit veřejné healthchecky
        shell: bash
        run: |
          set -euo pipefail
          newsletter_ok=0
          stats_ok=0
          for attempt in $(seq 1 20); do
            newsletter_body="$(curl -kfsS --max-time 15 "https://nasekadan.cz/api/newsletter/health?password-check=${GITHUB_SHA}-${attempt}" || true)"
            if jq -e '.smtpConfigured == true and .smtpPasswordSet == true' <<<"$newsletter_body" >/dev/null 2>&1; then
              newsletter_ok=1
            fi
            stats_body="$(curl -fsS --max-time 10 http://127.0.0.1:3225/healthz || true)"
            if jq -e '.ok == true and .smtpConfigured == true' <<<"$stats_body" >/dev/null 2>&1; then
              stats_ok=1
            fi
            if [ "$newsletter_ok" = 1 ] && [ "$stats_ok" = 1 ]; then
              echo 'Newsletter i statistiky mají kompletní a funkční SMTP konfiguraci.'
              exit 0
            fi
            sleep 3
          done
          echo "Healthcheck neprošel: newsletter=$newsletter_ok statistiky=$stats_ok" >&2
          exit 30
