name: Nastavit heslo newsletteru
run-name: Bezpečně uložit SMTP heslo a ověřit přihlášení k Seznamu

on:
  push:
    branches: [main]
    paths:
      - '.github/apply-newsletter-smtp-password-trigger.txt'
      - '.github/workflows/apply-newsletter-smtp-password.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-newsletter-password
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      NEWSLETTER_SMTP_PASSWORD: ${{ secrets.NEWSLETTER_SMTP_PASSWORD }}
    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bezpečně uložit heslo na VPS
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEWSLETTER_SMTP_PASSWORD:-}" ]; then
            echo 'Chybí repository secret NEWSLETTER_SMTP_PASSWORD.' >&2
            exit 20
          fi

          sudo -n python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('/etc/nasekadan-newsletter.env')
          password = os.environ['NEWSLETTER_SMTP_PASSWORD']
          if not password:
              raise SystemExit('SMTP heslo je prázdné')

          values = {
              'NEWSLETTER_BASE_URL': 'https://nasekadan.cz',
              'NEWSLETTER_FROM': 'info@nasekadan.cz',
              'NEWSLETTER_DB': '/var/lib/nasekadan-newsletter/newsletter.sqlite3',
              'SMTP_HOST': 'smtp.seznam.cz',
              'SMTP_PORT': '465',
              'SMTP_USER': 'info@nasekadan.cz',
              'SMTP_PASSWORD': password,
              'SMTP_TLS': 'ssl',
          }

          existing = []
          if path.exists():
              existing = path.read_text(encoding='utf-8').splitlines()

          output = []
          seen = set()
          for line in existing:
              stripped = line.strip()
              if not stripped or stripped.startswith('#') or '=' not in line:
                  output.append(line)
                  continue
              key = line.split('=', 1)[0].strip()
              if key in values:
                  output.append(f'{key}={values[key]}')
                  seen.add(key)
              else:
                  output.append(line)
          for key, value in values.items():
              if key not in seen:
                  output.append(f'{key}={value}')

          path.write_text('\n'.join(output).rstrip() + '\n', encoding='utf-8')
          os.chmod(path, 0o600)
          print('SMTP konfigurace byla bezpečně uložena; heslo nebylo vypsáno.')
          PY

          sudo -n systemctl restart nasekadan-newsletter.service
          sudo -n systemctl is-active --quiet nasekadan-newsletter.service

      - name: Ověřit přihlášení k SMTP bez odeslání zprávy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import smtplib
          import ssl

          password = os.environ['NEWSLETTER_SMTP_PASSWORD']
          context = ssl.create_default_context()
          with smtplib.SMTP_SSL('smtp.seznam.cz', 465, timeout=20, context=context) as smtp:
              smtp.login('info@nasekadan.cz', password)
          print('SMTP přihlášení k Seznamu bylo úspěšně ověřeno.')
          PY

      - name: Ověřit veřejný healthcheck
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(curl -kfsS --max-time 15 "https://nasekadan.cz/api/newsletter/health?password-check=${GITHUB_SHA}-${attempt}" || true)"
            if jq -e '.smtpConfigured == true and .smtpPasswordSet == true' <<<"$body" >/dev/null 2>&1; then
              echo 'Veřejné newsletterové API má kompletní SMTP konfiguraci.'
              exit 0
            fi
            sleep 3
          done
          echo 'Veřejný healthcheck nepotvrdil konfiguraci.' >&2
          exit 30
