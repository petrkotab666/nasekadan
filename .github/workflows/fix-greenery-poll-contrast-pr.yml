name: Nezávisle opravit čitelnost ankety o sečení

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/greenery-poll-contrast-pr-trigger.txt'
      - '.github/workflows/fix-greenery-poll-contrast-pr.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fix-greenery-poll-contrast-pr
  cancel-in-progress: true

env:
  ARTICLE: clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  VERSION: 20260801-poll-system-v4
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit zdroje a uložit je do main
        run: |
          set -euo pipefail
          python3 scripts/fix_greenery_poll_contrast.py
          node --check site.js
          grep -Fq 'POLL_GREENERY_HIGH_CONTRAST_V4' site.js
          grep -Fq "/site.js?v=${VERSION}" "$ARTICLE"
          git config user.name 'Naše Kadaň – čitelnost ankety'
          git config user.email 'info@nasekadan.cz'
          git add site.js "$ARTICLE" \
            clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html \
            .github/drafts/jaderne-tusimice-smr-voda-doprava-eia-2026.html \
            scripts/install_poll_system_v2.py \
            scripts/prepare_greenery_publication_20260801.py \
            scripts/fix_poll_stale_browser_state.py \
            scripts/repair_greenery_publication_now.sh \
            scripts/fix_greenery_poll_contrast.py
          if ! git diff --cached --quiet; then
            git commit -m 'Zvýšit kontrast textu výsledků ankety o sečení [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 5 ]] && exit 1
              sleep $((attempt * 4))
            done
          fi
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/fix_greenery_poll_contrast.py

      - name: Nasadit opravený styl přímo na OVH
        id: deploy
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/key"; else printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/key"; fi
          chmod 600 "$RUNNER_TEMP/key"
          mkdir -p "$RUNNER_TEMP/bundle/clanky"
          cp site.js "$RUNNER_TEMP/bundle/site.js"
          cp "$ARTICLE" "$RUNNER_TEMP/bundle/clanky/"
          scp -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/bundle" ubuntu@57.129.43.215:/tmp/nk-poll-contrast-pr
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -m 0644 /tmp/nk-poll-contrast-pr/site.js /var/www/nasekadan/site.js
          sudo install -m 0644 /tmp/nk-poll-contrast-pr/clanky/sekani-travniku-kadan-spravci-vysky-2026.html /var/www/nasekadan/clanky/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-poll-contrast-pr/site.js nasekadan-web:/usr/share/nginx/html/site.js
            sudo docker cp /tmp/nk-poll-contrast-pr/clanky/sekani-travniku-kadan-spravci-vysky-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
          fi
          grep -Fq 'POLL_GREENERY_HIGH_CONTRAST_V4' /var/www/nasekadan/site.js
          grep -Fq '/site.js?v=20260801-poll-system-v4' /var/www/nasekadan/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
          rm -rf /tmp/nk-poll-contrast-pr
          REMOTE

      - name: Veřejně ověřit kontrast v prohlížečovém DOM
        id: verify
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock jsdom@24 >/dev/null
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 18); do
            article="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/$ARTICLE?v=${stamp}-${attempt}" || true)"
            js="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/site.js?v=${stamp}-${attempt}" || true)"
            if ARTICLE_HTML="$article" SITE_JS="$js" node <<'NODE'
          const {JSDOM}=await import('jsdom');
          const html=process.env.ARTICLE_HTML||'';const js=process.env.SITE_JS||'';
          if(!html.includes('/site.js?v=20260801-poll-system-v4')||!js.includes('POLL_GREENERY_HIGH_CONTRAST_V4'))process.exit(1);
          const dom=new JSDOM(html,{url:'https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html',runScripts:'outside-only',pretendToBeVisual:true});
          const w=dom.window;w.fetch=async()=>({ok:true,json:async()=>({ok:true,total:1,counts:{'podle-lokality':1},percentages:{'podle-lokality':100}})});
          w.eval(js);w.document.dispatchEvent(new w.Event('DOMContentLoaded',{bubbles:true}));await new Promise(r=>setTimeout(r,150));
          const els=['.poll-results-head strong','.poll-result-label','.poll-result-value','.poll-results-status'].map(s=>w.document.querySelector(s));
          if(els.some(x=>!x))process.exit(1);
          const colors=els.map(x=>w.getComputedStyle(x).color.replace(/\s/g,''));
          console.log('Ověřené barvy:',colors);
          process.exit(colors[0]==='rgb(255,255,255)'&&colors[1]==='rgb(255,255,255)'&&colors[2]==='rgb(238,248,251)'&&colors[3]==='rgb(238,248,251)'?0:1);
NODE
            then echo 'ok=true' >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          echo 'ok=false' >> "$GITHUB_OUTPUT"; exit 1

      - name: Zapsat ověřený stav
        if: always()
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.verify.outputs.ok }}
          DEPLOY: ${{ steps.deploy.outcome }}
        with:
          script: |
            const ok=process.env.OK==='true';const path='.github/greenery-poll-contrast-status.json';
            const payload={status:ok?'passed':'failed',checkedAtUtc:new Date().toISOString(),runId:context.runId,serverDeploy:process.env.DEPLOY||'skipped',heading:'#ffffff',labels:'#ffffff',counts:'#eef8fb',statusText:'#eef8fb',cacheVersion:'20260801-poll-system-v4',article:'https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html'};
            const content=Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64');let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat čitelnost ankety: ${payload.status} [skip ci]`,content,...(sha?{sha}:{})});
