name: Spočítat všechny rotované Caddy statistiky

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ubuntu-recover-lastminuteslevy-trigger.txt'
      - '.github/workflows/check-all-caddy-rotations-pr.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  count-all:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Načíst všechny Caddy rotace a varianty původních metrik
        id: count
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 ubuntu@57.129.43.215 'sudo python3 -' <<'PY' | tee "$RUNNER_TEMP/all-caddy.txt"
          from __future__ import annotations

          import datetime as dt
          import glob
          import gzip
          import hashlib
          import json
          import re
          import urllib.parse
          from collections import defaultdict
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo('Europe/Prague')
          files = []
          for name in sorted(set(glob.glob('/var/log/caddy/nasekadan.access*'))):
              path = Path(name)
              if path.is_file():
                  files.append(path)
          print('CADDY_FILES_BEGIN')
          for path in files:
              stat = path.stat()
              print(f'{path}|bytes={stat.st_size}|mtime={stat.st_mtime:.0f}')
          print('CADDY_FILES_END')

          static = re.compile(r'\.(?:css|js|mjs|jpg|jpeg|png|webp|gif|svg|ico|woff2?|ttf|eot|map|xml|txt|pdf|mp4|webm|avif)$', re.I)
          obvious_bot = re.compile(r'bot\b|crawler|spider|slurp|headless|lighthouse|pagespeed|curl/|wget/|python-requests|go-http-client', re.I)
          strict_bot = re.compile(
              r'bot\b|crawler|spider|slurp|googleinspection|facebookexternalhit|facebot|'
              r'twitterbot|linkedinbot|pinterestbot|whatsapp|telegrambot|discordbot|'
              r'semrush|ahrefs|mj12|dotbot|blexbot|gptbot|chatgpt|claudebot|anthropic|'
              r'perplexity|uptime|monitor|statuscake|pingdom|headless|lighthouse|pagespeed|'
              r'curl/|wget/|python-requests|go-http-client|nasekadanstatsselftest', re.I)

          rows = []
          raw = parsed = 0
          file_counts = defaultdict(int)
          for path in files:
              opener = gzip.open if path.suffix == '.gz' else open
              try:
                  handle = opener(path, 'rt', encoding='utf-8', errors='replace')
              except OSError:
                  continue
              with handle:
                  for line in handle:
                      raw += 1
                      try:
                          data = json.loads(line)
                          req = data.get('request') or {}
                          method = str(req.get('method', '')).upper()
                          target = str(req.get('uri', '/'))
                          status = int(data.get('status', 0))
                          ip = str(req.get('client_ip') or req.get('remote_ip') or '')
                          headers = req.get('headers') or {}
                          ua_value = headers.get('User-Agent') or headers.get('user-agent') or ''
                          ua = ua_value[0] if isinstance(ua_value, list) and ua_value else str(ua_value)
                          stamp = data.get('ts')
                          when = dt.datetime.fromtimestamp(float(stamp), dt.timezone.utc).astimezone(TZ)
                      except (ValueError, TypeError, json.JSONDecodeError, OverflowError):
                          continue
                      parsed += 1
                      if method not in {'GET', 'HEAD'} or not ip or ip in {'127.0.0.1', '::1'}:
                          continue
                      try:
                          path_value = urllib.parse.urlsplit(target).path or '/'
                      except ValueError:
                          path_value = '/'
                      decoded = urllib.parse.unquote(path_value, errors='replace')
                      if decoded != '/':
                          decoded = decoded.rstrip('/') or '/'
                      if decoded == '/healthz' or decoded.startswith(('/statistiky', '/api/', '/nahled')) or static.search(decoded):
                          continue
                      if not (200 <= status < 300 or status == 304):
                          continue
                      ip_key = hashlib.sha256(ip.encode('utf-8', 'replace')).hexdigest()[:24]
                      client_key = hashlib.sha256(f'{ip}\0{ua}'.encode('utf-8', 'replace')).hexdigest()[:24]
                      rows.append((when, ip_key, client_key, decoded, ua, obvious_bot.search(ua) is not None, strict_bot.search(ua) is not None))
                      file_counts[path.name] += 1

          print(f'RAW_LINES={raw}')
          print(f'PARSED_LINES={parsed}')
          print('CONTENT_ROWS_BY_FILE_BEGIN')
          for name, count in sorted(file_counts.items()):
              print(f'{name}|rows={count}')
          print('CONTENT_ROWS_BY_FILE_END')

          def summarize(label, selected):
              selected = sorted(selected, key=lambda r: r[0])
              print(f'{label}_PAGEVIEWS={len(selected)}')
              for key_index, key_name in ((1, 'IP'), (2, 'IP_UA')):
                  grouped = defaultdict(list)
                  for row in selected:
                      grouped[row[key_index]].append(row[0])
                  print(f'{label}_UNIQUE_{key_name}={len(grouped)}')
                  for minutes in (15, 30, 45, 60):
                      gap = dt.timedelta(minutes=minutes)
                      sessions = 0
                      for times in grouped.values():
                          previous = None
                          for when in times:
                              if previous is None or when - previous > gap:
                                  sessions += 1
                              previous = when
                      print(f'{label}_SESSIONS_{minutes}_{key_name}={sessions}')
              print(f'{label}_FIRST={selected[0][0].isoformat() if selected else "none"}')
              print(f'{label}_LAST={selected[-1][0].isoformat() if selected else "none"}')

          summarize('ALL', rows)
          summarize('NO_OBVIOUS_BOTS', [r for r in rows if not r[5]])
          summarize('NO_STRICT_BOTS', [r for r in rows if not r[6]])

          # Varianta s odfiltrováním rychlých duplicit stejné stránky stejného klienta.
          dedup = []
          previous_by_key = {}
          for row in sorted(rows, key=lambda r: r[0]):
              key = (row[2], row[3])
              previous = previous_by_key.get(key)
              if previous is not None and row[0] - previous <= dt.timedelta(seconds=5):
                  continue
              previous_by_key[key] = row[0]
              dedup.append(row)
          summarize('DEDUP_5S', dedup)
          PY

      - name: Zapsat výsledek do PR
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.count.outcome }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/all-caddy.txt`, 'utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## Všechny rotace Caddy statistik: ${process.env.OUTCOME}`,
                '',
                '- Pouze agregované počty; bez IP adres, user-agentů a jednotlivých návštěv.',
                '',
                '```text', log.slice(-40000).replace(/```/g, '---'), '```'
              ].join('\n')
            });

      - name: Vyhodnotit
        if: always()
        env:
          OUTCOME: ${{ steps.count.outcome }}
        run: test "$OUTCOME" = success
