name: Rekonstruovat původní statistiky z Caddy logů

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ubuntu-recover-lastminuteslevy-trigger.txt'
      - '.github/workflows/check-all-caddy-rotations-pr.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reconstruct-original-nasekadan-stats
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Porovnat původní pravidla s uloženými souhrny
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 ubuntu@57.129.43.215 'sudo python3 -' <<'PY' | tee "$RUNNER_TEMP/reconstruction.txt"
          from __future__ import annotations

          import ast
          import datetime as dt
          import glob
          import gzip
          import hashlib
          import json
          import re
          import urllib.parse
          from collections import defaultdict
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo('Europe/Prague')
          TARGET = (2553, 1032, 915)
          TARGET_TODAY = (1104, 439, 389)
          MAX_CUTOFF = dt.datetime(2026, 7, 25, 22, 5, 59, tzinfo=TZ)
          TODAY = dt.date(2026, 7, 25)

          def string_expr(node):
              if isinstance(node, ast.Constant) and isinstance(node.value, str):
                  return node.value
              if isinstance(node, ast.BinOp) and isinstance(node.op, ast.Add):
                  return string_expr(node.left) + string_expr(node.right)
              if isinstance(node, ast.JoinedStr):
                  raise ValueError('neočekávaný f-string')
              raise ValueError(f'nepodporovaný řetězcový uzel {type(node).__name__}')

          source = Path('/usr/local/lib/nasekadan-stats/generate.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          patterns = {}
          for node in tree.body:
              if not isinstance(node, ast.Assign) or len(node.targets) != 1 or not isinstance(node.targets[0], ast.Name):
                  continue
              name = node.targets[0].id
              if name not in {'BOT_RE', 'STATIC_RE'} or not isinstance(node.value, ast.Call) or not node.value.args:
                  continue
              patterns[name] = string_expr(node.value.args[0])
          if set(patterns) != {'BOT_RE', 'STATIC_RE'}:
              raise SystemExit(f'Původní pravidla nebyla kompletně nalezena: {sorted(patterns)}')
          bot_re = re.compile(patterns['BOT_RE'], re.I)
          static_re = re.compile(patterns['STATIC_RE'], re.I)
          print('BOT_PATTERN=' + patterns['BOT_RE'])
          print('STATIC_PATTERN=' + patterns['STATIC_RE'])

          rows = []
          files = [Path(name) for name in sorted(set(glob.glob('/var/log/caddy/nasekadan.access*'))) if Path(name).is_file()]
          for path in files:
              opener = gzip.open if path.suffix == '.gz' else open
              with opener(path, 'rt', encoding='utf-8', errors='replace') as handle:
                  for line in handle:
                      try:
                          data = json.loads(line)
                          request = data.get('request') or {}
                          when = dt.datetime.fromtimestamp(float(data.get('ts')), dt.timezone.utc).astimezone(TZ)
                          if when > MAX_CUTOFF:
                              continue
                          method = str(request.get('method', '')).upper()
                          status = int(data.get('status', 0))
                          ip = str(request.get('client_ip') or request.get('remote_ip') or '')
                          headers = request.get('headers') or {}
                          ua_value = headers.get('User-Agent') or headers.get('user-agent') or ''
                          ua = ua_value[0] if isinstance(ua_value, list) and ua_value else str(ua_value)
                          raw_uri = str(request.get('uri', '/'))
                      except (ValueError, TypeError, json.JSONDecodeError, OverflowError):
                          continue
                      if method not in {'GET', 'HEAD'} or not ip or ip in {'127.0.0.1', '::1'}:
                          continue
                      if not (200 <= status < 300 or status == 304) or bot_re.search(ua):
                          continue
                      try:
                          page = urllib.parse.unquote(urllib.parse.urlsplit(raw_uri).path or '/', errors='replace')
                      except ValueError:
                          page = '/'
                      if page != '/':
                          page = page.rstrip('/') or '/'
                      if page == '/healthz' or page.startswith(('/statistiky', '/api/', '/nahled')) or static_re.search(page):
                          continue
                      stable = hashlib.sha256(f'{ip}\0{ua}'.encode('utf-8', 'replace')).hexdigest()[:24]
                      daily = hashlib.sha256(f'{when.date()}\0{ip}\0{ua}'.encode('utf-8', 'replace')).hexdigest()[:24]
                      rows.append((when, method, stable, daily, page))

          def aggregate(selected, gap_minutes, daily_sessions):
              selected = sorted(selected)
              visitors = len({row[3] for row in selected})
              groups = defaultdict(list)
              key_index = 3 if daily_sessions else 2
              for row in selected:
                  groups[row[key_index]].append(row[0])
              sessions = 0
              gap = dt.timedelta(minutes=gap_minutes)
              for stamps in groups.values():
                  previous = None
                  for stamp in stamps:
                      if previous is None or stamp - previous > gap:
                          sessions += 1
                      previous = stamp
              return len(selected), sessions, visitors

          print(f'FILES_LOADED={len(files)}')
          print(f'FILTERED_ROWS_TO_MAX={len(rows)}')
          print(f'FIRST={min((row[0] for row in rows), default=None)}')
          results = []
          for minute_index in range(45, 66):
              cutoff = dt.datetime(2026, 7, 25, 21 + minute_index // 60, minute_index % 60, 59, tzinfo=TZ)
              for get_only in (False, True):
                  selected = [row for row in rows if row[0] <= cutoff and (not get_only or row[1] == 'GET')]
                  today_rows = [row for row in selected if row[0].date() == TODAY]
                  for gap in range(5, 21):
                      for daily_sessions in (False, True):
                          total = aggregate(selected, gap, daily_sessions)
                          today = aggregate(today_rows, gap, daily_sessions)
                          score = (
                              abs(total[0]-TARGET[0])*5 + abs(total[1]-TARGET[1])*6 + abs(total[2]-TARGET[2])*6 +
                              abs(today[0]-TARGET_TODAY[0])*5 + abs(today[1]-TARGET_TODAY[1])*6 + abs(today[2]-TARGET_TODAY[2])*6
                          )
                          results.append((score, cutoff, get_only, gap, daily_sessions, total, today))

          print('CLOSEST_BEGIN')
          for score, cutoff, get_only, gap, daily_sessions, total, today in sorted(results)[:50]:
              print(
                  f'score={score}|cutoff={cutoff.isoformat()}|get_only={get_only}|gap={gap}|daily_sessions={daily_sessions}|'
                  f'total={total[0]}/{total[1]}/{total[2]}|today={today[0]}/{today[1]}/{today[2]}'
              )
          print('CLOSEST_END')
          PY

      - name: Zapsat výsledek do PR
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.reconstruct.outcome }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/reconstruction.txt`, 'utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## Přesná rekonstrukce původní metodiky: ${process.env.OUTCOME}`,
                '',
                '- Kontrolní stav: celkem 2 553 / 1 032 / 915; dnešek 1 104 / 439 / 389.',
                '',
                '```text', log.slice(-30000).replace(/```/g, '---'), '```'
              ].join('\n')
            });

      - name: Vyhodnotit
        if: always()
        env:
          OUTCOME: ${{ steps.reconstruct.outcome }}
        run: test "$OUTCOME" = success
