name: Rekonstruovat původní statistiky z Caddy logů

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/check-all-caddy-rotations-pr.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reconstruct-original-nasekadan-stats
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Oddělit zobrazení stránek od návštěv a návštěvníků
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 ubuntu@57.129.43.215 'sudo python3 -' <<'PY' | tee "$RUNNER_TEMP/reconstruction.txt"
          from __future__ import annotations

          import ast
          import datetime as dt
          import glob
          import gzip
          import hashlib
          import json
          import re
          import urllib.parse
          from collections import defaultdict
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo('Europe/Prague')
          TARGET = (2553, 1032, 915)
          TARGET_TODAY = (1104, 439, 389)
          MAX_CUTOFF = dt.datetime(2026, 7, 25, 22, 5, 59, tzinfo=TZ)
          TODAY = dt.date(2026, 7, 25)
          WEBROOTS = [Path('/var/www/nasekadan'), Path('/opt/nasekadan')]

          def string_expr(node):
              if isinstance(node, ast.Constant) and isinstance(node.value, str):
                  return node.value
              if isinstance(node, ast.BinOp) and isinstance(node.op, ast.Add):
                  return string_expr(node.left) + string_expr(node.right)
              raise ValueError(type(node).__name__)

          source = Path('/usr/local/lib/nasekadan-stats/generate.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          patterns = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  name = node.targets[0].id
                  if name in {'BOT_RE', 'STATIC_RE'} and isinstance(node.value, ast.Call) and node.value.args:
                      patterns[name] = string_expr(node.value.args[0])
          bot_re = re.compile(patterns['BOT_RE'], re.I)
          static_re = re.compile(patterns['STATIC_RE'], re.I)
          technical_ext = re.compile(r'\.(?:xml|txt|json|csv|pdf|mp4|webm|avif|zip|gz|webmanifest)$', re.I)
          suspicious = re.compile(r'(?:^|/)(?:\.well-known|wp-|wordpress|admin|login|cgi-bin|phpmyadmin|\.git|\.env)(?:/|$)', re.I)

          def hv(headers, name):
              value = headers.get(name) or headers.get(name.lower()) or headers.get(name.title()) or ''
              return ','.join(map(str, value)) if isinstance(value, list) else str(value)

          def existing_html(path_text):
              clean = urllib.parse.unquote(path_text, errors='replace').lstrip('/')
              candidates = []
              if not clean:
                  candidates.append('index.html')
              else:
                  candidates.append(clean)
                  candidates.append(clean + '.html')
                  candidates.append(clean.rstrip('/') + '/index.html')
              for root in WEBROOTS:
                  for relative in candidates:
                      candidate = (root / relative)
                      try:
                          if candidate.is_file() and candidate.suffix.lower() in {'.html', '.htm'}:
                              return True
                      except OSError:
                          pass
              return False

          rows = []
          files = [Path(name) for name in sorted(set(glob.glob('/var/log/caddy/nasekadan.access*'))) if Path(name).is_file()]
          for log_path in files:
              opener = gzip.open if log_path.suffix == '.gz' else open
              with opener(log_path, 'rt', encoding='utf-8', errors='replace') as handle:
                  for line in handle:
                      try:
                          data = json.loads(line)
                          request = data.get('request') or {}
                          when = dt.datetime.fromtimestamp(float(data.get('ts')), dt.timezone.utc).astimezone(TZ)
                          if when > MAX_CUTOFF:
                              continue
                          method = str(request.get('method', '')).upper()
                          status = int(data.get('status', 0))
                          ip = str(request.get('client_ip') or request.get('remote_ip') or '')
                          headers = request.get('headers') or {}
                          ua = hv(headers, 'User-Agent')
                          raw_uri = str(request.get('uri', '/'))
                          accept = hv(headers, 'Accept').lower()
                          dest = hv(headers, 'Sec-Fetch-Dest').lower()
                          mode = hv(headers, 'Sec-Fetch-Mode').lower()
                      except (ValueError, TypeError, json.JSONDecodeError, OverflowError):
                          continue
                      if method not in {'GET', 'HEAD'} or not ip or ip in {'127.0.0.1', '::1'} or bot_re.search(ua):
                          continue
                      if not (200 <= status < 300 or status == 304):
                          continue
                      try:
                          page = urllib.parse.unquote(urllib.parse.urlsplit(raw_uri).path or '/', errors='replace')
                      except ValueError:
                          page = '/'
                      if page != '/':
                          page = page.rstrip('/') or '/'
                      if page == '/healthz' or page.startswith(('/statistiky', '/api/', '/nahled')) or static_re.search(page):
                          continue
                      stable = hashlib.sha256(f'{ip}\0{ua}'.encode('utf-8', 'replace')).hexdigest()[:24]
                      daily = hashlib.sha256(f'{when.date()}\0{ip}\0{ua}'.encode('utf-8', 'replace')).hexdigest()[:24]
                      no_dot_ext = page == '/' or page.endswith(('.html', '.htm')) or page.endswith('/') or not re.search(r'\.[a-z0-9]{1,10}$', page, re.I)
                      rows.append({
                          'when': when, 'method': method, 'stable': stable, 'daily': daily, 'path': page,
                          'html_accept': 'text/html' in accept or 'application/xhtml+xml' in accept,
                          'document': dest in {'document', 'iframe'},
                          'navigate': mode == 'navigate',
                          'page_shape': no_dot_ext,
                          'nontechnical': not technical_ext.search(page) and not suspicious.search(page),
                          'existing_html': existing_html(page),
                      })

          page_filters = {
              'all_filtered': lambda r: True,
              'get_only': lambda r: r['method'] == 'GET',
              'page_shape': lambda r: r['page_shape'],
              'nontechnical': lambda r: r['nontechnical'],
              'shape_nontechnical': lambda r: r['page_shape'] and r['nontechnical'],
              'accept_html': lambda r: r['html_accept'],
              'document': lambda r: r['document'],
              'navigate': lambda r: r['navigate'],
              'document_or_navigate': lambda r: r['document'] or r['navigate'],
              'accept_or_document': lambda r: r['html_accept'] or r['document'],
              'shape_accept': lambda r: r['page_shape'] and r['html_accept'],
              'shape_document': lambda r: r['page_shape'] and r['document'],
              'existing_html': lambda r: r['existing_html'],
              'existing_or_document': lambda r: r['existing_html'] or r['document'],
              'existing_or_accept': lambda r: r['existing_html'] or r['html_accept'],
          }

          def sessions(selected, gap_minutes, daily_key):
              groups = defaultdict(list)
              key = 'daily' if daily_key else 'stable'
              for row in selected:
                  groups[row[key]].append(row['when'])
              total = 0
              gap = dt.timedelta(minutes=gap_minutes)
              for stamps in groups.values():
                  stamps.sort()
                  previous = None
                  for stamp in stamps:
                      if previous is None or stamp - previous > gap:
                          total += 1
                      previous = stamp
              return total

          results = []
          print(f'LOG_FILES={len(files)}')
          print(f'BASE_ROWS={len(rows)}')
          for minute_index in range(45, 66):
              cutoff = dt.datetime(2026, 7, 25, 21 + minute_index // 60, minute_index % 60, 59, tzinfo=TZ)
              base = [row for row in rows if row['when'] <= cutoff]
              today_base = [row for row in base if row['when'].date() == TODAY]
              for page_name, page_filter in page_filters.items():
                  page_rows = [row for row in base if page_filter(row)]
                  page_today = [row for row in today_base if page_filter(row)]
                  for dedup_seconds in (0, 1, 2, 3, 5, 10):
                      if dedup_seconds:
                          def dedup(items):
                              out = []
                              last = {}
                              for row in sorted(items, key=lambda value: value['when']):
                                  key = (row['stable'], row['path'])
                                  previous = last.get(key)
                                  if previous is not None and row['when'] - previous <= dt.timedelta(seconds=dedup_seconds):
                                      continue
                                  last[key] = row['when']
                                  out.append(row)
                              return out
                          view_rows = dedup(page_rows)
                          view_today = dedup(page_today)
                      else:
                          view_rows, view_today = page_rows, page_today
                      for gap in range(12, 19):
                          for daily_session in (False, True):
                              total_metrics = (
                                  len(view_rows),
                                  sessions(base, gap, daily_session),
                                  len({row['daily'] for row in base}),
                              )
                              today_metrics = (
                                  len(view_today),
                                  sessions(today_base, gap, daily_session),
                                  len({row['daily'] for row in today_base}),
                              )
                              score = sum((
                                  abs(total_metrics[0]-TARGET[0])*6,
                                  abs(total_metrics[1]-TARGET[1])*6,
                                  abs(total_metrics[2]-TARGET[2])*6,
                                  abs(today_metrics[0]-TARGET_TODAY[0])*6,
                                  abs(today_metrics[1]-TARGET_TODAY[1])*6,
                                  abs(today_metrics[2]-TARGET_TODAY[2])*6,
                              ))
                              results.append((score, cutoff, page_name, dedup_seconds, gap, daily_session, total_metrics, today_metrics))

          print('CLOSEST_BEGIN')
          for score, cutoff, page_name, dedup_seconds, gap, daily_session, total, today in sorted(results)[:80]:
              print(
                  f'score={score}|cutoff={cutoff.isoformat()}|page_filter={page_name}|dedup={dedup_seconds}|'
                  f'gap={gap}|daily_session={daily_session}|total={total[0]}/{total[1]}/{total[2]}|'
                  f'today={today[0]}/{today[1]}/{today[2]}'
              )
          print('CLOSEST_END')
          PY

      - name: Zapsat výsledek do PR
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.reconstruct.outcome }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/reconstruction.txt`, 'utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## Oddělená rekonstrukce zobrazení a návštěv: ${process.env.OUTCOME}`,
                '',
                '- Cíl: celkem 2 553 / 1 032 / 915; dnešek 1 104 / 439 / 389.',
                '',
                '```text', log.slice(-50000).replace(/```/g, '---'), '```'
              ].join('\n')
            });

      - name: Vyhodnotit
        if: always()
        env:
          OUTCOME: ${{ steps.reconstruct.outcome }}
        run: test "$OUTCOME" = success
