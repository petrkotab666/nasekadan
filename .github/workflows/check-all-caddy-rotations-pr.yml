name: Rekonstruovat původní statistiky z Caddy logů

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ubuntu-recover-lastminuteslevy-trigger.txt'
      - '.github/workflows/check-all-caddy-rotations-pr.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reconstruct-original-nasekadan-stats
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Najít přesný filtr podle uloženého přehledu
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 ubuntu@57.129.43.215 'sudo python3 -' <<'PY' | tee "$RUNNER_TEMP/reconstruction.txt"
          from __future__ import annotations

          import datetime as dt
          import glob
          import gzip
          import hashlib
          import json
          import re
          import runpy
          import urllib.parse
          from collections import defaultdict
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo('Europe/Prague')
          TARGET = (2553, 1032, 915)
          TARGET_TODAY = (1104, 439, 389)
          MAX_CUTOFF = dt.datetime(2026, 7, 25, 22, 5, tzinfo=TZ)
          DAY = dt.date(2026, 7, 25)

          original = runpy.run_path('/usr/local/lib/nasekadan-stats/generate.py')
          original_bot = original['BOT_RE']
          original_static = original['STATIC_RE']
          print('ORIGINAL_BOT_PATTERN=' + original_bot.pattern)
          print('ORIGINAL_STATIC_PATTERN=' + original_static.pattern)

          extended_static = re.compile(r'\.(?:css|js|mjs|jpg|jpeg|png|webp|gif|svg|ico|woff2?|ttf|eot|map|xml|txt|pdf|mp4|webm|avif|zip|gz)$', re.I)
          aggressive_bot = re.compile(
              original_bot.pattern + r'|preview|scanner|scan\b|zgrab|masscan|nmap|nikto|sqlmap|'
              r'libwww|httpclient|okhttp|java/|apache-httpclient|node-fetch|axios|postman|'
              r'phantomjs|selenium|puppeteer|playwright|scrapy|feedfetcher|validator|archive', re.I)

          def hv(headers, name):
              value = headers.get(name) or headers.get(name.lower()) or headers.get(name.title()) or ''
              return ','.join(map(str, value)) if isinstance(value, list) else str(value)

          rows = []
          files = [Path(name) for name in sorted(set(glob.glob('/var/log/caddy/nasekadan.access*'))) if Path(name).is_file()]
          for path in files:
              opener = gzip.open if path.suffix == '.gz' else open
              try:
                  handle = opener(path, 'rt', encoding='utf-8', errors='replace')
              except OSError:
                  continue
              with handle:
                  for line in handle:
                      try:
                          data = json.loads(line)
                          req = data.get('request') or {}
                          when = dt.datetime.fromtimestamp(float(data.get('ts')), dt.timezone.utc).astimezone(TZ)
                          if when > MAX_CUTOFF:
                              continue
                          method = str(req.get('method', '')).upper()
                          target = str(req.get('uri', '/'))
                          status = int(data.get('status', 0))
                          ip = str(req.get('client_ip') or req.get('remote_ip') or '')
                          headers = req.get('headers') or {}
                          ua = hv(headers, 'User-Agent')
                          accept = hv(headers, 'Accept').lower()
                          dest = hv(headers, 'Sec-Fetch-Dest').lower()
                          mode = hv(headers, 'Sec-Fetch-Mode').lower()
                      except (ValueError, TypeError, json.JSONDecodeError, OverflowError):
                          continue
                      if method not in {'GET', 'HEAD'} or not ip or ip in {'127.0.0.1', '::1'}:
                          continue
                      if not (200 <= status < 300 or status == 304):
                          continue
                      try:
                          decoded = urllib.parse.unquote(urllib.parse.urlsplit(target).path or '/', errors='replace')
                      except ValueError:
                          decoded = '/'
                      if decoded != '/':
                          decoded = decoded.rstrip('/') or '/'
                      if decoded == '/healthz' or decoded.startswith(('/statistiky', '/api/', '/nahled')):
                          continue
                      stable = hashlib.sha256(f'{ip}\0{ua}'.encode('utf-8', 'replace')).hexdigest()[:24]
                      daily = hashlib.sha256(f'{when.date()}\0{ip}\0{ua}'.encode('utf-8', 'replace')).hexdigest()[:24]
                      page_shape = decoded == '/' or decoded.endswith('.html') or decoded.endswith('/') or not re.search(r'\.[a-z0-9]{1,8}$', decoded, re.I)
                      rows.append({
                          'when': when, 'path': decoded, 'method': method, 'stable': stable, 'daily': daily,
                          'original_human': not original_bot.search(ua),
                          'aggressive_human': not aggressive_bot.search(ua),
                          'original_nonstatic': not original_static.search(decoded),
                          'extended_nonstatic': not extended_static.search(decoded),
                          'page_shape': page_shape,
                          'html': 'text/html' in accept or 'application/xhtml+xml' in accept,
                          'doc': dest in {'document', 'iframe'},
                          'nav': mode == 'navigate',
                          'mozilla': 'mozilla/' in ua.lower(),
                      })

          filters = {
              'original_exact': lambda r: r['original_human'] and r['original_nonstatic'],
              'extended_exact': lambda r: r['original_human'] and r['extended_nonstatic'],
              'original_aggressive': lambda r: r['aggressive_human'] and r['original_nonstatic'],
              'extended_aggressive': lambda r: r['aggressive_human'] and r['extended_nonstatic'],
              'shape_original': lambda r: r['original_human'] and r['extended_nonstatic'] and r['page_shape'],
              'shape_aggressive': lambda r: r['aggressive_human'] and r['extended_nonstatic'] and r['page_shape'],
              'html_original': lambda r: r['original_human'] and r['extended_nonstatic'] and r['html'],
              'html_aggressive': lambda r: r['aggressive_human'] and r['extended_nonstatic'] and r['html'],
              'doc_original': lambda r: r['original_human'] and r['extended_nonstatic'] and r['doc'],
              'nav_original': lambda r: r['original_human'] and r['extended_nonstatic'] and r['nav'],
              'mozilla_original': lambda r: r['original_human'] and r['extended_nonstatic'] and r['mozilla'],
          }

          def stats(selected, gap_minutes, session_daily):
              selected = sorted(selected, key=lambda row: row['when'])
              visitors = len({row['daily'] for row in selected})
              grouped = defaultdict(list)
              key_name = 'daily' if session_daily else 'stable'
              for row in selected:
                  grouped[row[key_name]].append(row['when'])
              sessions = 0
              gap = dt.timedelta(minutes=gap_minutes)
              for stamps in grouped.values():
                  previous = None
                  for stamp in stamps:
                      if previous is None or stamp - previous > gap:
                          sessions += 1
                      previous = stamp
              return len(selected), sessions, visitors

          candidates = []
          print(f'FILES_LOADED={len(files)}')
          print(f'ROWS_TO_MAX_CUTOFF={len(rows)}')
          for cutoff_minute in range(45, 66):
              hour = 21 + cutoff_minute // 60
              minute = cutoff_minute % 60
              cutoff = dt.datetime(2026, 7, 25, hour, minute, 59, tzinfo=TZ)
              available = [r for r in rows if r['when'] <= cutoff]
              for filter_name, predicate in filters.items():
                  base = [r for r in available if predicate(r)]
                  for get_only in (False, True):
                      selected = [r for r in base if not get_only or r['method'] == 'GET']
                      today_rows = [r for r in selected if r['when'].date() == DAY]
                      for gap in range(5, 21):
                          for session_daily in (False, True):
                              total = stats(selected, gap, session_daily)
                              today = stats(today_rows, gap, session_daily)
                              score = sum((
                                  abs(total[0]-TARGET[0])*4,
                                  abs(total[1]-TARGET[1])*5,
                                  abs(total[2]-TARGET[2])*5,
                                  abs(today[0]-TARGET_TODAY[0])*4,
                                  abs(today[1]-TARGET_TODAY[1])*5,
                                  abs(today[2]-TARGET_TODAY[2])*5,
                              ))
                              candidates.append((score, cutoff, filter_name, get_only, gap, session_daily, total, today))

          print('CLOSEST_VARIANTS_BEGIN')
          for score, cutoff, filter_name, get_only, gap, session_daily, total, today in sorted(candidates)[:80]:
              print(
                  f'score={score}|cutoff={cutoff.isoformat()}|filter={filter_name}|get_only={get_only}|'
                  f'session_min={gap}|session_daily={session_daily}|'
                  f'total={total[0]}/{total[1]}/{total[2]}|today={today[0]}/{today[1]}/{today[2]}'
              )
          print('CLOSEST_VARIANTS_END')
          PY

      - name: Zapsat výsledek do PR
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.reconstruct.outcome }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/reconstruction.txt`, 'utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## Úzká rekonstrukce původní metodiky: ${process.env.OUTCOME}`,
                '',
                '- Cíl: celkem 2 553 / 1 032 / 915; dnešek 1 104 / 439 / 389.',
                '',
                '```text', log.slice(-60000).replace(/```/g, '---'), '```'
              ].join('\n')
            });

      - name: Vyhodnotit
        if: always()
        env:
          OUTCOME: ${{ steps.reconstruct.outcome }}
        run: test "$OUTCOME" = success
