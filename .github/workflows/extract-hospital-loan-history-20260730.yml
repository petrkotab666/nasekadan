name: Vytěžit celou úvěrovou historii Nemocnice Kadaň

on:
  push:
    branches: [main]
    paths:
      - '.github/hospital-loan-history-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Nainstalovat nástroje
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ces
      - name: Projít všechny záznamy čísla 770/21-120
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, html, re, ssl, subprocess, urllib.parse, urllib.request
          from pathlib import Path

          out=Path('research/nemocnice-kadan-uver-historie-20260730')
          work=out/'_work'
          out.mkdir(parents=True,exist_ok=True); work.mkdir(parents=True,exist_ok=True)
          ctx=ssl._create_unverified_context()
          headers={'User-Agent':'Mozilla/5.0 NaseKadan-research/1.0'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,context=ctx,timeout=180) as r: return r.read()

          queries=['770/21-120','770 21 120','770-21-120']
          detail_ids=set()
          raw_pages=[]
          for q in queries:
              url='https://smlouvy.gov.cz/vyhledavani?do=searchResultList-setLimit&searchResultList-limit=500&q='+urllib.parse.quote(q)
              data=get(url).decode('utf-8','replace')
              raw_pages.append((q,url,data))
              for m in re.finditer(r'href="/smlouva/(\d+)"',data): detail_ids.add(m.group(1))
          records=[]
          for did in sorted(detail_ids,key=int):
              url=f'https://smlouvy.gov.cz/smlouva/{did}'
              try: page=get(url).decode('utf-8','replace')
              except Exception as e: continue
              plain=re.sub('<[^>]+>',' ',page); plain=html.unescape(re.sub(r'\s+',' ',plain))
              if 'Nemocnice Kadaň' not in plain and '25479300' not in plain: continue
              if not any(x in plain for x in ['770/21-120','770 21 120','770-21-120']): continue
              title=''
              mt=re.search(r'<h2[^>]*>(.*?)</h2>',page,re.S)
              if mt: title=html.unescape(re.sub('<[^>]+>',' ',mt.group(1))).strip()
              attachments=[]
              for m in re.finditer(r'href="([^"]*/smlouva/soubor/[^"]+)"',page):
                  u=html.unescape(m.group(1))
                  if u.startswith('/'): u='https://smlouvy.gov.cz'+u
                  attachments.append(u)
              records.append({'id':did,'url':url,'title':title,'plain':plain,'attachments':sorted(set(attachments))})

          lines=['# Úvěrová historie Nemocnice Kadaň – smlouva 770/21-120','',f'Nalezeno relevantních detailů: **{len(records)}**.','']
          for idx,rec in enumerate(records,1):
              lines += [f"## {rec['title'] or ('Záznam '+rec['id'])}",'',f"- Detail: {rec['url']}",f"- ID verze: {rec['id']}"]
              for label,pat in [('Datum uzavření',r'Datum uzavření:\s*([^\n]{1,40})'),('Zveřejnění',r'Zveřejnění:\s*([^\n]{1,40})'),('Číslo smlouvy',r'Číslo smlouvy / č\.j\.:\s*([^\n]{1,80})'),('Hodnota',r'Hodnota (?:bez|vč\.) DPH:\s*([^\n]{1,80})')]:
                  m=re.search(pat,rec['plain'])
                  if m: lines.append(f'- {label}: {m.group(1).strip()}')
              for aidx,url in enumerate(rec['attachments'],1):
                  pdf=work/f'{idx:02d}-{aidx:02d}.pdf'
                  try:
                      b=get(url); pdf.write_bytes(b)
                      sha=hashlib.sha256(b).hexdigest()
                      if not b.startswith(b'%PDF'): raise RuntimeError('soubor není PDF')
                      text=out/f'{idx:02d}-{aidx:02d}-{rec["id"]}.txt'
                      subprocess.run(['pdftotext','-layout',str(pdf),str(text)],check=False)
                      raw=text.read_text('utf-8','replace') if text.exists() else ''
                      if len(re.sub(r'\s+','',raw))<400:
                          prefix=work/f'{idx:02d}-{aidx:02d}-page'
                          subprocess.run(['pdftoppm','-png','-r','300',str(pdf),str(prefix)],check=False)
                          parts=[]
                          for im in sorted(work.glob(f'{idx:02d}-{aidx:02d}-page-*.png')):
                              base=im.with_suffix('')
                              subprocess.run(['tesseract',str(im),str(base),'-l','ces+eng','--psm','6'],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                              tf=base.with_suffix('.txt')
                              parts.append(tf.read_text('utf-8','replace') if tf.exists() else '')
                          raw='\n\n'.join(parts); text.write_text(raw,'utf-8')
                      lines += [f'- Příloha: {url}',f'  - SHA-256: `{sha}`',f'  - Text/OCR: `{text.name}`']
                  except Exception as e:
                      lines.append(f'- Příloha se nepodařila zpracovat: {url} — {e}')
              lines.append('')
          (out/'PREHLED.md').write_text('\n'.join(lines)+'\n','utf-8')
          PY
          rm -rf research/nemocnice-kadan-uver-historie-20260730/_work
          git config user.name 'Naše Kadaň dokumentová rešerše'
          git config user.email 'info@nasekadan.cz'
          git add research/nemocnice-kadan-uver-historie-20260730/
          git commit -m 'Dohledat celou úvěrovou historii Nemocnice Kadaň' || true
          git pull --rebase origin main
          git push origin HEAD:main
