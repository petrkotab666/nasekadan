name: Publikovat vyjádření starosty o nemocnici, Slovanu a školách

on:
  push:
    branches: [main]
    paths:
      - '.github/publish-mayor-statement-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-mayor-statement-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SLUG: starosta-losenicky-nemocnice-slovan-nepedagogove
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vytvořit článek a všechny veřejné přehledy
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_mayor_statement_article.py
          grep -Fq 'Starosta: Nemocnice to zvládne' "clanky/${SLUG}.html"
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" news-sitemap.xml

      - name: Trvale uložit publikaci do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add "clanky/${SLUG}.html" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt production-content-manifest.json
          git commit -m 'Publikovat vyjádření starosty o nemocnici, Slovanu a školách' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit článek, titulku a přehledy přímo na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nk-mayor/clanky"
          cp "clanky/${SLUG}.html" "$RUNNER_TEMP/nk-mayor/clanky/"
          cp clanky/index.html "$RUNNER_TEMP/nk-mayor/clanky/index.html"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt production-content-manifest.json "$RUNNER_TEMP/nk-mayor/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/nk-mayor" ubuntu@57.129.43.215:/tmp/nk-mayor-publication
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 /tmp/nk-mayor-publication/clanky/starosta-losenicky-nemocnice-slovan-nepedagogove.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-mayor-publication/clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 /tmp/nk-mayor-publication/index.html /var/www/nasekadan/index.html
          sudo install -m 0644 /tmp/nk-mayor-publication/rss.xml /tmp/nk-mayor-publication/sitemap.xml /tmp/nk-mayor-publication/news-sitemap.xml /tmp/nk-mayor-publication/llms.txt /tmp/nk-mayor-publication/robots.txt /tmp/nk-mayor-publication/production-content-manifest.json /var/www/nasekadan/
          sudo chmod -R a+rX /var/www/nasekadan

          if docker ps --format '{{.Names}}' | grep -Fxq 'nasekadan-web'; then
            docker cp /tmp/nk-mayor-publication/clanky/starosta-losenicky-nemocnice-slovan-nepedagogove.html nasekadan-web:/usr/share/nginx/html/clanky/starosta-losenicky-nemocnice-slovan-nepedagogove.html
            docker cp /tmp/nk-mayor-publication/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            docker cp /tmp/nk-mayor-publication/index.html nasekadan-web:/usr/share/nginx/html/index.html
            docker cp /tmp/nk-mayor-publication/rss.xml nasekadan-web:/usr/share/nginx/html/rss.xml
            docker cp /tmp/nk-mayor-publication/sitemap.xml nasekadan-web:/usr/share/nginx/html/sitemap.xml
            docker cp /tmp/nk-mayor-publication/news-sitemap.xml nasekadan-web:/usr/share/nginx/html/news-sitemap.xml
            docker cp /tmp/nk-mayor-publication/llms.txt nasekadan-web:/usr/share/nginx/html/llms.txt
            docker cp /tmp/nk-mayor-publication/robots.txt nasekadan-web:/usr/share/nginx/html/robots.txt
          fi
          rm -rf /tmp/nk-mayor-publication
          grep -Fq 'Starosta: Nemocnice to zvládne' /var/www/nasekadan/clanky/starosta-losenicky-nemocnice-slovan-nepedagogove.html
          grep -Fq '/clanky/starosta-losenicky-nemocnice-slovan-nepedagogove.html' /var/www/nasekadan/index.html
          REMOTE

      - name: Veřejně ověřit článek a zařazení
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for attempt in $(seq 1 24); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            if grep -Fq 'Starosta: Nemocnice to zvládne' <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$news"; then
              echo 'HOTOVO: článek, titulka, archiv, RSS a obě sitemapy jsou veřejně ověřené.'
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Zapsat stav publikace
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'mayor-statement-publication-status.json';
            const ok = process.env.BUILD === 'success' && process.env.DEPLOY === 'success' && process.env.VERIFY === 'success';
            const status = {
              status: ok ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              build: process.env.BUILD || 'skipped',
              server_deploy: process.env.DEPLOY || 'skipped',
              public_verification: process.env.VERIFY || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat stav publikace vyjádření starosty: ${status.status}`,
              content,
              ...(sha ? { sha } : {})
            });
