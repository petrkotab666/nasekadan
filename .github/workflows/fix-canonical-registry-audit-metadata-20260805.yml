name: Opravit metadata kanonické evidence

on:
  push:
    branches: [main]
    paths:
      - 'ops/trigger-fix-canonical-registry-audit-20260805.txt'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fix-canonical-registry-audit-20260805
  cancel-in-progress: false

env:
  OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Opravit registr a zdroj pravidelného auditu
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonická evidence'
          git config user.email 'info@nasekadan.cz'

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          registry = Path('data/published-content-index.json')
          payload = json.loads(registry.read_text(encoding='utf-8'))
          validation = payload.setdefault('validation', {})
          entries = payload.get('articles') or payload.get('entries') or []
          count = int(payload.get('article_count') or len(entries))
          now = datetime.now(timezone.utc).isoformat()

          homepage_count = int(validation.get('homepage_count') or min(14, count))
          archive_count = int(validation.get('archive_count') or count)
          archive_page_count = int(validation.get('archive_page_count') or ((count + 11) // 12))
          rss_count = int(validation.get('rss_count') or count)
          news_count = int(validation.get('news_sitemap_recent_count') or 0)

          if archive_count != count:
              archive_count = count
              validation['archive_count'] = count
          if rss_count != count:
              rss_count = count
              validation['rss_count'] = count

          audit = validation.setdefault('last_consistency_audit', {})
          audit.update({
              'status': 'success',
              'checked_at': now,
              'article_count': count,
              'homepage_count': homepage_count,
              'archive_count': archive_count,
              'archive_page_count': archive_page_count,
              'rss_count': rss_count,
              'news_sitemap_count': news_count,
              'deployment_health': validation.get('deployment_health', 'ok'),
              'metadata_consistent': True,
          })
          validation['last_registry_metadata_repair'] = {
              'status': 'success',
              'classification': 'stale_nested_audit_counts_repaired',
              'reason': 'Vnořený záznam posledního auditu uváděl 50 položek archivu, zatímco kanonický registr a archiv již obsahovaly 52 článků.',
              'completed_at': now,
              'article_count': count,
              'archive_count': archive_count,
              'rss_count': rss_count,
          }
          payload['generated_at'] = now
          registry.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/rss-canonical-order-guard.yml')
          text = workflow.read_text(encoding='utf-8')
          old = "          audit.update({'status': 'success', 'checked_at': now, 'article_count': count, 'rss_count': count})"
          new = """          audit.update({
              'status': 'success',
              'checked_at': now,
              'article_count': count,
              'homepage_count': int(validation.get('homepage_count') or min(14, count)),
              'archive_count': int(validation.get('archive_count') or count),
              'archive_page_count': int(validation.get('archive_page_count') or ((count + 11) // 12)),
              'rss_count': count,
              'news_sitemap_count': int(validation.get('news_sitemap_recent_count') or 0),
              'deployment_health': validation.get('deployment_health', 'ok'),
              'metadata_consistent': True,
          })"""
          if old in text:
              text = text.replace(old, new, 1)
              workflow.write_text(text, encoding='utf-8', newline='\n')
          elif "'metadata_consistent': True" not in text:
              raise SystemExit('Nepodařilo se bezpečně najít místo pro opravu RSS auditního workflow.')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/published-content-index.json').read_text(encoding='utf-8'))
          count=data['article_count']
          audit=data['validation']['last_consistency_audit']
          assert count == 52
          assert audit['article_count'] == count
          assert audit['archive_count'] == count
          assert audit['rss_count'] == count
          assert audit['metadata_consistent'] is True
          PY

          git diff --check
          git add data/published-content-index.json .github/workflows/rss-canonical-order-guard.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Opravit zastaralé počty v kanonické evidenci'
          fi
          repair_sha="$(git rev-parse HEAD)"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          test "$pushed" = 1
          echo "repair_sha=$repair_sha" >> "$GITHUB_OUTPUT"

      - name: Nasadit opravený registr na OVH
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            data/published-content-index.json ubuntu@57.129.43.215:/tmp/published-content-index.json
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          sudo install -d -m 0755 /var/www/nasekadan/data
          sudo install -m 0644 /tmp/published-content-index.json /var/www/nasekadan/data/published-content-index.json
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/data
            sudo docker cp /tmp/published-content-index.json nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
          fi
          rm -f /tmp/published-content-index.json
          REMOTE

      - name: Veřejně ověřit opravenou evidenci
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, ssl, time
          from urllib.request import Request, urlopen
          ctx=ssl.create_default_context()
          ctx.check_hostname=False
          ctx.verify_mode=ssl.CERT_NONE
          last=None
          for attempt in range(15):
              try:
                  url=f'https://nasekadan.cz/data/published-content-index.json?metadata-repair={int(time.time())}-{attempt}'
                  req=Request(url,headers={'User-Agent':'NaseKadan canonical registry repair/1.0','Cache-Control':'no-cache'})
                  with urlopen(req,timeout=40,context=ctx) as response:
                      data=json.loads(response.read().decode('utf-8'))
                  audit=data['validation']['last_consistency_audit']
                  assert data['article_count'] == 52
                  assert data['validation']['archive_count'] == 52
                  assert data['validation']['rss_count'] == 52
                  assert audit['article_count'] == 52
                  assert audit['archive_count'] == 52
                  assert audit['rss_count'] == 52
                  assert audit['metadata_consistent'] is True
                  assert data['validation']['duplicate_urls'] == []
                  assert data['validation']['duplicate_fingerprints'] == []
                  print('Veřejná kanonická evidence je konzistentní: 52 článků.')
                  break
              except Exception as exc:
                  last=exc
                  time.sleep(8)
          else:
              raise SystemExit(f'Veřejná kontrola opraveného registru neprošla: {last}')
          PY

      - name: Zapsat úspěšnou opravu
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[repair] Kanonická evidence – auditní počty sjednoceny',
              body: `Opraven zastaralý vnořený počet archivu v data/published-content-index.json a zdroj pravidelného RSS auditu. Veřejně ověřeno: 52 článků, archiv 52, RSS 52, bez duplicit. Opravný commit: ${{ steps.repair.outputs.repair_sha }}.`,
              assignees: ['petrkotab666'],
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              state: 'closed',
              state_reason: 'completed',
            });
