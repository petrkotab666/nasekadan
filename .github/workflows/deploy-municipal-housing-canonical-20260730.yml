name: Kanonicky nasadit článek MVE Hradiště

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-municipal-housing-canonical-20260730.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-canonical-production-mve-hradiste
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SERVER: 57.129.43.215
      ARTICLE_SLUG: mve-hradiste-nova-vodni-elektrarna-2026.html
      ARTICLE_H1: U Hradiště má vzniknout nová malá vodní elektrárna. Vodu přivede potrubí dlouhé 520 metrů
      SOCIAL_IMAGE: mve-hradiste-nova-vodni-elektrarna-2026.png
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit chybějící nedávné články do RSS
        id: rss_repair
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ensure_recent_rss_entries.py
          python3 scripts/ensure_recent_rss_entries.py
          git config user.name 'Naše Kadaň publikační oprava'
          git config user.email 'info@nasekadan.cz'
          git add rss.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Doplnit chybějící nedávné články do RSS'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Připravit SSH klíč
        id: ssh
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Spustit jediný kanonický produkční postup
        id: canonical
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            "ubuntu@$SERVER" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo chown -R ubuntu:ubuntu /opt/nasekadan
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

      - name: Zjistit přesný nasazený source commit
        id: source
        run: |
          set -euo pipefail
          source_sha="$(ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            "ubuntu@$SERVER" 'cd /opt/nasekadan && git rev-parse HEAD')"
          test -n "$source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Nasazený source commit: $source_sha"

      - name: Veřejně ověřit článek a všechny publikační plochy
        id: public_verify
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          for attempt in $(seq 1 30); do
            key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/$ARTICLE_SLUG?mve=$key" || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?mve=$key" || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?mve=$key" || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?mve=$key" || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?mve=$key" || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?mve=$key" || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?mve=$key" || true)"
            image_file="$RUNNER_TEMP/mve-social-${attempt}.png"
            rm -f "$image_file"
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/social/$SOCIAL_IMAGE?mve=$key" -o "$image_file" || true
            image_ok=no
            if [ -s "$image_file" ] && python3 - "$image_file" <<'PY'
          import struct, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          ok = data.startswith(b'\x89PNG\r\n\x1a\n') and len(data) > 10000 and struct.unpack('>II', data[16:24]) == (1200, 630)
          raise SystemExit(0 if ok else 1)
          PY
            then image_ok=yes; fi
            if grep -Fq "<h1>$ARTICLE_H1</h1>" <<<"$article" \
              && grep -Fq "/clanky/$ARTICLE_SLUG" <<<"$home" \
              && grep -Fq "/clanky/$ARTICLE_SLUG" <<<"$archive" \
              && grep -Fq "$ARTICLE_SLUG" <<<"$rss" \
              && grep -Fq "$ARTICLE_SLUG" <<<"$sitemap" \
              && grep -Fq "$ARTICLE_SLUG" <<<"$news" \
              && grep -Fq "source=$SOURCE_SHA" <<<"$health" \
              && [ "$image_ok" = yes ]; then
              echo "Veřejně ověřeno: článek, titulka, archiv, RSS, obě sitemapy, PNG a source=$SOURCE_SHA."
              exit 0
            fi
            sleep 8
          done
          echo 'Veřejná kontrola nedoložila kompletní aktuální publikaci.' >&2
          exit 1

      - name: Zapsat diagnostiku pouze při selhání
        if: failure()
        uses: actions/github-script@v7
        env:
          RSS_OUTCOME: ${{ steps.rss_repair.outcome }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          CANONICAL_OUTCOME: ${{ steps.canonical.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          VERIFY_OUTCOME: ${{ steps.public_verify.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const path = '.github/mve-hradiste-deploy-failure.json';
            const state = {
              status: 'failed',
              checked_at_utc: new Date().toISOString(),
              workflow_commit: context.sha,
              run_id: context.runId,
              rss_repair: process.env.RSS_OUTCOME || 'unknown',
              ssh: process.env.SSH_OUTCOME || 'unknown',
              canonical_deploy: process.env.CANONICAL_OUTCOME || 'unknown',
              source_lookup: process.env.SOURCE_OUTCOME || 'unknown',
              public_verify: process.env.VERIFY_OUTCOME || 'unknown',
              deployed_source: process.env.SOURCE_SHA || null
            };
            const content = Buffer.from(JSON.stringify(state, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: 'Zapsat selhání kanonického nasazení MVE Hradiště',
              content,
              ...(sha ? {sha} : {})
            });
