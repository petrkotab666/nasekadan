name: Kanonicky nasadit článek o městských bytech

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-municipal-housing-canonical-20260730.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-canonical-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SERVER: 57.129.43.215
      ARTICLE_SLUG: mestske-byty-kadan-nabidka-srpen-2026.html
      ARTICLE_H1: Město Kadaň nabízí šest bytů. Žádat mohou mladí, domácnosti v nouzi, samoživitelé i senioři
    steps:
      - name: Načíst aktuální workflow
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit SSH klíč
        id: ssh
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Spustit jediný kanonický produkční postup
        id: canonical
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            "ubuntu@$SERVER" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

      - name: Zjistit přesný nasazený source commit
        id: source
        run: |
          set -euo pipefail
          source_sha="$(ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            "ubuntu@$SERVER" 'cd /opt/nasekadan && git rev-parse HEAD')"
          test -n "$source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Nasazený source commit: $source_sha"

      - name: Veřejně ověřit článek a všechny publikační plochy
        id: public_verify
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          for attempt in $(seq 1 30); do
            key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/$ARTICLE_SLUG?housing=$key" || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?housing=$key" || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?housing=$key" || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?housing=$key" || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?housing=$key" || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?housing=$key" || true)"
            if grep -Fq "$ARTICLE_H1" <<<"$article" \
              && grep -Fq "/clanky/$ARTICLE_SLUG" <<<"$home" \
              && grep -Fq "/clanky/$ARTICLE_SLUG" <<<"$archive" \
              && grep -Fq "$ARTICLE_SLUG" <<<"$rss" \
              && grep -Fq "$ARTICLE_SLUG" <<<"$sitemap" \
              && grep -Fq "source=$SOURCE_SHA" <<<"$health"; then
              echo "Veřejně ověřeno: článek, titulka, archiv, RSS, sitemap a source=$SOURCE_SHA."
              exit 0
            fi
            sleep 8
          done
          echo 'Veřejná kontrola nedoložila kompletní aktuální publikaci.' >&2
          exit 1

      - name: Zapsat diagnostiku pouze při selhání
        if: failure()
        uses: actions/github-script@v7
        env:
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          CANONICAL_OUTCOME: ${{ steps.canonical.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          VERIFY_OUTCOME: ${{ steps.public_verify.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const path = '.github/municipal-housing-deploy-failure.json';
            const state = {
              status: 'failed',
              checked_at_utc: new Date().toISOString(),
              workflow_commit: context.sha,
              run_id: context.runId,
              ssh: process.env.SSH_OUTCOME || 'unknown',
              canonical_deploy: process.env.CANONICAL_OUTCOME || 'unknown',
              source_lookup: process.env.SOURCE_OUTCOME || 'unknown',
              public_verify: process.env.VERIFY_OUTCOME || 'unknown',
              deployed_source: process.env.SOURCE_SHA || null
            };
            const content = Buffer.from(JSON.stringify(state, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: 'Zapsat selhání kanonického nasazení článku o bytech',
              content,
              ...(sha ? {sha} : {})
            });
