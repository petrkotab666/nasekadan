name: Opravit a nasadit nejnovější článek o bytech

on:
  push:
    branches: [main]
    paths:
      - '.github/latest-housing-fix-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-latest-housing-live-fix
  cancel-in-progress: true

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SERVER: 57.129.43.215
      SLUG: mestske-byty-kadan-nabidka-srpen-2026
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sestavit správné pořadí a úplné publikační výstupy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_municipal_housing_20260730.py
          python3 scripts/ensure_all_published_articles_in_rss.py
          python3 scripts/enforce_current_article_order.py
          python3 scripts/prepare_discovery.py
          python3 scripts/ensure_all_published_articles_in_rss.py

          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" news-sitemap.xml
          grep -Fq 'Nemocnice Kadaň mění vedení' rss.xml
          grep -Fq 'nová revmatologická ambulance' rss.xml
          echo 'Místní výstupy jsou kompletní.'

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit opravené soubory přímo na produkci
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/nk-housing-live"
          mkdir -p "$RUNNER_TEMP/nk-housing-live/clanky"
          cp "clanky/${SLUG}.html" "$RUNNER_TEMP/nk-housing-live/clanky/"
          cp clanky/index.html "$RUNNER_TEMP/nk-housing-live/clanky/index.html"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$RUNNER_TEMP/nk-housing-live/"

          scp -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r \
            "$RUNNER_TEMP/nk-housing-live" "ubuntu@$SERVER:/tmp/nk-housing-live"

          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "ubuntu@$SERVER" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 /tmp/nk-housing-live/clanky/mestske-byty-kadan-nabidka-srpen-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-housing-live/clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 /tmp/nk-housing-live/index.html /tmp/nk-housing-live/rss.xml /tmp/nk-housing-live/sitemap.xml /tmp/nk-housing-live/news-sitemap.xml /tmp/nk-housing-live/llms.txt /tmp/nk-housing-live/robots.txt /var/www/nasekadan/
          sudo chmod -R a+rX /var/www/nasekadan

          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-housing-live/clanky/mestske-byty-kadan-nabidka-srpen-2026.html nasekadan-web:/usr/share/nginx/html/clanky/mestske-byty-kadan-nabidka-srpen-2026.html
            sudo docker cp /tmp/nk-housing-live/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker cp /tmp/nk-housing-live/index.html nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp /tmp/nk-housing-live/rss.xml nasekadan-web:/usr/share/nginx/html/rss.xml
            sudo docker cp /tmp/nk-housing-live/sitemap.xml nasekadan-web:/usr/share/nginx/html/sitemap.xml
            sudo docker cp /tmp/nk-housing-live/news-sitemap.xml nasekadan-web:/usr/share/nginx/html/news-sitemap.xml
            sudo docker cp /tmp/nk-housing-live/llms.txt nasekadan-web:/usr/share/nginx/html/llms.txt
            sudo docker cp /tmp/nk-housing-live/robots.txt nasekadan-web:/usr/share/nginx/html/robots.txt
          fi
          rm -rf /tmp/nk-housing-live
          REMOTE

      - name: Veřejně ověřit článek, titulku, archiv a feedy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for attempt in $(seq 1 24); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            if grep -Fq 'Město Kadaň nabízí šest bytů' <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$news"; then
              echo 'HOTOVO: nejnovější článek o bytech je viditelný na všech publikačních plochách.'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Trvale uložit opravené výstupy do main
        if: steps.deploy.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add index.html clanky/index.html "clanky/${SLUG}.html" rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt production-content-manifest.json
          if git diff --cached --quiet; then
            echo 'Main už obsahuje stejné opravené výstupy.'
            exit 0
          fi
          git commit -m 'Zobrazit nejnovější článek o městských bytech na celém webu'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo 'Živý web je opravený, ale trvalý push do main se nepodařil.' >&2
          exit 1

      - name: Zapsat stav opravy
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'latest-housing-live-fix-status.json';
            const ok = process.env.DEPLOY === 'success' && process.env.VERIFY === 'success';
            const state = {
              status: ok ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              server_deploy: process.env.DEPLOY || 'skipped',
              public_verification: process.env.VERIFY || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(state, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',
              message:`Zapsat stav opravy zobrazení článku o bytech: ${state.status}`,
              content,...(sha?{sha}:{})
            });
