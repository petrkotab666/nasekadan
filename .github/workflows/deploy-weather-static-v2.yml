name: Nasadit statické počasí na OVH v2
run-name: Počasí z místní kopie s obnovou po 10 minutách

on:
  push:
    branches: [main]
    paths:
      - '.github/weather-static-v2-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-weather-static-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Vybrat SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_key"
              chmod 600 "$RUNNER_TEMP/nasekadan_key"
              echo "secret=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 20

      - name: Nasadit místní data a desetiminutový časovač
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/nasekadan_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd

          sudo install -D -m 0644 pocasi/index.html /var/www/nasekadan/pocasi/index.html
          sudo install -D -m 0644 pocasi.js /var/www/nasekadan/pocasi.js
          sudo install -D -m 0644 navigation.js /var/www/nasekadan/navigation.js
          sudo install -D -m 0644 upoutavky.js /var/www/nasekadan/upoutavky.js

          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          [[ -n "$cid" ]] || cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"
          [[ -n "$cid" ]]
          sudo docker exec "$cid" mkdir -p /usr/share/nginx/html/pocasi /usr/share/nginx/html/api/chmi-pocasi
          sudo docker cp pocasi/index.html "$cid:/usr/share/nginx/html/pocasi/index.html"
          sudo docker cp pocasi.js "$cid:/usr/share/nginx/html/pocasi.js"
          sudo docker cp navigation.js "$cid:/usr/share/nginx/html/navigation.js"
          sudo docker cp upoutavky.js "$cid:/usr/share/nginx/html/upoutavky.js"
          sudo docker cp nginx/default.conf "$cid:/etc/nginx/conf.d/default.conf"
          sudo docker exec "$cid" nginx -t
          sudo docker exec "$cid" nginx -s reload

          chmod +x deploy/install-weather-proxy.sh deploy/update-weather-data.sh deploy/install-weather-timer.sh
          sudo bash deploy/install-weather-proxy.sh
          sudo bash deploy/install-weather-timer.sh

          sudo systemctl is-active --quiet nasekadan-weather.timer
          sudo systemctl show -p Result nasekadan-weather.service | grep -Fq 'Result=success'
          test -s /var/www/nasekadan/api/pocasi-predpoved.json
          ls /var/www/nasekadan/api/chmi-pocasi/10m-0-20000-0-11438-*.json >/dev/null
          curl -fsS --max-time 15 http://127.0.0.1:3224/api/pocasi-predpoved.json >/dev/null
          REMOTE

      - name: Ověřit veřejnou stránku a oba datové zdroje
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base='https://nasekadan.cz'; nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          page="$(mktemp)"; script="$(mktemp)"; forecast="$(mktemp)"; observation="$(mktemp)"
          curl -kfsS --max-time 35 "$base/pocasi/?verify=$nonce" -o "$page"
          grep -Fq 'Počasí v Kadani' "$page"
          curl -kfsS --max-time 35 "$base/pocasi.js?verify=$nonce" -o "$script"
          grep -Fq '/api/pocasi-predpoved.json' "$script"
          curl -kfsS --max-time 35 "$base/api/pocasi-predpoved.json?verify=$nonce" -o "$forecast"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1],encoding='utf-8'));s=d.get('properties',{}).get('timeseries',[]);assert isinstance(s,list) and len(s)>=24;print(f'Předpověď ověřena: {len(s)} kroků')" "$forecast"
          today="$(TZ=Europe/Prague date +%Y%m%d)"; yesterday="$(TZ=Europe/Prague date -d yesterday +%Y%m%d)"; found=false
          for day in "$today" "$yesterday"; do
            if curl -kfsS --max-time 35 "$base/api/chmi-pocasi/10m-0-20000-0-11438-${day}.json?verify=$nonce" -o "$observation" && python3 -c "import json,sys;d=json.load(open(sys.argv[1],encoding='utf-8'));assert isinstance(d,dict) and d" "$observation"; then found=true; break; fi
          done
          [[ "$found" == true ]]
          rm -f "$page" "$script" "$forecast" "$observation"

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          KEY_SECRET: ${{ steps.key.outputs.secret }}
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const success=process.env.DEPLOY_OUTCOME==='success'&&process.env.VERIFY_OUTCOME==='success';
            const payload={status:success?'success':'failure',source_sha:context.sha,run_id:String(context.runId),checked_at:new Date().toISOString(),ssh_key:process.env.KEY_SECRET||'',deploy:process.env.DEPLOY_OUTCOME||'',data_verify:process.env.VERIFY_OUTCOME||'',update_interval_minutes:10,page:'https://nasekadan.cz/pocasi/'};
            let sha;
            try{const old=await github.rest.repos.getContent({owner,repo,path:'.github/weather-live-status.json',ref:'main'});sha=old.data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'.github/weather-live-status.json',message:`Zapsat stav živého počasí: ${payload.status} [skip ci]`,content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64'),sha,branch:'main'});
