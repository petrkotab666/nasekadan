name: Autoritativní kontrola sociálních grafik – pouze audit

# Kontrola nesmí generovat, commitovat ani nasazovat HTML či grafiky.
# Opravy patří do explicitní publikační změny a následného kanonického deploye.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'social/**'
      - 'clanky/*.html'
      - 'scripts/generate_social_cards.py'
      - 'scripts/normalize_social_badges.py'
      - 'scripts/normalize_social_badges_v2.py'
      - '.github/workflows/social-badge-quality-v2.yml'
  schedule:
    - cron: '27 2 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: social-badge-quality-v2-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Nainstalovat obrazové nástroje
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow numpy

      - name: Provést pouze kontrolu sociálních grafik
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/normalize_social_badges.py scripts/normalize_social_badges_v2.py
          mkdir -p "$RUNNER_TEMP/social-audit"
          python3 scripts/normalize_social_badges_v2.py \
            --check \
            --report "$RUNNER_TEMP/social-audit/report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'social-audit/report.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('issuesAfter', 0) == 0, d
          print(f"OK: zkontrolováno {d.get('imagesScanned', 0)} sociálních grafik; nic nebylo změněno.")
          PY
          git diff --exit-code

      - name: Nahlásit grafickou regresi bez samoopravy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[incident] Sociální grafika nesplnila audit – bez samoopravy'
          body="Grafický audit nalezl problém. Workflow záměrně nic negeneruje, necommitne ani nenasazuje. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
