name: Spolehlivě nasadit a ověřit článek o koupališti
run-name: Přímé OVH nasazení koupaliště, přehledů, feedů a obrázku

on:
  push:
    branches: [main]
    paths:
      - deploy-praktici-now.txt
      - clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html
      - rss.xml
      - sitemap.xml
      - news-sitemap.xml
      - index.html
      - clanky/index.html
      - .github/workflows/deploy-praktici-now.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-pool-direct-publication
  cancel-in-progress: false

env:
  SLUG: koupaliste-kadan-pozemky-skluzavka-provoz-2026
  ARTICLE: clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html
  IMAGE: social/koupaliste-kadan-pozemky-skluzavka-provoz-2026-fb4affdb0a.png

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit zdrojové podklady
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ARTICLE"
          test -f "$IMAGE"
          grep -Fq 'Kadaňské koupaliště slaví 50 let' "$ARTICLE"
          grep -Fq 'Veřejnost by proto oprávněně zajímalo' "$ARTICLE"
          grep -Fq 'kdy bude možné atrakci bezpečně používat i v horkých dnech' "$ARTICLE"
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" news-sitemap.xml
          python3 - "$IMAGE" <<'PY'
          import struct, sys
          from pathlib import Path
          p=Path(sys.argv[1]); data=p.read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)>=24
          assert struct.unpack('>II', data[16:24]) == (1200, 630)
          assert len(data) >= 10000
          PY

      - name: Připravit SSH klíč a balíček
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/nk-pool-live"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$IMAGE" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml "$bundle/"

      - name: Nasadit povinné soubory na OVH i do aktivního kontejneru
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-pool-live"
          scp -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-pool-live
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          root=/var/www/nasekadan
          stage=/tmp/nk-pool-live
          sudo install -d -m 0755 "$root/clanky" "$root/social"
          sudo install -m 0644 "$stage/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html" "$root/clanky/"
          sudo install -m 0644 "$stage/clanky/index.html" "$root/clanky/index.html"
          sudo install -m 0644 "$stage/social/koupaliste-kadan-pozemky-skluzavka-provoz-2026-fb4affdb0a.png" "$root/social/"
          sudo install -m 0644 "$stage/index.html" "$stage/rss.xml" "$stage/sitemap.xml" "$stage/news-sitemap.xml" "$root/"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp "$stage/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html" nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$stage/clanky/index.html" nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker cp "$stage/social/koupaliste-kadan-pozemky-skluzavka-provoz-2026-fb4affdb0a.png" nasekadan-web:/usr/share/nginx/html/social/
            sudo docker cp "$stage/index.html" nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp "$stage/rss.xml" nasekadan-web:/usr/share/nginx/html/rss.xml
            sudo docker cp "$stage/sitemap.xml" nasekadan-web:/usr/share/nginx/html/sitemap.xml
            sudo docker cp "$stage/news-sitemap.xml" nasekadan-web:/usr/share/nginx/html/news-sitemap.xml
          fi
          sudo chmod -R a+rX "$root"
          stamp="$(date +%s)"
          article="$(curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html?local=$stamp")"
          home="$(curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz/?local=$stamp")"
          archive="$(curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz/clanky/?local=$stamp")"
          rss="$(curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz/rss.xml?local=$stamp")"
          sitemap="$(curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz/sitemap.xml?local=$stamp")"
          news="$(curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz/news-sitemap.xml?local=$stamp")"
          grep -Fq 'Kadaňské koupaliště slaví 50 let' <<<"$article"
          grep -Fq '/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html' <<<"$home"
          grep -Fq '/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html' <<<"$archive"
          grep -Fq 'https://nasekadan.cz/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html' <<<"$rss"
          grep -Fq 'https://nasekadan.cz/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html' <<<"$sitemap"
          grep -Fq 'https://nasekadan.cz/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html' <<<"$news"
          rm -rf "$stage"
          REMOTE

      - name: Veřejně ověřit článek, přehledy, feedy a PNG
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 24); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            image="$RUNNER_TEMP/pool-${attempt}.png"
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/social/koupaliste-kadan-pozemky-skluzavka-provoz-2026-fb4affdb0a.png?v=${stamp}-${attempt}" -o "$image" 2>/dev/null || true
            image_ok="$(python3 - "$image" <<'PY'
          import struct, sys
          from pathlib import Path
          try:
              data=Path(sys.argv[1]).read_bytes()
              ok=data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)>=10000 and struct.unpack('>II',data[16:24])==(1200,630)
              print('yes' if ok else 'no')
          except Exception:
              print('no')
          PY
            )"
            if grep -Fq 'Kadaňské koupaliště slaví 50 let' <<<"$article" \
              && grep -Fq 'Veřejnost by proto oprávněně zajímalo' <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$news" \
              && [[ "$image_ok" == yes ]]; then
              echo 'Veřejné zveřejnění článku o koupališti je kompletně ověřené.'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Zapsat ověřený stav
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const status = {
              status: process.env.DEPLOY === 'success' && process.env.VERIFY === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              direct_deploy: process.env.DEPLOY || 'unknown',
              public_verification: process.env.VERIFY || 'unknown',
              article_url: 'https://nasekadan.cz/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html',
              social_image: 'https://nasekadan.cz/social/koupaliste-kadan-pozemky-skluzavka-provoz-2026-fb4affdb0a.png'
            };
            const path = '.github/pool-live-status.json';
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              if (!Array.isArray(current.data)) sha=current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',
              message:`Zapsat veřejný stav článku o koupališti: ${status.status}`,
              content,...(sha?{sha}:{})
            });
            if (status.status !== 'success') core.setFailed('Veřejná kontrola článku o koupališti neprošla.');
