name: Publikovat změnu stravného ZŠ Chomutovská
run-name: Článek, kanonické nasazení a veřejné ověření

on:
  push:
    branches: [main]
    paths:
      - '.github/publish-school-meals-chomutovska-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nasekadan-canonical-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE: clanky/zs-chomutovska-kadan-stravne-zari-2026.html
      ARTICLE_PATH: /clanky/zs-chomutovska-kadan-stravne-zari-2026.html
      EXPECTED_H1: ZŠ Chomutovská od září zdraží obědy. Rodiče mají zvýšit limit inkasa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit článek a všechny indexy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_school_meals_chomutovska_20260729.py
          python3 scripts/normalize_footers.py --write --check
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/sort_articles_chronologically.py
          grep -Fq "<h1>$EXPECTED_H1</h1>" "$ARTICLE"
          grep -Fq '700 Kč' "$ARTICLE"
          grep -Fq '900 Kč' "$ARTICLE"
          grep -Fq 'zs-chomutovska-kadan-stravne-zari-2026.html' index.html
          grep -Fq 'zs-chomutovska-kadan-stravne-zari-2026.html' clanky/index.html
          grep -Fq 'zs-chomutovska-kadan-stravne-zari-2026.html' rss.xml
          grep -Fq 'zs-chomutovska-kadan-stravne-zari-2026.html' sitemap.xml

      - name: Uložit publikaci do main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add "$ARTICLE" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml production-content-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publikovat: nové stravné ZŠ Chomutovská'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git fetch origin main
          git reset --hard origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Provést kanonické produkční nasazení
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo chown -R ubuntu:ubuntu /opt/nasekadan
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          bash deploy/sync-production.sh
          REMOTE

      - name: Veřejně ověřit článek a distribuční kanály
        id: verify
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          for attempt in $(seq 1 30); do
            code="$(curl -4 -k -L -sS -o "$RUNNER_TEMP/page.html" -w '%{http_code}' "https://nasekadan.cz${ARTICLE_PATH}?v=$stamp-$attempt" || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=$stamp-$attempt" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=$stamp-$attempt" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=$stamp-$attempt" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=$stamp-$attempt" 2>/dev/null || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?v=$stamp-$attempt" 2>/dev/null || true)"
            if [[ "$code" == '200' ]] \
              && grep -Fq "<h1>$EXPECTED_H1</h1>" "$RUNNER_TEMP/page.html" \
              && grep -Fq '700 Kč' "$RUNNER_TEMP/page.html" \
              && grep -Fq '900 Kč' "$RUNNER_TEMP/page.html" \
              && grep -Fq 'zs-chomutovska-kadan-stravne-zari-2026.html' <<<"$home" \
              && grep -Fq 'zs-chomutovska-kadan-stravne-zari-2026.html' <<<"$archive" \
              && grep -Fq 'zs-chomutovska-kadan-stravne-zari-2026.html' <<<"$rss" \
              && grep -Fq 'zs-chomutovska-kadan-stravne-zari-2026.html' <<<"$sitemap" \
              && grep -Fq "source=$EXPECTED_SHA" <<<"$health"; then
              echo 'Veřejná publikace byla ověřena.'
              exit 0
            fi
            sleep 8
          done
          echo 'Veřejné ověření publikace neprošlo.' >&2
          exit 1

      - name: Zapsat skutečný výsledek do monitoringu
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PUBLISHED_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const ok = process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success';
            const body = [
              ok ? '## ÚSPĚŠNĚ PUBLIKOVÁNO A VEŘEJNĚ OVĚŘENO' : '## PUBLIKACE NEBYLA PLNĚ OVĚŘENA',
              '',
              '- Nové ceny od 1. 9. 2026: 26, 29, 31 a 32 Kč podle věku.',
              '- Limit inkasa od 15. 8. 2026: 700 Kč bez družiny, 900 Kč s družinou.',
              `- Commit: \`${process.env.PUBLISHED_SHA || context.sha}\``,
              `- Běh: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- Článek: https://nasekadan.cz/clanky/zs-chomutovska-kadan-stravne-zari-2026.html',
              '',
              ok
                ? 'Článek vrací HTTP 200 se správným H1; titulní stránka, archiv, RSS, sitemap a deployment-health.txt prošly přímou veřejnou kontrolou.'
                : 'Veřejný web je zdrojem pravdy. Zkontrolovat log a produkční URL; stav nelze označit za úspěšný.'
            ].join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 119,
              body,
              state: ok ? 'closed' : 'open',
              state_reason: ok ? 'completed' : undefined
            });
