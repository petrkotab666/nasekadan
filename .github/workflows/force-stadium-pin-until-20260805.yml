name: Vynutit připnutí zimáku do 5. srpna

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: force-stadium-pin-until-20260805
  cancel-in-progress: false

jobs:
  pin:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'petrkotab666' && github.event.issue.title == '[ops] Vynutit připnutí zimáku do 5. srpna')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      PIN_REL: /clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html
    steps:
      - name: Zapsat spuštění
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Vynucení připnutí bylo spuštěno. GitHub Actions run: ${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Opravit zdrojové pravidlo a vygenerovat pouze titulku
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            archive_sha="$(git hash-object clanky/index.html)"
            rss_sha="$(git hash-object rss.xml)"
            python3 - <<'PY'
            from pathlib import Path
            import re

            path = Path('scripts/enforce_article_visibility.py')
            text = path.read_text(encoding='utf-8')
            href = "/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html"
            until = "2026-08-05T18:00:00+02:00"

            if 'HOMEPAGE_PIN_HREF' in text:
                text, href_count = re.subn(
                    r"HOMEPAGE_PIN_HREF\s*=\s*'[^']+'",
                    f"HOMEPAGE_PIN_HREF = '{href}'",
                    text,
                    count=1,
                )
                text, until_count = re.subn(
                    r"HOMEPAGE_PIN_UNTIL\s*=\s*datetime\.fromisoformat\('[^']+'\)",
                    f"HOMEPAGE_PIN_UNTIL = datetime.fromisoformat('{until}')",
                    text,
                    count=1,
                )
                if href_count != 1 or until_count != 1:
                    raise SystemExit('Nelze opravit konfiguraci připnutí.')
            else:
                anchor = 'PAGE_SIZE = 12\n'
                if anchor not in text:
                    raise SystemExit('Chybí bod pro konfiguraci připnutí.')
                text = text.replace(
                    anchor,
                    anchor
                    + '# HOMEPAGE-PIN-STADIUM-20260804\n'
                    + f"HOMEPAGE_PIN_HREF = '{href}'\n"
                    + f"HOMEPAGE_PIN_UNTIL = datetime.fromisoformat('{until}')\n",
                    1,
                )

            text = text.replace('# HOMEPAGE-PIN-EXPIRED-BY-NEW-PUBLICATION-20260804\n', '')

            if 'homepage_order = list(articles)' not in text:
                old = (
                    "    homepage_articles = articles[:HOME_TOTAL]\n"
                    "    home_cards = '\\n'.join(card(article) for article in homepage_articles[2:])\n"
                )
                new = (
                    "    homepage_order = list(articles)\n"
                    "    if datetime.now(timezone.utc) <= HOMEPAGE_PIN_UNTIL.astimezone(timezone.utc):\n"
                    "        pinned = next((item for item in articles if item['href'] == HOMEPAGE_PIN_HREF), None)\n"
                    "        if pinned is None:\n"
                    "            raise RuntimeError('Připínaný článek nebyl nalezen.')\n"
                    "        homepage_order = [pinned] + [item for item in articles if item['href'] != HOMEPAGE_PIN_HREF]\n"
                    "    homepage_articles = homepage_order[:HOME_TOTAL]\n"
                    "    home_cards = '\\n'.join(card(article) for article in homepage_articles[2:])\n"
                )
                if old not in text:
                    raise SystemExit('Nelze doplnit pořadí titulky.')
                text = text.replace(old, new, 1)
                text = text.replace(
                    'hero(articles[0], articles[1] if len(articles) > 1 else None)',
                    'hero(homepage_order[0], homepage_order[1] if len(homepage_order) > 1 else None)',
                    1,
                )

            compile(text, str(path), 'exec')
            path.write_text(text, encoding='utf-8', newline='\n')
            PY
            python3 scripts/enforce_article_visibility.py
            git restore --source=HEAD --worktree -- clanky/index.html sitemap.xml
            git restore --source=HEAD --worktree -- clanky/strana-*.html 2>/dev/null || true
            git clean -f -- clanky/strana-*.html >/dev/null 2>&1 || true
            git restore --source=HEAD --worktree -- clanky/strana-*.html 2>/dev/null || true
            test "$(git hash-object clanky/index.html)" = "$archive_sha"
            test "$(git hash-object rss.xml)" = "$rss_sha"
            python3 - <<'PY'
            from pathlib import Path
            import re
            pin = '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
            text = Path('index.html').read_text(encoding='utf-8')
            hero = re.search(r'<section class="wrap hero" id="clanky".*?</section>', text, re.S)
            if not hero or f'data-latest-article-href="{pin}"' not in hero.group(0):
                raise SystemExit('Připnutí se nevytvořilo.')
            aside = re.search(r'<aside class="current-aside">.*?</aside>', hero.group(0), re.S)
            if not aside or pin in aside.group(0):
                raise SystemExit('Boční blok není správný.')
            if '/pocasi.js' not in text:
                raise SystemExit('Na titulce chybí počasí.')
            PY
            git add index.html scripts/enforce_article_visibility.py
            changed="$(git diff --cached --name-only)"
            if [ -n "$changed" ]; then
              test "$(printf '%s\n' "$changed" | grep -Ev '^(index\.html|scripts/enforce_article_visibility\.py)$' | wc -l)" -eq 0
              git commit -m 'Vynutit připnutí zimáku do 5. srpna 18:00'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$pushed" = 1
          git fetch origin main
          git reset --hard origin/main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Nasadit pouze titulní stránku na OVH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 index.html ubuntu@57.129.43.215:/tmp/nasekadan-pinned-index.html
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/nasekadan-pinned-index.html
          sudo install -m 0644 "$src" /var/www/nasekadan/index.html
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp "$src" nasekadan-web:/usr/share/nginx/html/index.html
          fi
          rm -f "$src"
          REMOTE

      - name: Veřejně ověřit titulku a počasí
        shell: bash
        run: |
          set -euo pipefail
          expected_latest="$(python3 - <<'PY'
          from pathlib import Path
          from scripts.enforce_article_visibility import article_info
          pin = '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          items = []
          for path in Path('clanky').glob('*.html'):
              if path.name == 'index.html' or path.name.startswith('strana-'):
                  continue
              item = article_info(path)
              if item and item['href'] != pin:
                  items.append(item)
          items.sort(key=lambda item: item['dt'], reverse=True)
          if not items:
              raise SystemExit('Nenalezen nejnovější nepřipnutý článek.')
          print(items[0]['href'])
          PY
          )"
          for attempt in $(seq 1 10); do
            q="${GITHUB_RUN_ID}-$(date +%s)-${attempt}"
            home="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/?pin=$q" || true)"
            aside="$(sed -n '/<aside class="current-aside">/,/<\/aside>/p' <<<"$home")"
            if grep -Fq "data-latest-article-href=\"$PIN_REL\"" <<<"$home" \
              && grep -Fq 'Kadaň otevřela zimní stadion lidem před vedrem' <<<"$home" \
              && grep -Fq "$expected_latest" <<<"$aside" \
              && ! grep -Fq "$PIN_REL" <<<"$aside" \
              && grep -Fq '/pocasi.js' <<<"$home" \
              && curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/api/pocasi-predpoved.json?pin=$q" | python3 -m json.tool >/dev/null; then
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Uzavřít požadavek
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Připnutí bylo obnoveno do 5. srpna 18:00 a veřejně ověřeno. Run ${context.runId}, zdrojový commit ${{ steps.patch.outputs.source_sha }}.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Zapsat selhání
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Vynucení připnutí selhalo. GitHub Actions run: ${context.runId}.`
            });
