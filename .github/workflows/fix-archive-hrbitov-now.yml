name: Cíleně opravit archiv Naše Kadaň

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-archive-hrbitov-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-targeted-archive-repair
  cancel-in-progress: false

env:
  OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  HRBITOV: novy-hrbitov-kadan-architektonicka-studie-2026.html
  VOLBY: komunalni-volby-kadan-historie-1990-2026.html

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit správný zdrojový archiv
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "$HRBITOV" clanky/index.html
          grep -Fq "$VOLBY" clanky/index.html
          python3 - <<'PY'
          from pathlib import Path
          t=Path('clanky/index.html').read_text(encoding='utf-8')
          h=t.find('novy-hrbitov-kadan-architektonicka-studie-2026.html')
          v=t.find('komunalni-volby-kadan-historie-1990-2026.html')
          assert h >= 0 and v >= 0 and h < v, (h,v)
          print('Zdrojový archiv je správně: hřbitov před volbami.')
          PY

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Přenést pouze archivní stránky na OVH
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/archive-pages.tgz" clanky/index.html clanky/strana-*.html
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/archive-pages.tgz" ubuntu@57.129.43.215:/tmp/nasekadan-archive-pages.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          work=/tmp/nasekadan-archive-pages
          rm -rf "$work" && mkdir -p "$work"
          tar -xzf /tmp/nasekadan-archive-pages.tgz -C "$work"
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo rm -f /var/www/nasekadan/clanky/strana-*.html
          sudo install -m 0644 "$work/clanky/index.html" /var/www/nasekadan/clanky/index.html
          for f in "$work"/clanky/strana-*.html; do
            [[ -f "$f" ]] && sudo install -m 0644 "$f" "/var/www/nasekadan/clanky/$(basename "$f")"
          done
          if docker inspect nasekadan-web >/dev/null 2>&1; then
            docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky || true
            docker exec nasekadan-web sh -lc 'rm -f /usr/share/nginx/html/clanky/index.html /usr/share/nginx/html/clanky/strana-*.html' || true
            docker cp "$work/clanky/index.html" nasekadan-web:/usr/share/nginx/html/clanky/index.html || true
            for f in "$work"/clanky/strana-*.html; do
              [[ -f "$f" ]] && docker cp "$f" "nasekadan-web:/usr/share/nginx/html/clanky/$(basename "$f")" || true
            done
          fi
          rm -rf "$work" /tmp/nasekadan-archive-pages.tgz
          REMOTE

      - name: Veřejně ověřit opravený archiv
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            q="archive-fix-${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            archive="$(curl -4 -kfsSL --max-time 30 -H 'Cache-Control: no-cache' "https://nasekadan.cz/clanky/?v=$q" || true)"
            if HRBITOV="$HRBITOV" VOLBY="$VOLBY" ARCHIVE="$archive" python3 - <<'PY'
          import os
          t=os.environ['ARCHIVE']
          h=t.find(os.environ['HRBITOV'])
          v=t.find(os.environ['VOLBY'])
          raise SystemExit(0 if h >= 0 and v >= 0 and h < v else 1)
          PY
            then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = 1
          curl -4 -kfsSL --max-time 30 "https://nasekadan.cz/clanky/$HRBITOV?v=${GITHUB_RUN_ID}" >/dev/null
          echo 'Archiv je veřejně opravený a hřbitov je před komunálními volbami.'

      - name: Zapsat výsledek do incidentu
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? `✅ Cílená oprava archivu proběhla úspěšně. Veřejný /clanky/ obsahuje článek o novém hřbitovu před komunálními volbami. Run: ${context.runId}. Zdroj: ${context.sha}.`
              : `❌ Cílená oprava archivu selhala nebo neprošla veřejnou kontrolou. Run: ${context.runId}. Zdroj: ${context.sha}.`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 828, body});
            if (ok) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: 828, state: 'closed', state_reason: 'completed'});
            }
