name: Canonical published content refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/canonical-index-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh registry from public web
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python <<'PY'
          import hashlib, json, re, subprocess
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          BASE = 'https://nasekadan.cz/'
          INDEX = Path('data/published-content-index.json')
          WORKFLOW = Path('.github/workflows/canonical-index-refresh.yml')
          TIMEOUT = 30
          sess = requests.Session()
          sess.headers.update({'User-Agent': 'NaseKadanCanonicalAudit/1.0', 'Cache-Control': 'no-cache'})

          def get(url):
              r = sess.get(url, timeout=TIMEOUT, params={'canonical_audit': datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')})
              r.raise_for_status()
              return r.text

          def article_urls_from_html(text):
              soup = BeautifulSoup(text, 'lxml')
              out = []
              for a in soup.select('a[href]'):
                  u = urljoin(BASE, a.get('href'))
                  if re.fullmatch(r'https://nasekadan\.cz/clanky/[^/]+\.html', u):
                      out.append(u)
              return list(dict.fromkeys(out))

          def xml_locs(text, item_tag=None):
              soup = BeautifulSoup(text, 'xml')
              if item_tag == 'item':
                  return [x.get_text(strip=True) for x in soup.select('item > link')]
              return [x.get_text(strip=True) for x in soup.select('loc')]

          homepage_html = get(BASE)
          archive_html = get(urljoin(BASE, 'clanky/'))
          rss_xml = get(urljoin(BASE, 'rss.xml'))
          sitemap_xml = get(urljoin(BASE, 'sitemap.xml'))
          news_xml = get(urljoin(BASE, 'news-sitemap.xml'))
          health_text = get(urljoin(BASE, 'deployment-health.txt'))

          homepage_urls = article_urls_from_html(homepage_html)
          archive_urls = article_urls_from_html(archive_html)
          rss_urls = xml_locs(rss_xml, 'item')
          sitemap_urls = xml_locs(sitemap_xml)
          news_urls = xml_locs(news_xml)

          data = json.loads(INDEX.read_text(encoding='utf-8'))
          articles = data.get('articles', [])
          indexed_urls = [a['url'] for a in articles]
          missing = [u for u in archive_urls if u not in indexed_urls]
          stale = [u for u in indexed_urls if u not in archive_urls]
          if missing or stale:
              raise SystemExit(f'Unsafe automatic refresh stopped: missing={missing}, stale={stale}')

          h1_map = {}
          for article in articles:
              url = article['url']
              html = get(url)
              soup = BeautifulSoup(html, 'lxml')
              h1 = soup.find('h1')
              if not h1:
                  raise SystemExit(f'Missing H1 on {url}')
              h1_text = ' '.join(h1.get_text(' ', strip=True).split())
              h1_map[url] = h1_text
              article['h1'] = h1_text
              article['title'] = h1_text

              pub = soup.find('meta', attrs={'property': 'article:published_time'})
              mod = soup.find('meta', attrs={'property': 'article:modified_time'})
              if pub and pub.get('content'):
                  article['published_at'] = pub['content']
              if mod and mod.get('content'):
                  article['modified_at'] = mod['content']

              status = article.setdefault('status', {})
              status['homepage'] = url in homepage_urls
              status['archive'] = url in archive_urls
              status['rss'] = url in rss_urls
              status['sitemap'] = url in sitemap_urls
              status['news_sitemap'] = url in news_urls
              article['publication_status'] = 'published' if url in archive_urls else 'unpublished'

              path = article.get('source_path')
              if path and Path(path).exists():
                  sha = subprocess.check_output(['git', 'log', '-1', '--format=%H', '--', path], text=True).strip()
                  if sha:
                      article['source_commit'] = sha

          url_counts = Counter(a['url'] for a in articles)
          fp_counts = Counter(a.get('fingerprint') for a in articles if a.get('fingerprint'))
          duplicate_urls = sorted(u for u, c in url_counts.items() if c > 1)
          duplicate_fps = sorted(f for f, c in fp_counts.items() if c > 1)
          required = ('title','h1','url','published_at','modified_at','persons','organizations','places','cases','topics','fingerprint','status','source_commit')
          required_complete = all(all(k in a and a[k] is not None for k in required) for a in articles)

          health_sha = None
          for pattern in (r'(?im)^SOURCE_COMMIT[=: ]+([0-9a-f]{40})', r'(?im)^source_commit[=: ]+([0-9a-f]{40})', r'\b([0-9a-f]{40})\b'):
              m = re.search(pattern, health_text)
              if m:
                  health_sha = m.group(1)
                  break

          archive_order = [u for u in archive_urls if u in indexed_urls]
          rss_order = [u for u in rss_urls if u in indexed_urls]
          audit_payload = json.dumps({
              'homepage': homepage_urls,
              'archive': archive_urls,
              'rss': rss_urls,
              'sitemap_articles': sorted(set(sitemap_urls) & set(indexed_urls)),
              'news_articles': sorted(set(news_urls) & set(indexed_urls)),
              'h1': h1_map,
              'health_sha': health_sha,
          }, ensure_ascii=False, sort_keys=True).encode('utf-8')

          now = datetime.now(timezone.utc).isoformat()
          validation = data.setdefault('validation', {})
          validation.update({
              'homepage_count': len(set(homepage_urls) & set(indexed_urls)),
              'archive_count': len(set(archive_urls) & set(indexed_urls)),
              'rss_count': len(set(rss_urls) & set(indexed_urls)),
              'sitemap_all_articles_present': set(indexed_urls).issubset(set(sitemap_urls)),
              'news_sitemap_recent_count': len(set(news_urls) & set(indexed_urls)),
              'deployment_health': 'verified' if health_sha else 'unverified',
              'required_fields_complete': required_complete,
              'duplicate_urls': duplicate_urls,
              'duplicate_fingerprints': duplicate_fps,
              'per_article_source_commits': all(bool(a.get('source_commit')) for a in articles),
              'deployment_health_source': health_sha,
              'public_audit_at': now,
              'public_audit_sha256': hashlib.sha256(audit_payload).hexdigest(),
              'repair_pending_public_verification': False,
              'rss_order_matches_archive': archive_order == rss_order,
              'last_registry_refresh': {
                  'reason': 'synchronize live metadata and latest source commits',
                  'trigger_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                  'archive_articles': len(archive_urls),
                  'rss_articles': len(rss_urls),
                  'sitemap_articles': len(set(sitemap_urls) & set(indexed_urls)),
                  'news_sitemap_articles': len(set(news_urls) & set(indexed_urls)),
                  'completed_at': now,
              },
          })
          data['generated_at'] = now
          data['article_count'] = len(articles)
          data['source_commit'] = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          data['schema_version'] = '1.4'

          if duplicate_urls or duplicate_fps or not required_complete:
              raise SystemExit('Registry validation failed; refusing commit')
          if len(archive_urls) != len(articles) or len(rss_urls) != len(articles):
              raise SystemExit(f'Public count mismatch: archive={len(archive_urls)} rss={len(rss_urls)} registry={len(articles)}')
          if not set(indexed_urls).issubset(set(sitemap_urls)):
              raise SystemExit('Main sitemap is missing published article URLs')
          if archive_order != rss_order:
              raise SystemExit('RSS order differs from archive order')

          INDEX.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          WORKFLOW.unlink()
          PY
      - name: Commit refreshed canonical registry
        run: |
          git config user.name "Naše Kadaň – kanonický audit"
          git config user.email "actions@users.noreply.github.com"
          git add data/published-content-index.json .github/workflows/canonical-index-refresh.yml
          git commit -m "Aktualizovat kanonický registr podle živého webu [skip ci]"
          git push
