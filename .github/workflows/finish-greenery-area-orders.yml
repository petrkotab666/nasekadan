name: Dokončit plochy a celoroční objednávky zeleně

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/greenery-finish-trigger.txt'
      - '.github/workflows/finish-greenery-area-orders.yml'
      - 'scripts/analyze_kadan_greenery_components.py'
      - 'scripts/fetch_targeted_greenery_orders.py'

permissions:
  contents: write

concurrency:
  group: nasekadan-greenery-finish
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit nástroje
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng
          python3 -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 shapely pyproj

      - name: Rozpadnout GIS na jednotlivé plochy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/analyze_kadan_greenery_components.py
          test -s .github/research/greenery-kadan-2026/GIS-COMPONENTS.md
          test -s .github/research/greenery-kadan-2026/gis-components.csv

      - name: Pomalu stáhnout klíčové lednové objednávky a OCR
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fetch_targeted_greenery_orders.py
          test -s .github/research/greenery-kadan-2026/TARGETED-ORDERS.md
          test -s .github/research/greenery-kadan-2026/targeted-orders.json

      - name: Uložit výsledky
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – dokončení rešerše zeleně'
          git config user.email 'info@nasekadan.cz'
          git add .github/research/greenery-kadan-2026/GIS-COMPONENTS.md \
                  .github/research/greenery-kadan-2026/gis-components.csv \
                  .github/research/greenery-kadan-2026/gis-components.json \
                  .github/research/greenery-kadan-2026/TARGETED-ORDERS.md \
                  .github/research/greenery-kadan-2026/targeted-orders.json
          test ! -d .github/research/greenery-kadan-2026/targeted-texts || git add .github/research/greenery-kadan-2026/targeted-texts
          if git diff --cached --quiet; then
            echo 'Beze změny.'
          else
            git commit -m 'Doplnit jednotlivé plochy a OCR celoročních objednávek zeleně'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Zapsat stav
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const path='.github/greenery-finish-status.json';
            const status={status:process.env.JOB_STATUS,checkedAtUtc:new Date().toISOString(),runId:context.runId,sourceSha:context.sha,components:'.github/research/greenery-kadan-2026/GIS-COMPONENTS.md',orders:'.github/research/greenery-kadan-2026/TARGETED-ORDERS.md'};
            const content=Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64');
            let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat dokončení rešerše zeleně: ${status.status} [skip ci]`,content,...(sha?{sha}:{})});
