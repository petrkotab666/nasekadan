name: Opravit a zaostřit obrázky v článku o koších

on:
  push:
    branches: [main]
    paths:
      - '.github/kos-sharp-trigger.txt'
      - '.github/workflows/fix-kos-images-sharp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-kos-sharp-images
  cancel-in-progress: false

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vytvořit ostré WebP obrázky přímo z uložených výřezů
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import base64, re
          from PIL import Image, ImageEnhance, ImageFilter, ImageOps

          root = Path('.')
          out = root / 'images' / 'clanky'
          out.mkdir(parents=True, exist_ok=True)

          def extract_embedded_image(svg_path: Path) -> Image.Image:
              svg = svg_path.read_text(encoding='utf-8')
              match = re.search(
                  r'data:image/(?:jpeg|jpg|png|webp);base64,([^"\']+)',
                  svg,
                  re.I,
              )
              if not match:
                  raise RuntimeError(f'V {svg_path} chybí vložený obrazový obsah')
              raw = base64.b64decode(match.group(1))
              with Image.open(BytesIO(raw)) as source:
                  return ImageOps.exif_transpose(source).convert('RGB')

          def build(source_name: str, target_name: str, size: tuple[int, int]) -> None:
              image = extract_embedded_image(out / source_name)
              image = ImageOps.fit(
                  image,
                  size,
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.5),
              )
              image = ImageEnhance.Contrast(image).enhance(1.05)
              image = ImageEnhance.Sharpness(image).enhance(1.35)
              image = image.filter(ImageFilter.UnsharpMask(radius=1.1, percent=165, threshold=2))
              target = out / target_name
              image.save(target, 'WEBP', quality=92, method=6)
              if target.stat().st_size < 5000:
                  raise RuntimeError(f'Výsledný obrázek {target} je podezřele malý')

          build(
              'kadan-pretekajici-kos-facebook-real.svg',
              'kadan-pretekajici-kos-facebook-ostry.webp',
              (720, 1276),
          )
          build(
              'kadan-forum-petra-pokorna-prispevek-real.svg',
              'kadan-forum-petra-pokorna-prispevek-ostry.webp',
              (960, 870),
          )
          build(
              'jan-losenicky-komentar-facebook-real.svg',
              'jan-losenicky-komentar-facebook-ostry.webp',
              (1080, 390),
          )

          article = root / 'clanky' / 'pretekajici-kose-kadan-technicke-sluzby-ridici.html'
          text = article.read_text(encoding='utf-8')
          replacements = {
              '../images/clanky/kadan-pretekajici-kos-facebook-real.svg': '../images/clanky/kadan-pretekajici-kos-facebook-ostry.webp',
              '../images/clanky/kadan-forum-petra-pokorna-prispevek-real.svg': '../images/clanky/kadan-forum-petra-pokorna-prispevek-ostry.webp',
              '../images/clanky/jan-losenicky-komentar-facebook-real.svg': '../images/clanky/jan-losenicky-komentar-facebook-ostry.webp',
              'width="220" height="390" loading="eager"': 'width="720" height="1276" loading="eager"',
              'width="320" height="290" loading="lazy"': 'width="960" height="870" loading="lazy"',
              'width="360" height="130" loading="lazy"': 'width="1080" height="390" loading="lazy"',
              'data-fb-photo-evidence="v2"': 'data-fb-photo-evidence="v3-sharp"',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise RuntimeError(f'V článku chybí očekávaný text: {old}')

          modified = datetime.now(ZoneInfo('Europe/Prague')).replace(microsecond=0).isoformat()
          text = re.sub(
              r'(<meta property="article:modified_time" content=")[^"]+(">)',
              rf'\g<1>{modified}\g<2>',
              text,
              count=1,
          )
          text = re.sub(
              r'("dateModified":")[^"]+(")',
              rf'\g<1>{modified}\g<2>',
              text,
              count=1,
          )
          article.write_text(text, encoding='utf-8')
          PY

          file images/clanky/kadan-pretekajici-kos-facebook-ostry.webp
          file images/clanky/kadan-forum-petra-pokorna-prispevek-ostry.webp
          file images/clanky/jan-losenicky-komentar-facebook-ostry.webp
          grep -Fq 'data-fb-photo-evidence="v3-sharp"' clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html

      - name: Uložit ostré obrázky do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – obrazová oprava'
          git config user.email 'info@nasekadan.cz'
          git add clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html \
            images/clanky/kadan-pretekajici-kos-facebook-ostry.webp \
            images/clanky/kadan-forum-petra-pokorna-prispevek-ostry.webp \
            images/clanky/jan-losenicky-komentar-facebook-ostry.webp
          if git diff --cached --quiet; then
            echo 'V repozitáři už jsou stejné ostré obrázky.'
          else
            git commit -m 'Opravit chybějící a rozmazané obrázky u článku o koších'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 4))
            done
          fi

      - name: Nasadit článek a obrázky přímo na OVH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_key"
          chmod 600 "$RUNNER_TEMP/nasekadan_key"
          scp -i "$RUNNER_TEMP/nasekadan_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html \
            images/clanky/kadan-pretekajici-kos-facebook-ostry.webp \
            images/clanky/kadan-forum-petra-pokorna-prispevek-ostry.webp \
            images/clanky/jan-losenicky-komentar-facebook-ostry.webp \
            ubuntu@57.129.43.215:/tmp/
          ssh -i "$RUNNER_TEMP/nasekadan_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/images/clanky
          sudo install -m 0644 /tmp/pretekajici-kose-kadan-technicke-sluzby-ridici.html /var/www/nasekadan/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html
          sudo install -m 0644 /tmp/kadan-pretekajici-kos-facebook-ostry.webp /var/www/nasekadan/images/clanky/kadan-pretekajici-kos-facebook-ostry.webp
          sudo install -m 0644 /tmp/kadan-forum-petra-pokorna-prispevek-ostry.webp /var/www/nasekadan/images/clanky/kadan-forum-petra-pokorna-prispevek-ostry.webp
          sudo install -m 0644 /tmp/jan-losenicky-komentar-facebook-ostry.webp /var/www/nasekadan/images/clanky/jan-losenicky-komentar-facebook-ostry.webp
          grep -Fq 'data-fb-photo-evidence="v3-sharp"' /var/www/nasekadan/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html
          REMOTE

      - name: Ověřit veřejné obrázky
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 18); do
            curl -4 -kfsS --max-time 20 "https://nasekadan.cz/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html?sharp=$stamp-$attempt" -o /tmp/article.html || true
            ok=1
            grep -Fq 'data-fb-photo-evidence="v3-sharp"' /tmp/article.html || ok=0
            for image in \
              kadan-pretekajici-kos-facebook-ostry.webp \
              kadan-forum-petra-pokorna-prispevek-ostry.webp \
              jan-losenicky-komentar-facebook-ostry.webp; do
              curl -4 -kfsS --max-time 20 "https://nasekadan.cz/images/clanky/$image?sharp=$stamp-$attempt" -o "/tmp/$image" || ok=0
              test -s "/tmp/$image" || ok=0
            done
            if [ "$ok" = 1 ]; then exit 0; fi
            sleep 5
          done
          exit 1
