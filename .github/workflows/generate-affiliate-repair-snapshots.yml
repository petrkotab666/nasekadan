name: Jednorázově opravit kanonické affiliate snapshoty

on:
  push:
    branches: [main]
    paths:
      - '.github/affiliate-repair-trigger.txt'
      - '.github/workflows/generate-affiliate-repair-snapshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: affiliate-repair-snapshot-generator
  cancel-in-progress: true

jobs:
  generate-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      T_GH_PAT: ${{ secrets.GH_PAT }}
      T_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      T_PAT: ${{ secrets.PAT }}
      T_PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      T_PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      T_CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
      T_REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      T_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      T_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      T_AUTOMATION_PAT: ${{ secrets.AUTOMATION_PAT }}
      T_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      T_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      T_GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_ACCESS_TOKEN }}
      T_CENTRAL_REPO_TOKEN: ${{ secrets.CENTRAL_REPO_TOKEN }}
      T_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Načíst generátor
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vygenerovat přesné snapshoty cílových webů
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/affiliate-repair"
          rm -rf "$root"
          mkdir -p "$root/nakupvakci/assets" "$root/testywebu/assets"

          cat > "$root/nakupvakci/assets/affiliate-site-config.json" <<'JSON'
          {
            "schemaVersion": 1,
            "syncRevision": 8,
            "site": "nakupvakci.cz",
            "mode": "all_active",
            "aliases": ["nakupvakci", "nakupvakci.cz"],
            "allowedPartnerIds": [],
            "allowedCategories": [],
            "autoPublish": true,
            "centralSyncReason": "Audit 28. 7. 2026: veřejný přehled všech aktivních programů; Vodafone je povolený spotřebitel a snapshot musí převzít tři aktuální veřejné kampaně z centrální databáze bez interní partnerské soutěže."
          }
          JSON

          cat > "$root/testywebu/assets/affiliate-site-config.json" <<'JSON'
          {
            "schemaVersion": 1,
            "syncRevision": 7,
            "site": "testywebu.cz",
            "mode": "filtered",
            "aliases": ["testywebu", "testywebu.cz"],
            "allowedPartnerIds": ["gearup", "vodafone", "poda", "nejpripojeni", "uvtnet"],
            "allowedCategories": ["internet", "gaming", "software", "online-sluzby", "mobilni-tarify", "televize", "iptv"],
            "autoPublish": false,
            "centralSyncReason": "Audit 28. 7. 2026: Vodafone je schválený spotřebitel pro testy mobilních tarifů, pevného internetu a televize; snapshot musí převzít aktuální veřejné kampaně z centrální databáze bez interní soutěžní informace."
          }
          JSON

          AFFILIATE_REPO_ROOT="$root/nakupvakci" python3 scripts/sync-public-affiliate-snapshot.py
          AFFILIATE_REPO_ROOT="$root/testywebu" python3 scripts/sync-public-affiliate-snapshot.py

          out="reports/affiliate-repair-generated"
          rm -rf "$out"
          mkdir -p "$out/nakupvakci" "$out/testywebu"
          cp "$root/nakupvakci/assets/affiliate-site-snapshot.json" "$out/nakupvakci/affiliate-site-snapshot.json"
          cp "$root/nakupvakci/assets/affiliate-site-snapshot.js" "$out/nakupvakci/affiliate-site-snapshot.js"
          cp "$root/testywebu/assets/affiliate-site-snapshot.json" "$out/testywebu/affiliate-site-snapshot.json"
          cp "$root/testywebu/assets/affiliate-site-snapshot.js" "$out/testywebu/affiliate-site-snapshot.js"

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          base = Path('reports/affiliate-repair-generated')
          data = {'schemaVersion': 1, 'files': {}}
          for path in sorted(base.glob('*/*')):
              raw = path.read_bytes()
              data['files'][str(path.relative_to(base))] = {
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              }
          (base / 'manifest.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Bezpečně zapsat kanonické soubory do cílových repozitářů
        shell: bash
        run: |
          set -euo pipefail
          report='reports/affiliate-repair-generated/push-report.txt'
          : > "$report"
          api='https://api.github.com'
          names='T_GH_PAT T_GITHUB_PAT T_PAT T_PAT_TOKEN T_PERSONAL_ACCESS_TOKEN T_CROSS_REPO_TOKEN T_REPO_TOKEN T_PRIVATE_REPO_TOKEN T_DEPLOY_TOKEN T_AUTOMATION_PAT T_BOT_TOKEN T_ACCESS_TOKEN T_GITHUB_ACCESS_TOKEN T_CENTRAL_REPO_TOKEN T_SYNC_TOKEN'

          select_token() {
            local repo="$1" name value code push
            SELECTED_TOKEN=''
            SELECTED_NAME=''
            for name in $names; do
              value="${!name:-}"
              [ -n "$value" ] || continue
              code=$(curl -sS -o "$RUNNER_TEMP/repo.json" -w '%{http_code}' \
                -H "Authorization: Bearer $value" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$api/repos/$repo" || true)
              if [ "$code" = 200 ]; then
                push=$(jq -r '.permissions.push // false' "$RUNNER_TEMP/repo.json")
                if [ "$push" = true ]; then
                  SELECTED_TOKEN="$value"
                  SELECTED_NAME="$name"
                  return 0
                fi
              fi
            done
            return 1
          }

          verify_config() {
            local repo="$1" token="$2" expected="$3" url got
            url="$api/repos/$repo/contents/assets/affiliate-site-config.json?ref=main"
            curl -fsSL -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github.raw+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o "$RUNNER_TEMP/target-config.json"
            got=$(sha256sum "$RUNNER_TEMP/target-config.json" | awk '{print $1}')
            [ "$got" = "$expected" ]
          }

          put_file() {
            local repo="$1" token="$2" source="$3" target="$4" message="$5"
            local meta sha payload code
            meta=$(curl -fsSL -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$api/repos/$repo/contents/$target?ref=main")
            sha=$(jq -r '.sha' <<< "$meta")
            payload=$(jq -n --arg message "$message" --arg content "$(base64 -w0 "$source")" --arg sha "$sha" \
              '{message:$message,content:$content,sha:$sha,branch:"main"}')
            code=$(curl -sS -o "$RUNNER_TEMP/put.json" -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' \
              -d "$payload" "$api/repos/$repo/contents/$target" || true)
            if [ "$code" != 200 ] && [ "$code" != 201 ]; then
              echo "$repo: zápis $target selhal HTTP $code" >> "$report"
              cat "$RUNNER_TEMP/put.json" >> "$report" || true
              return 1
            fi
            return 0
          }

          verify_file() {
            local repo="$1" token="$2" source="$3" target="$4" expected got
            expected=$(sha256sum "$source" | awk '{print $1}')
            curl -fsSL -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github.raw+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$api/repos/$repo/contents/$target?ref=main" -o "$RUNNER_TEMP/verified-file"
            got=$(sha256sum "$RUNNER_TEMP/verified-file" | awk '{print $1}')
            [ "$got" = "$expected" ]
          }

          repair_repo() {
            local repo="$1" key="$2" config_hash="$3" base="reports/affiliate-repair-generated/$key"
            if ! select_token "$repo"; then
              echo "$repo: nenalezen secret s oprávněním push" >> "$report"
              return 0
            fi
            echo "$repo: použit dostupný secret $SELECTED_NAME" >> "$report"
            if ! verify_config "$repo" "$SELECTED_TOKEN" "$config_hash"; then
              echo "$repo: konfigurace se změnila; oprava bezpečně zastavena" >> "$report"
              return 0
            fi
            if ! put_file "$repo" "$SELECTED_TOKEN" "$base/affiliate-site-snapshot.js" 'assets/affiliate-site-snapshot.js' 'Opravit kanonický affiliate JavaScript snapshot [skip ci]'; then
              return 0
            fi
            if ! put_file "$repo" "$SELECTED_TOKEN" "$base/affiliate-site-snapshot.json" 'assets/affiliate-site-snapshot.json' 'Opravit kanonický affiliate snapshot [skip ci]'; then
              return 0
            fi
            if verify_file "$repo" "$SELECTED_TOKEN" "$base/affiliate-site-snapshot.js" 'assets/affiliate-site-snapshot.js' \
              && verify_file "$repo" "$SELECTED_TOKEN" "$base/affiliate-site-snapshot.json" 'assets/affiliate-site-snapshot.json'; then
              echo "$repo: oprava zapsána a bajtově ověřena" >> "$report"
            else
              echo "$repo: následné bajtové ověření selhalo" >> "$report"
            fi
          }

          repair_repo 'petrkotab666/nakupvakci' 'nakupvakci' '4e176534e6898093659d82eadc0a2ca201604d7a07ff6c1c91c1b76c6d84c781'
          repair_repo 'petrkotab666/testywebu' 'testywebu' 'b7c2e81557138c9572d3d53a8ba02fa12493e1392a2da86fe34c86695ebe756f'
          cat "$report"

      - name: Uložit vygenerované podklady a výsledek pokusu
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/affiliate-repair-generated
          if git diff --cached --quiet; then
            echo 'Vygenerované podklady ani výsledek se nezměnily.'
            exit 0
          fi
          git commit -m 'Provést bezpečný pokus o kanonickou affiliate opravu [skip ci]'
          git push origin HEAD:main
