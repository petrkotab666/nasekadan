name: Jednorázově opravit živý Docker ARC-MED a AVIES

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-live-docker-arc-avies.yml'
      - '.github/hotfix-live-docker-arc-avies.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotfix-live-docker-arc-avies
  cancel-in-progress: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit klíč
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Přepsat aktivní web
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          python3 scripts/normalize_arc_med_article.py
          python3 scripts/update_avies_oswald_context.py
          python3 scripts/enforce_homepage_latest_order.py

          files=(
            index.html
            clanky/index.html
            clanky/arc-med-nemocnice-kadan.html
            clanky/avies-nemocnice-kadan.html
            clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html
            reklamy.js
            reklamy-sidebar.js
            reklamy-sidebar.css
            site.js
            rss.xml
            sitemap.xml
          )

          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          if [[ -z "$cid" ]]; then cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"; fi
          test -n "$cid"

          for file in "${files[@]}"; do
            sudo install -d -m 0755 "/var/www/nasekadan/$(dirname "$file")"
            sudo install -m 0644 "$file" "/var/www/nasekadan/$file"
            sudo docker exec "$cid" mkdir -p "/usr/share/nginx/html/$(dirname "$file")"
            sudo docker cp "$file" "$cid:/usr/share/nginx/html/$file"
          done

          arc="$(curl -fsS http://127.0.0.1:3224/clanky/arc-med-nemocnice-kadan.html)"
          curl -fsS http://127.0.0.1:3224/index.html | grep -Fq 'data-arc-med-hero'
          grep -Fq 'data-promos data-context="sidebar"' <<<"$arc"
          grep -Fq '/reklamy-sidebar.js?' <<<"$arc"
          grep -Fq 'data-arc-med-correction="2026-08-08"' <<<"$arc"
          grep -Fq '16&nbsp;000&nbsp;000 Kč' <<<"$arc"
          grep -Fq 'MUDr. Zora Ouzká' <<<"$arc"
          curl -fsS http://127.0.0.1:3224/clanky/avies-nemocnice-kadan.html | grep -Fq 'data-oswald-avies-context'
          ! grep -Fq 'veřejný záznam proto sám o sobě nepotvrzuje částku 16 milionů korun' <<<"$arc"
          ! grep -Fq 'Úplná smlouva o převodu všech podílů včetně příloh a přesného splátkového kalendáře.' <<<"$arc"
          ! grep -Fq 'PŘIPRAVOVANÝ ČLÁNEK' <<<"$arc"
          ! grep -Fq 'static-article-ads' <<<"$arc"
          REMOTE

      - name: Zapsat stav hotfixu
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const path = '.github/hotfix-live-docker-arc-avies-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              docker_deploy: process.env.DEPLOY_OUTCOME || 'unknown',
              arc_med_contract_fix: '2026-08-08',
              required_live_marker: 'data-arc-med-correction="2026-08-08"'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat stav Docker hotfixu: ${status.status}`,
              content,
              ...(sha ? {sha} : {})
            });
