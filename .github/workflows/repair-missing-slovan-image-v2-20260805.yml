name: Opravit mrtvý obrázek Slovanu v2

"on":
  push:
    branches: [main]
    paths:
      - 'ops/trigger-repair-missing-slovan-image-v2-20260805.txt'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: repair-missing-slovan-image-v2-20260805
  cancel-in-progress: true

env:
  OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit pouze mrtvé obrazové reference a uložit je
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – oprava obrázků'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/repair_missing_slovan_image_reference_20260805.py
            git diff --check
            git add clanky/slovan-druhy-pokus.html clanky/parts/slovan-01.html .github/drafts/slovan-druhy-pokus.html scripts/publish_slovan_article.py scripts/publish_slovan_20260805.py index.html clanky/index.html clanky/strana-*.html rss.xml sitemap.xml news-sitemap.xml llms.txt
            if ! git diff --cached --quiet; then
              git commit -m 'Opravit mrtvý obrázek Slovanu ve všech zdrojích'
            fi
            source_sha="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              pushed=1
              echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep $((attempt * 4))
          done
          test "$pushed" = 1

      - name: Nasadit opravený článek a celý obrazový balík
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/slovan-image-fix-v2"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky/parts" "$bundle/social"
          cp clanky/slovan-druhy-pokus.html "$bundle/clanky/"
          cp clanky/parts/slovan-01.html "$bundle/clanky/parts/"
          cp -a social/. "$bundle/social/"
          printf 'status=ok\nsource=%s\nchange=repair-missing-slovan-image-v2\n' "${{ steps.source.outputs.source_sha }}" > "$bundle/deployment-health.txt"
          tar -C "$bundle" -czf "$RUNNER_TEMP/slovan-image-fix-v2.tgz" .
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$RUNNER_TEMP/slovan-image-fix-v2.tgz" ubuntu@57.129.43.215:/tmp/slovan-image-fix-v2.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          rm -rf /tmp/slovan-image-fix-v2
          mkdir -p /tmp/slovan-image-fix-v2
          tar -xzf /tmp/slovan-image-fix-v2.tgz -C /tmp/slovan-image-fix-v2
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          sudo install -d -m 0755 /var/www/nasekadan/clanky/parts /var/www/nasekadan/social
          sudo install -m 0644 /tmp/slovan-image-fix-v2/clanky/slovan-druhy-pokus.html /var/www/nasekadan/clanky/slovan-druhy-pokus.html
          sudo install -m 0644 /tmp/slovan-image-fix-v2/clanky/parts/slovan-01.html /var/www/nasekadan/clanky/parts/slovan-01.html
          sudo cp -a /tmp/slovan-image-fix-v2/social/. /var/www/nasekadan/social/
          sudo install -m 0644 /tmp/slovan-image-fix-v2/deployment-health.txt /var/www/nasekadan/deployment-health.txt
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky/parts /usr/share/nginx/html/social
            sudo docker cp /tmp/slovan-image-fix-v2/clanky/slovan-druhy-pokus.html nasekadan-web:/usr/share/nginx/html/clanky/slovan-druhy-pokus.html
            sudo docker cp /tmp/slovan-image-fix-v2/clanky/parts/slovan-01.html nasekadan-web:/usr/share/nginx/html/clanky/parts/slovan-01.html
            sudo docker cp /tmp/slovan-image-fix-v2/social/. nasekadan-web:/usr/share/nginx/html/social/
            sudo docker cp /tmp/slovan-image-fix-v2/deployment-health.txt nasekadan-web:/usr/share/nginx/html/deployment-health.txt
          fi
          rm -rf /tmp/slovan-image-fix-v2 /tmp/slovan-image-fix-v2.tgz
          REMOTE

      - name: Ověřit kulturní náhled, Slovan a všechny obrázky článků
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.request import Request, urlopen
          import re, ssl, time

          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          def fetch(url):
              sep='&' if '?' in url else '?'
              req=Request(url+sep+'image_fix_v2='+str(time.time_ns()),headers={'User-Agent':'NaseKadan-image-fix-v2/1.0','Cache-Control':'no-cache'})
              with urlopen(req,timeout=35,context=ctx) as response:
                  return response.status,response.headers.get_content_type(),response.read()

          status,_,data=fetch('https://nasekadan.cz/clanky/slovan-druhy-pokus.html')
          article=data.decode('utf-8','replace')
          assert status == 200
          assert 'assets/slovan-detail-20260724.jpg' not in article
          assert 'social/slovan-druhy-pokus-e2e4356bbb.png' in article

          status,ctype,data=fetch('https://nasekadan.cz/social/kam-v-kadani-a-okoli-3-9-srpna-2026-199cb73db2.png')
          assert status == 200 and ctype.startswith('image/') and len(data) > 1000

          status,_,home_data=fetch('https://nasekadan.cz/')
          home=home_data.decode('utf-8','replace')
          assert status == 200
          blocks=re.findall(r'<article\b[^>]*class=["\'][^"\']*\barticle-card\b[^"\']*["\'][^>]*>.*?</article>',home,re.I|re.S)
          matching=[block for block in blocks if 'Kam v Kadani a okolí od 3. do 9. srpna' in block]
          if matching:
              block=matching[0]
              assert '/clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html' in block
              assert 'kam-v-kadani-a-okoli-3-9-srpna-2026-199cb73db2.png' in block

          sitemap=fetch('https://nasekadan.cz/sitemap.xml')[2].decode('utf-8','replace')
          pages=['https://nasekadan.cz/','https://nasekadan.cz/clanky/']
          pages += re.findall(r'<loc>(https://nasekadan\.cz/clanky/[^<]+\.html)</loc>',sitemap)
          for number in range(2,8):
              pages.append(f'https://nasekadan.cz/clanky/strana-{number}.html')
          image_urls=set()
          for page in sorted(set(pages)):
              try:
                  page_status,_,page_data=fetch(page)
              except Exception:
                  if '/strana-' in page: continue
                  raise
              if page_status != 200:
                  if '/strana-' in page: continue
                  raise SystemExit(f'{page}: HTTP {page_status}')
              text=page_data.decode('utf-8','replace')
              image_urls.update(re.findall(r'https://nasekadan\.cz/(?:social|assets|images|img)/[^"\'\s)<>]+',text,re.I))
          failed=[]
          def check(url):
              try:
                  status,ctype,data=fetch(url)
                  return url,status,ctype,len(data),''
              except Exception as exc:
                  return url,0,'',0,str(exc)
          with ThreadPoolExecutor(max_workers=24) as pool:
              futures=[pool.submit(check,url) for url in sorted(image_urls)]
              for future in as_completed(futures):
                  url,status,ctype,size,error=future.result()
                  if status != 200 or size < 128 or not ctype.startswith('image/'):
                      failed.append((url,status,ctype,size,error))
          if failed:
              for item in failed[:50]: print('CHYBA',item)
              raise SystemExit(f'Nedostupných obrazových referencí: {len(failed)}')
          print(f'Ověřeno {len(image_urls)} obrazových referencí; kulturní karta i Slovan jsou v pořádku.')
          PY

      - name: Uzavřít obrazové incidenty a zapsat úspěch
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo}=context.repo;
            for (const number of [715,716,717]) {
              try {
                await github.rest.issues.createComment({owner,repo,issue_number:number,body:'Následná oddělená oprava odstranila mrtvý odkaz, obnovila kulturní náhled a veřejná kontrola všech nalezených obrazových referencí prošla. Incident se uzavírá.'});
                await github.rest.issues.update({owner,repo,issue_number:number,state:'closed',state_reason:'completed'});
              } catch (_) {}
            }
            const created=await github.rest.issues.create({owner,repo,title:'[repair] Obrazové náhledy celého webu – success',body:`Kulturní náhled i článek o Slovanu jsou opravené. Všechny nalezené veřejné obrazové reference prošly kontrolou.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,assignees:['petrkotab666']});
            await github.rest.issues.update({owner,repo,issue_number:created.data.number,state:'closed',state_reason:'completed'});

      - name: Zapsat incident v2
        if: failure()
        shell: bash
        run: |
          gh issue create --title '[incident] Obrazová oprava Naše Kadaň v2' --body "Oddělená oprava nebo veřejná kontrola obrazových referencí selhala.\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --assignee petrkotab666 || true
