name: Kanonický audit publikovaného obsahu 2026-08-04 01:20

on:
  push:
    paths:
      - '.github/workflows/canonical-audit-20260804-0120.yml'

permissions:
  contents: write

concurrency:
  group: canonical-published-index-sync
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit a bezpečná oprava registru
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import collections, datetime, hashlib, html, json, re, ssl, subprocess, time, traceback, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          BASE='https://nasekadan.cz'
          REG=Path('data/published-content-index.json')
          STATUS=Path('.github/canonical-published-index-status.json')
          ctx=ssl._create_unverified_context()
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          report={'status':'failed','checked_at':now,'registry_publicly_verified':False,'errors':[]}

          def fetch(path):
              url=path if path.startswith('http') else BASE+path
              last=None
              for i in range(10):
                  try:
                      sep='&' if '?' in url else '?'
                      req=urllib.request.Request(url+sep+'audit='+str(time.time_ns()),headers={
                          'User-Agent':'NaseKadanCanonicalAudit/1.9','Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'})
                      with urllib.request.urlopen(req,timeout=35,context=ctx) as r:
                          return r.read().decode('utf-8','replace')
                  except Exception as e:
                      last=e; time.sleep(2+i)
              raise RuntimeError(f'{url}: {last}')

          def uniq(xs): return list(dict.fromkeys(xs))
          def norm_url(x):
              x=html.unescape(x.strip())
              if x.startswith('/'): return BASE+x
              if x.startswith('clanky/'): return BASE+'/'+x
              return x
          def article_urls(page):
              vals=re.findall(r'href=["\']((?:https://nasekadan\.cz)?/?clanky/[^"\'#?]+\.html)["\']',page,re.I)
              out=[]
              for v in vals:
                  u=norm_url(v)
                  if '/parts/' in u or re.search(r'/strana-\d+\.html$',u): continue
                  if u.endswith('/clanky/index.html'): continue
                  out.append(u)
              return uniq(out)
          def h1(page):
              m=re.search(r'<h1\b[^>]*>(.*?)</h1>',page,re.I|re.S)
              return '' if not m else ' '.join(html.unescape(re.sub(r'<[^>]+>','',m.group(1))).split())

          try:
              home=fetch('/')
              first=fetch('/clanky/')
              nums={int(x) for x in re.findall(r'(?:/clanky/)?strana-(\d+)\.html',first,re.I)}
              paths=['/clanky/']+[f'/clanky/strana-{n}.html' for n in sorted(nums)]
              pages=[first]+[fetch(p) for p in paths[1:]]
              archive='\n'.join(pages)
              rss=fetch('/rss.xml'); sitemap=fetch('/sitemap.xml'); news=fetch('/news-sitemap.xml'); health=fetch('/deployment-health.txt')

              home_urls=article_urls(home); archive_urls=article_urls(archive)
              rr=ET.fromstring(rss)
              rss_urls=uniq([norm_url((i.findtext('link') or '').strip()) for i in rr.findall('.//item') if (i.findtext('link') or '').strip()])
              ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
              sr=ET.fromstring(sitemap)
              all_locs=[norm_url((n.text or '').strip()) for n in sr.findall('.//s:loc',ns) if (n.text or '').strip()]
              sitemap_urls=uniq([u for u in all_locs if '/clanky/' in u and u.endswith('.html') and '/parts/' not in u and not re.search(r'/strana-\d+\.html$',u) and not u.endswith('/clanky/index.html')])
              nr=ET.fromstring(news)
              news_urls=uniq([norm_url((n.text or '').strip()) for n in nr.findall('.//s:loc',ns) if (n.text or '').strip()])

              data=json.loads(REG.read_text(encoding='utf-8'))
              arts=data['articles']; reg_urls=[a['url'] for a in arts]; fps=[a['fingerprint'] for a in arts]
              dup_urls=sorted([u for u,c in collections.Counter(reg_urls).items() if c>1])
              dup_fps=sorted([f for f,c in collections.Counter(fps).items() if c>1])
              report.update({'article_count':len(arts),'homepage_count':len(home_urls),'archive_count':len(archive_urls),'archive_page_count':len(paths),'rss_count':len(rss_urls),'sitemap_count':len(sitemap_urls),'news_sitemap_count':len(news_urls),'duplicate_urls':dup_urls,'duplicate_fingerprints':dup_fps,'rss_order_matches_archive':rss_urls==archive_urls,'deployment_health_nonempty':bool(health.strip()),'deployment_health_ok':'status=ok' in health})

              checks={
                  'archive_missing':sorted(set(reg_urls)-set(archive_urls)),
                  'archive_extra':sorted(set(archive_urls)-set(reg_urls)),
                  'rss_missing':sorted(set(reg_urls)-set(rss_urls)),
                  'rss_extra':sorted(set(rss_urls)-set(reg_urls)),
                  'sitemap_missing':sorted(set(reg_urls)-set(sitemap_urls)),
                  'sitemap_extra':sorted(set(sitemap_urls)-set(reg_urls)),
              }
              report['set_differences']=checks
              if dup_urls or dup_fps: report['errors'].append('duplicate_registry_entries')
              if any(checks.values()): report['errors'].append('publication_channel_set_mismatch')
              if rss_urls!=archive_urls: report['errors'].append('rss_order_mismatch')
              if 'status=ok' not in health: report['errors'].append('deployment_health_not_ok')

              h1_errors=[]; changed=[]
              if not report['errors']:
                  for a in arts:
                      page=fetch(a['url'])
                      actual=h1(page)
                      if actual!=a['h1']:
                          h1_errors.append({'url':a['url'],'registry':a['h1'],'public':actual})
                      a['status']={'homepage':a['url'] in home_urls,'archive':True,'rss':True,'sitemap':True,'news_sitemap':a['url'] in news_urls}
                      a['publication_status']='published'
                      p=a.get('source_path')
                      if p:
                          latest=subprocess.check_output(['git','log','-1','--format=%H','--',p],text=True).strip()
                          if latest and latest!=a.get('source_commit'):
                              changed.append({'url':a['url'],'from':a.get('source_commit',''),'to':latest})
                              a['source_commit']=latest
                      m=re.search(r'<meta[^>]+property=["\']article:modified_time["\'][^>]+content=["\']([^"\']+)',page,re.I) or re.search(r'"dateModified"\s*:\s*"([^"]+)"',page)
                      if m: a['modified_at']=m.group(1)
              report['h1_errors']=h1_errors
              report['changed_source_commits']=changed
              if h1_errors: report['errors'].append('h1_mismatch')

              if not report['errors']:
                  head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
                  hm=re.search(r'^source=(.+)$',health,re.M)
                  data['generated_at']=now; data['source_commit']=head; data['article_count']=len(arts)
                  v=data.setdefault('validation',{})
                  v.update({'homepage_count':len(home_urls),'archive_count':len(archive_urls),'archive_page_count':len(paths),'rss_count':len(rss_urls),'sitemap_all_articles_present':set(reg_urls)==set(sitemap_urls),'news_sitemap_recent_count':len(news_urls),'deployment_health':'verified','required_fields_complete':all(all(k in a for k in ('title','h1','url','published_at','modified_at','persons','organizations','places','cases','topics','fingerprint','status','source_commit')) for a in arts),'duplicate_urls':dup_urls,'duplicate_fingerprints':dup_fps,'per_article_source_commits':all(bool(a.get('source_commit')) for a in arts),'deployment_health_source':hm.group(1).strip() if hm else '','public_audit_at':now,'public_audit_sha256':hashlib.sha256((home+archive+rss+sitemap+news+health).encode()).hexdigest(),'repair_pending_public_verification':False,'public_repair_verification':{'method':'github-actions-live-canonical-audit-paginated-archive-v1.9','homepage_articles':len(home_urls),'archive_articles':len(archive_urls),'archive_pages':len(paths),'rss_articles':len(rss_urls),'sitemap_articles':len(sitemap_urls),'news_sitemap_articles':len(news_urls),'all_public_h1_checked':True,'deployment_health_nonempty':bool(health.strip()),'completed_at':now},'rss_order_matches_archive':rss_urls==archive_urls,'last_registry_refresh':{'reason':'synchronize article source commits after later repository edits and re-audit all live publication channels','trigger_commit':head,'classification':'registry_consistency_repair' if changed else 'no_content_change','changed_source_commits':changed,'homepage_articles':len(home_urls),'archive_articles':len(archive_urls),'archive_pages':len(paths),'rss_articles':len(rss_urls),'sitemap_articles':len(sitemap_urls),'news_sitemap_articles':len(news_urls),'completed_at':now}})
                  REG.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  report['status']='success'; report['registry_publicly_verified']=True
          except Exception as e:
              report['errors'].append(type(e).__name__+': '+str(e))
              report['traceback']=traceback.format_exc()

          STATUS.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/canonical-published-index-status.json data/published-content-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aktualizovat kanonickou evidenci a výsledek živého auditu [skip ci]'
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main
              if [ "$attempt" = 4 ]; then exit 1; fi
            done
          fi
      - name: Odstranit jednorázový workflow
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f .github/workflows/canonical-audit-20260804-0120.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/canonical-audit-20260804-0120.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Odstranit dokončený diagnostický kanonický audit [skip ci]'
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main
              if [ "$attempt" = 4 ]; then exit 1; fi
            done
          fi
