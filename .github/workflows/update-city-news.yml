name: Aktualizovat přehled veřejných zdrojů

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - data/city-sources.json
      - data/organizations.json
      - city-news.js
      - scripts/update_city_news.py
      - .github/workflows/update-city-news.yml

permissions:
  contents: write

concurrency:
  group: nasekadan-city-news
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Načíst aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aktualizovat všechny veřejné zdroje a organizace
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/update_city_news.py
          python3 scripts/update_city_news.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('data/city-news.json').read_text(encoding='utf-8'))
          items=data.get('items')
          coverage=data.get('monitoringCoverage') or {}
          statuses=data.get('sourceStatus') or []
          total=int(coverage.get('directoryOrganizations') or 0)
          monitored=int(coverage.get('monitoredDirectoryOrganizations') or 0)
          unique_sources=int(coverage.get('totalUniqueSources') or 0)
          if not isinstance(items,list) or len(items)<3:
              raise SystemExit('Přehled neobsahuje nejméně tři bezpečné položky.')
          if any(not item.get('title') or not str(item.get('source','')).startswith('http') for item in items):
              raise SystemExit('Přehled obsahuje neplatnou položku.')
          if total<60 or monitored!=total or float(coverage.get('coveragePercent') or 0)!=100:
              raise SystemExit(f'Monitoring nepokrývá celý adresář: {monitored}/{total}.')
          if len(statuses)!=unique_sources:
              raise SystemExit(f'Počet stavů {len(statuses)} neodpovídá {unique_sources} zdrojům.')
          if not coverage.get('directoryIsCanonicalRegistry'):
              raise SystemExit('Adresář organizací není kanonickým registrem.')
          failed=sum(1 for status in statuses if status.get('status')=='failed')
          print(f'Ověřeno {len(items)} položek; adresář {monitored}/{total}; {unique_sources} zdrojů; {failed} přímých chyb.')
          PY

      - name: Uložit změnu dat do hlavní větve
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/city-news.json; then
            echo 'Přehled je obsahově beze změny.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/city-news.json
          git commit -m 'Automaticky aktualizovat všechny organizace a veřejné zdroje'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přehled přímo na OVH
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            data/city-news.json city-news.js ubuntu@57.129.43.215:/tmp/
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/data
          sudo install -m 0644 /tmp/city-news.json /var/www/nasekadan/data/city-news.json
          sudo install -m 0644 /tmp/city-news.js /var/www/nasekadan/city-news.js
          rm -f /tmp/city-news.json /tmp/city-news.js
          REMOTE

      - name: Ověřit živý přehled a úplné pokrytí adresáře
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          curl -4 -kfsS --max-time 30 "https://nasekadan.cz/data/city-news.json?check=${token}" -o /tmp/city-news-live.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/city-news-live.json',encoding='utf-8'))
          items=data.get('items')
          coverage=data.get('monitoringCoverage') or {}
          statuses=data.get('sourceStatus') or []
          total=int(coverage.get('directoryOrganizations') or 0)
          monitored=int(coverage.get('monitoredDirectoryOrganizations') or 0)
          unique_sources=int(coverage.get('totalUniqueSources') or 0)
          if not isinstance(items,list) or len(items)<3:
              raise SystemExit('Živý přehled neobsahuje dost položek.')
          if total<60 or monitored!=total or float(coverage.get('coveragePercent') or 0)!=100:
              raise SystemExit(f'Živý monitoring nepokrývá celý adresář: {monitored}/{total}.')
          if len(statuses)!=unique_sources:
              raise SystemExit('Živý přehled nemá stav pro každý unikátní zdroj.')
          print(f'Živě ověřeno: {len(items)} položek, {monitored}/{total} organizací, {unique_sources} zdrojů.')
          PY
          curl -4 -kfsS --max-time 30 "https://nasekadan.cz/prehled-zdroju/?check=${token}" -o /tmp/city-news-page.html
          grep -Fq 'Přehled veřejných zdrojů' /tmp/city-news-page.html
          curl -4 -kfsS --max-time 30 "https://nasekadan.cz/city-news.js?check=${token}" -o /tmp/city-news-live.js
          grep -Fq 'cityNewsFallback' /tmp/city-news-live.js
          echo 'HOTOVO: celý adresář organizací je napojený na živý monitoring.'

      - name: Zapsat stav aktualizace
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path='city-news-update-status.json';
            const status={
              status:process.env.VERIFY==='success'?'success':'failed',
              checked_at_utc:new Date().toISOString(),
              trigger_commit:context.sha,
              run_id:context.runId,
              public_verification:process.env.VERIFY||'skipped',
              canonical_registry:'data/organizations.json'
            };
            const content=Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64');
            let sha;
            try{
              const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              if(!Array.isArray(current.data))sha=current.data.sha;
            }catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',
              message:`Zapsat stav monitoringu celého adresáře: ${status.status}`,
              content,...(sha?{sha}:{})
            });
