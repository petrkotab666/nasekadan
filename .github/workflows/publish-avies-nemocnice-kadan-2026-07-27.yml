name: Dokončit publikaci článku AVIES

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-avies-nemocnice-kadan-2026-07-27.yml"
      - ".github/publish-avies-now.txt"
      - "scripts/publish_avies_article.py"
      - "scripts/ensure_avies_publication_assets.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-avies-nemocnice-kadan-2026-07-27
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stáhnout hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vytvořit a úplně zařadit článek
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow

          # Skripty jsou idempotentní. Běží i tehdy, když samotný HTML soubor
          # už existuje, protože mohou stále chybět titulka, archiv, RSS,
          # sitemap nebo sociální obrázek.
          python3 scripts/publish_avies_article.py
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/publish_avies_article.py
          python3 scripts/ensure_avies_publication_assets.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/normalize_footers.py --write --check
          python3 scripts/seo_ai_audit.py --strict --paths clanky/avies-nemocnice-kadan.html
          python3 scripts/validate_publication_integrity.py

      - name: Uložit opravený veřejný stav
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň Publisher'
          git config user.email 'info@nasekadan.cz'
          git add -A -- \
            clanky/avies-nemocnice-kadan.html \
            clanky/nemocnice-kadan-software-kyberbezpecnost.html \
            index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt \
            social

          if git diff --cached --quiet; then
            echo 'AVIES je už v repozitáři úplně zařazený.'
            exit 0
          fi

          git commit -m 'Dokončit zařazení článku AVIES'
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin main
