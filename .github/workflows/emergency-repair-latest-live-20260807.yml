name: Nouzově obnovit nejnovější články na živém webu

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/emergency-latest-live-trigger.txt'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: emergency-latest-live-20260807
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      MP: mestska-policie-kadan-fakta-diskuse-2026
      GYM: gymnastika-kadan-treneri-prosinec-2026
      APO: apolena-svabikova-mistrovstvi-evropy-birmingham-2026
      ESO: eso-market-rafanda-kadan-24-7
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit zdrojové pořadí a úplnost
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          for slug in "$MP" "$GYM" "$APO" "$ESO"; do
            test -s "clanky/$slug.html"
            grep -Fq "$slug.html" index.html
            grep -Fq "$slug.html" clanky/index.html
            grep -Fq "$slug.html" rss.xml
            grep -Fq "$slug.html" sitemap.xml
          done
          grep -Fq 'Neřeší městská policie dopravu? Bouřlivá debata přiměla redakci ověřit fakta' "clanky/$MP.html"
          grep -Fq 'Gymnastice v Kadani chybějí trenéři' "clanky/$GYM.html"
          python3 - <<'PY'
          from pathlib import Path
          slugs = [
              'mestska-policie-kadan-fakta-diskuse-2026',
              'gymnastika-kadan-treneri-prosinec-2026',
              'apolena-svabikova-mistrovstvi-evropy-birmingham-2026',
              'eso-market-rafanda-kadan-24-7',
          ]
          for name in ('index.html', 'clanky/index.html', 'rss.xml'):
              text = Path(name).read_text(encoding='utf-8')
              pos = [text.find(s + '.html') for s in slugs]
              assert all(p >= 0 for p in pos), (name, pos)
              assert pos == sorted(pos), (name, pos)
          PY

      - name: Připravit přesný publikační balík
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          stage="$RUNNER_TEMP/latest-live"
          rm -rf "$stage"
          mkdir -p "$stage/clanky" "$stage/social" "$stage/data"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt "$stage/"
          cp clanky/*.html "$stage/clanky/"
          cp -a social/. "$stage/social/"
          cp data/published-content-index.json data/article-integrity-manifest.json "$stage/data/"
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=emergency-latest-live-repair\n' "$MAIN_SHA" "$(date -u +%FT%TZ)" > "$stage/deployment-health.txt"
          tar -C "$stage" -czf "$RUNNER_TEMP/latest-live.tgz" .

      - name: Atomicky obnovit veřejné povrchy na OVH
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25)
          scp "${opts[@]}" "$RUNNER_TEMP/latest-live.tgz" ubuntu@57.129.43.215:/tmp/nk-latest-live.tgz
          ssh "${opts[@]}" ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/var/www/nasekadan
          work="$(mktemp -d /tmp/nk-latest-live.XXXXXX)"
          trap 'rm -rf "$work" /tmp/nk-latest-live.tgz' EXIT
          tar -xzf /tmp/nk-latest-live.tgz -C "$work"
          sudo install -d -m 0755 "$root" "$root/clanky" "$root/social" "$root/data"
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do
            sudo install -m 0644 "$work/$f" "$root/$f"
          done
          sudo cp -a "$work/clanky/." "$root/clanky/"
          sudo cp -a "$work/social/." "$root/social/"
          sudo install -m 0644 "$work/data/published-content-index.json" "$root/data/published-content-index.json"
          sudo install -m 0644 "$work/data/article-integrity-manifest.json" "$root/data/article-integrity-manifest.json"
          sudo chmod -R a+rX "$root"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social /usr/share/nginx/html/data
            sudo tar -C "$work" -czf - index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt clanky social data \
              | sudo docker exec -i nasekadan-web tar -xzf - -C /usr/share/nginx/html
          fi
          REMOTE

      - name: Ověřit produkční Caddy přímo na serveru
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25)
          ssh "${opts[@]}" ubuntu@57.129.43.215 "MAIN_SHA='$MAIN_SHA' MP='$MP' GYM='$GYM' APO='$APO' ESO='$ESO' bash -s" <<'REMOTE'
          set -euo pipefail
          get() { curl -kfsS -L --max-time 30 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz$1?repair=$(date +%s%N)"; }
          home="$(get /)"
          archive="$(get /clanky/)"
          rss="$(get /rss.xml)"
          sitemap="$(get /sitemap.xml)"
          news="$(get /news-sitemap.xml)"
          health="$(get /deployment-health.txt)"
          mp="$(get /clanky/$MP.html)"
          gym="$(get /clanky/$GYM.html)"
          grep -Fq "data-latest-article-href=\"/clanky/$MP.html\"" <<<"$home"
          grep -Fq "$GYM.html" <<<"$home"
          grep -Fq 'Neřeší městská policie dopravu? Bouřlivá debata přiměla redakci ověřit fakta' <<<"$mp"
          grep -Fq 'Gymnastice v Kadani chybějí trenéři' <<<"$gym"
          for slug in "$MP" "$GYM" "$APO" "$ESO"; do
            grep -Fq "$slug.html" <<<"$archive"
            grep -Fq "$slug.html" <<<"$rss"
            grep -Fq "$slug.html" <<<"$sitemap"
          done
          grep -Fq "$MP.html" <<<"$news"
          grep -Fq "$GYM.html" <<<"$news"
          grep -Fq "source=$MAIN_SHA" <<<"$health"
          grep -Fq 'mode=emergency-latest-live-repair' <<<"$health"
          echo 'SERVER_PUBLIC_OK=1'
          REMOTE

      - name: Zapsat výsledek a zavřít servisní PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? '✅ Živý produkční Caddy byl obnoven z aktuálního main. Ověřeno: Městská policie jako nejnovější článek, Gymnastika hned za ní, oba přímé články, archiv, RSS, sitemap, news-sitemap a deployment-health.'
              : '❌ Nouzová obnova nebo serverová kontrola selhala. Živý web nepovažovat za opravený.';
            await github.rest.issues.createComment({owner:context.repo.owner, repo:context.repo.repo, issue_number:context.issue.number, body});
            if (ok) await github.rest.pulls.update({owner:context.repo.owner, repo:context.repo.repo, pull_number:context.issue.number, state:'closed'});
