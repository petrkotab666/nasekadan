name: Publikovat příběh dárkyně z Nemocnice Kadaň

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-darci-krvetvornych-bunek-now-20260803.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-darci-krvetvornych-bunek-20260803
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE_REL: /clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
      ARTICLE_FILE: clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
      EXPECTED_H1: Zaregistrovala se v Kadani. O rok později darovala krvetvorné buňky konkrétnímu pacientovi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vygenerovat a zapsat článek
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/publish_darci_krvetvornych_bunek_20260803.py')
          s = p.read_text(encoding='utf-8')
          old = r'''r'<section class="wrap hero"\b.*?</section>' '''.strip()
          new = r'''r'<section class="wrap hero"[^>]*>.*?</section>' '''.strip()
          if old not in s:
              raise SystemExit('Původní chybný výraz nebyl nalezen.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python3 scripts/publish_darci_krvetvornych_bunek_20260803.py
          grep -Fq "<h1>${EXPECTED_H1}</h1>" "$ARTICLE_FILE"
          grep -Fq "$ARTICLE_REL" index.html clanky/index.html
          grep -Fq '/pocasi.js' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publish_darci_krvetvornych_bunek_20260803.py "$ARTICLE_FILE" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt data/published-content-index.json
          git commit -m 'Publikovat: příběh dárkyně krvetvorných buněk z Kadaně'
          git push origin HEAD:main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Nasadit malý balíček přímo na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          b="$RUNNER_TEMP/donor-bundle"
          mkdir -p "$b/clanky" "$b/data"
          cp "$ARTICLE_FILE" "$b/clanky/"
          cp clanky/index.html "$b/clanky/index.html"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt "$b/"
          cp data/published-content-index.json "$b/data/"
          printf 'status=ok\nsource=%s\narticle=https://nasekadan.cz%s\n' '${{ steps.generate.outputs.source_sha }}' "$ARTICLE_REL" > "$b/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$b" ubuntu@57.129.43.215:/tmp/donor-bundle
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/donor-bundle
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/clanky" "$root/data"
          sudo install -m 0644 "$src/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html" "$root/clanky/"
          sudo install -m 0644 "$src/clanky/index.html" "$root/clanky/index.html"
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo install -m 0644 "$src/$f" "$root/$f"; done
          sudo install -m 0644 "$src/data/published-content-index.json" "$root/data/published-content-index.json"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/data
            sudo docker cp "$src/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html" nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$src/clanky/index.html" nasekadan-web:/usr/share/nginx/html/clanky/index.html
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo docker cp "$src/$f" "nasekadan-web:/usr/share/nginx/html/$f"; done
            sudo docker cp "$src/data/published-content-index.json" nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
          fi
          rm -rf /tmp/donor-bundle
          REMOTE

      - name: Ověřit veřejný web
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          base=https://nasekadan.cz
          q="${GITHUB_RUN_ID}-$(date +%s)"
          article="$(curl -4 -kfsS -L --max-time 30 "$base$ARTICLE_REL?v=$q")"
          home="$(curl -4 -kfsS -L --max-time 30 "$base/?v=$q")"
          archive="$(curl -4 -kfsS -L --max-time 30 "$base/clanky/?v=$q")"
          rss="$(curl -4 -kfsS -L --max-time 30 "$base/rss.xml?v=$q")"
          sitemap="$(curl -4 -kfsS -L --max-time 30 "$base/sitemap.xml?v=$q")"
          news="$(curl -4 -kfsS -L --max-time 30 "$base/news-sitemap.xml?v=$q")"
          grep -Fq "<h1>${EXPECTED_H1}</h1>" <<<"$article"
          grep -Fq 'index,follow' <<<"$article"
          grep -Fq "$ARTICLE_REL" <<<"$home"
          grep -Fq '/pocasi.js' <<<"$home"
          grep -Fq "$ARTICLE_REL" <<<"$archive"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" <<<"$rss"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" <<<"$sitemap"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" <<<"$news"
          curl -4 -kfsS -L --max-time 30 "$base/api/pocasi-predpoved.json?v=$q" | python3 -m json.tool >/dev/null

      - name: Zapsat stav
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ steps.generate.outputs.source_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const deploy = process.env.DEPLOY || 'skipped';
            const verify = process.env.VERIFY || 'skipped';
            const status = deploy === 'success' && verify === 'success' ? 'success' : 'failure';
            const payload = {status, run_id:String(context.runId), source_sha:process.env.SOURCE_SHA || '', checked_at:new Date().toISOString(), deploy, external_verify:verify, article:'https://nasekadan.cz/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html', homepage:status==='success', archive:status==='success', rss:status==='success', sitemaps:status==='success', weather_preserved:status==='success'};
            let sha;
            try { sha = (await github.rest.repos.getContent({owner,repo,path:'.github/donor-article-live-status.json',ref:'main'})).data.sha; }
            catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'.github/donor-article-live-status.json',branch:'main',message:`Zapsat stav publikace dárcovství: ${status} [skip ci]`,sha,content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64')});
