name: Ověřit živé bannery Reality Kadaň

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-realitykadan-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ověřit živé soubory bez cache
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          js="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/reklamy.js?v=$stamp")"
          fix="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/reklamy-oprava-obrazku.js?v=$stamp")"
          byt="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/assets/reklamy/realitykadan-byt-wide-v1.svg?v=$stamp")"
          garaz="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/assets/reklamy/realitykadan-garaz-wide-v1.svg?v=$stamp")"
          grep -Fq "id:'realitykadan-byt'" <<<"$js"
          grep -Fq "id:'realitykadan-garaz'" <<<"$js"
          grep -Fq 'promo-card-full-image' <<<"$js"
          grep -Fq '[...reality,...cleaning,...seasonal]' <<<"$fix"
          grep -Fq 'KOUPÍME HO.' <<<"$byt"
          grep -Fq 'KOUPÍME JI.' <<<"$garaz"
          grep -Fq 'https://realitykadan.cz' <<<"$js"

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'realitykadan-banner-status.json';
            const status = {
              status: process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              run_id: context.runId,
              live_verification: process.env.VERIFY_OUTCOME || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat stav bannerů Reality Kadaň: ${status.status}`,
              content,
              ...(sha ? {sha} : {})
            });
