name: Veřejně ověřit kanonickou evidenci článků

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-published-content-now.yml'

permissions:
  contents: write

concurrency:
  group: audit-published-content-now
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Počkat na produkční deploy a ověřit všechny veřejné kanály
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          from datetime import datetime, timezone
          from html import unescape
          from pathlib import Path
          import hashlib
          import json
          import re
          import time
          import urllib.request

          BASE = 'https://nasekadan.cz'
          registry_path = Path('data/published-content-index.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          expected = {a['url']: a for a in registry['articles']}
          expected_count = len(expected)
          fragments = {f'{BASE}/clanky/parts/slovan-0{i}.html' for i in range(1, 6)}

          def fetch(path: str, timeout: int = 30) -> str:
              sep = '&' if '?' in path else '?'
              url = f'{BASE}{path}{sep}audit={int(time.time())}'
              req = urllib.request.Request(url, headers={'User-Agent': 'NaseKadanCanonicalAudit/1.1'})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read().decode('utf-8', errors='replace')

          def urls(text: str) -> set[str]:
              paths = re.findall(r'(?:https://nasekadan[.]cz)?(/clanky/[A-Za-z0-9._~%/-]+[.]html)', text)
              return {BASE + path for path in paths}

          homepage = archive = rss = sitemap = news = health = ''
          last_error = ''
          for attempt in range(40):
              try:
                  homepage = fetch('/')
                  archive = fetch('/clanky/')
                  rss = fetch('/rss.xml')
                  sitemap = fetch('/sitemap.xml')
                  news = fetch('/news-sitemap.xml')
                  health = fetch('/deployment-health.txt')
                  sitemap_urls = urls(sitemap)
                  if fragments & sitemap_urls:
                      raise RuntimeError('produkční sitemap ještě obsahuje dílčí fragmenty')
                  if not set(expected).issubset(sitemap_urls):
                      raise RuntimeError('produkční sitemap ještě neobsahuje všechny články registru')
                  break
              except Exception as exc:
                  last_error = str(exc)
                  if attempt == 39:
                      raise SystemExit(f'Veřejná kontrola se nedokončila: {last_error}')
                  time.sleep(15)

          homepage_urls = urls(homepage) & set(expected)
          archive_urls = urls(archive) & set(expected)
          rss_urls = urls(rss) & set(expected)
          sitemap_urls = urls(sitemap)
          news_urls = urls(news)

          if len(homepage_urls) != expected_count:
              raise SystemExit(f'Titulka obsahuje {len(homepage_urls)} z {expected_count} článků')
          if len(archive_urls) != expected_count:
              raise SystemExit(f'Archiv obsahuje {len(archive_urls)} z {expected_count} článků')
          if len(rss_urls) != expected_count:
              raise SystemExit(f'RSS obsahuje {len(rss_urls)} z {expected_count} článků')
          if not set(expected).issubset(sitemap_urls):
              raise SystemExit('Sitemap neobsahuje všechny články registru')
          if fragments & sitemap_urls:
              raise SystemExit('Sitemap stále obsahuje neveřejné fragmenty')
          if not news_urls.issubset(set(expected)):
              raise SystemExit('News sitemap obsahuje URL mimo kanonický registr článků')

          h1_mismatches = []
          for url, article in expected.items():
              path = url.removeprefix(BASE)
              text = fetch(path)
              match = re.search(r'<h1\b[^>]*>(.*?)</h1>', text, re.I | re.S)
              if not match:
                  h1_mismatches.append({'url': url, 'expected': article['h1'], 'actual': None})
                  continue
              actual = re.sub(r'\s+', ' ', unescape(re.sub(r'<[^>]+>', ' ', match.group(1)))).strip()
              if actual != article['h1']:
                  h1_mismatches.append({'url': url, 'expected': article['h1'], 'actual': actual})
          if h1_mismatches:
              raise SystemExit('Rozdílné H1: ' + json.dumps(h1_mismatches, ensure_ascii=False))

          for url, article in expected.items():
              article['status'] = {
                  'homepage': url in homepage_urls,
                  'archive': url in archive_urls,
                  'rss': url in rss_urls,
                  'sitemap': url in sitemap_urls,
                  'news_sitemap': url in news_urls,
              }

          registry_urls = [article['url'] for article in registry['articles']]
          duplicate_urls = sorted({url for url in registry_urls if registry_urls.count(url) > 1})
          fingerprints = {}
          for article in registry['articles']:
              fingerprints.setdefault(article['fingerprint'], []).append(article['url'])
          duplicate_fingerprints = [group for group in fingerprints.values() if len(group) > 1]
          source_match = re.search(r'^source=([0-9a-f]{40})$', health, re.M)
          if not source_match:
              raise SystemExit('deployment-health.txt neobsahuje platný source commit')

          now = datetime.now(timezone.utc).isoformat(timespec='seconds')
          registry['generated_at'] = now
          validation = registry.setdefault('validation', {})
          validation.update({
              'homepage_count': len(homepage_urls),
              'archive_count': len(archive_urls),
              'rss_count': len(rss_urls),
              'sitemap_all_articles_present': set(expected).issubset(sitemap_urls),
              'news_sitemap_recent_count': len(news_urls),
              'deployment_health': 'verified',
              'deployment_health_source': source_match.group(1),
              'required_fields_complete': all(
                  all(key in article for key in ('title','h1','url','published_at','modified_at','persons','organizations','places','cases','topics','fingerprint','status','source_commit'))
                  for article in registry['articles']
              ),
              'duplicate_urls': duplicate_urls,
              'duplicate_fingerprints': duplicate_fingerprints,
              'per_article_source_commits': all(bool(a.get('source_commit')) for a in registry['articles']),
              'excluded_non_article_fragments': sorted(fragments),
              'public_audit_at': now,
              'public_audit_sha256': hashlib.sha256((homepage + archive + rss + sitemap + news + health).encode('utf-8')).hexdigest(),
          })
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'articles': expected_count,
              'homepage': len(homepage_urls),
              'archive': len(archive_urls),
              'rss': len(rss_urls),
              'news_sitemap': len(news_urls),
              'deployment_source': source_match.group(1),
              'fragment_urls_in_sitemap': sorted(fragments & sitemap_urls),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Uložit audit a odstranit jednorázový workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nasekadan-bot"
          git config user.email "nasekadan-bot@users.noreply.github.com"
          git rm .github/workflows/audit-published-content-now.yml
          git add data/published-content-index.json
          git commit -m "Veřejně ověřit kanonickou evidenci článků"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 5
          done
          exit 1
