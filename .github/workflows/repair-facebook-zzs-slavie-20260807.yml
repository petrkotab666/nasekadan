name: Opravit skutečný Facebook náhled ZZS a Slávie

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 815
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_C: ${{ secrets.OVH_SSH_KEY }}
      FB_TOKEN_1: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FB_TOKEN_2: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      FB_TOKEN_3: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      FB_TOKEN_4: ${{ secrets.FACEBOOK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Opravit Facebook metadata pouze u ZZS a Slávie
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python scripts/harden_facebook_meta.py --write --check --paths \
            clanky/zzs-kadan-garaz-mycka-2026.html \
            clanky/slavie-kadan-epp-plavci-120-tisic-2026.html | tee "$RUNNER_TEMP/meta.log"
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Trvale uložit případné změny metadat
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – Facebook'
          git config user.email 'info@nasekadan.cz'
          git add clanky/zzs-kadan-garaz-mycka-2026.html clanky/slavie-kadan-epp-plavci-120-tisic-2026.html
          if ! git diff --cached --quiet; then
            git commit -m 'Trvale opravit Facebook metadata ZZS a Slávie [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              sleep $((attempt*2))
            done
          fi
          git fetch origin main
          git reset --hard origin/main
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zjistit přesné OG obrázky a ověřit PNG
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/assets.log" >> "$GITHUB_ENV"
          from pathlib import Path
          import re
          items=[
            ('ZZS','clanky/zzs-kadan-garaz-mycka-2026.html','https://nasekadan.cz/clanky/zzs-kadan-garaz-mycka-2026.html'),
            ('SLAVIE','clanky/slavie-kadan-epp-plavci-120-tisic-2026.html','https://nasekadan.cz/clanky/slavie-kadan-epp-plavci-120-tisic-2026.html'),
          ]
          for key,path,url in items:
            text=Path(path).read_text(encoding='utf-8')
            def meta(prop):
              m=re.search(rf'<meta\b[^>]*property=["\']{re.escape(prop)}["\'][^>]*content=["\']([^"\']+)',text,re.I)
              return m.group(1).replace('&amp;','&') if m else ''
            image=meta('og:image'); secure=meta('og:image:secure_url')
            assert image.startswith('https://nasekadan.cz/social/') and '?fb=' in image,(key,image)
            assert secure==image,(key,secure,image)
            clean=image.split('?',1)[0]
            rel=clean.removeprefix('https://nasekadan.cz/').lstrip('/')
            p=Path(rel); assert p.is_file() and p.stat().st_size>10000,(key,rel)
            head=p.read_bytes()[:24]; assert head[:8]==b'\x89PNG\r\n\x1a\n'
            dims=(int.from_bytes(head[16:20],'big'),int.from_bytes(head[20:24],'big')); assert dims==(1200,630),(key,dims)
            print(f'{key}_ARTICLE_PATH={path}')
            print(f'{key}_ARTICLE_URL={url}')
            print(f'{key}_IMAGE_URL={image}')
            print(f'{key}_IMAGE_PATH={rel}')
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Nasadit přesná HTML a PNG na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-${OVH_KEY_C:-}}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"
          tar -czf "$RUNNER_TEMP/fb-live.tgz" "$ZZS_ARTICLE_PATH" "$ZZS_IMAGE_PATH" "$SLAVIE_ARTICLE_PATH" "$SLAVIE_IMAGE_PATH"
          scp -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$RUNNER_TEMP/fb-live.tgz" ubuntu@57.129.43.215:/tmp/fb-live.tgz
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          LOCK=/tmp/nasekadan-production-deploy.lock
          sudo touch "$LOCK"; sudo chmod a+rw "$LOCK"; exec 9>"$LOCK"; flock -w 300 9
          sudo tar -xzf /tmp/fb-live.tgz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp /var/www/nasekadan/clanky/zzs-kadan-garaz-mycka-2026.html nasekadan-web:/usr/share/nginx/html/clanky/zzs-kadan-garaz-mycka-2026.html
            sudo docker cp /var/www/nasekadan/clanky/slavie-kadan-epp-plavci-120-tisic-2026.html nasekadan-web:/usr/share/nginx/html/clanky/slavie-kadan-epp-plavci-120-tisic-2026.html
            sudo docker cp /var/www/nasekadan/social/. nasekadan-web:/usr/share/nginx/html/social/
          fi
          rm -f /tmp/fb-live.tgz
          REMOTE
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Ověřit živé články a obrázky z internetu
        id: live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/live.log"
          import os,re,struct,time,urllib.request
          ua='facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)'
          for key in ('ZZS','SLAVIE'):
            url=os.environ[key+'_ARTICLE_URL']; expected=os.environ[key+'_IMAGE_URL']
            req=urllib.request.Request(url+'?fbverify='+str(time.time_ns()),headers={'User-Agent':ua,'Cache-Control':'no-cache','Pragma':'no-cache'})
            with urllib.request.urlopen(req,timeout=40) as r: status=r.status; text=r.read().decode('utf-8','replace')
            assert status==200
            m=re.search(r'<meta\b[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)',text,re.I); assert m
            actual=m.group(1).replace('&amp;','&'); assert actual==expected,(key,actual,expected)
            req=urllib.request.Request(expected,headers={'User-Agent':ua,'Cache-Control':'no-cache','Pragma':'no-cache'})
            with urllib.request.urlopen(req,timeout=40) as r: ctype=(r.headers.get('Content-Type') or '').split(';')[0].lower(); data=r.read(); code=r.status
            assert code==200 and ctype=='image/png' and data[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',data[16:24])==(1200,630)
            print('LIVE',key,'200',ctype,len(data),expected)
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Vynutit Meta Graph API scrape=true
        id: scrape
        shell: bash
        run: |
          set -euo pipefail
          token="${FB_TOKEN_1:-}"
          [[ -n "$token" ]] || token="${FB_TOKEN_2:-}"
          [[ -n "$token" ]] || token="${FB_TOKEN_3:-}"
          [[ -n "$token" ]] || token="${FB_TOKEN_4:-}"
          if [[ -z "$token" ]]; then echo 'TOKEN_MISSING' | tee "$RUNNER_TEMP/scrape.log"; exit 20; fi
          : > "$RUNNER_TEMP/scrape.log"
          for key in ZZS SLAVIE; do
            eval "url=\${${key}_ARTICLE_URL}"
            eval "expected=\${${key}_IMAGE_URL}"
            response="$(curl -fsS -X POST 'https://graph.facebook.com/v23.0/' --data-urlencode "id=$url" --data-urlencode 'scrape=true' --data-urlencode "access_token=$token")"
            python3 - "$key" "$url" "$expected" "$response" <<'PY' | tee -a "$RUNNER_TEMP/scrape.log"
          import json,sys
          key,url,expected,raw=sys.argv[1:]
          d=json.loads(raw)
          if 'error' in d: raise SystemExit(json.dumps(d['error'],ensure_ascii=False))
          obj=d.get('og_object') if isinstance(d,dict) else None
          img=''
          if isinstance(obj,dict): img=obj.get('image') or ''
          print(json.dumps({'key':key,'url':url,'expected':expected,'facebook_image':img,'response_keys':sorted(d.keys()) if isinstance(d,dict) else []},ensure_ascii=False))
          PY
            sleep 3
          done
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Vypsat skutečné Meta požadavky ze serveru
        id: logs
        if: always()
        shell: bash
        run: |
          set +e
          if [[ ! -s "$RUNNER_TEMP/key" ]]; then echo 'SSH key not prepared' > "$RUNNER_TEMP/fb-access.log"; exit 0; fi
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'sudo sh -c "zgrep -hiE '\''facebookexternalhit|meta-externalagent|Facebot'\'' /var/log/nginx/access.log* 2>/dev/null | tail -n 120"' > "$RUNNER_TEMP/fb-access.log" 2>&1
          cat "$RUNNER_TEMP/fb-access.log"
          exit 0

      - name: Zapsat přesný výsledek do issue 815
        if: always()
        uses: actions/github-script@v7
        env:
          META: ${{ steps.meta.outputs.ok }}
          ASSETS: ${{ steps.assets.outputs.ok }}
          DEPLOY: ${{ steps.deploy.outputs.ok }}
          LIVE: ${{ steps.live.outputs.ok }}
          SCRAPE: ${{ steps.scrape.outputs.ok }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); const read=n=>{try{return fs.readFileSync(process.env.RUNNER_TEMP+'/'+n,'utf8').slice(-6000)}catch{return ''}};
            const scrape=read('scrape.log'), live=read('live.log'), access=read('fb-access.log');
            const ok=process.env.META==='true'&&process.env.ASSETS==='true'&&process.env.DEPLOY==='true'&&process.env.LIVE==='true'&&process.env.SCRAPE==='true';
            const body=ok?`✅ Meta Graph API znovu načetlo ZZS i Slávii. Živé články i PNG jsou 200 a 1200×630.\n\nGraph API:\n\`\`\`json\n${scrape}\n\`\`\`\n\nŽivá kontrola:\n\`\`\`\n${live}\n\`\`\`\n\nMeta požadavky v nginx logu:\n\`\`\`\n${access}\n\`\`\``:`❌ Facebook oprava selhala. meta=${process.env.META||'false'}, assets=${process.env.ASSETS||'false'}, deploy=${process.env.DEPLOY||'false'}, live=${process.env.LIVE||'false'}, scrape=${process.env.SCRAPE||'false'}.\n\nScrape:\n\`\`\`\n${scrape}\n\`\`\`\nLive:\n\`\`\`\n${live}\n\`\`\``;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:815,body});
            if(ok) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:815,state:'closed',state_reason:'completed'});

      - name: Selhat při neúspěchu
        if: always()
        run: |
          test "${{ steps.scrape.outputs.ok }}" = 'true'
