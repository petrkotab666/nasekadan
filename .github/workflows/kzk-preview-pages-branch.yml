name: Zveřejnit dočasný náhled KZK přes Pages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/kzk-pages-branch-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      T_GH_PAT: ${{ secrets.GH_PAT }}
      T_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      T_PAT: ${{ secrets.PAT }}
      T_PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      T_PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      T_CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
      T_REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      T_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      T_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      T_AUTOMATION_PAT: ${{ secrets.AUTOMATION_PAT }}
      T_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      T_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      T_GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_ACCESS_TOKEN }}
      T_CENTRAL_REPO_TOKEN: ${{ secrets.CENTRAL_REPO_TOKEN }}
      T_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      PREVIEW_URL: https://petrkotab666.github.io/nasekadan/nahled/kulturni-zarizeni-kadan-8c7f3e.html
    steps:
      - name: Stáhnout hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Najít zapisovací token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kzk-pages"
          : > "$RUNNER_TEMP/kzk-pages/report.txt"
          selected=''
          for name in T_GH_PAT T_GITHUB_PAT T_PAT T_PAT_TOKEN T_PERSONAL_ACCESS_TOKEN T_CROSS_REPO_TOKEN T_REPO_TOKEN T_PRIVATE_REPO_TOKEN T_DEPLOY_TOKEN T_AUTOMATION_PAT T_BOT_TOKEN T_ACCESS_TOKEN T_GITHUB_ACCESS_TOKEN T_CENTRAL_REPO_TOKEN T_SYNC_TOKEN; do
            value="${!name:-}"
            [ -n "$value" ] || continue
            code=$(curl -sS -o "$RUNNER_TEMP/kzk-pages/repo.json" -w '%{http_code}' \
              -H "Authorization: Bearer $value" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY" || true)
            if [ "$code" = 200 ]; then
              push=$(jq -r '.permissions.push // false' "$RUNNER_TEMP/kzk-pages/repo.json")
              admin=$(jq -r '.permissions.admin // false' "$RUNNER_TEMP/kzk-pages/repo.json")
              echo "$name: push=$push admin=$admin" >> "$RUNNER_TEMP/kzk-pages/report.txt"
              if [ "$push" = true ]; then
                printf '%s' "$value" > "$RUNNER_TEMP/kzk-pages/token"
                chmod 600 "$RUNNER_TEMP/kzk-pages/token"
                selected="$name"
                break
              fi
            else
              echo "$name: HTTP $code" >> "$RUNNER_TEMP/kzk-pages/report.txt"
            fi
          done
          if [ -z "$selected" ]; then
            echo 'Nebyl nalezen zapisovací token.' >> "$RUNNER_TEMP/kzk-pages/report.txt"
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Vybraný token: $selected" >> "$RUNNER_TEMP/kzk-pages/report.txt"
          echo 'available=true' >> "$GITHUB_OUTPUT"
          echo "name=$selected" >> "$GITHUB_OUTPUT"

      - name: Připravit samostatný statický náhled
        id: build
        if: steps.token.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/kzk-pages/site"
          mkdir -p "$RUNNER_TEMP/kzk-pages/site"
          rsync -a ./ "$RUNNER_TEMP/kzk-pages/site/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'scripts/' \
            --exclude 'nginx/' \
            --exclude 'Dockerfile' \
            --exclude 'docker-compose.yml' \
            --exclude 'deploy/' \
            --exclude 'CNAME' \
            --exclude '_site/'
          touch "$RUNNER_TEMP/kzk-pages/site/.nojekyll"
          test -s "$RUNNER_TEMP/kzk-pages/site/nahled/kulturni-zarizeni-kadan-8c7f3e.html"
          grep -Fq 'raw.githubusercontent.com/petrkotab666/nasekadan/main/.github/drafts/kulturni-zarizeni-kadan.html' \
            "$RUNNER_TEMP/kzk-pages/site/nahled/kulturni-zarizeni-kadan-8c7f3e.html"
          echo 'build=true' >> "$GITHUB_OUTPUT"

      - name: Publikovat větev gh-pages
        id: publish
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/kzk-pages/askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) cat "$RUNNER_TEMP/kzk-pages/token" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/kzk-pages/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/kzk-pages/askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          cd "$RUNNER_TEMP/kzk-pages/site"
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Dočasný náhled článku KZK $GITHUB_RUN_ID"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git push --force origin HEAD:gh-pages

      - name: Zapnout Pages z větve gh-pages
        id: pages
        if: steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat "$RUNNER_TEMP/kzk-pages/token")
          code=$(curl -sS -o "$RUNNER_TEMP/kzk-pages/pages-current.json" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true)
          payload='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          if [ "$code" = 404 ]; then method=POST; else method=PUT; fi
          result=$(curl -sS -o "$RUNNER_TEMP/kzk-pages/pages-result.json" -w '%{http_code}' -X "$method" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true)
          echo "Pages API: GET=$code, $method=$result" >> "$RUNNER_TEMP/kzk-pages/report.txt"
          cat "$RUNNER_TEMP/kzk-pages/pages-result.json" >> "$RUNNER_TEMP/kzk-pages/report.txt" || true
          if [ "$result" -lt 200 ] || [ "$result" -ge 300 ]; then exit 1; fi

      - name: Ověřit náhled v prohlížeči
        id: verify
        if: steps.pages.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            page=$(curl -fsSL --max-time 20 "$PREVIEW_URL?check=$GITHUB_RUN_ID-$attempt-$(date +%s)" 2>/dev/null || true)
            if printf '%s' "$page" | grep -Fq 'Načítám návrh článku KZK'; then
              ready=1
              break
            fi
            sleep 4
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          test "$ready" = 1

      - name: Zapsat výsledek do PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TOKEN_AVAILABLE: ${{ steps.token.outputs.available }}
          TOKEN_NAME: ${{ steps.token.outputs.name }}
          PUBLISH: ${{ steps.publish.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync(`${process.env.RUNNER_TEMP}/kzk-pages/report.txt`, 'utf8'); } catch {}
            const body = [
              '## Dočasný náhled KZK přes GitHub Pages',
              '',
              `- Token dostupný: **${process.env.TOKEN_AVAILABLE || 'false'}**`,
              `- Token: \`${process.env.TOKEN_NAME || 'žádný'}\``,
              `- Publikace větve: **${process.env.PUBLISH || 'neprovedeno'}**`,
              `- Nastavení Pages: **${process.env.PAGES || 'neprovedeno'}**`,
              `- Ověření: **${process.env.VERIFY || 'neprovedeno'}**`,
              `- Náhled: ${process.env.PREVIEW_URL}`,
              '',
              '```text', report.slice(-12000), '```'
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});

      - name: Vyhodnotit
        if: always()
        shell: bash
        env:
          AVAILABLE: ${{ steps.token.outputs.available }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          test "$AVAILABLE" = true
          test "$VERIFY" = success
