name: Zveřejnit omezení rozdělávání ohňů

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fire-restrictions-20260731.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nasekadan-canonical-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vytvořit článek, obrázek a veřejné přehledy
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/publish_fire_restrictions_20260731.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('social/nebezpeci-pozaru-ustecky-kraj-kadan-2026.png')
          with Image.open(p) as im:
              assert im.format == 'PNG' and im.size == (1200,630)
          assert p.stat().st_size > 10000
          PY

      - name: Uložit ověřený zdroj na main
        id: source
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň publikační automat'
          git config user.email 'info@nasekadan.cz'
          git add clanky/nebezpeci-pozaru-ustecky-kraj-kadan-2026.html \
            social/nebezpeci-pozaru-ustecky-kraj-kadan-2026.png \
            index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt analytics.js 404.html style.css
          git commit -m 'Zveřejnit protipožární omezení pro Kadaň [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
          git fetch origin main
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Kanonicky nasadit na OVH
        run: |
          set -euo pipefail
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash deploy/sync-production.sh

      - name: Veřejně ověřit článek, obrázek, přehledy a source
        id: verify
        run: |
          set -euo pipefail
          slug='nebezpeci-pozaru-ustecky-kraj-kadan-2026'
          title='Ústecký kraj znovu omezil rozdělávání ohňů. Opatření platí i pro Kadaň do konce srpna'
          sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 24); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${slug}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?v=${stamp}-${attempt}" 2>/dev/null || true)"
            image="$RUNNER_TEMP/fire-${attempt}.png"
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/social/${slug}.png?v=${stamp}-${attempt}" -o "$image" 2>/dev/null || true
            image_ok="$(python3 - "$image" <<'PY'
          import sys
          from pathlib import Path
          try:
              from PIL import Image
              p=Path(sys.argv[1])
              with Image.open(p) as im:
                  print('yes' if im.format=='PNG' and im.size==(1200,630) and p.stat().st_size>10000 else 'no')
          except Exception:
              print('no')
          PY
            )"
            if grep -Fq "<h1>${title}</h1>" <<<"$article" \
              && grep -Fq "/clanky/${slug}.html" <<<"$home" \
              && grep -Fq "/clanky/${slug}.html" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${slug}.html" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${slug}.html" <<<"$sitemap" \
              && grep -Fq "source=${sha}" <<<"$health" \
              && [[ "$image_ok" == yes ]]; then
              echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Zapsat výsledek k monitoringu
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
        with:
          script: |
            const success = process.env.RESULT === 'success';
            const body = [
              `## Publikace ${success ? 'veřejně ověřena' : 'nebyla plně ověřena'}`,
              '',
              `- Čas kontroly: ${new Date().toISOString()}`,
              `- Článek: https://nasekadan.cz/clanky/nebezpeci-pozaru-ustecky-kraj-kadan-2026.html`,
              `- Sociální obrázek: 1200 × 630`,
              `- Titulka, archiv, RSS, sitemap a deployment-health: **${success ? 'ověřeno' : 'selhání nebo rozpor'}**`,
              `- Veřejný source: ${process.env.SOURCE_SHA || 'nepotvrzen'}`,
              `- Běh: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:232,body});

# Ruční spuštění publikace: 2026-07-31 10:13 CEST
