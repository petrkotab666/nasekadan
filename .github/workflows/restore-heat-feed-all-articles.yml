name: Vrátit sezónní feed do všech článků

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-heat-feed-all-articles.yml

permissions:
  contents: write

concurrency:
  group: nasekadan-restore-heat-feed
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Zapsat trvalé pravidlo pro všechny články
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/enable_heat_feed.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SCRIPT = '<script src="/horko-feed.js?v=20260728-heat-2"></script>'
          SCRIPT_RE = re.compile(
              r'\s*<script\s+src=["\']/horko-feed\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*',
              re.IGNORECASE,
          )


          def is_public_article(path: Path, text: str) -> bool:
              relative = path.relative_to(ROOT)
              return (
                  len(relative.parts) == 2
                  and relative.parts[0] == 'clanky'
                  and relative.name != 'index.html'
                  and 'article-shell' in text
                  and re.search(r'<article\b[^>]*class=["\'][^"\']*\barticle\b', text, re.I) is not None
                  and '<body' in text.lower()
                  and '</body>' in text.lower()
              )


          def main() -> int:
              articles = 0
              changed = 0
              for path in sorted(ROOT.rglob('*.html')):
                  relative = path.relative_to(ROOT)
                  if any(part in {'.git', '.github', 'nahled', 'sdilet'} for part in relative.parts):
                      continue
                  try:
                      original = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue

                  current = SCRIPT_RE.sub('\n', original)
                  if is_public_article(path, current):
                      articles += 1
                      pos = current.lower().rfind('</body>')
                      current = current[:pos].rstrip() + '\n' + SCRIPT + '\n' + current[pos:]

                  if current != original:
                      path.write_text(current, encoding='utf-8', newline='\n')
                      changed += 1
                      print(f'Upraveno: {relative}')

              if articles == 0:
                  raise RuntimeError('Nebyl nalezen žádný veřejný článek.')

              failures = []
              for path in sorted((ROOT / 'clanky').glob('*.html')):
                  text = path.read_text(encoding='utf-8')
                  if is_public_article(path, text) and text.count('/horko-feed.js?v=20260728-heat-2') != 1:
                      failures.append(str(path.relative_to(ROOT)))
              if failures:
                  raise RuntimeError('Feed není právě jednou v článcích: ' + ', '.join(failures))

              for path in (ROOT / 'index.html', ROOT / 'clanky' / 'index.html'):
                  if path.exists() and '/horko-feed.js' in path.read_text(encoding='utf-8'):
                      raise RuntimeError(f'Feed zůstal na nečlánkové stránce: {path.relative_to(ROOT)}')

              print(f'Veřejných článků: {articles}; změněných souborů: {changed}')
              return 0


          if __name__ == '__main__':
              raise SystemExit(main())
          PY
          chmod +x scripts/enable_heat_feed.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/sync-production.sh')
          text = path.read_text(encoding='utf-8')
          call = 'python3 scripts/enable_heat_feed.py'
          if call not in text:
              anchor = 'python3 scripts/normalize_articles.py --write --check\n'
              if anchor not in text:
                  raise SystemExit('V deploy skriptu chybí očekávaný normalizační krok.')
              text = text.replace(anchor, anchor + call + '\n', 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

          python3 scripts/enable_heat_feed.py
          node --check horko-feed.js
          grep -Fq 'Jak zvládnout horké dny doma' horko-feed.js
          grep -Fq 'python3 scripts/enable_heat_feed.py' deploy/sync-production.sh

      - name: Zapsat opravu do hlavní větve
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-heat-feed-all-articles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Vrátit sezónní feed do všech článků"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

  deploy:
    needs: repair
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit a veřejně ověřit feed v článcích
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash deploy/sync-production.sh
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          curl -kfsS --resolve nasekadan.cz:443:127.0.0.1 \
            "https://nasekadan.cz/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html?feed=$stamp" -o /tmp/heat-article.html
          curl -kfsS --resolve nasekadan.cz:443:127.0.0.1 \
            "https://nasekadan.cz/clanky/arc-med-nemocnice-kadan.html?feed=$stamp" -o /tmp/arc-article.html
          curl -kfsS --resolve nasekadan.cz:443:127.0.0.1 \
            "https://nasekadan.cz/horko-feed.js?v=20260728-heat-2&feed=$stamp" -o /tmp/horko-feed.js
          grep -Fq '/horko-feed.js?v=20260728-heat-2' /tmp/heat-article.html
          grep -Fq '/horko-feed.js?v=20260728-heat-2' /tmp/arc-article.html
          grep -Fq 'Jak zvládnout horké dny doma' /tmp/horko-feed.js
          if curl -kfsS --resolve nasekadan.cz:443:127.0.0.1 \
            "https://nasekadan.cz/?feed=$stamp" | grep -Fq '/horko-feed.js'; then
            echo 'Feed je chybně i na titulní stránce.' >&2
            exit 1
          fi
          echo 'Feed je nasazený v článcích a není na titulní stránce.'
