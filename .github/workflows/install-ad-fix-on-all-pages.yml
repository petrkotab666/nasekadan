name: Načíst obnovený reklamní systém na všech stránkách

on:
  push:
    branches: [main]
    paths:
      - 'reklamy.js'
      - 'reklamy-oprava-obrazku.js'
      - '.github/workflows/install-ad-fix-on-all-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-ad-fix-all-pages
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stáhnout web
        uses: actions/checkout@v4

      - name: Doplnit původní plné reklamní skripty
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          core_version = '20260726-ad-restore-7'
          fix_version = '20260726-ad-restore-7'
          prefix = r'(?:\.\./)*/?'
          pattern = re.compile(
              rf'<script\s+src=["\']{prefix}reklamy\.js(?:\?[^"\']*)?["\']\s*></script>'
              rf'(?:\s*<script\s+src=["\']{prefix}reklamy-oprava-obrazku\.js(?:\?[^"\']*)?["\']\s*></script>)?'
              rf'(?:\s*<script\s+src=["\']{prefix}reklamy-popisy\.js(?:\?[^"\']*)?["\']\s*></script>)?',
              re.I,
          )
          replacement = (
              f'<script src="/reklamy.js?v={core_version}"></script>\n'
              f'<script src="/reklamy-oprava-obrazku.js?v={fix_version}"></script>'
          )

          changed = 0
          scanned = 0
          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts:
                  continue
              scanned += 1
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(replacement, text)
              if count and updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
                  print(f'Upraveno: {path}')

          print(f'Zkontrolováno {scanned} HTML souborů, změněno {changed}.')
          if changed == 0:
              print('Všechny stránky již používají obnovený reklamní systém.')
          PY

      - name: Uložit změny
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' || true
          if git diff --cached --quiet; then
            echo "Není co ukládat."
            exit 0
          fi
          git commit -m "Načíst obnovené bannery na všech stránkách"
          git pull --rebase origin main
          git push
