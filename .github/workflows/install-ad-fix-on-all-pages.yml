name: Sjednotit konstrukci všech článků

on:
  push:
    branches: [main]
    paths:
      - 'clanky/*.html'
      - 'reklamy.js'
      - 'reklamy-oprava-obrazku.js'
      - 'obsah-doplnky.js'
      - 'scripts/normalize_articles.py'
      - '.github/workflows/install-ad-fix-on-all-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-all-articles
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stáhnout aktuální web
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Sjednotit a ověřit všechny články
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/normalize_articles.py --write --check

      - name: Uložit sjednocené články
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'clanky/*.html'
          if git diff --cached --quiet; then
            echo "Všechny články už mají jednotnou konstrukci."
            exit 0
          fi
          git commit -m "Sjednotit konstrukci všech článků"
          git pull --rebase origin main
          git push origin main
