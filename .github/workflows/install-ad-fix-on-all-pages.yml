name: Sjednotit články a sociální obrázky

on:
  push:
    branches: [main]
    paths:
      - 'clanky/*.html'
      - 'reklamy.js'
      - 'reklamy-oprava-obrazku.js'
      - 'obsah-doplnky.js'
      - 'scripts/normalize_articles.py'
      - 'scripts/generate_social_cards.py'
      - '.github/workflows/install-ad-fix-on-all-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-all-articles
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stáhnout aktuální web
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Připravit generování obrázků
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Sjednotit a ověřit všechny články
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check

      - name: Uložit sjednocené články a jejich obrázky
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'clanky/*.html' 'social/*.png' || true
          if git diff --cached --quiet; then
            echo "Všechny články i sociální obrázky jsou aktuální."
            exit 0
          fi
          git commit -m "Sjednotit články a doplnit vlastní Facebook obrázky"
          git pull --rebase origin main
          git push origin main
