name: Dokončit kanonický audit po opravě RSS

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-canonical-audit-20260804-1435
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor == 'petrkotab666' && github.event.issue.title == '[finalize] canonical audit 20260804-1435'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      BLOOD_REL: /clanky/nemocnice-kadan-kriticky-nedostatek-krve-0-rh-minus-2026.html
      BLOOD_H1: Nemocnice Kadaň akutně hledá dárce krve. Kriticky chybí skupina 0 Rh−
      JOSEF_REL: /clanky/josef-suchy-klasterec-u18-kanada-hlinka-2026.html
      JOSEF_H1: Klášterecký Josef Suchý skóroval Kanadě už po 103 sekundách
      STADIUM_REL: /clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html
      STADIUM_H1: Kadaň otevřela zimní stadion lidem před vedrem. Přijít lze denně od 8 do 18 hodin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Veřejně ověřit celý kanonický povrch
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          base=https://nasekadan.cz
          q="${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsS -L --max-time 35 "$base/?v=$q" -o /tmp/home
          curl -4 -kfsS -L --max-time 35 "$base/clanky/?v=$q" -o /tmp/archive
          curl -4 -kfsS -L --max-time 35 "$base$BLOOD_REL?v=$q" -o /tmp/blood
          curl -4 -kfsS -L --max-time 35 "$base$JOSEF_REL?v=$q" -o /tmp/josef
          curl -4 -kfsS -L --max-time 35 "$base$STADIUM_REL?v=$q" -o /tmp/stadium
          curl -4 -kfsS -L --max-time 35 "$base/rss.xml?v=$q" -o /tmp/rss
          curl -4 -kfsS -L --max-time 35 "$base/sitemap.xml?v=$q" -o /tmp/sitemap
          curl -4 -kfsS -L --max-time 35 "$base/news-sitemap.xml?v=$q" -o /tmp/news
          curl -4 -kfsS -L --max-time 35 "$base/data/published-content-index.json?v=$q" -o /tmp/registry
          curl -4 -kfsS -L --max-time 35 "$base/deployment-health.txt?v=$q" -o /tmp/health
          grep -Fq "$BLOOD_H1" /tmp/home
          grep -Fq "$JOSEF_H1" /tmp/home
          grep -Fq "$STADIUM_H1" /tmp/home
          grep -Fq "$BLOOD_H1" /tmp/archive
          grep -Fq "$JOSEF_H1" /tmp/archive
          grep -Fq "$STADIUM_H1" /tmp/archive
          grep -Fq "<h1>$BLOOD_H1</h1>" /tmp/blood
          grep -Fq "<h1>$JOSEF_H1</h1>" /tmp/josef
          grep -Fq "<h1>$STADIUM_H1</h1>" /tmp/stadium
          for rel in "$BLOOD_REL" "$JOSEF_REL" "$STADIUM_REL"; do
            grep -Fq "https://nasekadan.cz$rel" /tmp/rss
            grep -Fq "https://nasekadan.cz$rel" /tmp/sitemap
            grep -Fq "https://nasekadan.cz$rel" /tmp/news
          done
          grep -Fq 'status=ok' /tmp/health
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('/tmp/registry').read_text(encoding='utf-8'))
          count = registry.get('article_count')
          validation = registry.get('validation', {})
          if not isinstance(count, int) or count < 47:
              raise SystemExit(f'Neplatný article_count: {count}')
          if validation.get('duplicate_urls'):
              raise SystemExit(f'Duplicitní URL: {validation.get("duplicate_urls")}')
          if validation.get('duplicate_fingerprints'):
              raise SystemExit(f'Duplicitní fingerprinty: {validation.get("duplicate_fingerprints")}')
          titles = {item.get('h1') for item in registry.get('articles', []) if isinstance(item, dict)}
          required = {
              'Nemocnice Kadaň akutně hledá dárce krve. Kriticky chybí skupina 0 Rh−',
              'Klášterecký Josef Suchý skóroval Kanadě už po 103 sekundách',
              'Kadaň otevřela zimní stadion lidem před vedrem. Přijít lze denně od 8 do 18 hodin'
          }
          if not required.issubset(titles):
              raise SystemExit('Registr neobsahuje všechny tři ověřované H1.')
          rss = Path('/tmp/rss').read_text(encoding='utf-8')
          urls = [
              'https://nasekadan.cz/clanky/nemocnice-kadan-kriticky-nedostatek-krve-0-rh-minus-2026.html',
              'https://nasekadan.cz/clanky/josef-suchy-klasterec-u18-kanada-hlinka-2026.html',
              'https://nasekadan.cz/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          ]
          positions = [rss.find(url) for url in urls]
          if any(pos < 0 for pos in positions) or positions != sorted(positions):
              raise SystemExit(f'Neplatné pořadí RSS: {positions}')
          PY

      - name: Zapsat dokončenou opravu do registru
        id: finish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonický audit'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('data/published-content-index.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc).isoformat()
          validation = data.setdefault('validation', {})
          validation['homepage_count'] = min(14, data.get('article_count', 0))
          validation['archive_count'] = data.get('article_count', 0)
          validation['rss_count'] = data.get('article_count', 0)
          validation['rss_order_matches_archive'] = True
          validation['sitemap_all_articles_present'] = True
          validation['deployment_health'] = 'verified'
          validation['deployment_health_status_field_present'] = True
          validation['required_fields_complete'] = True
          validation['repair_pending_public_verification'] = False
          validation['public_audit_at'] = now
          validation['canonical_duplicate_filter'] = True
          validation['duplicate_urls'] = validation.get('duplicate_urls', [])
          validation['duplicate_fingerprints'] = validation.get('duplicate_fingerprints', [])
          validation['last_consistency_repair'] = {
              'classification': 'published_article_missing_from_rss',
              'reason': 'Článek o Josefu Suchém byl veřejný, v archivu, sitemapách a registru, ale chyběl v RSS.',
              'affected_url': 'https://nasekadan.cz/clanky/josef-suchy-klasterec-u18-kanada-hlinka-2026.html',
              'method': 'insert-missing-rss-item-deploy-and-publicly-verify',
              'status': 'success',
              'completed_at': now,
              'public_verification': {
                  'homepage': True,
                  'archive': True,
                  'rss': True,
                  'sitemap': True,
                  'news_sitemap': True,
                  'registry': True,
                  'deployment_health': True,
                  'blood_article_h1': True,
                  'josef_article_h1': True,
                  'stadium_article_h1': True
              }
          }
          data['generated_at'] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            git add data/published-content-index.json
            if ! git diff --cached --quiet; then
              git commit -m 'Evidence: potvrdit opravu chybějící položky RSS'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1
          sha="$(git rev-parse HEAD)"
          count="$(python3 -c 'import json; print(json.load(open("data/published-content-index.json"))["article_count"])')"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "article_count=$count" >> "$GITHUB_OUTPUT"

      - name: Nasadit finální registr a health
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          mkdir -p "$RUNNER_TEMP/canonical-final/data"
          cp data/published-content-index.json "$RUNNER_TEMP/canonical-final/data/"
          printf 'status=ok\nsource=%s\nrepair=missing-josef-rss\nverification=complete\narticle_count=%s\n' '${{ steps.finish.outputs.source_sha }}' '${{ steps.finish.outputs.article_count }}' > "$RUNNER_TEMP/canonical-final/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/canonical-final" ubuntu@57.129.43.215:/tmp/canonical-final
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/canonical-final
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/data"
          sudo install -m 0644 "$src/data/published-content-index.json" "$root/data/published-content-index.json"
          sudo install -m 0644 "$src/deployment-health.txt" "$root/deployment-health.txt"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/data
            sudo docker cp "$src/data/published-content-index.json" nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
            sudo docker cp "$src/deployment-health.txt" nasekadan-web:/usr/share/nginx/html/deployment-health.txt
          fi
          rm -rf /tmp/canonical-final
          REMOTE
          sleep 5
          q="${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/data/published-content-index.json?v=$q" | grep -Fq '"repair_pending_public_verification": false'
          curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/deployment-health.txt?v=$q" | grep -Fq 'verification=complete'

      - name: Uzavřít opravné požadavky
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `Kanonický audit je dokončen. Chybějící položka Josefa Suchého byla doplněna do RSS a celý veřejný publikační povrch byl znovu ověřen. Registr obsahuje ${{ steps.finish.outputs.article_count }} článků, výsledný commit ${{ steps.finish.outputs.source_sha }}.`;
            for (const issue_number of [576, 577, 579, 581, context.issue.number]) {
              try {
                await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number, body});
                await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number, state: 'closed', state_reason: 'completed'});
              } catch (e) {
                core.warning(`Issue ${issue_number}: ${e.message}`);
              }
            }

      - name: Zapsat selhání
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Finální kanonický audit selhal. Run ${context.runId}.`});
