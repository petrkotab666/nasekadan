name: Cíleně vytěžit InfoSoud pro spory Hossner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-hossner-infosoud-targeted-20260801.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Instalovat prohlížeč
        run: |
          python3 -m pip install --quiet requests beautifulsoup4 lxml playwright
          python3 -m playwright install --with-deps chromium
      - name: Vytěžit oba spisy a jednání
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/research/hossner-court-2026/targeted
          cat > /tmp/targeted.py <<'PY'
          import asyncio, json, re, hashlib, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          OUT=Path('.github/research/hossner-court-2026/targeted'); OUT.mkdir(parents=True,exist_ok=True)
          cases=[84,211]
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          def text(html):
              s=BeautifulSoup(html,'lxml')
              for x in s(['script','style','noscript']): x.decompose()
              return '\n'.join(line.strip() for line in s.get_text('\n').splitlines() if line.strip())
          def old_urls(n):
              q=f'type=spzn&typSoudu=os&krajOrg=VSECHNY_KRAJE&org=OSCV&cisloSenatu=30&druhVec=C&bcVec={n}&rocnik=2025&spamQuestion=23&agendaNc=CIVIL&backPage=..%2Fpublic%2Fsearch.jsp'
              return [
                'https://infosoud.justice.cz/InfoSoud/public/search.do?'+q,
                'https://infojednani.justice.cz/InfoSoud/public/search.do?'+q,
                'https://infosoud.justice.cz/InfoSoud/public/searchJednani.do?'+q,
                'https://infojednani.justice.cz/InfoSoud/public/searchJednani.do?'+q,
              ]
          direct=[]
          for n in cases:
              for i,u in enumerate(old_urls(n)):
                  try:
                      r=requests.get(u,headers={'User-Agent':UA},timeout=60,allow_redirects=True)
                      fn=OUT/f'{n}-direct-{i}.html'; fn.write_bytes(r.content)
                      t=text(r.text); (OUT/f'{n}-direct-{i}.txt').write_text(t,encoding='utf-8')
                      direct.append({'case':f'30 C {n}/2025','url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'title':BeautifulSoup(r.text,'lxml').title.string if BeautifulSoup(r.text,'lxml').title else None,'text':t[:30000]})
                  except Exception as e: direct.append({'case':str(n),'url':u,'error':repr(e)})
          (OUT/'direct.json').write_text(json.dumps(direct,ensure_ascii=False,indent=2),encoding='utf-8')

          async def browser():
              results=[]
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  ctx=await b.new_context(user_agent=UA,locale='cs-CZ',ignore_https_errors=True)
                  for n in cases:
                      for kind,u in [('case',old_urls(n)[0]),('hearing',old_urls(n)[2])]:
                          page=await ctx.new_page(); reqs=[]
                          page.on('response',lambda r,reqs=reqs:reqs.append({'url':r.url,'status':r.status,'type':r.request.resource_type}))
                          try:
                              await page.goto(u,wait_until='networkidle',timeout=120000)
                              await page.wait_for_timeout(3000)
                              html=await page.content(); txt=await page.locator('body').inner_text()
                              (OUT/f'{n}-{kind}-browser.html').write_text(html,encoding='utf-8')
                              (OUT/f'{n}-{kind}-browser.txt').write_text(txt,encoding='utf-8')
                              await page.screenshot(path=str(OUT/f'{n}-{kind}.png'),full_page=True)
                              # Click every visible row/link whose text suggests detail, save resulting text.
                              details=[]
                              links=await page.locator('a').all()
                              for j,a in enumerate(links[:100]):
                                  try:
                                      label=(await a.inner_text()).strip(); href=await a.get_attribute('href')
                                      if href and any(k in (label+' '+href).lower() for k in ('detail','udál','udal','jedn','rozhod','řízení','rizeni')):
                                          details.append({'label':label,'href':urllib.parse.urljoin(page.url,href)})
                                  except: pass
                              results.append({'case':f'30 C {n}/2025','kind':kind,'requested':u,'final':page.url,'title':await page.title(),'body':txt[:50000],'links':details,'responses':reqs})
                          except Exception as e:
                              results.append({'case':str(n),'kind':kind,'requested':u,'error':repr(e),'responses':reqs})
                          await page.close()
                  await b.close()
              return results
          browser_results=asyncio.run(browser())
          (OUT/'browser.json').write_text(json.dumps(browser_results,ensure_ascii=False,indent=2),encoding='utf-8')

          # Souhrn a detekce dat/stavů.
          all_items=direct+browser_results
          md=['# InfoSoud – cílené ověření 30 C 84/2025 a 30 C 211/2025','']
          for n in cases:
              md.append(f'## 30 C {n}/2025')
              joined='\n'.join(str(x.get('text',x.get('body',''))) for x in all_items if str(n) in x.get('case',''))
              dates=sorted(set(re.findall(r'\b(?:0?[1-9]|[12]\d|3[01])[. /-](?:0?[1-9]|1[0-2])[. /-](?:20)?\d{2}\b',joined)))
              md.append('- Data nalezená ve výstupu: '+(', '.join(dates) if dates else 'žádná'))
              for phrase in ['Stav řízení','Napadnutí','Zahájení řízení','Jednání','Přerušení řízení','Odročení','Vyřízení věci','Opravný prostředek','Mediace']:
                  hits=[]
                  for m in re.finditer(phrase,joined,re.I): hits.append(re.sub(r'\s+',' ',joined[max(0,m.start()-150):m.start()+600]))
                  if hits: md.append(f'- **{phrase}:** '+ ' | '.join(hits[:5]))
              md.append('')
          (OUT/'README.md').write_text('\n'.join(md),encoding='utf-8')
          PY
          python3 /tmp/targeted.py
      - name: Uložit výsledky
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/research/hossner-court-2026/targeted
          git commit -m 'Doplnit časové osy spisů Hossner z InfoSoudu' || true
          for i in 1 2 3 4 5; do git pull --rebase origin main || true; git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
