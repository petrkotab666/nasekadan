name: Okamžitě opravit skutečné doručení resetu statistik

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-stats-reset-delivery-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-stats-reset-delivery-now
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMTP_PASSWORD: ${{ secrets.NEWSLETTER_SMTP_PASSWORD }}
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Opravit odesílací účet a vyžádat nový reset
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          exec > >(tee "$RUNNER_TEMP/result.txt") 2>&1
          test -n "${SMTP_PASSWORD:-}" || { echo 'Chybí NEWSLETTER_SMTP_PASSWORD.'; exit 19; }

          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"
              selected="$name"
              break
            fi
          done
          test -n "$selected" || { echo 'Není dostupný žádný SSH klíč.'; exit 20; }
          chmod 600 "$RUNNER_TEMP/key"
          echo "Použit dostupný SSH secret: $selected"

          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          from email.utils import formatdate, make_msgid

          password = os.environ['SMTP_PASSWORD']
          context = ssl.create_default_context()
          with smtplib.SMTP_SSL('smtp.seznam.cz', 465, timeout=25, context=context) as smtp:
              smtp.login('info@nasekadan.cz', password)
              msg = EmailMessage()
              msg['From'] = 'info@nasekadan.cz'
              msg['To'] = 'petrkotab@seznam.cz'
              msg['Subject'] = 'Kontrola doručení – Naše Kadaň statistiky'
              msg['Date'] = formatdate(localtime=False)
              msg['Message-ID'] = make_msgid(domain='nasekadan.cz')
              msg.set_content('Odesílání ze statistik bylo opraveno. Samostatný obnovovací odkaz následuje v dalším e-mailu.')
              refused = smtp.send_message(msg, from_addr='info@nasekadan.cz', to_addrs=['petrkotab@seznam.cz'])
              if refused:
                  raise SystemExit(f'SMTP odmítlo příjemce: {list(refused)}')
          print('Funkční účet info@nasekadan.cz: SMTP přijalo kontrolní e-mail bez odmítnutého příjemce.')
          PY

          cat > "$RUNNER_TEMP/stats-email.env" <<EOF
          SMTP_HOST=smtp.seznam.cz
          SMTP_PORT=465
          SMTP_USER=info@nasekadan.cz
          SMTP_PASSWORD=$SMTP_PASSWORD
          SMTP_TLS=ssl
          NEWSLETTER_FROM=info@nasekadan.cz
          SMTP_FROM=info@nasekadan.cz
          EMAIL_FROM=info@nasekadan.cz
          RESET_EMAIL=petrkotab@seznam.cz
          ADMIN_EMAIL=petrkotab@seznam.cz
          EOF
          chmod 600 "$RUNNER_TEMP/stats-email.env"

          scp -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/stats-email.env" ubuntu@57.129.43.215:/tmp/nasekadan-stats-email.env

          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo -n true
          sudo install -o root -g root -m 0600 /tmp/nasekadan-stats-email.env /etc/nasekadan-stats-email.env
          rm -f /tmp/nasekadan-stats-email.env
          sudo systemctl daemon-reload
          sudo systemctl restart nasekadan-stats-web.service
          sudo systemctl is-active --quiet nasekadan-stats-web.service
          for _ in $(seq 1 30); do
            curl -fsS --max-time 3 http://127.0.0.1:3225/healthz >/tmp/stats-health.json 2>/dev/null && break
            sleep 0.5
          done

          url='https://nasekadan.cz/statistiky/zapomenute-heslo'
          curl -kfsS --max-time 15 --resolve nasekadan.cz:443:127.0.0.1 "$url" -o /tmp/reset-get.html
          status="$(curl -kisS -L --max-time 45 --resolve nasekadan.cz:443:127.0.0.1 \
            -H 'Content-Type: application/x-www-form-urlencoded' --data '' "$url" \
            -o /tmp/reset-post.html -w '%{http_code}' || true)"
          echo "HTTP reset: $status"
          [ "$status" = 200 ] || exit 31
          if grep -Eqi 'nepodařilo odeslat|zkontrolujte nastavení odesílací schránky' /tmp/reset-post.html; then
            echo 'Aplikace stále hlásí chybu odeslání.'
            sudo journalctl -u nasekadan-stats-web.service --since '-3 minutes' --no-pager -n 160 \
              | sed -E 's/(SMTP_PASSWORD|password|heslo)=?[^ ]*/\1=[REDACTED]/Ig; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[EMAIL]/g'
            exit 32
          fi
          grep -Eqi 'odeslán|odeslali|obnovovací odkaz|zkontrolujte.{0,40}(schránku|e-mail|email)' /tmp/reset-post.html || exit 33
          rm -f /tmp/reset-get.html /tmp/reset-post.html /tmp/stats-health.json
          echo 'HOTOVO: kontrolní e-mail i nový reset byly vyžádány na petrkotab@seznam.cz přes info@nasekadan.cz.'
          REMOTE

      - name: Zapsat skutečný výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.repair.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs'); let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/result.txt`, 'utf8'); } catch {}
            const ok = process.env.OUTCOME === 'success';
            const issue = await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: `[STATISTIKY RESET DORUČENÍ] ${ok ? 'Opraveno' : 'Selhalo'} ${new Date().toISOString()}`,
              body: [`- Commit: \`${process.env.SOURCE_SHA}\``, `- Výsledek: **${process.env.OUTCOME}**`, '', '```text', log.slice(-22000).replace(/```/g, '---'), '```'].join('\n')});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.data.number, state: 'closed', state_reason: 'completed'});

      - name: Vyhodnotit
        if: steps.repair.outcome != 'success'
        run: exit 1
