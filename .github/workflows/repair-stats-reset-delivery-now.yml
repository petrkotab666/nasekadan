name: Okamžitě opravit skutečné doručení resetu statistik

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-stats-reset-delivery-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-stats-reset-delivery-now
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Opravit odesílací účet a vyžádat nový reset
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          umask 077
          test -n "${OVH_KEY:-}" || { echo 'Chybí OVH_SSH_PRIVATE_KEY.' >&2; exit 20; }
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"

          ssh -i "$RUNNER_TEMP/key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE' | tee "$RUNNER_TEMP/result.txt"
          set -Eeuo pipefail
          sudo -n true

          # Použijeme dříve živě ověřený vlastnický SMTP účet. Konfiguraci
          # newsletteru neměníme; opravujeme jen odesílání resetu statistik.
          sudo python3 - <<'PY'
          from __future__ import annotations
          import os, shlex, smtplib, ssl, tempfile
          from email.message import EmailMessage
          from email.utils import formatdate, make_msgid
          from pathlib import Path

          source = Path('/etc/lastminuteslevy-alerts.env')
          target = Path('/etc/nasekadan-stats-email.env')
          if not source.exists():
              raise SystemExit('Chybí dříve funkční vlastnická SMTP konfigurace.')

          def parse_env(path: Path) -> dict[str, str]:
              result: dict[str, str] = {}
              for raw in path.read_text(encoding='utf-8', errors='strict').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  if line.startswith('export '):
                      line = line[7:].lstrip()
                  key, value = line.split('=', 1)
                  value = value.strip()
                  try:
                      parts = shlex.split(value, posix=True)
                      value = parts[0] if len(parts) == 1 else value
                  except Exception:
                      value = value.strip('"').strip("'")
                  result[key.strip()] = value
              return result

          env = parse_env(source)
          host = env.get('SMTP_HOST') or env.get('MAIL_HOST')
          user = env.get('SMTP_USER') or env.get('SMTP_USERNAME') or env.get('MAIL_USER')
          password = env.get('SMTP_PASSWORD') or env.get('SMTP_PASS') or env.get('MAIL_PASSWORD')
          port = int(env.get('SMTP_PORT') or env.get('MAIL_PORT') or '465')
          mode = (env.get('SMTP_TLS') or env.get('SMTP_SECURITY') or 'ssl').lower()
          if not (host and user and password):
              raise SystemExit('Vlastnická SMTP konfigurace není úplná.')
          if user.strip().lower() != 'petrkotab@seznam.cz':
              raise SystemExit('Vlastnický SMTP účet není očekávaný účet.')

          values = {
              'SMTP_HOST': host,
              'SMTP_PORT': str(port),
              'SMTP_USER': user,
              'SMTP_PASSWORD': password,
              'SMTP_TLS': mode,
              'NEWSLETTER_FROM': user,
              'SMTP_FROM': user,
              'EMAIL_FROM': user,
              'RESET_EMAIL': 'petrkotab@seznam.cz',
              'ADMIN_EMAIL': 'petrkotab@seznam.cz',
          }
          fd, tmp_name = tempfile.mkstemp(prefix='.nasekadan-stats-email.', dir='/etc', text=True)
          try:
              with os.fdopen(fd, 'w', encoding='utf-8') as handle:
                  for key, value in values.items():
                      escaped = value.replace('\\', '\\\\').replace('"', '\\"')
                      handle.write(f'{key}="{escaped}"\n')
              os.chmod(tmp_name, 0o600)
              os.chown(tmp_name, 0, 0)
              os.replace(tmp_name, target)
          finally:
              try: os.unlink(tmp_name)
              except FileNotFoundError: pass

          context = ssl.create_default_context()
          if mode == 'ssl' or port == 465:
              smtp = smtplib.SMTP_SSL(host, port, timeout=25, context=context)
          else:
              smtp = smtplib.SMTP(host, port, timeout=25)
              smtp.ehlo()
              if mode in {'starttls', 'tls', 'true', '1'} or port == 587:
                  smtp.starttls(context=context)
                  smtp.ehlo()
          with smtp:
              smtp.login(user, password)
              message = EmailMessage()
              message['From'] = user
              message['To'] = 'petrkotab@seznam.cz'
              message['Subject'] = 'Kontrola doručení – Naše Kadaň statistiky'
              message['Date'] = formatdate(localtime=False)
              message['Message-ID'] = make_msgid(domain='nasekadan.cz')
              message.set_content('Odesílání ze statistik bylo znovu nastaveno. Samostatný obnovovací odkaz následuje v dalším e-mailu.')
              refused = smtp.send_message(message, from_addr=user, to_addrs=['petrkotab@seznam.cz'])
              if refused:
                  raise SystemExit(f'SMTP odmítlo příjemce: {list(refused)}')
          print('Přímý kontrolní e-mail byl SMTP serverem přijat bez odmítnutého příjemce.')
          PY

          sudo systemctl daemon-reload
          sudo systemctl restart nasekadan-stats-web.service
          sudo systemctl is-active --quiet nasekadan-stats-web.service
          for _ in $(seq 1 30); do
            curl -fsS --max-time 3 http://127.0.0.1:3225/healthz >/tmp/stats-health.json 2>/dev/null && break
            sleep 0.5
          done

          url='https://nasekadan.cz/statistiky/zapomenute-heslo'
          curl -kfsS --max-time 15 --resolve nasekadan.cz:443:127.0.0.1 "$url" -o /tmp/reset-get.html
          status="$(curl -kisS -L --max-time 45 --resolve nasekadan.cz:443:127.0.0.1 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data '' "$url" -o /tmp/reset-post.html -w '%{http_code}' || true)"
          echo "HTTP reset: $status"
          if [ "$status" != 200 ]; then
            echo 'Reset nevrátil HTTP 200.' >&2
            exit 31
          fi
          if grep -Eqi 'nepodařilo odeslat|zkontrolujte nastavení odesílací schránky' /tmp/reset-post.html; then
            echo 'Aplikace stále hlásí chybu odeslání.' >&2
            sudo journalctl -u nasekadan-stats-web.service --since '-3 minutes' --no-pager -n 120 \
              | sed -E 's/(SMTP_PASSWORD|password|heslo)=?[^ ]*/\1=[REDACTED]/Ig; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[EMAIL]/g' >&2
            exit 32
          fi
          grep -Eqi 'odeslán|odeslali|obnovovací odkaz|zkontrolujte.{0,40}(schránku|e-mail|email)' /tmp/reset-post.html || {
            echo 'Odpověď aplikace nepotvrdila reset.' >&2
            sed -E 's/<[^>]+>/ /g' /tmp/reset-post.html | tr -s ' ' | head -c 1600 >&2
            exit 33
          }
          rm -f /tmp/reset-get.html /tmp/reset-post.html /tmp/stats-health.json
          echo 'HOTOVO: služba byla restartována, kontrolní e-mail i nový reset byly vyžádány na petrkotab@seznam.cz.'
          REMOTE

      - name: Zapsat skutečný výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.repair.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/result.txt`, 'utf8'); } catch {}
            const ok = process.env.OUTCOME === 'success';
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[STATISTIKY RESET DORUČENÍ] ${ok ? 'Opraveno' : 'Selhalo'} ${new Date().toISOString()}`,
              body: [`- Commit: \`${process.env.SOURCE_SHA}\``, `- Výsledek: **${process.env.OUTCOME}**`, '', '```text', log.slice(-22000).replace(/```/g, '---'), '```'].join('\n')
            });
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.data.number, state: 'closed', state_reason: 'completed'});

      - name: Vyhodnotit
        if: steps.repair.outcome != 'success'
        run: exit 1
