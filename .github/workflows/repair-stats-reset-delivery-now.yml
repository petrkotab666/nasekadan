name: Okamžitě opravit skutečné doručení resetu statistik

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-stats-reset-delivery-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-stats-reset-delivery-now
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Opravit odesílací účet a vyžádat nový reset
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          exec > >(tee "$RUNNER_TEMP/result.txt") 2>&1

          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"
              selected="$name"
              break
            fi
          done
          test -n "$selected" || { echo 'Není dostupný žádný SSH klíč.'; exit 20; }
          chmod 600 "$RUNNER_TEMP/key"
          echo "Použit dostupný SSH secret: $selected"

          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo -n true

          sudo python3 - <<'PY'
          from __future__ import annotations
          import os, shlex, smtplib, ssl, tempfile
          from email.message import EmailMessage
          from email.utils import formatdate, make_msgid
          from pathlib import Path

          source = Path('/etc/nasekadan-newsletter.env')
          target = Path('/etc/nasekadan-stats-email.env')
          if not source.exists():
              raise SystemExit('Chybí serverová SMTP konfigurace newsletteru.')

          def parse_env(path: Path) -> dict[str, str]:
              result: dict[str, str] = {}
              for raw in path.read_text(encoding='utf-8', errors='strict').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  if line.startswith('export '): line = line[7:].lstrip()
                  key, value = line.split('=', 1)
                  value = value.strip()
                  try:
                      parts = shlex.split(value, posix=True)
                      value = parts[0] if len(parts) == 1 else value
                  except Exception:
                      value = value.strip('"').strip("'")
                  result[key.strip()] = value
              return result

          env = parse_env(source)
          host = env.get('SMTP_HOST') or env.get('MAIL_HOST')
          user = env.get('SMTP_USER') or env.get('SMTP_USERNAME') or env.get('MAIL_USER')
          password = env.get('SMTP_PASSWORD') or env.get('SMTP_PASS') or env.get('MAIL_PASSWORD')
          port = int(env.get('SMTP_PORT') or env.get('MAIL_PORT') or '465')
          mode = (env.get('SMTP_TLS') or env.get('SMTP_SECURITY') or 'ssl').lower()
          sender = env.get('NEWSLETTER_FROM') or env.get('SMTP_FROM') or user
          if not (host and user and password):
              raise SystemExit('Serverová SMTP konfigurace newsletteru není úplná.')

          context = ssl.create_default_context()
          if mode == 'ssl' or port == 465:
              client = smtplib.SMTP_SSL(host, port, timeout=25, context=context)
          else:
              client = smtplib.SMTP(host, port, timeout=25); client.ehlo()
              if mode in {'starttls','tls','true','1'} or port == 587:
                  client.starttls(context=context); client.ehlo()
          with client:
              client.login(user, password)
              msg = EmailMessage()
              msg['From'] = sender
              msg['To'] = 'petrkotab@seznam.cz'
              msg['Subject'] = 'Kontrola doručení – Naše Kadaň statistiky'
              msg['Date'] = formatdate(localtime=False)
              msg['Message-ID'] = make_msgid(domain='nasekadan.cz')
              msg.set_content('Odesílání ze statistik bylo znovu nastaveno. Samostatný obnovovací odkaz následuje v dalším e-mailu.')
              refused = client.send_message(msg, from_addr=user, to_addrs=['petrkotab@seznam.cz'])
              if refused:
                  raise SystemExit(f'SMTP odmítlo příjemce: {list(refused)}')
          print(f'Serverová schránka {user}: SMTP přijalo kontrolní e-mail bez odmítnutého příjemce.')

          values = {
              'SMTP_HOST': host, 'SMTP_PORT': str(port), 'SMTP_USER': user,
              'SMTP_PASSWORD': password, 'SMTP_TLS': mode,
              'NEWSLETTER_FROM': sender, 'SMTP_FROM': sender, 'EMAIL_FROM': sender,
              'RESET_EMAIL': 'petrkotab@seznam.cz', 'ADMIN_EMAIL': 'petrkotab@seznam.cz',
          }
          fd, tmp_name = tempfile.mkstemp(prefix='.nasekadan-stats-email.', dir='/etc', text=True)
          try:
              with os.fdopen(fd, 'w', encoding='utf-8') as handle:
                  for key, value in values.items():
                      escaped = value.replace('\\', '\\\\').replace('"', '\\"')
                      handle.write(f'{key}="{escaped}"\n')
              os.chmod(tmp_name, 0o600); os.chown(tmp_name, 0, 0); os.replace(tmp_name, target)
          finally:
              try: os.unlink(tmp_name)
              except FileNotFoundError: pass
          print('Stejná živě ověřená konfigurace byla zapsána pouze pro statistiky.')
          PY

          sudo systemctl daemon-reload
          sudo systemctl restart nasekadan-stats-web.service
          sudo systemctl is-active --quiet nasekadan-stats-web.service
          for _ in $(seq 1 30); do
            curl -fsS --max-time 3 http://127.0.0.1:3225/healthz >/tmp/stats-health.json 2>/dev/null && break
            sleep 0.5
          done

          url='https://nasekadan.cz/statistiky/zapomenute-heslo'
          curl -kfsS --max-time 15 --resolve nasekadan.cz:443:127.0.0.1 "$url" -o /tmp/reset-get.html
          status="$(curl -kisS -L --max-time 45 --resolve nasekadan.cz:443:127.0.0.1 \
            -H 'Content-Type: application/x-www-form-urlencoded' --data '' "$url" \
            -o /tmp/reset-post.html -w '%{http_code}' || true)"
          echo "HTTP reset: $status"
          [ "$status" = 200 ] || exit 31
          if grep -Eqi 'nepodařilo odeslat|zkontrolujte nastavení odesílací schránky' /tmp/reset-post.html; then
            echo 'Aplikace stále hlásí chybu odeslání.'
            sudo journalctl -u nasekadan-stats-web.service --since '-3 minutes' --no-pager -n 160 \
              | sed -E 's/(SMTP_PASSWORD|password|heslo)=?[^ ]*/\1=[REDACTED]/Ig; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[EMAIL]/g'
            exit 32
          fi
          grep -Eqi 'odeslán|odeslali|obnovovací odkaz|zkontrolujte.{0,40}(schránku|e-mail|email)' /tmp/reset-post.html || exit 33
          rm -f /tmp/reset-get.html /tmp/reset-post.html /tmp/stats-health.json
          echo 'HOTOVO: kontrolní e-mail i nový reset byly vyžádány na petrkotab@seznam.cz.'
          REMOTE

      - name: Zapsat skutečný výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.repair.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs'); let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/result.txt`, 'utf8'); } catch {}
            const ok = process.env.OUTCOME === 'success';
            const issue = await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: `[STATISTIKY RESET DORUČENÍ] ${ok ? 'Opraveno' : 'Selhalo'} ${new Date().toISOString()}`,
              body: [`- Commit: \`${process.env.SOURCE_SHA}\``, `- Výsledek: **${process.env.OUTCOME}**`, '', '```text', log.slice(-22000).replace(/```/g, '---'), '```'].join('\n')});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.data.number, state: 'closed', state_reason: 'completed'});

      - name: Vyhodnotit
        if: steps.repair.outcome != 'success'
        run: exit 1
