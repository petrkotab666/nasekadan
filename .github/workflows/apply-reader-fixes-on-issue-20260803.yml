name: Opravit text II/225 a titulku na 14 článků

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: reader-fixes-20260803
  cancel-in-progress: false

env:
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  ARTICLE: clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html
  PUBLIC_URL: https://nasekadan.cz/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html

jobs:
  apply:
    if: github.event.issue.title == '[reader-fixes-20260803] deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit text a vygenerovat titulku
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_reader_fixes_20260803.py
          python3 scripts/enforce_article_visibility.py
          ! grep -Fqi 'zmatek' "$ARTICLE"
          ! grep -Fqi 'zmatek' scripts/publish_zatec_kadan_prejezd_20260803.py
          grep -Fq 'Druhý přejezd má vlastní termín' "$ARTICLE"
          grep -Fq 'Jde o dvě samostatné uzavírky na různých místech.' "$ARTICLE"
          grep -Fq 'HOME_TOTAL = 14' scripts/enforce_article_visibility.py
          grep -Fq 'PAGE_SIZE = 12' scripts/enforce_article_visibility.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          home = Path('index.html').read_text(encoding='utf-8')
          grid = home.split('<div class="article-list">', 1)[1].split('<p class="archive-note">', 1)[0]
          count = len(re.findall(r'data-auto-article=', grid))
          assert count == 12, f'Na titulce má být 12 karet pod dvěma zvýrazněnými články, nalezeno {count}.'
          assert 'Na titulní straně je 14 nejnovějších článků.' in home
          pages = [Path('clanky/index.html'), *sorted(Path('clanky').glob('strana-*.html'))]
          for page in pages:
              cards = len(re.findall(r'data-auto-article=', page.read_text(encoding='utf-8')))
              assert 1 <= cards <= 12, (page, cards)
          PY

      - name: Uložit opravy do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň opravný automat'
          git config user.email 'info@nasekadan.cz'
          for attempt in 1 2 3 4 5; do
            git add -A -- \
              "$ARTICLE" \
              scripts/publish_zatec_kadan_prejezd_20260803.py \
              scripts/enforce_article_visibility.py \
              .github/workflows/paginate-articles-12-per-page.yml \
              index.html sitemap.xml clanky
            if git diff --cached --quiet; then
              echo 'Opravy už jsou v main.'
              break
            fi
            git commit -m 'Opravit formulace II/225 a zobrazit 14 článků na titulce'
            if git push origin HEAD:main; then
              break
            fi
            [[ "$attempt" == 5 ]] && exit 1
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/apply_reader_fixes_20260803.py
            python3 scripts/enforce_article_visibility.py
            sleep $((attempt * 6))
          done
          git fetch origin main
          git reset --hard origin/main
          ! grep -Fqi 'zmatek' "$ARTICLE"
          grep -Fq 'HOME_TOTAL = 14' scripts/enforce_article_visibility.py

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit článek, titulku a archiv
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          bundle="$RUNNER_TEMP/nk-reader-fixes"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky"
          cp "$ARTICLE" "$bundle/clanky/"
          cp index.html sitemap.xml "$bundle/"
          cp clanky/index.html "$bundle/clanky/"
          cp clanky/strana-*.html "$bundle/clanky/"
          printf 'source=%s\ndeployed_at=%s\ndeployer=reader-fixes-20260803\n' "$sha" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$bundle/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-reader-fixes
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/nk-reader-fixes
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 "$src/index.html" /var/www/nasekadan/index.html
          sudo install -m 0644 "$src/sitemap.xml" /var/www/nasekadan/sitemap.xml
          sudo install -m 0644 "$src/deployment-health.txt" /var/www/nasekadan/deployment-health.txt
          sudo install -m 0644 "$src/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html" /var/www/nasekadan/clanky/
          sudo install -m 0644 "$src/clanky/index.html" /var/www/nasekadan/clanky/index.html
          sudo find /var/www/nasekadan/clanky -maxdepth 1 -type f -name 'strana-*.html' -delete
          for file in "$src"/clanky/strana-*.html; do sudo install -m 0644 "$file" /var/www/nasekadan/clanky/; done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky
            sudo docker cp "$src/index.html" nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp "$src/sitemap.xml" nasekadan-web:/usr/share/nginx/html/sitemap.xml
            sudo docker cp "$src/deployment-health.txt" nasekadan-web:/usr/share/nginx/html/deployment-health.txt
            sudo docker cp "$src/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html" nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$src/clanky/index.html" nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker exec nasekadan-web sh -c 'rm -f /usr/share/nginx/html/clanky/strana-*.html'
            for file in "$src"/clanky/strana-*.html; do sudo docker cp "$file" "nasekadan-web:/usr/share/nginx/html/clanky/$(basename "$file")"; done
          fi
          rm -rf "$src"
          REMOTE

      - name: Veřejně ověřit výsledek
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 25); do
            article="$(curl -4 -kfsS --max-time 25 "${PUBLIC_URL}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?v=${stamp}-${attempt}" 2>/dev/null || true)"
            if ARTICLE="$article" HOME="$home" HEALTH="$health" SHA="$sha" python3 - <<'PY'
          import os, re
          article = os.environ['ARTICLE']
          home = os.environ['HOME']
          health = os.environ['HEALTH']
          assert 'zmatek' not in article.lower()
          assert 'Druhý přejezd má vlastní termín' in article
          assert 'Jde o dvě samostatné uzavírky na různých místech.' in article
          assert 'Vozidla do 3,5 tuny' in article
          grid = home.split('<div class="article-list">', 1)[1].split('<p class="archive-note">', 1)[0]
          assert len(re.findall(r'data-auto-article=', grid)) == 12
          assert 'Na titulní straně je 14 nejnovějších článků.' in home
          assert f"source={os.environ['SHA']}" in health
          PY
            then
              exit 0
            fi
            sleep 8
          done
          exit 1

      - name: Uzavřít spouštěcí issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body 'Hotovo: článek neobsahuje formulace o zmatku, titulka zobrazuje 14 článků celkem a veřejný web byl ověřen.'
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
