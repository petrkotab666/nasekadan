name: Nasadit funkční ankety s viditelnými výsledky

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/poll-system-v2-cloud-trigger.txt'
      - '.github/workflows/deploy-poll-system-v2-cloud.yml'
      - 'scripts/install_poll_system_v2.py'
      - 'scripts/test_poll_system_v2.py'
      - 'scripts/prepare_poll_cloud_deploy.py'

permissions:
  contents: write
  issues: write

concurrency:
  group: deploy-poll-system-v2-cloud
  cancel-in-progress: false

env:
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  ARTICLE: clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
  POLL_ID: smr-tusimice-2026
  VERSION: 20260801-poll-system-v2

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Načíst aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit databázovou anketu a zrušit starý kolizní harmonogram
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install_poll_system_v2.py
          python3 scripts/prepare_poll_cloud_deploy.py
          python3 -m py_compile \
            newsletter/server.py \
            scripts/install_poll_system_v2.py \
            scripts/test_poll_system_v2.py \
            scripts/prepare_greenery_publication_20260801.py
          python3 scripts/test_poll_system_v2.py
          grep -Fq '# BEGIN POLL_RESULTS_API' newsletter/server.py
          grep -Fq '/api/newsletter/poll/vote' site.js
          grep -Fq '/api/newsletter/poll/results' site.js
          grep -Fq 'Průběžné výsledky' site.js
          grep -Fq 'poll-result-value' site.js
          grep -Fq "/site.js?v=${VERSION}" "$ARTICLE"
          ! grep -Fq '/api/analytics/pageview' "$ARTICLE"
          grep -Fq 'POLL_SYSTEM_V2' scripts/prepare_greenery_publication_20260801.py
          grep -Fq 'POLL_V2_SUPERSEDED' .github/workflows/publish-greenery-2026-08-01-1100-v2.yml

      - name: Uložit opravu do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – ankety'
          git config user.email 'info@nasekadan.cz'
          git add \
            newsletter/server.py site.js "$ARTICLE" \
            .github/drafts/jaderne-tusimice-smr-voda-doprava-eia-2026.html \
            .github/workflows/publish-greenery-2026-08-01-1100-v2.yml \
            scripts/install_poll_system_v2.py scripts/test_poll_system_v2.py \
            scripts/prepare_poll_cloud_deploy.py scripts/enable_poll_results.py \
            scripts/deploy_poll_results.sh scripts/prepare_greenery_publication_20260801.py
          if ! git diff --cached --quiet; then
            git commit -m 'Zapnout databázové ankety s veřejným sčítáním [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 5 ]] && exit 1
              sleep $((attempt * 5))
            done
          fi
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/install_poll_system_v2.py
          python3 scripts/test_poll_system_v2.py

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit server, JavaScript a opravený článek přímo na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-poll-system-v2"
          rm -rf "$bundle"
          mkdir -p "$bundle/newsletter" "$bundle/clanky"
          cp newsletter/server.py "$bundle/newsletter/server.py"
          cp site.js "$bundle/site.js"
          cp "$ARTICLE" "$bundle/clanky/"

          for attempt in 1 2 3; do
            if scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r \
              "$bundle" ubuntu@57.129.43.215:/tmp/nk-poll-system-v2; then
              break
            fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep $((attempt * 8))
          done

          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /opt/nasekadan/newsletter /var/www/nasekadan/clanky
          sudo install -m 0644 /tmp/nk-poll-system-v2/newsletter/server.py /opt/nasekadan/newsletter/server.py
          sudo install -m 0644 /tmp/nk-poll-system-v2/site.js /var/www/nasekadan/site.js
          sudo install -m 0644 /tmp/nk-poll-system-v2/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html /var/www/nasekadan/clanky/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-poll-system-v2/site.js nasekadan-web:/usr/share/nginx/html/site.js
            sudo docker cp /tmp/nk-poll-system-v2/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
          fi
          sudo systemctl restart nasekadan-newsletter.service
          for attempt in $(seq 1 25); do
            if curl -fsS --max-time 4 http://127.0.0.1:8765/health >/dev/null; then break; fi
            if [[ "$attempt" == 25 ]]; then
              sudo journalctl -u nasekadan-newsletter.service -n 120 --no-pager
              exit 1
            fi
            sleep 2
          done
          sudo systemctl is-active --quiet nasekadan-newsletter.service
          grep -Fq '# BEGIN POLL_RESULTS_API' /opt/nasekadan/newsletter/server.py
          grep -Fq 'Průběžné výsledky' /var/www/nasekadan/site.js
          grep -Fq '/site.js?v=20260801-poll-system-v2' /var/www/nasekadan/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
          rm -rf /tmp/nk-poll-system-v2
          REMOTE

      - name: Veřejně otestovat uložení hlasu, zákaz duplicity a viditelné počítání
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          test_poll="healthcheck-${GITHUB_RUN_ID}-$(date +%s)"
          article_url="https://nasekadan.cz/${ARTICLE}"
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$browser" ]] || { echo 'Na runneru chybí prohlížeč pro skutečný DOM test.' >&2; exit 1; }

          for attempt in $(seq 1 24); do
            js="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/site.js?v=${stamp}-${attempt}" 2>/dev/null || true)"
            article="$(curl -4 -kfsS --max-time 25 "${article_url}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            actual="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/api/newsletter/poll/results?poll=${POLL_ID}&t=${stamp}-${attempt}" 2>/dev/null || true)"
            jar="$RUNNER_TEMP/poll-cookie.txt"
            rm -f "$jar"
            first="$(curl -4 -kfsS --max-time 25 -c "$jar" -A 'NaseKadan-Poll-Test-A' -X POST \
              'https://nasekadan.cz/api/newsletter/poll/vote' -H 'Content-Type: application/json' \
              --data "{\"pollId\":\"${test_poll}\",\"choice\":\"ano\"}" 2>/dev/null || true)"
            second="$(curl -4 -kfsS --max-time 25 -b "$jar" -A 'NaseKadan-Poll-Test-B' -X POST \
              'https://nasekadan.cz/api/newsletter/poll/vote' -H 'Content-Type: application/json' \
              --data "{\"pollId\":\"${test_poll}\",\"choice\":\"ne\"}" 2>/dev/null || true)"
            retained="$(curl -4 -kfsS --max-time 25 -b "$jar" \
              "https://nasekadan.cz/api/newsletter/poll/results?poll=${test_poll}&t=${stamp}-${attempt}" 2>/dev/null || true)"

            if JS="$js" ARTICLE_HTML="$article" ACTUAL="$actual" FIRST="$first" SECOND="$second" RETAINED="$retained" python3 - <<'PY'
          import json, os, sys
          try:
              actual=json.loads(os.environ['ACTUAL'])
              first=json.loads(os.environ['FIRST'])
              second=json.loads(os.environ['SECOND'])
              retained=json.loads(os.environ['RETAINED'])
          except Exception:
              raise SystemExit(1)
          checks=[
              'Průběžné výsledky' in os.environ['JS'],
              'poll-result-value' in os.environ['JS'],
              '/api/newsletter/poll/vote' in os.environ['JS'],
              '/api/newsletter/poll/results' in os.environ['JS'],
              '/site.js?v=20260801-poll-system-v2' in os.environ['ARTICLE_HTML'],
              '/api/analytics/pageview' not in os.environ['ARTICLE_HTML'],
              actual.get('ok') is True and isinstance(actual.get('counts'),dict) and isinstance(actual.get('percentages'),dict),
              first.get('ok') is True and first.get('accepted') is True and first.get('selected')=='ano' and first.get('total')==1,
              second.get('ok') is True and second.get('accepted') is False and second.get('selected')=='ano' and second.get('total')==1,
              retained.get('ok') is True and retained.get('selected')=='ano' and retained.get('total')==1,
              retained.get('counts',{}).get('ano')==1 and retained.get('percentages',{}).get('ano')==100.0,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then
              "$browser" --headless=new --no-sandbox --disable-gpu --ignore-certificate-errors \
                --virtual-time-budget=15000 --dump-dom "${article_url}?poll_dom=${stamp}-${attempt}" \
                > "$RUNNER_TEMP/poll-dom.html" 2>/dev/null || true
              if grep -Fq 'Průběžné výsledky' "$RUNNER_TEMP/poll-dom.html" \
                && grep -Eq '[0-9]+ hlas(ů|y)? celkem' "$RUNNER_TEMP/poll-dom.html" \
                && grep -Fq 'poll-result-value' "$RUNNER_TEMP/poll-dom.html"; then
                ACTUAL="$actual" FIRST="$first" SECOND="$second" RETAINED="$retained" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload={
              'status':'passed',
              'checkedAtUtc':datetime.now(timezone.utc).isoformat(),
              'publicArticle':'https://nasekadan.cz/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html',
              'version':'20260801-poll-system-v2',
              'apiResults':json.loads(os.environ['ACTUAL']),
              'syntheticFirstVote':json.loads(os.environ['FIRST']),
              'syntheticDuplicateVote':json.loads(os.environ['SECOND']),
              'syntheticReload':json.loads(os.environ['RETAINED']),
              'browserDomVisibleCounts':True,
          }
          Path('/tmp/poll-system-v2-live-status.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
                echo 'poll_ok=true' >> "$GITHUB_OUTPUT"
                echo 'HOTOVO: anketa ukládá hlas, blokuje duplicitu a v prohlížeči ukazuje počty i procenta.'
                exit 0
              fi
            fi
            sleep 6
          done
          echo 'poll_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Zapsat ověřený stav a výstrahu jen při trvající chybě
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const fs=require('fs');
            const ok=process.env.VERIFY_OUTCOME==='success';
            const path='.github/poll-system-v2-live-status.json';
            let payload;
            if(ok && fs.existsSync('/tmp/poll-system-v2-live-status.json')){
              payload=JSON.parse(fs.readFileSync('/tmp/poll-system-v2-live-status.json','utf8'));
              payload.runId=context.runId;
              payload.sourceSha=context.sha;
              payload.serverDeploy=process.env.DEPLOY_OUTCOME;
            }else{
              payload={status:'failed',checkedAtUtc:new Date().toISOString(),runId:context.runId,sourceSha:context.sha,serverDeploy:process.env.DEPLOY_OUTCOME||'skipped',publicVerification:process.env.VERIFY_OUTCOME||'skipped'};
            }
            const content=Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64');
            let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat ověření funkčních anket: ${payload.status} [skip ci]`,content,...(sha?{sha}:{})});

            const title='Ankety Naše Kadaň neukládají nebo nezobrazují hlasy';
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=issues.find(issue=>issue.title===title);
            if(ok && existing){await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed'});}
            if(!ok && !existing){await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body:`Cloudové nasazení ankety nebylo veřejně potvrzeno.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});}
