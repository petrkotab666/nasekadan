name: Jednotný monitoring Kadaňska – denní dokumenty

on:
  workflow_dispatch:
  schedule:
    - cron: '47 2 * * *'
  push:
    branches: [main]
    paths:
      - 'data/organizations.json'
      - 'data/city-sources.json'
      - 'data/kadansko-extra-sources.json'
      - 'data/national-kadan-sources.json'
      - 'data/monitoring-supplemental-sources.json'
      - 'scripts/build_monitoring_registry.py'
      - 'scripts/monitor_kadansko_unified.py'
      - 'scripts/publish_monitoring_alerts.py'
      - 'scripts/commit_monitoring_state.sh'
      - '.github/workflows/monitoring-kadansko-daily.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: unified-monitoring-kadansko-daily
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sestavit jednotný registr
        run: python3 scripts/build_monitoring_registry.py

      - name: Zkontrolovat dokumenty, úřední desky, smlouvy, zakázky, dotace a EIA
        run: |
          python3 scripts/monitor_kadansko_unified.py \
            --mode daily \
            --output "$RUNNER_TEMP/unified-monitoring-daily.json"

      - name: Doručit významné nálezy a denní souhrn
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_monitoring_alerts.py \
            --mode daily \
            --input "$RUNNER_TEMP/unified-monitoring-daily.json"

      - name: Uložit deduplikační stav pouze při změně
        run: bash scripts/commit_monitoring_state.sh daily

      - name: Ověřit úplnost denní vrstvy
        run: |
          python3 - "$RUNNER_TEMP/unified-monitoring-daily.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))['status']
          assert data['sourceCount'] >= 100, data
          assert data['checkedSources'] >= max(75, int(data['sourceCount']*0.60)), data
          coverage=data.get('coverage') or {}
          assert coverage.get('registeredSources',0) >= 110, coverage
          assert len(coverage.get('monitoredMunicipalities') or []) == 19, coverage
          print(data)
          PY
