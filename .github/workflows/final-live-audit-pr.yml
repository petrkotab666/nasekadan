name: Finální read-only audit živého webu

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/final-live-audit.trigger'

permissions:
  contents: read

concurrency:
  group: final-live-audit-pr
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'final-live-audit-20260807'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Určit očekávaný stav aktuálního main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from hashlib import sha256
          from pathlib import Path
          import os,re
          now=datetime.now(timezone.utc)+timedelta(minutes=2)
          items=[]
          for p in Path('clanky').glob('*.html'):
              if p.name=='index.html' or re.fullmatch(r'strana-\d+\.html',p.name): continue
              t=p.read_text(encoding='utf-8',errors='replace')
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',t,re.I): continue
              m=(re.search(r'<meta[^>]+property=["\']article:published_time["\'][^>]+content=["\']([^"\']+)',t,re.I)
                 or re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']article:published_time["\']',t,re.I)
                 or re.search(r'"datePublished"\s*:\s*"([^"]+)"',t))
              if not m: continue
              dt=datetime.fromisoformat(m.group(1).replace('Z','+00:00'))
              if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
              if dt.astimezone(timezone.utc)<=now: items.append((dt,'/clanky/'+p.name))
          items.sort(reverse=True)
          assert len(items)>=2
          imgs=[
            Path('images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp'),
            Path('images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp'),
            Path('images/clanky/eso-market-rafanda/pravidla-platba-kamery-v2.webp'),
          ]
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              f.write(f'EXPECTED_LATEST={items[0][1]}\nEXPECTED_SECOND={items[1][1]}\n')
              for i,p in enumerate(imgs,1):
                  assert p.is_file() and p.stat().st_size>0
                  f.write(f'EXPECTED_SHA{i}={sha256(p.read_bytes()).hexdigest()}\n')
          print('EXPECTED_LATEST',items[0][1])
          print('EXPECTED_SECOND',items[1][1])
          PY

      - name: Porovnat veřejnou produkci bit po bitu
        shell: bash
        run: |
          set -euo pipefail
          base='https://nasekadan.cz'
          success=0
          for attempt in $(seq 1 10); do
            q="final-audit-${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            curl -4 -kfsSL --max-time 35 "$base/?v=$q" -o /tmp/home.html || true
            curl -4 -kfsSL --max-time 35 "$base/clanky/?v=$q" -o /tmp/archive.html || true
            curl -4 -kfsSL --max-time 35 "$base/rss.xml?v=$q" -o /tmp/rss.xml || true
            curl -4 -kfsSL --max-time 35 "$base/clanky/eso-market-rafanda-kadan-24-7.html?v=$q" -o /tmp/rafanda.html || true
            for n in 1 2 3; do rm -f "/tmp/rafanda$n.webp"; done
            c1=$(curl -4 -kfsSL --max-time 35 -o /tmp/rafanda1.webp -w '%{http_code}' "$base/images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp?v=$q" || true)
            c2=$(curl -4 -kfsSL --max-time 35 -o /tmp/rafanda2.webp -w '%{http_code}' "$base/images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp?v=$q" || true)
            c3=$(curl -4 -kfsSL --max-time 35 -o /tmp/rafanda3.webp -w '%{http_code}' "$base/images/clanky/eso-market-rafanda/pravidla-platba-kamery-v2.webp?v=$q" || true)
            s1=$(sha256sum /tmp/rafanda1.webp 2>/dev/null|awk '{print $1}'||true)
            s2=$(sha256sum /tmp/rafanda2.webp 2>/dev/null|awk '{print $1}'||true)
            s3=$(sha256sum /tmp/rafanda3.webp 2>/dev/null|awk '{print $1}'||true)
            if grep -Fq "data-latest-article-href=\"$EXPECTED_LATEST\"" /tmp/home.html \
              && grep -Fq "$EXPECTED_SECOND" /tmp/home.html \
              && grep -Fq "$EXPECTED_LATEST" /tmp/archive.html \
              && grep -Fq "$EXPECTED_SECOND" /tmp/archive.html \
              && grep -Fq "https://nasekadan.cz$EXPECTED_LATEST" /tmp/rss.xml \
              && grep -Fq "https://nasekadan.cz$EXPECTED_SECOND" /tmp/rss.xml \
              && grep -Fq '/images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp' /tmp/rafanda.html \
              && grep -Fq '/images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp' /tmp/rafanda.html \
              && grep -Fq '/images/clanky/eso-market-rafanda/pravidla-platba-kamery-v2.webp' /tmp/rafanda.html \
              && [[ "$c1" == 200 && "$c2" == 200 && "$c3" == 200 ]] \
              && [[ "$s1" == "$EXPECTED_SHA1" && "$s2" == "$EXPECTED_SHA2" && "$s3" == "$EXPECTED_SHA3" ]]; then
              success=1
              echo "LIVE_OK latest=$EXPECTED_LATEST second=$EXPECTED_SECOND"
              echo "RAFANDA_SHA_OK $s1 $s2 $s3"
              break
            fi
            sleep 4
          done
          test "$success" = 1
