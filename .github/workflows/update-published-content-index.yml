name: Aktualizovat kanonickou evidenci publikovaného obsahu

on:
  push:
    branches: [main]
    paths:
      - 'clanky/**.html'
      - 'index.html'
      - 'rss.xml'
      - 'sitemap.xml'
      - 'news-sitemap.xml'
      - 'scripts/build_published_content_index.py'
      - 'scripts/verify_published_article_set.py'
      - '.github/workflows/update-published-content-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-published-content-index
  cancel-in-progress: true

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sestavit kanonický registr proti živému webu
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_published_content_index.py \
            --root . \
            --output data/published-content-index.json \
            --live-base https://nasekadan.cz \
            --require-live
          python3 -m json.tool data/published-content-index.json >/dev/null

      - name: Zapsat registr do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nasekadan-evidence-bot'
          git config user.email 'info@nasekadan.cz'
          git fetch origin main
          git rebase origin/main
          git add data/published-content-index.json
          if git diff --cached --quiet; then
            echo 'Registr beze změny.'
            exit 0
          fi
          git commit -m 'Aktualizovat kanonickou evidenci publikovaných článků [skip ci]'
          git push origin HEAD:main
