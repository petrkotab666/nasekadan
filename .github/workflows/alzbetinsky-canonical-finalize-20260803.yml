name: Kanonicky dokončit publikaci kláštera

on:
  push:
    branches: [main]
    paths:
      - '.github/alzbetinsky-canonical-finalize-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: publish-alzbetinsky-klaster-20260803-canonical-finalize
  cancel-in-progress: false

env:
  ARTICLE_URL: https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Povolit pouze cílový den
        shell: bash
        run: |
          set -euo pipefail
          test "$(date -u +%Y-%m-%d)" = "2026-08-03"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
              break
            fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Spustit na serveru kanonický produkční postup
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

      - name: Ověřit úplný veřejný stav a source commit
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          python3 - "$source_sha" <<'PY'
          import json,sys,time,urllib.request
          source_sha=sys.argv[1]
          base='https://nasekadan.cz'
          rel='/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html'
          checks={
            rel:['Kam odešli poslední pacienti?','data-poll-id="alzbetinsky-klaster-kadan-2026"','Léčebna tbc a respiračních nemocí v Kadani','data-promos data-context="sidebar"'],
            '/':['data-latest-article-href="/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html"',rel],
            '/clanky/':[rel],
            '/rss.xml':[base+rel],
            '/sitemap.xml':[base+rel],
            '/news-sitemap.xml':[base+rel],
            '/deployment-health.txt':['source='+source_sha],
          }
          for path,markers in checks.items():
            last=''
            for attempt in range(15):
              sep='&' if '?' in path else '?'
              try:
                req=urllib.request.Request(base+path+sep+'canonical_finalize='+str(int(time.time()*1000)),headers={'User-Agent':'NaseKadan-Canonical-Finalize/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=25) as r:last=r.read().decode('utf-8','replace')
                if all(m in last for m in markers):break
              except Exception as exc:last=str(exc)
              time.sleep(5+attempt*2)
            else:raise SystemExit(f'{path}: {last[:500]}')
          image=urllib.request.urlopen(base+'/social/alzbetinsky-klaster-kadan-pacienti-20260803.png?canonical=1',timeout=25).read()
          if len(image)<10000:raise SystemExit('Sociální obrázek je neúplný.')
          payload=json.loads(urllib.request.urlopen(base+'/api/newsletter/poll/results?poll=alzbetinsky-klaster-kadan-2026&canonical=1',timeout=25).read().decode('utf-8','replace'))
          if payload.get('ok') is not True:raise SystemExit('Anketa nevrací ok=true.')
          print('Kanonická publikace a source commit souhlasí.')
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Ověřit vykreslený DOM
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          output="$RUNNER_TEMP/alzbetinsky-canonical.dom.html"
          timeout 80s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,1500 --virtual-time-budget=15000 --dump-dom \
            "${ARTICLE_URL}?canonical_render=${GITHUB_RUN_ID}" > "$output"
          grep -Fq 'Kam odešli poslední pacienti?' "$output"
          grep -Fq 'poll-results' "$output"
          grep -Fq 'article-aside-adstream' "$output"
          grep -Eq 'article-aside-ad-|promo-card|article-ad-auto' "$output"
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat definitivní výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OK: ${{ steps.verify.outputs.ok }}
          BROWSER_OK: ${{ steps.browser.outputs.ok }}
        with:
          script: |
            const ok=process.env.VERIFY_OK==='true' && process.env.BROWSER_OK==='true';
            const body=ok
              ? '✅ Definitivní kanonická kontrola prošla. Veřejný deployment-health source odpovídá aktuálnímu main a článek je úplný na všech plochách včetně vykresleného DOM.\n\nhttps://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html'
              : '🚨 Definitivní kanonická kontrola neprošla; issue bylo znovu otevřeno pro zásah.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:545,body});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:545,state:ok?'closed':'open',state_reason:ok?'completed':'reopened'});
