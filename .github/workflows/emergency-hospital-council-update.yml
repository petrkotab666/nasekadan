name: Přímá aktualizace článku o vedení nemocnice

on:
  push:
    branches: [main]
    paths:
      - '.github/emergency-hospital-council-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency-hospital-council-update
  cancel-in-progress: true

jobs:
  update-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE: clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit profesní profil a ÚOHS
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 scripts/update_hospital_marek_uohs_20260730.py
          git config user.name 'Naše Kadaň nouzová aktualizace'
          git config user.email 'info@nasekadan.cz'
          git add "$ARTICLE"
          git commit -m 'Doplnit profesní minulost Pavla Marka a výsledek ÚOHS' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Přepsat živý web a aktivní Docker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          python3 scripts/enforce_article_visibility.py
          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          if [[ -z "$cid" ]]; then cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"; fi
          test -n "$cid"
          files=(
            index.html
            clanky/index.html
            clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html
          )
          for file in "${files[@]}"; do
            sudo install -d -m 0755 "/var/www/nasekadan/$(dirname "$file")"
            sudo install -m 0644 "$file" "/var/www/nasekadan/$file"
            sudo docker exec "$cid" mkdir -p "/usr/share/nginx/html/$(dirname "$file")"
            sudo docker cp "$file" "$cid:/usr/share/nginx/html/$file"
          done
          curl -fsS http://127.0.0.1:3224/clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html | grep -Fq 'Další prověřené okolnosti změny vedení'
          REMOTE

      - name: Veřejně ověřit aktualizaci
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 24); do
            page="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html?marek-uohs=${GITHUB_SHA}-${n}" || true)"
            if grep -Fq 'Pavel Marek odešel z České Lípy dobrovolně při fúzi' <<<"$page" \
              && grep -Fq 'ÚOHS neshledal důvod zasáhnout do zakázky na lůžka' <<<"$page" \
              && grep -Fq '2026-07-30T12:09:00+02:00' <<<"$page"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
