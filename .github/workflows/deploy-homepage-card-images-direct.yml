name: Nasadit náhledové obrázky karet přímo

on:
  push:
    branches: [main]
    paths:
      - '.github/deploy-homepage-card-images-direct-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-homepage-card-images-direct
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit zdrojové karty
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in ('index.html', 'clanky/index.html'):
              text = Path(path).read_text(encoding='utf-8')
              cards = re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?</article>', text, re.I | re.S)
              if len(cards) < 3:
                  raise SystemExit(f'{path}: příliš málo karet')
              for card in cards:
                  visual = re.search(r'<div\b[^>]*class="[^"]*visual[^"]*"[^>]*>.*?</div>', card, re.I | re.S)
                  if not visual or 'background-image:' not in visual.group(0):
                      raise SystemExit(f'{path}: chybí náhledový obrázek')
                  if re.search(r'<strong\b', visual.group(0), re.I):
                      raise SystemExit(f'{path}: zdvojený titulek')
          print('Zdrojové karty jsou v pořádku.')
          PY

      - name: Připravit SSH klíč
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přímo bez dočasného adresáře
        id: deploy
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215)

          "${SSH[@]}" 'sudo -n true && sudo install -d -m 0755 /var/www/nasekadan/clanky'

          cat index.html | "${SSH[@]}" 'sudo tee /var/www/nasekadan/index.html >/dev/null && sudo chmod 0644 /var/www/nasekadan/index.html'
          cat clanky/index.html | "${SSH[@]}" 'sudo tee /var/www/nasekadan/clanky/index.html >/dev/null && sudo chmod 0644 /var/www/nasekadan/clanky/index.html'

          "${SSH[@]}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if sudo docker ps --format '{{.Names}}' | grep -Fxq nasekadan-web; then
            sudo docker cp /var/www/nasekadan/index.html nasekadan-web:/usr/share/nginx/html/index.html || true
            sudo docker cp /var/www/nasekadan/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html || true
          fi
          REMOTE

      - name: Ověřit veřejný web a obrázky
        id: verify
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in $(seq 1 30); do
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/index.html?cardimg=${stamp}-${attempt}" -o /tmp/home.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/index.html?cardimg=${stamp}-${attempt}" -o /tmp/archive.html || true
            if python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def inspect(path):
              text = Path(path).read_text(encoding='utf-8', errors='replace') if Path(path).exists() else ''
              cards = re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?</article>', text, re.I | re.S)
              if len(cards) < 3:
                  return False, []
              urls = []
              for card in cards:
                  visual = re.search(r'<div\b[^>]*class="[^"]*visual[^"]*"[^>]*>.*?</div>', card, re.I | re.S)
                  if not visual or 'background-image:' not in visual.group(0) or re.search(r'<strong\b', visual.group(0), re.I):
                      return False, []
                  m = re.search(r"url\('([^']+)'\)", visual.group(0))
                  if m:
                      urls.append(m.group(1))
              return True, urls[:3]

          home_ok, images = inspect('/tmp/home.html')
          archive_ok, _ = inspect('/tmp/archive.html')
          if not home_ok or not archive_ok or len(images) < 3:
              raise SystemExit(1)
          for image in images:
              url = image if image.startswith('http') else 'https://nasekadan.cz/' + image.lstrip('/')
              subprocess.run(['curl', '-4', '-kfsSI', '--max-time', '20', url], check=True, stdout=subprocess.DEVNULL)
          PY
            then
              echo 'Veřejná titulka i archiv jsou opravené a obrázky odpovídají.'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Zapsat výsledek přímého nasazení
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'homepage-card-images-direct-status.json';
            const ok = process.env.DEPLOY === 'success' && process.env.VERIFY === 'success';
            const status = {
              status: ok ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              server_deploy: process.env.DEPLOY || 'skipped',
              public_verification: process.env.VERIFY || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner:context.repo.owner, repo:context.repo.repo, path, ref:'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner, repo:context.repo.repo, path, branch:'main',
              message:`Zapsat přímé nasazení náhledů: ${status.status}`,
              content, ...(sha ? {sha} : {})
            });
