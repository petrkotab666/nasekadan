name: Přímé nasazení správného hlavního článku

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-deploy-latest-hero-now.yml

permissions:
  contents: write

concurrency:
  group: nasekadan-direct-latest-hero
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit aktuální main na OVH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_key"
          chmod 600 "$RUNNER_TEMP/nasekadan_key"
          SOURCE_SHA="$(git rev-parse HEAD)"

          ssh -i "$RUNNER_TEMP/nasekadan_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          SHA="$(git rev-parse HEAD)"
          sudo install -d -m 0755 /var/www/nasekadan
          sudo find /var/www/nasekadan -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar --exclude='.git' --exclude='.github' --exclude='Dockerfile' \
              --exclude='docker-compose.yml' --exclude='nginx' --exclude='scripts' \
              --exclude='deploy' --exclude='tools' -cf - . \
            | sudo tar -C /var/www/nasekadan -xf -
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=direct-latest-hero\n' \
            "$SHA" "$(date -u +%FT%TZ)" \
            | sudo tee /var/www/nasekadan/deployment-health.txt >/dev/null
          sudo chmod -R a+rX /var/www/nasekadan
          REMOTE

          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          ok=0
          for attempt in $(seq 1 24); do
            curl -4 -kfsS --max-time 20 "https://nasekadan.cz/?latest=$stamp-$attempt" -o /tmp/home.html || true
            curl -4 -kfsS --max-time 20 "https://nasekadan.cz/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html?latest=$stamp-$attempt" -o /tmp/heat.html || true
            curl -4 -kfsS --max-time 20 "https://nasekadan.cz/deployment-health.txt?latest=$stamp-$attempt" -o /tmp/health.txt || true
            if grep -Fq 'data-heat-article-hero' /tmp/home.html \
              && grep -Fq 'Kadaň čekají tropické dny. Ve čtvrtek může být až 35 stupňů' /tmp/home.html \
              && grep -Fq 'Nová skluzavka může být během největšího horka uzavřena' /tmp/heat.html \
              && grep -Fq "source=$SOURCE_SHA" /tmp/health.txt; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: Uklidit jednorázový workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/direct-deploy-latest-hero-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Uklidit přímé nasazení správného hlavního článku [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
