name: Dokončit zveřejnění článku o 82 lůžkách

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-beds-article-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Zařadit článek do celého webu
        shell: python
        run: |
          from pathlib import Path
          import re

          url = 'https://nasekadan.cz/clanky/nemocnice-kadan-darovala-82-luzek-ukrajine.html'
          href = '/clanky/nemocnice-kadan-darovala-82-luzek-ukrajine.html'
          title = 'Z Kadaně až k frontové linii. Nemocnice darovala na Ukrajinu 82 lůžek'
          desc = 'Nemocnice Kadaň darovala 82 stále funkčních lůžek na Ukrajinu. Z Kyjeva mají zamířit do zdravotnických zařízení poblíž frontové linie.'

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8', newline='\n')

          p = Path('index.html')
          text = read(p)
          hero = '''<article class="lead" data-beds-hero>
            <div class="photo" style="background:radial-gradient(circle at 78% 18%,rgba(255,255,255,.16),transparent 27%),linear-gradient(135deg,#142b37,#36586a 52%,#9d222a)"><span>POMOC UKRAJINĚ</span><strong>82 LŮŽEK</strong></div>
            <div class="copy">
              <small>NEMOCNICE KADAŇ · 27. 07. 2026 · 21:40</small>
              <h1>Z Kadaně až k frontové linii</h1>
              <p>Nemocnice darovala 82 stále funkčních lůžek. Z Kyjeva mají zamířit do zařízení poblíž frontové linie.</p>
              <a class="btn" href="/clanky/nemocnice-kadan-darovala-82-luzek-ukrajine.html">Přečíst celý článek →</a>
            </div>
          </article>'''
          text = re.sub(r'<article class="lead"[^>]*>.*?</article>', hero, text, count=1, flags=re.S)
          card = '''
            <article class="article-card hospital" data-beds-card>
              <div class="visual" style="background:linear-gradient(135deg,#142b37,#36586a 58%,#9d222a)"><strong>82 lůžek pro Ukrajinu</strong></div>
              <div class="article-body">
                <span class="meta">27. 7. 2026 · 21:40 · Nemocnice Kadaň</span>
                <h3>Z Kadaně až k frontové linii</h3>
                <p>Funkční nemocniční postele dostaly druhou šanci tam, kde jsou mimořádně potřebné.</p>
                <a class="read-more" href="/clanky/nemocnice-kadan-darovala-82-luzek-ukrajine.html">Přečíst článek →</a>
              </div>
            </article>
          '''
          if 'data-beds-card' not in text:
              text = text.replace('<div class="article-list">', '<div class="article-list">' + card, 1)
          write(p, text)

          p = Path('clanky/index.html')
          text = read(p)
          item = '''
            <article class="archive-item hospital" data-beds-card>
              <div class="archive-visual" style="background:linear-gradient(135deg,#142b37,#36586a 58%,#9d222a)"><strong>82 lůžek pro Ukrajinu</strong></div>
              <div class="archive-body">
                <span class="archive-meta">27. července 2026 v 21:40 · Nemocnice Kadaň</span>
                <h2>Z Kadaně až k frontové linii. Nemocnice darovala na Ukrajinu 82 lůžek</h2>
                <p>Darovaná funkční lůžka byla převezena do vojenské nemocnice v Kyjevě a mají pokračovat do zařízení poblíž fronty.</p>
                <a href="/clanky/nemocnice-kadan-darovala-82-luzek-ukrajine.html">Přečíst celý článek →</a>
              </div>
            </article>
          '''
          if 'data-beds-card' not in text:
              marker = '<section class="archive-list" aria-label="Chronologický přehled článků">'
              text = text.replace(marker, marker + item, 1)
          write(p, text)

          p = Path('rss.xml')
          text = read(p)
          if url not in text:
              item = f'''    <item>\n      <title>{title}</title>\n      <description><![CDATA[{desc}]]></description>\n      <link>{url}</link>\n      <guid isPermaLink="true">{url}</guid>\n      <pubDate>Mon, 27 Jul 2026 21:40:00 +0200</pubDate>\n      <category>Nemocnice Kadaň</category>\n      <category>Pomoc Ukrajině</category>\n    </item>'''
              text = text.replace('    <item>', item + '\n\n    <item>', 1)
          text = re.sub(r'<lastBuildDate>.*?</lastBuildDate>', '<lastBuildDate>Mon, 27 Jul 2026 21:40:00 +0200</lastBuildDate>', text, count=1)
          write(p, text)

          for name in ['sitemap.xml', 'news-sitemap.xml']:
              p = Path(name)
              if not p.exists(): continue
              text = read(p)
              if url not in text:
                  if name == 'news-sitemap.xml':
                      node = f'''  <url>\n    <loc>{url}</loc>\n    <news:news><news:publication><news:name>Naše Kadaň</news:name><news:language>cs</news:language></news:publication><news:publication_date>2026-07-27T21:40:00+02:00</news:publication_date><news:title>{title}</news:title></news:news>\n  </url>\n'''
                  else:
                      node = f'''  <url><loc>{url}</loc><lastmod>2026-07-27</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>\n'''
                  text = text.replace('</urlset>', node + '</urlset>', 1)
              write(p, text)

          p = Path('llms.txt')
          if p.exists():
              text = read(p)
              if url not in text:
                  text += f'\n- [{title}]({url}) — {desc}\n'
              write(p, text)
      - name: Uložit změny do main
        run: |
          git config user.name "Naše Kadaň automat"
          git config user.email "actions@users.noreply.github.com"
          git add index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt
          git commit -m "Zařadit článek o 82 lůžkách na titulní stránku a do zdrojů"
          git push origin main
