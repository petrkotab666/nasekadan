name: Rychlé OCR klíčových objednávek ke kadaňským hřištím

on:
  push:
    branches: [main]
    paths:
      - '.github/research-kadan-playgrounds-fast-ocr-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-kadan-playgrounds-fast-ocr-20260805
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nainstalovat nástroje pro PDF a české OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ces

      - name: Vytěžit cílené objednávky a obrazové přílohy
        run: python3 scripts/research_kadan_playgrounds_fast_ocr_20260805.py

      - name: Zapsat výsledky do repozitáře
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň dokumentová rešerše'
          git config user.email 'info@nasekadan.cz'
          git add research/kadanska-hriste-fast-ocr-20260805/
          git commit -m 'Rešerše hřišť: rychlé OCR klíčových objednávek' || true
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
