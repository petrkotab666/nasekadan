name: Přímá oprava ARC-MED a hasičů

on:
  push:
    branches: [main]
    paths:
      - '.github/direct-server-fix-arc-med.txt'
      - '.github/workflows/direct-server-fix-arc-med.yml'
      - 'scripts/enforce_homepage_latest_order.py'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Opravit přímo produkční web
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path

          article=Path('clanky/arc-med-nemocnice-kadan.html')
          t=article.read_text(encoding='utf-8')
          t=t.replace('noindex,nofollow','index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1')
          t=t.replace('../../','../').replace('PŘIPRAVOVANÝ ČLÁNEK','28. ČERVENCE 2026')
          t=t.replace('<article>','<article class="article">',1)
          t=t.replace('<div data-promos data-context="sidebar"></div>','')
          published='2026-07-28T05:00:00+02:00'
          if 'article:published_time' not in t:
              t=t.replace('</head>',f'<meta property="article:published_time" content="{published}"><meta property="article:modified_time" content="{published}">\n</head>',1)
          article.write_text(t,encoding='utf-8',newline='\n')
          PY
          python3 scripts/enforce_homepage_latest_order.py
          python3 scripts/embed_static_article_ads.py
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/assets/reklamy
          sudo install -m 0644 index.html /var/www/nasekadan/index.html
          sudo install -m 0644 clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 clanky/arc-med-nemocnice-kadan.html /var/www/nasekadan/clanky/arc-med-nemocnice-kadan.html
          sudo install -m 0644 clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html /var/www/nasekadan/clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html
          sudo install -m 0644 assets/reklamy/*.svg /var/www/nasekadan/assets/reklamy/
          sudo install -m 0644 rss.xml /var/www/nasekadan/rss.xml
          sudo install -m 0644 sitemap.xml /var/www/nasekadan/sitemap.xml
          grep -Fq 'data-arc-med-hero' /var/www/nasekadan/index.html
          python3 - <<'PY'
          from pathlib import Path
          h=Path('/var/www/nasekadan/index.html').read_text(encoding='utf-8')
          assert h.index('data-arc-med-hero') < h.index('data-nechranice-card') < h.index('data-beds-card') < h.index('data-weekly-events-card')
          PY
          REMOTE

      - name: Ověřit živý web
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            home=$(curl -fsS "https://nasekadan.cz/?fix=$GITHUB_SHA-$i" || true)
            arc=$(curl -fsS "https://nasekadan.cz/clanky/arc-med-nemocnice-kadan.html?fix=$GITHUB_SHA-$i" || true)
            if grep -Fq 'data-arc-med-hero' <<<"$home" && grep -Fq 'index,follow' <<<"$arc"; then
              echo 'ARC-MED je hlavní článek a veřejná stránka funguje.'
              exit 0
            fi
            sleep 5
          done
          exit 1
