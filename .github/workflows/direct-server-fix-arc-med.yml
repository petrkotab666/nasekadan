name: Přímá oprava ARC-MED a AVIES

on:
  push:
    branches: [main]
    paths:
      - '.github/direct-server-fix-arc-med.txt'
      - '.github/workflows/direct-server-fix-arc-med.yml'
      - 'scripts/enforce_homepage_latest_order.py'
      - 'scripts/normalize_arc_med_article.py'
      - 'scripts/update_avies_oswald_context.py'
      - 'reklamy.js'
      - 'reklamy-sidebar.js'
      - 'reklamy-sidebar.css'
      - 'site.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-server-fix-arc-med
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Trvale normalizovat zdrojové články
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/normalize_arc_med_article.py
          python3 scripts/update_avies_oswald_context.py
          python3 scripts/enforce_homepage_latest_order.py

          grep -Fq 'data-arc-med-correction="2026-08-08"' clanky/arc-med-nemocnice-kadan.html
          grep -Fq '16&nbsp;000&nbsp;000 Kč' clanky/arc-med-nemocnice-kadan.html
          ! grep -Fq 'veřejný záznam proto sám o sobě nepotvrzuje částku 16 milionů korun' clanky/arc-med-nemocnice-kadan.html
          ! grep -Fq 'Úplná smlouva o převodu všech podílů včetně příloh a přesného splátkového kalendáře.' clanky/arc-med-nemocnice-kadan.html

          git config user.name 'nasekadan-publication-bot'
          git config user.email 'nasekadan-publication-bot@users.noreply.github.com'
          git add clanky/arc-med-nemocnice-kadan.html clanky/avies-nemocnice-kadan.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Trvale sjednotit ARC-MED, reklamy a kontext AVIES'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Opravit přímo produkční web
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main

          python3 scripts/normalize_arc_med_article.py
          python3 scripts/update_avies_oswald_context.py
          python3 scripts/enforce_homepage_latest_order.py

          files=(
            index.html
            clanky/index.html
            clanky/arc-med-nemocnice-kadan.html
            clanky/avies-nemocnice-kadan.html
            clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html
            reklamy.js
            reklamy-sidebar.js
            reklamy-sidebar.css
            site.js
            rss.xml
            sitemap.xml
          )

          sudo install -d -m 0755 /var/www/nasekadan/clanky
          for file in "${files[@]}"; do
            sudo install -d -m 0755 "/var/www/nasekadan/$(dirname "$file")"
            sudo install -m 0644 "$file" "/var/www/nasekadan/$file"
          done

          # Ostrý nginx je v Dockeru; přepsat proto i aktivní kontejner.
          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          if [[ -z "$cid" ]]; then
            cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"
          fi
          if [[ -z "$cid" ]]; then
            echo 'Aktivní kontejner nasekadan-web nebyl nalezen.' >&2
            exit 31
          fi
          for file in "${files[@]}"; do
            sudo docker exec "$cid" mkdir -p "/usr/share/nginx/html/$(dirname "$file")"
            sudo docker cp "$file" "$cid:/usr/share/nginx/html/$file"
          done

          grep -Fq 'data-arc-med-hero' /var/www/nasekadan/index.html
          grep -Fq 'data-promos data-context="sidebar"' /var/www/nasekadan/clanky/arc-med-nemocnice-kadan.html
          grep -Fq '/reklamy-sidebar.js?' /var/www/nasekadan/clanky/arc-med-nemocnice-kadan.html
          grep -Fq 'data-arc-med-correction="2026-08-08"' /var/www/nasekadan/clanky/arc-med-nemocnice-kadan.html
          grep -Fq '16&nbsp;000&nbsp;000 Kč' /var/www/nasekadan/clanky/arc-med-nemocnice-kadan.html
          grep -Fq 'data-oswald-avies-context' /var/www/nasekadan/clanky/avies-nemocnice-kadan.html
          ! grep -Fq 'veřejný záznam proto sám o sobě nepotvrzuje částku 16 milionů korun' /var/www/nasekadan/clanky/arc-med-nemocnice-kadan.html
          ! grep -Fq 'Úplná smlouva o převodu všech podílů včetně příloh a přesného splátkového kalendáře.' /var/www/nasekadan/clanky/arc-med-nemocnice-kadan.html
          ! grep -Fq 'static-article-ads' /var/www/nasekadan/clanky/arc-med-nemocnice-kadan.html
          ! grep -Fq 'Pracovní verze' /var/www/nasekadan/clanky/arc-med-nemocnice-kadan.html
          ! grep -Fq 'PŘIPRAVOVANÝ ČLÁNEK' /var/www/nasekadan/clanky/arc-med-nemocnice-kadan.html
          REMOTE

      - name: Ověřit živý web
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            home=$(curl -fsS "https://nasekadan.cz/?fix=$GITHUB_SHA-$i" || true)
            arc=$(curl -fsS "https://nasekadan.cz/clanky/arc-med-nemocnice-kadan.html?fix=$GITHUB_SHA-$i" || true)
            avies=$(curl -fsS "https://nasekadan.cz/clanky/avies-nemocnice-kadan.html?fix=$GITHUB_SHA-$i" || true)
            sidebar=$(curl -fsS "https://nasekadan.cz/reklamy-sidebar.js?fix=$GITHUB_SHA-$i" || true)
            if grep -Fq 'data-arc-med-hero' <<<"$home" \
              && grep -Fq 'index,follow' <<<"$arc" \
              && grep -Fq 'data-promos data-context="sidebar"' <<<"$arc" \
              && grep -Fq '/reklamy-sidebar.js?' <<<"$arc" \
              && grep -Fq 'data-arc-med-correction="2026-08-08"' <<<"$arc" \
              && grep -Fq '16&nbsp;000&nbsp;000 Kč' <<<"$arc" \
              && grep -Fq 'selectVariedAds' <<<"$sidebar" \
              && grep -Fq 'data-oswald-avies-context' <<<"$avies" \
              && ! grep -Fq 'veřejný záznam proto sám o sobě nepotvrzuje částku 16 milionů korun' <<<"$arc" \
              && ! grep -Fq 'Úplná smlouva o převodu všech podílů včetně příloh a přesného splátkového kalendáře.' <<<"$arc" \
              && ! grep -Fq 'static-article-ads' <<<"$arc" \
              && ! grep -Fq 'Pracovní verze' <<<"$arc" \
              && ! grep -Fq 'PŘIPRAVOVANÝ ČLÁNEK' <<<"$arc"; then
              echo 'ARC-MED je veřejný a opravený podle zveřejněné smlouvy; reklamy i AVIES jsou v pořádku.'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Zapsat potvrzení úspěšného nasazení ARC-MED
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .github/deploy-status
          cat > .github/deploy-status/arc-med-contract-fix-20260808.txt <<EOF
          ARC-MED contract correction deployed and live-verified.
          Workflow source commit: $GITHUB_SHA
          Verified UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Required marker: data-arc-med-correction="2026-08-08"
          Old incorrect statements: absent
          EOF
          git config user.name 'nasekadan-publication-bot'
          git config user.email 'nasekadan-publication-bot@users.noreply.github.com'
          git add .github/deploy-status/arc-med-contract-fix-20260808.txt
          git commit -m 'Potvrdit ostré nasazení opravy ARC-MED'
          git pull --rebase origin main
          git push origin HEAD:main
