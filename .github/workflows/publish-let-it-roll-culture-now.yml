name: Okamžitě zveřejnit Let It Roll v kulturním přehledu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-let-it-roll-culture-now.yml'
      - '.github/publish-let-it-roll-trigger.txt'
      - 'clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-let-it-roll-live
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE: clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
    steps:
      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_OVH_SSH_PRIVATE_KEY"
          printf '%s\n' "$KEY_OVH_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_ovh_key"
          chmod 600 "$RUNNER_TEMP/nasekadan_ovh_key"

      - name: Nasadit aktuální článek z hlavní větve
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/nasekadan_ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          test -f clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          grep -q 'data-let-it-roll-2026' clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          grep -q 'https://letitroll.cz/akce/let-it-roll-2026/' clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          if grep -q 'Prověřili jsme také Most, Litvínov.*nenašli mimořádnou velkou událost' clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html; then
            echo 'Zdroj stále obsahuje nepravdivou větu o Mostu a Litvínovu.' >&2
            exit 1
          fi
          sudo install -D -m 0644 \
            clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html \
            /var/www/nasekadan/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          SOURCE_SHA="$(git rev-parse HEAD)"
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=direct-let-it-roll-article\n' \
            "$SOURCE_SHA" "$(date -u +%FT%TZ)" | sudo tee /var/www/nasekadan/deployment-health.txt >/dev/null
          REMOTE

      - name: Ověřit Let It Roll na veřejném webu
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html'
          for attempt in $(seq 1 36); do
            curl -4 -kfsS --max-time 25 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "${URL}?let_it_roll=${GITHUB_RUN_ID}-${attempt}-$(date +%s)" \
              -o /tmp/culture-live.html || true
            if grep -q 'data-let-it-roll-2026' /tmp/culture-live.html 2>/dev/null \
              && grep -q 'Let It Roll 2026: největší regionální hudební akce týdne' /tmp/culture-live.html 2>/dev/null \
              && grep -q 'https://letitroll.cz/akce/let-it-roll-2026/' /tmp/culture-live.html 2>/dev/null \
              && ! grep -q 'Prověřili jsme také Most, Litvínov.*nenašli mimořádnou velkou událost' /tmp/culture-live.html 2>/dev/null; then
              echo 'Let It Roll je veřejně viditelný.'
              exit 0
            fi
            sleep 5
          done
          echo 'Veřejný článek stále nepotvrdil Let It Roll.' >&2
          exit 1

      - name: Zapsat výsledek nasazení
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = '.github/let-it-roll-live-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'passed' : 'failed',
              checkedAtUtc: new Date().toISOString(),
              runId: context.runId,
              sourceSha: context.sha,
              serverDeploy: process.env.DEPLOY_OUTCOME || 'skipped',
              publicVerification: process.env.VERIFY_OUTCOME || 'skipped',
              publicUrl: 'https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path, branch: 'main',
              message: `Zapsat nasazení Let It Roll: ${status.status} [skip ci]`,
              content, ...(sha ? {sha} : {})
            });
