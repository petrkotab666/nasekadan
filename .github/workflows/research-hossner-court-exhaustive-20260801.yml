name: Hloubkově vytěžit soudní spory Hossner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-hossner-court-exhaustive-20260801.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-hossner-court-exhaustive-20260801
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Instalovat nástroje pro PDF, skeny a webové přílohy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ces unzip file
          python3 -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml python-pptx

      - name: Stáhnout, vytěžit a systematicky prověřit zdroje
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/research/hossner-court-2026
          mkdir -p .github/research/hossner-court-2026/{raw,text,files,infosoud}
          cat > /tmp/hossner_research.py <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import hashlib
          import html
          import io
          import json
          import os
          import re
          import subprocess
          import time
          import unicodedata
          import urllib.parse
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from bs4 import BeautifulSoup
          from pptx import Presentation

          OUT = Path('.github/research/hossner-court-2026')
          RAW = OUT / 'raw'
          TEXT = OUT / 'text'
          FILES = OUT / 'files'
          INFO = OUT / 'infosoud'
          for p in (RAW, TEXT, FILES, INFO): p.mkdir(parents=True, exist_ok=True)

          UA = 'Mozilla/5.0 (compatible; NaseKadan investigative research; +https://nasekadan.cz/)'
          S = requests.Session()
          S.headers.update({'User-Agent': UA, 'Accept-Language': 'cs,en;q=0.8'})

          def get(url: str, timeout: int = 90, attempts: int = 5) -> requests.Response:
              last = None
              for i in range(attempts):
                  try:
                      r = S.get(url, timeout=timeout, allow_redirects=True)
                      if r.status_code in (429, 500, 502, 503, 504):
                          raise RuntimeError(f'HTTP {r.status_code}')
                      r.raise_for_status()
                      return r
                  except Exception as e:
                      last = e
                      time.sleep(1.5 + i * 2)
              raise last  # type: ignore[misc]

          def norm(s: str) -> str:
              return re.sub(r'\s+', ' ', unicodedata.normalize('NFKD', s or '').encode('ascii','ignore').decode().lower()).strip()

          def safe_name(url: str, idx: int = 0) -> str:
              name = Path(urllib.parse.urlparse(url).path).name or f'file-{idx}'
              name = urllib.parse.unquote(name)
              name = re.sub(r'[^A-Za-z0-9._-]+', '_', name)
              return name[:180]

          def text_from_html(data: str) -> str:
              soup = BeautifulSoup(data, 'lxml')
              for tag in soup(['script','style','noscript']): tag.decompose()
              return re.sub(r'\s+', ' ', soup.get_text(' ', strip=True)).strip()

          def run(cmd: list[str]) -> subprocess.CompletedProcess[str]:
              return subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=False)

          def extract_pdf(path: Path, stem: str) -> dict[str, Any]:
              txt = TEXT / f'{stem}.txt'
              res = run(['pdftotext', '-layout', str(path), str(txt)])
              content = txt.read_text(encoding='utf-8', errors='replace') if txt.exists() else ''
              method = 'pdftotext'
              if len(re.sub(r'\s+', '', content)) < 150:
                  render = Path('/tmp') / f'ocr-{stem}'
                  render.mkdir(exist_ok=True)
                  run(['pdftoppm', '-r', '180', '-png', str(path), str(render / 'page')])
                  chunks=[]
                  for image in sorted(render.glob('page-*.png')):
                      outbase = render / image.stem
                      run(['tesseract', str(image), str(outbase), '-l', 'ces+eng', '--psm', '6'])
                      op = outbase.with_suffix('.txt')
                      if op.exists(): chunks.append(op.read_text(encoding='utf-8', errors='replace'))
                  ocr='\n\n'.join(chunks)
                  if len(ocr) > len(content):
                      content=ocr; txt.write_text(content,encoding='utf-8'); method='ocr-ces+eng'
              return {'text_file': str(txt), 'chars': len(content), 'method': method, 'stderr': res.stderr[-1000:]}

          def extract_pptx(path: Path, stem: str) -> dict[str, Any]:
              chunks=[]
              try:
                  prs=Presentation(str(path))
                  for i,slide in enumerate(prs.slides,1):
                      parts=[]
                      for shape in slide.shapes:
                          if hasattr(shape,'text') and shape.text:
                              parts.append(shape.text)
                      chunks.append(f'--- SLIDE {i} ---\n'+'\n'.join(parts))
              except Exception as e:
                  chunks.append(f'python-pptx error: {e!r}')
              txt=TEXT/f'{stem}.txt'; txt.write_text('\n\n'.join(chunks),encoding='utf-8')
              return {'text_file':str(txt),'chars':len(txt.read_text(encoding='utf-8',errors='replace')),'method':'python-pptx'}

          def extract_download(url: str, idx: int) -> dict[str, Any]:
              try:
                  r=get(url,timeout=180)
                  data=r.content
                  name=safe_name(r.url,idx)
                  if not Path(name).suffix:
                      ctype=r.headers.get('content-type','').lower()
                      if 'pdf' in ctype: name += '.pdf'
                      elif 'presentation' in ctype: name += '.pptx'
                  path=FILES/name; path.write_bytes(data)
                  item={'url':url,'final_url':r.url,'file':str(path),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'content_type':r.headers.get('content-type','')}
                  low=name.lower()
                  if data.startswith(b'%PDF') or low.endswith('.pdf'): item.update(extract_pdf(path,path.stem))
                  elif low.endswith('.pptx'): item.update(extract_pptx(path,path.stem))
                  return item
              except Exception as e:
                  return {'url':url,'error':repr(e)}

          # 1. Hossnerův web: stránky, REST API, sitemapy, všechny relevantní přílohy.
          pages = [
              'https://petrhossnerkadan.cz/',
              'https://petrhossnerkadan.cz/category/aktuality/',
              'https://petrhossnerkadan.cz/category/aktuality/page/2/',
              'https://petrhossnerkadan.cz/category/aktuality/page/3/',
              'https://petrhossnerkadan.cz/aktuality/informace-k-2-soudnimu-projednanim-u-okresniho-soudu-v-chomutove-z-23-3-2026/',
              'https://petrhossnerkadan.cz/aktuality/misto-do-pece-o-pacienty-investuje-nemocnice-miliony-do-pravniku/',
              'https://petrhossnerkadan.cz/aktuality/prezentace-na-jednani-zastupitelstva-mesta-kadane/',
              'https://petrhossnerkadan.cz/wp-sitemap.xml',
              'https://petrhossnerkadan.cz/wp-sitemap-posts-post-1.xml',
              'https://petrhossnerkadan.cz/wp-sitemap-posts-attachment-1.xml',
              'https://petrhossnerkadan.cz/wp-json/',
              'https://petrhossnerkadan.cz/wp-json/wp/v2/posts?per_page=100&_fields=id,date,slug,link,title,content,excerpt',
          ]
          page_results=[]; attachment_urls=set()
          for i,url in enumerate(pages,1):
              try:
                  r=get(url)
                  ext='json' if 'json' in r.headers.get('content-type','') else 'html'
                  p=RAW/f'page-{i:02d}.{ext}'; p.write_bytes(r.content)
                  body=r.text
                  page_results.append({'url':url,'final_url':r.url,'status':r.status_code,'bytes':len(r.content),'file':str(p)})
                  for m in re.findall(r'https?://[^\"\'<>\\ ]+', html.unescape(body)):
                      clean=m.rstrip(').,;')
                      if re.search(r'\.(pdf|pptx|docx|xlsx|jpg|jpeg|png)(\?|$)',clean,re.I): attachment_urls.add(clean)
                  soup=BeautifulSoup(body,'lxml')
                  for tag in soup.find_all(['a','img','source']):
                      for attr in ('href','src','srcset'):
                          val=tag.get(attr)
                          if not val: continue
                          for v in str(val).split(','):
                              v=v.strip().split(' ')[0]
                              full=urllib.parse.urljoin(r.url,v)
                              if re.search(r'\.(pdf|pptx|docx|xlsx|jpg|jpeg|png)(\?|$)',full,re.I): attachment_urls.add(full)
              except Exception as e:
                  page_results.append({'url':url,'error':repr(e)})

          # Enumerovat WordPress média, aby neunikly přílohy bez viditelného odkazu.
          for page in range(1,15):
              u=f'https://petrhossnerkadan.cz/wp-json/wp/v2/media?per_page=100&page={page}'
              try:
                  r=get(u); data=r.json()
                  (RAW/f'media-{page:02d}.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
                  if not data: break
                  for item in data:
                      source=item.get('source_url')
                      hay=norm(json.dumps(item,ensure_ascii=False))
                      if source and any(k in hay for k in ('soud','zalob','smir','nemocnic','hossner','starost','prezentace','deloitte','pracovn')):
                          attachment_urls.add(source)
              except Exception as e:
                  page_results.append({'url':u,'error':repr(e)})
                  break

          # Přidat přesně známé přílohy, i kdyby API selhalo.
          attachment_urls.update([
              'https://petrhossnerkadan.cz/wp-content/uploads/2025/12/Priloha_1_Dopis-starostovi-_12-11-2025.pdf',
              'https://petrhossnerkadan.cz/wp-content/uploads/2025/12/Priloha_2_Odpoved_na_vyzvu_ke_smiru.pdf',
              'https://petrhossnerkadan.cz/wp-content/uploads/2025/09/6.-Prezentace_Kadan_Nemocnice_25.9.2026.pptx',
          ])
          # Stahovat pouze rozumný počet a relevantní dokumenty/obrázky.
          rel=[]
          for u in sorted(attachment_urls):
              n=norm(u)
              if any(k in n for k in ('soud','zalob','smir','nemocnic','hossner','starost','prezentace','deloitte','vyzv','odpoved','priloha')):
                  rel.append(u)
          downloads=[]
          for i,u in enumerate(rel[:250],1): downloads.append(extract_download(u,i))
          (OUT/'web-pages.json').write_text(json.dumps(page_results,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'downloads.json').write_text(json.dumps(downloads,ensure_ascii=False,indent=2),encoding='utf-8')

          # 2. Wayback CDX - seznam archivovaných verzí stránek a příloh.
          wayback=[]
          for target in [
              'petrhossnerkadan.cz/aktuality/*soud*',
              'petrhossnerkadan.cz/wp-content/uploads/*',
              'nemkadan.cz/*Hossner*',
              'mesto-kadan.cz/*Hossner*',
          ]:
              u='https://web.archive.org/cdx/search/cdx?url='+urllib.parse.quote(target,safe='*/')+'&output=json&fl=timestamp,original,statuscode,mimetype,digest&filter=statuscode:200&collapse=digest&limit=5000'
              try:
                  r=get(u,timeout=180); data=r.json(); wayback.extend(data[1:] if data and isinstance(data[0],list) else data)
              except Exception as e: wayback.append(['ERROR',target,repr(e)])
          (OUT/'wayback-cdx.json').write_text(json.dumps(wayback,ensure_ascii=False,indent=2),encoding='utf-8')

          # 3. Oficiální stránky soudu a rozvrhy práce.
          court_pages=[
              'https://msp.gov.cz/web/okresni-soud-v-chomutove/rozvrh-prace',
              'https://msp.gov.cz/web/okresni-soud-v-chomutove/uredni-deska',
              'https://msp.gov.cz/web/okresni-soud-v-chomutove/zakladni-informace',
          ]
          court_links=set(); court_result=[]
          for i,u in enumerate(court_pages,1):
              try:
                  r=get(u); (RAW/f'court-{i:02d}.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.text,'lxml')
                  for a in soup.find_all('a',href=True):
                      full=urllib.parse.urljoin(r.url,a['href'])
                      label=norm(a.get_text(' ',strip=True)+' '+full)
                      if ('rozvrh' in label or '2025' in label or '2026' in label or 'uredni' in label) and re.search(r'\.(pdf|docx?)(\?|$)',full,re.I): court_links.add(full)
                  court_result.append({'url':u,'bytes':len(r.content),'links':sorted(court_links)})
              except Exception as e: court_result.append({'url':u,'error':repr(e)})
          for i,u in enumerate(sorted(court_links),1001): downloads.append(extract_download(u,i))
          (OUT/'court-pages.json').write_text(json.dumps(court_result,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'downloads.json').write_text(json.dumps(downloads,ensure_ascii=False,indent=2),encoding='utf-8')

          # 4. InfoSoud: kalibrace a prohledání celého senátu 30 C / 2025.
          base='https://infojednani.gov.cz/InfoSoud/detail-rizeni'
          def case_url(senate:int, register:str, number:int, year:int) -> str:
              q={'typOrganizace':'VSECHNY_KRAJE','okresniSoud':'OSCV','cisloSenatu':senate,'druhVeci':register,'bcVec':number,'rocnik':year}
              return base+'?'+urllib.parse.urlencode(q)
          def fetch_case(number:int, year:int=2025, senate:int=30, register:str='C') -> dict[str,Any]:
              u=case_url(senate,register,number,year)
              try:
                  r=requests.get(u,headers={'User-Agent':UA},timeout=45)
                  text=text_from_html(r.text)
                  dates=sorted(set(re.findall(r'\b(?:0?[1-9]|[12]\d|3[01])[.\-/](?:0?[1-9]|1[0-2])[.\-/](?:20)?\d{2}\b',text)))
                  low=norm(text)
                  # Platný spis obvykle opakuje přesnou značku nebo obsahuje časovou osu událostí.
                  patterns=[f'{senate} c {number}/{year}',f'{senate}c{number}/{year}',f'{number}/{year}']
                  exact=any(p in low.replace(' ','') for p in [x.replace(' ','') for x in patterns])
                  event_words=sum(1 for k in ('zahajeni rizeni','napad veci','jednani','preruseni','rozhodnuti','vyreseni veci','odeslani spisu','pravomoc') if k in low)
                  invalid=any(k in low for k in ('rizeni nebylo nalezeno','nebyly nalezeny zadne zaznamy','vyplnte udaje nutne pro nalezeni')) and event_words==0
                  valid=(exact or event_words>=2) and not invalid
                  return {'number':number,'year':year,'senate':senate,'register':register,'url':u,'status':r.status_code,'chars':len(text),'sha256':hashlib.sha256(r.content).hexdigest(),'dates':dates,'event_words':event_words,'valid':valid,'text':text[:20000] if valid else ''}
              except Exception as e:
                  return {'number':number,'year':year,'senate':senate,'register':register,'url':u,'error':repr(e),'valid':False}

          calibration=[fetch_case(234,2024),fetch_case(9999,2024),fetch_case(1,2025)]
          (INFO/'calibration.json').write_text(json.dumps(calibration,ensure_ascii=False,indent=2),encoding='utf-8')
          cases=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              futures=[ex.submit(fetch_case,n) for n in range(1,451)]
              for f in concurrent.futures.as_completed(futures): cases.append(f.result())
          cases.sort(key=lambda x:x['number'])
          valid=[c for c in cases if c.get('valid')]
          (INFO/'30C-2025-valid.json').write_text(json.dumps(valid,ensure_ascii=False,indent=2),encoding='utf-8')
          candidates=[]
          for c in valid:
              ntext=norm(c.get('text',''))
              score=0; reasons=[]
              for needle,pts in [('23.3.2026',12),('23. 3. 2026',12),('23/03/2026',12),('leden 2026',4),('mediac',8),('pracovni pomer',8),('neplatnost',5),('nemocnice',15),('hossner',25),('25 900 000',15),('25,9',10)]:
                  if norm(needle) in ntext: score+=pts; reasons.append(needle)
              if score or any('3.2026' in d for d in c.get('dates',[])):
                  candidates.append({**c,'score':score,'reasons':reasons})
          candidates.sort(key=lambda x:(-x['score'],x['number']))
          (INFO/'candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')

          # 5. U kandidátů načíst InfoJednání, zda je už vypsán další termín.
          hearing=[]
          for c in candidates[:80]:
              q={'okresniSoud':'OSCV','cisloSenatu':c['senate'],'druhVeci':c['register'],'bcVec':c['number'],'rocnik':c['year'],'typHledani':'SPZN'}
              u='https://infojednani.gov.cz/InfoJednani/detail-jednani?'+urllib.parse.urlencode(q)
              try:
                  r=get(u); t=text_from_html(r.text)
                  hearing.append({'case':f"{c['senate']} {c['register']} {c['number']}/{c['year']}",'url':u,'text':t[:12000]})
              except Exception as e: hearing.append({'case':str(c['number']),'url':u,'error':repr(e)})
          (INFO/'candidate-hearings.json').write_text(json.dumps(hearing,ensure_ascii=False,indent=2),encoding='utf-8')

          # 6. Prohledat veškerý vytěžený text po spisových značkách, částkách a klíčových údajích.
          patterns={
              'case_numbers':r'(?<!\d)(?:sp\.?\s*zn\.?|c\.?\s*j\.?)?\s*\d{1,3}\s*(?:C|Nc|Co|Cmo|Cm|EPR|EC)\s*\d{1,4}\s*/\s*20\d{2}(?:\s*-\s*\d+)?',
              'amounts':r'(?<!\d)\d{1,3}(?:[ .]\d{3})+(?:,\d+)?\s*(?:Kc|Kč)',
              'dates':r'\b(?:0?[1-9]|[12]\d|3[01])\s*[.\-/]\s*(?:0?[1-9]|1[0-2])\s*[.\-/]\s*20\d{2}\b',
          }
          hits=[]
          scan_files=list(TEXT.glob('*.txt'))+list(RAW.glob('*.html'))+list(RAW.glob('*.json'))
          for p in scan_files:
              data=p.read_text(encoding='utf-8',errors='replace')
              nd=norm(data)
              if not any(k in nd for k in ('hossner','nemocnice kadan','soud','zalob','smir')): continue
              item={'file':str(p),'case_numbers':sorted(set(re.findall(patterns['case_numbers'],data,re.I))), 'amounts':sorted(set(re.findall(patterns['amounts'],data,re.I))), 'dates':sorted(set(re.findall(patterns['dates'],data,re.I)))}
              snippets=[]
              for key in ('sp. zn','spisova znacka','c. j','soud','zalob','25,9','52,9','smir','mediac'):
                  pos=nd.find(norm(key))
                  if pos>=0: snippets.append(nd[max(0,pos-500):pos+1500])
              item['snippets']=snippets[:20]
              if item['case_numbers'] or item['amounts'] or snippets: hits.append(item)
          (OUT/'all-text-findings.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')

          # 7. Souhrn pro rychlé čtení.
          all_cases=sorted(set(x for h in hits for x in h.get('case_numbers',[])))
          md=['# Hloubková rešerše – Petr Hossner vs. Nemocnice Kadaň','',f'Vytěženo: {time.strftime("%Y-%m-%d %H:%M:%S UTC",time.gmtime())}','',
              '## Nalezené spisové značky ve stažených dokumentech','']
          md += [f'- `{x}`' for x in all_cases] or ['- V textově vytěžených dokumentech nebyla jednoznačná značka nalezena.']
          md += ['','## Kandidáti z InfoSoudu (30 C / 2025)','']
          for c in candidates[:30]:
              md.append(f"- **30 C {c['number']}/2025** – skóre {c['score']}, data: {', '.join(c.get('dates',[]))}, důvody: {', '.join(c.get('reasons',[]))}")
          md += ['','## Stažené relevantní přílohy','']
          for d in downloads:
              md.append(f"- {d.get('final_url',d.get('url'))} – {d.get('bytes','?')} B; text {d.get('chars','?')} znaků; metoda {d.get('method','-')}" if 'error' not in d else f"- {d['url']} – CHYBA {d['error']}")
          md += ['','## Poznámka','', 'Údaje InfoSoudu neobsahují jména účastníků ani rozhodnutí. Shoda musí být potvrzena dokumentem, spisovou značkou nebo kombinací procesních dat; samotné časové datum je pouze stopa.']
          (OUT/'README.md').write_text('\n'.join(md),encoding='utf-8')
          PY
          python3 /tmp/hossner_research.py

      - name: Uložit výsledky na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/research/hossner-court-2026
          git commit -m 'Vytěžit soudní spory Petra Hossnera' || true
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
