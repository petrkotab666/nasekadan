name: Ověřit nasazení obnovy hesla statistik

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/stats-deploy-observe-trigger.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sledovat nouzové nasazení a ověřit živý reset
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = 'emergency-deploy-ovh.yml';
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            let run = null;
            for (let lookup = 0; lookup < 12 && !run; lookup++) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflowId, branch: 'main', event: 'workflow_dispatch', per_page: 10
              });
              run = response.data.workflow_runs
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] || null;
              if (!run) await sleep(5000);
            }
            if (!run) throw new Error('Nenalezen žádný nouzový deploy z větve main.');

            const observedRunId = run.id;
            for (let attempt = 0; attempt < 48; attempt++) {
              const current = await github.rest.actions.getWorkflowRun({owner, repo, run_id: observedRunId});
              run = current.data;
              if (run.status === 'completed') break;
              await sleep(15000);
            }

            let loginOk = false;
            let healthOk = false;
            let emailAccepted = false;
            let loginStatus = 0;
            let healthStatus = 0;
            let resetStatus = 0;
            let resetBody = '';

            try {
              const login = await fetch(`https://nasekadan.cz/statistiky/?observe=${context.runId}`, {
                headers: {'Cache-Control': 'no-cache'}, redirect: 'follow'
              });
              loginStatus = login.status;
              const text = await login.text();
              loginOk = login.ok && text.includes('Zapomenuté heslo') && text.includes('Přihlášení ke statistikám');
            } catch (error) {
              core.warning(`Kontrola loginu: ${error.message}`);
            }

            try {
              const health = await fetch(`https://nasekadan.cz/statistiky/healthz?observe=${context.runId}`, {
                headers: {'Cache-Control': 'no-cache'}, redirect: 'follow'
              });
              healthStatus = health.status;
              const data = await health.json().catch(() => ({}));
              healthOk = health.ok && data.ok === true && data.auth === 'application' && data.smtpConfigured === true;
            } catch (error) {
              core.warning(`Kontrola health: ${error.message}`);
            }

            if (loginOk && healthOk) {
              try {
                const reset = await fetch('https://nasekadan.cz/statistiky/zapomenute-heslo', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                  body: '',
                  redirect: 'follow'
                });
                resetStatus = reset.status;
                resetBody = await reset.text();
                emailAccepted = reset.ok && /Obnovovací odkaz (byl odeslán|už byl nedávno odeslán)/.test(resetBody);
              } catch (error) {
                core.warning(`Test e-mailu: ${error.message}`);
              }
            }

            const deployOk = run.status === 'completed' && run.conclusion === 'success';
            const allOk = deployOk && loginOk && healthOk && emailAccepted;
            let jobs = [];
            try {
              const result = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id: observedRunId, per_page: 100});
              jobs = result.data.jobs.map(job => `- ${job.name}: ${job.status}/${job.conclusion || 'bez závěru'}`);
            } catch (error) {
              jobs = [`- Stav úloh se nepodařilo načíst: ${error.message}`];
            }

            const body = [
              `## ${allOk ? 'Obnova hesla je nasazená a ověřená' : 'Obnova hesla zatím neprošla úplným ověřením'}`,
              '',
              `- Nouzový deploy: ${run.status}/${run.conclusion || 'bez závěru'}`,
              `- Běh: ${run.html_url}`,
              `- Přihlašovací stránka: ${loginOk ? 'OK' : `NE (${loginStatus || 'bez odpovědi'})`}`,
              `- Health a SMTP: ${healthOk ? 'OK' : `NE (${healthStatus || 'bez odpovědi'})`}`,
              `- Přijetí resetovacího e-mailu: ${emailAccepted ? 'OK' : `NE (${resetStatus || 'nezkoušeno'})`}`,
              '',
              '### Úlohy deploye',
              ...jobs
            ].join('\n');

            if (context.issue.number) {
              await github.rest.issues.createComment({owner, repo, issue_number: context.issue.number, body});
            }

            const markerTitle = '[OVĚŘENÍ STATISTIK] Obnova hesla přes e-mail';
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'all', per_page: 100});
            const marker = issues.find(item => !item.pull_request && item.title === markerTitle);
            if (marker) {
              await github.rest.issues.update({
                owner, repo, issue_number: marker.number,
                body: `${body}\n\n- Ověřovací běh: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                state: allOk ? 'closed' : 'open'
              });
            }

            if (!allOk) throw new Error('Deploy nebo některá část živého resetu neprošla ověřením.');
