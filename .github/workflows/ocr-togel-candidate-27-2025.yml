name: OCR kandidáta 27/2025 – stanovisko Tőgl

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ocr-togel-candidate-27-2025.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/research/hossner-fast-missing-docs-20260801/files/27_2025_106_s.pdf
            .github/workflows/ocr-togel-candidate-27-2025.yml
          sparse-checkout-cone-mode: false

      - name: Instalovat OCR nástroje
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ces

      - name: OCR všech stran a vyhledání stop
        shell: bash
        run: |
          set -euo pipefail
          PDF=.github/research/hossner-fast-missing-docs-20260801/files/27_2025_106_s.pdf
          OUT=ocr-output
          rm -rf "$OUT" /tmp/ocr27
          mkdir -p "$OUT/pages" /tmp/ocr27/img
          pdfinfo "$PDF" | tee "$OUT/pdfinfo.txt"
          pdftoppm -r 115 -jpeg -jpegopt quality=70 "$PDF" /tmp/ocr27/img/page >/dev/null 2>&1
          find /tmp/ocr27/img -type f -name 'page-*.jpg' -print0 | sort -z | xargs -0 -n1 -P2 bash -c '
            f="$1"; b=$(basename "$f" .jpg); tesseract "$f" "ocr-output/pages/$b" -l ces+eng --psm 6 >/dev/null 2>&1 || true
          ' _
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          out=Path('ocr-output')
          terms=[
            r't[őöoó]gl', r't[őöoó]gel', r'vladim[ií]r', r'hossner',
            r'soub[eě]h', r'pr[aá]vn[ií]\s+stanovisko', r'dodate[čc]n',
            r'n[aá]sledn', r'schv[aá]len', r'pracovn[ií]\s+smlouv',
            r'v[yý]konu\s+funkce', r'technick[eé]\s+slu[zž]by',
            r'tepeln[eé]\s+hospod[aá][řr]stv[ií]', r'kabelov[aá]\s+televize',
            r'24\s*[.\/]\s*0?7\s*[.\/]\s*2024', r'24\.\s*července\s*2024'
          ]
          rx=[re.compile(t,re.I) for t in terms]
          hits=[]; allparts=[]
          def page_num(p):
              m=re.search(r'(\d+)$',p.stem); return int(m.group(1)) if m else 0
          for f in sorted((out/'pages').glob('page-*.txt'), key=page_num):
              text=f.read_text('utf-8',errors='replace')
              allparts.append(f"\n\n===== {f.stem} =====\n{text}")
              found=[]
              for pat in rx:
                  for m in pat.finditer(text):
                      snippet=re.sub(r'\s+',' ',text[max(0,m.start()-500):m.end()+1000]).strip()
                      found.append({'term':pat.pattern,'snippet':snippet})
              if found: hits.append({'page':f.stem,'hits':found})
          (out/'all-pages.txt').write_text(''.join(allparts),encoding='utf-8')
          (out/'hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=['# OCR dokumentu 27/2025 podle zákona 106','',f'- Stran s nalezenou stopou: {len(hits)}','']
          for p in hits:
              lines += [f"## {p['page']}",'']
              seen=set()
              for h in p['hits']:
                  if h['snippet'] in seen: continue
                  seen.add(h['snippet'])
                  lines += [f"**Shoda:** `{h['term']}`",'',h['snippet'],'']
          (out/'HITS.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
          echo '===== OCR HITS ====='
          cat "$OUT/HITS.md"

      - name: Uložit OCR výsledek
        uses: actions/upload-artifact@v4
        with:
          name: ocr-togel-27-2025
          path: ocr-output
          retention-days: 1
