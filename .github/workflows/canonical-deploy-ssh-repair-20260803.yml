name: Kanonicky nasadit opravu archivu přes SSH

on:
  push:
    branches: [main]
    paths:
      - '.github/canonical-deploy-ssh-trigger.txt'

permissions:
  contents: write

concurrency:
  group: nasekadan-canonical-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      DONOR_REL: /clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
      FVE_REL: /clanky/fve-epr-letiste-bess-kadan-2026.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Spustit plný kanonický deploy na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          sudo docker builder prune -af >/dev/null 2>&1 || true
          sudo docker container prune -f >/dev/null 2>&1 || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

      - name: Veřejně ověřit opravenou evidenci
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, time, urllib.request, xml.etree.ElementTree as ET
          from html import unescape

          BASE='https://nasekadan.cz'
          DONOR='/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html'
          FVE='/clanky/fve-epr-letiste-bess-kadan-2026.html'

          def get(path):
              url=BASE+path+('&' if '?' in path else '?')+'ssh_verify='+str(time.time_ns())
              req=urllib.request.Request(url,headers={'User-Agent':'NaseKadanCanonicalSSHVerify/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as r:
                  return r.read().decode('utf-8','replace')

          archive=get('/clanky/')
          start=archive.index('<section class="archive-list" aria-label="Chronologický přehled článků">')
          end=archive.index('</section>',start)
          visible=archive[start:end]
          assert visible.count(f'href="{DONOR}"')==1
          assert f'href="{FVE}"' in visible
          links=set(re.findall(r'href=["\'](/clanky/[^/"\']+\.html)["\']',visible,re.I))
          assert len(links)==42, len(links)

          donor=get(DONOR)
          assert '<h1>Zaregistrovala se v Kadani. O rok později darovala krvetvorné buňky konkrétnímu pacientovi</h1>' in donor
          assert '2026-08-03T12:49:19+02:00' in donor

          rss=get('/rss.xml')
          root=ET.fromstring(rss)
          rss_links={e.text.strip() for e in root.findall('.//item/link') if e.text}
          assert len(rss_links)==42, len(rss_links)
          assert BASE+DONOR in rss_links

          sitemap=get('/sitemap.xml')
          sitemap_links={e.text.strip() for e in ET.fromstring(sitemap).iter() if e.tag.endswith('loc') and e.text}
          assert all(BASE+p in sitemap_links for p in links)

          news=get('/news-sitemap.xml')
          assert BASE+DONOR in news
          health=get('/deployment-health.txt')
          match=re.search(r'(?m)^source=([0-9a-f]{40})$',health)
          assert match, health
          print('DEPLOYMENT_SOURCE='+match.group(1))
          PY

      - name: Uklidit jednorázový workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git rm -f .github/canonical-deploy-ssh-trigger.txt
          git rm -f .github/workflows/canonical-deploy-ssh-repair-20260803.yml
          git commit -m "Dokončit kanonické nasazení opravy evidence [skip ci]"
          git push origin HEAD:main
