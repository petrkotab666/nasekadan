name: Opravit chronologii RSS po připnutí zimního stadionu

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: repair-rss-election-after-stadium-pin-20260804
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.issue.title == '[repair] rss election after stadium pin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit nejnovější volební článek na začátek RSS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – oprava RSS'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          import re
          from xml.etree import ElementTree as ET

          path=Path('rss.xml')
          text=path.read_text(encoding='utf-8')
          url='https://nasekadan.cz/clanky/komunalni-volby-kadan-kandidaty-lhuta-2026.html'
          title='Lhůta pro kandidátky skončila. V Kadani se rýsuje souboj ODS, nové skupiny a ANO'
          desc='Podávání kandidátek do komunálních voleb skončilo. ODS a Dáme Kadani novou šanci zveřejnily celé sestavy, ANO oznámilo podání a Piráti představují své kandidáty.'
          image='https://nasekadan.cz/social/komunalni-volby-kadan-kandidaty-lhuta-2026.png'
          item=f'''    <item>
              <title>{title}</title>
              <description><![CDATA[{desc}]]></description>
              <link>{url}</link>
              <guid isPermaLink="true">{url}</guid>
              <pubDate>Tue, 04 Aug 2026 18:46:00 +0200</pubDate>
              <category>Kadaň</category>
              <category>Komunální volby 2026</category>
              <category>Politika</category>
              <category>Volby</category>
              <szn:image><szn:url>{image}</szn:url></szn:image>
              <geo:lat>50.375984</geo:lat>
              <geo:long>13.271307</geo:long>
            </item>
          '''
          # Odstraň případný starší výskyt stejné položky, aby nevznikla duplicita.
          text=re.sub(r'\s*<item>.*?<link>'+re.escape(url)+r'</link>.*?</item>\s*','\n',text,flags=re.S)
          text=re.sub(r'<lastBuildDate>.*?</lastBuildDate>','<lastBuildDate>Tue, 04 Aug 2026 18:46:00 +0200</lastBuildDate>',text,count=1)
          marker='    <item>'
          if marker not in text:
              raise SystemExit('RSS neobsahuje žádnou položku pro bezpečné vložení.')
          text=text.replace(marker,item+marker,1)
          path.write_text(text,encoding='utf-8',newline='\n')
          root=ET.parse(path).getroot()
          links=[node.findtext('link') for node in root.findall('./channel/item')]
          if not links or links[0] != url or links.count(url) != 1:
              raise SystemExit(f'RSS nebylo opraveno jednoznačně: {links[:3]} count={links.count(url)}')
          PY
            git diff --check
            git add rss.xml
            if ! git diff --cached --quiet; then
              git commit -m 'Doplnit nejnovější volební článek na začátek RSS'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$pushed" = 1

      - name: Nasadit pouze RSS na OVH
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            rss.xml ubuntu@57.129.43.215:/tmp/nasekadan-rss-election.xml
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          sudo install -m 0644 /tmp/nasekadan-rss-election.xml /var/www/nasekadan/rss.xml
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nasekadan-rss-election.xml nasekadan-web:/usr/share/nginx/html/rss.xml
          fi
          rm -f /tmp/nasekadan-rss-election.xml
          REMOTE

      - name: Veřejně ověřit všechny požadované podmínky
        shell: bash
        run: |
          set -euo pipefail
          pin='/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          latest='/clanky/komunalni-volby-kadan-kandidaty-lhuta-2026.html'
          ok=0
          for attempt in $(seq 1 15); do
            q="${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            home="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/?rssrepair=$q" || true)"
            article="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz${pin}?rssrepair=$q" || true)"
            archive="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/clanky/?rssrepair=$q" || true)"
            rss="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/rss.xml?rssrepair=$q" || true)"
            forecast="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/api/pocasi-predpoved.json?rssrepair=$q" || true)"
            if PIN="$pin" LATEST="$latest" HOME_HTML="$home" ARTICLE_HTML="$article" ARCHIVE_HTML="$archive" RSS_XML="$rss" FORECAST_JSON="$forecast" python3 - <<'PY'
          import json, os, re
          from xml.etree import ElementTree as ET
          pin=os.environ['PIN']; latest=os.environ['LATEST']; home=os.environ['HOME_HTML']; article=os.environ['ARTICLE_HTML']
          archive=os.environ['ARCHIVE_HTML']; rss=os.environ['RSS_XML']; forecast=os.environ['FORECAST_JSON']
          hero=re.search(r'<section class="wrap hero" id="clanky".*?</section>',home,re.S)
          assert hero and f'data-latest-article-href="{pin}"' in hero.group(0)
          aside=re.search(r'<aside class="current-aside">.*?</aside>',hero.group(0),re.S)
          assert aside and f'href="{latest}"' in aside.group(0)
          first_archive=re.search(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="([^"]+)"',archive,re.S)
          assert first_archive and first_archive.group(1)==latest
          assert 'article:published_time" content="2026-08-03T22:05:00+02:00"' in article
          assert '/pocasi.js' in home
          root=ET.fromstring(rss)
          links=[node.findtext('link') for node in root.findall('./channel/item')]
          assert links and links[0]=='https://nasekadan.cz'+latest
          assert links.count('https://nasekadan.cz'+latest)==1
          data=json.loads(forecast); ts=data.get('properties',{}).get('timeseries')
          assert isinstance(ts,list) and ts
          print(len(ts))
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1

      - name: Oznámit výsledek a uzavřít požadavek
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo petrkotab666/nasekadan --body "SUCCESS run=$RUN_ID: připnutí titulky obnoveno; boční blok i archiv ukazují nejnovější volební článek; RSS bylo chronologicky opraveno bez připnutí; původní datum článku a počasí jsou v pořádku."
          gh issue close "$ISSUE_NUMBER" --repo petrkotab666/nasekadan --reason completed
