name: Publikovat článek o softwaru Nemocnice Kadaň

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publikovat ihned bez kontroly termínu
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-nemocnice-software-2026-07-26
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit termín a připravit článek
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          target='2026-07-26T03:00:00Z'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          force='${{ inputs.force || false }}'

          if [[ -f clanky/nemocnice-kadan-software-kyberbezpecnost.html ]]; then
            echo 'Článek už je publikovaný.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$force" != 'true' && "$now" < "$target" ]]; then
            echo "Na publikaci je ještě brzy: $now"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -s .github/drafts/nemocnice-kadan-software-kyberbezpecnost.html
          cp .github/drafts/nemocnice-kadan-software-kyberbezpecnost.html clanky/nemocnice-kadan-software-kyberbezpecnost.html

          python3 - <<'PY'
          from pathlib import Path

          path = Path('clanky/nemocnice-kadan-software-kyberbezpecnost.html')
          text = path.read_text(encoding='utf-8')
          teaser = '''
          <section id="pondelni-clanek" style="margin:44px 0 24px;padding:28px;border-radius:20px;background:linear-gradient(135deg,#14232d,#355d70 62%,#9f2626);color:#fff;box-shadow:0 18px 45px rgba(20,35,45,.20)">
            <p style="margin:0 0 8px;color:#ffd9d9;font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase">PONDĚLÍ V 5:00 · NAVAZUJÍCÍ ANALÝZA</p>
            <h2 style="margin:0 0 12px;color:#fff;font:800 32px/1.15 Georgia,serif">Kdo nastavil nákupy léčiv od AVIES? Nemocnice za sedm let zaplatila téměř 170 milionů</h2>
            <p style="margin:0 0 16px;color:#edf3f5;font-size:18px">Zmapovali jsme dlouhodobý vztah nemocnice s AVIES, jednotlivá vedení, konsignační sklad i chybějící veřejně dohledatelný dokument pro dodávky v roce 2024.</p>
            <span data-avies-teaser-state="scheduled" style="display:inline-block;padding:10px 14px;border:1px solid rgba(255,255,255,.4);border-radius:999px;color:#fff;font-weight:900">Vyjde v pondělí 27. 7. v 5:00</span>
          </section>
          '''
          marker = '  <div class="source-list">'
          if 'id="pondelni-clanek"' not in text:
              if marker not in text:
                  raise SystemExit('Článek nemá blok zdrojů pro vložení upoutávky.')
              text = text.replace(marker, teaser + marker, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

          python3 scripts/finalize_launch.py
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Uložit veřejnou verzi
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add clanky/nemocnice-kadan-software-kyberbezpecnost.html sitemap.xml robots.txt analytics.js 404.html o-webu navstevnost ochrana-osobnich-udaju style.css
          git commit -m 'Publikovat: 64,7 milionu za software v Nemocnici Kadaň'
          git push origin main

      - name: Potvrdit výsledek
        if: steps.prepare.outputs.changed == 'true'
        run: echo 'Článek byl zveřejněn 26. 7. 2026 od 5:00 SELČ a změna spustila produkční nasazení.'
