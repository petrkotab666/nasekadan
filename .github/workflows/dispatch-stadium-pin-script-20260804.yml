name: Spustit ruční obnovu připnutí zimního stadionu

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == '[pin-run] Obnovit zimní stadion na titulce'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Spustit obnovovací workflow a zapsat číslo běhu
        run: |
          set -euo pipefail
          issue='${{ github.event.issue.number }}'
          gh workflow run restore-stadium-pin-script-dispatch.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$issue"
          run_id=''
          for attempt in $(seq 1 20); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow restore-stadium-pin-script-dispatch.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 3
          done
          test -n "$run_id"
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Obnova připnutí byla spuštěna. GitHub Actions run: ${run_id}"
