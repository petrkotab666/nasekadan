name: Opravit čitelnost výsledků ankety o sečení

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_greenery_poll_contrast.py'
      - '.github/greenery-poll-contrast-trigger.txt'
      - '.github/workflows/fix-greenery-poll-contrast.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fix-greenery-poll-contrast
  cancel-in-progress: true

env:
  ARTICLE: clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  NUCLEAR_ARTICLE: clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
  VERSION: 20260801-poll-system-v4
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  repair-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Načíst main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit kontrast a ověřit zdroje
        run: |
          set -euo pipefail
          python3 scripts/fix_greenery_poll_contrast.py
          node --check site.js
          grep -Fq 'POLL_GREENERY_HIGH_CONTRAST_V4' site.js
          grep -Fq '[data-poll-id="sekani-travniku-kadan-2026"] .poll-result-label' site.js
          grep -Fq 'color:#ffffff!important' site.js
          grep -Fq 'color:#eef8fb!important' site.js
          grep -Fq "/site.js?v=${VERSION}" "$ARTICLE"

      - name: Uložit trvalou opravu
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kontrast ankety'
          git config user.email 'info@nasekadan.cz'
          git add site.js "$ARTICLE" "$NUCLEAR_ARTICLE" \
            .github/drafts/jaderne-tusimice-smr-voda-doprava-eia-2026.html \
            scripts/install_poll_system_v2.py \
            scripts/prepare_greenery_publication_20260801.py \
            scripts/fix_poll_stale_browser_state.py \
            scripts/repair_greenery_publication_now.sh \
            scripts/fix_greenery_poll_contrast.py
          if ! git diff --cached --quiet; then
            git commit -m 'Zvýšit kontrast výsledků ankety o sečení [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 5 ]] && exit 1
              sleep $((attempt * 4))
            done
          fi
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/fix_greenery_poll_contrast.py

      - name: Připravit SSH klíč
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit opravený styl na OVH
        id: deploy
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-poll-contrast"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky"
          cp site.js "$bundle/site.js"
          cp "$ARTICLE" "$bundle/clanky/"
          cp "$NUCLEAR_ARTICLE" "$bundle/clanky/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-poll-contrast
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -m 0644 /tmp/nk-poll-contrast/site.js /var/www/nasekadan/site.js
          sudo install -m 0644 /tmp/nk-poll-contrast/clanky/sekani-travniku-kadan-spravci-vysky-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-poll-contrast/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html /var/www/nasekadan/clanky/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-poll-contrast/site.js nasekadan-web:/usr/share/nginx/html/site.js
            sudo docker cp /tmp/nk-poll-contrast/clanky/sekani-travniku-kadan-spravci-vysky-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp /tmp/nk-poll-contrast/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
          fi
          grep -Fq 'POLL_GREENERY_HIGH_CONTRAST_V4' /var/www/nasekadan/site.js
          grep -Fq '/site.js?v=20260801-poll-system-v4' /var/www/nasekadan/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
          rm -rf /tmp/nk-poll-contrast
          REMOTE

      - name: Veřejně ověřit skutečné barvy textu
        id: verify
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock jsdom@24 >/dev/null
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 18); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/$ARTICLE?v=${stamp}-${attempt}" || true)"
            js="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/site.js?v=${stamp}-${attempt}" || true)"
            if ARTICLE_HTML="$article" SITE_JS="$js" node <<'NODE'
          const {JSDOM}=await import('jsdom');
          const article=process.env.ARTICLE_HTML||'';
          const js=process.env.SITE_JS||'';
          if(!article.includes('/site.js?v=20260801-poll-system-v4'))process.exit(1);
          if(!js.includes('POLL_GREENERY_HIGH_CONTRAST_V4'))process.exit(1);
          const dom=new JSDOM(article,{url:'https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html',runScripts:'outside-only',pretendToBeVisual:true});
          const w=dom.window;
          w.fetch=async()=>({ok:true,json:async()=>({ok:true,pollId:'sekani-travniku-kadan-2026',total:1,counts:{'podle-lokality':1},percentages:{'podle-lokality':100}})});
          w.eval(js);
          w.document.dispatchEvent(new w.Event('DOMContentLoaded',{bubbles:true}));
          await new Promise(r=>setTimeout(r,100));
          const label=w.document.querySelector('.poll-result-label');
          const value=w.document.querySelector('.poll-result-value');
          const heading=w.document.querySelector('.poll-results-head strong');
          const status=w.document.querySelector('.poll-results-status');
          if(!label||!value||!heading||!status)process.exit(1);
          const colors=[label,value,heading,status].map(el=>w.getComputedStyle(el).color.replace(/\s/g,''));
          const ok=colors[0]==='rgb(255,255,255)' && colors[1]==='rgb(238,248,251)' && colors[2]==='rgb(255,255,255)' && colors[3]==='rgb(238,248,251)';
          console.log({colors,text:w.document.querySelector('.poll-results')?.textContent.replace(/\s+/g,' ').trim()});
          process.exit(ok?0:1);
NODE
            then
              echo 'contrast_ok=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo 'contrast_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Zapsat stav opravy
        if: always()
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.verify.outputs.contrast_ok }}
          DEPLOY: ${{ steps.deploy.outcome }}
        with:
          script: |
            const ok=process.env.OK==='true';
            const path='.github/greenery-poll-contrast-status.json';
            const payload={status:ok?'passed':'failed',checkedAtUtc:new Date().toISOString(),runId:context.runId,sourceSha:context.sha,serverDeploy:process.env.DEPLOY||'skipped',whiteHeadingAndLabels:ok,lightCountsAndStatus:ok,cacheVersion:'20260801-poll-system-v4',article:'https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html'};
            const content=Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64');
            let sha;try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat kontrast ankety o sečení: ${payload.status} [skip ci]`,content,...(sha?{sha}:{})});
            const title='Výsledky ankety o sečení jsou špatně čitelné';
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=issues.find(issue=>issue.title===title);
            if(ok&&existing)await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed'});
            if(!ok&&!existing)await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body:`Kontrast výsledků ankety nebyl veřejně potvrzen.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
