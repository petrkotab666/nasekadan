name: Opravit pořadí článků v3

on:
  push:
    branches: [main]
    paths:
      - '.github/fix-article-order-v3-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nasekadan-article-order-v3
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Očistit generátory a odstranit připínací automaty
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name 'Naše Kadaň – oprava pořadí v3'
          git config user.email 'info@nasekadan.cz'

          python3 - <<'PY'
          from pathlib import Path
          import re

          engine_path = Path('scripts/enforce_article_visibility.py')
          engine = engine_path.read_text(encoding='utf-8')
          engine = re.sub(r'^HOMEPAGE_PIN_HREF\s*=.*\n?', '', engine, flags=re.M)
          engine = re.sub(r'^HOMEPAGE_PIN_UNTIL\s*=.*\n?', '', engine, flags=re.M)
          engine = re.sub(r'^HOMEPAGE_PIN_MARKER\s*=.*\n?', '', engine, flags=re.M)
          engine, n = re.subn(
              r"    homepage_order = list\(articles\)\n.*?    homepage_articles = homepage_order\[:HOME_TOTAL\]",
              "    homepage_order = list(articles)\n    homepage_articles = homepage_order[:HOME_TOTAL]",
              engine,
              count=1,
              flags=re.S,
          )
          if n != 1 or 'HOMEPAGE_PIN_' in engine or 'pin_active' in engine:
              raise SystemExit('Generátor titulky nebyl jednoznačně očištěn.')
          compile(engine, str(engine_path), 'exec')
          engine_path.write_text(engine, encoding='utf-8', newline='\n')

          all_path = Path('scripts/enforce_all_article_visibility.py')
          all_text = all_path.read_text(encoding='utf-8')
          all_text, n1 = re.subn(
              r"    # NK-TEMP-STADIUM-PIN-20260804:.*?    engine\.main\(\)\n",
              "    # Jediné pořadí: article:published_time sestupně.\n    engine.article_info = safe_article_info\n    engine.main()\n",
              all_text,
              count=1,
              flags=re.S,
          )
          all_text, n2 = re.subn(r"    expected_hero = .*", "    expected_hero = latest", all_text, count=1)
          all_text = re.sub(
              r"\n    if pin_active:\n.*?\n    expected_home",
              "\n\n    expected_home",
              all_text,
              count=1,
              flags=re.S,
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Úplná pojistka nebyla očištěna: {n1}, {n2}')
          for token in ('HOMEPAGE_PIN_', 'pin_active', 'pin_href', 'NK-TEMP-STADIUM-PIN'):
              if token in all_text:
                  raise SystemExit(f'Zakázaný token zůstal v pojistce: {token}')
          compile(all_text, str(all_path), 'exec')
          all_path.write_text(all_text, encoding='utf-8', newline='\n')

          guard_path = Path('.github/workflows/article-integrity-guard.yml')
          guard = guard_path.read_text(encoding='utf-8')
          guard = guard.replace(
              "          current = Path('.github/workflows/article-integrity-guard.yml')\n          removed=[]",
              "          current = Path('.github/workflows/article-integrity-guard.yml')\n          canonical = {Path('scripts/enforce_article_visibility.py'), Path('scripts/enforce_all_article_visibility.py')}\n          removed=[]",
              1,
          )
          guard = guard.replace(
              "                  if not path.is_file() or path == current:\n                      continue",
              "                  if not path.is_file() or path == current or path in canonical:\n                      continue",
              1,
          )
          if 'or path in canonical' not in guard:
              raise SystemExit('Aktivní pojistku se nepodařilo zabezpečit proti smazání generátorů.')
          guard_path.write_text(guard, encoding='utf-8', newline='\n')

          current = Path('.github/workflows/fix-article-order-v3-20260804.yml')
          removed=[]
          for path in list(Path('.github/workflows').glob('*.yml')):
              if path in (current, guard_path):
                  continue
              name = path.name.lower()
              text = path.read_text(encoding='utf-8', errors='ignore').lower()
              if (('stadium' in name and 'pin' in name) or
                  ('stadium' in text and ('homepage_pin_' in text or 'nk-temp-stadium-pin' in text or 'připnutí zimního stadionu' in text))):
                  path.unlink()
                  removed.append(str(path))
          for path in list(Path('scripts').glob('*')):
              if not path.is_file() or path in (engine_path, all_path):
                  continue
              name = path.name.lower()
              text = path.read_text(encoding='utf-8', errors='ignore').lower()
              if ('stadium' in name and 'pin' in name) or 'nk-temp-stadium-pin' in text:
                  path.unlink()
                  removed.append(str(path))

          Path('data/article-order-policy.json').write_text(
              '{\n  "rule": "article:published_time descending",\n  "manualPinsAllowed": false,\n  "updatesChangeOrder": false,\n  "appliesTo": ["homepage", "archive", "rss"]\n}\n',
              encoding='utf-8'
          )
          print('Odstraněno:', *sorted(removed), sep='\n')
          PY

          python3 -m py_compile scripts/enforce_article_visibility.py scripts/enforce_all_article_visibility.py
          python3 scripts/enforce_all_article_visibility.py
          git diff --check
          grep -R -n -E 'HOMEPAGE_PIN_|NK-TEMP-STADIUM-PIN' scripts/enforce_article_visibility.py scripts/enforce_all_article_visibility.py && exit 1 || true

          python3 - <<'PY' > "$RUNNER_TEMP/order.txt"
          from pathlib import Path
          import importlib.util, re
          spec=importlib.util.spec_from_file_location('v',Path('scripts/enforce_article_visibility.py'))
          v=importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          items=[]
          for p in Path('clanky').glob('*.html'):
              if p.name=='index.html' or re.fullmatch(r'strana-\d+\.html',p.name): continue
              x=v.article_info(p)
              if x: items.append(x)
          items.sort(key=lambda x:x['dt'],reverse=True)
          for x in items[:3]: print(x['href'])
          PY
          mapfile -t ORDER < "$RUNNER_TEMP/order.txt"
          echo "latest=${ORDER[0]}" >> "$GITHUB_OUTPUT"
          echo "second=${ORDER[1]}" >> "$GITHUB_OUTPUT"
          echo "third=${ORDER[2]}" >> "$GITHUB_OUTPUT"

          git add -A
          git commit -m 'Definitivně obnovit pořadí článků podle prvního zveřejnění'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 5
            git fetch origin main
            git rebase origin/main
          done
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Nasadit opravené pořadí
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          mkdir -p "$RUNNER_TEMP/order-bundle/clanky" "$RUNNER_TEMP/order-bundle/data"
          cp index.html rss.xml sitemap.xml "$RUNNER_TEMP/order-bundle/"
          cp clanky/*.html "$RUNNER_TEMP/order-bundle/clanky/"
          cp data/article-order-policy.json "$RUNNER_TEMP/order-bundle/data/"
          cat > "$RUNNER_TEMP/order-bundle/deployment-health.txt" <<EOF
          status=ok
          source=${{ steps.patch.outputs.source_sha }}
          article_order=published-time-only
          latest=${{ steps.patch.outputs.latest }}
          second=${{ steps.patch.outputs.second }}
          third=${{ steps.patch.outputs.third }}
          EOF
          tar -C "$RUNNER_TEMP/order-bundle" -czf "$RUNNER_TEMP/order-bundle.tgz" .
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$RUNNER_TEMP/order-bundle.tgz" ubuntu@57.129.43.215:/tmp/order-bundle.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          rm -rf /tmp/order-bundle
          mkdir -p /tmp/order-bundle
          tar -xzf /tmp/order-bundle.tgz -C /tmp/order-bundle
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          sudo cp -a /tmp/order-bundle/. /var/www/nasekadan/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then sudo docker cp /tmp/order-bundle/. nasekadan-web:/usr/share/nginx/html/; fi
          rm -rf /tmp/order-bundle /tmp/order-bundle.tgz
          REMOTE

      - name: Veřejně ověřit první tři články
        id: verify
        shell: bash
        env:
          LATEST: ${{ steps.patch.outputs.latest }}
          SECOND: ${{ steps.patch.outputs.second }}
          THIRD: ${{ steps.patch.outputs.third }}
          SOURCE: ${{ steps.patch.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,time
          from urllib.request import Request,urlopen
          latest=os.environ['LATEST'];second=os.environ['SECOND'];third=os.environ['THIRD'];source=os.environ['SOURCE']
          def get(url):
              with urlopen(Request(url,headers={'User-Agent':'NK order v3 audit','Cache-Control':'no-cache'}),timeout=40) as r:return r.read().decode('utf-8','replace')
          last=''
          for attempt in range(15):
              q=f'{int(time.time())}-{attempt}'
              try:
                  home=get(f'https://nasekadan.cz/?orderv3={q}')
                  archive=get(f'https://nasekadan.cz/clanky/?orderv3={q}')
                  health=get(f'https://nasekadan.cz/deployment-health.txt?orderv3={q}')
                  hero=re.search(r'<section\b[^>]*class="[^"]*\bhero\b[^"]*"[^>]*id="clanky"[^>]*>.*?</section>',home,re.S|re.I)
                  if not hero or f'data-latest-article-href="{latest}"' not in hero.group(0):raise RuntimeError('hero')
                  aside=re.search(r'<aside\b[^>]*class="[^"]*current-aside[^"]*"[^>]*>.*?</aside>',hero.group(0),re.S|re.I)
                  if not aside or second not in aside.group(0):raise RuntimeError('aside')
                  cards=re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="(/clanky/[^"]+\.html)".*?</article>',home,re.S|re.I)
                  arch=re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="(/clanky/[^"]+\.html)".*?</article>',archive,re.S|re.I)
                  if not cards or cards[0]!=third:raise RuntimeError(str(cards[:3]))
                  if arch[:3]!=[latest,second,third]:raise RuntimeError(str(arch[:5]))
                  if f'source={source}' not in health or 'article_order=published-time-only' not in health:raise RuntimeError('health')
                  print('OK',latest,second,third)
                  break
              except Exception as e:last=str(e);time.sleep(8)
          else:raise SystemExit('Ověření selhalo: '+last)
          PY

      - name: Zapsat chybu
        if: failure()
        shell: bash
        run: |
          title='[incident] Pořadí článků Naše Kadaň v3'
          body="Oprava v3 selhala. Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
