name: Opravit kanonickou evidenci po článku o uzavírce II/225

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-index-repair-20260803.yml'

permissions:
  contents: write

concurrency:
  group: nasekadan-canonical-index-repair-20260803
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SERVER: 57.129.43.215
      NEW_URL: https://nasekadan.cz/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html
      NEW_PATH: clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html
      WORKFLOW_PATH: .github/workflows/canonical-index-repair-20260803.yml
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Opravit chronologické pořadí RSS
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import email.utils, re
          from pathlib import Path

          path = Path('rss.xml')
          text = path.read_text(encoding='utf-8')
          blocks = re.findall(r'<item\b.*?</item>', text, flags=re.S)
          if not blocks:
              raise SystemExit('RSS neobsahuje žádné položky')
          first = text.index(blocks[0])
          last = text.rindex(blocks[-1]) + len(blocks[-1])

          def item_date(block):
              m = re.search(r'<pubDate>(.*?)</pubDate>', block, flags=re.S)
              if not m:
                  raise SystemExit('Položka RSS nemá pubDate')
              dt = email.utils.parsedate_to_datetime(m.group(1).strip())
              return dt.timestamp()

          ordered = sorted(blocks, key=item_date, reverse=True)
          rebuilt = text[:first] + '\n\n    '.join(ordered) + text[last:]
          path.write_text(rebuilt, encoding='utf-8')

          first_link = re.search(r'<item\b.*?<link>(.*?)</link>', rebuilt, flags=re.S)
          expected = 'https://nasekadan.cz/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html'
          if not first_link or first_link.group(1).strip() != expected:
              raise SystemExit(f'Nejnovější článek není první v RSS: {first_link.group(1).strip() if first_link else None}')
          PY

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit opravené RSS
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            rss.xml "ubuntu@$SERVER:/tmp/nasekadan-rss.xml"
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "ubuntu@$SERVER" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -m 0644 /tmp/nasekadan-rss.xml /var/www/nasekadan/rss.xml
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nasekadan-rss.xml nasekadan-web:/usr/share/nginx/html/rss.xml
          fi
          rm -f /tmp/nasekadan-rss.xml
          REMOTE

      - name: Veřejně ověřit všechny publikační plochy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python <<'PY'
          import json, re, time
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          BASE = 'https://nasekadan.cz/'
          NEW = 'https://nasekadan.cz/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html'
          s = requests.Session()
          s.headers.update({'User-Agent':'NaseKadanCanonicalRepair/1.0','Cache-Control':'no-cache'})

          def get(path, attempt):
              url = urljoin(BASE, path)
              r = s.get(url, timeout=30, params={'canonical_repair': f'{datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")}-{attempt}'})
              r.raise_for_status()
              return r.text

          def html_urls(text):
              soup = BeautifulSoup(text, 'lxml')
              out = []
              for a in soup.select('a[href]'):
                  u = urljoin(BASE, a.get('href'))
                  if re.fullmatch(r'https://nasekadan\.cz/clanky/[^/]+\.html', u):
                      out.append(u)
              return list(dict.fromkeys(out))

          def xml_urls(text, rss=False):
              soup = BeautifulSoup(text, 'xml')
              nodes = soup.select('item > link') if rss else soup.select('loc')
              return [n.get_text(strip=True) for n in nodes]

          last = None
          for attempt in range(1, 31):
              home = get('/', attempt)
              archive = get('/clanky/', attempt)
              rss = get('/rss.xml', attempt)
              sitemap = get('/sitemap.xml', attempt)
              news = get('/news-sitemap.xml', attempt)
              health = get('/deployment-health.txt', attempt)
              article = get('/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html', attempt)

              home_urls = html_urls(home)
              archive_urls = html_urls(archive)
              rss_urls = xml_urls(rss, rss=True)
              sitemap_urls = xml_urls(sitemap)
              news_urls = xml_urls(news)
              h1 = BeautifulSoup(article, 'lxml').find('h1')
              health_sha = re.search(r'\b[0-9a-f]{40}\b', health)
              last = {
                  'homepage': len(home_urls), 'archive': len(archive_urls), 'rss': len(rss_urls),
                  'sitemap_has_new': NEW in sitemap_urls, 'news_has_new': NEW in news_urls,
                  'order_match': archive_urls == rss_urls, 'health_sha': bool(health_sha),
                  'h1': h1.get_text(' ', strip=True) if h1 else None,
              }
              if (
                  NEW in home_urls and NEW in archive_urls and NEW in rss_urls
                  and NEW in sitemap_urls and NEW in news_urls
                  and len(archive_urls) == 43 and len(rss_urls) == 43
                  and archive_urls == rss_urls
                  and h1 and h1.get_text(' ', strip=True) == 'Dva přejezdy, dva termíny: silnice Žatec–Kadaň se zavře už 4. srpna'
                  and health_sha
              ):
                  print(json.dumps(last, ensure_ascii=False))
                  raise SystemExit(0)
              time.sleep(5)
          raise SystemExit('Veřejné ověření neprošlo: ' + json.dumps(last, ensure_ascii=False))
          PY

      - name: Doplnit nový veřejný článek do kanonického registru
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import hashlib, json, re, subprocess
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          BASE = 'https://nasekadan.cz/'
          NEW = 'https://nasekadan.cz/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html'
          INDEX = Path('data/published-content-index.json')
          s = requests.Session()
          s.headers.update({'User-Agent':'NaseKadanCanonicalRepair/1.0','Cache-Control':'no-cache'})
          stamp = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')

          def get(path):
              r = s.get(urljoin(BASE, path), timeout=30, params={'canonical_registry': stamp})
              r.raise_for_status()
              return r.text

          def html_urls(text):
              soup = BeautifulSoup(text, 'lxml')
              out = []
              for a in soup.select('a[href]'):
                  u = urljoin(BASE, a.get('href'))
                  if re.fullmatch(r'https://nasekadan\.cz/clanky/[^/]+\.html', u):
                      out.append(u)
              return list(dict.fromkeys(out))

          def xml_urls(text, rss=False):
              soup = BeautifulSoup(text, 'xml')
              nodes = soup.select('item > link') if rss else soup.select('loc')
              return [n.get_text(strip=True) for n in nodes]

          home_html = get('/')
          archive_html = get('/clanky/')
          rss_xml = get('/rss.xml')
          sitemap_xml = get('/sitemap.xml')
          news_xml = get('/news-sitemap.xml')
          health_text = get('/deployment-health.txt')
          home_urls = html_urls(home_html)
          archive_urls = html_urls(archive_html)
          rss_urls = xml_urls(rss_xml, rss=True)
          sitemap_urls = xml_urls(sitemap_xml)
          news_urls = xml_urls(news_xml)

          data = json.loads(INDEX.read_text(encoding='utf-8'))
          articles = data.get('articles', [])
          by_url = {a['url']: a for a in articles}
          missing = [u for u in archive_urls if u not in by_url]
          stale = [u for u in by_url if u not in archive_urls]
          if stale:
              raise SystemExit(f'Registr obsahuje neveřejné URL: {stale}')
          if missing not in ([NEW], []):
              raise SystemExit(f'Neočekávané chybějící články: {missing}')

          if NEW not in by_url:
              fingerprint = hashlib.sha256('doprava|silnice-ii-225|zeleznicni-prejezdy|zatec-kadan|2026-08'.encode()).hexdigest()[:24]
              by_url[NEW] = {
                  'title': 'Dva přejezdy, dva termíny: silnice Žatec–Kadaň se zavře už 4. srpna',
                  'h1': 'Dva přejezdy, dva termíny: silnice Žatec–Kadaň se zavře už 4. srpna',
                  'url': NEW,
                  'published_at': '2026-08-03T18:35:00+02:00',
                  'modified_at': '2026-08-03T18:35:00+02:00',
                  'persons': [],
                  'organizations': ['Město Žatec', 'Městský úřad Žatec', 'Doprava Ústeckého kraje'],
                  'places': ['Žatec', 'Kadaň', 'Žabokliky', 'Nové Sedlo', 'Břežany'],
                  'cases': ['Uzavírka železničního přejezdu na silnici II/225', 'Navazující uzavírka přejezdu Žabokliky'],
                  'topics': ['Doprava', 'Silniční uzavírky', 'Železniční přejezdy', 'Veřejná autobusová doprava'],
                  'fingerprint': fingerprint,
                  'status': {},
                  'source_path': 'clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html',
                  'publication_status': 'published',
                  'source_commit': '',
              }

          h1_map = {}
          for url in archive_urls:
              article = by_url[url]
              html = get(url.removeprefix(BASE))
              soup = BeautifulSoup(html, 'lxml')
              h1 = soup.find('h1')
              if not h1:
                  raise SystemExit(f'Chybí H1: {url}')
              h1_text = ' '.join(h1.get_text(' ', strip=True).split())
              h1_map[url] = h1_text
              article['title'] = h1_text
              article['h1'] = h1_text
              pub = soup.find('meta', attrs={'property':'article:published_time'})
              mod = soup.find('meta', attrs={'property':'article:modified_time'})
              if pub and pub.get('content'):
                  article['published_at'] = pub['content']
              if mod and mod.get('content'):
                  article['modified_at'] = mod['content']
              article['status'] = {
                  'homepage': url in home_urls,
                  'archive': url in archive_urls,
                  'rss': url in rss_urls,
                  'sitemap': url in sitemap_urls,
                  'news_sitemap': url in news_urls,
              }
              article['publication_status'] = 'published'
              source_path = article.get('source_path')
              if source_path and Path(source_path).exists():
                  sha = subprocess.check_output(['git','log','-1','--format=%H','--',source_path], text=True).strip()
                  if sha:
                      article['source_commit'] = sha

          articles = [by_url[u] for u in archive_urls]
          indexed_urls = [a['url'] for a in articles]
          url_counts = Counter(indexed_urls)
          fp_counts = Counter(a.get('fingerprint') for a in articles if a.get('fingerprint'))
          duplicate_urls = sorted(u for u,c in url_counts.items() if c > 1)
          duplicate_fps = sorted(f for f,c in fp_counts.items() if c > 1)
          required = ('title','h1','url','published_at','modified_at','persons','organizations','places','cases','topics','fingerprint','status','source_commit')
          required_complete = all(all(k in a and a[k] is not None for k in required) for a in articles)
          health_match = re.search(r'\b([0-9a-f]{40})\b', health_text)
          health_sha = health_match.group(1) if health_match else None
          payload = json.dumps({'home':home_urls,'archive':archive_urls,'rss':rss_urls,'sitemap':sitemap_urls,'news':news_urls,'h1':h1_map,'health':health_sha}, ensure_ascii=False, sort_keys=True).encode()
          now = datetime.now(timezone.utc).isoformat()
          trigger = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()

          validation = data.setdefault('validation', {})
          validation.update({
              'homepage_count': len(set(home_urls) & set(indexed_urls)),
              'archive_count': len(archive_urls),
              'rss_count': len(rss_urls),
              'sitemap_all_articles_present': set(indexed_urls).issubset(set(sitemap_urls)),
              'news_sitemap_recent_count': len(set(news_urls) & set(indexed_urls)),
              'deployment_health': 'verified' if health_sha else 'unverified',
              'required_fields_complete': required_complete,
              'duplicate_urls': duplicate_urls,
              'duplicate_fingerprints': duplicate_fps,
              'per_article_source_commits': all(bool(a.get('source_commit')) for a in articles),
              'deployment_health_source': health_sha,
              'public_audit_at': now,
              'public_audit_sha256': hashlib.sha256(payload).hexdigest(),
              'repair_pending_public_verification': False,
              'rss_order_matches_archive': archive_urls == rss_urls,
              'public_repair_verification': {
                  'method': 'direct-ssh-rss-repair-and-external-no-cache-check',
                  'new_article_url': NEW,
                  'archive_articles': len(archive_urls),
                  'rss_articles': len(rss_urls),
                  'sitemap_contains_new': NEW in sitemap_urls,
                  'news_sitemap_contains_new': NEW in news_urls,
                  'new_h1_match': h1_map.get(NEW) == 'Dva přejezdy, dva termíny: silnice Žatec–Kadaň se zavře už 4. srpna',
                  'deployment_health_has_valid_source': bool(health_sha),
                  'completed_at': now,
              },
              'last_registry_refresh': {
                  'reason': 'add newly published road-closure article and repair RSS chronology',
                  'trigger_commit': trigger,
                  'archive_articles': len(archive_urls),
                  'rss_articles': len(rss_urls),
                  'sitemap_articles': len(set(sitemap_urls) & set(indexed_urls)),
                  'news_sitemap_articles': len(set(news_urls) & set(indexed_urls)),
                  'completed_at': now,
              },
          })
          data['articles'] = articles
          data['generated_at'] = now
          data['source_commit'] = trigger
          data['article_count'] = len(articles)
          data['schema_version'] = '1.4'

          if len(articles) != 43 or len(archive_urls) != 43 or len(rss_urls) != 43:
              raise SystemExit(f'Počet článků není 43: registr={len(articles)} archiv={len(archive_urls)} rss={len(rss_urls)}')
          if archive_urls != rss_urls:
              raise SystemExit('RSS pořadí se neshoduje s archivem')
          if duplicate_urls or duplicate_fps or not required_complete:
              raise SystemExit(f'Validace registru selhala: URL={duplicate_urls}, FP={duplicate_fps}, required={required_complete}')
          if not set(indexed_urls).issubset(set(sitemap_urls)) or NEW not in news_urls:
              raise SystemExit('Sitemapy nejsou úplné')

          INDEX.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('.github/workflows/canonical-index-repair-20260803.yml').unlink()
          PY

      - name: Uložit opravu a odstranit jednorázový workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonický audit'
          git config user.email 'actions@users.noreply.github.com'
          git add rss.xml data/published-content-index.json "$WORKFLOW_PATH"
          git commit -m 'Doplnit 43. článek a opravit pořadí RSS [skip ci]'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          exit 1
