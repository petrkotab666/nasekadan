name: Spustit opravu kompletního monitoringu přes issue

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: write
  issues: write

jobs:
  trigger:
    if: github.event.issue.title == 'Spustit opravu kompletního monitoringu'
    runs-on: ubuntu-latest
    steps:
      - name: Spustit opravný workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run repair-and-rerun-complete-monitoring.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 10
          gh run list --repo "$GITHUB_REPOSITORY" --workflow repair-and-rerun-complete-monitoring.yml --limit 1 --json databaseId,status,conclusion,createdAt,url > "$RUNNER_TEMP/run.json"
          cat "$RUNNER_TEMP/run.json"
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const body='Opravný monitoring byl explicitně spuštěn.\n```json\n'+fs.readFileSync(process.env.RUNNER_TEMP+'/run.json','utf8')+'\n```';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
