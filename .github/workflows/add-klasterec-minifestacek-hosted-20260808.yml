name: Add Klasterec Minifestacek hosted fallback

on:
  push:
    branches: [main]
    paths:
      - 'data/add-klasterec-minifestacek-hosted-20260808.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch current culture article
        run: python3 scripts/add_klasterec_minifestacek_20260808.py
      - name: Commit to main
        run: |
          git config user.name "nasekadan-bot"
          git config user.email "nasekadan-bot@users.noreply.github.com"
          git add clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html
          if git diff --cached --quiet; then
            echo "Already present"
          else
            git commit -m "Doplň Minifestáček v Loděnici do kulturního přehledu"
            git push origin HEAD:main
          fi
