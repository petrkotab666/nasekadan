name: Opravit tři chybějící články v RSS

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: repair-three-missing-rss-20260804
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'petrkotab666' && github.event.issue.title == '[repair] Doplnit tři chybějící články do RSS'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Zapsat spuštění
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Bezpečná oprava RSS byla spuštěna. Run ${context.runId}.`});

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Doplnit chybějící RSS položky a uložit opravu
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonická oprava RSS'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m py_compile scripts/ensure_recent_rss_entries.py
            python3 scripts/ensure_recent_rss_entries.py
            python3 - <<'PY'
          from pathlib import Path
          import json, re
          rss=Path('rss.xml').read_text(encoding='utf-8')
          registry=json.loads(Path('data/published-content-index.json').read_text(encoding='utf-8'))
          required=[
            'https://nasekadan.cz/clanky/cisarsky-den-kadan-historie-2026.html',
            'https://nasekadan.cz/clanky/josef-suchy-klasterec-u18-kanada-hlinka-2026.html',
            'https://nasekadan.cz/clanky/nemocnice-kadan-kriticky-nedostatek-krve-0-rh-minus-2026.html',
          ]
          links=re.findall(r'<link>\s*(https://nasekadan\.cz/clanky/[^<]+\.html)\s*</link>', rss)
          assert len(links)==len(set(links)), 'RSS obsahuje duplicitní URL'
          assert set(links)=={a['url'] for a in registry['articles']}, 'RSS po opravě neodpovídá registru'
          for url in required:
            assert links.count(url)==1, f'Chybí nebo je duplicitní {url}'
          print(f'RSS ověřeno: {len(links)} unikátních článků.')
          PY
            git add rss.xml
            if git diff --cached --quiet; then
              final_sha="$(git rev-parse HEAD)"
              pushed=1
              echo "rss_sha=$final_sha" >> "$GITHUB_OUTPUT"
              break
            fi
            git commit -m 'Opravit tři chybějící položky kanonického RSS'
            final_sha="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              pushed=1
              echo "rss_sha=$final_sha" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep $((attempt * 4))
          done
          test "$pushed" = 1

      - name: Nasadit opravené RSS na OVH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 rss.xml ubuntu@57.129.43.215:/tmp/nasekadan-rss.xml
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0644 /tmp/nasekadan-rss.xml /var/www/nasekadan/rss.xml
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nasekadan-rss.xml nasekadan-web:/usr/share/nginx/html/rss.xml
          fi
          rm -f /tmp/nasekadan-rss.xml
          REMOTE

      - name: Znovu provést úplný audit a aktualizovat registr
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            result="$(python3 scripts/run_canonical_audit_runtime_v2.py --write)"
            echo "$result"
            git add data/published-content-index.json .github/canonical-content-audit-status.json
            if ! git diff --cached --quiet; then
              git commit -m 'Evidence: potvrdit opravu tří chybějících RSS položek'
            fi
            final_sha="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              pushed=1
              echo "audit_sha=$final_sha" >> "$GITHUB_OUTPUT"
              echo "article_count=$(python3 -c 'import json; print(json.load(open("data/published-content-index.json", encoding="utf-8"))["article_count"])')" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep $((attempt * 4))
          done
          test "$pushed" = 1

      - name: Nasadit aktualizovaný veřejný registr
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 data/published-content-index.json ubuntu@57.129.43.215:/tmp/published-content-index.json
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -d -m 0755 /var/www/nasekadan/data
          sudo install -m 0644 /tmp/published-content-index.json /var/www/nasekadan/data/published-content-index.json
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/data
            sudo docker cp /tmp/published-content-index.json nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
          fi
          rm -f /tmp/published-content-index.json
          REMOTE

      - name: Konečné veřejné ověření všech povinných kanálů
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          python3 scripts/run_canonical_audit_runtime_v2.py
          q="${GITHUB_RUN_ID}-$(date +%s)"
          live_rss="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/rss.xml?v=$q")"
          for url in \
            https://nasekadan.cz/clanky/cisarsky-den-kadan-historie-2026.html \
            https://nasekadan.cz/clanky/josef-suchy-klasterec-u18-kanada-hlinka-2026.html \
            https://nasekadan.cz/clanky/nemocnice-kadan-kriticky-nedostatek-krve-0-rh-minus-2026.html; do
            test "$(grep -Fo "<link>$url</link>" <<<"$live_rss" | wc -l)" -eq 1
          done
          for path in / /clanky/ /sitemap.xml /news-sitemap.xml /deployment-health.txt /data/published-content-index.json; do
            curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz${path}?v=$q" -o /tmp/check
            test -s /tmp/check
          done

      - name: Uzavřít opravu a původní audit
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `Bezpečně opraveno a veřejně ověřeno: do RSS byly doplněny tři již publikované články bez vzniku nové URL. Run ${context.runId}, RSS commit ${{ steps.repair.outputs.rss_sha }}, evidenční commit ${{ steps.audit.outputs.audit_sha }}, článků: ${{ steps.audit.outputs.article_count }}.`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 596, body: `Nalezený nesoulad RSS byl bezpečně opraven navazujícím během ${context.runId}.`});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: 596, state: 'closed', state_reason: 'completed'});

      - name: Zapsat selhání
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Oprava RSS selhala. Run ${context.runId}. Issue zůstává otevřené.`});
