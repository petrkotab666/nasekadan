name: Ověřit newsletter po serverové pojistce
run-name: Počkat na restart služby a jednou otestovat odběr

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-newsletter-after-refresh.yml'
      - '.github/verify-newsletter-after-refresh-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-newsletter-refresh-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Počkat na novou verzi newsletterového API
        id: wait
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/health.json
          deployed=false
          for attempt in $(seq 1 32); do
            body="$(curl -kfsS --max-time 20 "https://nasekadan.cz/api/newsletter/health?refresh-check=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            printf '%s' "$body" > /tmp/health.json
            if jq -e 'has("smtpPasswordSet")' /tmp/health.json >/dev/null 2>&1; then
              deployed=true
              break
            fi
            sleep 30
          done
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"

      - name: Jednou otestovat přihlášení odběru
        id: subscribe
        if: steps.wait.outputs.deployed == 'true'
        shell: bash
        run: |
          set +e
          code="$(curl -ksS --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"email":"PetrKotab@seznam.cz","consent":true}' \
            -o /tmp/subscribe.json \
            -w '%{http_code}' \
            'https://nasekadan.cz/api/newsletter/subscribe')"
          rc=$?
          echo "curl_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "http_code=${code:-0}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Zapsat bezpečný výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          API_DEPLOYED: ${{ steps.wait.outputs.deployed }}
          CURL_RC: ${{ steps.subscribe.outputs.curl_rc }}
          HTTP_CODE: ${{ steps.subscribe.outputs.http_code }}
        with:
          script: |
            const fs = require('fs');
            const read = path => { try { return fs.readFileSync(path, 'utf8').trim(); } catch { return ''; } };
            const parse = text => { try { return JSON.parse(text); } catch { return null; } };
            const health = parse(read('/tmp/health.json'));
            const subscribe = parse(read('/tmp/subscribe.json'));
            const report = {
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              new_api_deployed: process.env.API_DEPLOYED === 'true',
              health,
              subscribe_http_status: Number(process.env.HTTP_CODE || 0),
              subscribe_curl_exit: Number(process.env.CURL_RC || 0),
              subscribe_result: subscribe
            };
            const path = 'newsletter-refresh-verification.json';
            const content = Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: 'Zapsat ověření newsletteru po serverové pojistce',
              content,
              ...(sha ? {sha} : {})
            });

      - name: Vyhodnotit
        if: always()
        shell: bash
        run: |
          test -s /tmp/health.json
