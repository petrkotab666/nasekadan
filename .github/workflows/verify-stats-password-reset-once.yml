name: Jednorázově ověřit obnovu hesla statistik

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-stats-password-reset-once.yml'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RESULT_TITLE: '[OVĚŘENÍ STATISTIK] Obnova hesla přes e-mail'
    steps:
      - uses: actions/checkout@v4

      - name: Počkat na nasazení a ověřit živou stránku
        id: probe
        shell: bash
        run: |
          set +e
          success=0
          : > /tmp/stats-probe.log
          for attempt in $(seq 1 40); do
            echo "Pokus $attempt" | tee -a /tmp/stats-probe.log
            login="$(curl -fsS --max-time 15 'https://nasekadan.cz/statistiky/?verify-reset-v2='"$GITHUB_RUN_ID" 2>>/tmp/stats-probe.log)"
            health="$(curl -fsS --max-time 15 'https://nasekadan.cz/statistiky/healthz?verify-reset-v2='"$GITHUB_RUN_ID" 2>>/tmp/stats-probe.log)"
            if grep -Fq 'Zapomenuté heslo' <<<"$login" && \
               grep -Fq '"auth": "application"' <<<"$health" && \
               grep -Fq '"smtpConfigured": true' <<<"$health"; then
              success=1
              break
            fi
            sleep 15
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Odeslat jeden skutečný test obnovy
        id: email
        if: steps.probe.outputs.success == '1'
        shell: bash
        run: |
          set +e
          body="$(curl -fsS --max-time 30 \
            -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data '' \
            'https://nasekadan.cz/statistiky/zapomenute-heslo' 2>/tmp/stats-email-error.log)"
          code=$?
          if [ "$code" -eq 0 ] && grep -Eq 'Obnovovací odkaz (byl odeslán|už byl nedávno odeslán)' <<<"$body"; then
            echo 'success=1' >> "$GITHUB_OUTPUT"
          else
            echo 'success=0' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Zapsat výsledek do issue
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.probe.outputs.success }}' = '1' ] && [ '${{ steps.email.outputs.success }}' = '1' ]; then
            state='ÚSPĚCH'
            detail='Živá stránka nabízí odkaz Zapomenuté heslo, aplikace hlásí nakonfigurované SMTP a skutečný resetovací e-mail byl vyžádán pouze pro petrkotab@seznam.cz.'
          else
            state='NEÚSPĚCH'
            detail='Jednorázová kontrola nepotvrdila všechny tři kroky: živou přihlašovací stránku, SMTP konfiguraci a přijetí požadavku na reset.'
          fi
          body=$(cat <<EOF
          ## $state

          $detail

          - Commit: \`$GITHUB_SHA\`
          - Běh: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Čas UTC: \`$(date -u +%FT%TZ)\`
          EOF
          )
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$RESULT_TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            [ "$state" = 'ÚSPĚCH' ] && gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed || gh issue reopen "$existing" --repo "$GITHUB_REPOSITORY"
          else
            if [ "$state" = 'ÚSPĚCH' ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$RESULT_TITLE" --body "$body" >/dev/null
              number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$RESULT_TITLE in:title" --json number --jq '.[0].number')"
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed >/dev/null
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$RESULT_TITLE" --body "$body" >/dev/null
            fi
          fi
          [ "$state" = 'ÚSPĚCH' ]
