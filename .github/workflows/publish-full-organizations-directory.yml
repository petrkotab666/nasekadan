name: Zveřejnit kompletní adresář organizací

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-full-organizations-directory.yml'
      - 'organizace/index.html'
      - 'organizace/organizace.js'
      - 'data/organizations.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-organizations-directory
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

    steps:
      - name: Načíst hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit úplnost adresáře
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/organizations.json').read_text(encoding='utf-8'))
          groups = data.get('groups') or []
          count = sum(len(group.get('items') or []) for group in groups)
          text = json.dumps(data, ensure_ascii=False)

          if len(groups) < 7:
              raise SystemExit(f'Adresář má jen {len(groups)} skupin.')
          if count < 60:
              raise SystemExit(f'Adresář má jen {count} položek.')
          required = [
              'Technické služby Kadaň', 'Městská správa sociálních služeb Kadaň',
              'Městské muzeum v Kadani', 'TILIA Kadaň', 'ZŠ Chomutovská Kadaň',
              'MŠ Hvězdička Kadaň', 'Fotbalový klub Tatran Kadaň',
              'Policie ČR – Obvodní oddělení Kadaň'
          ]
          missing = [name for name in required if name not in text]
          if missing:
              raise SystemExit('Chybí povinné položky: ' + ', '.join(missing))

          html = Path('organizace/index.html').read_text(encoding='utf-8')
          js = Path('organizace/organizace.js').read_text(encoding='utf-8')
          if 'organization-search' not in html or 'organization-count' not in html:
              raise SystemExit('Stránka neobsahuje hledání nebo počítadlo.')
          if 'function render' not in js or 'linkLabel' not in js:
              raise SystemExit('Klientský skript neobsahuje nový renderer.')
          print(f'Ověřeno {count} organizací v {len(groups)} skupinách.')
          PY

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit adresář přímo na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            organizace/index.html organizace/organizace.js data/organizations.json \
            ubuntu@57.129.43.215:/tmp/
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/organizace /var/www/nasekadan/data
          sudo install -m 0644 /tmp/index.html /var/www/nasekadan/organizace/index.html
          sudo install -m 0644 /tmp/organizace.js /var/www/nasekadan/organizace/organizace.js
          sudo install -m 0644 /tmp/organizations.json /var/www/nasekadan/data/organizations.json
          rm -f /tmp/index.html /tmp/organizace.js /tmp/organizations.json
          REMOTE

      - name: Ověřit veřejný adresář
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          curl -4 -kfsS --max-time 30 \
            "https://nasekadan.cz/organizace/?check=${token}" \
            -o /tmp/organizations-page.html
          curl -4 -kfsS --max-time 30 \
            "https://nasekadan.cz/organizace/organizace.js?check=${token}" \
            -o /tmp/organizations-script.js
          curl -4 -kfsS --max-time 30 \
            "https://nasekadan.cz/data/organizations.json?check=${token}" \
            -o /tmp/organizations-live.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          page = Path('/tmp/organizations-page.html').read_text(encoding='utf-8', errors='replace')
          script = Path('/tmp/organizations-script.js').read_text(encoding='utf-8', errors='replace')
          data = json.loads(Path('/tmp/organizations-live.json').read_text(encoding='utf-8'))
          count = sum(len(group.get('items') or []) for group in data.get('groups') or [])
          text = json.dumps(data, ensure_ascii=False)

          assert count >= 60, count
          assert 'organization-search' in page
          assert 'organization-count' in page
          assert 'function render' in script
          assert 'Městská správa sociálních služeb Kadaň' in text
          assert 'TILIA Kadaň' in text
          assert 'Fotbalový klub Tatran Kadaň' in text
          print(f'Veřejný adresář potvrzuje {count} položek.')
          PY

      - name: Zapsat stav nasazení
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = '.github/organizations-directory-live-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'passed' : 'failed',
              checkedAtUtc: new Date().toISOString(),
              runId: context.runId,
              sourceSha: context.sha,
              serverDeploy: process.env.DEPLOY_OUTCOME || 'skipped',
              publicVerification: process.env.VERIFY_OUTCOME || 'skipped',
              publicUrl: 'https://nasekadan.cz/organizace/'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat nasazení adresáře organizací: ${status.status} [skip ci]`,
              content,
              ...(sha ? {sha} : {})
            });
