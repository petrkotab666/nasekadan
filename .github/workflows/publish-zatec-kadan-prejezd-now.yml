name: Zveřejnit uzavírky přejezdů Žatec–Kadaň

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_zatec_kadan_prejezd_20260803.py'
      - '.github/workflows/publish-zatec-kadan-prejezd-now.yml'
      - '.github/zatec-kadan-prejezd-publish-trigger.txt'

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-zatec-kadan-prejezd-20260803
  cancel-in-progress: false

env:
  SLUG: silnice-zatec-kadan-prejezd-uzavirka-srpen-2026
  ARTICLE: clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html
  PUBLIC_URL: https://nasekadan.cz/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html
  SOCIAL: social/silnice-zatec-kadan-prejezd-uzavirka-20260803.png
  SOCIAL_URL: https://nasekadan.cz/social/silnice-zatec-kadan-prejezd-uzavirka-20260803.png
  EXPECTED_H1: 'Dva přejezdy, dva termíny: silnice Žatec–Kadaň se zavře už 4. srpna'
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sestavit článek a provést redakční kontrolu
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 -m py_compile scripts/publish_zatec_kadan_prejezd_20260803.py scripts/enforce_article_visibility.py scripts/prepare_discovery.py
          python3 scripts/publish_zatec_kadan_prejezd_20260803.py
          grep -Fq "<h1>${EXPECTED_H1}</h1>" "$ARTICLE"
          grep -Fq '4. srpna 2026 v 7:00' "$ARTICLE"
          grep -Fq '11. srpna 2026 v 6:00' "$ARTICLE"
          grep -Fq 'Jde však o jiný přejezd' "$ARTICLE"
          ! grep -Fqi 'noindex' "$ARTICLE"
          test -s "$SOCIAL"
          for f in index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt; do
            grep -Fq "$PUBLIC_URL" "$f" || grep -Fq "/clanky/${SLUG}.html" "$f"
          done

      - name: Uložit veřejnou verzi do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň publikační automat'
          git config user.email 'info@nasekadan.cz'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/publish_zatec_kadan_prejezd_20260803.py
            git add -- "$ARTICLE" "$SOCIAL" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt
            if git diff --cached --quiet; then
              echo 'Veřejná verze už je v main.'
              break
            fi
            git commit -m 'Publikovat: dva přejezdy a uzavírka silnice Žatec–Kadaň'
            if git push origin HEAD:main; then
              break
            fi
            [[ "$attempt" == 5 ]] && exit 1
            sleep $((attempt * 7))
          done
          git fetch origin main
          git reset --hard origin/main
          test -s "$ARTICLE"
          grep -Fq "<h1>${EXPECTED_H1}</h1>" "$ARTICLE"

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit článek a přehledy na OVH
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          deployed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bundle="$RUNNER_TEMP/nk-zatec-kadan-prejezd"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$SOCIAL" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt "$bundle/"
          printf 'source=%s\ndeployed_at=%s\ndeployer=publish-zatec-kadan-prejezd\n' "$sha" "$deployed" > "$bundle/deployment-health.txt"
          for attempt in 1 2 3; do
            if scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-zatec-kadan-prejezd; then
              break
            fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep $((attempt * 8))
          done
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          src=/tmp/nk-zatec-kadan-prejezd
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 "$src/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html" /var/www/nasekadan/clanky/
          sudo install -m 0644 "$src/clanky/index.html" /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 "$src/social/silnice-zatec-kadan-prejezd-uzavirka-20260803.png" /var/www/nasekadan/social/
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do
            sudo install -m 0644 "$src/$f" "/var/www/nasekadan/$f"
          done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp "$src/clanky/silnice-zatec-kadan-prejezd-uzavirka-srpen-2026.html" nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$src/clanky/index.html" nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker cp "$src/social/silnice-zatec-kadan-prejezd-uzavirka-20260803.png" nasekadan-web:/usr/share/nginx/html/social/
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do
              sudo docker cp "$src/$f" "nasekadan-web:/usr/share/nginx/html/$f"
            done
          fi
          rm -rf "$src"
          REMOTE

      - name: Veřejně ověřit úplnou publikaci
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          success=false
          for attempt in $(seq 1 30); do
            article="$(curl -4 -kfsS --max-time 25 "${PUBLIC_URL}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            llms="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/llms.txt?v=${stamp}-${attempt}" 2>/dev/null || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?v=${stamp}-${attempt}" 2>/dev/null || true)"
            image_code="$(curl -4 -kLsS -o /dev/null -w '%{http_code}' --max-time 25 "${SOCIAL_URL}?v=${stamp}-${attempt}" || true)"
            if grep -Fq "<h1>${EXPECTED_H1}</h1>" <<<"$article" \
              && ! grep -Fqi 'noindex' <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "$PUBLIC_URL" <<<"$rss" \
              && grep -Fq "$PUBLIC_URL" <<<"$sitemap" \
              && grep -Fq "$PUBLIC_URL" <<<"$news" \
              && grep -Fq "$PUBLIC_URL" <<<"$llms" \
              && grep -Fq "source=$sha" <<<"$health" \
              && [[ "$image_code" == 200 ]]; then
              success=true
              break
            fi
            sleep 8
          done
          [[ "$success" == true ]]

      - name: Uzavřít monitorovací stopu
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          comment="Ověřeno a publikováno jako samostatný článek: ${PUBLIC_URL}. Úřední zdroje potvrdily, že termíny 4.–11. 8. a 11.–28. 8. patří dvěma různým přejezdům."
          gh issue comment 554 --repo "$GITHUB_REPOSITORY" --body "$comment" || true
          gh issue edit 554 --repo "$GITHUB_REPOSITORY" --title '[VYŘEŠENO – PUBLIKOVÁNO] Dva přejezdy na trase Žatec–Kadaň' --add-assignee petrkotab666 || true
          gh issue close 554 --repo "$GITHUB_REPOSITORY" --reason completed || true

      - name: Zapsat incident při selhání
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          title='[PUBLIKACE SELHALA] Uzavírka přejezdů Žatec–Kadaň'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null)"
          body="Publikace nebo veřejné ověření článku selhaly. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Cílová URL: ${PUBLIC_URL}."
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee petrkotab666; fi
