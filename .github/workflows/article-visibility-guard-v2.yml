name: Trvalá viditelnost všech článků Naše Kadaň v2

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nasekadan-canonical-article-integrity
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      BLOOD_REL: /clanky/nemocnice-kadan-kriticky-nedostatek-krve-0-rh-minus-2026.html
      STEM_REL: /clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Obnovit titulku, celý archiv a sitemapu z článků
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – pojistka všech článků'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m py_compile \
              scripts/enforce_article_visibility.py \
              scripts/enforce_all_article_visibility.py \
              scripts/audit_canonical_content_runtime.py
            python3 scripts/enforce_all_article_visibility.py
            git diff --check
            git add index.html clanky/index.html sitemap.xml
            find clanky -maxdepth 1 -type f -name 'strana-*.html' -print0 | xargs -0 -r git add --
            if ! git diff --cached --quiet; then
              git commit -m 'Automaticky obnovit viditelnost všech článků'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$pushed" = 1
          git fetch origin main
          git reset --hard origin/main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - "$GITHUB_OUTPUT" <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import importlib.util, re, sys
          root = Path('.')
          spec = importlib.util.spec_from_file_location('visibility', root/'scripts/enforce_article_visibility.py')
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          cutoff = datetime.now(timezone.utc) + timedelta(minutes=2)
          articles = []
          for path in (root/'clanky').glob('*.html'):
              if path.name == 'index.html' or re.fullmatch(r'strana-\d+\.html', path.name):
                  continue
              item = module.article_info(path)
              if not item:
                  continue
              dt = item['dt']
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              if dt.astimezone(timezone.utc) <= cutoff:
                  articles.append(item)
          articles.sort(key=lambda x: x['dt'], reverse=True)
          if not articles:
              raise SystemExit('Nenalezen žádný publikovaný článek.')
          with open(sys.argv[1], 'a', encoding='utf-8') as out:
              out.write(f"article_count={len(articles)}\n")
              out.write(f"latest_rel={articles[0]['href']}\n")
          PY

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit jeden kanonický publikační povrch
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-article-integrity-${GITHUB_RUN_ID}"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/data"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt "$bundle/"
          cp clanky/*.html "$bundle/clanky/"
          cp data/published-content-index.json "$bundle/data/"
          cat > "$bundle/deployment-health.txt" <<EOF
          status=ok
          source=${{ steps.prepare.outputs.source_sha }}
          article_count=${{ steps.prepare.outputs.article_count }}
          latest=${{ steps.prepare.outputs.latest_rel }}
          guard=canonical-all-articles-v2
          deployed_at=$(date -u +%FT%TZ)
          EOF
          tar -C "$bundle" -czf "$RUNNER_TEMP/nk-article-integrity.tgz" .
          remote="/tmp/nk-article-integrity-${GITHUB_RUN_ID}"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/nk-article-integrity.tgz" "ubuntu@57.129.43.215:${remote}.tgz"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 "RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          src="/tmp/nk-article-integrity-${RUN_ID}"
          rm -rf "$src"
          mkdir -p "$src"
          tar -xzf "${src}.tgz" -C "$src"
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/clanky" "$root/data"
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do
            sudo install -m 0644 "$src/$f" "$root/$f"
          done
          for f in "$src"/clanky/*.html; do
            sudo install -m 0644 "$f" "$root/clanky/$(basename "$f")"
          done
          sudo install -m 0644 "$src/data/published-content-index.json" "$root/data/published-content-index.json"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/data
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do
              sudo docker cp "$src/$f" "nasekadan-web:/usr/share/nginx/html/$f"
            done
            sudo docker cp "$src/clanky/." nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$src/data/published-content-index.json" nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
          fi
          rm -rf "$src" "${src}.tgz"
          REMOTE

      - name: Veřejně ověřit všechny články a oba články o dárcovství
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ steps.prepare.outputs.source_sha }}'
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$current" != "$expected" ]]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "Main se během běhu posunul z $expected na $current; novější spuštění provede úplný audit."
            exit 0
          fi
          base=https://nasekadan.cz
          success=0
          for attempt in $(seq 1 12); do
            current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [[ "$current" != "$expected" ]]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              echo "Main se během ověření posunul z $expected na $current; tento běh končí bez falešného incidentu."
              exit 0
            fi
            q="${GITHUB_RUN_ID}-$(date +%s)-${attempt}"
            home="$(curl -4 -kfsSL --max-time 40 "$base/?integrity=$q" || true)"
            archive="$(curl -4 -kfsSL --max-time 40 "$base/clanky/?integrity=$q" || true)"
            rss="$(curl -4 -kfsSL --max-time 40 "$base/rss.xml?integrity=$q" || true)"
            sitemap="$(curl -4 -kfsSL --max-time 40 "$base/sitemap.xml?integrity=$q" || true)"
            health="$(curl -4 -kfsSL --max-time 40 "$base/deployment-health.txt?integrity=$q" || true)"
            blood="$(curl -4 -kfsSL --max-time 40 "$base$BLOOD_REL?integrity=$q" || true)"
            stem="$(curl -4 -kfsSL --max-time 40 "$base$STEM_REL?integrity=$q" || true)"
            if grep -Fq "source=$expected" <<<"$health" \
              && grep -Fq '${{ steps.prepare.outputs.latest_rel }}' <<<"$home" \
              && grep -Fq "$BLOOD_REL" <<<"$home" \
              && grep -Fq "$BLOOD_REL" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz$BLOOD_REL" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz$BLOOD_REL" <<<"$sitemap" \
              && grep -Fq 'Kriticky chybí krev skupiny 0 Rh−' <<<"$blood" \
              && grep -Fq "$STEM_REL" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz$STEM_REL" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz$STEM_REL" <<<"$sitemap" \
              && grep -Fq 'darovala krvetvorné buňky' <<<"$stem"; then
              if python3 scripts/audit_canonical_content_runtime.py; then
                success=1
                break
              fi
            fi
            if [[ "$attempt" = 12 ]]; then
              echo "Diagnostika posledního pokusu:"
              grep -F 'source=' <<<"$health" || true
              printf 'home_latest=%s home_blood=%s archive_blood=%s rss_blood=%s sitemap_blood=%s blood_h1=%s archive_stem=%s rss_stem=%s sitemap_stem=%s stem_h1=%s\n' \
                "$(grep -Fqc '${{ steps.prepare.outputs.latest_rel }}' <<<"$home")" \
                "$(grep -Fqc "$BLOOD_REL" <<<"$home")" \
                "$(grep -Fqc "$BLOOD_REL" <<<"$archive")" \
                "$(grep -Fqc "https://nasekadan.cz$BLOOD_REL" <<<"$rss")" \
                "$(grep -Fqc "https://nasekadan.cz$BLOOD_REL" <<<"$sitemap")" \
                "$(grep -Fqc 'Kriticky chybí krev skupiny 0 Rh−' <<<"$blood")" \
                "$(grep -Fqc "$STEM_REL" <<<"$archive")" \
                "$(grep -Fqc "https://nasekadan.cz$STEM_REL" <<<"$rss")" \
                "$(grep -Fqc "https://nasekadan.cz$STEM_REL" <<<"$sitemap")" \
                "$(grep -Fqc 'darovala krvetvorné buňky' <<<"$stem")"
            fi
            sleep 10
          done
          test "$success" = 1
          echo "superseded=false" >> "$GITHUB_OUTPUT"

      - name: Uzavřít starý incident po úplném ověření
        if: success() && steps.verify.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue="$(gh issue list --state open --search '[incident] Viditelnost článků Naše Kadaň in:title' --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "Kanonická obnova prošla. Živý web, oba články o dárcovství, titulka, celý archiv, RSS, sitemap, news-sitemap, registr a deployment-health byly znovu ověřeny. Run ${GITHUB_RUN_ID}."
            gh issue close "$issue" --reason completed
          fi

      - name: Založit nebo doplnit incident při skutečném selhání
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[incident] Viditelnost článků Naše Kadaň'
          body="Automatická kanonická obnova nebo veřejný audit článků selhaly.\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nCommit: ${{ steps.prepare.outputs.source_sha }}\nNejnovější článek: ${{ steps.prepare.outputs.latest_rel }}\nPočet článků: ${{ steps.prepare.outputs.article_count }}"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
