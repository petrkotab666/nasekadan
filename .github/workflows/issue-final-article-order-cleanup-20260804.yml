name: Definitivně odstranit připínání článků

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.event.issue.title == '[FINAL ORDER CLEANUP]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Odstranit všechny automaty připínání a obnovit chronologii
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name 'Naše Kadaň – konečná oprava pořadí'
          git config user.email 'info@nasekadan.cz'

          python3 - <<'PY'
          from pathlib import Path
          import re

          current = Path('.github/workflows/issue-final-article-order-cleanup-20260804.yml')
          removed = []
          for base in (Path('.github/workflows'), Path('scripts')):
              if not base.exists():
                  continue
              for path in list(base.iterdir()):
                  if not path.is_file() or path == current:
                      continue
                  name = path.name.lower()
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  bad = (
                      ('stadium' in name and 'pin' in name)
                      or ('pin' in name and 'stadium' in name)
                      or 'NK-TEMP-STADIUM-PIN' in text
                      or 'HOMEPAGE_PIN_HREF' in text
                      or 'restore the temporary homepage pin' in text.lower()
                      or 'dočasné připnutí zimního stadionu' in text.lower()
                  )
                  if bad:
                      path.unlink()
                      removed.append(str(path))

          for extra in (
              Path('.github/workflows/emergency-deploy-current-main-20260804.yml'),
              Path('.github/workflows/fix-strict-article-chronology-20260804.yml'),
              Path('.github/workflows/fix-strict-article-chronology-issue-20260804.yml'),
              Path('.github/workflows/final-repair-article-order-20260804.yml'),
          ):
              if extra.exists() and extra != current:
                  extra.unlink()
                  removed.append(str(extra))

          engine_path = Path('scripts/enforce_article_visibility.py')
          engine = engine_path.read_text(encoding='utf-8')
          engine = re.sub(r'^HOMEPAGE_PIN_HREF\s*=.*\n?', '', engine, flags=re.M)
          engine = re.sub(r'^HOMEPAGE_PIN_UNTIL\s*=.*\n?', '', engine, flags=re.M)
          engine = re.sub(r'^# HOMEPAGE-PIN-STADIUM-20260804\s*\n?', '', engine, flags=re.M)
          engine, n = re.subn(
              r"    homepage_order = list\(articles\)\n.*?    homepage_articles = homepage_order\[:HOME_TOTAL\]",
              "    homepage_order = list(articles)\n    homepage_articles = homepage_order[:HOME_TOTAL]",
              engine,
              count=1,
              flags=re.S,
          )
          if n != 1 or 'HOMEPAGE_PIN_' in engine:
              raise SystemExit('Generátor titulky se nepodařilo očistit od připínání.')
          compile(engine, str(engine_path), 'exec')
          engine_path.write_text(engine, encoding='utf-8', newline='\n')

          all_path = Path('scripts/enforce_all_article_visibility.py')
          all_text = all_path.read_text(encoding='utf-8')
          all_text = re.sub(
              r"    # NK-TEMP-STADIUM-PIN-20260804:.*?    engine\.main\(\)\n",
              "    # Jediné pořadí: article:published_time sestupně.\n    engine.article_info = safe_article_info\n    engine.main()\n",
              all_text,
              count=1,
              flags=re.S,
          )
          all_text = re.sub(r"    expected_hero = .*", "    expected_hero = latest", all_text, count=1)
          all_text = re.sub(
              r"\n    if pin_active:\n.*?\n    expected_home",
              "\n\n    expected_home",
              all_text,
              count=1,
              flags=re.S,
          )
          for token in ('HOMEPAGE_PIN_', 'pin_active', 'pin_href', 'NK-TEMP-STADIUM-PIN'):
              if token in all_text:
                  raise SystemExit(f'Zakázané připínání zůstalo v úplné pojistce: {token}')
          compile(all_text, str(all_path), 'exec')
          all_path.write_text(all_text, encoding='utf-8', newline='\n')

          guard_path = Path('scripts/run_article_integrity_guard.sh')
          guard = guard_path.read_text(encoding='utf-8')
          if 'NK-ORDER-POLICY-FINAL' not in guard:
              anchor = '  python3 -m py_compile \\\n'
              check = '''  # NK-ORDER-POLICY-FINAL
  if grep -R -n -E 'HOMEPAGE_PIN_|NK-TEMP-STADIUM-PIN' scripts/enforce_article_visibility.py scripts/enforce_all_article_visibility.py; then
    echo 'Ruční připnutí článku je zakázané.' >&2
    exit 1
  fi

'''
              if anchor not in guard:
                  raise SystemExit('Nelze vložit trvalou kontrolu pořadí.')
              guard = guard.replace(anchor, check + anchor, 1)
          guard_path.write_text(guard, encoding='utf-8', newline='\n')

          policy = Path('data/article-order-policy.json')
          policy.write_text('''{
  "rule": "article:published_time descending",
  "manualPinsAllowed": false,
  "updatesChangeOrder": false,
  "appliesTo": ["homepage", "archive", "rss"]
}\n''', encoding='utf-8')

          print('Odstraněno:')
          for item in sorted(set(removed)):
              print(item)
          PY

          python3 -m py_compile scripts/enforce_article_visibility.py scripts/enforce_all_article_visibility.py
          bash -n scripts/run_article_integrity_guard.sh
          python3 scripts/enforce_all_article_visibility.py
          git diff --check

          git add -A
          git commit -m 'Definitivně odstranit všechny automaty připínání článků'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 5
            git fetch origin main
            git rebase origin/main
          done

      - name: Nasadit opravenou titulku a archiv
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          tar --exclude='.git' --exclude='.github' --exclude='scripts' -czf "$RUNNER_TEMP/site-order.tgz" index.html clanky rss.xml sitemap.xml data/article-order-policy.json
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$RUNNER_TEMP/site-order.tgz" ubuntu@57.129.43.215:/tmp/site-order.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          rm -rf /tmp/site-order
          mkdir -p /tmp/site-order
          tar -xzf /tmp/site-order.tgz -C /tmp/site-order
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          sudo cp -a /tmp/site-order/. /var/www/nasekadan/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/site-order/. nasekadan-web:/usr/share/nginx/html/
          fi
          rm -rf /tmp/site-order /tmp/site-order.tgz
          REMOTE

      - name: Veřejně ověřit pořadí
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import importlib.util, re, time

          spec = importlib.util.spec_from_file_location('v', Path('scripts/enforce_article_visibility.py'))
          v = importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          items=[]
          for p in Path('clanky').glob('*.html'):
              if p.name == 'index.html' or re.fullmatch(r'strana-\d+\.html', p.name): continue
              x=v.article_info(p)
              if x: items.append(x)
          items.sort(key=lambda x:x['dt'], reverse=True)
          expected=[x['href'] for x in items]

          def get(url):
              with urlopen(Request(url, headers={'User-Agent':'NK final order audit','Cache-Control':'no-cache'}), timeout=40) as r:
                  return r.read().decode('utf-8','replace')

          last=''
          for attempt in range(15):
              q=f'{int(time.time())}-{attempt}'
              try:
                  home=get(f'https://nasekadan.cz/?finalorder={q}')
                  archive=get(f'https://nasekadan.cz/clanky/?finalorder={q}')
                  hero=re.search(r'<section\b[^>]*class="[^"]*\bhero\b[^"]*"[^>]*id="clanky"[^>]*>.*?</section>', home, re.S|re.I)
                  if not hero or f'data-latest-article-href="{expected[0]}"' not in hero.group(0): raise RuntimeError('hero')
                  aside=re.search(r'<aside\b[^>]*class="[^"]*current-aside[^"]*"[^>]*>.*?</aside>', hero.group(0), re.S|re.I)
                  if not aside or expected[1] not in aside.group(0): raise RuntimeError('aside')
                  cards=re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="(/clanky/[^"]+\.html)".*?</article>', home, re.S|re.I)
                  arch=re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="(/clanky/[^"]+\.html)".*?</article>', archive, re.S|re.I)
                  if cards[:5] != expected[2:7]: raise RuntimeError(f'homepage {cards[:5]}')
                  if arch[:12] != expected[:12]: raise RuntimeError(f'archive {arch[:12]}')
                  print('OK', expected[:7])
                  break
              except Exception as e:
                  last=str(e); time.sleep(8)
          else:
              raise SystemExit('Veřejná kontrola neprošla: '+last)
          PY

      - name: Uzavřít issue
        if: success()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'Všechny automaty pro ruční připínání byly odstraněny. Titulka i archiv byly veřejně ověřeny podle času prvního zveřejnění.'
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Zapsat chybu
        if: failure()
        shell: bash
        run: gh issue comment "$ISSUE_NUMBER" --body "Definitivní oprava pořadí selhala. Run ${GITHUB_RUN_ID}."
