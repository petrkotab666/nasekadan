name: Okamžitě opravit publikaci koupaliště 2026-07-31

on:
  push:
    branches: [main]
    paths:
      - '.github/pool-publish-trigger-20260731.txt'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: emergency-pool-publication-20260731
  cancel-in-progress: false

env:
  SLUG: koupaliste-kadan-pozemky-skluzavka-provoz-2026
  ARTICLE: clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html
  SOCIAL_IMAGE: social/koupaliste-kadan-50-let-niagara-2026.png
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit veřejnou verzi a všechny přehledy
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/drafts/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html
          test -f "$SOCIAL_IMAGE"
          python3 scripts/prepare_pool_article_20260731.py
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('social/koupaliste-kadan-50-let-niagara-2026.png')
          with Image.open(p) as im:
              assert im.format == 'PNG' and im.size == (1200, 630), (im.format, im.size)
          assert p.stat().st_size >= 10000
          PY
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/enforce_article_visibility.py
          python3 scripts/sort_articles_chronologically.py
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" news-sitemap.xml
          grep -Fq 'Veřejnost by proto oprávněně zajímalo' "$ARTICLE"
          grep -Fq 'kdy bude možné atrakci bezpečně používat i v horkých dnech' "$ARTICLE"

      - name: Uložit do hlavní větve s opakováním
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň nouzový publikační automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- "$ARTICLE" "$SOCIAL_IMAGE" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt style.css
          git commit -m 'Publikovat: 50 let koupaliště a skluzavka Niagara' || true
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přímo na OVH a do aktivního kontejneru
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-pool-emergency"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$SOCIAL_IMAGE" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$bundle/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-pool-emergency
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 /tmp/nk-pool-emergency/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-pool-emergency/clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 /tmp/nk-pool-emergency/social/koupaliste-kadan-50-let-niagara-2026.png /var/www/nasekadan/social/
          sudo install -m 0644 /tmp/nk-pool-emergency/index.html /tmp/nk-pool-emergency/rss.xml /tmp/nk-pool-emergency/sitemap.xml /tmp/nk-pool-emergency/news-sitemap.xml /tmp/nk-pool-emergency/llms.txt /tmp/nk-pool-emergency/robots.txt /var/www/nasekadan/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp /tmp/nk-pool-emergency/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp /tmp/nk-pool-emergency/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker cp /tmp/nk-pool-emergency/social/koupaliste-kadan-50-let-niagara-2026.png nasekadan-web:/usr/share/nginx/html/social/
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do
              sudo docker cp "/tmp/nk-pool-emergency/$f" "nasekadan-web:/usr/share/nginx/html/$f"
            done
          fi
          sudo chmod -R a+rX /var/www/nasekadan
          grep -Fq 'Veřejnost by proto oprávněně zajímalo' /var/www/nasekadan/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html
          test -s /var/www/nasekadan/social/koupaliste-kadan-50-let-niagara-2026.png
          rm -rf /tmp/nk-pool-emergency
          REMOTE

      - name: Veřejně ověřit všechny povinné výstupy
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for attempt in $(seq 1 30); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            image="$RUNNER_TEMP/pool-social-${attempt}.png"
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/social/koupaliste-kadan-50-let-niagara-2026.png?v=${stamp}-${attempt}" -o "$image" 2>/dev/null || true
            image_ok="$(python3 - "$image" <<'PY'
          import sys
          from pathlib import Path
          try:
              from PIL import Image
              p=Path(sys.argv[1])
              with Image.open(p) as im:
                  print('yes' if im.format=='PNG' and im.size==(1200,630) and p.stat().st_size>=10000 else 'no')
          except Exception:
              print('no')
          PY
            )"
            if grep -Fq 'Veřejnost by proto oprávněně zajímalo' <<<"$article" \
              && grep -Fq 'kdy bude možné atrakci bezpečně používat i v horkých dnech' <<<"$article" \
              && grep -Fq 'https://nasekadan.cz/social/koupaliste-kadan-50-let-niagara-2026.png' <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$news" \
              && [[ "$image_ok" == yes ]]; then
              exit 0
            fi
            sleep 8
          done
          exit 1

      - name: Publikovat na Facebook a potvrdit záznam
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          FACEBOOK_WAIT_TIMEOUT: '600'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          python3 scripts/process_facebook_queue_live.py "$ARTICLE"
          git config user.name 'Naše Kadaň Facebook pojistka'
          git config user.email 'info@nasekadan.cz'
          git add -A -- .github/facebook-publish-pending.txt .github/facebook-last-status.json .github/facebook-published
          git commit -m 'Potvrdit zveřejnění článku o koupališti na Facebooku' || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          marker="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          article='clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html'
          digest=hashlib.sha256(article.encode()).hexdigest()[:10]
          print(f'.github/facebook-published/{Path(article).stem}-{digest}.json')
          PY
          )"
          test -f "$marker"
          grep -Fq 'facebook_post_id' "$marker"
          grep -Fq 'koupaliste-kadan-50-let-niagara-2026.png' "$marker"
