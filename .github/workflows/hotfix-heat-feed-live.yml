name: Přímý živý hotfix Naše Kadaň

on:
  push:
    branches: [main]
    paths:
      - '.github/heat-feed-live-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-live-hotfix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vytvořit veřejný článek a trvale ho uložit
        run: |
          set -euo pipefail
          python3 scripts/publish_hospital_profile_direct.py
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add clanky/nemocnice-kadan-profil-sluzby-budoucnost.html index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt
          git commit -m 'Trvale zveřejnit závěrečný profil Nemocnice Kadaň' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Připravit SSH klíč
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Odeslat hotové soubory přímo na server
        id: deploy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nk-upload/clanky"
          cp clanky/nemocnice-kadan-profil-sluzby-budoucnost.html "$RUNNER_TEMP/nk-upload/clanky/"
          cp index.html "$RUNNER_TEMP/nk-upload/index.html"
          cp clanky/index.html "$RUNNER_TEMP/nk-upload/clanky/index.html"
          cp rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$RUNNER_TEMP/nk-upload/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/nk-upload" ubuntu@57.129.43.215:/tmp/nk-hospital-upload
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo cp /tmp/nk-hospital-upload/clanky/nemocnice-kadan-profil-sluzby-budoucnost.html /var/www/nasekadan/clanky/
          sudo cp /tmp/nk-hospital-upload/index.html /var/www/nasekadan/index.html
          sudo cp /tmp/nk-hospital-upload/clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo cp /tmp/nk-hospital-upload/rss.xml /tmp/nk-hospital-upload/sitemap.xml /tmp/nk-hospital-upload/news-sitemap.xml /tmp/nk-hospital-upload/llms.txt /tmp/nk-hospital-upload/robots.txt /var/www/nasekadan/
          sudo chmod -R a+rX /var/www/nasekadan
          rm -rf /tmp/nk-hospital-upload
          grep -Fq 'Nemocnice Kadaň není jen spor o miliony' /var/www/nasekadan/clanky/nemocnice-kadan-profil-sluzby-budoucnost.html
          grep -Fq 'data-next-syringe-article' /var/www/nasekadan/clanky/nemocnice-kadan-profil-sluzby-budoucnost.html
          grep -Fq 'nemocnice-kadan-profil-sluzby-budoucnost.html' /var/www/nasekadan/index.html
          grep -Fq 'nemocnice-kadan-profil-sluzby-budoucnost.html' /var/www/nasekadan/clanky/index.html
          grep -Fq 'nemocnice-kadan-profil-sluzby-budoucnost.html' /var/www/nasekadan/rss.xml
          grep -Fq 'nemocnice-kadan-profil-sluzby-budoucnost.html' /var/www/nasekadan/sitemap.xml
          REMOTE

      - name: Ověřit veřejný web
        id: verify
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            article="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/clanky/nemocnice-kadan-profil-sluzby-budoucnost.html?hotfix=${GITHUB_SHA}-${attempt}" || true)"
            home="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/?hotfix=${GITHUB_SHA}-${attempt}" || true)"
            archive="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/clanky/?hotfix=${GITHUB_SHA}-${attempt}" || true)"
            rss="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/rss.xml?hotfix=${GITHUB_SHA}-${attempt}" || true)"
            sitemap="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/sitemap.xml?hotfix=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq 'Nemocnice Kadaň není jen spor o miliony' <<<"$article" \
              && grep -Fq 'data-next-syringe-article' <<<"$article" \
              && grep -Fq 'nemocnice-kadan-profil-sluzby-budoucnost.html' <<<"$home" \
              && grep -Fq 'nemocnice-kadan-profil-sluzby-budoucnost.html' <<<"$archive" \
              && grep -Fq 'nemocnice-kadan-profil-sluzby-budoucnost.html' <<<"$rss" \
              && grep -Fq 'nemocnice-kadan-profil-sluzby-budoucnost.html' <<<"$sitemap"; then
              exit 0
            fi
            sleep 8
          done
          exit 1

      - name: Zapsat stav hotfixu
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'hospital-profile-hotfix-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              server_deploy: process.env.DEPLOY_OUTCOME || 'skipped',
              public_verification: process.env.VERIFY_OUTCOME || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat stav hotfixu profilu nemocnice: ${status.status}`,
              content,
              ...(sha ? { sha } : {})
            });
