name: Přímý hotfix sezónního feedu na živý web

on:
  push:
    branches: [main]
    paths:
      - '.github/heat-feed-live-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-heat-feed-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH klíč
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit pouze sezónní feed
        id: deploy
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          test -f horko-feed.js
          sudo cp horko-feed.js /var/www/nasekadan/horko-feed.js
          sudo find /var/www/nasekadan -type f -name '*.html' ! -path '*/nahled/*' ! -path '*/sdilet/*' -print0 | while IFS= read -r -d '' file; do
            if ! grep -Fq '/horko-feed.js' "$file"; then
              sudo sed -i 's#</body>#<script src="/horko-feed.js?v=20260728-heat-1"></script></body>#' "$file"
            fi
          done
          grep -Fq '/horko-feed.js' /var/www/nasekadan/index.html
          grep -Fq 'Ventilátory a mobilní klimatizace' /var/www/nasekadan/horko-feed.js
          grep -Fq '/horko-feed.js' /var/www/nasekadan/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          REMOTE

      - name: Ověřit veřejný web
        id: verify
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            home="$(curl -kfsS --max-time 20 "https://nasekadan.cz/?heat=${GITHUB_SHA}-${attempt}" || true)"
            script="$(curl -kfsS --max-time 20 "https://nasekadan.cz/horko-feed.js?heat=${GITHUB_SHA}-${attempt}" || true)"
            article="$(curl -kfsS --max-time 20 "https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html?heat=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq '/horko-feed.js' <<<"$home" \
              && grep -Fq 'Ventilátory a mobilní klimatizace' <<<"$script" \
              && grep -Fq '/horko-feed.js' <<<"$article"; then
              exit 0
            fi
            sleep 10
          done
          exit 30

      - name: Zapsat stav hotfixu
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'heat-feed-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              server_deploy: process.env.DEPLOY_OUTCOME || 'skipped',
              public_verification: process.env.VERIFY_OUTCOME || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat stav sezónního feedu: ${status.status}`,
              content,
              ...(sha ? { sha } : {})
            });
