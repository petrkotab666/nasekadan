name: Ručně publikovat rozsáhlý článek o koupališti v Kadani

on:
  workflow_dispatch:
    inputs:
      force:
        description: Publikovat nyní
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-pool-article-manual
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit článek a propojit upoutávku
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          force='${{ inputs.force || true }}'
          article='clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html'
          if [[ -f "$article" ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$force" != 'true' ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi

          cp .github/drafts/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html "$article"
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import re

          article = Path('clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html')
          text = article.read_text(encoding='utf-8')
          now = datetime.now(ZoneInfo('Europe/Prague')).replace(microsecond=0)
          published = now.isoformat()
          label = f'{now.day}. {now.month}. {now.year}'
          text = text.replace('noindex,nofollow', 'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1')
          text = text.replace('../../', '../')
          text = text.replace('PŘIPRAVOVANÝ ČLÁNEK', label)
          if 'article:published_time' not in text:
              text = text.replace('</head>', f'<meta property="article:published_time" content="{published}"><meta property="article:modified_time" content="{published}">\n</head>', 1)
          text = re.sub(r'("datePublished"\s*:\s*")([^"]*)', r'\g<1>' + published, text)
          text = re.sub(r'("dateModified"\s*:\s*")([^"]*)', r'\g<1>' + published, text)
          article.write_text(text, encoding='utf-8', newline='\n')

          teaser = Path('clanky/strikacky-vchody-drogy-kadan.html')
          if teaser.exists():
              teaser_text = teaser.read_text(encoding='utf-8')
              teaser_text = teaser_text.replace(
                  'href="/clanky/" data-koupaliste-link="1"',
                  'href="/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html" data-koupaliste-link="1"'
              )
              teaser_text = teaser_text.replace(
                  'Od soboty v přehledu článků',
                  'Přečíst článek o koupališti'
              )
              teaser.write_text(teaser_text, encoding='utf-8', newline='\n')
          PY

          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/sort_articles_chronologically.py
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Uložit veřejnou verzi
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html clanky/strikacky-vchody-drogy-kadan.html index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt social style.css
          git commit -m 'Publikovat: koupaliště, pozemky a nová skluzavka'
          git pull --rebase origin main
          git push origin main
