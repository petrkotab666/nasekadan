name: Publikovat Slovan 5. srpna 2026 ve 04:00

"on":
  schedule:
    - cron: '0 2 5 8 *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Povolit ruční spuštění publikačního a záchranného běhu'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-slovan-20260805
  cancel-in-progress: false

env:
  ARTICLE_URL: https://nasekadan.cz/clanky/slovan-druhy-pokus.html
  OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}

jobs:
  primary:
    name: Hlavní publikace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Časová a ruční pojistka
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ inputs.force }}
        run: |
          set -euo pipefail
          active=false
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$FORCE_RUN" == 'true' ]] || { echo 'Ruční běh nebyl výslovně povolen.'; exit 1; }
            active=true
          elif [[ "$(TZ=Europe/Prague date +%Y-%m-%d)" == '2026-08-05' ]]; then
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Pražský čas: $(TZ=Europe/Prague date --iso-8601=seconds)"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.active == 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: '3.12'

      - name: Publikovat, nasadit a dvakrát veřejně ověřit
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: bash scripts/publish_slovan_runtime.sh primary

      - name: Zapsat incident hlavního běhu
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const title = '[incident] Publikace Slovanu 5. srpna';
            const body = `Hlavní publikační běh selhal. Záchranný a finální běh budou pokračovat nezávisle.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\nČlánek: ${process.env.ARTICLE_URL}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'open', per_page:100});
            const issue = existing.find(x => x.title === title);
            if (issue) await github.rest.issues.createComment({owner, repo, issue_number:issue.number, body});
            else await github.rest.issues.create({owner, repo, title, body});

  rescue:
    name: Záchranná publikace
    needs: primary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Časová a ruční pojistka
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ inputs.force }}
        run: |
          set -euo pipefail
          active=false
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$FORCE_RUN" == 'true' ]] || { echo 'Ruční běh nebyl výslovně povolen.'; exit 1; }
            active=true
          elif [[ "$(TZ=Europe/Prague date +%Y-%m-%d)" == '2026-08-05' ]]; then
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Počkat na doběhnutí cache a případnou samovolnou obnovu
        if: steps.gate.outputs.active == 'true'
        run: sleep 420

      - uses: actions/checkout@v4
        if: steps.gate.outputs.active == 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: '3.12'

      - name: Ověřit živý web a při chybě celé vydání zopakovat
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: bash scripts/publish_slovan_runtime.sh rescue

      - name: Doplnit incident záchranného běhu
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const title = '[incident] Publikace Slovanu 5. srpna';
            const body = `Selhal také záchranný běh. Finální nezávislá kontrola ještě následuje.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'open', per_page:100});
            const issue = existing.find(x => x.title === title);
            if (issue) await github.rest.issues.createComment({owner, repo, issue_number:issue.number, body});
            else await github.rest.issues.create({owner, repo, title, body});

  final_guard:
    name: Pojistka pojistek
    needs: [primary, rescue]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Časová a ruční pojistka
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ inputs.force }}
        run: |
          set -euo pipefail
          active=false
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$FORCE_RUN" == 'true' ]] || { echo 'Ruční běh nebyl výslovně povolen.'; exit 1; }
            active=true
          elif [[ "$(TZ=Europe/Prague date +%Y-%m-%d)" == '2026-08-05' ]]; then
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Nechat doběhnout CDN, cache a kanonickou ochranu
        if: steps.gate.outputs.active == 'true'
        run: sleep 600

      - uses: actions/checkout@v4
        if: steps.gate.outputs.active == 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: '3.12'

      - name: Úplný nezávislý audit a poslední automatická oprava
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: bash scripts/publish_slovan_runtime.sh final

      - name: Uzavřít incident a zapsat úspěch
        if: success() && steps.gate.outputs.active == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const incidentTitle = '[incident] Publikace Slovanu 5. srpna';
            const open = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'open', per_page:100});
            for (const issue of open.filter(x => x.title === incidentTitle)) {
              await github.rest.issues.createComment({owner, repo, issue_number:issue.number, body:'Finální pojistka ověřila úplnou veřejnou publikaci. Incident se uzavírá.'});
              await github.rest.issues.update({owner, repo, issue_number:issue.number, state:'closed', state_reason:'completed'});
            }
            const created = await github.rest.issues.create({
              owner, repo,
              title:'[publish] Slovan 5. srpna – success',
              body:`Článek byl zveřejněn, nasazen a ověřen hlavní, záchrannou i finální kontrolou.\n\n${process.env.ARTICLE_URL}\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            });
            await github.rest.issues.update({owner, repo, issue_number:created.data.number, state:'closed', state_reason:'completed'});

      - name: Zapsat kritický incident finální pojistky
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const title = '[incident] Publikace Slovanu 5. srpna';
            const body = `Finální pojistka nedokázala potvrdit úplnou publikaci. Je nutný okamžitý zásah.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\nČlánek: ${process.env.ARTICLE_URL}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'open', per_page:100});
            const issue = existing.find(x => x.title === title);
            if (issue) await github.rest.issues.createComment({owner, repo, issue_number:issue.number, body});
            else await github.rest.issues.create({owner, repo, title, body});
