name: Ruční cloudový záložní náhled Naše Kadaň

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Tento workflow už není produkční cestou a nikdy nepoužívá doménu
# nasekadan.cz. Slouží pouze jako ručně spuštěná záloha pod GitHub Pages.
concurrency:
  group: nasekadan-pages-backup
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Připravit záložní web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            --exclude 'nginx/' \
            --exclude 'docker-entrypoint.d/' \
            --exclude 'Dockerfile' \
            --exclude 'docker-compose.yml' \
            --exclude 'deploy/'
          rm -f _site/CNAME
          touch _site/.nojekyll
          test -s _site/index.html

      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrát záložní web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Zveřejnit záložní náhled
        id: deployment
        uses: actions/deploy-pages@v4
