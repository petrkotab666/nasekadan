name: Předletová kontrola publikace Slovanu

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/preflight-slovan-20260805.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: preflight-slovan-20260805
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Statická kontrola skriptů a plánu
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/publish_slovan_runtime.sh
          python3 -m py_compile scripts/publish_slovan_20260805.py scripts/enforce_article_visibility.py
          grep -Fq "cron: '0 2 5 8 *'" .github/workflows/publish-slovan-20260805.yml
          grep -Fq 'Pojistka pojistek' .github/workflows/publish-slovan-20260805.yml
          grep -Fq '2026-08-05T04:00:00+02:00' scripts/publish_slovan_20260805.py
          grep -Fq 'Druhý pokus může Kadani přinést potřebné byty' .github/drafts/slovan-druhy-pokus.html
          ! grep -Fq 'Otázky pro město' .github/drafts/slovan-druhy-pokus.html

      - name: Zkušebně sestavit celý web bez publikace a bez push
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/publish_slovan_20260805.py
          grep -Fq '<h1>Kadaň vybírá nového stavitele Slovanu za 195 milionů. Účet prvního pokusu stále není veřejný</h1>' clanky/slovan-druhy-pokus.html
          grep -Fq 'index,follow' clanky/slovan-druhy-pokus.html
          ! grep -Fq 'noindex' clanky/slovan-druhy-pokus.html
          grep -Fq '/clanky/slovan-druhy-pokus.html' index.html
          grep -Fq 'https://nasekadan.cz/clanky/slovan-druhy-pokus.html' rss.xml sitemap.xml news-sitemap.xml llms.txt
          test -s social/slovan-druhy-pokus-20260805.png
          python3 - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          from pathlib import Path
          url='https://nasekadan.cz/clanky/slovan-druhy-pokus.html'
          reg=json.loads(Path('data/published-content-index.json').read_text(encoding='utf-8'))
          count=reg['article_count']
          assert count>=49
          assert len(reg['articles'])==count
          assert reg['validation']['rss_count']==count
          assert reg['validation']['duplicate_urls']==[]
          assert reg['validation']['duplicate_fingerprints']==[]
          assert any(x.get('url')==url for x in reg['articles'])
          assert len(re.findall(r'<item\b',Path('rss.xml').read_text(encoding='utf-8')))==count
          assert len(ET.parse('news-sitemap.xml').getroot())==10
          manifest=json.loads(Path('data/article-integrity-manifest.json').read_text(encoding='utf-8'))
          assert manifest['article_count']==count
          assert any(x.get('url')==url for x in manifest['articles'])
          PY

      - name: Zapsat úspěšnou předletovou kontrolu
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const created = await github.rest.issues.create({
              owner, repo,
              title:'[preflight] Slovan 5. srpna – success',
              body:`Zkušební sestavení článku, titulky, archivu, RSS, sitemap, news sitemap, registru, integrity a sociální grafiky proběhlo bez publikace úspěšně.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            });
            await github.rest.issues.update({owner, repo, issue_number:created.data.number, state:'closed', state_reason:'completed'});

      - name: Zapsat chybu předletové kontroly
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const title='[incident] Předletová kontrola Slovanu';
            const body=`Předletová kontrola naplánované publikace selhala. Článek se nesmí bez opravy automaticky vydat.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            const issue=open.find(x=>x.title===title);
            if(issue) await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
