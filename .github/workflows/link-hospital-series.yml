name: Propojit sérii Nemocnice Kadaň

on:
  push:
    branches: [main]
    paths:
      - 'clanky/nemocnice-kadan.html'
      - 'clanky/petice-nemocnice-kadan.html'
      - 'clanky/nemocnice-kadan-software-kyberbezpecnost.html'
      - 'clanky/avies-nemocnice-kadan.html'
      - 'clanky/arc-med-nemocnice-kadan.html'
      - 'clanky/nemocnice-kadan-profil-sluzby-budoucnost.html'
      - '.github/drafts/nemocnice-kadan-software-kyberbezpecnost.html'
      - '.github/drafts/arc-med-nemocnice-kadan.html'
      - '.github/drafts/nemocnice-kadan-profil-sluzby-budoucnost.html'
      - 'style.css'
      - 'scripts/link_hospital_series.py'
      - 'scripts/bootstrap_arc_med_draft.py'
      - 'scripts/update_hospital_profile_municipal_support.py'
      - '.github/hospital-series-trigger.txt'
      - '.github/workflows/link-hospital-series.yml'
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-hospital-series
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stáhnout hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vytvořit ARC-MED, doplnit obce a propojit sérii
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bootstrap_arc_med_draft.py
          python3 scripts/update_hospital_profile_municipal_support.py
          python3 scripts/link_hospital_series.py

      - name: Uložit propojení
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – propojení série'
          git config user.email 'info@nasekadan.cz'

          paths=(
            style.css
            clanky/nemocnice-kadan.html
            clanky/petice-nemocnice-kadan.html
            clanky/nemocnice-kadan-software-kyberbezpecnost.html
            clanky/avies-nemocnice-kadan.html
            clanky/arc-med-nemocnice-kadan.html
            clanky/nemocnice-kadan-profil-sluzby-budoucnost.html
            .github/drafts/nemocnice-kadan-software-kyberbezpecnost.html
            .github/drafts/arc-med-nemocnice-kadan.html
            .github/drafts/nemocnice-kadan-profil-sluzby-budoucnost.html
            scripts/link_hospital_series.py
          )
          for path in "${paths[@]}"; do
            [[ -e "$path" ]] && git add -- "$path"
          done

          if git diff --cached --quiet; then
            echo 'Série je již správně propojena.'
            exit 0
          fi

          git commit -m 'Doplnit obce, ARC-MED a šestidílnou sérii Nemocnice Kadaň'
          git pull --rebase origin main
          git push origin main

      - name: Závěrečná kontrola
        run: |
          python3 scripts/update_hospital_profile_municipal_support.py
          python3 scripts/link_hospital_series.py
