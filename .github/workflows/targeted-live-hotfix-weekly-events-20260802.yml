name: Cíleně dokončit kulturní týden bez Docker buildu

on:
  push:
    branches: [main]
    paths:
      - '.github/targeted-live-hotfix-weekly-events-20260802-trigger.txt'

permissions:
  contents: read
  issues: write

concurrency:
  group: targeted-weekly-events-20260802
  cancel-in-progress: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Přepsat jen povinné produkční soubory a ověřit
        id: hotfix
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          EXPECTED="$(git rev-parse HEAD)"
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 "EXPECTED='$EXPECTED' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          SOURCE="$(git rev-parse HEAD)"
          test "$SOURCE" = "$EXPECTED"

          root='/var/www/nasekadan'
          sudo install -d -m 0755 "$root/clanky" "$root/social"
          sudo cp -f index.html "$root/index.html"
          sudo cp -f clanky/index.html "$root/clanky/index.html"
          sudo cp -f rss.xml "$root/rss.xml"
          sudo cp -f sitemap.xml "$root/sitemap.xml"
          sudo cp -f news-sitemap.xml "$root/news-sitemap.xml"
          sudo cp -f clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html "$root/clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html"
          sudo cp -f social/kam-v-kadani-a-okoli-3-9-srpna-2026-bff154b86a.png "$root/social/kam-v-kadani-a-okoli-3-9-srpna-2026-bff154b86a.png"
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=targeted-static-hotfix\n' "$SOURCE" "$(date -u +%FT%TZ)" | sudo tee "$root/deployment-health.txt" >/dev/null
          sudo chmod -R a+rX "$root"

          rel='/clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html'
          article="$root$rel"
          test -s "$article"
          grep -Fq '<h1>Kam v Kadani a okolí od 3. do 9. srpna: med, móda, dixieland, kino a koupání</h1>' "$article"
          grep -Fq '<link rel="canonical" href="https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html">' "$article"
          grep -Fq 'name="description"' "$article"
          grep -Fq 'property="og:image:width" content="1200"' "$article"
          grep -Fq 'property="og:image:height" content="630"' "$article"
          grep -Fq 'NewsArticle' "$article"
          grep -Fq 'elektrocentrále' "$article"
          grep -Fq 'platební terminál' "$article"
          grep -Fq '10. srpna' "$article"
          grep -Fq '14. srpna' "$article"
          for file in "$root/index.html" "$root/clanky/index.html" "$root/rss.xml" "$root/sitemap.xml" "$root/news-sitemap.xml"; do
            grep -Fq "$rel" "$file"
          done
          python3 - "$root/social/kam-v-kadani-a-okoli-3-9-srpna-2026-bff154b86a.png" <<'PY'
          import struct,sys
          b=open(sys.argv[1],'rb').read(24)
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',b[16:24])==(1200,630)
          PY
          grep -Fq "source=$SOURCE" "$root/deployment-health.txt"
          for endpoint in "$rel" '/' '/clanky/' '/rss.xml' '/sitemap.xml' '/news-sitemap.xml'; do
            body="$(curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz${endpoint}?verify=targeted-weekly-20260802")"
            if [[ "$endpoint" != "$rel" ]]; then grep -Fq "$rel" <<<"$body"; fi
          done
          printf 'LIVE_OK source=%s\n' "$SOURCE"
          REMOTE

      - name: Zapsat výsledek bez změny main
        if: always()
        shell: bash
        env:
          HOTFIX_OUTCOME: ${{ steps.hotfix.outcome }}
        run: |
          set -euo pipefail
          if [[ "$HOTFIX_OUTCOME" == success ]]; then
            gh api repos/${GITHUB_REPOSITORY}/issues/535/comments -f body='✅ **KULTURNÍ TÝDEN JE ŽIVĚ OVĚŘENÝ.** Cílené nasazení bez Docker buildu potvrdilo článek, titulku, archiv, RSS, sitemap.xml, news-sitemap.xml, canonical, SEO metadata, NewsArticle JSON-LD, údaje Autokempu, vlastní PNG OG obrázek 1200 × 630 a shodu deployment-health s aktuálním commitem.' >/dev/null
            gh api -X PATCH repos/${GITHUB_REPOSITORY}/issues/535 -f state=closed -f state_reason=completed >/dev/null
          else
            gh api repos/${GITHUB_REPOSITORY}/issues/535/comments -f body='❌ Cílené produkční dokončení kulturního týdne neprošlo. Podrobnost je v logu workflow.' >/dev/null || true
            exit 1
          fi
