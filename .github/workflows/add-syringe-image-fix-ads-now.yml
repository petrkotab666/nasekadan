name: Doplnit fotografii ke stříkačkám a opravit rozestupy reklam

on:
  push:
    branches: [main]
    paths:
      - '.github/syringe-image-ads-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-syringe-image-ads
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE: clanky/strikacky-vchody-drogy-kadan.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vložit fotografii a sjednotit reklamní pojistku
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 scripts/add_syringe_illustration.py
          python3 scripts/normalize_articles.py --write --check
          test -s assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp
          grep -Fq 'data-syringe-illustration="1"' "$ARTICLE"
          grep -Fq '/ad-spacing-guard.js' "$ARTICLE"
          grep -Fq 'contentBlocks<2' ad-spacing-guard.js

      - name: Uložit trvalou opravu do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add -A
          if git diff --cached --quiet; then
            echo 'Zdrojové soubory už jsou opravené.'
          else
            git commit -m 'Doplnit ilustraci ke stříkačkám a oddělit reklamní bloky'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit článek, fotografii a reklamní pojistku
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/nk-syringe-image"
          mkdir -p "$RUNNER_TEMP/nk-syringe-image/assets/clanky"
          cp -a clanky "$RUNNER_TEMP/nk-syringe-image/"
          cp assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp "$RUNNER_TEMP/nk-syringe-image/assets/clanky/"
          cp ad-spacing-guard.js "$RUNNER_TEMP/nk-syringe-image/"
          tar -C "$RUNNER_TEMP/nk-syringe-image" -cf "$RUNNER_TEMP/nk-syringe-image.tar" .
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/nk-syringe-image.tar" ubuntu@57.129.43.215:/tmp/nk-syringe-image.tar
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          rm -rf /tmp/nk-syringe-image
          mkdir -p /tmp/nk-syringe-image
          tar -C /tmp/nk-syringe-image -xf /tmp/nk-syringe-image.tar
          sudo install -d -m 0755 /var/www/nasekadan
          sudo tar -C /var/www/nasekadan -xf /tmp/nk-syringe-image.tar
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-syringe-image/. nasekadan-web:/usr/share/nginx/html/
          fi
          rm -rf /tmp/nk-syringe-image /tmp/nk-syringe-image.tar
          REMOTE

      - name: Veřejně ověřit fotografii a rozestupy reklam
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 24); do
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/strikacky-vchody-drogy-kadan.html?v=${stamp}-${attempt}" -o /tmp/article.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/ad-spacing-guard.js?v=${stamp}-${attempt}" -o /tmp/ad-guard.js || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/assets/clanky/strikacky-vchody-drogy-kadan-ilustrace.webp?v=${stamp}-${attempt}" -o /tmp/syringe.webp || true
            if grep -Fq 'data-syringe-illustration="1"' /tmp/article.html \
              && grep -Fq '/ad-spacing-guard.js' /tmp/article.html \
              && grep -Fq 'contentBlocks<2' /tmp/ad-guard.js \
              && test "$(wc -c </tmp/syringe.webp 2>/dev/null || echo 0)" -gt 30000; then
              echo 'HOTOVO: fotografie je v článku a pojistka odstraňuje reklamy bez obsahového rozestupu.'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Zapsat stav opravy
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path='syringe-image-ads-status.json';
            const ok=process.env.DEPLOY==='success'&&process.env.VERIFY==='success';
            const status={
              status:ok?'success':'failed',
              checked_at_utc:new Date().toISOString(),
              trigger_commit:context.sha,
              run_id:context.runId,
              server_deploy:process.env.DEPLOY||'skipped',
              public_verification:process.env.VERIFY||'skipped'
            };
            const content=Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64');
            let sha;
            try{
              const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              if(!Array.isArray(current.data))sha=current.data.sha;
            }catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',
              message:`Zapsat stav fotografie a reklam: ${status.status}`,
              content,...(sha?{sha}:{})
            });
