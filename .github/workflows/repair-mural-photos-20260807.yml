name: Opravit fotografie podchodu Od hlubin k nebi

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 814
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_C: ${{ secrets.OVH_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ověřit dvě trvale uložené WebP fotografie
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python3 - <<'PY' | tee "$RUNNER_TEMP/mural-build.log"
          from pathlib import Path
          from PIL import Image
          paths=[
            Path('images/clanky/od-hlubin-k-nebi/ptaci-ara-zoborozec.webp'),
            Path('images/clanky/od-hlubin-k-nebi/ptaci-cela-stena.webp'),
          ]
          html=Path('clanky/od-hlubin-k-nebi-kadan.html').read_text(encoding='utf-8')
          for p in paths:
            assert p.is_file() and p.stat().st_size>10000,p
            assert '/'+str(p) in html,p
            with Image.open(p) as im:
              im.load(); assert im.format=='WEBP' and im.width>=800 and im.height>=600,(p,im.format,im.size)
              print('REPO WEBP OK',p,im.size,p.stat().st_size)
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-${OVH_KEY_C:-}}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"

      - name: Nahrát fotografie a článek přímo na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/mural-live.tgz" \
            clanky/od-hlubin-k-nebi-kadan.html \
            images/clanky/od-hlubin-k-nebi/ptaci-ara-zoborozec.webp \
            images/clanky/od-hlubin-k-nebi/ptaci-cela-stena.webp
          scp -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$RUNNER_TEMP/mural-live.tgz" ubuntu@57.129.43.215:/tmp/mural-live.tgz
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          LOCK=/tmp/nasekadan-production-deploy.lock
          sudo touch "$LOCK"; sudo chmod a+rw "$LOCK"; exec 9>"$LOCK"; flock -w 300 9
          sudo mkdir -p /var/www/nasekadan/images/clanky/od-hlubin-k-nebi /var/www/nasekadan/clanky
          sudo tar -xzf /tmp/mural-live.tgz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/images/clanky/od-hlubin-k-nebi
            sudo docker cp /var/www/nasekadan/clanky/od-hlubin-k-nebi-kadan.html nasekadan-web:/usr/share/nginx/html/clanky/od-hlubin-k-nebi-kadan.html
            sudo docker cp /var/www/nasekadan/images/clanky/od-hlubin-k-nebi/. nasekadan-web:/usr/share/nginx/html/images/clanky/od-hlubin-k-nebi/
          fi
          rm -f /tmp/mural-live.tgz
          REMOTE
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Veřejně ověřit článek i obě fotografie
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/mural-public.log"
          import time,urllib.request
          from io import BytesIO
          from PIL import Image
          base='https://nasekadan.cz'; q='?mural='+str(time.time_ns())
          req=urllib.request.Request(base+'/clanky/od-hlubin-k-nebi-kadan.html'+q,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'NaseKadan-mural-final'})
          with urllib.request.urlopen(req,timeout=40) as r:
            assert r.status==200; html=r.read().decode('utf-8','replace')
          for name in ('ptaci-ara-zoborozec.webp','ptaci-cela-stena.webp'):
            rel='/images/clanky/od-hlubin-k-nebi/'+name
            assert rel in html
            req=urllib.request.Request(base+rel+q,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'NaseKadan-mural-final'})
            with urllib.request.urlopen(req,timeout=40) as r:
              status=r.status; ctype=(r.headers.get('Content-Type') or '').split(';')[0].lower(); raw=r.read()
            assert status==200 and ctype=='image/webp' and len(raw)>10000,(name,status,ctype,len(raw))
            with Image.open(BytesIO(raw)) as im:
              im.load(); assert im.format=='WEBP' and im.width>=800 and im.height>=600
              print('PUBLIC OK',name,im.size,len(raw),ctype)
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat výsledek do issue 814
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD: ${{ steps.build.outputs.ok }}
          DEPLOY: ${{ steps.deploy.outputs.ok }}
          VERIFY: ${{ steps.verify.outputs.ok }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); const read=n=>{try{return fs.readFileSync(process.env.RUNNER_TEMP+'/'+n,'utf8')}catch{return ''}};
            const build=read('mural-build.log'), pub=read('mural-public.log');
            const ok=process.env.BUILD==='true'&&process.env.DEPLOY==='true'&&process.env.VERIFY==='true';
            const body=ok?`✅ Obě fotografie podchodu jsou trvale v main a veřejně vracejí platný image/webp.\n\n\`\`\`\n${build}\n${pub}\n\`\`\``:`❌ Oprava fotek selhala. build=${process.env.BUILD||'false'}, deploy=${process.env.DEPLOY||'false'}, verify=${process.env.VERIFY||'false'}.\n\n\`\`\`\n${build}\n${pub}\n\`\`\``;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:814,body});
            if(ok) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:814,state:'closed',state_reason:'completed'});

      - name: Selhat při neúspěchu
        if: always()
        run: test "${{ steps.verify.outputs.ok }}" = 'true'
