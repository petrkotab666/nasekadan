name: Aktualizovat článek nemocnice podle obrazových smluv

on:
  push:
    branches: [main]
    paths:
      - '.github/hospital-scanned-findings-live-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hospital-scanned-findings-live
  cancel-in-progress: true

jobs:
  update-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE: clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit článek o neindexované smlouvy
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 scripts/update_hospital_scanned_contract_findings_20260730.py
          git config user.name 'Naše Kadaň dokumentová rešerše'
          git config user.email 'info@nasekadan.cz'
          git add "$ARTICLE"
          git commit -m 'Doplnit úvěrové a IT smlouvy čtené mimo fulltext' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Přepsat živý web a aktivní Docker
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          python3 scripts/enforce_article_visibility.py
          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          if [[ -z "$cid" ]]; then cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"; fi
          test -n "$cid"
          for file in index.html clanky/index.html clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html; do
            sudo install -d -m 0755 "/var/www/nasekadan/$(dirname "$file")"
            sudo install -m 0644 "$file" "/var/www/nasekadan/$file"
            sudo docker exec "$cid" mkdir -p "/usr/share/nginx/html/$(dirname "$file")"
            sudo docker cp "$file" "$cid:/usr/share/nginx/html/$file"
          done
          curl -fsS http://127.0.0.1:3224/clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html | grep -Fq 'Co odhalily neindexované a obrazové smlouvy'
          REMOTE

      - name: Veřejně ověřit aktualizaci
        run: |
          set -euo pipefail
          for n in $(seq 1 30); do
            page="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html?scanned=${GITHUB_SHA}-${n}" || true)"
            if grep -Fq '55 168 704,80 Kč' <<<"$page" \
              && grep -Fq '7,376 milionu korun bez DPH' <<<"$page" \
              && grep -Fq '2026-07-30T13:15:00+02:00' <<<"$page"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
