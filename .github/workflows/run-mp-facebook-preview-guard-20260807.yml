name: Spustit Facebook preview guard pro článek MP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-mp-facebook-preview-guard-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-mp-facebook-preview-repair-20260807
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
      FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
      FACEBOOK_WAIT_TIMEOUT: '1200'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Ověřit živý obrázek a obnovit Facebook cache
        run: |
          set -euo pipefail
          python3 scripts/refresh_facebook_previews_on_change.py \
            --article clanky/mestska-policie-kadan-fakta-diskuse-2026.html

      - name: Uložit potvrzení
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň Facebook preview guard'
          git config user.email 'info@nasekadan.cz'
          git add -A -- .github/facebook-published .github/facebook-preview-refresh-status.json
          if git diff --cached --quiet; then
            echo 'Stav beze změny.'
            exit 0
          fi
          git commit -m 'Potvrdit obnovený Facebook náhled článku MP [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            [[ "$attempt" = 5 ]] && exit 1
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
