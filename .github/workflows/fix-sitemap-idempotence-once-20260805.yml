name: Opravit idempotenci kanonické sitemap jednorázově

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sitemap-idempotence-once-20260805.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-sitemap-idempotence-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Opravit generátor a normalizovat sitemapu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/enforce_all_article_visibility.py')
          text = path.read_text(encoding='utf-8')
          old = '''    without_urls = URL_BLOCK_RE.sub("", text)\n    rendered = "\\n".join("  " + selected[loc] for loc in order) + "\\n"\n    text = without_urls.replace("</urlset>", rendered + "</urlset>", 1)\n    path.write_text(text, encoding="utf-8", newline="\\n")\n'''
          new = '''    matches = list(URL_BLOCK_RE.finditer(text))\n    rendered = "\\n".join("  " + selected[loc] for loc in order) + "\\n"\n    if matches:\n        prefix = text[: matches[0].start()].rstrip()\n        suffix = text[matches[-1].end() :].lstrip()\n        text = prefix + "\\n" + rendered + suffix\n    else:\n        text = text.replace("</urlset>", rendered + "</urlset>", 1)\n    path.write_text(text, encoding="utf-8", newline="\\n")\n'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          elif new in text:
              print('Generátor už obsahuje idempotentní opravu.')
          else:
              raise SystemExit('Bezpečná oprava zastavena: očekávaný blok generátoru nebyl nalezen.')
          PY

          python3 scripts/enforce_all_article_visibility.py
          sed -i 's/[[:space:]]\+$//' index.html sitemap.xml clanky/index.html clanky/strana-*.html

          cp sitemap.xml "$RUNNER_TEMP/sitemap-first.xml"
          python3 scripts/enforce_all_article_visibility.py
          sed -i 's/[[:space:]]\+$//' index.html sitemap.xml clanky/index.html clanky/strana-*.html
          cmp -s "$RUNNER_TEMP/sitemap-first.xml" sitemap.xml

          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('sitemap.xml').read_text(encoding='utf-8')
          locs = re.findall(r'<loc>\s*([^<]+?)\s*</loc>', text, re.I | re.S)
          assert locs, 'Sitemap je prázdná.'
          assert len(locs) == len(set(locs)), 'Sitemap stále obsahuje duplicitní URL.'
          assert not re.search(r'\n[ \t]*\n[ \t]*\n', text), 'Sitemap stále obsahuje nahromaděné prázdné řádky.'
          print(f'Sitemap normalizována: {len(locs)} jedinečných URL.')
          PY

          rm -f .github/workflows/fix-sitemap-idempotence-once-20260805.yml
          git diff --check

      - name: Uložit bezpečnou opravu
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonická evidence'
          git config user.email 'info@nasekadan.cz'
          git add scripts/enforce_all_article_visibility.py sitemap.xml index.html clanky/index.html clanky/strana-*.html
          git add -u .github/workflows/fix-sitemap-idempotence-once-20260805.yml
          git commit -m 'Zastavit hromadění prázdných řádků v sitemapě'
          sha="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sha="$(git rev-parse HEAD)"
            sleep $((attempt * 3))
          done
          exit 1

      - name: Nasadit opravenou sitemapu, titulku a archiv
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

          bundle="$RUNNER_TEMP/canonical-fix"
          mkdir -p "$bundle/clanky"
          cp index.html sitemap.xml "$bundle/"
          cp clanky/index.html clanky/strana-*.html "$bundle/clanky/"
          cat > "$bundle/deployment-health.txt" <<EOF
          status=ok
          source=${{ steps.commit.outputs.sha }}
          canonical_registry=verified
          sitemap_idempotent=true
          deployed_at=$(date -u +%FT%TZ)
          EOF
          tar -C "$bundle" -czf "$RUNNER_TEMP/canonical-fix.tgz" .

          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/canonical-fix.tgz" ubuntu@57.129.43.215:/tmp/canonical-fix.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          rm -rf /tmp/canonical-fix
          mkdir -p /tmp/canonical-fix
          tar -xzf /tmp/canonical-fix.tgz -C /tmp/canonical-fix
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          sudo install -m 0644 /tmp/canonical-fix/index.html /var/www/nasekadan/index.html
          sudo install -m 0644 /tmp/canonical-fix/sitemap.xml /var/www/nasekadan/sitemap.xml
          sudo install -m 0644 /tmp/canonical-fix/deployment-health.txt /var/www/nasekadan/deployment-health.txt
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          for file in /tmp/canonical-fix/clanky/*.html; do
            sudo install -m 0644 "$file" "/var/www/nasekadan/clanky/$(basename "$file")"
          done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/canonical-fix/index.html nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp /tmp/canonical-fix/sitemap.xml nasekadan-web:/usr/share/nginx/html/sitemap.xml
            sudo docker cp /tmp/canonical-fix/deployment-health.txt nasekadan-web:/usr/share/nginx/html/deployment-health.txt
            sudo docker cp /tmp/canonical-fix/clanky/. nasekadan-web:/usr/share/nginx/html/clanky/
          fi
          rm -rf /tmp/canonical-fix /tmp/canonical-fix.tgz
          REMOTE

      - name: Veřejně ověřit všechny kanály a H1
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, json, os, re, ssl, time
          import urllib.request
          import xml.etree.ElementTree as ET

          BASE = 'https://nasekadan.cz'
          ctx = ssl._create_unverified_context()

          def fetch(path):
              last = None
              for attempt in range(12):
                  try:
                      sep = '&' if '?' in path else '?'
                      req = urllib.request.Request(
                          BASE + path + sep + 'canonical_fix=' + str(time.time_ns()),
                          headers={'User-Agent':'NaseKadanCanonicalFix/1.0','Cache-Control':'no-cache, no-store','Pragma':'no-cache'},
                      )
                      with urllib.request.urlopen(req, timeout=45, context=ctx) as response:
                          if response.status != 200:
                              raise RuntimeError(response.status)
                          return response.read().decode('utf-8', 'replace')
                  except Exception as exc:
                      last = exc
                      time.sleep(5)
              raise last

          def unique(seq):
              out, seen = [], set()
              for x in seq:
                  if x and x not in seen:
                      seen.add(x); out.append(x)
              return out

          home = fetch('/')
          first = fetch('/clanky/')
          page_links = unique(re.findall(r'href=["\'](/clanky/strana-(\d+)\.html)["\']', first, re.I))
          page_paths = ['/clanky/'] + [p for p, _ in sorted(page_links, key=lambda x: int(x[1]))]
          pages = [first] + [fetch(p) for p in page_paths[1:]]
          archive = '\n'.join(pages)
          rss = fetch('/rss.xml')
          sitemap = fetch('/sitemap.xml')
          news = fetch('/news-sitemap.xml')
          health = fetch('/deployment-health.txt')
          registry = json.loads(fetch('/data/published-content-index.json'))

          href_re = re.compile(r'href=["\'](/clanky/[^"\']+\.html)["\']', re.I)
          archive_urls = unique([BASE + x for x in href_re.findall(archive) if '/parts/' not in x and not re.search(r'/strana-\d+\.html$', x)])
          rss_root = ET.fromstring(rss)
          rss_urls = unique([(n.findtext('link') or '').strip() for n in rss_root.findall('.//item')])
          ns = {'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sm_root = ET.fromstring(sitemap)
          sitemap_all = [(n.text or '').strip() for n in sm_root.findall('.//s:loc', ns)]
          sitemap_urls = unique([u for u in sitemap_all if '/clanky/' in u and u.endswith('.html') and '/parts/' not in u and not re.search(r'/strana-\d+\.html$', u)])
          news_root = ET.fromstring(news)
          news_urls = unique([(n.text or '').strip() for n in news_root.findall('.//s:loc', ns)])
          entries = registry.get('articles') or registry.get('entries') or []
          registry_urls = [e.get('url') or e.get('canonical_url') for e in entries if (e.get('publication_status') or e.get('status') or 'published') not in {'draft','scheduled','removed'}]

          assert registry['article_count'] == len(registry_urls) == 52
          assert set(registry_urls) == set(archive_urls)
          assert set(registry_urls) == set(rss_urls)
          assert set(registry_urls) == set(sitemap_urls)
          assert len(sitemap_all) == len(set(sitemap_all)), 'Veřejná sitemap obsahuje duplicitní URL.'
          assert not re.search(r'\n[ \t]*\n[ \t]*\n', sitemap), 'Veřejná sitemap obsahuje nahromaděné prázdné řádky.'
          assert 'status=ok' in health
          assert 'sitemap_idempotent=true' in health
          assert 'source=' + os.environ['EXPECTED_SHA'] in health
          assert len(news_urls) == 10

          for entry in entries:
              url = entry.get('url') or entry.get('canonical_url')
              page = fetch(url.removeprefix(BASE))
              m = re.search(r'<h1[^>]*>(.*?)</h1>', page, re.I | re.S)
              actual = ' '.join(html.unescape(re.sub(r'<[^>]+>', '', m.group(1))).split()) if m else ''
              assert actual == entry.get('h1'), f'H1 mismatch: {url}'

          assert href_re.search(home), 'Titulka neobsahuje články.'
          print(json.dumps({
              'status':'success',
              'articles':len(registry_urls),
              'archive_pages':len(page_paths),
              'rss':len(rss_urls),
              'news_sitemap':len(news_urls),
              'sitemap_unique':len(sitemap_all),
              'all_h1_checked':True,
          }, ensure_ascii=False))
          PY
