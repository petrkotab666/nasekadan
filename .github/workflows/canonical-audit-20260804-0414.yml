# trigger 2026-08-04T04:14:17+02:00
name: Kanonický audit publikovaného obsahu 2026-08-04 04:14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-audit-20260804-0414.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-published-index-sync
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Načíst živý web a ověřit kanonický registr
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import collections, datetime, hashlib, html, json, re, ssl, subprocess, time, urllib.request
          from pathlib import Path
          import xml.etree.ElementTree as ET

          BASE='https://nasekadan.cz'
          REG=Path('data/published-content-index.json')
          STATUS=Path('.github/canonical-published-index-status.json')
          ctx=ssl._create_unverified_context()

          def fetch(path):
              url = path if path.startswith('http') else BASE + path
              last=None
              for attempt in range(6):
                  try:
                      sep='&' if '?' in url else '?'
                      req=urllib.request.Request(url+sep+'canonical_audit='+str(time.time_ns()),headers={
                          'User-Agent':'NaseKadanCanonicalAudit/2.3',
                          'Cache-Control':'no-cache, no-store, max-age=0',
                          'Pragma':'no-cache'})
                      with urllib.request.urlopen(req,timeout=45,context=ctx) as r:
                          if r.status != 200: raise RuntimeError(f'{url}: HTTP {r.status}')
                          return r.read().decode('utf-8','replace')
                  except Exception as exc:
                      last=exc; time.sleep(2+attempt)
              raise last

          def uniq(seq):
              out=[]; seen=set()
              for x in seq:
                  if x and x not in seen: seen.add(x); out.append(x)
              return out

          def h1(page):
              m=re.search(r'<h1[^>]*>(.*?)</h1>',page,re.I|re.S)
              return ' '.join(html.unescape(re.sub(r'<[^>]+>','',m.group(1))).split()) if m else ''

          home=fetch('/')
          archive_first=fetch('/clanky/')
          page_paths=uniq([m[0] for m in re.findall(r'href=["\'](/clanky/strana-(\d+)\.html)["\']',archive_first,re.I)])
          page_paths=sorted(page_paths,key=lambda p:int(re.search(r'(\d+)',p).group(1)))
          archive_pages=[archive_first]+[fetch(p) for p in page_paths]
          archive='\n'.join(archive_pages)
          rss=fetch('/rss.xml')
          sitemap=fetch('/sitemap.xml')
          news=fetch('/news-sitemap.xml')
          health=fetch('/deployment-health.txt')

          href_re=re.compile(r'href=["\'](/clanky/[^"\']+\.html)["\']',re.I)
          home_urls=[BASE+p for p in uniq(href_re.findall(home)) if '/parts/' not in p and '/strana-' not in p]
          archive_urls=[BASE+p for p in uniq(href_re.findall(archive)) if '/parts/' not in p and '/strana-' not in p]
          rss_root=ET.fromstring(rss)
          rss_urls=uniq([(n.findtext('link') or '').strip() for n in rss_root.findall('.//item')])
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sm_root=ET.fromstring(sitemap)
          sm_urls=uniq([(n.text or '').strip() for n in sm_root.findall('.//s:loc',ns)
                        if '/clanky/' in (n.text or '') and (n.text or '').endswith('.html') and '/parts/' not in (n.text or '') and '/strana-' not in (n.text or '')])
          news_root=ET.fromstring(news)
          news_urls=uniq([(n.text or '').strip() for n in news_root.findall('.//s:loc',ns)])

          data=json.loads(REG.read_text(encoding='utf-8'))
          articles=data['articles']
          reg_urls=[a['url'] for a in articles]
          fps=[a['fingerprint'] for a in articles]
          du_urls=sorted(k for k,v in collections.Counter(reg_urls).items() if v>1)
          du_fps=sorted(k for k,v in collections.Counter(fps).items() if v>1)
          assert not du_urls, f'Duplicitní URL: {du_urls}'
          assert not du_fps, f'Duplicitní fingerprinty: {du_fps}'
          assert set(reg_urls)==set(archive_urls), f'Archiv vs registr: chybí {set(archive_urls)-set(reg_urls)}, navíc {set(reg_urls)-set(archive_urls)}'
          assert set(reg_urls)==set(rss_urls), f'RSS vs registr: chybí {set(rss_urls)-set(reg_urls)}, navíc {set(reg_urls)-set(rss_urls)}'
          assert set(reg_urls)==set(sm_urls), f'Sitemap vs registr: chybí {set(sm_urls)-set(reg_urls)}, navíc {set(reg_urls)-set(sm_urls)}'
          assert rss_urls==archive_urls, 'Pořadí RSS se liší od archivu.'
          assert health.strip(), 'deployment-health.txt je prázdný.'

          changed=[]
          for a in articles:
              page=fetch(a['url'])
              actual=h1(page)
              assert actual==a['h1'], f'Neshoda H1 {a["url"]}: {actual!r} != {a["h1"]!r}'
              a['status']={'homepage':a['url'] in home_urls,'archive':True,'rss':True,'sitemap':True,'news_sitemap':a['url'] in news_urls}
              a['publication_status']='published'
              path=a.get('source_path')
              if path:
                  latest=subprocess.check_output(['git','log','-1','--format=%H','--',path],text=True).strip()
                  if latest and latest!=a.get('source_commit'):
                      changed.append({'url':a['url'],'from':a.get('source_commit',''),'to':latest})
                      a['source_commit']=latest
              m=re.search(r'<meta[^>]+property=["\']article:modified_time["\'][^>]+content=["\']([^"\']+)',page,re.I)
              if not m: m=re.search(r'"dateModified"\s*:\s*"([^"]+)"',page)
              if m: a['modified_at']=m.group(1)

          required=('title','h1','url','published_at','modified_at','persons','organizations','places','cases','topics','fingerprint','status','source_commit')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          trigger=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          hm=re.search(r'^source=(.+)$',health,re.M)
          health_source=hm.group(1).strip() if hm else ''
          data['generated_at']=now
          data['source_commit']=trigger
          data['article_count']=len(articles)
          val=data.setdefault('validation',{})
          val.update({
              'homepage_count':len(home_urls),'archive_count':len(archive_urls),'archive_page_count':len(archive_pages),
              'rss_count':len(rss_urls),'sitemap_all_articles_present':set(reg_urls)==set(sm_urls),
              'news_sitemap_recent_count':len(news_urls),'deployment_health':'verified_nonempty',
              'deployment_health_status_field_present':bool(re.search(r'^status=',health,re.M)),
              'required_fields_complete':all(all(k in a for k in required) for a in articles),
              'duplicate_urls':du_urls,'duplicate_fingerprints':du_fps,
              'per_article_source_commits':all(bool(a.get('source_commit')) for a in articles),
              'deployment_health_source':health_source,'public_audit_at':now,
              'public_audit_sha256':hashlib.sha256((home+archive+rss+sitemap+news+health).encode()).hexdigest(),
              'repair_pending_public_verification':False,'rss_order_matches_archive':rss_urls==archive_urls,
              'public_repair_verification':{
                  'method':'github-actions-live-canonical-audit-paginated-archive-v2.3',
                  'homepage_articles':len(home_urls),'archive_articles':len(archive_urls),'archive_pages':len(archive_pages),
                  'rss_articles':len(rss_urls),'sitemap_articles':len(sm_urls),'news_sitemap_articles':len(news_urls),
                  'all_public_h1_checked':True,'deployment_health_nonempty':bool(health.strip()),
                  'deployment_health_source':health_source,'completed_at':now},
              'last_registry_refresh':{
                  'reason':'scheduled live re-audit of homepage, paginated archive, RSS, both sitemaps, deployment health and article source history',
                  'trigger_commit':trigger,'classification':'scheduled_consistency_audit',
                  'changed_source_commits':changed,'changed_metadata':[],
                  'homepage_articles':len(home_urls),'archive_articles':len(archive_urls),'archive_pages':len(archive_pages),
                  'rss_articles':len(rss_urls),'sitemap_articles':len(sm_urls),'news_sitemap_articles':len(news_urls),
                  'completed_at':now}
          })
          REG.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          status={'status':'success','checked_at':now,'registry_publicly_verified':True,'article_count':len(articles),
                  'homepage_count':len(home_urls),'archive_count':len(archive_urls),'archive_page_count':len(archive_pages),
                  'rss_count':len(rss_urls),'sitemap_count':len(sm_urls),'news_sitemap_count':len(news_urls),
                  'duplicate_urls':du_urls,'duplicate_fingerprints':du_fps,'rss_order_matches_archive':True,
                  'all_public_h1_checked':True,'deployment_health_source':health_source,
                  'deployment_health_raw':health,'changed_source_commits':changed}
          STATUS.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,ensure_ascii=False))
          PY

      - name: Uložit audit a odstranit jednorázový workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/canonical-audit-20260804-0414.yml
          git add data/published-content-index.json .github/canonical-published-index-status.json .github/workflows/canonical-audit-20260804-0414.yml
          git commit -m 'Aktualizovat kanonický audit publikovaného obsahu [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            if [ "$attempt" = 4 ]; then exit 1; fi
          done
