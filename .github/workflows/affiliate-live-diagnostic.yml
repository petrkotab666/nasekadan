name: Dočasná diagnostika živé affiliate databáze

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.issue.title == '[affiliate-live-diagnostic] trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ověřit živé zdroje
        run: |
          python - <<'PY'
          import datetime, hashlib, json, urllib.request
          from pathlib import Path

          def get(url, required=True):
              req = urllib.request.Request(url, headers={'User-Agent':'Affiliate-live-diagnostic/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.read(), r.status
              except Exception:
                  if required:
                      raise
                  return b'', None

          central_url='https://pojistime.to/assets/affiliate-database.json'
          overlay_url='https://pojistime.to/assets/ehub-partner-assets/brainmarket.json'
          raw,status=get(central_url)
          overlay,overlay_status=get(overlay_url, required=False)
          db=json.loads(raw)
          payload={
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat(),
            'centralUrl':central_url,
            'centralHttpStatus':status,
            'centralUpdatedAt':db.get('updatedAt'),
            'centralSha256Raw':hashlib.sha256(raw).hexdigest(),
            'centralSha256WithOverlay':hashlib.sha256(raw+b'\0'+overlay).hexdigest(),
            'centralBytes':len(raw),
            'overlayUrl':overlay_url,
            'overlayHttpStatus':overlay_status,
            'overlayBytes':len(overlay),
            'overlaySha256':hashlib.sha256(overlay).hexdigest() if overlay else None,
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/affiliate-live-diagnostic.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
      - name: Uložit diagnostiku
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/affiliate-live-diagnostic.json
          git commit -m "Uložit diagnostiku živé affiliate databáze" || exit 0
          git push
