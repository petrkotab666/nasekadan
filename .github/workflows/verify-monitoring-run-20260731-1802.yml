name: Jednorázová živá kontrola monitoringu

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/verify-monitoring-run-20260731-1802.yml'
      - '.github/verify-monitoring-run-20260731-1802.txt'

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ověřit skutečný veřejný web proti aktuálnímu main
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$expected"
          for attempt in $(seq 1 8); do
            if python3 scripts/verify_public_release.py \
              --root . \
              --base https://nasekadan.cz \
              --expected-sha "$expected" \
              --cache-key "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"; then
              echo "OVĚŘENO LIVE: source=$expected"
              exit 0
            fi
            sleep 10
            expected="$(git ls-remote origin refs/heads/main | cut -f1)"
          done
          exit 1
