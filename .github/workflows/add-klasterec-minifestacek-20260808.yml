name: Add Klasterec Minifestacek to weekly culture

on:
  push:
    branches: [main]
    paths:
      - 'data/add-klasterec-minifestacek-20260808.trigger'
  workflow_dispatch:

concurrency:
  group: add-klasterec-minifestacek-20260808
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update article
        run: python3 scripts/add_klasterec_minifestacek_20260808.py
      - name: Commit update
        run: |
          git config user.name "nasekadan-bot"
          git config user.email "nasekadan-bot@users.noreply.github.com"
          git add clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html
          if git diff --cached --quiet; then
            echo "No content change needed"
          else
            git commit -m "Doplň Minifestáček v Loděnici do kulturního přehledu"
            git push origin HEAD:main
          fi
      - name: Deploy canonical production
        run: bash deploy/sync-production.sh
      - name: Verify public article
        run: |
          python3 - <<'PY'
          import time, urllib.request
          u='https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html?cb='+str(int(time.time()))
          txt=urllib.request.urlopen(u, timeout=30).read().decode('utf-8','replace')
          assert 'Minifestáček v Loděnici' in txt
          assert 'Abdera' in txt and 'Black Ewe' in txt and 'Izzy' in txt and 'Fext' in txt
          assert 'vstup je dobrovolný' in txt
          print('public verification ok')
          PY
