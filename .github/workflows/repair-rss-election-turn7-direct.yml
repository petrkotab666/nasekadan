name: Přímá oprava RSS po připnutí zimního stadionu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-rss-election-turn7-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-rss-election-turn7-direct
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Opravit RSS v repozitáři
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – oprava RSS'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/repair_rss_election_turn7.py
            git diff --check
            git add rss.xml
            if ! git diff --cached --quiet; then
              git commit -m 'Doplnit volební článek na začátek RSS'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$pushed" = 1

      - name: Nasadit RSS na OVH
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 rss.xml ubuntu@57.129.43.215:/tmp/nasekadan-rss-turn7.xml
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          sudo install -m 0644 /tmp/nasekadan-rss-turn7.xml /var/www/nasekadan/rss.xml
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nasekadan-rss-turn7.xml nasekadan-web:/usr/share/nginx/html/rss.xml
          fi
          rm -f /tmp/nasekadan-rss-turn7.xml
          REMOTE

      - name: Veřejně ověřit titulku, archiv, RSS, datum a počasí
        shell: bash
        run: |
          set -euo pipefail
          pin='/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          latest='/clanky/komunalni-volby-kadan-kandidaty-lhuta-2026.html'
          ok=0
          for attempt in $(seq 1 15); do
            q="${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            home="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/?turn7final=$q" || true)"
            article="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz${pin}?turn7final=$q" || true)"
            archive="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/clanky/?turn7final=$q" || true)"
            rss="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/rss.xml?turn7final=$q" || true)"
            forecast="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/api/pocasi-predpoved.json?turn7final=$q" || true)"
            if PIN="$pin" LATEST="$latest" HOME_HTML="$home" ARTICLE_HTML="$article" ARCHIVE_HTML="$archive" RSS_XML="$rss" FORECAST_JSON="$forecast" python3 - <<'PY'
          import json, os, re
          from xml.etree import ElementTree as ET
          pin=os.environ['PIN']; latest=os.environ['LATEST']; home=os.environ['HOME_HTML']; article=os.environ['ARTICLE_HTML']
          archive=os.environ['ARCHIVE_HTML']; rss=os.environ['RSS_XML']; forecast=os.environ['FORECAST_JSON']
          hero=re.search(r'<section class="wrap hero" id="clanky".*?</section>',home,re.S)
          assert hero and f'data-latest-article-href="{pin}"' in hero.group(0)
          aside=re.search(r'<aside class="current-aside">.*?</aside>',hero.group(0),re.S)
          assert aside and f'href="{latest}"' in aside.group(0)
          first_archive=re.search(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="([^"]+)"',archive,re.S)
          assert first_archive and first_archive.group(1)==latest
          assert 'article:published_time" content="2026-08-03T22:05:00+02:00"' in article
          assert '/pocasi.js' in home
          root=ET.fromstring(rss)
          links=[node.findtext('link') for node in root.findall('./channel/item')]
          assert links and links[0]=='https://nasekadan.cz'+latest
          assert links.count('https://nasekadan.cz'+latest)==1
          data=json.loads(forecast); ts=data.get('properties',{}).get('timeseries')
          assert isinstance(ts,list) and ts
          print(json.dumps({'latest':latest,'weather_points':len(ts)},ensure_ascii=False))
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1

      - name: Zapsat úspěšné veřejné ověření
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data={
            'checked_at': datetime.now(timezone.utc).isoformat(),
            'homepage_pin_ok': True,
            'sidebar_latest': '/clanky/komunalni-volby-kadan-kandidaty-lhuta-2026.html',
            'archive_first': '/clanky/komunalni-volby-kadan-kandidaty-lhuta-2026.html',
            'rss_first': 'https://nasekadan.cz/clanky/komunalni-volby-kadan-kandidaty-lhuta-2026.html',
            'article_published_time_preserved': '2026-08-03T22:05:00+02:00',
            'weather_ok': True,
            'result': 'success'
          }
          Path('.github/stadium-pin-turn7-final-status.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'Naše Kadaň – veřejné ověření'
          git config user.email 'info@nasekadan.cz'
          git add .github/stadium-pin-turn7-final-status.json
          git commit -m 'Zapsat úspěšné ověření připnutí, RSS a počasí [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

# Druhý commit aktivuje push trigger po založení workflow.
