name: Produkční SEO a AI build gate

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'Dockerfile'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'news-sitemap.xml'
      - 'rss.xml'
      - 'llms.txt'
      - 'scripts/**'
      - '.github/workflows/production-seo-build-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stáhnout web
        uses: actions/checkout@v4

      - name: Sestavit přesný produkční obraz
        run: docker build --progress=plain -t nasekadan-seo-test .

      - name: Spustit obraz a zkontrolovat výstup
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name nasekadan-seo-test -p 127.0.0.1:38080:80 nasekadan-seo-test
          trap 'docker logs nasekadan-seo-test || true; docker rm -f nasekadan-seo-test || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:38080/healthz >/dev/null && break
            sleep 2
          done
          home=$(curl -fsS http://127.0.0.1:38080/)
          article=$(curl -fsS http://127.0.0.1:38080/clanky/nemocnice-kadan.html)
          robots=$(curl -fsS http://127.0.0.1:38080/robots.txt)
          sitemap=$(curl -fsS http://127.0.0.1:38080/sitemap.xml)
          audit=$(curl -fsS http://127.0.0.1:38080/SEO-AI-AUDIT.md)
          grep -Fq 'google-site-verification' <<<"$home"
          grep -Fq '<title>Nemocnice Kadaň: ztráta 46 milionů a pomoc města | Naše Kadaň</title>' <<<"$article"
          grep -Fq 'property="article:published_time"' <<<"$article"
          grep -Fq 'User-agent: OAI-SearchBot' <<<"$robots"
          grep -Fq 'clanky/pozemky-koupaliste-kadan.html' <<<"$sitemap"
          grep -Fq 'Chyby: **0**' <<<"$audit"
          grep -Fq 'Varování: **0**' <<<"$audit"
