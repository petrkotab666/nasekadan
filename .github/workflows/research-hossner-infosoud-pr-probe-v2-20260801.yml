name: Kontrolovaný PR průchod InfoSoudu Hossner v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-hossner-infosoud-pr-probe-v2-20260801.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Nainstalovat klienta
        run: |
          python3 -m pip install --disable-pip-version-check --quiet --index-url https://pypi.org/simple infosoud==0.1.0 requests
      - name: Projít spisy senátu 30 C
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hossner-result-v2 && mkdir -p /tmp/hossner-result-v2
          cat > /tmp/probe_v2.py <<'PY'
          from __future__ import annotations
          import concurrent.futures, dataclasses, inspect, json, re, traceback
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any
          import infosoud
          try:
              from infosoud import InfoSoudClient
          except ImportError:
              from infosoud.client import InfoSoudClient

          OUT=Path('/tmp/hossner-result-v2')
          def plain(x:Any)->Any:
              if dataclasses.is_dataclass(x): return plain(dataclasses.asdict(x))
              if isinstance(x,dict): return {str(k):plain(v) for k,v in x.items()}
              if isinstance(x,(list,tuple,set)): return [plain(v) for v in x]
              if hasattr(x,'model_dump'): return plain(x.model_dump())
              if hasattr(x,'dict'):
                  try:return plain(x.dict())
                  except Exception:pass
              if hasattr(x,'__dict__') and not isinstance(x,(str,bytes,int,float,bool)):
                  return {k:plain(v) for k,v in vars(x).items() if not k.startswith('_')}
              if isinstance(x,datetime):return x.isoformat()
              try:json.dumps(x);return x
              except Exception:return str(x)
          def txt(x):return json.dumps(plain(x),ensure_ascii=False,sort_keys=True,default=str)

          client=InfoSoudClient()
          diag={'module':infosoud.__file__,'class_module':InfoSoudClient.__module__,'class_signature':str(inspect.signature(InfoSoudClient)),'methods':{}}
          for n in ['build_court_map','resolve_court_name','search_case','search_hearings','get_event_detail']:
              a=getattr(InfoSoudClient,n,None)
              if a:
                  try:diag['methods'][n]={'signature':str(inspect.signature(a)),'source':inspect.getsource(a)}
                  except Exception as e:diag['methods'][n]={'error':repr(e)}
          OUT.joinpath('diagnostic.json').write_text(json.dumps(diag,ensure_ascii=False,indent=2),encoding='utf-8')

          court_map=client.build_court_map()
          OUT.joinpath('courts.json').write_text(json.dumps(plain(court_map),ensure_ascii=False,indent=2),encoding='utf-8')
          chom=[]
          for k,v in court_map.items():
              if 'chomutov' in str(v).lower():chom.append((k,v))
          for q in ['Chomutov','Okresní soud v Chomutově','OS Chomutov']:
              try:chom.append((client.resolve_court_name(q),q))
              except Exception:pass
          seen=[]
          for code,name in chom:
              if code and code not in [x[0] for x in seen]:seen.append((code,name))
          OUT.joinpath('chomutov.json').write_text(json.dumps(plain(seen),ensure_ascii=False,indent=2),encoding='utf-8')
          if not seen:raise SystemExit('Kód chomutovského soudu nenalezen.')
          court=seen[0][0]
          print('CHOMUTOV COURT',court,seen)

          def useful(v):
              if not v:return False
              t=txt(v).lower()
              return len(t)>30 and not any(z in t for z in ['nenalezen','not found','nebylo nalezeno','zadane rizeni nebylo'])
          def query(spis):
              try:
                  case=client.search_case(spis,court)
                  if not useful(case):return None
                  try:hear=client.search_hearings(spis,court)
                  except Exception as e:hear={'error':repr(e)}
                  return {'file_no':spis,'case':plain(case),'hearings':plain(hear)}
              except Exception as e:return {'file_no':spis,'error':repr(e)}

          known=query('30 C 131/2025')
          OUT.joinpath('known.json').write_text(json.dumps(known,ensure_ascii=False,indent=2),encoding='utf-8')
          print('KNOWN',txt(known)[:12000])
          if not known or known.get('error'):raise SystemExit('Známý spis nebyl načten.')

          numbers=[f'30 C {n}/2025' for n in range(1,301)]
          numbers += [f'30 C {n}/2024' for n in range(220,351)]
          numbers += [f'30 C {n}/2026' for n in range(1,101)]
          valid=[];errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              fut={ex.submit(query,s):s for s in numbers}
              for i,f in enumerate(concurrent.futures.as_completed(fut),1):
                  r=f.result()
                  if r and r.get('error'):errors.append(r)
                  elif r:valid.append(r)
                  if i%50==0:print(f'{i}/{len(numbers)} valid={len(valid)} errors={len(errors)}')

          def dates(item):
              return re.findall(r'20\d\d[-./]\d\d[-./]\d\d|\d{1,2}\.\s*\d{1,2}\.\s*20\d\d',txt(item))
          candidates=[]
          for item in valid:
              t=txt(item).lower();score=0;reasons=[]
              for terms,pts,reason in [
                (['2026-03-23','23.03.2026','23. 3. 2026'],50,'jednání 23. 3. 2026'),
                (['2026-01-','leden 2026'],12,'leden 2026'),
                (['mediac','mediátor'],25,'mediace'),
                (['přerušen','prerusen'],15,'přerušení'),
              ]:
                  if any(term in t for term in terms):score+=pts;reasons.append(reason)
              if score:candidates.append({'score':score,'reasons':reasons,'dates':dates(item),**item})
          candidates.sort(key=lambda x:(-x['score'],x['file_no']))
          valid.sort(key=lambda x:x['file_no'])
          OUT.joinpath('valid.json').write_text(json.dumps(valid,ensure_ascii=False,indent=2),encoding='utf-8')
          OUT.joinpath('candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          OUT.joinpath('errors.json').write_text(json.dumps(errors[:100],ensure_ascii=False,indent=2),encoding='utf-8')
          summary={'generated_at_utc':datetime.now(timezone.utc).isoformat(),'court':court,'queried':len(numbers),'valid_count':len(valid),'error_count':len(errors),'top_candidates':[{'file_no':c['file_no'],'score':c['score'],'reasons':c['reasons'],'dates':c['dates'],'case':c['case'],'hearings':c['hearings']} for c in candidates[:30]]}
          OUT.joinpath('summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY',json.dumps(summary,ensure_ascii=False,indent=2)[:60000])
          PY
          python3 /tmp/probe_v2.py
      - name: Nahrát výsledky
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hossner-infosoud-pr-probe-v2
          path: /tmp/hossner-result-v2
          if-no-files-found: warn
          retention-days: 7
