name: Opravit kontrast ankety kláštera přes issue

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fix-alzbetinsky-poll-contrast-issue
  cancel-in-progress: true

env:
  ARTICLE: clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
  DRAFT: .github/drafts/alzbetinsky-klaster-kadan-20260803.html
  VERSION: 20260803-alzbetinsky-contrast-v1
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  repair-deploy-verify:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'petrkotab666' && github.event.issue.title == '[alzbetinsky-contrast] deploy')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Načíst main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit kontrast
        run: |
          set -euo pipefail
          python3 scripts/fix_alzbetinsky_poll_contrast.py
          python3 -m py_compile scripts/fix_alzbetinsky_poll_contrast.py
          node --check site.js
          grep -Fq 'POLL_ALZBETINSKY_HIGH_CONTRAST_V1' site.js
          grep -Fq '[data-poll-id="alzbetinsky-klaster-kadan-2026"] .poll-result-label' site.js
          grep -Fq "button.style.color = selected ? '#74152a' : '';" site.js
          grep -Fq "/site.js?v=${VERSION}" "$ARTICLE"
          grep -Fq "/site.js?v=${VERSION}" "$DRAFT"

      - name: Uložit zdrojovou opravu
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kontrast ankety'
          git config user.email 'info@nasekadan.cz'
          git add site.js "$ARTICLE" "$DRAFT" scripts/fix_alzbetinsky_poll_contrast.py
          if ! git diff --cached --quiet; then
            git commit -m 'Opravit čitelnost ankety u alžbětinského kláštera [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 5 ]] && exit 1
              sleep $((attempt * 4))
            done
          fi

      - name: Připravit SSH
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"; break; fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit na OVH
        id: production
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nk-alzbetinsky/clanky"
          cp site.js "$RUNNER_TEMP/nk-alzbetinsky/site.js"
          cp "$ARTICLE" "$RUNNER_TEMP/nk-alzbetinsky/clanky/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/nk-alzbetinsky" ubuntu@57.129.43.215:/tmp/nk-alzbetinsky
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -m 0644 /tmp/nk-alzbetinsky/site.js /var/www/nasekadan/site.js
          sudo install -m 0644 /tmp/nk-alzbetinsky/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html /var/www/nasekadan/clanky/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-alzbetinsky/site.js nasekadan-web:/usr/share/nginx/html/site.js
            sudo docker cp /tmp/nk-alzbetinsky/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html nasekadan-web:/usr/share/nginx/html/clanky/
          fi
          grep -Fq 'POLL_ALZBETINSKY_HIGH_CONTRAST_V1' /var/www/nasekadan/site.js
          grep -Fq '/site.js?v=20260803-alzbetinsky-contrast-v1' /var/www/nasekadan/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
          rm -rf /tmp/nk-alzbetinsky
          REMOTE

      - name: Veřejně ověřit opravu
        id: verify
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 15); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/${ARTICLE}?v=${stamp}-${attempt}" || true)"
            js="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/site.js?v=${stamp}-${attempt}" || true)"
            if [[ "$article" == *"/site.js?v=20260803-alzbetinsky-contrast-v1"* ]] \
              && [[ "$js" == *"POLL_ALZBETINSKY_HIGH_CONTRAST_V1"* ]] \
              && [[ "$js" == *"color:#ffffff!important"* ]] \
              && [[ "$js" == *"color:#74152a!important"* ]]; then
              echo 'ok=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 6
          done
          echo 'ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Zapsat výsledek do issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          PROD: ${{ steps.production.outcome }}
          VERIFIED: ${{ steps.verify.outputs.ok }}
        with:
          script: |
            const ok = process.env.PROD === 'success' && process.env.VERIFIED === 'true';
            const body = ok
              ? '✅ Kontrast ankety u článku o alžbětinském klášteře je opravený, nasazený na OVH a veřejně ověřený.'
              : `❌ Oprava nebyla veřejně potvrzena. Produkce: ${process.env.PROD || 'unknown'}, ověření: ${process.env.VERIFIED || 'false'}.`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'});
