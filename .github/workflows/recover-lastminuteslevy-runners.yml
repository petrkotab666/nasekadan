name: Obnovit runnery LastMinuteSlevy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-lastminuteslevy-runners.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/recover-lastminuteslevy-runners-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  recover:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Restartovat zaseknuté runnery katalogu
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          current="${RUNNER_NAME:-unknown}"
          echo "CURRENT_RUNNER=$current"
          mapfile -t services < <(systemctl list-unit-files --type=service --no-legend 'actions.runner*' 2>/dev/null | awk '{print $1}' | grep -Ei 'lastminuteslevy|dilynazakazku|dily.?na.?zakazku' || true)
          if [ "${#services[@]}" -eq 0 ]; then
            mapfile -t services < <(systemctl list-units --type=service --all --no-legend 2>/dev/null | awk '{print $1}' | grep -Ei '^actions\.runner\..*(lastminuteslevy|dilynazakazku|dily.?na.?zakazku).*\.service$' || true)
          fi
          if [ "${#services[@]}" -eq 0 ]; then
            echo 'Cílové runner služby nebyly nalezeny.' >&2
            systemctl list-unit-files --type=service --no-legend 'actions.runner*' 2>/dev/null || true
            exit 1
          fi
          echo "TARGETS=${services[*]}"
          for service in "${services[@]}"; do sudo systemctl stop "$service" || true; done
          sleep 3
          sudo pkill -TERM -f '/home/ubuntu/actions-runner/_work/lastminuteslevy/' 2>/dev/null || true
          sudo pkill -TERM -f '/opt/actions-runner-dilynazakazku/_work/' 2>/dev/null || true
          sleep 4
          sudo pkill -KILL -f '/home/ubuntu/actions-runner/_work/lastminuteslevy/' 2>/dev/null || true
          sudo pkill -KILL -f '/opt/actions-runner-dilynazakazku/_work/' 2>/dev/null || true
          states=()
          for service in "${services[@]}"; do
            sudo systemctl reset-failed "$service" || true
            sudo systemctl enable "$service" >/dev/null 2>&1 || true
            sudo systemctl start "$service"
          done
          sleep 10
          for service in "${services[@]}"; do
            state="$(sudo systemctl is-active "$service" 2>/dev/null || true)"
            states+=("$service=$state")
            sudo systemctl --no-pager --full status "$service" | sed -n '1,22p' || true
            test "$state" = active
          done
          printf 'result=%s\n' "${states[*]}" >> "$GITHUB_OUTPUT"
      - name: Zapsat výsledek do PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.recover.outputs.result }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Obnova runnerů dokončena.\n\n\`${process.env.RESULT || 'obnova selhala'}\``});
