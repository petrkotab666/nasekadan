name: Zjistit stav úzkého nasazení počasí

on:
  push:
    branches: [main]
    paths:
      - '.github/weather-ssh-inspect-trigger.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Načíst běhy přesného workflow
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'hot-deploy-weather-via-ssh.yml',
              branch: 'main',
              per_page: 10
            });
            const result = [];
            for (const run of response.data.workflow_runs || []) {
              const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              result.push({
                id: run.id,
                name: run.name,
                display_title: run.display_title,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                head_sha: run.head_sha,
                created_at: run.created_at,
                updated_at: run.updated_at,
                html_url: run.html_url,
                jobs: (jobsResponse.data.jobs || []).map(job => ({
                  id: job.id,
                  name: job.name,
                  status: job.status,
                  conclusion: job.conclusion,
                  runner_name: job.runner_name,
                  labels: job.labels,
                  started_at: job.started_at,
                  completed_at: job.completed_at,
                  steps: (job.steps || []).map(step => ({
                    name: step.name,
                    status: step.status,
                    conclusion: step.conclusion,
                    number: step.number,
                    started_at: step.started_at,
                    completed_at: step.completed_at
                  }))
                }))
              });
            }
            fs.mkdirSync('.github', {recursive: true});
            fs.writeFileSync('.github/weather-hot-run-status.json', JSON.stringify({
              generated_at: new Date().toISOString(),
              inspected_by_run: context.runId,
              workflow: 'hot-deploy-weather-via-ssh.yml',
              runs: result
            }, null, 2) + '\n');

      - name: Uložit výsledek diagnostiky
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/weather-hot-run-status.json
            git commit -m 'Zapsat stav úzkého nasazení počasí [skip ci]' || exit 0
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
