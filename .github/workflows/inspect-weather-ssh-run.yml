name: Zjistit stav přímé diagnostiky serveru počasí

on:
  push:
    branches: [main]
    paths:
      - '.github/weather-ssh-inspect-trigger.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Načíst běhy přesného workflow
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'inspect-weather-server-direct.yml',
              branch: 'main',
              per_page: 10
            });
            const result = [];
            for (const run of response.data.workflow_runs || []) {
              const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:run.id,per_page:100});
              result.push({id:run.id,status:run.status,conclusion:run.conclusion,head_sha:run.head_sha,created_at:run.created_at,updated_at:run.updated_at,html_url:run.html_url,jobs:(jobsResponse.data.jobs||[]).map(job=>({id:job.id,name:job.name,status:job.status,conclusion:job.conclusion,runner_name:job.runner_name,steps:(job.steps||[]).map(step=>({name:step.name,status:step.status,conclusion:step.conclusion,number:step.number}))}))});
            }
            fs.mkdirSync('.github',{recursive:true});
            fs.writeFileSync('.github/weather-server-run-status.json',JSON.stringify({generated_at:new Date().toISOString(),workflow:'inspect-weather-server-direct.yml',runs:result},null,2)+'\n');

      - name: Uložit výsledek diagnostiky
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/weather-server-run-status.json
            git commit -m 'Zapsat přímou diagnostiku serveru počasí [skip ci]' || exit 0
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
