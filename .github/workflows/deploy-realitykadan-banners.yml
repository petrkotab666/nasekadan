name: Nasadit bannery Reality Kadaň

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-realitykadan-banners.yml'
      - '.github/realitykadan-banner-trigger.txt'
      - 'scripts/install_realitykadan_banners.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-realitykadan-banners
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit rotaci a opravit rozměry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install_realitykadan_banners.py
          grep -Fq "id:'realitykadan-byt'" reklamy.js
          grep -Fq "id:'realitykadan-garaz'" reklamy.js
          grep -Fq '.promo-card-wide.promo-card-full-image{' reklamy.js
          grep -Fq 'grid-template-columns:none!important' reklamy.js

      - name: Uložit změny do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add reklamy.js reklamy-oprava-obrazku.js scripts/install_realitykadan_banners.py
          git commit -m 'Opravit bannery Reality Kadaň přes celou šířku' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit na OVH
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rk-banner-upload"
          mkdir -p "$RUNNER_TEMP/rk-banner-upload/assets/reklamy"
          cp reklamy.js reklamy-oprava-obrazku.js "$RUNNER_TEMP/rk-banner-upload/"
          cp assets/reklamy/realitykadan-*-wide-v1.svg "$RUNNER_TEMP/rk-banner-upload/assets/reklamy/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/rk-banner-upload" ubuntu@57.129.43.215:/tmp/rk-banner-upload
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/assets/reklamy
          sudo install -m 0644 /tmp/rk-banner-upload/reklamy.js /var/www/nasekadan/reklamy.js
          sudo install -m 0644 /tmp/rk-banner-upload/reklamy-oprava-obrazku.js /var/www/nasekadan/reklamy-oprava-obrazku.js
          sudo install -m 0644 /tmp/rk-banner-upload/assets/reklamy/realitykadan-byt-wide-v1.svg /var/www/nasekadan/assets/reklamy/
          sudo install -m 0644 /tmp/rk-banner-upload/assets/reklamy/realitykadan-garaz-wide-v1.svg /var/www/nasekadan/assets/reklamy/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/assets/reklamy
            sudo docker cp /tmp/rk-banner-upload/reklamy.js nasekadan-web:/usr/share/nginx/html/reklamy.js
            sudo docker cp /tmp/rk-banner-upload/reklamy-oprava-obrazku.js nasekadan-web:/usr/share/nginx/html/reklamy-oprava-obrazku.js
            sudo docker cp /tmp/rk-banner-upload/assets/reklamy/realitykadan-byt-wide-v1.svg nasekadan-web:/usr/share/nginx/html/assets/reklamy/realitykadan-byt-wide-v1.svg
            sudo docker cp /tmp/rk-banner-upload/assets/reklamy/realitykadan-garaz-wide-v1.svg nasekadan-web:/usr/share/nginx/html/assets/reklamy/realitykadan-garaz-wide-v1.svg
          fi
          rm -rf /tmp/rk-banner-upload
          grep -Fq '.promo-card-wide.promo-card-full-image{' /var/www/nasekadan/reklamy.js
          REMOTE

      - name: Veřejně ověřit bez cache
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          js="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/reklamy.js?v=$stamp")"
          byt="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/assets/reklamy/realitykadan-byt-wide-v1.svg?v=$stamp")"
          garaz="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/assets/reklamy/realitykadan-garaz-wide-v1.svg?v=$stamp")"
          grep -Fq '.promo-card-wide.promo-card-full-image{' <<<"$js"
          grep -Fq 'grid-template-columns:none!important' <<<"$js"
          grep -Fq 'featured-cleaning-ad>a.promo-card-full-image' <<<"$js"
          grep -Fq 'KOUPÍME HO.' <<<"$byt"
          grep -Fq 'KOUPÍME JI.' <<<"$garaz"
          echo 'HOTOVO: bannery Reality Kadaň vyplňují celou reklamní kartu.'

      - name: Zapsat stav
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'realitykadan-banner-deploy-status.json';
            const status = {
              status: process.env.VERIFY === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              run_id: context.runId,
              public_verification: process.env.VERIFY || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat stav bannerů Reality Kadaň: ${status.status}`,
              content,
              ...(sha ? { sha } : {})
            });
