name: Nasadit výzvy ke sledování na Facebooku

on:
  push:
    branches: [main]
    paths:
      - '.github/facebook-follow-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-facebook-follow
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit skripty
        shell: bash
        run: |
          set -euo pipefail
          node --check facebook-follow.js
          node --check analytics.js
          grep -Fq 'https://www.facebook.com/nasekadan/' facebook-follow.js
          grep -Fq 'data-facebook-follow="home"' facebook-follow.js
          grep -Fq 'data-facebook-follow="article"' facebook-follow.js
          grep -Fq 'data-facebook-follow="footer"' facebook-follow.js
          grep -Fq '/facebook-follow.js?v=20260801-1' analytics.js

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/facebook-follow"
          mkdir -p "$RUNNER_TEMP/facebook-follow"
          cp facebook-follow.js analytics.js "$RUNNER_TEMP/facebook-follow/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/facebook-follow" ubuntu@57.129.43.215:/tmp/facebook-follow
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -m 0644 /tmp/facebook-follow/facebook-follow.js /var/www/nasekadan/facebook-follow.js
          sudo install -m 0644 /tmp/facebook-follow/analytics.js /var/www/nasekadan/analytics.js
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/facebook-follow/facebook-follow.js nasekadan-web:/usr/share/nginx/html/facebook-follow.js
            sudo docker cp /tmp/facebook-follow/analytics.js nasekadan-web:/usr/share/nginx/html/analytics.js
          fi
          rm -rf /tmp/facebook-follow
          grep -Fq 'https://www.facebook.com/nasekadan/' /var/www/nasekadan/facebook-follow.js
          grep -Fq '/facebook-follow.js?v=20260801-1' /var/www/nasekadan/analytics.js
          REMOTE

      - name: Veřejně ověřit bez cache
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=$stamp")"
          analytics="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/analytics.js?v=$stamp")"
          follow="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/facebook-follow.js?v=$stamp")"
          grep -Fq '/analytics.js' <<<"$home"
          grep -Fq '/facebook-follow.js?v=20260801-1' <<<"$analytics"
          grep -Fq 'https://www.facebook.com/nasekadan/' <<<"$follow"
          grep -Fq 'Neunikne vám nic důležitého z Kadaně' <<<"$follow"
          grep -Fq 'Neunikne vám další článek z Kadaně' <<<"$follow"
          grep -Fq 'Přejít na Facebook' <<<"$follow"
          echo 'HOTOVO: Facebook výzvy jsou veřejně dostupné na celém webu.'

      - name: Zapsat stav
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path='facebook-follow-status.json';
            const ok=process.env.DEPLOY==='success'&&process.env.VERIFY==='success';
            const status={
              status:ok?'success':'failed',
              checked_at_utc:new Date().toISOString(),
              run_id:context.runId,
              server_deploy:process.env.DEPLOY||'skipped',
              public_verification:process.env.VERIFY||'skipped'
            };
            const content=Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64');
            let sha;
            try{
              const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              if(!Array.isArray(current.data))sha=current.data.sha;
            }catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat stav Facebook výzev: ${status.status}`,content,...(sha?{sha}:{})});
