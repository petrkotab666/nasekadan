name: Finálně ověřit a opravit článek o koupališti

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-verify-repair-pool-20260731.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: final-pool-publication-20260731
  cancel-in-progress: false

env:
  SLUG: koupaliste-kadan-pozemky-skluzavka-provoz-2026
  ARTICLE: clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html
  SOCIAL_IMAGE: social/koupaliste-kadan-50-let-niagara-2026.png
  MARKER: .github/facebook-published/koupaliste-kadan-pozemky-skluzavka-provoz-2026-2a9cdac5e7.json
  OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  verify-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit a přímo nasadit ověřenou veřejnou verzi
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          test -f .github/drafts/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html
          test -f "$SOCIAL_IMAGE"

          python3 scripts/prepare_pool_article_20260731.py
          python3 scripts/enforce_current_article_order.py
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/enforce_article_visibility.py
          python3 scripts/sort_articles_chronologically.py
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('social/koupaliste-kadan-50-let-niagara-2026.png')
          with Image.open(p) as im:
              assert im.format == 'PNG', im.format
              assert im.size == (1200, 630), im.size
          assert p.stat().st_size >= 10000, p.stat().st_size
          t=Path('clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html').read_text(encoding='utf-8')
          assert 'Kadaňské koupaliště slaví 50 let' in t
          assert 'https://nasekadan.cz/social/koupaliste-kadan-50-let-niagara-2026.png' in t
          assert 'kdy bude možné atrakci bezpečně používat i v horkých dnech' in t
          PY
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" news-sitemap.xml

          git config user.name 'Naše Kadaň finální publikační pojistka'
          git config user.email 'info@nasekadan.cz'
          git add -A -- "$ARTICLE" "$SOCIAL_IMAGE" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt
          git commit -m 'Finálně opravit zveřejnění článku o koupališti' || true
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            if [[ "$attempt" == 4 ]]; then exit 1; fi
            sleep $((attempt * 5))
          done

          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/nk-pool-final"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$SOCIAL_IMAGE" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$bundle/"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'rm -rf /tmp/nk-pool-final'
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-pool-final
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 /tmp/nk-pool-final/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-pool-final/clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 /tmp/nk-pool-final/social/koupaliste-kadan-50-let-niagara-2026.png /var/www/nasekadan/social/
          sudo install -m 0644 /tmp/nk-pool-final/index.html /tmp/nk-pool-final/rss.xml /tmp/nk-pool-final/sitemap.xml /tmp/nk-pool-final/news-sitemap.xml /tmp/nk-pool-final/llms.txt /tmp/nk-pool-final/robots.txt /var/www/nasekadan/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp /tmp/nk-pool-final/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp /tmp/nk-pool-final/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker cp /tmp/nk-pool-final/social/koupaliste-kadan-50-let-niagara-2026.png nasekadan-web:/usr/share/nginx/html/social/
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do
              sudo docker cp "/tmp/nk-pool-final/$f" "nasekadan-web:/usr/share/nginx/html/$f"
            done
          fi
          sudo chmod -R a+rX /var/www/nasekadan
          grep -Fq 'Kadaňské koupaliště slaví 50 let' /var/www/nasekadan/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html
          grep -Fq '/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html' /var/www/nasekadan/index.html
          grep -Fq '/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html' /var/www/nasekadan/clanky/index.html
          grep -Fq 'koupaliste-kadan-pozemky-skluzavka-provoz-2026.html' /var/www/nasekadan/rss.xml
          rm -rf /tmp/nk-pool-final
          REMOTE

      - name: Veřejně ověřit web, feedy a obrázek
        id: web
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 30); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            image="$RUNNER_TEMP/pool-image-${attempt}.png"
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/social/koupaliste-kadan-50-let-niagara-2026.png?v=${stamp}-${attempt}" -o "$image" 2>/dev/null || true
            image_ok="$(python3 - "$image" <<'PY'
          import sys
          from pathlib import Path
          try:
              from PIL import Image
              p=Path(sys.argv[1])
              with Image.open(p) as im:
                  print('yes' if im.format=='PNG' and im.size==(1200,630) and p.stat().st_size>=10000 else 'no')
          except Exception:
              print('no')
          PY
            )"
            if grep -Fq 'Kadaňské koupaliště slaví 50 let' <<<"$article" \
              && grep -Fq 'kdy bude možné atrakci bezpečně používat i v horkých dnech' <<<"$article" \
              && grep -Fq 'https://nasekadan.cz/social/koupaliste-kadan-50-let-niagara-2026.png' <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$news" \
              && [[ "$image_ok" == yes ]]; then
              echo 'Veřejný web, přehledy, feedy i obrázek jsou ověřené.'
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Ověřit potvrzené zveřejnění na Facebooku
        id: facebook
        if: always()
        continue-on-error: true
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          FACEBOOK_WAIT_TIMEOUT: '300'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 scripts/process_facebook_queue_live.py "$ARTICLE"
          test -f "$MARKER"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.github/facebook-published/koupaliste-kadan-pozemky-skluzavka-provoz-2026-2a9cdac5e7.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data.get('facebook_post_id')
          assert data.get('facebook_page_name') == 'nasekadan'
          assert data.get('og_image') == 'https://nasekadan.cz/social/koupaliste-kadan-50-let-niagara-2026.png'
          assert data.get('article_url') == 'https://nasekadan.cz/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html'
          print(data['facebook_post_id'])
          PY

      - name: Zapsat konečný ověřitelný stav
        if: always()
        uses: actions/github-script@v7
        env:
          REPAIR: ${{ steps.repair.outcome }}
          WEB: ${{ steps.web.outcome }}
          FACEBOOK: ${{ steps.facebook.outcome }}
        with:
          script: |
            const success = process.env.REPAIR === 'success' && process.env.WEB === 'success' && process.env.FACEBOOK === 'success';
            const status = {
              status: success ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              run_id: context.runId,
              trigger_commit: context.sha,
              direct_repair: process.env.REPAIR,
              public_web_verification: process.env.WEB,
              facebook_verification: process.env.FACEBOOK,
              article_url: 'https://nasekadan.cz/clanky/koupaliste-kadan-pozemky-skluzavka-provoz-2026.html',
              social_image: 'https://nasekadan.cz/social/koupaliste-kadan-50-let-niagara-2026.png'
            };
            const path = '.github/pool-final-verification-20260731.json';
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              if (!Array.isArray(current.data)) sha=current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat finální kontrolu koupaliště: ${status.status}`,content,...(sha?{sha}:{})});
            const title='[KONTROLA KOUPALIŠTĚ] Web a Facebook';
            const body=[`## ${success?'ÚSPĚCH':'NEÚSPĚCH'}`,'',`- Přímá oprava: **${process.env.REPAIR}**`,`- Veřejná kontrola webu: **${process.env.WEB}**`,`- Facebook: **${process.env.FACEBOOK}**`,`- Běh: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join('\n');
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'all',per_page:100});
            const existing=issues.find(i=>!i.pull_request&&i.title===title);
            if(existing){await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body,state:success?'closed':'open'});}else{const created=await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});if(success)await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:created.data.number,state:'closed'});}

      - name: Vyžadovat úplný úspěch
        if: always()
        shell: bash
        run: |
          test '${{ steps.repair.outcome }}' = success
          test '${{ steps.web.outcome }}' = success
          test '${{ steps.facebook.outcome }}' = success
