name: Aktualizovat článek o koších po svozu

on:
  push:
    branches: [main]
    paths:
      - '.github/bins-followup-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-bins-followup-live
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SERVER: 57.129.43.215
      ARTICLE: clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit navazující vývoj
        run: |
          set -euo pipefail
          python3 scripts/update_bins_followup_20260730.py
          grep -Fq 'data-kose-update="20260730"' "$ARTICLE"
          grep -Fq 'Koš byl vyprázdněn, debata ale pokračuje' "$ARTICLE"

      - name: Uložit aktualizaci do main
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň aktualizace'
          git config user.email 'info@nasekadan.cz'
          git add -- "$ARTICLE"
          if ! git diff --cached --quiet; then
            git commit -m 'Aktualizovat: koše byly vyprázdněny, debata pokračuje'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Připravit SSH klíč
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit aktualizovaný článek
        id: deploy
        run: |
          set -euo pipefail
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$ARTICLE" "ubuntu@$SERVER:/tmp/pretekajici-kose-kadan-technicke-sluzby-ridici.html"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "ubuntu@$SERVER" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 /tmp/pretekajici-kose-kadan-technicke-sluzby-ridici.html /var/www/nasekadan/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/pretekajici-kose-kadan-technicke-sluzby-ridici.html nasekadan-web:/usr/share/nginx/html/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html
          fi
          rm -f /tmp/pretekajici-kose-kadan-technicke-sluzby-ridici.html
          REMOTE

      - name: Veřejně ověřit aktualizaci
        id: verify
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for attempt in $(seq 1 24); do
            page="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html?v=${stamp}-${attempt}" || true)"
            if grep -Fq 'data-kose-update="20260730"' <<<"$page" \
              && grep -Fq 'Koš byl vyprázdněn, debata ale pokračuje' <<<"$page" \
              && grep -Fq 'Aktualizováno 30. července 2026 v 18:34' <<<"$page"; then
              echo 'Aktualizovaný článek je veřejný.'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Zapsat stav
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path='.github/bins-followup-status.json';
            const ok=process.env.DEPLOY==='success'&&process.env.VERIFY==='success';
            const state={status:ok?'success':'failed',checked_at_utc:new Date().toISOString(),trigger_commit:context.sha,run_id:context.runId,server_deploy:process.env.DEPLOY||'skipped',public_verification:process.env.VERIFY||'skipped'};
            const content=Buffer.from(JSON.stringify(state,null,2)+'\n').toString('base64');
            let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat stav aktualizace článku o koších: ${state.status}`,content,...(sha?{sha}:{})});
