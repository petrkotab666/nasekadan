# Jednorázový opravný běh spuštěn 3. 8. 2026
name: Jednorázově opravit publikaci FVE EPR Letiště

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-fve-epr-publication-once-20260803.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-fve-epr-letiste-20260803
  cancel-in-progress: false

env:
  SLUG: fve-epr-letiste-bess-kadan-2026
  ARTICLE: clanky/fve-epr-letiste-bess-kadan-2026.html
  PUBLIC_URL: https://nasekadan.cz/clanky/fve-epr-letiste-bess-kadan-2026.html
  SOCIAL: social/fve-epr-letiste-baterie-kadan-20260803.png
  EXPECTED_H1: 'ČEZ chce u Kadaně postavit solární park s bateriemi. Jejich velikost, cena i platby městu zůstávají neznámé'
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sestavit a ověřit kanonický balíček
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow markdown
          python3 -m py_compile scripts/publish_fve_epr_20260803.py scripts/prepare_discovery.py scripts/enforce_article_visibility.py
          python3 scripts/publish_fve_epr_20260803.py
          python3 scripts/prepare_discovery.py
          python3 scripts/enforce_article_visibility.py
          test -s "$ARTICLE"
          test -s "$SOCIAL"
          grep -Fq "<h1>${EXPECTED_H1}</h1>" "$ARTICLE"
          grep -Fq 'Proč se projektu říká „Letiště“' "$ARTICLE"
          grep -Fq 'Solární park zatím není v provozu' "$ARTICLE"
          ! grep -Fq 'noindex' "$ARTICLE"
          for file in index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt; do
            grep -Fq "$PUBLIC_URL" "$file" || grep -Fq "/clanky/${SLUG}.html" "$file"
          done

      - name: Zapsat pouze schválený publikační balíček do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň opravný publikační automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- "$ARTICLE" "$SOCIAL" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publikovat: solární park EPR Letiště a baterie'
          fi
          git reset --hard HEAD
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            sleep $((attempt * 6))
          done
          $pushed || exit 1
          git fetch origin main
          git reset --hard origin/main
          test -s "$ARTICLE"
          echo "PUB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Připravit SSH klíč a kontrolní známku
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"
          cat > "$RUNNER_TEMP/deployment-health.txt" <<EOF
          status=ok
          source=${PUB_SHA}
          article=${PUBLIC_URL}
          published_at=2026-08-03T10:30:00+02:00
          workflow_run=${GITHUB_RUN_ID}
          EOF

      - name: Kanonicky nasadit balíček na OVH
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-fve-epr-repair"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$SOCIAL" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$bundle/"
          cp "$RUNNER_TEMP/deployment-health.txt" "$bundle/deployment-health.txt"
          uploaded=false
          for attempt in 1 2 3; do
            if scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-fve-epr-repair; then
              uploaded=true
              break
            fi
            sleep $((attempt * 8))
          done
          $uploaded || exit 1
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 /tmp/nk-fve-epr-repair/clanky/fve-epr-letiste-bess-kadan-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-fve-epr-repair/clanky/index.html /var/www/nasekadan/clanky/index.html
          find /tmp/nk-fve-epr-repair/social -maxdepth 1 -type f -exec sudo install -m 0644 {} /var/www/nasekadan/social/ \;
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt deployment-health.txt; do
            sudo install -m 0644 "/tmp/nk-fve-epr-repair/$f" "/var/www/nasekadan/$f"
          done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-fve-epr-repair/clanky/fve-epr-letiste-bess-kadan-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp /tmp/nk-fve-epr-repair/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            for f in /tmp/nk-fve-epr-repair/social/*; do sudo docker cp "$f" nasekadan-web:/usr/share/nginx/html/social/; done
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt deployment-health.txt; do
              sudo docker cp "/tmp/nk-fve-epr-repair/$f" "nasekadan-web:/usr/share/nginx/html/$f"
            done
          fi
          rm -rf /tmp/nk-fve-epr-repair
          REMOTE

      - name: Veřejně ověřit úplnou publikaci
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 30); do
            article="$(curl -4 -kfsS --max-time 25 "${PUBLIC_URL}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?v=${stamp}-${attempt}" 2>/dev/null || true)"
            if grep -Fq "<h1>${EXPECTED_H1}</h1>" <<<"$article" \
              && ! grep -Fq 'noindex' <<<"$article" \
              && grep -Fq "$PUBLIC_URL" <<<"$home" \
              && grep -Fq "$PUBLIC_URL" <<<"$archive" \
              && grep -Fq "$PUBLIC_URL" <<<"$rss" \
              && grep -Fq "$PUBLIC_URL" <<<"$sitemap" \
              && grep -Fq "$PUBLIC_URL" <<<"$news" \
              && grep -Fq "source=${PUB_SHA}" <<<"$health"; then
              curl -4 -kfIsS --max-time 20 "https://nasekadan.cz/${SOCIAL}?v=${stamp}-${attempt}" | grep -Eq '^HTTP/.* 200'
              echo 'Jednorázová oprava i veřejné ověření prošly.'
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Zapsat přesný incident při neúspěchu
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Selhala publikace článku FVE EPR Letiště'
          body="Jednorázový čistý opravný běh selhal.\n\nWorkflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nČlánek: ${PUBLIC_URL}\nCommit: ${GITHUB_SHA}"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi