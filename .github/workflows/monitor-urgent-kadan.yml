name: Rychlý monitoring Kadaně a okolí

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'data/urgent-kadan-sources.json'
      - 'scripts/monitor_urgent_kadan.py'
      - '.github/workflows/monitor-urgent-kadan.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: urgent-kadan-monitoring
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Načíst aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Zkontrolovat přímé bezpečnostní a regionální zdroje
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/monitor_national_kadan.py scripts/monitor_urgent_kadan.py
          python3 scripts/monitor_urgent_kadan.py \
            --config data/urgent-kadan-sources.json \
            --state data/urgent-kadan-monitoring-state.json \
            --status data/urgent-kadan-monitoring-status.json \
            --output "$RUNNER_TEMP/urgent-kadan-alerts.json" \
            | tee "$RUNNER_TEMP/urgent-kadan-scan.log"

      - name: Doručit nové nálezy jako okamžitá redakční upozornění
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export ALERT_FILE="$RUNNER_TEMP/urgent-kadan-alerts.json"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          payload = json.loads(Path(os.environ['ALERT_FILE']).read_text(encoding='utf-8'))
          alerts = payload.get('alerts') or []
          print(f'Nových rychlých upozornění: {len(alerts)}')
          for alert in alerts:
              title = str(alert.get('title') or 'Nová událost na Kadaňsku').strip()
              fingerprint = 'urgent-' + str(alert.get('fingerprint') or '').strip()
              source_name = str(alert.get('sourceName') or 'Zdroj').strip()
              source_url = str(alert.get('url') or '').strip()
              published = str(alert.get('published') or 'neuvedeno').strip()
              category = str(alert.get('category') or 'Rychlý monitoring').strip()
              severity = str(alert.get('severity') or 'high').strip()
              description = str(alert.get('description') or '').strip()
              local = ', '.join(str(x) for x in (alert.get('matchedLocalTerms') or []))
              incident = ', '.join(str(x) for x in (alert.get('matchedIncidentTerms') or []))

              issue_title = f'[RYCHLÝ MONITORING KADAŇ] {title[:112]} [{fingerprint}]'
              body = [
                  '## Nový nález z rychlého monitoringu',
                  '',
                  f'**Zdroj:** {source_name}',
                  f'**Oblast:** {category}',
                  f'**Publikováno:** {published}',
                  f'**Priorita:** {severity}',
                  f'**Místní vazba:** {local or "přímá místní shoda"}',
                  f'**Typ události:** {incident or "nová místní zpráva"}',
                  '',
                  f'### {title}',
              ]
              if description:
                  body += ['', description[:2200]]
              body += [
                  '',
                  '### Přímý odkaz',
                  f'- [{source_name}]({source_url})' if source_url else f'- {source_name}',
                  '',
                  '### Redakční postup',
                  'Ihned otevřít zdroj, ověřit datum a místo a rozhodnout, zda jde o rychlou zprávu, aktualizaci nebo pouze podklad. U zásahů ověřit HZS či Policii, jakmile je jejich informace dostupná.',
                  '',
                  '_Tento systém kontroluje přímé regionální zdroje každých 15 minut; Google News slouží pouze jako záloha._',
              ]
              with tempfile.NamedTemporaryFile('w', encoding='utf-8', delete=False, suffix='.md') as handle:
                  handle.write('\n'.join(body) + '\n')
                  body_path = handle.name
              try:
                  subprocess.run([
                      'python3', 'scripts/upsert_github_issue.py',
                      '--fingerprint', fingerprint,
                      '--title', issue_title,
                      '--body-file', body_path,
                      '--assignee', 'petrkotab666',
                  ], check=True)
              finally:
                  Path(body_path).unlink(missing_ok=True)
          PY

      - name: Vyhodnotit dostupnost přímých zdrojů
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          status = json.loads(Path('data/urgent-kadan-monitoring-status.json').read_text(encoding='utf-8'))
          total = int(status.get('sourceCount') or 0)
          failed = int(status.get('failedSources') or 0)
          checked = int(status.get('checkedSources') or 0)
          failures = [x for x in status.get('sourceStatus', []) if x.get('status') == 'failed']
          unhealthy = checked < max(4, total // 2) or failed >= max(4, total // 2)
          lines = [
              '## Zdravotní stav rychlého monitoringu Kadaně',
              '',
              f'- Dostupné zdroje: **{checked}/{total}**',
              f'- Nedostupné zdroje: **{failed}**',
              f'- Kontrola: `{status.get("checkedAt")}`',
              f'- Nová upozornění: **{int(status.get("newAlerts") or 0)}**',
          ]
          if failures:
              lines += ['', '### Nedostupné zdroje']
              lines += [f'- {x.get("name")}: `{x.get("error", "chyba")}`' for x in failures[:20]]
          lines += ['', '_Technické upozornění; nejde o redakční zprávu._']
          with tempfile.NamedTemporaryFile('w', encoding='utf-8', delete=False, suffix='.md') as handle:
              handle.write('\n'.join(lines) + '\n')
              body_path = handle.name
          try:
              command = [
                  'python3', 'scripts/upsert_github_issue.py',
                  '--fingerprint', 'urgent-kadan-source-health',
                  '--title', '[RYCHLÝ MONITORING KADAŇ] Výpadek přímých zdrojů [urgent-kadan-source-health]',
                  '--body-file', body_path,
                  '--assignee', 'petrkotab666',
              ]
              if not unhealthy:
                  command += ['--close', '--comment-existing']
              subprocess.run(command, check=True)
          finally:
              Path(body_path).unlink(missing_ok=True)
          PY

      - name: Uložit stav deduplikace a poslední kontroly
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/urgent-kadan-monitoring-state.json data/urgent-kadan-monitoring-status.json
          if git diff --cached --quiet; then
            echo 'Stav rychlého monitoringu se nezměnil.'
            exit 0
          fi
          git commit -m 'Aktualizovat stav rychlého monitoringu Kadaně [skip ci]'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo 'Stav rychlého monitoringu se nepodařilo uložit.' >&2
          exit 1

      - name: Souhrn rychlé kontroly
        if: always()
        shell: bash
        run: |
          if [ -f data/urgent-kadan-monitoring-status.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data=json.load(open('data/urgent-kadan-monitoring-status.json',encoding='utf-8'))
          print('## Rychlý monitoring Kadaně')
          print(f"- Dostupné zdroje: {data.get('checkedSources',0)}/{data.get('sourceCount',0)}")
          print(f"- Zpracované položky: {data.get('itemsParsed',0)}")
          print(f"- Relevantní položky: {data.get('relevantItems',0)}")
          print(f"- Nová upozornění: {data.get('newAlerts',0)}")
          PY
          fi
