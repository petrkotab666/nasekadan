name: Spustit obnovu KZK přes issue 507

on:
  issues:
    types: [reopened]

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    if: github.event.issue.number == 507
    runs-on: ubuntu-latest
    steps:
      - name: Spustit okamžitou obnovu KZK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run manual-recover-kzk-20260802.yml --repo "${{ github.repository }}" --ref main
