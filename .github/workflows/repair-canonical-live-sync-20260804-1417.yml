name: Opravit živou kanonickou evidenci 2026-08-04 14:17

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: repair-canonical-live-sync-20260804-1417
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'petrkotab666' && github.event.issue.title == '[repair] canonical live sync 20260804-1417'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      STADIUM_REL: /clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html
      STADIUM_H1: Kadaň otevřela zimní stadion lidem před vedrem. Přijít lze denně od 8 do 18 hodin
      JOSEF_REL: /clanky/josef-suchy-klasterec-u18-kanada-hlinka-2026.html
      JOSEF_H1: Klášterecký Josef Suchý skóroval Kanadě už po 103 sekundách
    steps:
      - name: Zapsat spuštění
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Oprava živé kanonické evidence byla spuštěna. Run ${context.runId}.`
            });

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aktualizovat audit registru
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonický audit'
          git config user.email 'info@nasekadan.cz'
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('data/published-content-index.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          validation = data.setdefault('validation', {})
          now = datetime.now(timezone.utc).isoformat()
          validation['deployment_health'] = 'verified_after_safe_live_sync'
          validation['repair_pending_public_verification'] = True
          validation['public_audit_at'] = now
          validation['last_consistency_repair'] = {
              'reason': 'Živá titulka a archiv zobrazovaly starý stav článku o ochlazení a chyběl nejnovější článek o Josefu Suchém, zatímco repozitář a registr už obsahovaly nový stav.',
              'classification': 'significant_live_repository_mismatch',
              'affected_urls': [
                  'https://nasekadan.cz/',
                  'https://nasekadan.cz/clanky/',
                  'https://nasekadan.cz/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html',
                  'https://nasekadan.cz/clanky/josef-suchy-klasterec-u18-kanada-hlinka-2026.html'
              ],
              'started_at': now,
              'method': 'deploy-current-canonical-main-and-publicly-verify'
          }
          data['generated_at'] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add data/published-content-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Evidence: zaznamenat opravu nesouladu živého webu'
            git push origin HEAD:main
          fi
          final_sha="$(git rev-parse HEAD)"
          echo "source_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "article_count=$(python3 -c 'import json; print(json.load(open("data/published-content-index.json"))["article_count"])')" >> "$GITHUB_OUTPUT"

      - name: Nasadit aktuální kanonický stav na OVH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/canonical-live-sync"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social" "$bundle/data"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt "$bundle/"
          cp clanky/index.html clanky/strana-*.html "$bundle/clanky/"
          cp clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html "$bundle/clanky/"
          cp clanky/josef-suchy-klasterec-u18-kanada-hlinka-2026.html "$bundle/clanky/"
          cp social/klasterec-ochlazeni-zimni-stadion-kadan-2026-kadan-open-20260804.png "$bundle/social/"
          cp social/josef-suchy-klasterec-u18-kanada-hlinka-2026.png "$bundle/social/"
          cp data/published-content-index.json "$bundle/data/"
          printf 'status=ok\nsource=%s\nrepair=canonical-live-sync-20260804-1417\narticle_count=%s\n' '${{ steps.prepare.outputs.source_sha }}' '${{ steps.prepare.outputs.article_count }}' > "$bundle/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/canonical-live-sync
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/canonical-live-sync
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/clanky" "$root/social" "$root/data"
          sudo install -m 0644 "$src/index.html" "$root/index.html"
          for f in "$src"/clanky/*.html; do sudo install -m 0644 "$f" "$root/clanky/$(basename "$f")"; done
          for f in "$src"/social/*; do sudo install -m 0644 "$f" "$root/social/$(basename "$f")"; done
          for f in rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo install -m 0644 "$src/$f" "$root/$f"; done
          sudo install -m 0644 "$src/data/published-content-index.json" "$root/data/published-content-index.json"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social /usr/share/nginx/html/data
            sudo docker cp "$src/index.html" nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp "$src/clanky/." nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$src/social/." nasekadan-web:/usr/share/nginx/html/social/
            for f in rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo docker cp "$src/$f" "nasekadan-web:/usr/share/nginx/html/$f"; done
            sudo docker cp "$src/data/published-content-index.json" nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
          fi
          rm -rf /tmp/canonical-live-sync
          REMOTE

      - name: Veřejně ověřit kanonické kanály
        shell: bash
        run: |
          set -euo pipefail
          sleep 7
          base=https://nasekadan.cz
          q="${GITHUB_RUN_ID}-$(date +%s)"
          home="$(curl -4 -kfsS -L --max-time 35 "$base/?v=$q")"
          archive="$(curl -4 -kfsS -L --max-time 35 "$base/clanky/?v=$q")"
          stadium="$(curl -4 -kfsS -L --max-time 35 "$base$STADIUM_REL?v=$q")"
          josef="$(curl -4 -kfsS -L --max-time 35 "$base$JOSEF_REL?v=$q")"
          rss="$(curl -4 -kfsS -L --max-time 35 "$base/rss.xml?v=$q")"
          sitemap="$(curl -4 -kfsS -L --max-time 35 "$base/sitemap.xml?v=$q")"
          news="$(curl -4 -kfsS -L --max-time 35 "$base/news-sitemap.xml?v=$q")"
          registry="$(curl -4 -kfsS -L --max-time 35 "$base/data/published-content-index.json?v=$q")"
          health="$(curl -4 -kfsS -L --max-time 35 "$base/deployment-health.txt?v=$q")"
          grep -Fq "$JOSEF_H1" <<<"$home"
          grep -Fq "$STADIUM_H1" <<<"$home"
          grep -Fq "$JOSEF_H1" <<<"$archive"
          grep -Fq "$STADIUM_H1" <<<"$archive"
          grep -Fq "<h1>$STADIUM_H1</h1>" <<<"$stadium"
          grep -Fq "<h1>$JOSEF_H1</h1>" <<<"$josef"
          grep -Fq "https://nasekadan.cz$STADIUM_REL" <<<"$rss"
          grep -Fq "https://nasekadan.cz$JOSEF_REL" <<<"$rss"
          grep -Fq "https://nasekadan.cz$STADIUM_REL" <<<"$sitemap"
          grep -Fq "https://nasekadan.cz$JOSEF_REL" <<<"$sitemap"
          grep -Fq "https://nasekadan.cz$STADIUM_REL" <<<"$news"
          grep -Fq "https://nasekadan.cz$JOSEF_REL" <<<"$news"
          grep -Fq '"article_count": ${{ steps.prepare.outputs.article_count }}' <<<"$registry"
          grep -Fq "$STADIUM_H1" <<<"$registry"
          grep -Fq "$JOSEF_H1" <<<"$registry"
          grep -Fq 'status=ok' <<<"$health"
          grep -Fq 'source=${{ steps.prepare.outputs.source_sha }}' <<<"$health"
          curl -4 -kfsS -L --max-time 35 "$base/api/pocasi-predpoved.json?v=$q" | python3 -m json.tool >/dev/null

      - name: Dokončit registr a uzavřít požadavek
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Významný nesoulad živého webu s kanonickým registrem byl bezpečně opraven a veřejně ověřen. Run ${context.runId}, commit ${{ steps.prepare.outputs.source_sha }}, článků v registru: ${{ steps.prepare.outputs.article_count }}.`
            });
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});

      - name: Zapsat selhání
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Oprava živé kanonické evidence selhala. Run ${context.runId}; požadavek zůstává otevřený.`
            });
