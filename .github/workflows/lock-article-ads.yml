name: Uzamknout reklamy v článcích

on:
  push:
    branches: [main]
    paths:
      - '.github/lock-article-ads-trigger.txt'
      - 'scripts/embed_static_article_ads.py'
      - 'assets/reklamy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-article-ads
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Vložit a nasadit uzamčené reklamy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          python3 scripts/embed_static_article_ads.py
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/assets/reklamy
          sudo cp -a clanky/. /var/www/nasekadan/clanky/
          sudo cp -a assets/reklamy/. /var/www/nasekadan/assets/reklamy/
          REMOTE

      - name: Ověřit živé grafické reklamy
        shell: bash
        run: |
          set -euo pipefail
          url='https://nasekadan.cz/clanky/arc-med-nemocnice-kadan.html'
          for attempt in $(seq 1 18); do
            html="$(curl -fsS --max-time 20 "${url}?ads-lock=${GITHUB_SHA}-${attempt}" || true)"
            ok=true
            grep -Fq 'data-static-article-ads="locked-v1"' <<<"$html" || ok=false
            [[ "$(grep -o 'class="static-article-ad"' <<<"$html" | wc -l)" -eq 4 ]] || ok=false
            grep -Fq 'width:300px!important;min-width:300px!important;max-width:300px!important' <<<"$html" || ok=false
            for banner in pojistime vaseuklizecka vyklidime realitykadan; do
              curl -fsS --max-time 20 "https://nasekadan.cz/assets/reklamy/${banner}-300x600.svg?ads-lock=${GITHUB_SHA}-${attempt}" | grep -Fq '<svg' || ok=false
            done
            for banner in vaseuklizecka-cisteni-wide-1200x400.webp vaseuklizecka-cisteni-tower-300x600.webp; do
              output="$RUNNER_TEMP/$banner"
              curl -fsS --max-time 20 "https://nasekadan.cz/assets/reklamy/${banner}?ads-lock=${GITHUB_SHA}-${attempt}" -o "$output" || ok=false
              [[ -s "$output" ]] || ok=false
              [[ "$(wc -c < "$output")" -gt 1000 ]] || ok=false
              [[ "$(head -c 4 "$output")" == 'RIFF' ]] || ok=false
            done
            if [[ "$ok" == true ]]; then
              echo 'Grafické reklamy včetně WebP bannerů jsou veřejně dostupné.'
              exit 0
            fi
            sleep 10
          done
          echo 'Kontrola uzamčených reklam selhala.' >&2
          exit 1
