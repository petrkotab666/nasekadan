name: Publikovat a chronologicky zařadit články

on:
  push:
    branches: [main]
    paths:
      - '.github/chronological-order-trigger.txt'
  pull_request:
    branches: [main]
    paths:
      - '.github/chronological-order-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit publikační skript
        shell: bash
        run: |
          set -euo pipefail
          test -s social/kadansti-plavacci-zapis-podzim-2026-15a89a2edb.png
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish_kadansti_plavacci_autumn_2026.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'kadansti-plavacci-zapis-podzim-2026.png',
              'kadansti-plavacci-zapis-podzim-2026-15a89a2edb.png',
          )
          old = "    text = text.replace('>', '>\\n' + NEWS_URL, 1) if '<urlset' in text else text\n"
          new = "    text = re.sub(r'(<urlset\\b[^>]*>)', lambda match: match.group(1) + '\\n' + NEWS_URL, text, count=1) if '<urlset' in text else text\n"
          if old not in text:
              raise SystemExit('V publikačním skriptu chybí očekávaná oprava news sitemap.')
          text = text.replace(old, new, 1)
          text = text.replace('    rewrite_latest_enforcer()\n', '', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Publikovat Kadaňské Plaváčky
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_kadansti_plavacci_autumn_2026.py
          python3 scripts/sort_articles_chronologically.py

      - name: Ověřit úplnost publikace
        shell: bash
        run: |
          set -euo pipefail
          article='clanky/kadansti-plavacci-zapis-podzim-2026.html'
          test -s "$article"
          test -s social/kadansti-plavacci-zapis-podzim-2026-15a89a2edb.png
          grep -q 'kadansti-plavacci-zapis-podzim-2026.html' index.html
          grep -q 'kadansti-plavacci-zapis-podzim-2026.html' clanky/index.html
          grep -q 'kadansti-plavacci-zapis-podzim-2026.html' rss.xml
          grep -q 'kadansti-plavacci-zapis-podzim-2026.html' sitemap.xml
          grep -q 'kadansti-plavacci-zapis-podzim-2026.html' news-sitemap.xml
          grep -q 'kadansti-plavacci-zapis-podzim-2026-15a89a2edb.png' "$article"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('rss.xml')
          ET.parse('sitemap.xml')
          ET.parse('news-sitemap.xml')
          print('XML výstupy jsou platné.')
          PY

      - name: Uložit zdrojovou publikaci
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Zařadit zápis Kadaňských Plaváčků na web' || true
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
          done
          exit 1

      - name: Nasadit na OVH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

      - name: Veřejně ověřit článek a zařazení
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          for attempt in $(seq 1 24); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/kadansti-plavacci-zapis-podzim-2026.html?v=$stamp-$attempt" || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=$stamp-$attempt" || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=$stamp-$attempt" || true)"
            image_code="$(curl -4 -ksS -o /dev/null -w '%{http_code}' --max-time 25 "https://nasekadan.cz/social/kadansti-plavacci-zapis-podzim-2026-15a89a2edb.png?v=$stamp-$attempt" || true)"
            if grep -q 'Kadaňští Plaváčci otevřeli zápis' <<<"$article" \
              && grep -q 'kadansti-plavacci-zapis-podzim-2026.html' <<<"$home" \
              && grep -q 'kadansti-plavacci-zapis-podzim-2026.html' <<<"$archive" \
              && [[ "$image_code" == '200' ]]; then
              echo 'Článek, titulní stránka, archiv i sociální obrázek jsou živé.'
              exit 0
            fi
            sleep 5
          done
          echo 'Veřejná kontrola publikace neprošla.' >&2
          exit 1
