name: Nouzově publikovat článek o stříkačkách

on:
  push:
    branches: [main]
    paths:
      - '.github/syringe-emergency-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-syringe-emergency
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SLUG: strikacky-vchody-drogy-kadan
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vytvořit a zařadit veřejný článek
        shell: bash
        run: |
          set -euo pipefail
          cp ".github/drafts/${SLUG}.html" "clanky/${SLUG}.html"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('clanky/strikacky-vchody-drogy-kadan.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('noindex,nofollow','index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1')
          t=t.replace('../../','../')
          t=t.replace('PŘIPRAVOVANÝ ČLÁNEK','30. ČERVENCE 2026')
          t=t.replace('<h3>Plánované vydání</h3><p><strong>30. července 2026 ve 4:00</strong></p>','<h3>Zveřejněno</h3><p><strong>30. července 2026 ve 4:00</strong></p>')
          p.write_text(t,encoding='utf-8',newline='\n')
          PY
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/enforce_article_visibility.py
          python3 scripts/sort_articles_chronologically.py
          python3 scripts/prepare_discovery.py

      - name: Uložit článek a přehledy do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň nouzové vydání'
          git config user.email 'info@nasekadan.cz'
          git add -A -- "clanky/${SLUG}.html" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt social style.css
          git commit -m 'Publikovat: stříkačky ve vchodech a drogové podněty v Kadani'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přímo na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/nk-syringe-emergency"
          mkdir -p "$RUNNER_TEMP/nk-syringe-emergency/clanky" "$RUNNER_TEMP/nk-syringe-emergency/social"
          cp "clanky/${SLUG}.html" "$RUNNER_TEMP/nk-syringe-emergency/clanky/"
          cp clanky/index.html "$RUNNER_TEMP/nk-syringe-emergency/clanky/index.html"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$RUNNER_TEMP/nk-syringe-emergency/"
          cp -a social/. "$RUNNER_TEMP/nk-syringe-emergency/social/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/nk-syringe-emergency" ubuntu@57.129.43.215:/tmp/nk-syringe-emergency
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 /tmp/nk-syringe-emergency/clanky/strikacky-vchody-drogy-kadan.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-syringe-emergency/clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 /tmp/nk-syringe-emergency/index.html /tmp/nk-syringe-emergency/rss.xml /tmp/nk-syringe-emergency/sitemap.xml /tmp/nk-syringe-emergency/news-sitemap.xml /tmp/nk-syringe-emergency/llms.txt /tmp/nk-syringe-emergency/robots.txt /var/www/nasekadan/
          sudo cp -a /tmp/nk-syringe-emergency/social/. /var/www/nasekadan/social/
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-syringe-emergency/clanky/strikacky-vchody-drogy-kadan.html nasekadan-web:/usr/share/nginx/html/clanky/strikacky-vchody-drogy-kadan.html
            sudo docker cp /tmp/nk-syringe-emergency/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker cp /tmp/nk-syringe-emergency/index.html nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp /tmp/nk-syringe-emergency/rss.xml nasekadan-web:/usr/share/nginx/html/rss.xml
            sudo docker cp /tmp/nk-syringe-emergency/sitemap.xml nasekadan-web:/usr/share/nginx/html/sitemap.xml
            sudo docker cp /tmp/nk-syringe-emergency/news-sitemap.xml nasekadan-web:/usr/share/nginx/html/news-sitemap.xml
            sudo docker cp /tmp/nk-syringe-emergency/llms.txt nasekadan-web:/usr/share/nginx/html/llms.txt
            sudo docker cp /tmp/nk-syringe-emergency/robots.txt nasekadan-web:/usr/share/nginx/html/robots.txt
            sudo docker cp /tmp/nk-syringe-emergency/social/. nasekadan-web:/usr/share/nginx/html/social/
          fi
          rm -rf /tmp/nk-syringe-emergency
          REMOTE

      - name: Veřejně ověřit všechny výstupy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 24); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            if grep -Fiq 'Stříkačky ve vchodech' <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$news"; then
              echo 'HOTOVO: článek, titulka, archiv, RSS, sitemap a news sitemap jsou veřejné.'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Zapsat stav nouzového nasazení
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path='syringe-emergency-status.json';
            const ok=process.env.DEPLOY==='success'&&process.env.VERIFY==='success';
            const status={status:ok?'success':'failed',checked_at_utc:new Date().toISOString(),trigger_commit:context.sha,run_id:context.runId,server_deploy:process.env.DEPLOY||'skipped',public_verification:process.env.VERIFY||'skipped'};
            const content=Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64');
            let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat nouzové nasazení článku o stříkačkách: ${status.status}`,content,...(sha?{sha}:{})});
