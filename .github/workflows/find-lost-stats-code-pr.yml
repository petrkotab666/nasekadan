name: Najít ztracenou verzi původních statistik

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ubuntu-recover-lastminuteslevy-trigger.txt'
      - '.github/workflows/find-lost-stats-code-pr.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Prohledat Git historii, reflog a bezpečné textové soubory
        id: find
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE' | tee "$RUNNER_TEMP/lost-stats.txt"
          set -euo pipefail
          cd /opt/nasekadan

          echo 'GIT_STATS_HISTORY_BEGIN'
          git log --all --date=iso-strict --pretty='format:%H | %ad | %s' -- \
            .github/scripts/nasekadan-stats \
            .github/workflows/deploy-stats-password-reset.yml \
            .github/workflows/recover-lastminuteslevy-runner-ubuntu.yml \
            2>/dev/null | head -300 || true
          echo 'GIT_STATS_HISTORY_END'

          echo 'REFLOG_BEGIN'
          git reflog --all --date=iso-strict --pretty='format:%H | %gd | %gs | %cd' 2>/dev/null | head -400 || true
          echo 'REFLOG_END'

          sudo python3 - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          roots = [Path('/opt'), Path('/usr/local/lib'), Path('/home/ubuntu'), Path('/tmp'), Path('/var/tmp'), Path('/etc/systemd/system')]
          patterns = [
              re.compile(r'\bNávštěvy\b', re.I),
              re.compile(r'\bNávštěvníci\b', re.I),
              re.compile(r'\bZobrazení\b', re.I),
              re.compile(r'SESSIONS?_30', re.I),
              re.compile(r'nasekadan\.access\.log', re.I),
          ]
          excluded_parts = {'node_modules', '.next', '__pycache__', '.cache'}
          excluded_suffixes = {'.log', '.gz', '.zip', '.png', '.jpg', '.jpeg', '.webp', '.ico', '.woff', '.woff2', '.ttf', '.pyc'}
          results = []
          seen = set()
          for root in roots:
              if not root.exists():
                  continue
              for base, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in excluded_parts]
                  for name in files:
                      path = Path(base) / name
                      try:
                          resolved = str(path.resolve())
                          if resolved in seen or path.suffix.lower() in excluded_suffixes:
                              continue
                          seen.add(resolved)
                          stat = path.stat()
                          if stat.st_size <= 0 or stat.st_size > 5_000_000:
                              continue
                          data = path.read_text(encoding='utf-8', errors='ignore')
                      except (OSError, UnicodeError):
                          continue
                      matches = []
                      for number, line in enumerate(data.splitlines(), 1):
                          if any(p.search(line) for p in patterns):
                              low = line.lower()
                              if any(s in low for s in ('password=', 'smtp_password', 'token=', 'secret=')):
                                  continue
                              matches.append(f'{number}: {line[:400]}')
                              if len(matches) >= 12:
                                  break
                      if matches:
                          results.append((stat.st_mtime, path, stat.st_size, matches))

          print('FILESYSTEM_MATCHES_BEGIN')
          for mtime, path, size, matches in sorted(results, reverse=True)[:150]:
              print(f'FILE {path} | {size} B | mtime={mtime:.0f}')
              for line in matches:
                  print(line)
          print('FILESYSTEM_MATCHES_END')
          PY

          echo 'GIT_OBJECT_MATCHES_BEGIN'
          # Hledat přes všechny dosažitelné commity přesné názvy původních karet.
          for rev in $(git rev-list --all 2>/dev/null); do
            matches="$(git grep -I -n -E 'Návštěvy|Návštěvníci|Zobrazení|sessions_30|nasekadan\.access\.log' "$rev" -- \
              '.github/**' 'deploy/**' '*.py' '*.sh' '*.yml' '*.yaml' 2>/dev/null | head -40 || true)"
            if [[ -n "$matches" ]]; then
              echo "REV $rev | $(git show -s --format='%cI | %s' "$rev")"
              printf '%s\n' "$matches"
            fi
          done | awk '!seen[$0]++' | head -1200
          echo 'GIT_OBJECT_MATCHES_END'

          echo 'UNREACHABLE_COMMITS_BEGIN'
          git fsck --full --no-reflogs --unreachable --no-progress 2>/dev/null \
            | awk '$2=="commit" {print $3}' | head -200 | while read -r rev; do
                [[ -n "$rev" ]] || continue
                matches="$(git grep -I -n -E 'Návštěvy|Návštěvníci|Zobrazení|sessions_30|nasekadan\.access\.log' "$rev" 2>/dev/null | head -40 || true)"
                if [[ -n "$matches" ]]; then
                  echo "UNREACHABLE $rev | $(git show -s --format='%cI | %s' "$rev" 2>/dev/null || true)"
                  printf '%s\n' "$matches"
                fi
              done | head -1000
          echo 'UNREACHABLE_COMMITS_END'
          REMOTE

      - name: Zapsat nález do PR
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.find.outcome }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/lost-stats.txt`, 'utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## Hledání ztracené verze statistik: ${process.env.OUTCOME}`,
                '',
                '- Výpis je omezen na cesty, Git metadata a řádky s názvy metrik; tajné hodnoty a návštěvní data jsou odfiltrovány.',
                '',
                '```text', log.slice(-60000).replace(/```/g, '---'), '```'
              ].join('\n')
            });

      - name: Vyhodnotit
        if: always()
        env:
          OUTCOME: ${{ steps.find.outcome }}
        run: test "$OUTCOME" = success
