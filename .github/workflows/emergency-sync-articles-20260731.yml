name: Nouzově opravit synchronizaci článků

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-sync-articles-20260731.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-emergency-article-sync
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    if: github.repository == 'petrkotab666/nasekadan'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERVER: 57.129.43.215
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      MVE_SLUG: mve-hradiste-nova-vodni-elektrarna-2026.html
      MVE_H1: U Hradiště má vzniknout nová malá vodní elektrárna. Vodu přivede potrubí dlouhé 520 metrů
      FIRE_SLUG: nebezpeci-pozaru-ustecky-kraj-kadan-2026.html
      FIRE_H1: Ústecký kraj znovu omezil rozdělávání ohňů. Opatření platí i pro Kadaň do konce srpna
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit SSH
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit aktuální main jedním kanonickým postupem
        id: deploy
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            "ubuntu@$SERVER" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo chown -R ubuntu:ubuntu /opt/nasekadan
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          sudo env GITHUB_WORKSPACE=/opt/nasekadan NASEKADAN_SKIP_AUTOMATION_INSTALL=1 bash deploy/sync-production.sh
          REMOTE

      - name: Zjistit nasazený commit
        id: source
        run: |
          set -euo pipefail
          source_sha="$(ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "ubuntu@$SERVER" 'cd /opt/nasekadan && git rev-parse HEAD')"
          test -n "$source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Veřejně ověřit úplnou synchronizaci
        id: verify
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          for attempt in $(seq 1 40); do
            q="repair=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?$q" || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?$q" || true)"
            mve="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/$MVE_SLUG?$q" || true)"
            fire="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/$FIRE_SLUG?$q" || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?$q" || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?$q" || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?$q" || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?$q" || true)"
            if grep -Fq "<h1>$MVE_H1</h1>" <<<"$mve" \
              && grep -Fq "<h1>$FIRE_H1</h1>" <<<"$fire" \
              && grep -Fq "/clanky/$MVE_SLUG" <<<"$home" \
              && grep -Fq "/clanky/$MVE_SLUG" <<<"$archive" \
              && grep -Fq "/clanky/$FIRE_SLUG" <<<"$archive" \
              && grep -Fq "$MVE_SLUG" <<<"$rss" \
              && grep -Fq "$FIRE_SLUG" <<<"$rss" \
              && grep -Fq "$MVE_SLUG" <<<"$sitemap" \
              && grep -Fq "$FIRE_SLUG" <<<"$sitemap" \
              && grep -Fq "$MVE_SLUG" <<<"$news" \
              && grep -Fq "$FIRE_SLUG" <<<"$news" \
              && grep -Fq "source=$SOURCE_SHA" <<<"$health"; then
              printf '%s\n' "$health" > /tmp/nasekadan-emergency-health.txt
              exit 0
            fi
            sleep 8
          done
          echo 'Veřejný web se nepřepnul na kompletní aktuální obsah.' >&2
          exit 1

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const ok = process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success';
            let health = '';
            try { health = fs.readFileSync('/tmp/nasekadan-emergency-health.txt', 'utf8'); } catch {}
            const state = {
              ok,
              checked_at_utc: new Date().toISOString(),
              run_id: context.runId,
              run_attempt: context.runAttempt,
              workflow_commit: context.sha,
              deployed_source: process.env.SOURCE_SHA || null,
              deploy: process.env.DEPLOY_OUTCOME || 'unknown',
              verify: process.env.VERIFY_OUTCOME || 'unknown',
              health
            };
            const path = '.github/emergency-article-sync-result.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat nouzovou synchronizaci článků: ${ok ? 'success' : 'failed'} [skip ci]`,
              content: Buffer.from(JSON.stringify(state, null, 2) + '\n').toString('base64'),
              ...(sha ? {sha} : {})
            });

      - name: Odstranit nouzový workflow po úspěchu
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/emergency-sync-articles-20260731.yml';
            const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              sha: current.data.sha,
              message: 'Odstranit úspěšný nouzový publikační workflow [skip ci]'
            });
