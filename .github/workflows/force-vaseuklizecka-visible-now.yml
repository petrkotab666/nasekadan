name: Vynutit viditelnou reklamu Vaše uklízečka
run-name: Opravit rotaci, cache a okamžitě nasadit bannery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-vaseuklizecka-visible-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-vaseuklizecka-visible-now
  cancel-in-progress: false

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      CACHE_VERSION: '20260728-vaseuklizecka-guaranteed-3'
      TARGET_URL: 'https://www.vaseuklizecka.cz/sluzby/cisteni-kobercu-a-calouneni/'
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vynutit zobrazení a změnit cache verzi
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('reklamy.js')
          text = js_path.read_text(encoding='utf-8')

          old_items = "    const items=pickPromos(context,count,index*5);"
          new_items = """    let items=pickPromos(context,count,index*5);
              const featured=promoItems.find(item=>item.id==='uklizecka-cisteni');
              if(featured&&(index===0||context==='sidebar')){
                items=[featured,...items.filter(item=>item.id!==featured.id)].slice(0,Math.max(1,count));
              }"""
          if old_items in text:
              text = text.replace(old_items, new_items, 1)
          elif "const featured=promoItems.find(item=>item.id==='uklizecka-cisteni')" not in text:
              raise SystemExit('Nenalezena kotva renderPromos.')

          old_tower = "  const tower=pickTowerCreative(context,0);"
          new_tower = """  const featuredTower=towerCreativeItems.find(item=>item.id==='uklizecka-cisteni-tower');
            const tower=featuredTower||pickTowerCreative(context,0);"""
          if old_tower in text:
              text = text.replace(old_tower, new_tower, 1)
          elif "const featuredTower=towerCreativeItems.find(item=>item.id==='uklizecka-cisteni-tower')" not in text:
              raise SystemExit('Nenalezena kotva renderArticleSideRails.')

          marker = "document.addEventListener('DOMContentLoaded',async()=>{"
          if 'function installGuaranteedCleaningBanner()' not in text:
              if marker not in text:
                  raise SystemExit('Nenalezena kotva DOMContentLoaded.')
              function = r'''
          function installGuaranteedCleaningBanner(){
            if(document.querySelector('.featured-cleaning-ad'))return;
            const item=promoItems.find(entry=>entry.id==='uklizecka-cisteni');
            if(!item)return;
            const section=document.createElement('section');
            section.className='featured-cleaning-ad';
            section.setAttribute('aria-label','Reklama: Čištění koberců, sedaček a čalounění');
            section.innerHTML=`<div class="promo-label">REKLAMA</div><a href="${escapeHtml(safeHttpUrl(item.url))}" target="_blank" rel="nofollow sponsored noopener noreferrer"><img src="/assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp" width="1200" height="400" alt="Čištění koberců, sedaček a čalounění – Vaše uklízečka, telefon 603 206 308" decoding="async"></a>`;
            const article=document.querySelector('article.article');
            if(article){
              const anchor=article.querySelector('.hero-visual')||article.querySelector('.leadtext')||article.querySelector('h1');
              if(anchor){anchor.after(section);return;}
            }
            const homeHero=document.querySelector('main .hero');
            if(homeHero){homeHero.after(section);return;}
            const main=document.querySelector('main');
            if(main)main.prepend(section);
          }

          '''
              text = text.replace(marker, function + marker, 1)

          call_anchor = "  ensurePromoStyles();"
          if "  installGuaranteedCleaningBanner();" not in text:
              if call_anchor not in text:
                  raise SystemExit('Nenalezena kotva ensurePromoStyles.')
              text = text.replace(call_anchor, call_anchor + "\n  installGuaranteedCleaningBanner();", 1)

          style_anchor = "    .article-ad-auto{margin:52px 0}"
          style_extra = r'''
              .featured-cleaning-ad{display:block;margin:28px auto 48px;max-width:1180px;padding:0 20px}
              article.article>.featured-cleaning-ad{margin:34px 0 46px;padding:0;max-width:none}
              .featured-cleaning-ad>.promo-label{margin-bottom:8px;color:#747f85;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
              .featured-cleaning-ad>a{display:block;overflow:hidden;border:1px solid #d8e0e4;border-radius:16px;background:#fff;box-shadow:0 12px 32px rgba(18,35,45,.12)}
              .featured-cleaning-ad img{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:contain;background:#fff}
          '''
          if '.featured-cleaning-ad{display:block' not in text:
              if style_anchor not in text:
                  raise SystemExit('Nenalezena kotva stylů reklam.')
              text = text.replace(style_anchor, style_anchor + style_extra, 1)

          js_path.write_text(text, encoding='utf-8')

          version = '20260728-vaseuklizecka-guaranteed-3'
          patterns = [
              re.compile(r'(?P<path>(?:\.\./)+reklamy\.js|/reklamy\.js|reklamy\.js)(?:\?v=[^\"\'\s>]*)?'),
          ]
          changed = 0
          for root in (Path('.'),):
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.html','.py','.js'}:
                      continue
                  if path == js_path or '.git' in path.parts:
                      continue
                  try:
                      value = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  updated = value
                  for pattern in patterns:
                      updated = pattern.sub(lambda m: m.group('path') + '?v=' + version, updated)
                  if updated != value:
                      path.write_text(updated, encoding='utf-8')
                      changed += 1
          print(f'Cache verze změněna v {changed} souborech.')

          required = [
              "id:'uklizecka-cisteni'",
              "id:'uklizecka-cisteni-tower'",
              'function installGuaranteedCleaningBanner()',
              "const featured=promoItems.find(item=>item.id==='uklizecka-cisteni')",
              "const featuredTower=towerCreativeItems.find(item=>item.id==='uklizecka-cisteni-tower')",
              '/assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp',
              '/assets/reklamy/vaseuklizecka-cisteni-tower-300x600.webp',
          ]
          final = js_path.read_text(encoding='utf-8')
          missing = [item for item in required if item not in final]
          if missing:
              raise SystemExit('Chybí prvky: ' + ', '.join(missing))
          PY

          test -s assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp
          test -s assets/reklamy/vaseuklizecka-cisteni-tower-300x600.webp

          printf '%s\n' "$(date -u +%FT%TZ) — Vynutit viditelné bannery Vaše uklízečka, změnit cache reklamy.js a kanonicky nasadit." > emergency-deploy-trigger.txt
          rm -f .github/workflows/force-vaseuklizecka-visible-now.yml

      - name: Uložit opravu do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Vynutit viditelné reklamy Vaše uklízečka a obnovit cache'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            echo "Střet s novější změnou; workflow bude bezpečně zopakováno novým pushem." >&2
            exit 1
          done

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Přímo kanonicky nasadit na OVH
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

      - name: Veřejně ověřit skutečné zobrazení podkladů
        shell: bash
        run: |
          set -euo pipefail
          cb="$(date +%s)"
          for attempt in $(seq 1 12); do
            js="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://nasekadan.cz/reklamy.js?cb=$cb-$attempt" || true)"
            article="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://nasekadan.cz/clanky/nemocnice-kadan-software-kyberbezpecnost.html?cb=$cb-$attempt" || true)"
            wide_code="$(curl -sS -o /tmp/wide.webp -w '%{http_code}' --max-time 25 "https://nasekadan.cz/assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp?cb=$cb-$attempt" || true)"
            tower_code="$(curl -sS -o /tmp/tower.webp -w '%{http_code}' --max-time 25 "https://nasekadan.cz/assets/reklamy/vaseuklizecka-cisteni-tower-300x600.webp?cb=$cb-$attempt" || true)"
            if grep -Fq 'installGuaranteedCleaningBanner' <<<"$js" \
              && grep -Fq "const featured=promoItems.find(item=>item.id==='uklizecka-cisteni')" <<<"$js" \
              && grep -Fq '20260728-vaseuklizecka-guaranteed-3' <<<"$article" \
              && [ "$wide_code" = 200 ] && [ -s /tmp/wide.webp ] \
              && [ "$tower_code" = 200 ] && [ -s /tmp/tower.webp ]; then
              echo 'Veřejný web podává vynucenou reklamu, novou cache verzi a oba bannery.'
              exit 0
            fi
            sleep 10
          done
          echo 'Veřejná kontrola neprošla.' >&2
          exit 42
