name: Publikovat článek o stříkačkách v Kadani

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publikovat ihned
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-syringe-article-2026-07-31
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit článek
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          target='2026-07-31T03:00:00Z'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          force='${{ inputs.force || false }}'
          if [[ -f clanky/strikacky-vchody-drogy-kadan.html ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$force" != 'true' && "$now" < "$target" ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          cp .github/drafts/strikacky-vchody-drogy-kadan.html clanky/strikacky-vchody-drogy-kadan.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('clanky/strikacky-vchody-drogy-kadan.html')
          t=p.read_text(encoding='utf-8').replace('noindex,nofollow','index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1').replace('../../','../').replace('PŘIPRAVOVANÝ ČLÁNEK','31. ČERVENCE 2026')
          published='2026-07-31T05:00:00+02:00'
          t=t.replace('</head>',f'<meta property="article:published_time" content="{published}"><meta property="article:modified_time" content="{published}">\n</head>',1)
          p.write_text(t,encoding='utf-8',newline='\n')
          PY
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/sort_articles_chronologically.py
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Uložit veřejnou verzi
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- clanky/strikacky-vchody-drogy-kadan.html index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt social style.css
          git commit -m 'Publikovat: stříkačky a drogové podněty v Kadani'
          git pull --rebase origin main
          git push origin main
