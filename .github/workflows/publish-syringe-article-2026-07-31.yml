name: Publikovat článek o stříkačkách v Kadani

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publikovat ihned
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-syringe-article-2026-07-30
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      SLUG: strikacky-vchody-drogy-kadan
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit článek
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          target='2026-07-30T02:00:00Z'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          force='${{ inputs.force || false }}'
          if [[ -f "clanky/${SLUG}.html" ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$force" != 'true' && "$now" < "$target" ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          cp ".github/drafts/${SLUG}.html" "clanky/${SLUG}.html"
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('clanky/strikacky-vchody-drogy-kadan.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace('noindex,nofollow', 'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1')
          t = t.replace('../../', '../')
          t = t.replace('PŘIPRAVOVANÝ ČLÁNEK', '30. ČERVENCE 2026')
          published = '2026-07-30T04:00:00+02:00'
          if 'article:published_time' not in t:
              t = t.replace('</head>', f'<meta property="article:published_time" content="{published}"><meta property="article:modified_time" content="{published}">\n</head>', 1)
          t = re.sub(r'("datePublished"\s*:\s*")([^"]*)', r'\g<1>' + published, t)
          t = re.sub(r'("dateModified"\s*:\s*")([^"]*)', r'\g<1>' + published, t)
          p.write_text(t, encoding='utf-8', newline='\n')
          PY
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/sort_articles_chronologically.py
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" news-sitemap.xml
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Uložit veřejnou verzi
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- "clanky/${SLUG}.html" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt social style.css
          git commit -m 'Publikovat: stříkačky a drogové podněty v Kadani'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Připravit SSH klíč
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit článek a přehledy přímo na OVH
        id: deploy
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/nk-syringe"
          mkdir -p "$RUNNER_TEMP/nk-syringe/clanky" "$RUNNER_TEMP/nk-syringe/social"
          cp "clanky/${SLUG}.html" "$RUNNER_TEMP/nk-syringe/clanky/"
          cp clanky/index.html "$RUNNER_TEMP/nk-syringe/clanky/index.html"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$RUNNER_TEMP/nk-syringe/"
          cp -a social/. "$RUNNER_TEMP/nk-syringe/social/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/nk-syringe" ubuntu@57.129.43.215:/tmp/nk-syringe-publication
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 /tmp/nk-syringe-publication/clanky/strikacky-vchody-drogy-kadan.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-syringe-publication/clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 /tmp/nk-syringe-publication/index.html /tmp/nk-syringe-publication/rss.xml /tmp/nk-syringe-publication/sitemap.xml /tmp/nk-syringe-publication/news-sitemap.xml /tmp/nk-syringe-publication/llms.txt /tmp/nk-syringe-publication/robots.txt /var/www/nasekadan/
          sudo cp -a /tmp/nk-syringe-publication/social/. /var/www/nasekadan/social/
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-syringe-publication/clanky/strikacky-vchody-drogy-kadan.html nasekadan-web:/usr/share/nginx/html/clanky/strikacky-vchody-drogy-kadan.html
            sudo docker cp /tmp/nk-syringe-publication/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker cp /tmp/nk-syringe-publication/index.html nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp /tmp/nk-syringe-publication/rss.xml nasekadan-web:/usr/share/nginx/html/rss.xml
            sudo docker cp /tmp/nk-syringe-publication/sitemap.xml nasekadan-web:/usr/share/nginx/html/sitemap.xml
            sudo docker cp /tmp/nk-syringe-publication/news-sitemap.xml nasekadan-web:/usr/share/nginx/html/news-sitemap.xml
            sudo docker cp /tmp/nk-syringe-publication/llms.txt nasekadan-web:/usr/share/nginx/html/llms.txt
            sudo docker cp /tmp/nk-syringe-publication/robots.txt nasekadan-web:/usr/share/nginx/html/robots.txt
            sudo docker cp /tmp/nk-syringe-publication/social/. nasekadan-web:/usr/share/nginx/html/social/
          fi
          rm -rf /tmp/nk-syringe-publication
          grep -Fq 'stříkač' /var/www/nasekadan/clanky/strikacky-vchody-drogy-kadan.html
          grep -Fq '/clanky/strikacky-vchody-drogy-kadan.html' /var/www/nasekadan/index.html
          REMOTE

      - name: Veřejně ověřit nasazení
        id: verify
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for attempt in $(seq 1 24); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            if grep -Fiq 'stříkač' <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$news"; then
              echo 'HOTOVO: ranní článek je veřejně nasazený na článku, titulce, v archivu, RSS a obou sitemapách.'
              exit 0
            fi
            sleep 6
          done
          exit 1
