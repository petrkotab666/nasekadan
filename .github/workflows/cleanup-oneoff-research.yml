name: Uklidit jednorázové rešeršní workflow
on:
  push:
    branches: [main]
    paths: ['.github/cleanup-oneoff-research-trigger.txt']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          set -euo pipefail
          rm -f \
            .github/workflows/research-desu-294869.yml \
            .github/workflows/research-desu-294869-v2.yml \
            .github/workflows/research-desu-294869-cloud.yml \
            .github/workflows/research-desu-now.yml \
            .github/desu-now-trigger.txt \
            .github/workflows/research-fve-planning-contracts-now.yml \
            .github/fve-planning-trigger.txt \
            .github/workflows/cleanup-oneoff-research.yml \
            .github/cleanup-oneoff-research-trigger.txt
          git config user.name nasekadan-research-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Uklidit jednorázové rešeršní workflow'
          git pull --rebase origin main
          git push origin HEAD:main
