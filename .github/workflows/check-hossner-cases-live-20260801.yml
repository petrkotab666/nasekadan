name: Přímá kontrola spisů Hossner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-hossner-cases-live-20260801.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Dotázat veřejná API soudů
        run: |
          set -euo pipefail
          mkdir -p .github/research/hossner-live-20260801
          python - <<'PY'
          import json, datetime, pathlib, requests
          out=pathlib.Path('.github/research/hossner-live-20260801')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Naše Kadaň veřejná rešerše)','Accept':'application/json'})
          cases=[
            ('30-C-84-2025','https://infosoud.gov.cz/api/v1/rizeni/vyhledej',{'cislo':30,'druh':'C','rocnik':2025,'bcVec':84,'organizace':'OSSCECV','typOrganizace':'os'}),
            ('30-C-211-2025','https://infosoud.gov.cz/api/v1/rizeni/vyhledej',{'cislo':30,'druh':'C','rocnik':2025,'bcVec':211,'organizace':'OSSCECV','typOrganizace':'os'}),
            ('14-Co-104-2026','https://infosoud.gov.cz/api/v1/rizeni/vyhledej',{'cislo':14,'druh':'CO','rocnik':2026,'bcVec':104,'organizace':'KSSCEUL','typOrganizace':'ks'}),
            ('93-Ncp-490-2026','https://infosoud.gov.cz/api/v1/rizeni/vyhledej',{'cislo':93,'druh':'NCP','rocnik':2026,'bcVec':490,'organizace':'VSPHAAB','typOrganizace':'ks'}),
          ]
          hearings=[
            ('30-C-84-2025',{'nadrizenaOrganizace':'Krajský soud Ústí nad Labem','organizace':'Okresní soud Chomutov','jednaciSin':None,'datum':None,'typ':'SPZN','cislo':30,'bcVec':84,'druh':'C','rocnik':2025}),
            ('30-C-211-2025',{'nadrizenaOrganizace':'Krajský soud Ústí nad Labem','organizace':'Okresní soud Chomutov','jednaciSin':None,'datum':None,'typ':'SPZN','cislo':30,'bcVec':211,'druh':'C','rocnik':2025}),
            ('14-Co-104-2026',{'nadrizenaOrganizace':None,'organizace':'Krajský soud Ústí nad Labem','jednaciSin':None,'datum':None,'typ':'SPZN','cislo':14,'bcVec':104,'druh':'CO','rocnik':2026}),
            ('93-Ncp-490-2026',{'nadrizenaOrganizace':None,'organizace':'Vrchní soud Praha','jednaciSin':None,'datum':None,'typ':'SPZN','cislo':93,'bcVec':490,'druh':'NCP','rocnik':2026}),
          ]
          summary={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'cases':{},'hearings':{}}
          for name,url,payload in cases:
            r=s.post(url,json=payload,timeout=30)
            summary['cases'][name]={'status':r.status_code,'request':payload,'response':r.json() if r.ok else r.text}
          for name,payload in hearings:
            url='https://infojednani.gov.cz/api/v1/jednani/vyhledej'
            r=s.post(url,json=payload,timeout=30)
            summary['hearings'][name]={'status':r.status_code,'request':payload,'response':r.json() if r.ok else r.text}
          (out/'result.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Uložit výsledek
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň rešerše'
          git config user.email 'info@nasekadan.cz'
          git add .github/research/hossner-live-20260801/result.json
          git commit -m 'Uložit přímou kontrolu soudních spisů Hossner'
          for n in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
