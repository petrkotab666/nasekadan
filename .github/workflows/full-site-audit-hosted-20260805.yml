name: Nezávislý úplný audit celého webu

"on":
  push:
    branches: [main]
    paths:
      - 'ops/trigger-full-site-audit-hosted-20260805.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: full-site-audit-hosted-20260805
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Připravit auditní skript
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/repair_full_site_audit_source_20260805.py
          python3 -m py_compile scripts/full_site_audit_20260805.py

      - name: Statický audit repozitáře
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/full_site_audit_20260805.py --static --static-report /tmp/full-site-static.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Živý audit produkčního webu
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/full_site_audit_20260805.py --live --live-report /tmp/full-site-live.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Zapsat úplný výsledek auditu
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const {owner,repo}=context.repo;
            function read(path){
              try{return JSON.parse(fs.readFileSync(path,'utf8'));}
              catch(error){return {status:'missing',errors:[{type:'report_missing',error:String(error)}],warnings:[]};}
            }
            function compact(report){
              return {
                status:report.status,
                article_count:report.article_count,
                html_files_checked:report.html_files_checked,
                local_references_checked:report.local_references_checked,
                sitemap_urls_checked:report.sitemap_urls_checked,
                html_pages_checked:report.html_pages_checked,
                internal_references_checked:report.internal_references_checked,
                article_images_checked:report.article_images_checked,
                card_images_checked:report.card_images_checked,
                cards_checked:report.cards_checked,
                archive_pages_checked:report.archive_pages_checked,
                rss_items:report.rss_items,
                news_urls:report.news_urls,
                errors:(report.errors||[]).slice(0,100),
                warnings:(report.warnings||[]).slice(0,100),
                repairs:(report.repairs||[]).slice(0,50),
              };
            }
            const staticReport=read('/tmp/full-site-static.json');
            const liveReport=read('/tmp/full-site-live.json');
            const ok=staticReport.status==='passed' && liveReport.status==='passed';
            const title=ok?'[audit] Celý web Naše Kadaň – úplná kontrola success':'[audit] Celý web Naše Kadaň – nalezené závady';
            const body=[
              ok?'Nezávislý úplný statický i veřejný audit prošel bez blokujících chyb.':'Nezávislý úplný audit našel chyby, které je nutné vyhodnotit nebo opravit.',
              '',`Run: ${process.env.RUN_URL}`,'',
              '## Statický audit','```json',JSON.stringify(compact(staticReport),null,2),'```','',
              '## Živý audit','```json',JSON.stringify(compact(liveReport),null,2),'```'
            ].join('\n');
            const existing=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            for(const issue of existing.filter(x=>x.title==='[audit] Celý web Naše Kadaň – nalezené závady')){
              if(ok){
                await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:'Následná úplná kontrola již prošla.\n\n'+process.env.RUN_URL});
                await github.rest.issues.update({owner,repo,issue_number:issue.number,state:'closed',state_reason:'completed'});
              }
            }
            const created=await github.rest.issues.create({owner,repo,title,body,assignees:['petrkotab666']});
            if(ok) await github.rest.issues.update({owner,repo,issue_number:created.data.number,state:'closed',state_reason:'completed'});

      - name: Vyhodnotit blokující chyby
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          failed=[]
          for name,path in [('static',Path('/tmp/full-site-static.json')),('live',Path('/tmp/full-site-live.json'))]:
              if not path.exists():
                  failed.append(name+': report chybí')
                  continue
              report=json.loads(path.read_text(encoding='utf-8'))
              if report.get('status')!='passed':
                  failed.append(name+': '+str(len(report.get('errors',[])))+' chyb')
          if failed:
              raise SystemExit('; '.join(failed))
          print('Úplný statický i živý audit prošel.')
          PY
