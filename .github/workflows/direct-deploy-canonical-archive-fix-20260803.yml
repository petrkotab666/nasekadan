name: Okamžitě nasadit opravu kanonického archivu

on:
  push:
    branches: [main]
    paths:
      - '.github/direct-canonical-archive-trigger.txt'

permissions:
  contents: write

concurrency:
  group: direct-canonical-archive-fix-20260803
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      DONOR_REL: /clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
      FVE_REL: /clanky/fve-epr-letiste-bess-kadan-2026.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Připravit aktuální zdroj a SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          grep -Fq "data-auto-article=\"zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026\"" clanky/index.html
          grep -Fq '2026-08-03T12:49:19+02:00' clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html

      - name: Nasadit pouze opravené kanonické soubory
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/canonical-archive-fix.tar.gz"
          tar -czf "$bundle" \
            clanky/index.html \
            clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html \
            data/published-content-index.json
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$bundle" ubuntu@57.129.43.215:/tmp/canonical-archive-fix.tar.gz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo tar -xzf /tmp/canonical-archive-fix.tar.gz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan/clanky /var/www/nasekadan/data
          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          if [[ -z "$cid" ]]; then cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"; fi
          if [[ -n "$cid" ]]; then
            sudo docker cp /var/www/nasekadan/clanky/index.html "$cid":/usr/share/nginx/html/clanky/index.html
            sudo docker cp /var/www/nasekadan/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html "$cid":/usr/share/nginx/html/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
            sudo docker cp /var/www/nasekadan/data/published-content-index.json "$cid":/usr/share/nginx/html/data/published-content-index.json
          fi
          rm -f /tmp/canonical-archive-fix.tar.gz
          REMOTE

      - name: Veřejně ověřit opravu bez cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, time, urllib.request, xml.etree.ElementTree as ET
          BASE='https://nasekadan.cz'
          DONOR='/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html'
          FVE='/clanky/fve-epr-letiste-bess-kadan-2026.html'
          def get(path):
              req=urllib.request.Request(BASE+path+('?v='+str(time.time_ns())),headers={'User-Agent':'NaseKadanDirectCanonicalVerify/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as r: return r.read().decode('utf-8','replace')
          archive=get('/clanky/')
          start=archive.index('<section class="archive-list" aria-label="Chronologický přehled článků">')
          end=archive.index('</section>',start)
          visible=archive[start:end]
          assert visible.count(f'href="{DONOR}"') == 1
          assert f'href="{FVE}"' in visible
          assert len(set(re.findall(r'href=["\'](/clanky/[^/"\']+\.html)["\']',visible,re.I))) == 42
          donor=get(DONOR)
          assert '<h1>Zaregistrovala se v Kadani. O rok později darovala krvetvorné buňky konkrétnímu pacientovi</h1>' in donor
          assert '2026-08-03T12:49:19+02:00' in donor
          rss=ET.fromstring(get('/rss.xml'))
          rss_links={e.text.strip() for e in rss.findall('.//item/link') if e.text}
          assert len(rss_links)==42 and BASE+DONOR in rss_links
          sitemap=get('/sitemap.xml')
          news=get('/news-sitemap.xml')
          assert BASE+DONOR in sitemap and BASE+DONOR in news
          health=get('/deployment-health.txt')
          assert re.search(r'(?m)^source=[0-9a-f]{40}$',health)
          PY

      - name: Uklidit jednorázové soubory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git rm -f .github/direct-canonical-archive-trigger.txt
          git rm -f .github/workflows/direct-deploy-canonical-archive-fix-20260803.yml
          git commit -m "Dokončit přímé nasazení opravy kanonického archivu [skip ci]"
          git push origin HEAD:main
