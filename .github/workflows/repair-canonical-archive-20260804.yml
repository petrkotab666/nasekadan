name: Opravit a ověřit kanonický archiv 45 článků

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-canonical-archive-20260804.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-canonical-archive-20260804
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      TARGET_SLUG: cisarsky-den-kadan-historie-2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ověřit zdrojový stav před nasazením
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET
          pages=[Path('clanky/index.html'),Path('clanky/strana-2.html'),Path('clanky/strana-3.html'),Path('clanky/strana-4.html')]
          slugs=[]
          for p in pages:
              text=p.read_text(encoding='utf-8')
              slugs += re.findall(r'<article\b[^>]*\bdata-auto-article="([^"]+)"', text)
          assert len(slugs)==45, (len(slugs), slugs)
          assert len(set(slugs))==45
          assert slugs[0]=='cisarsky-den-kadan-historie-2026'
          reg=json.loads(Path('data/published-content-index.json').read_text(encoding='utf-8'))
          assert reg['article_count']==45
          assert len(reg['articles'])==45
          assert not reg['validation'].get('duplicate_urls')
          assert not reg['validation'].get('duplicate_fingerprints')
          rss=ET.parse('rss.xml').getroot().findall('.//item')
          assert len(rss)==45
          for name in ('sitemap.xml','news-sitemap.xml'):
              ET.parse(name)
          print('repo_cards=45 registry=45 rss=45')
          PY

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit kanonické veřejné přehledy
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          bundle="$RUNNER_TEMP/canonical-archive-repair"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/data"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt "$bundle/"
          cp clanky/index.html clanky/strana-2.html clanky/strana-3.html clanky/strana-4.html "$bundle/clanky/"
          cp data/published-content-index.json "$bundle/data/"
          printf 'status=ok\nsource=%s\ndeployer=canonical-archive-repair\narticle_count=45\n' "$sha" > "$bundle/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/canonical-archive-repair
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/canonical-archive-repair
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/clanky" "$root/data"
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo install -m 0644 "$src/$f" "$root/$f"; done
          for f in index.html strana-2.html strana-3.html strana-4.html; do sudo install -m 0644 "$src/clanky/$f" "$root/clanky/$f"; done
          sudo install -m 0644 "$src/data/published-content-index.json" "$root/data/published-content-index.json"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/data
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo docker cp "$src/$f" "nasekadan-web:/usr/share/nginx/html/$f"; done
            for f in index.html strana-2.html strana-3.html strana-4.html; do sudo docker cp "$src/clanky/$f" "nasekadan-web:/usr/share/nginx/html/clanky/$f"; done
            sudo docker cp "$src/data/published-content-index.json" nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
          fi
          rm -rf "$src"
          REMOTE

      - name: Veřejně ověřit titulku, archiv, RSS a sitemapy
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          ok=false
          for attempt in $(seq 1 20); do
            mkdir -p "$RUNNER_TEMP/live"
            curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/?v=$stamp-$attempt" -o "$RUNNER_TEMP/live/home" || true
            curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/clanky/?v=$stamp-$attempt" -o "$RUNNER_TEMP/live/a1" || true
            curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/clanky/strana-2.html?v=$stamp-$attempt" -o "$RUNNER_TEMP/live/a2" || true
            curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/clanky/strana-3.html?v=$stamp-$attempt" -o "$RUNNER_TEMP/live/a3" || true
            curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/clanky/strana-4.html?v=$stamp-$attempt" -o "$RUNNER_TEMP/live/a4" || true
            curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/rss.xml?v=$stamp-$attempt" -o "$RUNNER_TEMP/live/rss" || true
            curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/sitemap.xml?v=$stamp-$attempt" -o "$RUNNER_TEMP/live/sitemap" || true
            curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/news-sitemap.xml?v=$stamp-$attempt" -o "$RUNNER_TEMP/live/news" || true
            curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/deployment-health.txt?v=$stamp-$attempt" -o "$RUNNER_TEMP/live/health" || true
            if python3 - "$RUNNER_TEMP/live" <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET, sys
          d=Path(sys.argv[1])
          home=(d/'home').read_text(errors='replace')
          pages=[(d/f'a{i}').read_text(errors='replace') for i in range(1,5)]
          slugs=[]
          for text in pages:
              slugs += re.findall(r'<article\b[^>]*\bdata-auto-article="([^"]+)"', text)
          assert len(slugs)==45, len(slugs)
          assert len(set(slugs))==45
          assert slugs[0]=='cisarsky-den-kadan-historie-2026'
          assert '/clanky/cisarsky-den-kadan-historie-2026.html' in home
          rss=ET.fromstring((d/'rss').read_text(errors='replace')).findall('.//item')
          assert len(rss)==45
          root=ET.fromstring((d/'sitemap').read_text(errors='replace'))
          locs=[x.text for x in root.iter() if x.tag.endswith('loc')]
          arts=[x for x in locs if x and '/clanky/' in x and x.endswith('.html')]
          assert len(set(arts))==45, len(set(arts))
          nroot=ET.fromstring((d/'news').read_text(errors='replace'))
          nlocs=[x.text for x in nroot.iter() if x.tag.endswith('loc')]
          narts=[x for x in nlocs if x and '/clanky/' in x and x.endswith('.html')]
          assert len(set(narts))==8, len(set(narts))
          health=(d/'health').read_text(errors='replace')
          assert 'status=ok' in health and 'article_count=45' in health
          PY
            then ok=true; break; fi
            sleep 6
          done
          test "$ok" = true

      - name: Aktualizovat kanonický registr potvrzeným veřejným stavem
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          p=Path('data/published-content-index.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          now=datetime.now(timezone.utc).isoformat()
          d['generated_at']=now
          d['source_commit']='32f012935435a01530c162d0f474fcad21027d17'
          v=d['validation']
          v['homepage_count']=14
          v['archive_count']=45
          v['rss_count']=45
          v['sitemap_all_articles_present']=True
          v['news_sitemap_recent_count']=8
          v['deployment_health']='verified'
          v['deployment_health_status_field_present']=True
          v['deployment_health_source']='32f012935435a01530c162d0f474fcad21027d17'
          v['public_audit_at']=now
          v['repair_pending_public_verification']=False
          v['rss_order_matches_archive']=True
          v['public_repair_verification']={
              'status':'success','method':'live-public-audit-after-safe-deploy',
              'homepage_articles':14,'archive_articles':45,'archive_pages':4,
              'rss_articles':45,'sitemap_articles':45,'news_sitemap_articles':8,
              'target_visible_on_homepage':True,'target_visible_in_archive':True,
              'repository_archive_repaired':True,'production_deploy_state':'verified',
              'completed_at':now
          }
          v['last_registry_refresh']={
              'reason':'public archive was safely redeployed and the visible 45-card archive was verified against homepage, RSS and both sitemaps',
              'classification':'safe_repair_publicly_verified',
              'repaired_url':'https://nasekadan.cz/clanky/cisarsky-den-kadan-historie-2026.html',
              'homepage_articles':14,'archive_articles':45,'archive_pages':4,
              'rss_articles':45,'sitemap_articles':45,'news_sitemap_articles':8,
              'completed_at':now
          }
          for a in d['articles']:
              if a['url'].endswith('/cisarsky-den-kadan-historie-2026.html'):
                  a['status']['archive']=True
                  a['publication_status']='published'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          status={
              'status':'success','checked_at':now,'article_count':45,
              'homepage_count':14,'archive_count':45,'rss_count':45,
              'sitemap_article_count':45,'news_sitemap_article_count':8,
              'duplicate_urls':[],'duplicate_fingerprints':[],
              'repaired_url':'https://nasekadan.cz/clanky/cisarsky-den-kadan-historie-2026.html'
          }
          Path('.github/canonical-content-audit-status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git add data/published-content-index.json .github/canonical-content-audit-status.json
            git commit -m 'Potvrdit úplný veřejný archiv 45 článků [skip ci]'
            if git push origin HEAD:main; then break; fi
            [[ "$attempt" == 5 ]] && exit 1
            sleep $((attempt * 5))
          done

      - name: Nasadit potvrzený registr a zdravotní soubor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          sha="$(git rev-parse HEAD)"
          printf 'status=ok\nsource=%s\ndeployer=canonical-content-audit\narticle_count=45\narchive_count=45\n' "$sha" > "$RUNNER_TEMP/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new data/published-content-index.json "$RUNNER_TEMP/deployment-health.txt" ubuntu@57.129.43.215:/tmp/
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -d -m 0755 /var/www/nasekadan/data
          sudo install -m 0644 /tmp/published-content-index.json /var/www/nasekadan/data/published-content-index.json
          sudo install -m 0644 /tmp/deployment-health.txt /var/www/nasekadan/deployment-health.txt
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/data
            sudo docker cp /tmp/published-content-index.json nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
            sudo docker cp /tmp/deployment-health.txt nasekadan-web:/usr/share/nginx/html/deployment-health.txt
          fi
          rm -f /tmp/published-content-index.json /tmp/deployment-health.txt
          REMOTE

      - name: Odstranit jednorázový workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git rm .github/workflows/repair-canonical-archive-20260804.yml
            git commit -m 'Odstranit jednorázovou opravu kanonického archivu [skip ci]'
            if git push origin HEAD:main; then break; fi
            [[ "$attempt" == 5 ]] && exit 1
            sleep $((attempt * 5))
          done
