name: Nouzově nasadit aktuální Naše Kadaň na OVH

on:
  push:
    branches: [main]
    paths:
      - emergency-deploy-trigger.txt
      - .github/workflows/emergency-deploy-ovh.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-emergency-production
  cancel-in-progress: false

env:
  OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit, že main už obsahuje správný archiv
        shell: bash
        run: |
          set -euo pipefail
          test -f clanky/novy-hrbitov-kadan-architektonicka-studie-2026.html
          test -f clanky/komunalni-volby-kadan-historie-1990-2026.html
          grep -Fq 'novy-hrbitov-kadan-architektonicka-studie-2026.html' index.html
          grep -Fq 'novy-hrbitov-kadan-architektonicka-studie-2026.html' clanky/index.html
          grep -Fq 'komunalni-volby-kadan-historie-1990-2026.html' clanky/index.html
          grep -Fq 'novy-hrbitov-kadan-architektonicka-studie-2026.html' rss.xml
          grep -Fq 'novy-hrbitov-kadan-architektonicka-studie-2026.html' sitemap.xml
          grep -Fq 'novy-hrbitov-kadan-architektonicka-studie-2026.html' news-sitemap.xml

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Přenést a atomicky nasadit celý aktuální main
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=research --exclude=node_modules -czf "$RUNNER_TEMP/nasekadan-main.tgz" .
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$RUNNER_TEMP/nasekadan-main.tgz" ubuntu@57.129.43.215:/tmp/nasekadan-emergency-current-main.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          work=/tmp/nasekadan-emergency-current-main
          rm -rf "$work" && mkdir -p "$work"
          tar -xzf /tmp/nasekadan-emergency-current-main.tgz -C "$work"
          chmod +x "$work/deploy/sync-production.sh"
          sudo env GITHUB_WORKSPACE="$work" NASEKADAN_SKIP_AUTOMATION_INSTALL=1 bash "$work/deploy/sync-production.sh"
          rm -rf "$work" /tmp/nasekadan-emergency-current-main.tgz
          REMOTE

      - name: Veřejná kontrola titulky a všech publikačních povrchů
        shell: bash
        run: |
          set -euo pipefail
          hrbitov='novy-hrbitov-kadan-architektonicka-studie-2026.html'
          volby='komunalni-volby-kadan-historie-1990-2026.html'
          ok=0
          for attempt in $(seq 1 15); do
            q="emergency-current-${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            home="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/?v=$q" || true)"
            archive="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/clanky/?v=$q" || true)"
            rss="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/rss.xml?v=$q" || true)"
            sitemap="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/sitemap.xml?v=$q" || true)"
            news="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/news-sitemap.xml?v=$q" || true)"
            if grep -Fq "$hrbitov" <<<"$home" \
              && grep -Fq "$hrbitov" <<<"$archive" \
              && grep -Fq "$volby" <<<"$archive" \
              && grep -Fq "$hrbitov" <<<"$rss" \
              && grep -Fq "$hrbitov" <<<"$sitemap" \
              && grep -Fq "$hrbitov" <<<"$news"; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = 1
          curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/clanky/$hrbitov?v=${GITHUB_RUN_ID}" >/dev/null
          curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/clanky/$volby?v=${GITHUB_RUN_ID}" >/dev/null
          echo 'HOTOVO: aktuální main je veřejně ověřen na titulce, v archivu, RSS, sitemapě a news-sitemapě.'
