name: Nouzově nasadit Naše Kadaň na OVH

on:
  push:
    branches: [main]
    paths:
      - emergency-deploy-trigger.txt
      - .github/workflows/emergency-deploy-ovh.yml
      - deploy/sync-production.sh
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - emergency-deploy-trigger.txt

permissions:
  contents: read

# Nouzové i běžné nasazení používá stejný produkční zámek a stejný skript.
# Každá změna emergency-deploy-trigger.txt proto ihned spustí kanonické nasazení
# aktuálního mainu do Dockeru i aktivního document rootu /var/www/nasekadan.
concurrency:
  group: nasekadan-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, ovh, lastminuteslevy]
    timeout-minutes: 25
    steps:
      - name: Stáhnout aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit kanonickou verzi webu
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/sync-production.sh
          bash deploy/sync-production.sh
