name: Nouzově nasadit Naše Kadaň na OVH

on:
  push:
    branches: [main]
    paths:
      - emergency-deploy-trigger.txt
      - .github/workflows/emergency-deploy-ovh.yml
      - deploy/sync-production.sh
      - deploy/install-automation.sh
      - Dockerfile
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - emergency-deploy-trigger.txt

permissions:
  contents: read

# Nouzový i běžný deploy používají stejný kanonický zámek. Nemohou si tedy
# navzájem přepsat document root jinou nebo starší verzí.
concurrency:
  group: nasekadan-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - name: Stáhnout aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit kanonickou verzi webu
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/sync-production.sh
          sudo env \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash deploy/sync-production.sh
