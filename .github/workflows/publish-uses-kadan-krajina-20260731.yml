name: Zveřejnit plán ÚSES a krajinné zakázky Kadaň

on:
  push:
    branches: [main]
    paths:
      - 'clanky/plan-uses-kadan-krajina-zakazky-2026.html'
      - '.github/workflows/publish-uses-kadan-krajina-20260731.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 18 31 7 *'
    - cron: '30 18 31 7 *'
    - cron: '0 19 31 7 *'

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-uses-kadan-krajina-20260731
  cancel-in-progress: false

env:
  ARTICLE: clanky/plan-uses-kadan-krajina-zakazky-2026.html
  SLUG: plan-uses-kadan-krajina-zakazky-2026
  ARTICLE_H1: Další plán krajiny pro Kadaň za 1,45 milionu. Co se překrývá se starší studií za téměř tři miliony?
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  SERVER: 57.129.43.215

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Omezit jednorázové opravné běhy na dnešní datum
        id: timing
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'schedule' && "$(date -u +%F)" != '2026-07-31' ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
          else
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Vytvořit produkční článek, sociální obrázek a všechny přehledy
        id: build
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ARTICLE"
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          article = Path('clanky/plan-uses-kadan-krajina-zakazky-2026.html')
          text = article.read_text(encoding='utf-8')
          match = re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']https://nasekadan\.cz/social/([^"\']+)["\']', text, re.I)
          if not match:
              raise SystemExit('Článek nemá vygenerovaný OG obrázek.')
          filename = match.group(1)
          image = Path('social') / filename
          if not image.is_file():
              raise SystemExit(f'Vygenerovaný obrázek neexistuje: {image}')
          text = text.replace('../social/plan-uses-kadan-krajina-zakazky-2026.png', f'../social/{filename}')
          article.write_text(text, encoding='utf-8', newline='\n')
          Path('/tmp/uses-social-filename.txt').write_text(filename, encoding='utf-8')
          PY
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/enforce_article_visibility.py
          python3 scripts/sort_articles_chronologically.py
          python3 scripts/ensure_recent_rss_entries.py
          image_name="$(cat /tmp/uses-social-filename.txt)"
          python3 - "$image_name" <<'PY'
          import struct, sys
          from pathlib import Path
          p = Path('social') / sys.argv[1]
          data = p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data) < 10000 or struct.unpack('>II', data[16:24]) != (1200, 630):
              raise SystemExit('Sociální obrázek není platný PNG 1200 × 630.')
          PY
          grep -Fq "<h1>$ARTICLE_H1</h1>" "$ARTICLE"
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" news-sitemap.xml
          echo "image=$image_name" >> "$GITHUB_OUTPUT"

      - name: Uložit produkční soubory do main
        id: source_commit
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň publikační automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- "$ARTICLE" social index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt style.css
          if ! git diff --cached --quiet; then
            git commit -m 'Publikovat: plán ÚSES a krajinné zakázky v Kadani'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              [[ "$attempt" == 4 ]] && exit 1
              sleep $((attempt * 5))
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Připravit SSH klíč
        id: ssh
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Kanonicky nasadit celý aktuální main na OVH
        id: deploy
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "ubuntu@$SERVER" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo chown -R ubuntu:ubuntu /opt/nasekadan
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

      - name: Zjistit skutečně nasazený source commit
        id: source
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha="$(ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "ubuntu@$SERVER" 'cd /opt/nasekadan && git rev-parse HEAD')"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Veřejně ověřit článek, titulku, archiv, feedy a obrázek
        id: verify
        if: steps.timing.outputs.active == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?uses=$key" || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?uses=$key" || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?uses=$key" || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?uses=$key" || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?uses=$key" || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?uses=$key" || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?uses=$key" || true)"
            image_url="$(sed -n 's/.*property="og:image" content="\([^"]*\)".*/\1/p' <<<"$article" | head -1)"
            image_file="$RUNNER_TEMP/uses-social-${attempt}.png"
            rm -f "$image_file"
            [[ "$image_url" == https://nasekadan.cz/social/* ]] && curl -4 -kfsS --max-time 25 "${image_url}?uses=$key" -o "$image_file" || true
            image_ok=no
            if [[ -s "$image_file" ]] && python3 - "$image_file" <<'PY'
          import struct, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          raise SystemExit(0 if data.startswith(b'\x89PNG\r\n\x1a\n') and len(data) > 10000 and struct.unpack('>II', data[16:24]) == (1200, 630) else 1)
          PY
            then image_ok=yes; fi
            if grep -Fq "<h1>$ARTICLE_H1</h1>" <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "${SLUG}.html" <<<"$rss" \
              && grep -Fq "${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "${SLUG}.html" <<<"$news" \
              && grep -Fq "source=$SOURCE_SHA" <<<"$health" \
              && [[ "$image_ok" == yes ]]; then
              echo "image_url=$image_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 8
          done
          echo 'Veřejná kontrola nedoložila úplné zveřejnění.' >&2
          exit 1

      - name: Zveřejnit článek na Facebooku až po ověření živého webu
        id: facebook
        if: steps.timing.outputs.active == 'true'
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          FACEBOOK_WAIT_TIMEOUT: '900'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/process_facebook_queue_live.py "$ARTICLE"
          marker="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          article='clanky/plan-uses-kadan-krajina-zakazky-2026.html'
          digest=hashlib.sha256(article.encode()).hexdigest()[:10]
          print(f'.github/facebook-published/{Path(article).stem}-{digest}.json')
          PY
          )"
          test -f "$marker"
          grep -Fq 'facebook_post_id' "$marker"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"

      - name: Uložit potvrzení Facebooku
        if: steps.timing.outputs.active == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň Facebook automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- .github/facebook-publish-pending.txt .github/facebook-last-status.json .github/facebook-published || true
          if ! git diff --cached --quiet; then
            git commit -m 'Potvrdit Facebook: plán ÚSES a krajinné zakázky'
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              [[ "$attempt" == 3 ]] && exit 1
              sleep $((attempt * 5))
            done
          fi

      - name: Zapsat výsledek a otevřít upozornění pouze při selhání
        if: always() && steps.timing.outputs.active == 'true'
        uses: actions/github-script@v7
        env:
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          FACEBOOK: ${{ steps.facebook.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const ok = process.env.BUILD === 'success' && process.env.DEPLOY === 'success' && process.env.VERIFY === 'success' && process.env.FACEBOOK === 'success';
            const path = '.github/uses-kadan-publication-status.json';
            const state = {status: ok ? 'success' : 'repair_pending', checked_at_utc: new Date().toISOString(), article: process.env.ARTICLE || 'clanky/plan-uses-kadan-krajina-zakazky-2026.html', build: process.env.BUILD, deploy: process.env.DEPLOY, public_verification: process.env.VERIFY, facebook: process.env.FACEBOOK, deployed_source: process.env.SOURCE_SHA || null, run_id: context.runId};
            const content = Buffer.from(JSON.stringify(state, null, 2) + '\n').toString('base64');
            let sha;
            try { const current = await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'}); if (!Array.isArray(current.data)) sha=current.data.sha; } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat stav publikace ÚSES: ${state.status}`,content,...(sha?{sha}:{})});
            if (!ok) {
              const title = 'Opravit zveřejnění článku o plánu ÚSES';
              const issues = await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
              if (!issues.some(i => !i.pull_request && i.title === title)) await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body:`Automat nedoložil úplné zveřejnění. Stav: ${JSON.stringify(state)}. Další naplánovaný běh provede novou opravu.`});
            }
