name: Kanonický úplný produkční deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/canonical-production.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-canonical-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dynamicky určit nejnovější články a ověřit úplnost zdroje
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          test -f deploy/sync-production.sh
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from hashlib import sha256
          from pathlib import Path
          import re, os

          root=Path('.')
          now=datetime.now(timezone.utc)+timedelta(minutes=2)
          items=[]
          for path in (root/'clanky').glob('*.html'):
              if path.name == 'index.html' or re.fullmatch(r'strana-\d+\.html', path.name):
                  continue
              text=path.read_text(encoding='utf-8', errors='replace')
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', text, re.I):
                  continue
              m=re.search(r'<meta[^>]+property=["\']article:published_time["\'][^>]+content=["\']([^"\']+)', text, re.I)
              if not m:
                  m=re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']article:published_time["\']', text, re.I)
              if not m:
                  m=re.search(r'"datePublished"\s*:\s*"([^"]+)"', text)
              if not m:
                  continue
              dt=datetime.fromisoformat(m.group(1).replace('Z','+00:00'))
              if dt.tzinfo is None:
                  dt=dt.replace(tzinfo=timezone.utc)
              if dt.astimezone(timezone.utc) <= now:
                  items.append((dt, '/clanky/'+path.name))
          items.sort(reverse=True)
          if len(items) < 2:
              raise SystemExit('Chybí alespoň dva publikované články.')
          latest=items[0][1]
          second=items[1][1]
          home=(root/'index.html').read_text(encoding='utf-8')
          marker=f'data-latest-article-href="{latest}"'
          if marker not in home:
              raise SystemExit(f'Titulka neukazuje na skutečně nejnovější článek {latest}.')
          if second not in home:
              raise SystemExit(f'Druhý nejnovější článek na titulce chybí: {second}.')

          raf=root/'clanky/eso-market-rafanda-kadan-24-7.html'
          if not raf.is_file():
              raise SystemExit('Chybí článek Rafandy.')
          raf_text=raf.read_text(encoding='utf-8')
          images=[
              'images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp',
              'images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp',
              'images/clanky/eso-market-rafanda/pravidla-platba-kamery-v2.webp',
          ]
          hashes=[]
          for rel in images:
              path=root/rel
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Chybí obrazový asset Rafandy: {rel}')
              if '/'+rel not in raf_text:
                  raise SystemExit(f'Článek Rafandy neodkazuje na {rel}')
              hashes.append(sha256(path.read_bytes()).hexdigest())

          archive=(root/'clanky/index.html').read_text(encoding='utf-8')
          pages=sorted(
              set(re.findall(r'href=["\'](/clanky/strana-\d+\.html)["\']', archive)),
              key=lambda value: int(re.search(r'(\d+)', value).group(1)),
          )
          if not pages:
              raise SystemExit('Archiv neobsahuje žádné odkazy na starší stránky.')
          expected=list(range(2, len(pages)+2))
          actual=[int(re.search(r'(\d+)', value).group(1)) for value in pages]
          if actual != expected:
              raise SystemExit(f'Stránkování archivu není souvislé: {actual}, očekáváno {expected}.')
          for url in pages:
              path=root/url.lstrip('/')
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Chybí cílový soubor stránkování: {path}')
              text=path.read_text(encoding='utf-8', errors='replace')
              n=int(re.search(r'(\d+)', url).group(1))
              if f'Všechny články – strana {n}' not in text:
                  raise SystemExit(f'Cílová stránka {url} nemá očekávaný nadpis.')
              if 'article-card' not in text:
                  raise SystemExit(f'Cílová stránka {url} neobsahuje články.')

          env=Path(os.environ['GITHUB_ENV'])
          with env.open('a', encoding='utf-8') as f:
              f.write(f'EXPECTED_LATEST={latest}\n')
              f.write(f'EXPECTED_SECOND={second}\n')
              f.write(f'ARCHIVE_PAGES={",".join(pages)}\n')
              f.write(f'ARCHIVE_PAGE_COUNT={len(pages)+1}\n')
              for i,h in enumerate(hashes,1):
                  f.write(f'RAFANDA_SHA{i}={h}\n')
          print('Nejnovější:', latest)
          print('Druhý:', second)
          print('Archivní stránky:', '/clanky/,', ', '.join(pages))
          print('Rafanda SHA-256:', *hashes)
          PY

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Přenést úplný aktuální main na OVH
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=research --exclude=node_modules -czf "$RUNNER_TEMP/nasekadan-main.tgz" .
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/nasekadan-main.tgz" ubuntu@57.129.43.215:/tmp/nasekadan-canonical-main.tgz

      - name: Atomicky nasadit přes jediný kanonický skript
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          work=/tmp/nasekadan-canonical-main
          rm -rf "$work"
          mkdir -p "$work"
          tar -xzf /tmp/nasekadan-canonical-main.tgz -C "$work"
          test -d "$work/.git"
          chmod +x "$work/deploy/sync-production.sh"
          sudo env GITHUB_WORKSPACE="$work" NASEKADAN_SKIP_AUTOMATION_INSTALL=1 bash "$work/deploy/sync-production.sh"
          rm -rf "$work" /tmp/nasekadan-canonical-main.tgz
          REMOTE

      - name: Veřejně ověřit pořadí, stránkování a fotografie Rafandy
        shell: bash
        run: |
          set -euo pipefail
          base='https://nasekadan.cz'
          ok=0
          for attempt in $(seq 1 12); do
            q="canonical-${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            curl -4 -kfsSL --max-time 40 "$base/?v=$q" -o /tmp/home.html || true
            curl -4 -kfsSL --max-time 40 "$base/clanky/?v=$q" -o /tmp/archive.html || true
            curl -4 -kfsSL --max-time 40 "$base/clanky/eso-market-rafanda-kadan-24-7.html?v=$q" -o /tmp/rafanda.html || true
            img1=$(curl -4 -kfsSL --max-time 40 -o /tmp/rafanda1.webp -w '%{http_code}' "$base/images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp?v=$q" || true)
            img2=$(curl -4 -kfsSL --max-time 40 -o /tmp/rafanda2.webp -w '%{http_code}' "$base/images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp?v=$q" || true)
            img3=$(curl -4 -kfsSL --max-time 40 -o /tmp/rafanda3.webp -w '%{http_code}' "$base/images/clanky/eso-market-rafanda/pravidla-platba-kamery-v2.webp?v=$q" || true)
            live1=$(sha256sum /tmp/rafanda1.webp 2>/dev/null | awk '{print $1}' || true)
            live2=$(sha256sum /tmp/rafanda2.webp 2>/dev/null | awk '{print $1}' || true)
            live3=$(sha256sum /tmp/rafanda3.webp 2>/dev/null | awk '{print $1}' || true)

            pagination_ok=1
            IFS=',' read -r -a archive_pages <<< "$ARCHIVE_PAGES"
            page_index=0
            for page in "${archive_pages[@]}"; do
              page_index=$((page_index + 1))
              tmp="/tmp/archive-page-${page_index}.html"
              code=$(curl -4 -ksSL --max-time 40 -o "$tmp" -w '%{http_code}' "$base$page?v=$q" || true)
              page_no="${page##*strana-}"
              page_no="${page_no%.html}"
              if [[ "$code" != 200 ]] \
                || ! grep -Fq "Všechny články – strana $page_no" "$tmp" \
                || ! grep -Fq 'article-card' "$tmp"; then
                pagination_ok=0
                break
              fi
            done

            if grep -Fq "data-latest-article-href=\"$EXPECTED_LATEST\"" /tmp/home.html \
              && grep -Fq "$EXPECTED_SECOND" /tmp/home.html \
              && grep -Fq 'href="/clanky/strana-2.html"' /tmp/archive.html \
              && [[ "$pagination_ok" == 1 ]] \
              && grep -Fq '/images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp' /tmp/rafanda.html \
              && grep -Fq '/images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp' /tmp/rafanda.html \
              && grep -Fq '/images/clanky/eso-market-rafanda/pravidla-platba-kamery-v2.webp' /tmp/rafanda.html \
              && [[ "$img1" == 200 && "$img2" == 200 && "$img3" == 200 ]] \
              && [[ "$live1" == "$RAFANDA_SHA1" ]] \
              && [[ "$live2" == "$RAFANDA_SHA2" ]] \
              && [[ "$live3" == "$RAFANDA_SHA3" ]]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo "OK: produkce má $EXPECTED_LATEST, $EXPECTED_SECOND, všech $ARCHIVE_PAGE_COUNT stran archivu a bitově správné tři fotografie Rafandy."

      - name: Zapsat potvrzení úplného nasazení
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonický deploy'
          git config user.email 'info@nasekadan.cz'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p reports
          cat > reports/canonical-production-20260807.json <<EOF
          {
            "status": "success",
            "verified_at": "$(date -u +%FT%TZ)",
            "workflow_run": "$GITHUB_RUN_ID",
            "homepage_latest": "$EXPECTED_LATEST",
            "homepage_second": "$EXPECTED_SECOND",
            "archive_page_count": $ARCHIVE_PAGE_COUNT,
            "archive_pages": "$ARCHIVE_PAGES",
            "rafanda_sha256": ["$RAFANDA_SHA1", "$RAFANDA_SHA2", "$RAFANDA_SHA3"]
          }
          EOF
          git add reports/canonical-production-20260807.json
          git commit -m 'Potvrdit kanonický deploy včetně stránkování archivu [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
