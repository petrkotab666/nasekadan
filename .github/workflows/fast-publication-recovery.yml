name: Rychlé publikování a obnova Naše Kadaň

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/fast-publication-recovery-trigger.txt'

permissions:
  contents: read

concurrency:
  group: nasekadan-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, ovh, lastminuteslevy]
    timeout-minutes: 30

    steps:
      - name: Spustit jediný kanonický produkční postup
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh

      - name: Potvrdit zdrojový commit a aktualizaci jezera Most
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C /opt/nasekadan rev-parse HEAD)"
          article='/opt/nasekadan/clanky/jezero-most-patrani-dva-lide-bourka-2026.html'
          expected='Pátrání na jezeře Most má tragický vývoj. Policie našla tělo osmadvacetiletého muže'
          h1="$(python3 - "$article" <<'PY'
          from html import unescape
          from pathlib import Path
          import re, sys
          text=Path(sys.argv[1]).read_text(encoding='utf-8')
          match=re.search(r'<h1\b[^>]*>(.*?)</h1>', text, re.I|re.S)
          if not match: raise SystemExit(1)
          print(re.sub(r'\s+',' ',unescape(re.sub(r'<[^>]+>',' ',match.group(1)))).strip())
          PY
          )"
          test "$h1" = "$expected"
          modified="$(python3 - "$article" <<'PY'
          from pathlib import Path
          import re, sys
          text=Path(sys.argv[1]).read_text(encoding='utf-8')
          match=re.search(r'"dateModified"\s*:\s*"([^"]+)"', text)
          if not match: raise SystemExit(1)
          print(match.group(1))
          PY
          )"
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          health="$(curl -kfsSL --max-time 25 "https://nasekadan.cz/deployment-health.txt?manual=$stamp")"
          live="$(curl -kfsSL --max-time 25 "https://nasekadan.cz/clanky/jezero-most-patrani-dva-lide-bourka-2026.html?manual=$stamp")"
          home="$(curl -kfsSL --max-time 25 "https://nasekadan.cz/?manual=$stamp")"
          archive="$(curl -kfsSL --max-time 25 "https://nasekadan.cz/clanky/?manual=$stamp")"
          rss="$(curl -kfsSL --max-time 25 "https://nasekadan.cz/rss.xml?manual=$stamp")"
          grep -Fq "source=$source_sha" <<<"$health"
          grep -Fq "$expected" <<<"$live"
          grep -Fq "$modified" <<<"$live"
          grep -Fq "$expected" <<<"$home"
          grep -Fq "$expected" <<<"$archive"
          grep -Fq "$expected" <<<"$rss"
          echo 'Rychlé publikování a obnova aktualizace jezera Most prošly.'
