name: Rychlé publikování a obnova Naše Kadaň

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-fast-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Synchronizovat schválený veřejný obsah
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 index.html /var/www/nasekadan/index.html
          sudo install -m 0644 clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 clanky/kolobezky-hriste-detektor-kovu-kadan.html /var/www/nasekadan/clanky/kolobezky-hriste-detektor-kovu-kadan.html
          sudo install -m 0644 clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html /var/www/nasekadan/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          sudo install -m 0644 rss.xml /var/www/nasekadan/rss.xml
          sudo install -m 0644 sitemap.xml /var/www/nasekadan/sitemap.xml
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=fast-recovery\n' "$(git rev-parse HEAD)" "$(date -u +%FT%TZ)" | sudo tee /var/www/nasekadan/deployment-health.txt >/dev/null
          REMOTE

      - name: Ověřit živý web
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            kolobezky="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/kolobezky-hriste-detektor-kovu-kadan.html?check=${GITHUB_SHA}-${attempt}" || true)"
            kultura="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html?check=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq 'Koloběžky pod větším dohledem' <<<"$kolobezky" && grep -Fq 'Karlovy Vary' <<<"$kultura"; then
              echo 'Aktuální články jsou veřejně dostupné.'
              exit 0
            fi
            sleep 10
          done
          echo 'Veřejná kontrola selhala.' >&2
          exit 1
