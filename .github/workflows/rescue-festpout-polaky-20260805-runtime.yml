name: Nezávislá záchrana Festpouti Poláky 2026

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Zveřejnit Festpouť Poláky 9. 8. 2026 v 8:00'
    types: [completed]
  schedule:
    - cron: '15 6 9 8 *'
    - cron: '30 6 9 8 *'
    - cron: '0 7 9 8 *'
    - cron: '30 7 9 8 *'

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-festpout-polaky-20260809-global
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Obnovit a přečasovat balíček nezávisle na primárním workflow
        shell: bash
        run: |
          set -euo pipefail
          cat .github/publication/festpout-polaky-2026/chunks/*.b64 | base64 -d > /tmp/festpout-bundle.tar.xz
          echo 'cfc83b2cdc8f063c63b2b8086069d165cad4768031393704503d8f94ce409ae5  /tmp/festpout-bundle.tar.xz' | sha256sum -c -
          rm -rf /tmp/festpout-unpack && mkdir -p /tmp/festpout-unpack
          tar -xJf /tmp/festpout-bundle.tar.xz -C /tmp/festpout-unpack
          install -D -m 0755 /tmp/festpout-unpack/publisher.py scripts/publish_festpout_polaky_20260805.py
          install -D -m 0755 /tmp/festpout-unpack/deploy.sh scripts/deploy_festpout_polaky_20260805.sh
          python3 scripts/retime_festpout_publication_20260809.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Poslední samostatný publikační a ověřovací pokus
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet Pillow
          python3 -m py_compile scripts/publish_festpout_polaky_20260805.py scripts/retime_festpout_publication_20260809.py
          grep -Fq '2026, 8, 9, 8, 0' scripts/publish_festpout_polaky_20260805.py
          bash -n scripts/deploy_festpout_polaky_20260805.sh
          bash scripts/deploy_festpout_polaky_20260805.sh

      - name: Zapsat konečný incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Záchrana Festpouti Poláky 2026 selhala'
          body="Nezávislá záchranná vrstva nedokázala veřejně potvrdit článek, titulku, archiv, RSS, obě sitemapy, sociální obrázek a deployment-health.\n\nCílový čas: 9. 8. 2026 v 8:00 Europe/Prague\nWorkflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nCílová URL: https://nasekadan.cz/clanky/festpout-polaky-zvlastni-vlaky-z-kadane-2026.html"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
