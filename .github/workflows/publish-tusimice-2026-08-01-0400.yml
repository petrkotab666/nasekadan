name: Publikovat jaderné Tušimice 1. 8. 2026 ve 04:00 s více pojistkami

on:
  push:
    branches: [main]
    paths:
      - '.github/drafts/jaderne-tusimice-smr-voda-doprava-eia-2026.html'
      - '.github/workflows/publish-tusimice-2026-08-01-0400.yml'
  schedule:
    # GitHub cron používá UTC. 02:00 UTC = 04:00 CEST.
    - cron: '0 2 1 8 *'
    # Pojistky při zpoždění GitHubu, chybě nasazení nebo Facebooku.
    - cron: '7 2 1 8 *'
    - cron: '17 2 1 8 *'
    - cron: '27 2 1 8 *'
    - cron: '45 2 1 8 *'
    - cron: '0 3 1 8 *'
    - cron: '0 4 1 8 *'
  workflow_dispatch:
    inputs:
      force:
        description: Publikovat a opravit ihned
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-tusimice-2026-08-01-0400
  cancel-in-progress: false

env:
  SLUG: jaderne-tusimice-smr-voda-doprava-eia-2026
  ARTICLE: clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
  DRAFT: .github/drafts/jaderne-tusimice-smr-voda-doprava-eia-2026.html
  TARGET_UTC: '2026-08-01T02:00:00Z'
  EXPECTED_TEXT: 'Úplná EIA měla být na ministerstvu už 12. května'
  ISSUE_TITLE: 'Publikace jaderných Tušimic vyžaduje zásah'
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Stáhnout hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit neveřejný návrh před publikací
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DRAFT"
          grep -Fq '<title>Jaderné Tušimice se připravují naplno.' "$DRAFT"
          grep -Fq '2026-08-01T04:00:00+02:00' "$DRAFT"
          grep -Fq 'data-poll-id="smr-tusimice-2026"' "$DRAFT"
          grep -Fq '/api/analytics/pageview' "$DRAFT"
          grep -Fq 'https://portal.cenia.cz/eiasea/detail/EIA_MZP531?lang=cs' "$DRAFT"
          grep -Fq 'https://www.strahlenschutz.sachsen.de/download/2_Neue_Kernkraftanlage_SMR_Tusimice.pdf' "$DRAFT"
          grep -Fq '</article>' "$DRAFT"
          grep -Fq '</html>' "$DRAFT"
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          text=Path('.github/drafts/jaderne-tusimice-smr-voda-doprava-eia-2026.html').read_text(encoding='utf-8')
          Parser().feed(text)
          required=('Jaderné Tušimice','45,6 milionu','2 400 pohybů','573 včasných vyjádření')
          missing=[item for item in required if item not in text]
          if missing:
              raise SystemExit('V návrhu chybí: '+', '.join(missing))
          PY

  publish-and-verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Stáhnout hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rozhodnout, zda je čas publikace
        id: timing
        shell: bash
        run: |
          set -euo pipefail
          force='${{ inputs.force || false }}'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$force" != 'true' && "$now" < "$TARGET_UTC" ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo "Návrh je v pořádku, ale ještě není čas publikace: $now < $TARGET_UTC"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == 'schedule' && "$(date -u +%F)" != '2026-08-01' ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Jednorázový harmonogram mimo 1. 8. 2026 se ignoruje.'
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"

      - name: Připravit článek, sociální obrázek a všechny přehledy
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "$DRAFT" "$ARTICLE"
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/enforce_article_visibility.py
          python3 scripts/sort_articles_chronologically.py

          social_url="$(python3 - <<'PY'
          import html,re
          from pathlib import Path
          text=Path('clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html').read_text(encoding='utf-8')
          m=re.search(r'<meta\s+property=["\']og:image["\']\s+content=["\']([^"\']+)',text,re.I)
          if not m: raise SystemExit('Chybí og:image')
          print(html.unescape(m.group(1)))
          PY
          )"
          social_image="social/${social_url##*/}"
          test -s "$social_image"
          echo "SOCIAL_URL=$social_url" >> "$GITHUB_ENV"
          echo "SOCIAL_IMAGE=$social_image" >> "$GITHUB_ENV"

          python3 - "$social_image" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          p=Path(sys.argv[1])
          with Image.open(p) as im:
              if im.format != 'PNG' or im.size != (1200,630):
                  raise SystemExit(f'Chybný sociální obrázek: {im.format}, {im.size}')
          if p.stat().st_size < 10000:
              raise SystemExit('Sociální obrázek je podezřele malý.')
          PY

          grep -Fq "$EXPECTED_TEXT" "$ARTICLE"
          grep -Fq 'Chcete, aby v Tušimicích vznikla nová jaderná elektrárna?' "$ARTICLE"
          grep -Fq "$social_url" "$ARTICLE"
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" news-sitemap.xml

      - name: Uložit zveřejnění do hlavní větve s opakováním
        if: steps.timing.outputs.active == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň publikační automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- "$ARTICLE" "$SOCIAL_IMAGE" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt style.css
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Hlavní větev už obsahuje připravenou veřejnou verzi.'
          else
            git commit -m 'Publikovat: jaderné Tušimice – velká rešerše'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo 'changed=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 6))
            done
            exit 1
          fi

      - name: Připravit SSH klíč pro přímé nasazení
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přímo na OVH i do aktivního kontejneru
        if: steps.timing.outputs.active == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-tusimice-publication"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$SOCIAL_IMAGE" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$bundle/"

          for attempt in 1 2 3; do
            if scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-tusimice-publication; then
              break
            fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep $((attempt * 8))
          done

          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 /tmp/nk-tusimice-publication/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-tusimice-publication/clanky/index.html /var/www/nasekadan/clanky/index.html
          find /tmp/nk-tusimice-publication/social -maxdepth 1 -type f -name 'jaderne-tusimice-smr-voda-doprava-eia-2026-*.png' -exec sudo install -m 0644 {} /var/www/nasekadan/social/ \;
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do
            sudo install -m 0644 "/tmp/nk-tusimice-publication/$f" "/var/www/nasekadan/$f"
          done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp /tmp/nk-tusimice-publication/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp /tmp/nk-tusimice-publication/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            for f in /tmp/nk-tusimice-publication/social/*.png; do
              [[ -f "$f" ]] && sudo docker cp "$f" nasekadan-web:/usr/share/nginx/html/social/
            done
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do
              sudo docker cp "/tmp/nk-tusimice-publication/$f" "nasekadan-web:/usr/share/nginx/html/$f"
            done
          fi
          sudo chmod -R a+rX /var/www/nasekadan
          grep -Fq 'Úplná EIA měla být na ministerstvu už 12. května' /var/www/nasekadan/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
          grep -Fq '/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html' /var/www/nasekadan/index.html
          test "$(find /var/www/nasekadan/social -maxdepth 1 -type f -name 'jaderne-tusimice-smr-voda-doprava-eia-2026-*.png' | wc -l)" -ge 1
          rm -rf /tmp/nk-tusimice-publication
          REMOTE

      - name: Veřejně ověřit článek, titulku, archiv, feedy a obrázek
        if: steps.timing.outputs.active == 'true'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for attempt in $(seq 1 36); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            image="$RUNNER_TEMP/tusimice-social-${attempt}.png"
            curl -4 -kfsS --max-time 25 "${SOCIAL_URL}?v=${stamp}-${attempt}" -o "$image" 2>/dev/null || true
            image_ok="$(python3 - "$image" <<'PY'
          import sys
          from pathlib import Path
          try:
              from PIL import Image
              p=Path(sys.argv[1])
              with Image.open(p) as im:
                  print('yes' if im.format=='PNG' and im.size==(1200,630) and p.stat().st_size>=10000 else 'no')
          except Exception:
              print('no')
          PY
            )"
            if grep -Fq "$EXPECTED_TEXT" <<<"$article" \
              && grep -Fq 'Chcete, aby v Tušimicích vznikla nová jaderná elektrárna?' <<<"$article" \
              && grep -Fq "$SOCIAL_URL" <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$news" \
              && [[ "$image_ok" == 'yes' ]]; then
              echo 'Webové zveřejnění je kompletně a veřejně ověřené.'
              echo 'web_ok=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'web_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Počkat na hlavní Facebook automat
        if: steps.timing.outputs.active == 'true' && steps.verify.outputs.web_ok == 'true'
        id: facebook_wait
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          marker="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          article='clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html'
          digest=hashlib.sha256(article.encode()).hexdigest()[:10]
          print(f'.github/facebook-published/{Path(article).stem}-{digest}.json')
          PY
          )"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 24); do
            git fetch -q origin main
            if git cat-file -e "origin/main:$marker" 2>/dev/null; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
              git show "origin/main:$marker"
              exit 0
            fi
            sleep 12
          done
          echo 'published=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Pojistka Facebooku – publikovat přímo, pokud hlavní automat nepotvrdil příspěvek
        if: steps.timing.outputs.active == 'true' && steps.verify.outputs.web_ok == 'true' && steps.facebook_wait.outputs.published != 'true'
        id: facebook_direct
        continue-on-error: true
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          FACEBOOK_WAIT_TIMEOUT: '600'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          python3 scripts/process_facebook_queue_live.py "$ARTICLE"

      - name: Uložit Facebook frontu a potvrzení s opakováním
        if: always() && steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň pojistka Facebooku'
          git config user.email 'info@nasekadan.cz'
          git add -A -- .github/facebook-publish-pending.txt .github/facebook-last-status.json .github/facebook-published 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Potvrdit publikaci jaderných Tušimic na Facebooku'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 6))
          done
          exit 1

      - name: Konečně ověřit potvrzení Facebooku
        if: always() && steps.timing.outputs.active == 'true' && steps.verify.outputs.web_ok == 'true'
        id: facebook_final
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          marker='${{ steps.facebook_wait.outputs.marker }}'
          if [[ -z "$marker" ]]; then
            marker="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          article='clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html'
          digest=hashlib.sha256(article.encode()).hexdigest()[:10]
          print(f'.github/facebook-published/{Path(article).stem}-{digest}.json')
          PY
            )"
          fi
          for attempt in $(seq 1 15); do
            git fetch -q origin main
            if git cat-file -e "origin/main:$marker" 2>/dev/null; then
              echo 'facebook_ok=true' >> "$GITHUB_OUTPUT"
              git show "origin/main:$marker"
              exit 0
            fi
            sleep 10
          done
          echo 'facebook_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Zapsat konečný stav a spravovat výstražný issue
        if: always() && steps.timing.outputs.active == 'true'
        uses: actions/github-script@v7
        env:
          WEB_OK: ${{ steps.verify.outputs.web_ok }}
          FACEBOOK_OK: ${{ steps.facebook_final.outputs.facebook_ok }}
          FACEBOOK_DIRECT: ${{ steps.facebook_direct.outcome }}
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const webOk = process.env.WEB_OK === 'true';
            const facebookOk = process.env.FACEBOOK_OK === 'true';
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (webOk && facebookOk) {
              if (existing) {
                await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed'});
              }
              core.summary.addHeading('Publikace kompletně ověřena').addList([
                'Článek je veřejně dostupný',
                'Článek je na titulce a v archivu',
                'RSS a obě sitemapy obsahují článek',
                'Sociální obrázek 1200 × 630 je dostupný',
                'Facebook má potvrzený publikační marker'
              ]).write();
              return;
            }
            const body = [
              'Automat zatím nepotvrdil kompletní publikaci článku o jaderných Tušimicích.',
              '',
              `- Web: ${webOk ? 'ověřen' : 'NEOVĚŘEN'}`,
              `- Facebook: ${facebookOk ? 'ověřen' : 'NEOVĚŘEN'}`,
              `- Přímá facebooková pojistka: ${process.env.FACEBOOK_DIRECT || 'neproběhla'}`,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Další naplánovaný opravný běh se pokusí publikaci znovu dokončit. Trvalá publikační pojistka navíc kontroluje web a Facebook každou hodinu.'
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['publication-alert']}).catch(async () => {
                await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
              });
            }

      - name: Selhat, dokud nejsou web i Facebook potvrzené
        if: steps.timing.outputs.active == 'true' && (steps.verify.outputs.web_ok != 'true' || steps.facebook_final.outputs.facebook_ok != 'true')
        shell: bash
        run: |
          echo 'Publikace ještě není kompletně potvrzená. Následující pojistný běh provede další opravu.' >&2
          exit 1
