name: Předletově otestovat článek o sečení a viditelné hlasování

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/greenery-poll-v3-preflight-trigger.txt'
      - '.github/workflows/validate-greenery-poll-v3.yml'
      - 'scripts/patch_greenery_prepare_postpipeline.py'

permissions:
  contents: write

concurrency:
  group: validate-greenery-poll-v3
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Trvale opravit vložení ankety po normalizaci
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_greenery_prepare_postpipeline.py
          python3 -m py_compile scripts/patch_greenery_prepare_postpipeline.py scripts/prepare_greenery_publication_20260801.py
          grep -Fq 'POLL_POST_PIPELINE_V2' scripts/prepare_greenery_publication_20260801.py
          git config user.name 'Naše Kadaň – předletová oprava ankety'
          git config user.email 'info@nasekadan.cz'
          git add scripts/prepare_greenery_publication_20260801.py scripts/patch_greenery_prepare_postpipeline.py
          if ! git diff --cached --quiet; then
            git commit -m 'Vynutit funkční anketu po normalizaci článku [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 5 ]] && exit 1
              sleep $((attempt * 4))
            done
          fi
          git fetch origin main
          git reset --hard origin/main

      - name: Sestavit článek a otestovat hlasování bez zveřejnění
        id: test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/install_poll_system_v2.py
          python3 scripts/patch_greenery_prepare_postpipeline.py
          python3 -m py_compile newsletter/server.py scripts/install_poll_system_v2.py scripts/test_poll_system_v2.py scripts/prepare_greenery_publication_20260801.py
          python3 scripts/test_poll_system_v2.py
          python3 scripts/prepare_greenery_publication_20260801.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          article=Path('clanky/sekani-travniku-kadan-spravci-vysky-2026.html').read_text(encoding='utf-8')
          site=Path('site.js').read_text(encoding='utf-8')
          server=Path('newsletter/server.py').read_text(encoding='utf-8')
          prepare=Path('scripts/prepare_greenery_publication_20260801.py').read_text(encoding='utf-8')
          data=json.loads(Path('.github/greenery-publication-bundle.json').read_text(encoding='utf-8'))

          checks={
              'poll_id':'data-poll-id="sekani-travniku-kadan-2026"' in article,
              'versioned_site_js':'/site.js?v=20260801-poll-system-v2' in article,
              'legacy_script_removed':'/api/analytics/pageview' not in article,
              'vote_endpoint':'/api/newsletter/poll/vote' in site,
              'results_endpoint':'/api/newsletter/poll/results' in site,
              'visible_results_heading':'Průběžné výsledky' in site,
              'per_option_counts':'poll-result-value' in site,
              'server_api':'# BEGIN POLL_RESULTS_API' in server,
              'post_pipeline_patch':'POLL_POST_PIPELINE_V2' in prepare,
              'publication_time':data.get('published')=='2026-08-01T11:00:00+02:00',
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Neprošly kontroly: '+', '.join(failed))

          image=Path(data['socialFile'])
          if not image.exists() or image.stat().st_size <= 10_000:
              raise SystemExit(f'Sociální obrázek chybí nebo je malý: {image}')
          with Image.open(image) as im:
              if im.format!='PNG' or im.size!=(1200,630):
                  raise SystemExit(f'Chybný sociální obrázek: {im.format}, {im.size}')
          print('Předletová publikace, databázové hlasování, viditelné výsledky i obrázek jsou v pořádku.')
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat předletový stav
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const ok=process.env.TEST_OUTCOME==='success';
            const path='.github/greenery-poll-v3-preflight-status.json';
            const payload={status:ok?'passed':'failed',checkedAtUtc:new Date().toISOString(),runId:context.runId,sourceSha:context.sha,pollVersion:'20260801-poll-system-v2',scheduledFor:'2026-08-01T11:00:00+02:00',databaseVoteTest:ok,duplicateVoteBlockTest:ok,visibleCountsUiTest:ok,socialImageTest:ok,postNormalizationScriptVersion:ok};
            const content=Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64');let sha;
            try{const cur=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(cur.data))sha=cur.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat předletovou kontrolu článku o sečení: ${payload.status} [skip ci]`,content,...(sha?{sha}:{})});
