name: Předletově otestovat článek o sečení a viditelné hlasování

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/greenery-poll-v3-preflight-trigger.txt'
      - '.github/workflows/validate-greenery-poll-v3.yml'

permissions:
  contents: write

concurrency:
  group: validate-greenery-poll-v3
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sestavit článek a otestovat hlasování bez zveřejnění
        id: test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/install_poll_system_v2.py
          python3 -m py_compile newsletter/server.py scripts/install_poll_system_v2.py scripts/test_poll_system_v2.py scripts/prepare_greenery_publication_20260801.py
          python3 scripts/test_poll_system_v2.py
          python3 scripts/prepare_greenery_publication_20260801.py
          article='clanky/sekani-travniku-kadan-spravci-vysky-2026.html'
          grep -Fq 'data-poll-id="sekani-travniku-kadan-2026"' "$article"
          grep -Fq '/site.js?v=20260801-poll-system-v2' "$article"
          grep -Fq 'Po hlasování se ihned zobrazí aktuální počty hlasů a procenta.' "$article"
          ! grep -Fq '/api/analytics/pageview' "$article"
          grep -Fq '/api/newsletter/poll/vote' site.js
          grep -Fq '/api/newsletter/poll/results' site.js
          grep -Fq 'Průběžné výsledky' site.js
          grep -Fq 'poll-result-value' site.js
          grep -Fq '# BEGIN POLL_RESULTS_API' newsletter/server.py
          test -s .github/greenery-publication-bundle.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          data=json.loads(Path('.github/greenery-publication-bundle.json').read_text(encoding='utf-8'))
          image=Path(data['socialFile'])
          assert image.exists() and image.stat().st_size>10000
          with Image.open(image) as im:
              assert im.format=='PNG' and im.size==(1200,630)
          assert data['published']=='2026-08-01T11:00:00+02:00'
          print('Předletová publikace včetně ankety a obrázku je v pořádku.')
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat předletový stav
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const ok=process.env.TEST_OUTCOME==='success';
            const path='.github/greenery-poll-v3-preflight-status.json';
            const payload={status:ok?'passed':'failed',checkedAtUtc:new Date().toISOString(),runId:context.runId,sourceSha:context.sha,pollVersion:'20260801-poll-system-v2',scheduledFor:'2026-08-01T11:00:00+02:00',databaseVoteTest:ok,duplicateVoteBlockTest:ok,visibleCountsUiTest:ok,socialImageTest:ok};
            const content=Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64');let sha;
            try{const cur=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(cur.data))sha=cur.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat předletovou kontrolu článku o sečení: ${payload.status} [skip ci]`,content,...(sha?{sha}:{})});
