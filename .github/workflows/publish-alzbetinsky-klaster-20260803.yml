name: Zveřejnit článek o alžbětinském klášteře ve 4 ráno

on:
  schedule:
    - cron: '0 2 3 8 *'
    - cron: '12 2 3 8 *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-alzbetinsky-klaster-20260803-primary
  cancel-in-progress: false

env:
  ARTICLE_URL: https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
  ARTICLE_PATH: clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
  SOCIAL_PATH: social/alzbetinsky-klaster-kadan-pacienti-20260803.png
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Povolit pouze 3. srpna 2026
        shell: bash
        run: |
          set -euo pipefail
          test "$(date -u +%Y-%m-%d)" = "2026-08-03" || {
            echo 'Mimo jednorázové publikační datum, končím bez změny.'
            exit 0
          }

      - name: Stáhnout nejnovější hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sestavit článek, sociální obrázek a veřejné přehledy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 -m py_compile scripts/publish_alzbetinsky_klaster_20260803.py
          python3 scripts/publish_alzbetinsky_klaster_20260803.py --validate-source-only
          python3 scripts/publish_alzbetinsky_klaster_20260803.py
          grep -Fq 'Kam odešli poslední pacienti?' "$ARTICLE_PATH"
          grep -Fq 'data-poll-id="alzbetinsky-klaster-kadan-2026"' "$ARTICLE_PATH"
          grep -Fq 'data-promos data-context="sidebar"' "$ARTICLE_PATH"
          grep -Fq 'Léčebna tbc a respiračních nemocí v Kadani' "$ARTICLE_PATH"
          grep -Fq 'data-latest-article-href="/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html"' index.html
          test -s "$SOCIAL_PATH"

      - name: Uložit publikaci do hlavní větve
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – plánovaná publikace kláštera'
          git config user.email 'info@nasekadan.cz'
          git add "$ARTICLE_PATH" "$SOCIAL_PATH" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml
          git commit -m 'Zveřejnit článek o alžbětinském klášteře [skip ci]' || true
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            [[ "$attempt" == 5 ]] && exit 1
            sleep $((attempt * 5))
          done
          git fetch origin main
          git reset --hard origin/main
          test -s "$ARTICLE_PATH"

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
              break
            fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přímo na OVH
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/alzbetinsky-publication.tar.gz" \
            "$ARTICLE_PATH" "$SOCIAL_PATH" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml \
            site.js style.css footer.css mobile.css reklamy.js reklamy-sidebar.js reklamy-sidebar.css \
            reklamy-oprava-obrazku.js obsah-doplnky.js ad-spacing-guard.js analytics.js
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/alzbetinsky-publication.tar.gz" ubuntu@57.129.43.215:/tmp/alzbetinsky-publication.tar.gz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo tar -xzf /tmp/alzbetinsky-publication.tar.gz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/alzbetinsky-publication.tar.gz nasekadan-web:/tmp/alzbetinsky-publication.tar.gz
            sudo docker exec nasekadan-web tar -xzf /tmp/alzbetinsky-publication.tar.gz -C /usr/share/nginx/html
            sudo docker exec nasekadan-web rm -f /tmp/alzbetinsky-publication.tar.gz
          fi
          grep -Fq 'Kam odešli poslední pacienti?' /var/www/nasekadan/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
          grep -Fq '/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html' /var/www/nasekadan/index.html
          rm -f /tmp/alzbetinsky-publication.tar.gz
          REMOTE

      - name: Veřejně ověřit úplnou publikaci
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request
          base='https://nasekadan.cz'
          checks={
            '/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html':[
              'Kam odešli poslední pacienti?',
              'data-poll-id="alzbetinsky-klaster-kadan-2026"',
              'Léčebna tbc a respiračních nemocí v Kadani',
              'data-promos data-context="sidebar"'
            ],
            '/':[
              'data-latest-article-href="/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html"',
              '/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html'
            ],
            '/clanky/':['/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html'],
            '/rss.xml':['https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html'],
            '/sitemap.xml':['https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html'],
            '/news-sitemap.xml':['https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html'],
          }
          for path, markers in checks.items():
            last=''
            for attempt in range(10):
              url=base+path+('?' if '?' not in path else '&')+'alzbetinsky_verify='+str(int(time.time()*1000))
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'NaseKadan-Alzbetinsky-Verify/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=25) as response:
                  last=response.read().decode('utf-8','replace')
                if all(marker in last for marker in markers):
                  break
              except Exception as exc:
                last=str(exc)
              time.sleep(4+attempt*2)
            else:
              raise SystemExit(f'{path}: kontrola selhala: {last[:300]}')
          image=urllib.request.urlopen(base+'/social/alzbetinsky-klaster-kadan-pacienti-20260803.png?verify=1',timeout=25).read()
          if len(image)<10000:
            raise SystemExit('Sociální obrázek je neúplný.')
          poll=urllib.request.urlopen(base+'/api/newsletter/poll/results?poll=alzbetinsky-klaster-kadan-2026&verify=1',timeout=25).read()
          payload=json.loads(poll.decode('utf-8','replace'))
          if payload.get('ok') is not True:
            raise SystemExit('Anketa nevrací platnou odpověď.')
          print('Veřejná publikace článku je úplná včetně ankety.')
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Ověřit skutečné vykreslení článku
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          output="$RUNNER_TEMP/alzbetinsky.dom.html"
          timeout 70s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1440,1400 --virtual-time-budget=12000 --dump-dom \
            "https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html?render=${GITHUB_RUN_ID}" > "$output"
          grep -Fq 'Kam odešli poslední pacienti?' "$output"
          grep -Fq 'poll-results' "$output"
          grep -Fq 'article-aside-adstream' "$output"
          grep -Eq 'article-aside-ad-|promo-card|article-ad-auto' "$output"
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat výsledek do kontrolního issue
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OK: ${{ steps.verify.outputs.ok }}
          BROWSER_OK: ${{ steps.browser.outputs.ok }}
        with:
          script: |
            const issue_number = 545;
            const ok = process.env.VERIFY_OK === 'true' && process.env.BROWSER_OK === 'true';
            const body = ok
              ? '✅ Článek o alžbětinském klášteře byl zveřejněn, je první na titulní straně, v archivu, RSS a obou sitemapách. Ověřeno bylo skutečné vykreslení, reklamy i anketa.\n\nhttps://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html'
              : '❌ Hlavní plánovaná publikace nebyla kompletně ověřena. Nezávislý watchdog provede další opravný pokus.';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number, body});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number, state: 'closed', state_reason: 'completed'});
