name: Přímé nasazení odstávek Autokempu

on:
  push:
    branches: [main]
    paths:
      - '.github/autokemp-direct-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-autokemp-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit přes OVH SSH, ověřit a zapsat stav
        shell: bash
        run: |
          set -u
          STATUS=failed
          REASON='nezahájeno'
          DEPLOY_SHA="$(git rev-parse HEAD)"
          ARTICLE_OK=false
          HOME_OK=false
          ARCHIVE_OK=false
          CULTURE_OK=false
          RSS_OK=false
          SITEMAP_OK=false
          HEALTH_OK=false
          GENERATED="$(date -u +%FT%TZ)"

          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

          if [[ -z "$OVH_KEY" ]]; then
            REASON='chybí secret OVH_SSH_PRIVATE_KEY'
          elif ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          SHA="$(git rev-parse HEAD)"
          MODE=canonical-ovh
          chmod +x deploy/sync-production.sh
          if ! sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh; then
            echo 'Kanonický deploy selhal; používám bezpečný úplný statický fallback.' >&2
            MODE=static-fallback
            sudo install -d -m 0755 /var/www/nasekadan
            sudo find /var/www/nasekadan -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar \
              --exclude='.git' --exclude='.github' --exclude='Dockerfile' \
              --exclude='docker-compose.yml' --exclude='nginx' --exclude='scripts' \
              --exclude='deploy' -C /opt/nasekadan -cf - . \
              | sudo tar -C /var/www/nasekadan -xf -
            printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=%s\n' \
              "$SHA" "$(date -u +%FT%TZ)" "$MODE" \
              | sudo tee /var/www/nasekadan/deployment-health.txt >/dev/null
            sudo chmod -R a+rX /var/www/nasekadan
          fi
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 \
            "https://nasekadan.cz/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html?deploy=$SHA" \
            | grep -Fq 'Odstávky elektřiny omezí v srpnu provoz restaurace'
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 \
            "https://nasekadan.cz/?deploy=$SHA" \
            | grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html'
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 \
            "https://nasekadan.cz/clanky/?deploy=$SHA" \
            | grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html'
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 \
            "https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html?deploy=$SHA" \
            | grep -Fq 'data-autokemp-outages-note'
          REMOTE
          then
            REASON='serverový deploy dokončen, probíhá vnější kontrola'
            stamp="$(date +%s)"
            for attempt in $(seq 1 24); do
              article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html?v=$stamp-$attempt" 2>/dev/null || true)"
              home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=$stamp-$attempt" 2>/dev/null || true)"
              archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=$stamp-$attempt" 2>/dev/null || true)"
              culture="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html?v=$stamp-$attempt" 2>/dev/null || true)"
              rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=$stamp-$attempt" 2>/dev/null || true)"
              sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=$stamp-$attempt" 2>/dev/null || true)"
              health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?v=$stamp-$attempt" 2>/dev/null || true)"

              grep -Fq 'Odstávky elektřiny omezí v srpnu provoz restaurace' <<<"$article" && ARTICLE_OK=true || ARTICLE_OK=false
              grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html' <<<"$home" && HOME_OK=true || HOME_OK=false
              grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html' <<<"$archive" && ARCHIVE_OK=true || ARCHIVE_OK=false
              grep -Fq 'data-autokemp-outages-note' <<<"$culture" && CULTURE_OK=true || CULTURE_OK=false
              grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html' <<<"$rss" && RSS_OK=true || RSS_OK=false
              grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html' <<<"$sitemap" && SITEMAP_OK=true || SITEMAP_OK=false
              grep -Fq "source=$DEPLOY_SHA" <<<"$health" && HEALTH_OK=true || HEALTH_OK=false

              if $ARTICLE_OK && $HOME_OK && $ARCHIVE_OK && $CULTURE_OK && $RSS_OK && $SITEMAP_OK && $HEALTH_OK; then
                STATUS=passed
                REASON='článek, titulní stránka, archiv, kulturní přehled, RSS, sitemap a deployment-health jsou veřejně ověřené'
                break
              fi
              sleep 5
            done
            if [[ "$STATUS" != passed ]]; then
              REASON='serverový deploy proběhl, ale vnější kontrola neprošla ve všech bodech'
            fi
          else
            REASON='SSH deploy nebo vnitřní kontrola na OVH selhala'
          fi

          export STATUS REASON DEPLOY_SHA GENERATED ARTICLE_OK HOME_OK ARCHIVE_OK CULTURE_OK RSS_OK SITEMAP_OK HEALTH_OK
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def b(name): return os.environ.get(name, 'false').lower() == 'true'
          payload = {
              'status': os.environ.get('STATUS', 'failed'),
              'generatedAt': os.environ.get('GENERATED', ''),
              'source': os.environ.get('DEPLOY_SHA', ''),
              'reason': os.environ.get('REASON', ''),
              'checks': {
                  'article': b('ARTICLE_OK'),
                  'homepage': b('HOME_OK'),
                  'archive': b('ARCHIVE_OK'),
                  'culturalOverview': b('CULTURE_OK'),
                  'rss': b('RSS_OK'),
                  'sitemap': b('SITEMAP_OK'),
                  'deploymentHealth': b('HEALTH_OK'),
              },
          }
          Path('.github/autokemp-direct-deploy-status.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          git config user.name 'Naše Kadaň deploy kontrola'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/autokemp-direct-deploy-status.json
          git commit -m "Zapsat výsledek nasazení Autokempu: $STATUS" || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
          done

          [[ "$STATUS" == passed ]]
