name: Přímé nasazení odstávek Autokempu

on:
  push:
    branches: [main]
    paths:
      - '.github/autokemp-direct-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-autokemp-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit aktualizované soubory přímo do aktivního webu
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          SHA="$(git rev-parse HEAD)"
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 index.html /var/www/nasekadan/index.html
          sudo install -m 0644 clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html /var/www/nasekadan/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html
          sudo install -m 0644 clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html /var/www/nasekadan/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          sudo install -m 0644 rss.xml sitemap.xml news-sitemap.xml app.js /var/www/nasekadan/
          for image in social/odstavky-elektriny-autokemp-prunerov-srpen-2026-*.png; do
            test -f "$image"
            sudo install -m 0644 "$image" /var/www/nasekadan/social/
          done
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=targeted-direct\n' "$SHA" "$(date -u +%FT%TZ)" | sudo tee /var/www/nasekadan/deployment-health.txt >/dev/null
          curl -kfsS --max-time 20 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html?deploy=$SHA" | grep -Fq 'Odstávky elektřiny omezí v srpnu provoz restaurace'
          curl -kfsS --max-time 20 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz/?deploy=$SHA" | grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html'
          curl -kfsS --max-time 20 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz/clanky/?deploy=$SHA" | grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html'
          curl -kfsS --max-time 20 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html?deploy=$SHA" | grep -Fq 'data-autokemp-outages-note'
          REMOTE

      - name: Ověřit veřejnou produkci zvenčí
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          for attempt in $(seq 1 12); do
            article="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html?v=$stamp-$attempt" || true)"
            home="$(curl -fsS --max-time 20 "https://nasekadan.cz/?v=$stamp-$attempt" || true)"
            culture="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html?v=$stamp-$attempt" || true)"
            if grep -Fq 'Odstávky elektřiny omezí v srpnu provoz restaurace' <<<"$article" \
              && grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html' <<<"$home" \
              && grep -Fq 'data-autokemp-outages-note' <<<"$culture"; then
              echo 'Veřejná produkce je aktuální.'
              exit 0
            fi
            sleep 5
          done
          exit 1
