name: Přímé nasazení odstávek Autokempu

on:
  push:
    branches: [main]
    paths:
      - '.github/autokemp-direct-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-autokemp-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, ovh, lastminuteslevy]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Kanonicky nasadit a veřejně ověřit
        shell: bash
        run: |
          set -u
          STATUS=failed
          REASON='nezahájeno'
          DEPLOY_SHA=''
          ARTICLE_OK=false
          HOME_OK=false
          ARCHIVE_OK=false
          CULTURE_OK=false
          RSS_OK=false
          SITEMAP_OK=false
          HEALTH_OK=false
          GENERATED="$(date -u +%FT%TZ)"

          if sudo -n true 2>/dev/null \
            && cd /opt/nasekadan \
            && git fetch --prune origin main \
            && git reset --hard origin/main \
            && chmod +x deploy/sync-production.sh \
            && sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh; then
            DEPLOY_SHA="$(git -C /opt/nasekadan rev-parse HEAD)"
            REASON='kanonický serverový deploy dokončen, probíhá vnější kontrola'
            stamp="$(date +%s)"
            for attempt in $(seq 1 18); do
              article="$(curl -kfsS --max-time 25 "https://nasekadan.cz/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html?v=$stamp-$attempt" || true)"
              home="$(curl -kfsS --max-time 25 "https://nasekadan.cz/?v=$stamp-$attempt" || true)"
              archive="$(curl -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=$stamp-$attempt" || true)"
              culture="$(curl -kfsS --max-time 25 "https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html?v=$stamp-$attempt" || true)"
              rss="$(curl -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=$stamp-$attempt" || true)"
              sitemap="$(curl -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=$stamp-$attempt" || true)"
              health="$(curl -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?v=$stamp-$attempt" || true)"

              grep -Fq 'Odstávky elektřiny omezí v srpnu provoz restaurace' <<<"$article" && ARTICLE_OK=true || ARTICLE_OK=false
              grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html' <<<"$home" && HOME_OK=true || HOME_OK=false
              grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html' <<<"$archive" && ARCHIVE_OK=true || ARCHIVE_OK=false
              grep -Fq 'data-autokemp-outages-note' <<<"$culture" && CULTURE_OK=true || CULTURE_OK=false
              grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html' <<<"$rss" && RSS_OK=true || RSS_OK=false
              grep -Fq 'odstavky-elektriny-autokemp-prunerov-srpen-2026.html' <<<"$sitemap" && SITEMAP_OK=true || SITEMAP_OK=false
              grep -Fq "source=$DEPLOY_SHA" <<<"$health" && HEALTH_OK=true || HEALTH_OK=false

              if $ARTICLE_OK && $HOME_OK && $ARCHIVE_OK && $CULTURE_OK && $RSS_OK && $SITEMAP_OK && $HEALTH_OK; then
                STATUS=passed
                REASON='článek, titulní stránka, archiv, kulturní přehled, RSS, sitemap a deployment-health jsou veřejně ověřené'
                break
              fi
              sleep 5
            done
            if [[ "$STATUS" != passed ]]; then
              REASON='kanonický deploy doběhl, ale vnější kontrola neprošla ve všech bodech'
            fi
          else
            REASON='self-hosted kanonický deploy na OVH selhal'
          fi

          cd "$GITHUB_WORKSPACE"
          export STATUS REASON DEPLOY_SHA GENERATED ARTICLE_OK HOME_OK ARCHIVE_OK CULTURE_OK RSS_OK SITEMAP_OK HEALTH_OK
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def b(name): return os.environ.get(name, 'false').lower() == 'true'
          payload = {
              'status': os.environ.get('STATUS', 'failed'),
              'generatedAt': os.environ.get('GENERATED', ''),
              'source': os.environ.get('DEPLOY_SHA', ''),
              'reason': os.environ.get('REASON', ''),
              'checks': {
                  'article': b('ARTICLE_OK'),
                  'homepage': b('HOME_OK'),
                  'archive': b('ARCHIVE_OK'),
                  'culturalOverview': b('CULTURE_OK'),
                  'rss': b('RSS_OK'),
                  'sitemap': b('SITEMAP_OK'),
                  'deploymentHealth': b('HEALTH_OK'),
              },
          }
          Path('.github/autokemp-direct-deploy-status.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          git config user.name 'Naše Kadaň deploy kontrola'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/autokemp-direct-deploy-status.json
          git commit -m "Zapsat výsledek nasazení Autokempu: $STATUS" || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
          done

          [[ "$STATUS" == passed ]]
