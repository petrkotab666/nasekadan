name: Veřejně ověřit opravu archivu a kanonické evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/verify-canonical-archive-trigger.txt'

permissions:
  contents: write

concurrency:
  group: verify-canonical-archive-live-20260803
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Počkat na produkční nasazení a ověřit všechny kanály
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import re
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from html import unescape
          from pathlib import Path

          BASE = 'https://nasekadan.cz'
          DONOR_REL = '/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html'
          DONOR = BASE + DONOR_REL
          FVE = BASE + '/clanky/fve-epr-letiste-bess-kadan-2026.html'
          EXPECTED_MODIFIED = '2026-08-03T12:49:19+02:00'
          REGISTRY_PATH = Path('data/published-content-index.json')
          AUDIT_PATH = Path('.github/canonical-registry-live-audit.json')

          def fetch(path: str) -> str:
              url = BASE + path + ('&' if '?' in path else '?') + 'canonical_audit=' + str(time.time_ns())
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'NaseKadanCanonicalAudit/2.0',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
              })
              with urllib.request.urlopen(request, timeout=35) as response:
                  body = response.read().decode('utf-8', 'replace')
                  if response.status != 200 or not body.strip():
                      raise RuntimeError(f'HTTP {response.status}: {url}')
                  return body

          def html_links(body: str) -> set[str]:
              return {
                  BASE + path
                  for path in re.findall(r'href=["\'](/clanky/[^/"\']+\.html)(?:[?#][^"\']*)?["\']', body, re.I)
              }

          def xml_links(body: str, rss: bool = False) -> set[str]:
              root = ET.fromstring(body)
              if rss:
                  values = [element.text.strip() for element in root.findall('.//item/link') if element.text]
              else:
                  values = [element.text.strip() for element in root.iter() if element.tag.endswith('loc') and element.text]
              return {
                  value.split('#', 1)[0].split('?', 1)[0]
                  for value in values
                  if re.fullmatch(r'https://nasekadan\.cz/clanky/[^/]+\.html(?:[?#].*)?', value)
              }

          def plain_h1(body: str) -> str:
              match = re.search(r'<h1\b[^>]*>(.*?)</h1>', body, re.I | re.S)
              if not match:
                  return ''
              value = re.sub(r'<[^>]+>', ' ', match.group(1))
              return re.sub(r'\s+', ' ', unescape(value)).strip()

          def visible_archive_body(body: str) -> str:
              start_marker = '<section class="archive-list" aria-label="Chronologický přehled článků">'
              start = body.find(start_marker)
              if start < 0:
                  raise RuntimeError('Veřejný archiv nemá očekávaný seznam článků.')
              end = body.find('</section>', start + len(start_marker))
              if end < 0:
                  raise RuntimeError('Veřejný archiv nemá uzavřený seznam článků.')
              return body[start + len(start_marker):end]

          def archive_jsonld(body: str) -> dict:
              for raw in re.findall(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', body, re.I | re.S):
                  try:
                      data = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  graph = data.get('@graph', []) if isinstance(data, dict) else []
                  for node in graph:
                      if isinstance(node, dict) and node.get('@type') == 'ItemList':
                          return node
              raise RuntimeError('Veřejný archiv nemá čitelný JSON-LD ItemList.')

          last_error = None
          snapshot = None
          for attempt in range(48):
              try:
                  home = fetch('/')
                  archive = fetch('/clanky/')
                  rss = fetch('/rss.xml')
                  sitemap = fetch('/sitemap.xml')
                  news = fetch('/news-sitemap.xml')
                  health = fetch('/deployment-health.txt')
                  donor_article = fetch(DONOR_REL)

                  visible = visible_archive_body(archive)
                  if visible.count(f'href="{DONOR_REL}"') != 1:
                      raise RuntimeError('Článek o dárkyni není právě jednou ve viditelném archivu.')
                  if FVE.replace(BASE, '') not in visible:
                      raise RuntimeError('Článek FVE ve viditelném archivu chybí.')
                  if plain_h1(donor_article) != 'Zaregistrovala se v Kadani. O rok později darovala krvetvorné buňky konkrétnímu pacientovi':
                      raise RuntimeError('Veřejný H1 článku o dárkyni nesouhlasí.')
                  if EXPECTED_MODIFIED not in donor_article:
                      raise RuntimeError('Veřejný článek zatím nepodává opravené datum poslední změny.')

                  itemlist = archive_jsonld(archive)
                  jsonld_urls = [item.get('url') for item in itemlist.get('itemListElement', []) if isinstance(item, dict)]
                  if len(jsonld_urls) != 42 or len(set(jsonld_urls)) != 42:
                      raise RuntimeError(f'JSON-LD archivu nemá 42 jedinečných článků: {len(jsonld_urls)}/{len(set(jsonld_urls))}.')
                  if DONOR not in jsonld_urls or FVE not in jsonld_urls:
                      raise RuntimeError('JSON-LD archivu neobsahuje článek o dárkyni nebo FVE.')

                  sets = {
                      'homepage': html_links(home),
                      'archive': html_links(visible),
                      'rss': xml_links(rss, True),
                      'sitemap': xml_links(sitemap),
                      'news_sitemap': xml_links(news),
                  }
                  if len(sets['archive']) != 42 or len(sets['rss']) != 42:
                      raise RuntimeError(f'Archiv/RSS zatím nemají 42 článků: {len(sets["archive"])}/{len(sets["rss"])}.')

                  registry = json.loads(REGISTRY_PATH.read_text(encoding='utf-8'))
                  registered = {item['url'] for item in registry.get('articles', [])}
                  if len(registered) != 42:
                      raise RuntimeError(f'Registr nemá 42 jedinečných URL: {len(registered)}.')
                  if registered != sets['archive'] or registered != sets['rss']:
                      raise RuntimeError('Veřejný archiv nebo RSS se neshodují s registrem.')
                  if not registered <= sets['sitemap']:
                      raise RuntimeError('Hlavní sitemapa neobsahuje všechny registrované články.')
                  if DONOR not in sets['news_sitemap']:
                      raise RuntimeError('Nový článek chybí v news sitemapě.')

                  health_sha = re.search(r'(?m)^source=([0-9a-f]{40})$', health)
                  if not health_sha:
                      raise RuntimeError('deployment-health.txt neobsahuje platný zdrojový commit.')

                  # Ověřit shodu H1 u každého veřejného článku.
                  mismatches = []
                  for item in registry.get('articles', []):
                      path = item['url'].removeprefix(BASE)
                      live_h1 = plain_h1(fetch(path))
                      if live_h1 != item.get('h1'):
                          mismatches.append({'url': item['url'], 'registered_h1': item.get('h1'), 'live_h1': live_h1})
                  if mismatches:
                      raise RuntimeError(f'Rozdílný H1 u {len(mismatches)} článků: {mismatches[:3]}')

                  urls = [item.get('url') for item in registry.get('articles', [])]
                  fingerprints = [item.get('fingerprint') for item in registry.get('articles', [])]
                  duplicate_urls = sorted({url for url in urls if url and urls.count(url) > 1})
                  duplicate_fingerprints = sorted({fp for fp in fingerprints if fp and fingerprints.count(fp) > 1})
                  if duplicate_urls or duplicate_fingerprints:
                      raise RuntimeError('Kanonický registr obsahuje duplicity.')

                  snapshot = {
                      'home': home,
                      'archive': archive,
                      'rss': rss,
                      'sitemap': sitemap,
                      'news': news,
                      'health': health,
                      'sets': sets,
                      'registry': registry,
                      'health_sha': health_sha.group(1),
                      'duplicate_urls': duplicate_urls,
                      'duplicate_fingerprints': duplicate_fingerprints,
                  }
                  break
              except Exception as exc:
                  last_error = repr(exc)
                  time.sleep(15)
          if snapshot is None:
              raise RuntimeError(f'Veřejná oprava nebyla potvrzena v časovém limitu: {last_error}')

          now = dt.datetime.now(dt.timezone.utc).isoformat()
          registry = snapshot['registry']
          for item in registry.get('articles', []):
              url = item['url']
              item['status'] = {key: url in values for key, values in snapshot['sets'].items()}
          validation = registry.setdefault('validation', {})
          validation['homepage_count'] = len(snapshot['sets']['homepage'])
          validation['archive_count'] = len(snapshot['sets']['archive'])
          validation['rss_count'] = len(snapshot['sets']['rss'])
          validation['sitemap_all_articles_present'] = set(item['url'] for item in registry['articles']) <= snapshot['sets']['sitemap']
          validation['news_sitemap_recent_count'] = len(set(item['url'] for item in registry['articles']) & snapshot['sets']['news_sitemap'])
          validation['deployment_health'] = 'verified'
          validation['deployment_health_source'] = snapshot['health_sha']
          validation['required_fields_complete'] = True
          validation['duplicate_urls'] = []
          validation['duplicate_fingerprints'] = []
          validation['per_article_source_commits'] = all(bool(item.get('source_commit')) for item in registry['articles'])
          validation['repair_pending_public_verification'] = False
          validation.pop('repair_reason', None)
          validation['public_audit_at'] = now
          digest_payload = {
              key: sorted(values)
              for key, values in snapshot['sets'].items()
          }
          validation['public_audit_sha256'] = hashlib.sha256(
              json.dumps(digest_payload, ensure_ascii=False, sort_keys=True).encode('utf-8')
          ).hexdigest()
          registry['generated_at'] = now
          registry['article_count'] = len(registry['articles'])
          REGISTRY_PATH.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit = {
              'status': 'success',
              'checked_at': now,
              'article_count': len(registry['articles']),
              'homepage_article_links': len(snapshot['sets']['homepage']),
              'archive_article_links': len(snapshot['sets']['archive']),
              'rss_article_links': len(snapshot['sets']['rss']),
              'sitemap_all_articles_present': validation['sitemap_all_articles_present'],
              'news_sitemap_recent_count': validation['news_sitemap_recent_count'],
              'deployment_health_source': snapshot['health_sha'],
              'donor_visible_archive_occurrences': 1,
              'archive_jsonld_articles': 42,
              'all_h1_match': True,
              'duplicate_urls': [],
              'duplicate_fingerprints': [],
          }
          AUDIT_PATH.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add data/published-content-index.json .github/canonical-registry-live-audit.json
          git rm -f .github/verify-canonical-archive-trigger.txt
          git rm -f .github/workflows/verify-canonical-archive-live-20260803.yml
          git commit -m "Potvrdit veřejnou opravu archivu a kanonické evidence [skip ci]"
          git push origin HEAD:main
