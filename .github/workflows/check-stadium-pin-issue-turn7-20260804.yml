name: Veřejná kontrola připnutí zimního stadionu – issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.event.issue.title == '[check] stadium pin turn7'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Veřejně ověřit titulku, článek, archiv, RSS a počasí
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pin='/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          q="${GITHUB_RUN_ID}-$(date +%s)"
          home="$(curl -4 -kfsSL --retry 4 --retry-delay 4 --max-time 45 "https://nasekadan.cz/?turn7issue=$q")"
          article="$(curl -4 -kfsSL --retry 4 --retry-delay 4 --max-time 45 "https://nasekadan.cz${pin}?turn7issue=$q")"
          archive="$(curl -4 -kfsSL --retry 4 --retry-delay 4 --max-time 45 "https://nasekadan.cz/clanky/?turn7issue=$q")"
          rss="$(curl -4 -kfsSL --retry 4 --retry-delay 4 --max-time 45 "https://nasekadan.cz/rss.xml?turn7issue=$q")"
          forecast="$(curl -4 -kfsSL --retry 4 --retry-delay 4 --max-time 45 "https://nasekadan.cz/api/pocasi-predpoved.json?turn7issue=$q")"
          PIN="$pin" HOME_HTML="$home" ARTICLE_HTML="$article" ARCHIVE_HTML="$archive" RSS_XML="$rss" FORECAST_JSON="$forecast" python3 - <<'PY' > /tmp/result.txt
          import json, os, re
          from xml.etree import ElementTree as ET
          pin=os.environ['PIN']; home=os.environ['HOME_HTML']; article=os.environ['ARTICLE_HTML']
          archive=os.environ['ARCHIVE_HTML']; rss=os.environ['RSS_XML']; forecast=os.environ['FORECAST_JSON']
          hero=re.search(r'<section class="wrap hero" id="clanky".*?</section>', home, re.S)
          assert hero and f'data-latest-article-href="{pin}"' in hero.group(0), 'hero pin missing'
          first_archive=re.search(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="([^"]+)"', archive, re.S)
          assert first_archive, 'first archive item missing'
          latest=first_archive.group(1)
          assert latest != pin, 'archive was incorrectly pinned'
          aside=re.search(r'<aside class="current-aside">.*?</aside>', hero.group(0), re.S)
          assert aside and f'href="{latest}"' in aside.group(0), 'sidebar is not latest chronological article'
          assert '/pocasi.js' in home, 'weather loader missing'
          assert 'article:published_time" content="2026-08-03T22:05:00+02:00"' in article, 'original article date changed'
          root=ET.fromstring(rss)
          rss_first=root.findtext('./channel/item/link')
          assert rss_first == 'https://nasekadan.cz'+latest, 'RSS chronology mismatch'
          data=json.loads(forecast)
          timeseries=data.get('properties',{}).get('timeseries')
          assert isinstance(timeseries,list) and timeseries, 'weather forecast timeseries missing'
          print(json.dumps({'latest':latest,'rss_first':rss_first,'weather_points':len(timeseries)},ensure_ascii=False))
          PY

      - name: Zapsat výsledek kontroly
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERIFY_OUTCOME" == "success" ]]; then
            result="$(cat /tmp/result.txt)"
            gh issue comment "$ISSUE_NUMBER" --repo petrkotab666/nasekadan --body "SUCCESS run=$RUN_ID $result"
            gh issue close "$ISSUE_NUMBER" --repo petrkotab666/nasekadan --reason completed
          else
            gh issue comment "$ISSUE_NUMBER" --repo petrkotab666/nasekadan --body "FAILURE run=$RUN_ID: veřejná kontrola připnutí, chronologie nebo počasí neprošla."
            exit 1
          fi
