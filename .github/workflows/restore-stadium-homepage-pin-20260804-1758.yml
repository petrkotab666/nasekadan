name: Obnovit připnutí článku o zimním stadionu

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: restore-stadium-homepage-pin-20260804
  cancel-in-progress: false

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'petrkotab666' && github.event.issue.title == '[repair] Připnout zimní stadion na titulku')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      PIN_REL: /clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html
    steps:
      - name: Zapsat spuštění
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Obnova připnutí byla spuštěna. GitHub Actions run: ${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Opravit generátor a připnout článek pouze na titulce
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/apply_stadium_homepage_pin.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/enforce_article_visibility.py
          if ! git diff --cached --quiet; then
            git commit -m 'Obnovit dočasné připnutí článku o zimním stadionu'
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Nasadit pouze titulní stránku na OVH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 index.html ubuntu@57.129.43.215:/tmp/nasekadan-pinned-index.html
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/nasekadan-pinned-index.html
          sudo install -m 0644 "$src" /var/www/nasekadan/index.html
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp "$src" nasekadan-web:/usr/share/nginx/html/index.html
          fi
          rm -f "$src"
          REMOTE

      - name: Veřejně ověřit titulku a počasí
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          base=https://nasekadan.cz
          q="${GITHUB_RUN_ID}-$(date +%s)"
          home="$(curl -4 -kfsS -L --max-time 35 "$base/?v=$q")"
          grep -Fq "<section class=\"wrap hero\" id=\"clanky\" data-auto-latest-hero=\"1\" data-latest-article-href=\"$PIN_REL\">" <<<"$home"
          aside="$(sed -n '/<aside class="current-aside">/,/<\/aside>/p' <<<"$home")"
          grep -Fq 'Kadaň otevřela zimní stadion lidem před vedrem' <<<"$home"
          grep -Fq '/clanky/nemocnice-kadan-kriticky-nedostatek-krve-0-rh-minus-2026.html' <<<"$aside"
          grep -Fq '/pocasi.js' <<<"$home"
          curl -4 -kfsS -L --max-time 35 "$base/api/pocasi-predpoved.json?v=$q" | python3 -m json.tool >/dev/null

      - name: Uzavřít požadavek
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Připnutí bylo obnoveno a veřejně ověřeno. Run ${context.runId}, zdrojový commit ${{ steps.patch.outputs.source_sha }}.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Zapsat selhání
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Obnova připnutí selhala. GitHub Actions run: ${context.runId}.`
            });
