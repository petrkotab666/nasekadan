name: Ověřit veřejnou evidenci a neveřejnou rešerši

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-content-index.yml'

permissions:
  contents: write

concurrency:
  group: verify-public-content-index
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Načíst živý web bez cache
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          mkdir -p /tmp/nk-audit
          curl -fsSL --retry 3 --connect-timeout 15 "https://nasekadan.cz/?audit=$stamp" -o /tmp/nk-audit/home.html
          curl -fsSL --retry 3 --connect-timeout 15 "https://nasekadan.cz/clanky/?audit=$stamp" -o /tmp/nk-audit/archive.html
          curl -fsSL --retry 3 --connect-timeout 15 "https://nasekadan.cz/rss.xml?audit=$stamp" -o /tmp/nk-audit/rss.xml
          curl -fsSL --retry 3 --connect-timeout 15 "https://nasekadan.cz/sitemap.xml?audit=$stamp" -o /tmp/nk-audit/sitemap.xml
          curl -fsSL --retry 3 --connect-timeout 15 "https://nasekadan.cz/news-sitemap.xml?audit=$stamp" -o /tmp/nk-audit/news.xml
          curl -fsSL --retry 3 --connect-timeout 15 "https://nasekadan.cz/deployment-health.txt?audit=$stamp" -o /tmp/nk-audit/health.txt
          curl -fsSL --retry 3 --connect-timeout 15 "https://nasekadan.cz/research/nemocnice-kadan-neindexovane-20260730/uver-vsechny-zaznamy/vysledky.html?audit=$stamp" -o /tmp/nk-audit/research.html

      - name: Vyhodnotit veřejný stav
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, re

          root = Path('/tmp/nk-audit')
          home = (root/'home.html').read_text(encoding='utf-8', errors='replace')
          archive = (root/'archive.html').read_text(encoding='utf-8', errors='replace')
          rss = (root/'rss.xml').read_text(encoding='utf-8', errors='replace')
          sitemap = (root/'sitemap.xml').read_text(encoding='utf-8', errors='replace')
          news = (root/'news.xml').read_text(encoding='utf-8', errors='replace')
          health = (root/'health.txt').read_text(encoding='utf-8', errors='replace').strip()
          research = (root/'research.html').read_text(encoding='utf-8', errors='replace')

          pattern = r'https://nasekadan\.cz/clanky/[^<"\s?]+\.html'
          sitemap_articles = sorted(set(re.findall(pattern, sitemap)))
          rss_articles = sorted(set(re.findall(pattern, rss)))
          archive_articles = sorted(set('https://nasekadan.cz' + x for x in re.findall(r'href=["\'](/clanky/[^"\'?]+\.html)', archive)))
          home_articles = sorted(set('https://nasekadan.cz' + x for x in re.findall(r'href=["\'](/clanky/[^"\'?]+\.html)', home)))
          news_articles = sorted(set(re.findall(pattern, news)))

          result = {
            'generated_at': datetime.now(timezone.utc).isoformat(),
            'public_source': 'https://nasekadan.cz/',
            'homepage_article_count': len(home_articles),
            'archive_article_count': len(archive_articles),
            'rss_article_count': len(rss_articles),
            'sitemap_article_count': len(sitemap_articles),
            'news_sitemap_article_count': len(news_articles),
            'sitemap_contains_research': '/research/' in sitemap,
            'research_has_noindex': bool(re.search(r'<meta\b(?=[^>]*name=["\']robots["\'])(?=[^>]*content=["\'][^"\']*noindex)', research, re.I)),
            'all_40_articles_in_archive_rss_sitemap': len(archive_articles) == len(rss_articles) == len(sitemap_articles) == 40 and set(archive_articles) == set(rss_articles) == set(sitemap_articles),
            'deployment_health_nonempty': bool(health),
            'deployment_health_excerpt': health[:500],
          }
          assert not result['sitemap_contains_research'], result
          assert result['research_has_noindex'], result
          assert result['all_40_articles_in_archive_rss_sitemap'], result
          assert result['deployment_health_nonempty'], result
          Path('.github/public-content-audit-latest.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Uložit výsledek a odstranit jednorázový workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nasekadan-bot"
          git config user.email "nasekadan-bot@users.noreply.github.com"
          git rm .github/workflows/verify-public-content-index.yml
          git add .github/public-content-audit-latest.json
          git commit -m "Ověřit veřejnou evidenci po opravě indexace"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 5
          done
          exit 1
