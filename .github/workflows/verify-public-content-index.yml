name: Ověřit veřejnou evidenci po nasazení

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-content-index.yml'

permissions:
  contents: write

concurrency:
  group: verify-public-content-index
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Načíst a vyhodnotit živý web
        shell: bash
        run: |
          set -u
          stamp=$(date +%s)
          mkdir -p /tmp/nk-audit
          for spec in \
            "home.html|https://nasekadan.cz/?audit=$stamp" \
            "archive.html|https://nasekadan.cz/clanky/?audit=$stamp" \
            "rss.xml|https://nasekadan.cz/rss.xml?audit=$stamp" \
            "sitemap.xml|https://nasekadan.cz/sitemap.xml?audit=$stamp" \
            "news.xml|https://nasekadan.cz/news-sitemap.xml?audit=$stamp" \
            "health.txt|https://nasekadan.cz/deployment-health.txt?audit=$stamp" \
            "research.html|https://nasekadan.cz/research/nemocnice-kadan-neindexovane-20260730/uver-vsechny-zaznamy/vysledky.html?audit=$stamp"; do
            file=${spec%%|*}; url=${spec#*|}
            curl -sSL --retry 2 --connect-timeout 15 --max-time 45 "$url" -o "/tmp/nk-audit/$file" || :
          done
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, re
          root = Path('/tmp/nk-audit')
          def read(n):
              p=root/n
              return p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          home,archive,rss,sitemap,news,health,research=[read(n) for n in ('home.html','archive.html','rss.xml','sitemap.xml','news.xml','health.txt','research.html')]
          pattern=r'https://nasekadan\.cz/clanky/[^<"\s?]+\.html'
          sa=sorted(set(re.findall(pattern,sitemap)))
          ra=sorted(set(re.findall(pattern,rss)))
          aa=sorted(set('https://nasekadan.cz'+x for x in re.findall(r'href=["\'](/clanky/[^"\'?]+\.html)',archive)))
          ha=sorted(set('https://nasekadan.cz'+x for x in re.findall(r'href=["\'](/clanky/[^"\'?]+\.html)',home)))
          na=sorted(set(re.findall(pattern,news)))
          result={
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'homepage_article_count':len(ha),'archive_article_count':len(aa),'rss_article_count':len(ra),'sitemap_article_count':len(sa),'news_sitemap_article_count':len(na),
            'sitemap_contains_research':'/research/' in sitemap,
            'sitemap_contains_parts':'/clanky/parts/' in sitemap,
            'research_has_noindex':bool(re.search(r'<meta\b(?=[^>]*name=["\']robots["\'])(?=[^>]*content=["\'][^"\']*noindex)',research,re.I)),
            'archive_rss_sitemap_same_40':len(aa)==len(ra)==len(sa)==40 and set(aa)==set(ra)==set(sa),
            'deployment_health_nonempty':bool(health.strip()),
            'deployment_health_excerpt':health.strip()[:500],
            'research_bytes':len(research.encode()),'sitemap_bytes':len(sitemap.encode())}
          Path('.github/public-content-audit-latest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Uložit výsledek a uklidit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nasekadan-bot"
          git config user.email "nasekadan-bot@users.noreply.github.com"
          git rm .github/workflows/verify-public-content-index.yml
          git add .github/public-content-audit-latest.json
          git commit -m "Zapsat veřejný audit po kanonickém nasazení"
          for attempt in 1 2 3; do git pull --rebase origin main; git push && exit 0; sleep 5; done
          exit 1
