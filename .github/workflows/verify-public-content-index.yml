name: Ověřit veřejnou evidenci a neveřejnou rešerši

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-content-index.yml'

permissions:
  contents: write

concurrency:
  group: verify-public-content-index
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Načíst živý web bez cache
        shell: bash
        run: |
          set -u
          stamp=$(date +%s)
          mkdir -p /tmp/nk-audit
          for spec in \
            "home.html|https://nasekadan.cz/?audit=$stamp" \
            "archive.html|https://nasekadan.cz/clanky/?audit=$stamp" \
            "rss.xml|https://nasekadan.cz/rss.xml?audit=$stamp" \
            "sitemap.xml|https://nasekadan.cz/sitemap.xml?audit=$stamp" \
            "news.xml|https://nasekadan.cz/news-sitemap.xml?audit=$stamp" \
            "health.txt|https://nasekadan.cz/deployment-health.txt?audit=$stamp" \
            "research.html|https://nasekadan.cz/research/nemocnice-kadan-neindexovane-20260730/uver-vsechny-zaznamy/vysledky.html?audit=$stamp"; do
            file=${spec%%|*}
            url=${spec#*|}
            curl -sSL --retry 2 --connect-timeout 15 --max-time 45 "$url" -o "/tmp/nk-audit/$file" || :
          done

      - name: Vyhodnotit veřejný stav
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, re

          root = Path('/tmp/nk-audit')
          def read(name):
              path = root / name
              return path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''

          home = read('home.html')
          archive = read('archive.html')
          rss = read('rss.xml')
          sitemap = read('sitemap.xml')
          news = read('news.xml')
          health = read('health.txt').strip()
          research = read('research.html')
          pattern = r'https://nasekadan\.cz/clanky/[^<"\s?]+\.html'
          sitemap_articles = sorted(set(re.findall(pattern, sitemap)))
          rss_articles = sorted(set(re.findall(pattern, rss)))
          archive_articles = sorted(set('https://nasekadan.cz' + x for x in re.findall(r'href=["\'](/clanky/[^"\'?]+\.html)', archive)))
          home_articles = sorted(set('https://nasekadan.cz' + x for x in re.findall(r'href=["\'](/clanky/[^"\'?]+\.html)', home)))
          news_articles = sorted(set(re.findall(pattern, news)))
          result = {
            'generated_at': datetime.now(timezone.utc).isoformat(),
            'homepage_article_count': len(home_articles),
            'archive_article_count': len(archive_articles),
            'rss_article_count': len(rss_articles),
            'sitemap_article_count': len(sitemap_articles),
            'news_sitemap_article_count': len(news_articles),
            'sitemap_contains_research': '/research/' in sitemap,
            'research_has_noindex': bool(re.search(r'<meta\b(?=[^>]*name=["\']robots["\'])(?=[^>]*content=["\'][^"\']*noindex)', research, re.I)),
            'archive_rss_sitemap_same_40': len(archive_articles) == len(rss_articles) == len(sitemap_articles) == 40 and set(archive_articles) == set(rss_articles) == set(sitemap_articles),
            'deployment_health_nonempty': bool(health),
            'deployment_health_excerpt': health[:500],
            'research_bytes': len(research.encode('utf-8')),
            'sitemap_bytes': len(sitemap.encode('utf-8')),
          }
          Path('.github/public-content-audit-latest.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Uložit výsledek a odstranit jednorázový workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nasekadan-bot"
          git config user.email "nasekadan-bot@users.noreply.github.com"
          git rm .github/workflows/verify-public-content-index.yml
          git add .github/public-content-audit-latest.json
          git commit -m "Zapsat veřejný audit evidence po opravě indexace"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 5
          done
          exit 1
