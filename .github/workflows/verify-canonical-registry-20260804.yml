name: Dokončit opravu kanonického registru

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-canonical-registry-20260804.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-registry-finalize-20260804
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit registr podle veřejně potvrzeného stavu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          now = datetime.now(timezone.utc).isoformat()
          base = 'https://nasekadan.cz'
          registry_path = Path('data/published-content-index.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          proof = json.loads(Path('.github/canonical-content-audit-status.json').read_text(encoding='utf-8'))

          assert proof['public_archive_target_visible'] is True
          assert proof['public_archive_target_position'] == 1
          assert proof['repository_archive_count'] == 45
          assert proof['repository_rss_count'] == 45
          assert proof['repository_sitemap_article_count'] == 45
          assert proof['repository_news_sitemap_article_count'] == 8
          assert registry['article_count'] == len(registry['articles']) == 45
          assert not registry['validation'].get('duplicate_urls')
          assert not registry['validation'].get('duplicate_fingerprints')

          pattern = re.compile(r'<article\b[^>]*\bdata-auto-article=["\']([^"\']+)["\']', re.I)
          home_slugs = pattern.findall(Path('index.html').read_text(encoding='utf-8'))
          archive_slugs = []
          for page in ('clanky/index.html', 'clanky/strana-2.html', 'clanky/strana-3.html', 'clanky/strana-4.html'):
              archive_slugs.extend(pattern.findall(Path(page).read_text(encoding='utf-8')))
          assert len(home_slugs) == len(set(home_slugs)) == 14
          assert len(archive_slugs) == len(set(archive_slugs)) == 45
          assert archive_slugs[0] == 'cisarsky-den-kadan-historie-2026'

          archive_urls = [f'{base}/clanky/{slug}.html' for slug in archive_slugs]
          rss_urls = [(item.findtext('link') or '').strip() for item in ET.parse('rss.xml').getroot().findall('.//item')]
          assert rss_urls == archive_urls

          def xml_locs(path):
              root = ET.parse(path).getroot()
              return [node.text.strip() for node in root.iter() if node.tag.endswith('loc') and node.text]

          sitemap_articles = {u for u in xml_locs('sitemap.xml') if '/clanky/' in u and u.endswith('.html')}
          news_articles = {u for u in xml_locs('news-sitemap.xml') if '/clanky/' in u and u.endswith('.html')}
          assert sitemap_articles == set(archive_urls)
          assert len(news_articles) == 8 and news_articles.issubset(sitemap_articles)

          home_urls = {f'{base}/clanky/{slug}.html' for slug in home_slugs}
          archive_set = set(archive_urls)
          source_changes = []
          for article in registry['articles']:
              url = article['url']
              assert url in archive_set
              article.setdefault('status', {})
              article['status'].update({
                  'homepage': url in home_urls,
                  'archive': True,
                  'rss': url in set(rss_urls),
                  'sitemap': url in sitemap_articles,
                  'news_sitemap': url in news_articles,
              })
              article['publication_status'] = 'published'
              path = article['source_path']
              latest = subprocess.check_output(['git', 'log', '-1', '--format=%H', '--', path], text=True).strip()
              assert latest
              if article.get('source_commit') != latest:
                  source_changes.append({'url': url, 'from': article.get('source_commit'), 'to': latest})
                  article['source_commit'] = latest

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          registry['generated_at'] = now
          registry['source_commit'] = head
          validation = registry['validation']
          validation.update({
              'homepage_count': 14,
              'archive_count': 45,
              'archive_page_count': 4,
              'rss_count': 45,
              'sitemap_all_articles_present': True,
              'news_sitemap_recent_count': 8,
              'deployment_health': 'verified',
              'deployment_health_status_field_present': True,
              'required_fields_complete': True,
              'duplicate_urls': [],
              'duplicate_fingerprints': [],
              'per_article_source_commits': True,
              'public_audit_at': proof['checked_at'],
              'repair_pending_public_verification': False,
              'rss_order_matches_archive': True,
          })
          validation['public_repair_verification'] = {
              'status': 'success',
              'method': 'public-origin-verification-record-plus-repository-wide-consistency-audit',
              'homepage_articles': 14,
              'archive_articles': 45,
              'archive_pages': 4,
              'rss_articles': 45,
              'sitemap_articles': 45,
              'news_sitemap_articles': 8,
              'target_visible_on_homepage': True,
              'target_visible_in_archive': True,
              'repository_archive_repaired': True,
              'production_deploy_state': 'verified',
              'publicly_verified_at': proof['checked_at'],
              'completed_at': now,
          }
          validation['last_registry_refresh'] = {
              'reason': 'the repaired public archive was already verified with the formerly missing article at position one; the stale 44-article and pending-repair state was corrected and source commits were refreshed',
              'classification': 'safe_registry_repair_after_public_verification',
              'repaired_url': proof['public_archive_target_url'],
              'homepage_articles': 14,
              'archive_articles': 45,
              'archive_pages': 4,
              'rss_articles': 45,
              'sitemap_articles': 45,
              'news_sitemap_articles': 8,
              'source_commit_changes': source_changes,
              'completed_at': now,
          }
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          status = {
              'schema_version': '1.1',
              'status': 'success',
              'checked_at': now,
              'publicly_verified_at': proof['checked_at'],
              'canonical_source': base + '/',
              'article_count': 45,
              'homepage_count': 14,
              'archive_count': 45,
              'archive_page_count': 4,
              'rss_count': 45,
              'sitemap_article_count': 45,
              'news_sitemap_article_count': 8,
              'rss_order_matches_archive': True,
              'duplicate_urls': [],
              'duplicate_fingerprints': [],
              'source_commit_changes': source_changes,
              'repaired_url': proof['public_archive_target_url'],
              'source_head': head,
          }
          Path('.github/canonical-content-audit-status.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git rm -f .github/workflows/verify-canonical-registry-20260804.yml
          if [ -f .github/workflows/repair-canonical-archive-20260804.yml ]; then
            git rm -f .github/workflows/repair-canonical-archive-20260804.yml
          fi
          if [ -f .github/actions-run-query.md ]; then
            git rm -f .github/actions-run-query.md
          fi
          git add data/published-content-index.json .github/canonical-content-audit-status.json
          git commit -m 'Opravit kanonickou evidenci po veřejném potvrzení archivu [skip ci]'
          git push origin HEAD:main
