name: Spustit nasazení srpnových galerií z PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/august-galleries-deploy-trigger.txt'

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.title, 'Deploy srpnové galerie')
    runs-on: ubuntu-latest
    steps:
      - name: Spustit ostré nasazení
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-august-galleries-direct.yml',
              ref: 'main'
            });
            core.notice('Ostré nasazení srpnového programu galerií bylo spuštěno přes workflow_dispatch.');
