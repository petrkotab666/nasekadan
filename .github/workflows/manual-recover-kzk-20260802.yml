name: Okamžitě obnovit publikaci KZK

on:
  push:
    branches: [main]
    paths:
      - .github/kzk-manual-recovery-20260802.txt
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: manual-recover-kzk-20260802
  cancel-in-progress: false

env:
  ARTICLE_URL: https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sestavit článek a všechny veřejné plochy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 -m py_compile scripts/publish_kzk_20260802.py scripts/ensure_recent_home_articles_20260801.py
          python3 scripts/publish_kzk_20260802.py
          f=clanky/kulturni-zarizeni-kadan.html
          grep -Fq 'Od Střelnice po klášter' "$f"
          grep -Fq 'id="konirna"' "$f"
          grep -Fq 'data-promos data-context="sidebar"' "$f"
          grep -Fq '/clanky/kulturni-zarizeni-kadan.html' index.html
          grep -Fq '/clanky/kulturni-zarizeni-kadan.html' clanky/index.html
          grep -Fq 'https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html' rss.xml
          grep -Fq 'https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html' sitemap.xml
          grep -Fq 'https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html' news-sitemap.xml

      - name: Uložit publikaci do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – nouzová obnova KZK'
          git config user.email 'info@nasekadan.cz'
          git add clanky/kulturni-zarizeni-kadan.html social/kulturni-zarizeni-kadan-20260802.png index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml scripts/ensure_recent_home_articles_20260801.py
          git commit -m 'Nouzově obnovit publikaci článku KZK' || true
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            [[ "$attempt" == 5 ]] && exit 1
            sleep $((attempt * 5))
          done
          git fetch origin main
          git reset --hard origin/main

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
              break
            fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přímo na OVH
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/kzk-manual-recovery.tar.gz" \
            clanky/kulturni-zarizeni-kadan.html social/kulturni-zarizeni-kadan-20260802.png \
            index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml \
            site.js style.css footer.css mobile.css reklamy.js reklamy-sidebar.js reklamy-sidebar.css \
            reklamy-oprava-obrazku.js obsah-doplnky.js ad-spacing-guard.js analytics.js
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/kzk-manual-recovery.tar.gz" ubuntu@57.129.43.215:/tmp/kzk-manual-recovery.tar.gz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo tar -xzf /tmp/kzk-manual-recovery.tar.gz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/kzk-manual-recovery.tar.gz nasekadan-web:/tmp/kzk-manual-recovery.tar.gz
            sudo docker exec nasekadan-web tar -xzf /tmp/kzk-manual-recovery.tar.gz -C /usr/share/nginx/html
            sudo docker exec nasekadan-web rm -f /tmp/kzk-manual-recovery.tar.gz
          fi
          grep -Fq 'Od Střelnice po klášter' /var/www/nasekadan/clanky/kulturni-zarizeni-kadan.html
          grep -Fq '/clanky/kulturni-zarizeni-kadan.html' /var/www/nasekadan/index.html
          rm -f /tmp/kzk-manual-recovery.tar.gz
          REMOTE

      - name: Veřejně ověřit článek, pořadí a indexy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time, urllib.request
          base='https://nasekadan.cz'
          checks={
            '/clanky/kulturni-zarizeni-kadan.html':['Od Střelnice po klášter','id="konirna"','data-promos data-context="sidebar"'],
            '/':['Od Střelnice po klášter','data-latest-article-href="/clanky/kulturni-zarizeni-kadan.html"'],
            '/clanky/':['/clanky/kulturni-zarizeni-kadan.html'],
            '/rss.xml':['https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html'],
            '/sitemap.xml':['https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html'],
            '/news-sitemap.xml':['https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html'],
          }
          for path, markers in checks.items():
            last=''
            for attempt in range(10):
              url=base+path+('?' if '?' not in path else '&')+'manual_kzk='+str(int(time.time()*1000))
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'NaseKadan-KZK-Manual-Recovery/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=25) as response:
                  last=response.read().decode('utf-8','replace')
                if all(marker in last for marker in markers): break
              except Exception as exc:
                last=str(exc)
              time.sleep(4+attempt*2)
            else:
              raise SystemExit(f'{path}: veřejná kontrola selhala: {last[:500]}')
          print('Veřejné plochy KZK jsou v pořádku.')
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Ověřit skutečně vykreslené reklamy
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          output="$RUNNER_TEMP/kzk-rendered.dom.html"
          timeout 75s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1440,1400 --virtual-time-budget=12000 --dump-dom \
            "https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html?render=${GITHUB_RUN_ID}" > "$output"
          grep -Fq 'Od Střelnice po klášter' "$output"
          grep -Fq 'article-aside-adstream' "$output"
          grep -Eq 'article-aside-ad-|promo-card|article-ad-auto' "$output"
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat výsledek do issue 507
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OK: ${{ steps.verify.outputs.ok }}
          BROWSER_OK: ${{ steps.browser.outputs.ok }}
        with:
          script: |
            const issue_number = 507;
            const ok = process.env.VERIFY_OK === 'true' && process.env.BROWSER_OK === 'true';
            const body = ok
              ? '✅ Nouzová obnova dokončena. Článek KZK je veřejný, první na titulní straně, první v archivu, je v RSS, sitemap.xml a news-sitemap.xml a reklamy byly ověřeny ve vykresleném DOM.\n\nhttps://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html'
              : '🚨 Nouzová obnova publikace KZK neprošla kompletní veřejnou kontrolou. Zkontrolujte kroky workflow „Okamžitě obnovit publikaci KZK“.';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number, body});
            if (ok) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number, state: 'closed', state_reason: 'completed'});
            }
