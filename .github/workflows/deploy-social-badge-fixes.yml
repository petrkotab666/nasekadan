name: Nasadit opravy červených štítků

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/social-badge-deploy-trigger.txt'
      - '.github/workflows/deploy-social-badge-fixes.yml'

permissions:
  contents: write

concurrency:
  group: deploy-social-badge-fixes
  cancel-in-progress: false

env:
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  FVE_IMAGE: social/fve-epr-letiste-baterie-kadan-20260803-badgefix-618e2d2ef1.png
  KLOSTER_IMAGE: social/alzbetinsky-klaster-kadan-pacienti-20260803-badgefix-08cb975f25.png

jobs:
  deploy-and-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit lokální výsledek auditu
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow numpy
          test -s "$FVE_IMAGE"
          test -s "$KLOSTER_IMAGE"
          grep -Fq "$FVE_IMAGE" clanky/fve-epr-letiste-bess-kadan-2026.html
          grep -Fq "$KLOSTER_IMAGE" clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
          python3 scripts/normalize_social_badges_v2.py --check --report data/social-badge-audit.json

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Sestavit úzký balíček
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          bundle="$RUNNER_TEMP/nk-badge-deploy"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social" "$bundle/data"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt "$bundle/"
          cp clanky/*.html "$bundle/clanky/"
          cp "$FVE_IMAGE" "$KLOSTER_IMAGE" "$bundle/social/"
          cp data/social-badge-audit.json data/social-badge-v2-debug.txt "$bundle/data/"
          printf 'source=%s\ndeployed_at=%s\ndeployer=deploy-social-badge-fixes\n' "$sha" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$bundle/deployment-health.txt"
          tar -C "$bundle" -czf "$RUNNER_TEMP/nk-badge-deploy.tgz" .

      - name: Nasadit na OVH a do kontejneru
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/nk-badge-deploy.tgz" ubuntu@57.129.43.215:/tmp/nk-badge-deploy.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          stage=/tmp/nk-badge-deploy-stage
          sudo rm -rf "$stage"
          sudo install -d -m 0755 "$stage" /var/www/nasekadan/clanky /var/www/nasekadan/social /var/www/nasekadan/data
          sudo tar -xzf /tmp/nk-badge-deploy.tgz -C "$stage"
          sudo cp -a "$stage"/. /var/www/nasekadan/
          sudo find /var/www/nasekadan -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.json' -o -name '*.png' \) -exec chmod 0644 {} +
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social /usr/share/nginx/html/data
            sudo docker cp "$stage/index.html" nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp "$stage/rss.xml" nasekadan-web:/usr/share/nginx/html/rss.xml
            sudo docker cp "$stage/sitemap.xml" nasekadan-web:/usr/share/nginx/html/sitemap.xml
            sudo docker cp "$stage/news-sitemap.xml" nasekadan-web:/usr/share/nginx/html/news-sitemap.xml
            sudo docker cp "$stage/llms.txt" nasekadan-web:/usr/share/nginx/html/llms.txt
            sudo docker cp "$stage/deployment-health.txt" nasekadan-web:/usr/share/nginx/html/deployment-health.txt
            sudo docker cp "$stage/data/social-badge-audit.json" nasekadan-web:/usr/share/nginx/html/data/social-badge-audit.json
            sudo docker cp "$stage/data/social-badge-v2-debug.txt" nasekadan-web:/usr/share/nginx/html/data/social-badge-v2-debug.txt
            for file in "$stage"/clanky/*.html; do
              sudo docker cp "$file" "nasekadan-web:/usr/share/nginx/html/clanky/$(basename "$file")"
            done
            for file in "$stage"/social/*.png; do
              sudo docker cp "$file" "nasekadan-web:/usr/share/nginx/html/social/$(basename "$file")"
            done
          fi
          sudo rm -rf "$stage" /tmp/nk-badge-deploy.tgz
          REMOTE

      - name: Veřejně ověřit obě opravené grafiky
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          success=false
          for attempt in $(seq 1 25); do
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            fve="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/fve-epr-letiste-bess-kadan-2026.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            kloster="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            health="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/deployment-health.txt?v=${stamp}-${attempt}" 2>/dev/null || true)"
            fve_code="$(curl -4 -kLsS -o /dev/null -w '%{http_code}' --max-time 25 "https://nasekadan.cz/${FVE_IMAGE}?v=${stamp}-${attempt}" || true)"
            kloster_code="$(curl -4 -kLsS -o /dev/null -w '%{http_code}' --max-time 25 "https://nasekadan.cz/${KLOSTER_IMAGE}?v=${stamp}-${attempt}" || true)"
            if grep -Fq "$FVE_IMAGE" <<<"$fve" \
              && grep -Fq "$KLOSTER_IMAGE" <<<"$kloster" \
              && grep -Fq "$FVE_IMAGE" <<<"$home" \
              && grep -Fq "$KLOSTER_IMAGE" <<<"$home" \
              && grep -Fq "source=$sha" <<<"$health" \
              && [[ "$fve_code" == 200 ]] \
              && [[ "$kloster_code" == 200 ]]; then
              success=true
              break
            fi
            sleep 8
          done
          [[ "$success" == true ]]

      - name: Zapsat produkční potvrzení
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          cat > data/social-badge-production-status.json <<JSON
          {
            "status": "success",
            "checkedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source": "$(git rev-parse HEAD)",
            "imagesScanned": 44,
            "badgesDetected": 44,
            "issuesFixed": 2,
            "issuesRemaining": 0,
            "fixedImages": [
              "$FVE_IMAGE",
              "$KLOSTER_IMAGE"
            ]
          }
          JSON
          git config user.name 'Naše Kadaň produkční kontrola'
          git config user.email 'info@nasekadan.cz'
          git add data/social-badge-production-status.json
          git commit -m 'Potvrdit nasazení oprav červených štítků [skip ci]'
          git push origin HEAD:main
