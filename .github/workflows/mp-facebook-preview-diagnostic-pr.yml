name: PR diagnostika Facebook náhledu MP

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: nasekadan-mp-facebook-preview-diagnostic-v3
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.title == '[RUN] MP Facebook preview repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
      FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 1 Kandidát
        id: candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import refresh_facebook_previews_on_change as r
          p='clanky/mestska-policie-kadan-fakta-diskuse-2026.html'
          rows=r.detect_candidates(set(),[p])
          print('CANDIDATES='+str(len(rows)))
          assert len(rows)==1, rows
          assert rows[0]['article_path']==p
          print('CANDIDATE_OK=1')
          PY

      - name: 2 Přesný živý web
        id: live
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import refresh_facebook_previews_on_change as r
          import publish_facebook
          p='clanky/mestska-policie-kadan-fakta-diskuse-2026.html'
          a=publish_facebook.parse_article(Path(p))
          result=r.wait_until_exact_live(p,a,5)
          print('LIVE_RESULT='+repr(result))
          print('EXACT_LIVE_OK=1')
          PY

      - name: 3 Facebook rescrape jednou
        id: facebook
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import refresh_facebook_previews_on_change as r
          import publish_facebook
          creds=publish_facebook.validate_page_access()
          print('FACEBOOK_ACCESS_OK='+str(bool(creds.get('page_id'))))
          r.refresh_facebook_once('https://nasekadan.cz/clanky/mestska-policie-kadan-fakta-diskuse-2026.html')
          print('FACEBOOK_SCRAPE_OK=1')
          PY

      - name: 4 Celý guard s tvrdým limitem
        id: guard
        run: |
          set -euo pipefail
          timeout 20s python3 -u scripts/refresh_facebook_previews_on_change.py --article clanky/mestska-policie-kadan-fakta-diskuse-2026.html --timeout 5
          grep -Fq '"state": "preview_refreshed"' .github/facebook-preview-refresh-status.json
          grep -Fq '"facebook_rescrape": true' .github/facebook-preview-refresh-status.json
          echo 'SYSTEM_GUARD_OK=1'

      - name: Zapsat výsledek diagnostiky do PR
        if: always()
        uses: actions/github-script@v7
        env:
          CANDIDATE: ${{ steps.candidate.outcome }}
          LIVE: ${{ steps.live.outcome }}
          FACEBOOK: ${{ steps.facebook.outcome }}
          GUARD: ${{ steps.guard.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok=[process.env.CANDIDATE,process.env.LIVE,process.env.FACEBOOK,process.env.GUARD].every(x=>x==='success');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`CANDIDATE=${process.env.CANDIDATE}; LIVE=${process.env.LIVE}; FACEBOOK=${process.env.FACEBOOK}; SYSTEM_GUARD=${process.env.GUARD}`});
            if(!ok) core.setFailed('Některá fáze systémového FB guardu selhala.');
