name: PR diagnostika Facebook náhledu MP

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: nasekadan-mp-facebook-preview-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.title == '[RUN] MP Facebook preview repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
      FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Jednorázově ověřit živý článek, obrázek a Facebook scrape
        id: diag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import process_facebook_queue as q
          import process_facebook_queue_live as live
          import publish_facebook

          article_path='clanky/mestska-policie-kadan-fakta-diskuse-2026.html'
          article=publish_facebook.parse_article(Path(article_path))
          q.validate_source_article(article_path,article)
          print('SOURCE_OG_IMAGE='+article['image'])

          status,headers,body=q.fetch_bytes(article['url'],'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)')
          print('ARTICLE_HTTP='+str(status))
          parser=publish_facebook.MetaParser(); parser.feed(body.decode('utf-8','replace'))
          live_image=parser.meta.get('og:image','').strip()
          print('LIVE_OG_IMAGE='+live_image)
          if live_image != article['image']:
              raise SystemExit(f'LIVE_OG_MISMATCH source={article["image"]} live={live_image}')

          istatus,iheaders,idata=q.fetch_bytes(live_image,'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)')
          dims=q.png_dimensions(idata)
          local=Path('social/mestska-policie-kadan-fakta-diskuse-2026-v2.png').read_bytes()
          local_hash=hashlib.sha256(local).hexdigest(); live_hash=hashlib.sha256(idata).hexdigest()
          print('IMAGE_HTTP='+str(istatus))
          print('IMAGE_CONTENT_TYPE='+iheaders.get('content-type',''))
          print('IMAGE_DIMS='+repr(dims))
          print('LOCAL_SHA256='+local_hash)
          print('LIVE_SHA256='+live_hash)
          if istatus != 200 or dims != (1200,630) or live_hash != local_hash:
              raise SystemExit('LIVE_IMAGE_NOT_EXACT')
          print('LIVE_OK=1')

          creds=publish_facebook.validate_page_access()
          print('FACEBOOK_PAGE_ID='+str(creds.get('page_id')))
          live.refresh_facebook_preview(article['url'])
          print('FACEBOOK_SCRAPE_OK=1')
          PY

      - name: Ověřit systémový guard po opravě
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refresh_facebook_previews_on_change.py \
            --article clanky/mestska-policie-kadan-fakta-diskuse-2026.html \
            --timeout 30
          grep -Fq '"state": "preview_refreshed"' .github/facebook-preview-refresh-status.json
          grep -Fq '"facebook_rescrape": true' .github/facebook-preview-refresh-status.json
          echo 'SYSTEM_GUARD_OK=1'

      - name: Zapsat výsledek diagnostiky do PR
        if: always()
        uses: actions/github-script@v7
        env:
          DIAG: ${{ steps.diag.outcome }}
          GUARD: ${{ steps.guard.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok=process.env.DIAG==='success' && process.env.GUARD==='success';
            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:context.issue.number,
              body:`MP_FACEBOOK_DIAGNOSTIC=${process.env.DIAG}; SYSTEM_GUARD=${process.env.GUARD}`
            });
            if(!ok) core.setFailed('Diagnostika nebo systémový FB guard selhal.');
