name: Okamžitě nasadit výsledky ankety SMR přes issue

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: deploy-poll-results-issue
  cancel-in-progress: true

env:
  ARTICLE: clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
  POLL_ID: smr-tusimice-2026
  VERSION: 20260801-poll-results-1
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'petrkotab666' && github.event.issue.title == '[poll-results] deploy Tusimice')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit článek, frontend a backend
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_editorial_rules.py
          python3 scripts/enable_poll_results.py
          python3 -m py_compile newsletter/server.py scripts/apply_editorial_rules.py scripts/enable_poll_results.py
          grep -Fq '# BEGIN POLL_RESULTS_API' newsletter/server.py
          grep -Fq '/api/newsletter/poll/results' site.js
          grep -Fq 'Průběžné výsledky' site.js
          grep -Fq 'Průběžné výsledky se zobrazují hned' "$ARTICLE"
          ! grep -Fq 'neindexované přílohy' "$ARTICLE"
          ! grep -Fq 'německém přeshraničním řízení' "$ARTICLE"

      - name: Uložit opravený zdroj
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň deploy bot'
          git config user.email 'info@nasekadan.cz'
          git add newsletter/server.py site.js "$ARTICLE"
          if ! git diff --cached --quiet; then
            git commit -m 'Zapnout výsledky ankety a odstranit popis rešeršní metody [skip ci]'
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [ "$attempt" = 4 ] && exit 1
              sleep $((attempt * 4))
            done
          fi

      - name: Připravit SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"; break; fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit na OVH
        id: production
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            site.js newsletter/server.py "$ARTICLE" ubuntu@57.129.43.215:/tmp/
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          python3 -m py_compile /tmp/server.py
          sudo install -m 0644 /tmp/site.js /var/www/nasekadan/site.js
          sudo install -m 0644 /tmp/jaderne-tusimice-smr-voda-doprava-eia-2026.html /var/www/nasekadan/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
          sudo install -m 0644 /tmp/server.py /opt/nasekadan/newsletter/server.py
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/site.js nasekadan-web:/usr/share/nginx/html/site.js
            sudo docker cp /tmp/jaderne-tusimice-smr-voda-doprava-eia-2026.html nasekadan-web:/usr/share/nginx/html/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
          fi
          sudo systemctl restart nasekadan-newsletter.service
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/health >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then sudo journalctl -u nasekadan-newsletter.service -n 100 --no-pager; exit 1; fi
            sleep 2
          done
          sudo systemctl is-active --quiet nasekadan-newsletter.service
          rm -f /tmp/site.js /tmp/server.py /tmp/jaderne-tusimice-smr-voda-doprava-eia-2026.html
          REMOTE

      - name: Veřejně ověřit výsledky a ochranu proti dvojímu hlasu
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          test_poll="healthcheck-${GITHUB_RUN_ID}"
          article_url="https://nasekadan.cz/${ARTICLE}"
          for attempt in $(seq 1 12); do
            js="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/site.js?v=${stamp}-${attempt}" 2>/dev/null || true)"
            article="$(curl -4 -kfsS --max-time 25 "${article_url}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            actual="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/api/newsletter/poll/results?poll=${POLL_ID}&t=${stamp}-${attempt}" 2>/dev/null || true)"
            first="$(curl -4 -kfsS --max-time 25 -A 'NaseKadan-Poll-Healthcheck' -X POST 'https://nasekadan.cz/api/newsletter/poll/vote' -H 'Content-Type: application/json' --data "{\"pollId\":\"${test_poll}\",\"choice\":\"ok\"}" 2>/dev/null || true)"
            second="$(curl -4 -kfsS --max-time 25 -A 'NaseKadan-Poll-Healthcheck' -X POST 'https://nasekadan.cz/api/newsletter/poll/vote' -H 'Content-Type: application/json' --data "{\"pollId\":\"${test_poll}\",\"choice\":\"jiny\"}" 2>/dev/null || true)"
            test_results="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/api/newsletter/poll/results?poll=${test_poll}&t=${stamp}-${attempt}" 2>/dev/null || true)"
            if JS="$js" ARTICLE_HTML="$article" ACTUAL="$actual" FIRST="$first" SECOND="$second" TEST_RESULTS="$test_results" python3 - <<'PY'
          import json, os, sys
          try:
              actual=json.loads(os.environ['ACTUAL']); first=json.loads(os.environ['FIRST']); second=json.loads(os.environ['SECOND']); test=json.loads(os.environ['TEST_RESULTS'])
          except Exception:
              raise SystemExit(1)
          article=os.environ['ARTICLE_HTML']; js=os.environ['JS']
          checks=[
              'Průběžné výsledky' in js,
              '/api/newsletter/poll/results' in js,
              '/api/newsletter/poll/vote' in js,
              'Průběžné výsledky se zobrazují hned' in article,
              'neindexované přílohy' not in article,
              'německém přeshraničním řízení' not in article,
              actual.get('ok') is True and isinstance(actual.get('counts'),dict),
              first.get('ok') is True and first.get('selected')=='ok',
              second.get('ok') is True and second.get('accepted') is False and second.get('selected')=='ok',
              test.get('total')==1 and test.get('counts',{}).get('ok')==1,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then
              printf '%s\n' "$actual" > /tmp/live-poll-results.json
              echo 'ok=true' >> "$GITHUB_OUTPUT"
              echo "results=$(tr -d '\n' < /tmp/live-poll-results.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 8
          done
          echo 'ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Zapsat stav do repozitáře
        if: always()
        env:
          PROD: ${{ steps.production.outcome }}
          VERIFIED: ${{ steps.verify.outputs.ok }}
          RESULTS: ${{ steps.verify.outputs.results }}
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          [[ "${PROD:-}" == success && "${VERIFIED:-}" == true ]] && ok=true
          printf '{"ok":%s,"run_id":"%s","checked_at":"%s","production":"%s","verified":"%s","poll_id":"%s","version":"%s","editorial_rule":true,"results":%s}\n' \
            "$ok" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${PROD:-unknown}" "${VERIFIED:-false}" "$POLL_ID" "$VERSION" "${RESULTS:-null}" > .github/poll-results-status.json
          git config user.name 'Naše Kadaň deploy bot'
          git config user.email 'info@nasekadan.cz'
          git add .github/poll-results-status.json
          git commit -m 'Zapsat stav výsledků ankety a redakční kontroly [skip ci]' || true
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
          done
          exit 1

      - name: Zapsat výsledek do spouštěcího issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          PROD: ${{ steps.production.outcome }}
          VERIFIED: ${{ steps.verify.outputs.ok }}
          RESULTS: ${{ steps.verify.outputs.results }}
        with:
          script: |
            const ok = process.env.PROD === 'success' && process.env.VERIFIED === 'true';
            const body = ok
              ? `✅ Živé výsledky ankety jsou nasazené a veřejně ověřené.\n\nVýsledek API: \`${process.env.RESULTS || '{}'}\`\n\nSoučasně byly z článku odstraněny popisy interního způsobu rešerše.`
              : `❌ Nasazení nebylo potvrzeno. Produkce: ${process.env.PROD || 'unknown'}, veřejné ověření: ${process.env.VERIFIED || 'false'}.`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'});
