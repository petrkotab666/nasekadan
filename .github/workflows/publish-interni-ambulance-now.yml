name: Ověřit existující článek interní ambulance

on:
  push:
    branches: [main]
    paths:
      - '.github/interni-ambulance-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-interni-ambulance-publication
  cancel-in-progress: true

jobs:
  verify-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Potvrdit, že nevznikne duplicitní článek
        shell: bash
        run: |
          set -euo pipefail
          existing='clanky/interni-ambulance-nemocnice-kadan-uzavrena-cervenec-srpen-2026.html'
          duplicate='clanky/interni-ambulance-kadan-uzavrena-do-14-srpna-2026.html'
          test -f "$existing"
          test ! -f "$duplicate"
          grep -Fq 'Interní ambulance Nemocnice Kadaň bude tři týdny uzavřená' "$existing"
      - name: Ověřit existující článek na veřejném webu
        shell: bash
        run: |
          set -euo pipefail
          slug='interni-ambulance-nemocnice-kadan-uzavrena-cervenec-srpen-2026.html'
          for attempt in $(seq 1 12); do
            article="$(curl -kfsS --max-time 20 "https://nasekadan.cz/clanky/$slug?v=${GITHUB_SHA}-$attempt" || true)"
            home="$(curl -kfsS --max-time 20 "https://nasekadan.cz/?v=${GITHUB_SHA}-$attempt" || true)"
            archive="$(curl -kfsS --max-time 20 "https://nasekadan.cz/clanky/?v=${GITHUB_SHA}-$attempt" || true)"
            if grep -Fq 'Interní ambulance Nemocnice Kadaň bude tři týdny uzavřená' <<<"$article" \
              && grep -Fq "$slug" <<<"$home" \
              && grep -Fq "$slug" <<<"$archive"; then
              echo 'Existující praktická zpráva je veřejně dostupná; nový článek se nevytváří.'
              exit 0
            fi
            sleep 5
          done
          exit 1
