name: Ověřit výběr Egypta na LastMinuteSlevy v4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/verify-lms-click-v4-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 6
    steps:
      - name: Připravit Chromium
        shell: bash
        run: |
          set -euo pipefail
          WORK="/tmp/lms-click-v4-${GITHUB_RUN_ID}"
          rm -rf "$WORK" && mkdir -p "$WORK"
          npm install --prefix "$WORK" --no-save --no-package-lock playwright@1.55.0
          "$WORK/node_modules/.bin/playwright" install chromium
          echo "PW_WORK=$WORK" >> "$GITHUB_ENV"

      - name: Otestovat fyzické kliknutí
        id: test
        continue-on-error: true
        shell: bash
        run: |
          NODE_PATH="$PW_WORK/node_modules" timeout 180 node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');const r={ok:false,at:new Date().toISOString(),errors:[],failed:[]};
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});try{const p=await b.newPage({viewport:{width:1440,height:1050},locale:'cs-CZ',ignoreHTTPSErrors:true,serviceWorkers:'block'});p.on('pageerror',e=>r.errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')r.errors.push(m.text())});p.on('requestfailed',x=>r.failed.push(`${x.url()} ${x.failure()?.errorText||''}`));await p.goto(`https://www.lastminuteslevy.cz/?nk-click=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>document.querySelector('#catalogFilterV3')?.dataset.bootstrapState==='ready',{timeout:60000});await p.waitForFunction(()=>document.documentElement.dataset.inlineAutocomplete==='20260728-inline-autocomplete-3',{timeout:20000});const input=p.locator('#catalogFilterV3 input[name="query"]');await input.fill('eg');const option=p.locator('#lmsInlineAutocomplete button').filter({hasText:/Egypt/i}).first();await option.waitFor({state:'visible',timeout:15000});r.before=await p.evaluate(()=>({build:document.documentElement.getAttribute('data-public-build')||'',auto:document.documentElement.dataset.inlineAutocomplete||'',autoScript:[...document.scripts].map(s=>s.src).find(x=>x.includes('homepage-inline-autocomplete-20260727.js'))||'',listParent:document.querySelector('#lmsInlineAutocomplete')?.parentElement?.tagName||'',query:document.querySelector('input[name="query"]')?.value||''}));const box=await option.boundingBox();if(!box)throw new Error('Egypt není kliknutelný');await p.mouse.move(box.x+60,box.y+box.height/2);await p.mouse.down();await p.waitForTimeout(60);await p.mouse.up();await p.waitForFunction(()=>[...document.querySelectorAll('input[name="countries"]:checked')].some(x=>x.value==='Egypt'),{timeout:10000});await p.waitForFunction(()=>{const x=document.querySelector('#lmsInlineSelectionFeedback');return x&&!x.hidden&&/Egypt/i.test(x.textContent||'')},{timeout:10000});await p.waitForTimeout(400);r.immediate=await p.evaluate(()=>({query:document.querySelector('input[name="query"]')?.value||'',selected:[...document.querySelectorAll('input[name="countries"]:checked')].map(x=>x.value),listHidden:document.querySelector('#lmsInlineAutocomplete')?.hidden??null,feedbackHidden:document.querySelector('#lmsInlineSelectionFeedback')?.hidden??null,feedbackText:document.querySelector('#lmsInlineSelectionFeedback')?.textContent?.replace(/\s+/g,' ').trim()||'',marker:document.documentElement.dataset.inlineAutocompleteSelected||''}));if(r.before.build!=='20260728-inline-public-4'||!/inline-click-fix-4/.test(r.before.autoScript)||r.before.listParent!=='BODY'||r.immediate.query!==''||!r.immediate.selected.includes('Egypt')||r.immediate.listHidden!==true||r.immediate.feedbackHidden!==false)throw new Error(JSON.stringify({before:r.before,immediate:r.immediate}));try{await p.waitForFunction(()=>document.querySelectorAll('#offersGrid .catalog-offer-card').length>0,{timeout:45000});}catch{}r.results=await p.evaluate(()=>({cards:document.querySelectorAll('#offersGrid .catalog-offer-card').length,regions:document.querySelectorAll('input[name="regions"]:not(:disabled)').length,status:document.querySelector('[data-search-status]')?.textContent?.trim()||''}));const critical=r.errors.filter(x=>/SyntaxError|ReferenceError|TypeError|uncaught|fatal/i.test(x));if(critical.length)throw new Error(JSON.stringify(critical));r.ok=true;}catch(e){r.error=String(e?.stack||e)}finally{await b.close();fs.writeFileSync('/tmp/lms-nk-click.json',JSON.stringify(r,null,2)+'\n');console.log(JSON.stringify(r,null,2))}if(!r.ok)process.exit(1)})();
          NODE

      - name: Zapsat výsledek
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const fs=require('fs');let d={ok:false,error:'Report nevznikl'};try{d=JSON.parse(fs.readFileSync('/tmp/lms-nk-click.json','utf8'))}catch{}d.outcome=process.env.OUTCOME||'unknown';await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Ověření výběru Egypta na LMS: **${d.ok?'ÚSPĚCH':'SELHÁNÍ'}**\n\n\`\`\`json\n${JSON.stringify(d,null,2)}\n\`\`\``});

      - name: Vyhodnotit
        if: always()
        shell: bash
        run: test "${{ steps.test.outcome }}" = success
