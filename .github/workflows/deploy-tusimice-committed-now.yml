name: Nasadit již uložené jaderné Tušimice na web a Facebook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-tusimice-committed-now.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: deploy-tusimice-committed-now
  cancel-in-progress: false

env:
  SLUG: jaderne-tusimice-smr-voda-doprava-eia-2026
  ARTICLE: clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
  EXPECTED_TEXT: 'Úplná EIA měla být na ministerstvu už 12. května'
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  deploy-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit již uložený balíček
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          social_url="$(python3 - <<'PY'
          import html,re
          from pathlib import Path
          text=Path('clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html').read_text(encoding='utf-8')
          m=re.search(r'<meta\s+property=["\']og:image["\']\s+content=["\']([^"\']+)',text,re.I)
          if not m: raise SystemExit('Chybí og:image')
          print(html.unescape(m.group(1)))
          PY
          )"
          social_image="social/${social_url##*/}"
          test -s "$ARTICLE" && test -s "$social_image"
          grep -Fq "$EXPECTED_TEXT" "$ARTICLE"
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" news-sitemap.xml
          python3 - "$social_image" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          p=Path(sys.argv[1])
          with Image.open(p) as im:
              assert im.format=='PNG' and im.size==(1200,630)
          assert p.stat().st_size>=10000
          PY
          echo "social_url=$social_url" >> "$GITHUB_OUTPUT"
          echo "social_image=$social_image" >> "$GITHUB_OUTPUT"

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key";
          elif [[ -n "${KEY2:-}" ]]; then printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key";
          else echo 'Chybí SSH klíč pro OVH' >&2; exit 1; fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit veřejné soubory přímo na OVH a do kontejneru
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-tusimice-committed"
          rm -rf "$bundle" && mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "${{ steps.package.outputs.social_image }}" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$bundle/"
          for attempt in 1 2 3; do
            if scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-tusimice-committed; then break; fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep $((attempt * 8))
          done
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 /tmp/nk-tusimice-committed/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-tusimice-committed/clanky/index.html /var/www/nasekadan/clanky/index.html
          find /tmp/nk-tusimice-committed/social -maxdepth 1 -type f -name '*.png' -exec sudo install -m 0644 {} /var/www/nasekadan/social/ \;
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do sudo install -m 0644 "/tmp/nk-tusimice-committed/$f" "/var/www/nasekadan/$f"; done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp /tmp/nk-tusimice-committed/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp /tmp/nk-tusimice-committed/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            for f in /tmp/nk-tusimice-committed/social/*.png; do sudo docker cp "$f" nasekadan-web:/usr/share/nginx/html/social/; done
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do sudo docker cp "/tmp/nk-tusimice-committed/$f" "nasekadan-web:/usr/share/nginx/html/$f"; done
          fi
          sudo chmod -R a+rX /var/www/nasekadan
          grep -Fq 'Úplná EIA měla být na ministerstvu už 12. května' /var/www/nasekadan/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
          grep -Fq '/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html' /var/www/nasekadan/index.html
          grep -Fq 'https://nasekadan.cz/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html' /var/www/nasekadan/rss.xml
          rm -rf /tmp/nk-tusimice-committed
          REMOTE

      - name: Veřejně ověřit web a všechny výstupy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          social_url='${{ steps.package.outputs.social_url }}'
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 30); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            image="$RUNNER_TEMP/social-${attempt}.png"
            curl -4 -kfsS --max-time 25 "${social_url}?v=${stamp}-${attempt}" -o "$image" 2>/dev/null || true
            image_ok="$(python3 - "$image" <<'PY'
          import sys
          from pathlib import Path
          try:
              from PIL import Image
              p=Path(sys.argv[1])
              with Image.open(p) as im: print('yes' if im.format=='PNG' and im.size==(1200,630) and p.stat().st_size>=10000 else 'no')
          except Exception: print('no')
          PY
            )"
            if grep -Fq "$EXPECTED_TEXT" <<< "$article" \
              && grep -Fq 'Chcete, aby v Tušimicích vznikla nová jaderná elektrárna?' <<< "$article" \
              && grep -Fq "$social_url" <<< "$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<< "$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<< "$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<< "$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<< "$sitemap" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<< "$news" \
              && [[ "$image_ok" == yes ]]; then
              echo 'web_ok=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'web_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Zveřejnit článek na Facebooku a uložit potvrzení
        id: facebook
        if: steps.verify.outputs.web_ok == 'true'
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          FACEBOOK_WAIT_TIMEOUT: '600'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          python3 scripts/process_facebook_queue_live.py "$ARTICLE"
          git config user.name 'Naše Kadaň Facebook pojistka'
          git config user.email 'info@nasekadan.cz'
          git add -A -- .github/facebook-publish-pending.txt .github/facebook-last-status.json .github/facebook-published 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Potvrdit Facebook: jaderné Tušimice'
            git reset --hard HEAD
            git clean -fd
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 4 ]] && exit 1
              sleep $((attempt * 5))
            done
          fi
          marker="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          article='clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html'
          digest=hashlib.sha256(article.encode()).hexdigest()[:10]
          print(f'.github/facebook-published/{Path(article).stem}-{digest}.json')
          PY
          )"
          for attempt in $(seq 1 18); do
            git fetch -q origin main
            if git cat-file -e "origin/main:$marker" 2>/dev/null; then
              git show "origin/main:$marker"
              echo 'facebook_ok=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'facebook_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Uzavřít issue po úplném ověření
        if: steps.verify.outputs.web_ok == 'true' && steps.facebook.outputs.facebook_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close 278 --repo "$GITHUB_REPOSITORY" --reason completed --comment 'Článek je veřejně ověřen na webu, titulce, v archivu, RSS a obou sitemapách; sociální obrázek má 1200 × 630 a Facebook má potvrzený publikační marker.'

      - name: Aktualizovat issue při překážce
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_OK: ${{ steps.verify.outputs.web_ok }}
          FACEBOOK_OK: ${{ steps.facebook.outputs.facebook_ok }}
        shell: bash
        run: |
          body=$(cat <<EOF
          Přímé nasazení již uloženého článku nebylo kompletně potvrzeno.

          - Web: ${WEB_OK:-NEOVĚŘEN}
          - Facebook: ${FACEBOOK_OK:-NEOVĚŘEN}
          - Běh: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          gh issue edit 278 --repo "$GITHUB_REPOSITORY" --body "$body"
