name: Vytěžit dokument DESÚ 294869
run-name: Jednorázová rešerše neveřejně pojmenovaného dokumentu DESÚ

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-desu-294869.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stáhnout detail a přílohy úřední desky
        shell: bash
        run: |
          set -euo pipefail
          OUT='.github/research/desu-294869'
          mkdir -p "$OUT/files"
          URL='https://www.mesto-kadan.cz/redakce/index.php?lanG=cs&clanek=274670&slozka=219380&as4uOriginalDomain=www.mesto-kadan.cz&as4u_protocol=https&detail_claim=294869&'
          curl -kLfsS --max-time 90 -A 'Mozilla/5.0 (compatible; NaseKadanResearch/1.0)' "$URL" -o "$OUT/detail.html"

          python3 - <<'PY'
          from __future__ import annotations
          import html
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin

          out = Path('.github/research/desu-294869')
          raw = out.joinpath('detail.html').read_text(encoding='utf-8', errors='replace')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.text = []
                  self.current_href = None
                  self.current_label = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'a':
                      self.current_href = dict(attrs).get('href')
                      self.current_label = []
              def handle_data(self, data):
                  cleaned = ' '.join(data.split())
                  if cleaned:
                      self.text.append(cleaned)
                      if self.current_href is not None:
                          self.current_label.append(cleaned)
              def handle_endtag(self, tag):
                  if tag.lower() == 'a' and self.current_href is not None:
                      self.links.append({
                          'label': ' '.join(self.current_label).strip(),
                          'url': urljoin('https://www.mesto-kadan.cz/', html.unescape(self.current_href)),
                      })
                      self.current_href = None
                      self.current_label = []

          p = Parser(); p.feed(raw)
          links = []
          seen = set()
          for item in p.links:
              key = (item['label'], item['url'])
              if key not in seen:
                  seen.add(key); links.append(item)
          text = ' '.join(p.text)
          text = re.sub(r'\s+', ' ', text).strip()
          files = [x for x in links if '/filemanager/files/file.php?' in x['url']]
          payload = {
              'source_url': 'https://www.mesto-kadan.cz/redakce/index.php?lanG=cs&clanek=274670&slozka=219380&as4uOriginalDomain=www.mesto-kadan.cz&as4u_protocol=https&detail_claim=294869&',
              'title_guess': next((x for x in p.text if 'Vyrozumění' in x), ''),
              'text': text,
              'links': links,
              'file_links': files,
          }
          out.joinpath('detail.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          out.joinpath('detail.txt').write_text(text + '\n', encoding='utf-8')
          with out.joinpath('file-urls.txt').open('w', encoding='utf-8') as f:
              for item in files:
                  f.write(item['url'] + '\t' + item['label'] + '\n')
          print(json.dumps(files, ensure_ascii=False))
          PY

          i=0
          while IFS=$'\t' read -r file_url label; do
            [ -n "$file_url" ] || continue
            i=$((i+1))
            target="$OUT/files/attachment-$i.bin"
            curl -kLfsS --max-time 120 -A 'Mozilla/5.0 (compatible; NaseKadanResearch/1.0)' "$file_url" -o "$target"
            kind="$(file -b --mime-type "$target" || true)"
            printf '%s\t%s\t%s\n' "$i" "$kind" "$label" >> "$OUT/files/index.tsv"
            if [ "$kind" = 'application/pdf' ]; then
              mv "$target" "$OUT/files/attachment-$i.pdf"
              if command -v pdftotext >/dev/null 2>&1; then
                pdftotext -layout "$OUT/files/attachment-$i.pdf" "$OUT/files/attachment-$i.txt" || true
              else
                python3 - "$OUT/files/attachment-$i.pdf" "$OUT/files/attachment-$i.txt" <<'PY'
          import sys
          try:
              from pypdf import PdfReader
              reader = PdfReader(sys.argv[1])
              text = '\n\n'.join((p.extract_text() or '') for p in reader.pages)
          except Exception as exc:
              text = f'PDF text extraction failed: {exc}\n'
          open(sys.argv[2], 'w', encoding='utf-8').write(text)
          PY
              fi
            else
              mv "$target" "$OUT/files/attachment-$i.dat"
            fi
          done < "$OUT/file-urls.txt"

          {
            echo '# DESÚ – detail_claim 294869'
            echo
            echo "Zdroj: $URL"
            echo
            echo '## Text detailu'
            cat "$OUT/detail.txt"
            echo
            echo '## Přílohy'
            cat "$OUT/files/index.tsv" 2>/dev/null || echo 'Bez dohledané přílohy.'
            for txt in "$OUT"/files/attachment-*.txt; do
              [ -f "$txt" ] || continue
              echo
              echo "### $(basename "$txt")"
              cat "$txt"
            done
          } > "$OUT/report.md"

      - name: Uložit rešeršní výstup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nasekadan-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/research/desu-294869
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Rešerše: vytěžit dokument DESÚ 294869'
          git push origin HEAD:main
