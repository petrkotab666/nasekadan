name: Publikovat sečení trávníků 1. 8. 2026 v 11:00 s pojistkami

on:
  push:
    branches: [main]
    paths:
      - '.github/drafts/sekani-travniku-kadan-spravci-vysky-2026.html.gz.b64'
      - '.github/drafts/sekani-travniku-kadan-spravci-vysky-2026.html.gz.b64.part2'
      - '.github/workflows/publish-greenery-2026-08-01-1100.yml'
  schedule:
    # GitHub cron používá UTC. 09:00 UTC = 11:00 CEST.
    - cron: '0 9 1 8 *'
    # Pojistné běhy pro zpoždění scheduleru, souběh změn nebo výpadek nasazení.
    - cron: '7 9 1 8 *'
    - cron: '17 9 1 8 *'
    - cron: '30 9 1 8 *'
    - cron: '45 9 1 8 *'
    - cron: '0 10 1 8 *'
    - cron: '30 10 1 8 *'
  workflow_dispatch:
    inputs:
      force:
        description: Publikovat a opravit ihned
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-greenery-2026-08-01-1100
  cancel-in-progress: false

env:
  SLUG: sekani-travniku-kadan-spravci-vysky-2026
  ARTICLE: clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  SOURCE1: .github/drafts/sekani-travniku-kadan-spravci-vysky-2026.html.gz.b64
  SOURCE2: .github/drafts/sekani-travniku-kadan-spravci-vysky-2026.html.gz.b64.part2
  TARGET_UTC: '2026-08-01T09:00:00Z'
  PUBLIC_URL: https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  EXPECTED_TEXT: 'Sedm centimetrů je smluvní minimum jedné konkrétní lokality'
  ISSUE_TITLE: 'Publikace článku o sečení trávníků vyžaduje zásah'
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sestavit a ověřit neveřejný zdroj
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE1"
          test -s "$SOURCE2"
          cat "$SOURCE1" "$SOURCE2" | base64 -d | gzip -dc > "$RUNNER_TEMP/greenery-draft.html"
          test -s "$RUNNER_TEMP/greenery-draft.html"
          grep -Fq '<meta name="robots" content="noindex,nofollow">' "$RUNNER_TEMP/greenery-draft.html"
          grep -Fq '2026-08-01T11:00:00+02:00' "$RUNNER_TEMP/greenery-draft.html"
          grep -Fq 'data-poll-id="sekani-travniku-kadan-2026"' "$RUNNER_TEMP/greenery-draft.html"
          grep -Fq '/api/analytics/pageview' "$RUNNER_TEMP/greenery-draft.html"
          grep -Fq '105,2 ha' "$RUNNER_TEMP/greenery-draft.html"
          grep -Fq '282' "$RUNNER_TEMP/greenery-draft.html"
          grep -Fq '7–25 cm' "$RUNNER_TEMP/greenery-draft.html"
          grep -Fq 'Strážiště III' "$RUNNER_TEMP/greenery-draft.html"
          grep -Fq '</article>' "$RUNNER_TEMP/greenery-draft.html"
          grep -Fq '</html>' "$RUNNER_TEMP/greenery-draft.html"
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          text=Path('/tmp').joinpath('not-used')
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'greenery-draft.html'
          content=p.read_text(encoding='utf-8')
          Parser().feed(content)
          required=(
              'Sedm centimetrů i dvě seče ročně',
              'Jak se má podle odborných doporučení sekat v horku',
              'Jak by se měly trávníky v Kadani udržovat?',
              'Městský GIS Kadaň',
          )
          missing=[item for item in required if item not in content]
          if missing:
              raise SystemExit('V návrhu chybí: '+', '.join(missing))
          PY

  publish-deploy-verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rozhodnout, zda je čas publikace
        id: timing
        shell: bash
        run: |
          set -euo pipefail
          force='${{ inputs.force || false }}'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$force" != 'true' && "$now" < "$TARGET_UTC" ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo "Předletová kontrola je v pořádku, publikace čeká do $TARGET_UTC."
            exit 0
          fi
          if [[ "${{ github.event_name }}" == 'schedule' && "$(date -u +%F)" != '2026-08-01' ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Jednorázový harmonogram mimo 1. 8. 2026 se ignoruje.'
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"

      - name: Připravit článek, sociální obrázek a veřejné přehledy
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat "$SOURCE1" "$SOURCE2" | base64 -d | gzip -dc > "$ARTICLE"
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/enforce_article_visibility.py
          python3 scripts/sort_articles_chronologically.py

          social_url="$(python3 - <<'PY'
          import html,re
          from pathlib import Path
          text=Path('clanky/sekani-travniku-kadan-spravci-vysky-2026.html').read_text(encoding='utf-8')
          m=re.search(r'<meta\s+property=["\']og:image["\']\s+content=["\']([^"\']+)',text,re.I)
          if not m: raise SystemExit('Chybí og:image')
          print(html.unescape(m.group(1)))
          PY
          )"
          social_image="social/${social_url##*/}"
          test -s "$social_image"
          echo "SOCIAL_URL=$social_url" >> "$GITHUB_ENV"
          echo "SOCIAL_IMAGE=$social_image" >> "$GITHUB_ENV"

          python3 - "$social_image" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          p=Path(sys.argv[1])
          with Image.open(p) as im:
              if im.format != 'PNG' or im.size != (1200,630):
                  raise SystemExit(f'Chybný sociální obrázek: {im.format}, {im.size}')
          if p.stat().st_size < 10000:
              raise SystemExit('Sociální obrázek je podezřele malý.')
          PY

          grep -Fq "$EXPECTED_TEXT" "$ARTICLE"
          grep -Fq 'data-poll-id="sekani-travniku-kadan-2026"' "$ARTICLE"
          grep -Fq '/api/analytics/pageview' "$ARTICLE"
          grep -Fq 'index,follow' "$ARTICLE"
          ! grep -Fq 'noindex,nofollow' "$ARTICLE"
          grep -Fq "$social_url" "$ARTICLE"
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "$PUBLIC_URL" rss.xml
          grep -Fq "$PUBLIC_URL" sitemap.xml
          grep -Fq "$PUBLIC_URL" news-sitemap.xml

      - name: Uložit zveřejnění do main s opakováním
        if: steps.timing.outputs.active == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň publikační automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- "$ARTICLE" "$SOCIAL_IMAGE" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Veřejná verze už je v hlavní větvi.'
          else
            git commit -m 'Publikovat: jak Kadaň udržuje městské trávníky'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo 'changed=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 7))
            done
            exit 1
          fi

      - name: Připravit SSH klíč
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přímo na OVH a do aktivního kontejneru
        if: steps.timing.outputs.active == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-greenery-publication"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$SOCIAL_IMAGE" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$bundle/"

          for attempt in 1 2 3; do
            if scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-greenery-publication; then
              break
            fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep $((attempt * 8))
          done

          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 /tmp/nk-greenery-publication/clanky/sekani-travniku-kadan-spravci-vysky-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-greenery-publication/clanky/index.html /var/www/nasekadan/clanky/index.html
          find /tmp/nk-greenery-publication/social -maxdepth 1 -type f -name 'sekani-travniku-kadan-spravci-vysky-2026-*.png' -exec sudo install -m 0644 {} /var/www/nasekadan/social/ \;
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do
            sudo install -m 0644 "/tmp/nk-greenery-publication/$f" "/var/www/nasekadan/$f"
          done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp /tmp/nk-greenery-publication/clanky/sekani-travniku-kadan-spravci-vysky-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp /tmp/nk-greenery-publication/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            for f in /tmp/nk-greenery-publication/social/*.png; do
              [[ -f "$f" ]] && sudo docker cp "$f" nasekadan-web:/usr/share/nginx/html/social/
            done
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do
              sudo docker cp "/tmp/nk-greenery-publication/$f" "nasekadan-web:/usr/share/nginx/html/$f"
            done
          fi
          sudo chmod -R a+rX /var/www/nasekadan
          grep -Fq 'Sedm centimetrů je smluvní minimum jedné konkrétní lokality' /var/www/nasekadan/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
          grep -Fq '/clanky/sekani-travniku-kadan-spravci-vysky-2026.html' /var/www/nasekadan/index.html
          rm -rf /tmp/nk-greenery-publication
          REMOTE

      - name: Veřejně ověřit článek, titulku, archiv, feedy, anketu a obrázek
        if: steps.timing.outputs.active == 'true'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for attempt in $(seq 1 36); do
            article="$(curl -4 -kfsS --max-time 25 "${PUBLIC_URL}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            image="$RUNNER_TEMP/greenery-social-${attempt}.png"
            curl -4 -kfsS --max-time 25 "${SOCIAL_URL}?v=${stamp}-${attempt}" -o "$image" 2>/dev/null || true
            image_ok=false
            if [[ -s "$image" ]] && python3 - "$image" <<'PY'
          import sys
          from PIL import Image
          with Image.open(sys.argv[1]) as im:
              assert im.format == 'PNG'
              assert im.size == (1200,630)
          PY
            then image_ok=true; fi

            if grep -Fq "$EXPECTED_TEXT" <<<"$article" \
              && grep -Fq 'data-poll-id="sekani-travniku-kadan-2026"' <<<"$article" \
              && grep -Fq '/api/analytics/pageview' <<<"$article" \
              && grep -Fq 'index,follow' <<<"$article" \
              && ! grep -Fq 'noindex,nofollow' <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "$PUBLIC_URL" <<<"$rss" \
              && grep -Fq "$PUBLIC_URL" <<<"$sitemap" \
              && grep -Fq "$PUBLIC_URL" <<<"$news" \
              && [[ "$image_ok" == true ]]; then
              echo 'web_ok=true' >> "$GITHUB_OUTPUT"
              echo 'HOTOVO: článek je veřejný, indexovatelný a zařazený do všech přehledů.'
              exit 0
            fi
            sleep 6
          done
          echo 'web_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Zapsat stav a spravovat výstražný issue
        if: always() && steps.timing.outputs.active == 'true'
        uses: actions/github-script@v7
        env:
          WEB_OK: ${{ steps.verify.outputs.web_ok }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const ok = process.env.WEB_OK === 'true';
            const statusPath = '.github/greenery-publication-status.json';
            const status = {
              status: ok ? 'passed' : 'failed',
              checkedAtUtc: new Date().toISOString(),
              runId: context.runId,
              sourceSha: context.sha,
              serverDeploy: process.env.DEPLOY_OUTCOME || 'skipped',
              publicVerification: ok ? 'success' : 'failure',
              publicUrl: 'https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html'
            };
            const content=Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64');
            let currentSha;
            try {
              const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:statusPath,ref:'main'});
              if(!Array.isArray(current.data)) currentSha=current.data.sha;
            } catch(error) { if(error.status!==404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:statusPath,branch:'main',message:`Zapsat publikaci článku o sečení: ${status.status} [skip ci]`,content,...(currentSha?{sha:currentSha}:{})});

            const openIssues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=openIssues.find(issue=>issue.title===process.env.ISSUE_TITLE);
            if(ok) {
              if(existing) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed',state_reason:'completed'});
            } else if(!existing) {
              await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:process.env.ISSUE_TITLE,body:[
                'Automat zatím nepotvrdil kompletní publikaci článku o sečení trávníků.',
                '',
                `- Přímé nasazení: ${process.env.DEPLOY_OUTCOME || 'neproběhlo'}`,
                `- Veřejná kontrola: ${ok ? 'ověřena' : 'NEOVĚŘENA'}`,
                `- Běh: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Další pojistný cron a samostatná kontrola se pokusí stav napravit.'
              ].join('\n')});
            }
