name: Ověřit opravu živé kanonické evidence 2026-08-04 14:24

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-canonical-live-sync-20260804-1424
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'petrkotab666' && github.event.issue.title == '[verify] canonical live sync 20260804-1424'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      STADIUM_REL: /clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html
      STADIUM_H1: Kadaň otevřela zimní stadion lidem před vedrem. Přijít lze denně od 8 do 18 hodin
      JOSEF_REL: /clanky/josef-suchy-klasterec-u18-kanada-hlinka-2026.html
      JOSEF_H1: Klášterecký Josef Suchý skóroval Kanadě už po 103 sekundách
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ověřit povinné veřejné kanály
        shell: bash
        run: |
          set -euo pipefail
          base=https://nasekadan.cz
          q="${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsS -L --max-time 35 "$base/?v=$q" -o /tmp/home
          curl -4 -kfsS -L --max-time 35 "$base/clanky/?v=$q" -o /tmp/archive
          curl -4 -kfsS -L --max-time 35 "$base$STADIUM_REL?v=$q" -o /tmp/stadium
          curl -4 -kfsS -L --max-time 35 "$base$JOSEF_REL?v=$q" -o /tmp/josef
          curl -4 -kfsS -L --max-time 35 "$base/rss.xml?v=$q" -o /tmp/rss
          curl -4 -kfsS -L --max-time 35 "$base/sitemap.xml?v=$q" -o /tmp/sitemap
          curl -4 -kfsS -L --max-time 35 "$base/news-sitemap.xml?v=$q" -o /tmp/news
          curl -4 -kfsS -L --max-time 35 "$base/data/published-content-index.json?v=$q" -o /tmp/registry
          curl -4 -kfsS -L --max-time 35 "$base/deployment-health.txt?v=$q" -o /tmp/health
          check() { grep -Fq "$2" "$1" && echo "OK $1 :: $2"; }
          check /tmp/home "$JOSEF_H1"
          check /tmp/home "$STADIUM_H1"
          check /tmp/archive "$JOSEF_H1"
          check /tmp/archive "$STADIUM_H1"
          check /tmp/stadium "<h1>$STADIUM_H1</h1>"
          check /tmp/josef "<h1>$JOSEF_H1</h1>"
          check /tmp/rss "https://nasekadan.cz$STADIUM_REL"
          check /tmp/rss "https://nasekadan.cz$JOSEF_REL"
          check /tmp/sitemap "https://nasekadan.cz$STADIUM_REL"
          check /tmp/sitemap "https://nasekadan.cz$JOSEF_REL"
          check /tmp/news "https://nasekadan.cz$STADIUM_REL"
          check /tmp/news "https://nasekadan.cz$JOSEF_REL"
          check /tmp/registry '"article_count": 46'
          check /tmp/registry "$STADIUM_H1"
          check /tmp/registry "$JOSEF_H1"
          check /tmp/health 'status=ok'

      - name: Dokončit evidenci opravy
        id: finish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonický audit'
          git config user.email 'info@nasekadan.cz'
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('data/published-content-index.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc).isoformat()
          validation = data.setdefault('validation', {})
          validation['deployment_health'] = 'verified'
          validation['repair_pending_public_verification'] = False
          validation['public_audit_at'] = now
          repair = validation.setdefault('last_consistency_repair', {})
          repair['status'] = 'success'
          repair['completed_at'] = now
          repair['public_verification'] = {
              'homepage': True,
              'archive': True,
              'rss': True,
              'sitemap': True,
              'news_sitemap': True,
              'registry': True,
              'deployment_health': True,
              'stadium_article_h1': True,
              'josef_article_h1': True
          }
          data['generated_at'] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add data/published-content-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Evidence: potvrdit veřejnou opravu kanonických kanálů'
            git push origin HEAD:main
          fi
          sha="$(git rev-parse HEAD)"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Nasadit dokončený registr a health
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          mkdir -p "$RUNNER_TEMP/final-registry/data"
          cp data/published-content-index.json "$RUNNER_TEMP/final-registry/data/"
          printf 'status=ok\nsource=%s\nrepair=canonical-live-sync-20260804-1417\nverification=complete\narticle_count=46\n' '${{ steps.finish.outputs.source_sha }}' > "$RUNNER_TEMP/final-registry/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/final-registry" ubuntu@57.129.43.215:/tmp/final-registry
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/final-registry
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/data"
          sudo install -m 0644 "$src/data/published-content-index.json" "$root/data/published-content-index.json"
          sudo install -m 0644 "$src/deployment-health.txt" "$root/deployment-health.txt"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/data
            sudo docker cp "$src/data/published-content-index.json" nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
            sudo docker cp "$src/deployment-health.txt" nasekadan-web:/usr/share/nginx/html/deployment-health.txt
          fi
          rm -rf /tmp/final-registry
          REMOTE
          sleep 5
          q="${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/data/published-content-index.json?v=$q" | grep -Fq '"repair_pending_public_verification": false'
          curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/deployment-health.txt?v=$q" | grep -Fq 'verification=complete'

      - name: Uzavřít požadavky
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `Významný nesoulad byl opraven a všechny povinné veřejné kanály byly ověřeny. Výsledný evidenční commit ${{ steps.finish.outputs.source_sha }}.`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 576, body});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: 576, state: 'closed', state_reason: 'completed'});
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});

      - name: Zapsat selhání
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Finální ověření selhalo. Run ${context.runId}.`});
