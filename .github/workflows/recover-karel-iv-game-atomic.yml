name: Atomicky nasadit hru Příjezd Karla IV.

on:
  issues:
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: recover-karel-iv-game-atomic
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 527
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit úplnou připravenost hry v main
        shell: bash
        run: |
          set -euo pipefail
          test -s hry/index.html
          test -s hry/prijezd-karla-iv/index.html
          test -s hry/prijezd-karla-iv/game.js
          test -s hry/prijezd-karla-iv/game.css
          test -s social/hra-prijezd-karla-iv-1367.png
          node --check hry/prijezd-karla-iv/game.js
          grep -Fq 'data-karel-game-promo' index.html
          grep -Fq 'data-karel-game-link' clanky/kulturni-zarizeni-kadan.html
          grep -Fq 'https://nasekadan.cz/hry/prijezd-karla-iv/' sitemap.xml

      - name: Atomicky nasadit aktuální hlavní větev
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          SOURCE_SHA="$(git rev-parse HEAD)"
          tar --exclude='.git' --exclude='.github' --exclude='Dockerfile' --exclude='docker-compose.yml' \
              --exclude='nginx' --exclude='scripts' --exclude='deploy' --exclude='tools' \
              --exclude='docker-entrypoint.d' -czf "$RUNNER_TEMP/site.tgz" .
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
              "$RUNNER_TEMP/site.tgz" ubuntu@57.129.43.215:/tmp/nasekadan-karel-game.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
              ubuntu@57.129.43.215 "SOURCE_SHA='$SOURCE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo -n true
          STAGE="/var/www/nasekadan.game-$SOURCE_SHA"
          PREV="/var/www/nasekadan.previous-game-$SOURCE_SHA"
          sudo rm -rf "$STAGE" "$PREV"
          sudo mkdir -p "$STAGE"
          sudo tar -xzf /tmp/nasekadan-karel-game.tgz -C "$STAGE"
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=karel-iv-game-atomic\n' "$SOURCE_SHA" "$(date -u +%FT%TZ)" | sudo tee "$STAGE/deployment-health.txt" >/dev/null
          sudo chmod -R a+rX "$STAGE"
          grep -Fq 'Příjezd císaře' "$STAGE/hry/prijezd-karla-iv/index.html"
          grep -Fq 'const SCENES = [' "$STAGE/hry/prijezd-karla-iv/game.js"
          grep -Fq 'data-karel-game-promo' "$STAGE/index.html"
          test -s "$STAGE/social/hra-prijezd-karla-iv-1367.png"
          if [ -d /var/www/nasekadan ]; then sudo mv /var/www/nasekadan "$PREV"; fi
          sudo mv "$STAGE" /var/www/nasekadan
          sudo rm -rf "$PREV" /tmp/nasekadan-karel-game.tgz
          REMOTE

      - name: Veřejně ověřit soubory přes IPv4
        id: live
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          ok=0
          for attempt in $(seq 1 20); do
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/hry/prijezd-karla-iv/?game=$stamp-$attempt" -o /tmp/game.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/hry/prijezd-karla-iv/game.js?game=$stamp-$attempt" -o /tmp/game.js || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/hry/prijezd-karla-iv/game.css?game=$stamp-$attempt" -o /tmp/game.css || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?game=$stamp-$attempt" -o /tmp/home.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html?game=$stamp-$attempt" -o /tmp/kzk.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/social/hra-prijezd-karla-iv-1367.png?game=$stamp-$attempt" -o /tmp/game.png || true
            if grep -Fq 'id="gameApp"' /tmp/game.html \
              && grep -Fq 'Příjezd císaře' /tmp/game.html \
              && grep -Fq 'const SCENES = [' /tmp/game.js \
              && grep -Fq '.result-screen' /tmp/game.css \
              && grep -Fq 'data-karel-game-promo' /tmp/home.html \
              && grep -Fq 'data-karel-game-link' /tmp/kzk.html \
              && test "$(wc -c < /tmp/game.png)" -gt 10000; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Nainstalovat Chromium a kliknout v živé hře
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://nasekadan.cz/hry/prijezd-karla-iv/?atomic='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
            await page.locator('#startButton').click();
            const choices=page.locator('#choices .choice-button');
            if(await choices.count()!==3) throw new Error('První kapitola nemá tři volby.');
            const before=await page.locator('.stat output').allInnerTexts();
            await choices.nth(1).click();
            await page.locator('#consequence:not([hidden])').waitFor({state:'visible'});
            const after=await page.locator('.stat output').allInnerTexts();
            if(JSON.stringify(before)===JSON.stringify(after)) throw new Error('Ukazatele se po volbě nezměnily.');
            if(errors.length) throw new Error(errors.join(' | '));
            await browser.close();
            console.log('atomic_live_game=ok');
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat konečný výsledek
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          LIVE_OK: ${{ steps.live.outputs.ok }}
          BROWSER_OK: ${{ steps.browser.outputs.ok }}
        with:
          script: |
            const ok=process.env.LIVE_OK==='true' && process.env.BROWSER_OK==='true';
            const body=ok
              ? '✅ Hra byla atomicky nasazena ověřeným soukromým klíčem. Veřejně byly potvrzeny HTML, JavaScript, CSS, sociální obrázek, odkaz na titulní straně i z článku KZK. V živém prohlížeči proběhla volba a změnila pět ukazatelů. https://nasekadan.cz/hry/prijezd-karla-iv/'
              : `🚨 Atomické nasazení hry selhalo. Soubory: ${process.env.LIVE_OK || 'false'}, živá hra: ${process.env.BROWSER_OK || 'false'}.`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
            if(ok) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
