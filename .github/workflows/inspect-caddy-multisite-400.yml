name: Zjistit příčinu 400 na společných statistikách

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-caddy-multisite-400.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH
        run: |
          set -Eeuo pipefail; umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do value="${!name:-}"; if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"; break; fi; done
          test -s "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"
      - name: Prověřit trasu
        run: |
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' > "$RUNNER_TEMP/out.txt" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          echo '--- SITE FILE ---'; sudo cat /etc/caddy/sites-enabled/nasekadan.caddy
          echo '--- HTTPS TRACKER ---'; curl -kivsS --max-time 12 --resolve nasekadan.cz:443:127.0.0.1 https://nasekadan.cz/_nkstats/tracker.js -o /tmp/https-body || true; echo BODY; cat /tmp/https-body 2>/dev/null || true
          echo '--- NGINX HOST NASEKADAN ---'; curl -ivsS --max-time 8 -H 'Host: nasekadan.cz' http://127.0.0.1/_nkstats/tracker.js -o /tmp/nginx-body || true; echo BODY; cat /tmp/nginx-body 2>/dev/null || true
          echo '--- NGINX HOST 127 ---'; curl -ivsS --max-time 8 http://127.0.0.1/_nkstats/tracker.js -o /tmp/nginx127-body || true; echo BODY; cat /tmp/nginx127-body 2>/dev/null || true
          echo '--- CADDY LOG TAIL ---'; sudo journalctl -u caddy -n 100 --no-pager || true
          REMOTE
      - name: Zapsat diagnostiku
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); let out=''; try{out=fs.readFileSync(`${process.env.RUNNER_TEMP}/out.txt`,'utf8')}catch{}
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:`[CADDY MULTISITE 400] ${new Date().toISOString()}`,body:'```text\n'+out.slice(-50000).replace(/```/g,'---')+'\n```'});
