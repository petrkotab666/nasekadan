name: Udržet nejnovější články na titulní straně

on:
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/ensure_recent_home_articles_20260801.py
      - .github/workflows/ensure-recent-home-articles.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ensure-recent-home-articles
  cancel-in-progress: false

env:
  TUSIMICE_SLUG: jaderne-tusimice-smr-voda-doprava-eia-2026
  TUSIMICE_ARTICLE: clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  ensure:
    if: github.event_name != 'issues' || (github.actor == 'petrkotab666' && github.event.issue.title == '[repair] restore Tusimice article')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stáhnout hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Obnovit a ověřit karty nejnovějších článků
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ensure_recent_home_articles_20260801.py
          test -s "$TUSIMICE_ARTICLE"
          grep -Fq 'Jaderné Tušimice se připravují naplno' "$TUSIMICE_ARTICLE"
          grep -Fq "data-auto-article=\"$TUSIMICE_SLUG\"" index.html
          grep -Fq "/clanky/$TUSIMICE_SLUG.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/$TUSIMICE_SLUG.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/$TUSIMICE_SLUG.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/$TUSIMICE_SLUG.html" news-sitemap.xml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          slugs=[
            'petice-nemocnice-kadan-podpisova-mista-2026',
            'sekani-travniku-kadan-spravci-vysky-2026',
            'jaderne-tusimice-smr-voda-doprava-eia-2026',
          ]
          positions=[text.index(f'data-auto-article="{slug}"') for slug in slugs]
          if positions != sorted(positions):
              raise SystemExit(f'Nesprávné pořadí karet: {positions}')
          PY

      - name: Uložit opravu do hlavní větve
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – ochrana článků'
          git config user.email 'info@nasekadan.cz'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Vrátit nejnovější články na titulní stranu [skip ci]'
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 4 ]] && exit 1
              sleep $((attempt * 4))
            done
          fi
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/ensure_recent_home_articles_20260801.py

      - name: Připravit SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"; break; fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit aktuální titulní stranu a článek
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/tusimice-home-restore"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky"
          cp index.html rss.xml sitemap.xml news-sitemap.xml "$bundle/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$TUSIMICE_ARTICLE" "$bundle/clanky/"
          tar -C "$bundle" -czf "$RUNNER_TEMP/tusimice-home-restore.tar.gz" .
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/tusimice-home-restore.tar.gz" ubuntu@57.129.43.215:/tmp/tusimice-home-restore.tar.gz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo tar -xzf /tmp/tusimice-home-restore.tar.gz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/tusimice-home-restore.tar.gz nasekadan-web:/tmp/tusimice-home-restore.tar.gz
            sudo docker exec nasekadan-web tar -xzf /tmp/tusimice-home-restore.tar.gz -C /usr/share/nginx/html
            sudo docker exec nasekadan-web rm -f /tmp/tusimice-home-restore.tar.gz
          fi
          grep -Fq 'data-auto-article="jaderne-tusimice-smr-voda-doprava-eia-2026"' /var/www/nasekadan/index.html
          grep -Fq 'Jaderné Tušimice se připravují naplno' /var/www/nasekadan/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
          rm -f /tmp/tusimice-home-restore.tar.gz
          REMOTE

      - name: Veřejně ověřit článek a všechny odkazy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          article_url="https://nasekadan.cz/clanky/${TUSIMICE_SLUG}.html"
          ok=false
          for attempt in $(seq 1 18); do
            article="$(curl -4 -kfsS --max-time 25 "${article_url}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            if ARTICLE="$article" HOME="$home" ARCHIVE="$archive" RSS="$rss" SITEMAP="$sitemap" NEWS="$news" python3 - <<'PY'
          import os, sys
          slug='jaderne-tusimice-smr-voda-doprava-eia-2026'
          checks=[
            'Jaderné Tušimice se připravují naplno' in os.environ['ARTICLE'],
            f'data-auto-article="{slug}"' in os.environ['HOME'],
            f'/clanky/{slug}.html' in os.environ['ARCHIVE'],
            f'https://nasekadan.cz/clanky/{slug}.html' in os.environ['RSS'],
            f'https://nasekadan.cz/clanky/{slug}.html' in os.environ['SITEMAP'],
            f'https://nasekadan.cz/clanky/{slug}.html' in os.environ['NEWS'],
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then
              ok=true
              break
            fi
            sleep 6
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [[ "$ok" == true ]]

      - name: Zapsat výsledek do issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFIED: ${{ steps.verify.outputs.ok }}
        with:
          script: |
            const ok = process.env.DEPLOY === 'success' && process.env.VERIFIED === 'true';
            const body = ok
              ? '✅ Článek o jaderných Tušimicích je znovu na titulní straně a veřejně ověřený také v archivu, RSS a sitemapách.\n\nhttps://nasekadan.cz/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html'
              : `❌ Obnova Tušimic nebyla potvrzena. Nasazení: ${process.env.DEPLOY || 'unknown'}, kontrola: ${process.env.VERIFIED || 'false'}.`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});
