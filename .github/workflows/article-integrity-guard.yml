name: Kanonická kontrola chronologie článků Naše Kadaň

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nasekadan-canonical-article-order
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      APOLENA_SLUG: apolena-svabikova-mistrovstvi-evropy-birmingham-2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sestavit titulku, archiv a evidenci
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kontrola chronologie'
          git config user.email 'info@nasekadan.cz'
          git fetch origin main
          git reset --hard origin/main
          ! grep -E 'HOMEPAGE_PIN_|NK-TEMP-STADIUM-PIN|pin_active|pin_href' scripts/enforce_article_visibility.py scripts/enforce_all_article_visibility.py
          python3 -m py_compile scripts/enforce_article_visibility.py scripts/enforce_all_article_visibility.py
          python3 scripts/enforce_all_article_visibility.py
          sed -i 's/[[:space:]]\+$//' index.html sitemap.xml clanky/index.html clanky/strana-*.html
          git diff --check
          git add index.html clanky/index.html sitemap.xml
          find clanky -maxdepth 1 -type f -name 'strana-*.html' -print0 | xargs -0 -r git add --
          if ! git diff --cached --quiet; then
            git commit -m 'Automaticky srovnat pořadí článků podle zveřejnění'
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" != 4
              git pull --rebase origin main
              sleep $((attempt * 2))
            done
          fi

      - name: Načíst aktuální main a připravit malý proudový balík
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f "clanky/$APOLENA_SLUG.html"
          test -f "social/$APOLENA_SLUG.png"
          grep -Fq 'Kadaňská tyčkařka Apolena Švábíková míří na první seniorské ME' "clanky/$APOLENA_SLUG.html"
          grep -Fq 'Amálie Švábíková naopak v Birminghamu startovat nebude' "clanky/$APOLENA_SLUG.html"
          grep -Fq "$APOLENA_SLUG.html" index.html
          grep -Fq "$APOLENA_SLUG.html" clanky/index.html
          grep -Fq "$APOLENA_SLUG.html" rss.xml
          grep -Fq "$APOLENA_SLUG.html" sitemap.xml
          grep -Fq "$APOLENA_SLUG.html" news-sitemap.xml
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/nasekadan-stream"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt "$bundle/"
          cp clanky/*.html "$bundle/clanky/"
          cp "social/$APOLENA_SLUG.png" "$bundle/social/"

      - name: Uvolnit bezpečně dočasné soubory na serveru
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo rm -rf /tmp/article-order* /tmp/eso-direct* /tmp/eso-market* /tmp/apolena* /tmp/nasekadan-deploy* 2>/dev/null || true
          avail=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "${avail:-0}" -lt 153600 ]; then
            sudo docker builder prune -af >/dev/null 2>&1 || true
            sudo journalctl --vacuum-size=80M >/dev/null 2>&1 || true
          fi
          sudo install -d -m 0755 /var/www/nasekadan /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          REMOTE

      - name: Nasadit proudově bez zápisu archivu do tmp
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nasekadan-stream"
          tar -C "$bundle" -czf - . | ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'set -euo pipefail; exec 9>/var/lock/nasekadan-content.lock; flock -x 9; root=/var/www/nasekadan; sudo tar -xzf - -C "$root"; sudo chmod -R a+rX "$root"; if sudo docker inspect nasekadan-web >/dev/null 2>&1; then sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social; sudo tar -C "$root" -czf - index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt clanky social | sudo docker exec -i nasekadan-web tar -xzf - -C /usr/share/nginx/html; fi'

      - name: Veřejně ověřit článek i všechny publikační povrchy
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for n in $(seq 1 15); do
            stamp="${GITHUB_RUN_ID}-$(date +%s)-$n"
            article="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/clanky/$APOLENA_SLUG.html?verify=$stamp" || true)"
            home="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/?verify=$stamp" || true)"
            archive="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/clanky/?verify=$stamp" || true)"
            rss="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/rss.xml?verify=$stamp" || true)"
            sitemap="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/sitemap.xml?verify=$stamp" || true)"
            news="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/news-sitemap.xml?verify=$stamp" || true)"
            health="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/deployment-health.txt?verify=$stamp" || true)"
            image_bytes="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/social/$APOLENA_SLUG.png?verify=$stamp" | wc -c | tr -d ' ' || true)"
            if grep -Fq 'Kadaňská tyčkařka Apolena Švábíková míří na první seniorské ME' <<<"$article" \
              && grep -Fq 'Amálie Švábíková naopak v Birminghamu startovat nebude' <<<"$article" \
              && grep -Fq '4,51' <<<"$article" \
              && grep -Fq '20:05' <<<"$article" \
              && grep -Fq "data-latest-article-href=\"/clanky/$APOLENA_SLUG.html\"" <<<"$home" \
              && grep -Fq "$APOLENA_SLUG.html" <<<"$archive" \
              && grep -Fq "$APOLENA_SLUG.html" <<<"$rss" \
              && grep -Fq "$APOLENA_SLUG.html" <<<"$sitemap" \
              && grep -Fq "$APOLENA_SLUG.html" <<<"$news" \
              && grep -Fq 'mode=direct-apolena-publication' <<<"$health" \
              && [ "${image_bytes:-0}" -gt 20000 ]; then
              success=1
              break
            fi
            sleep $((n * 3))
          done
          test "$success" = 1
          echo 'Apolena je veřejně ověřena na článku, titulce, archivu, RSS, obou sitemapách, obrázku a health souboru.'

      - name: Uzavřít incident po úspěchu
        if: success()
        shell: bash
        run: |
          title='[incident] Chronologie článků Naše Kadaň'
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body 'Proudové nasazení bez ukládání archivu do serverového /tmp prošlo. Článek Apoleny Švábíkové, titulka, archiv, RSS, obě sitemapy, obrázek a deployment-health.txt byly veřejně ověřeny.'
            gh issue close "$issue" --reason completed
          fi

      - name: Založit incident při selhání
        if: failure()
        shell: bash
        run: |
          title='[incident] Chronologie článků Naše Kadaň'
          body="Proudové nasazení nebo veřejná kontrola selhaly. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
