name: Kanonická kontrola chronologie článků Naše Kadaň

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nasekadan-canonical-article-order
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sestavit titulku a archiv podle prvního zveřejnění
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kontrola chronologie'
          git config user.email 'info@nasekadan.cz'

          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            ! grep -E 'HOMEPAGE_PIN_|NK-TEMP-STADIUM-PIN|pin_active|pin_href' \
              scripts/enforce_article_visibility.py scripts/enforce_all_article_visibility.py
            python3 -m py_compile scripts/enforce_article_visibility.py scripts/enforce_all_article_visibility.py
            python3 scripts/enforce_all_article_visibility.py
            sed -i 's/[[:space:]]\+$//' index.html sitemap.xml clanky/index.html clanky/strana-*.html
            git diff --check

            git add index.html clanky/index.html sitemap.xml
            find clanky -maxdepth 1 -type f -name 'strana-*.html' -print0 | xargs -0 -r git add --
            if ! git diff --cached --quiet; then
              git commit -m 'Automaticky srovnat pořadí článků podle zveřejnění'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1

      - name: Připravit očekávané pořadí
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY' > "$RUNNER_TEMP/order.txt"
          from pathlib import Path
          import importlib.util, re

          spec = importlib.util.spec_from_file_location('visibility', Path('scripts/enforce_article_visibility.py'))
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          items = []
          for path in Path('clanky').glob('*.html'):
              if path.name == 'index.html' or re.fullmatch(r'strana-\d+\.html', path.name):
                  continue
              item = module.article_info(path)
              if item:
                  items.append(item)
          items.sort(key=lambda item: item['dt'], reverse=True)
          if len(items) < 3:
              raise SystemExit('Pro kontrolu chybějí alespoň tři články.')
          for item in items[:3]:
              print(item['href'])
          PY
          mapfile -t ORDER < "$RUNNER_TEMP/order.txt"
          echo "latest=${ORDER[0]}" >> "$GITHUB_OUTPUT"
          echo "second=${ORDER[1]}" >> "$GITHUB_OUTPUT"
          echo "third=${ORDER[2]}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Nasadit titulku a celý archiv
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

          bundle="$RUNNER_TEMP/article-order"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky"
          cp index.html sitemap.xml "$bundle/"
          cp clanky/*.html "$bundle/clanky/"
          cat > "$bundle/deployment-health.txt" <<EOF
          status=ok
          source=${{ steps.expected.outputs.source_sha }}
          article_order=published-time-only
          latest=${{ steps.expected.outputs.latest }}
          second=${{ steps.expected.outputs.second }}
          third=${{ steps.expected.outputs.third }}
          deployed_at=$(date -u +%FT%TZ)
          EOF
          tar -C "$bundle" -czf "$RUNNER_TEMP/article-order.tgz" .

          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/article-order.tgz" ubuntu@57.129.43.215:/tmp/article-order.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          rm -rf /tmp/article-order
          mkdir -p /tmp/article-order
          tar -xzf /tmp/article-order.tgz -C /tmp/article-order
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 /tmp/article-order/index.html /var/www/nasekadan/index.html
          sudo install -m 0644 /tmp/article-order/sitemap.xml /var/www/nasekadan/sitemap.xml
          sudo install -m 0644 /tmp/article-order/deployment-health.txt /var/www/nasekadan/deployment-health.txt
          sudo find /var/www/nasekadan/clanky -maxdepth 1 -type f -name 'strana-*.html' -delete
          for file in /tmp/article-order/clanky/*.html; do
            sudo install -m 0644 "$file" "/var/www/nasekadan/clanky/$(basename "$file")"
          done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/article-order/index.html nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp /tmp/article-order/sitemap.xml nasekadan-web:/usr/share/nginx/html/sitemap.xml
            sudo docker cp /tmp/article-order/deployment-health.txt nasekadan-web:/usr/share/nginx/html/deployment-health.txt
            sudo docker exec nasekadan-web sh -c "find /usr/share/nginx/html/clanky -maxdepth 1 -type f -name 'strana-*.html' -delete"
            sudo docker cp /tmp/article-order/clanky/. nasekadan-web:/usr/share/nginx/html/clanky/
          fi
          rm -rf /tmp/article-order /tmp/article-order.tgz
          REMOTE

      - name: Veřejně porovnat titulku s archivem
        shell: bash
        env:
          LATEST: ${{ steps.expected.outputs.latest }}
          SECOND: ${{ steps.expected.outputs.second }}
          THIRD: ${{ steps.expected.outputs.third }}
          SOURCE_SHA: ${{ steps.expected.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, time
          from urllib.request import Request, urlopen

          expected = [os.environ['LATEST'], os.environ['SECOND'], os.environ['THIRD']]
          source = os.environ['SOURCE_SHA']

          def get(url: str) -> str:
              request = Request(url, headers={
                  'User-Agent': 'NaseKadan-article-order-guard/3.1',
                  'Cache-Control': 'no-cache',
              })
              with urlopen(request, timeout=40) as response:
                  return response.read().decode('utf-8', 'replace')

          last_error = None
          for attempt in range(15):
              nonce = f'{int(time.time())}-{attempt}'
              try:
                  home = get(f'https://nasekadan.cz/?order={nonce}')
                  archive = get(f'https://nasekadan.cz/clanky/?order={nonce}')
                  health = get(f'https://nasekadan.cz/deployment-health.txt?order={nonce}')

                  hero = re.search(
                      r'<section\b[^>]*class="[^"]*\bhero\b[^"]*"[^>]*id="clanky"[^>]*>.*?</section>',
                      home, re.S | re.I,
                  )
                  if not hero or f'data-latest-article-href="{expected[0]}"' not in hero.group(0):
                      raise RuntimeError('Hlavní článek není první podle data zveřejnění.')

                  aside = re.search(
                      r'<aside\b[^>]*class="[^"]*current-aside[^"]*"[^>]*>.*?</aside>',
                      hero.group(0), re.S | re.I,
                  )
                  if not aside or expected[1] not in aside.group(0):
                      raise RuntimeError('Boční článek není druhý podle data zveřejnění.')

                  cards = re.findall(
                      r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="(/clanky/[^"]+\.html)".*?</article>',
                      home, re.S | re.I,
                  )
                  archive_cards = re.findall(
                      r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="(/clanky/[^"]+\.html)".*?</article>',
                      archive, re.S | re.I,
                  )
                  if not cards or cards[0] != expected[2]:
                      raise RuntimeError('První běžná karta není třetí podle data zveřejnění.')
                  if archive_cards[:3] != expected:
                      raise RuntimeError(f'Archiv má jiné pořadí: {archive_cards[:5]}')
                  if f'source={source}' not in health or 'article_order=published-time-only' not in health:
                      raise RuntimeError('Nasazená verze nebyla potvrzena stavovým souborem.')

                  print('Chronologie veřejně ověřena:', expected)
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(8)
          else:
              raise SystemExit(f'Veřejná kontrola neprošla: {last_error}')
          PY

      - name: Založit incident při selhání
        if: failure()
        shell: bash
        run: |
          title='[incident] Chronologie článků Naše Kadaň'
          body="Sestavení, nasazení nebo veřejná kontrola chronologie selhaly. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
