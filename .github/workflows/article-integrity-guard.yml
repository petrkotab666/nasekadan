name: Kanonická kontrola chronologie článků Naše Kadaň

# Automatické nasazování z tohoto historického guardu je vypnuté.
# Guard byl původně napsán pro Gymnastiku jako nejnovější článek a po vydání
# dalších textů mohl vracet produkci na starší stav. Kanonický deploy se nyní
# spouští pouze explicitními publikačními workflow nad aktuálním main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-source-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit, že zdrojové kanály mají stejné nejnovější články
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          expected = [
              'mestska-policie-kadan-fakta-diskuse-2026',
              'gymnastika-kadan-treneri-prosinec-2026',
              'apolena-svabikova-mistrovstvi-evropy-birmingham-2026',
              'eso-market-rafanda-kadan-24-7',
          ]

          files = {
              'homepage': Path('index.html'),
              'archive': Path('clanky/index.html'),
              'rss': Path('rss.xml'),
          }
          for label, path in files.items():
              text = path.read_text(encoding='utf-8')
              pos = [text.find(slug + '.html') for slug in expected]
              if not all(p >= 0 for p in pos):
                  raise SystemExit(f'{label}: chybí některý z nejnovějších článků: {pos}')
              if pos != sorted(pos):
                  raise SystemExit(f'{label}: nesprávné pořadí nejnovějších článků: {pos}')

          home = files['homepage'].read_text(encoding='utf-8')
          marker = 'data-latest-article-href="/clanky/mestska-policie-kadan-fakta-diskuse-2026.html"'
          if marker not in home:
              raise SystemExit('Titulka nemá Městskou policii jako nejnovější článek.')
          print('Zdrojová chronologie je v pořádku; tento guard nic nenasazuje.')
          PY
