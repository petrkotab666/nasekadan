name: Sjednotit článek o soukromé e-petici

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_epetice_private_portal_refs.py'
      - '.github/workflows/fix-epetice-private-portal.yml'
      - '.github/fix-epetice-private-portal-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-epetice-private-portal
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stáhnout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sjednotit všechny odkazy a výstupy
        run: python3 scripts/sync_epetice_private_portal_refs.py

      - name: Uložit sjednocené výstupy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň editor'
          git config user.email 'info@nasekadan.cz'
          git add index.html clanky/index.html rss.xml llms.txt news-sitemap.xml
          if git diff --cached --quiet; then
            echo 'Všechny odkazy už odpovídají aktuálnímu článku.'
            exit 0
          fi
          git commit -m 'Sjednotit odkazy na článek o soukromé e-petici'
          git pull --rebase origin main
          git push origin main
