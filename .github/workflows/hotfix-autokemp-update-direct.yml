name: Přímý hotfix aktualizace Autokempu

on:
  push:
    branches: [main]
    paths:
      - '.github/autokemp-update-hotfix-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-autokemp-update-hotfix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Připravit SSH klíč
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nahrát aktualizovaný článek přímo na živý web
        id: deploy
        run: |
          set -euo pipefail
          article='clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html'
          grep -Fq 'Na 14. srpna jsou zveřejněna dvě samostatná oznámení' "$article"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$article" ubuntu@57.129.43.215:/tmp/nk-autokemp-update.html
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 /tmp/nk-autokemp-update.html /var/www/nasekadan/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-autokemp-update.html nasekadan-web:/usr/share/nginx/html/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html
          fi
          rm -f /tmp/nk-autokemp-update.html
          grep -Fq 'Na 14. srpna jsou zveřejněna dvě samostatná oznámení' /var/www/nasekadan/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web grep -Fq 'Na 14. srpna jsou zveřejněna dvě samostatná oznámení' /usr/share/nginx/html/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html
          fi
          REMOTE

      - name: Veřejně ověřit nový odstavec
        id: verify
        run: |
          set -euo pipefail
          url='https://nasekadan.cz/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html'
          for attempt in $(seq 1 24); do
            body="$(curl -4 -kfsS --max-time 20 "$url?hotfix=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq 'Na 14. srpna jsou zveřejněna dvě samostatná oznámení' <<<"$body" \
              && grep -Fq 'Prunéřov, Nová Víska a Místo' <<<"$body" \
              && grep -Fq '2026-07-30T01:45:00+02:00' <<<"$body"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Zapsat stav hotfixu
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = '.github/autokemp-update-hotfix-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              server_deploy: process.env.DEPLOY_OUTCOME || 'skipped',
              public_verification: process.env.VERIFY_OUTCOME || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat stav přímé aktualizace Autokempu: ${status.status}`,
              content,
              ...(sha ? {sha} : {})
            });
