name: Opravit affiliate snapshoty přes ověřený PR běh

on:
  pull_request:
    branches: [main]
    paths: ['.github/affiliate-cross-repo-repair-pr-trigger.txt']

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      T_GH_PAT: ${{ secrets.GH_PAT }}
      T_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      T_PAT: ${{ secrets.PAT }}
      T_PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      T_PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      T_CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
      T_REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      T_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      T_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      T_AUTOMATION_PAT: ${{ secrets.AUTOMATION_PAT }}
      T_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      T_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      T_GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_ACCESS_TOKEN }}
      T_CENTRAL_REPO_TOKEN: ${{ secrets.CENTRAL_REPO_TOKEN }}
      T_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Bezpečně opravit a bajtově ověřit cílové snapshoty
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com'
          names='T_GH_PAT T_GITHUB_PAT T_PAT T_PAT_TOKEN T_PERSONAL_ACCESS_TOKEN T_CROSS_REPO_TOKEN T_REPO_TOKEN T_PRIVATE_REPO_TOKEN T_DEPLOY_TOKEN T_AUTOMATION_PAT T_BOT_TOKEN T_ACCESS_TOKEN T_GITHUB_ACCESS_TOKEN T_CENTRAL_REPO_TOKEN T_SYNC_TOKEN'

          select_token() {
            local repo="$1" name value code push
            SELECTED_TOKEN=''; SELECTED_NAME=''
            for name in $names; do
              value="${!name:-}"; [ -n "$value" ] || continue
              code=$(curl -sS -o /tmp/repo.json -w '%{http_code}' -H "Authorization: Bearer $value" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api/repos/$repo" || true)
              if [ "$code" = 200 ] && [ "$(jq -r '.permissions.push // false' /tmp/repo.json)" = true ]; then SELECTED_TOKEN="$value"; SELECTED_NAME="$name"; return 0; fi
            done
            return 1
          }

          put_file() {
            local repo="$1" source="$2" target="$3" message="$4" meta sha payload code
            meta=$(curl -fsSL -H "Authorization: Bearer $SELECTED_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api/repos/$repo/contents/$target?ref=main")
            sha=$(jq -r '.sha' <<< "$meta")
            payload=$(jq -n --arg message "$message" --arg content "$(base64 -w0 "$source")" --arg sha "$sha" '{message:$message,content:$content,sha:$sha,branch:"main"}')
            code=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $SELECTED_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' -d "$payload" "$api/repos/$repo/contents/$target" || true)
            [ "$code" = 200 ] || { echo "$repo $target: HTTP $code"; cat /tmp/put.json; return 1; }
          }

          verify_file() {
            local repo="$1" source="$2" target="$3" expected got
            expected=$(sha256sum "$source" | awk '{print $1}')
            curl -fsSL -H "Authorization: Bearer $SELECTED_TOKEN" -H 'Accept: application/vnd.github.raw+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api/repos/$repo/contents/$target?ref=main" -o /tmp/remote
            got=$(sha256sum /tmp/remote | awk '{print $1}')
            [ "$got" = "$expected" ]
          }

          repair() {
            local repo="$1" key="$2" expected_config="$3" base="reports/affiliate-repair-generated/$key" config_hash
            echo "Kontrola $repo"
            select_token "$repo" || { echo "$repo: NO_PUSH_TOKEN"; return 0; }
            echo "$repo: token=$SELECTED_NAME"
            curl -fsSL -H "Authorization: Bearer $SELECTED_TOKEN" -H 'Accept: application/vnd.github.raw+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api/repos/$repo/contents/assets/affiliate-site-config.json?ref=main" -o /tmp/config
            config_hash=$(sha256sum /tmp/config | awk '{print $1}')
            [ "$config_hash" = "$expected_config" ] || { echo "$repo: CONFIG_CHANGED $config_hash"; return 0; }
            put_file "$repo" "$base/affiliate-site-snapshot.js" 'assets/affiliate-site-snapshot.js' 'Opravit kanonický affiliate JavaScript snapshot [skip ci]'
            put_file "$repo" "$base/affiliate-site-snapshot.json" 'assets/affiliate-site-snapshot.json' 'Opravit kanonický affiliate snapshot [skip ci]'
            verify_file "$repo" "$base/affiliate-site-snapshot.js" 'assets/affiliate-site-snapshot.js'
            verify_file "$repo" "$base/affiliate-site-snapshot.json" 'assets/affiliate-site-snapshot.json'
            echo "$repo: REPAIRED_AND_VERIFIED"
          }

          repair 'petrkotab666/nakupvakci' 'nakupvakci' '4e176534e6898093659d82eadc0a2ca201604d7a07ff6c1c91c1b76c6d84c781'
          repair 'petrkotab666/testywebu' 'testywebu' 'b7c2e81557138c9572d3d53a8ba02fa12493e1392a2da86fe34c86695ebe756f'
