name: Jednorázově nasadit výsledky ankety SMR

on:
  schedule:
    - cron: '40,45,50,55 4 1 8 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-poll-results-scheduled
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Uplatnit trvalé redakční pravidlo
        shell: bash
        run: python3 scripts/apply_editorial_rules.py
      - name: Nasadit a veřejně ověřit živé výsledky ankety
        shell: bash
        run: bash scripts/deploy_poll_results.sh
