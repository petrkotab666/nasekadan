name: Publikovat přehled kadaňských hřišť ve 4:00

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_kadanska_hriste_20260806.py'
      - 'scripts/run_publish_kadanska_hriste_20260806.sh'
      - '.github/workflows/publish-kadanska-hriste-20260806.yml'
  schedule:
    - cron: '0 2 6 8 *'
    - cron: '7 2 6 8 *'
    - cron: '17 2 6 8 *'
    - cron: '32 2 6 8 *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-kadanska-hriste-20260806
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ověřit syntaxi a sestavení článku bez publikace
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet Pillow
          python3 -m py_compile scripts/publish_kadanska_hriste_20260806.py
          bash -n scripts/run_publish_kadanska_hriste_20260806.sh
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('scripts/publish_kadanska_hriste_20260806.py')
          spec=importlib.util.spec_from_file_location('playgrounds',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          html=module.article_page()
          assert '<h1>Jak se Kadaň stará o svá hřiště?' in html
          assert '5.4 · Chomutovská u čp. 1229' in html
          assert '4.1 · centrální hřiště na sídlišti E' in html
          assert '2. dubna 2026 přímo pro hřiště 6.1' in html
          module.make_social()
          assert module.SOCIAL.exists() and module.SOCIAL.stat().st_size > 10000
          print('Předpublikační sestavení je v pořádku.')
          PY
      - name: Zapsat nezávislý doklad kontroly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/kadanska-hriste-publication-preflight-20260805
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          data={
            'status':'ok',
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'source_commit':os.environ.get('GITHUB_SHA'),
            'checks':[
              'python syntax', 'shell syntax', 'article rendering',
              'required findings present', 'social image generated and over 10 kB'
            ],
            'scheduled_publication':'2026-08-06T04:00:00+02:00',
            'backup_runs':['04:07','04:17','04:32'],
          }
          Path('research/kadanska-hriste-publication-preflight-20260805/STATUS.json').write_text(
            json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'Naše Kadaň publikační kontrola'
          git config user.email 'info@nasekadan.cz'
          git add research/kadanska-hriste-publication-preflight-20260805/STATUS.json
          git commit -m 'Předpublikační kontrola hřišť: OK' || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1

  publish:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publikovat, nasadit a veřejně ověřit
        shell: bash
        run: bash scripts/run_publish_kadanska_hriste_20260806.sh
