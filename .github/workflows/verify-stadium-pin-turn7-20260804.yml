name: Ověřit živé připnutí zimního stadionu – kontrola 20:26

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-stadium-pin-turn7-20260804.yml'

permissions:
  contents: write

concurrency:
  group: verify-stadium-pin-turn7-20260804
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Veřejně ověřit titulku, chronologii a počasí
        shell: bash
        run: |
          set -euo pipefail
          pin='/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          ok=0
          for attempt in $(seq 1 18); do
            q="${GITHUB_RUN_ID}-$(date +%s)-${attempt}"
            home="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/?turn7=$q" || true)"
            article="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz${pin}?turn7=$q" || true)"
            archive="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/clanky/?turn7=$q" || true)"
            rss="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/rss.xml?turn7=$q" || true)"
            forecast="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/api/pocasi-predpoved.json?turn7=$q" || true)"
            if PIN="$pin" HOME_HTML="$home" ARTICLE_HTML="$article" ARCHIVE_HTML="$archive" RSS_XML="$rss" FORECAST_JSON="$forecast" python3 - <<'PY'
          import json, os, re
          from xml.etree import ElementTree as ET
          pin=os.environ['PIN']; home=os.environ['HOME_HTML']; article=os.environ['ARTICLE_HTML']
          archive=os.environ['ARCHIVE_HTML']; rss=os.environ['RSS_XML']; forecast=os.environ['FORECAST_JSON']
          hero=re.search(r'<section class="wrap hero" id="clanky".*?</section>', home, re.S)
          assert hero and f'data-latest-article-href="{pin}"' in hero.group(0)
          first_archive=re.search(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="([^"]+)"', archive, re.S)
          assert first_archive
          latest=first_archive.group(1)
          assert latest != pin
          aside=re.search(r'<aside class="current-aside">.*?</aside>', hero.group(0), re.S)
          assert aside and f'href="{latest}"' in aside.group(0)
          assert '/pocasi.js' in home
          assert 'article:published_time" content="2026-08-03T22:05:00+02:00"' in article
          root=ET.fromstring(rss)
          assert root.findtext('./channel/item/link') == 'https://nasekadan.cz' + latest
          data=json.loads(forecast)
          timeseries=data.get('properties',{}).get('timeseries')
          assert isinstance(timeseries, list) and timeseries
          print(latest)
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1

      - name: Zapsat ověřený stav
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          status={
            'checked_at': datetime.now(timezone.utc).isoformat(),
            'homepage_pin': '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html',
            'homepage_pin_ok': True,
            'aside_matches_live_archive_latest': True,
            'article_published_time_preserved': '2026-08-03T22:05:00+02:00',
            'archive_chronology_ok': True,
            'rss_chronology_ok': True,
            'weather_loader_ok': True,
            'weather_forecast_timeseries_ok': True,
            'result': 'success'
          }
          Path('.github/stadium-pin-automation-turn7-status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'Naše Kadaň – veřejná kontrola'
          git config user.email 'info@nasekadan.cz'
          git add .github/stadium-pin-automation-turn7-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Zapsat veřejné ověření připnutí a počasí'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              git push origin HEAD:main && exit 0
              sleep $((attempt * 3))
            done
            exit 1
          fi

# Druhý commit aktivuje push trigger po založení workflow.
