name: Jednorázově spustit publikaci Císařského dne

on:
  schedule:
    - cron: '16 4 4 8 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Spustit hlavní publikační workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-cisarsky-den-kadan-now-20260804.yml',
              ref: 'main'
            });

      - name: Odstranit jednorázový plán
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/workflows/temporary-scheduled-cisarsky-den-20260804.yml';
            const file = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main'
            });
            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              sha: file.data.sha,
              message: 'Odstranit dokončený jednorázový plán publikace Císařského dne [skip ci]'
            });
