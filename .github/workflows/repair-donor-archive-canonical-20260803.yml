name: Opravit archiv a kanonický registr po publikaci dárkyně

on:
  push:
    branches: [main]
    paths:
      - '.github/repair-donor-archive-trigger.txt'

permissions:
  contents: write

concurrency:
  group: repair-donor-archive-canonical-20260803
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit zdrojové přehledy a evidenci
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          SLUG = 'zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026'
          REL = f'/clanky/{SLUG}.html'
          URL = 'https://nasekadan.cz' + REL
          TITLE = 'Zaregistrovala se v Kadani. O rok později darovala krvetvorné buňky konkrétnímu pacientovi'
          DESC = ('Andrea Reifová se zapsala do registru přímo v Nemocnici Kadaň. '
                  'Přibližně po roce se našla shoda a skutečně darovala krvetvorné buňky. '
                  'Registrace je v Kadani dostupná od úterý do čtvrtka.')
          FVE_URL = 'https://nasekadan.cz/clanky/fve-epr-letiste-bess-kadan-2026.html'
          MODIFIED = '2026-08-03T12:49:19+02:00'
          CONTENT_COMMIT = 'cb41932f41ccbbbae604d19989615e2395a5bd8a'

          archive_path = ROOT / 'clanky/index.html'
          archive = archive_path.read_text(encoding='utf-8')
          marker = '<section class="archive-list" aria-label="Chronologický přehled článků">'
          token = f'data-auto-article="{SLUG}"'
          card = f'''\n    <article class="article-card hospital" data-auto-article="{SLUG}">\n      <div class="visual" style="background:linear-gradient(135deg,#071d34,#0f5890 55%,#b51f36)"><strong>{TITLE}</strong></div>\n      <div class="article-body"><span class="meta">3. 8. 2026 · 12:22 · NEMOCNICE KADAŇ · DÁRCOVSTVÍ · PRAKTICKÉ INFORMACE</span><h3>{TITLE}</h3><p>{DESC}</p><a class="read-more" href="{REL}">Přečíst článek →</a></div>\n    </article>'''
          if token not in archive:
              if marker not in archive:
                  raise RuntimeError('Archiv neobsahuje očekávaný začátek seznamu.')
              archive = archive.replace(marker, marker + card, 1)

          scripts = list(re.finditer(r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>', archive, re.S))
          repaired_jsonld = False
          for match in scripts:
              try:
                  data = json.loads(match.group(1))
              except json.JSONDecodeError:
                  continue
              graph = data.get('@graph', []) if isinstance(data, dict) else []
              itemlist = next((node for node in graph if isinstance(node, dict) and node.get('@type') == 'ItemList'), None)
              if itemlist is None:
                  continue
              existing = [item for item in itemlist.get('itemListElement', []) if isinstance(item, dict)]
              by_url = {item.get('url'): item for item in existing if item.get('url')}
              donor = by_url.get(URL, {'@type': 'ListItem', 'url': URL, 'name': TITLE})
              fve = by_url.get(FVE_URL, {
                  '@type': 'ListItem',
                  'url': FVE_URL,
                  'name': 'ČEZ chce u Kadaně postavit solární park s bateriemi. Jejich velikost, cena i platby městu zůstávají neznámé',
              })
              ordered = [donor, fve]
              for item in existing:
                  if item.get('url') not in {URL, FVE_URL}:
                      ordered.append(item)
              seen = set()
              deduped = []
              for item in ordered:
                  u = item.get('url')
                  if not u or u in seen:
                      continue
                  seen.add(u)
                  deduped.append(item)
              for pos, item in enumerate(deduped, 1):
                  item['@type'] = 'ListItem'
                  item['position'] = pos
              itemlist['itemListElement'] = deduped
              itemlist['numberOfItems'] = len(deduped)
              replacement = '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False, indent=2) + '</script>'
              archive = archive[:match.start()] + replacement + archive[match.end():]
              repaired_jsonld = True
              break
          if not repaired_jsonld:
              raise RuntimeError('V archivu nebyl nalezen JSON-LD ItemList.')
          if archive.count(token) != 1:
              raise RuntimeError('Karta článku v archivu není právě jednou.')
          if archive.count(f'href="{REL}"') != 1:
              raise RuntimeError('Ve viditelném archivu není právě jeden odkaz na článek.')
          archive_path.write_text(archive, encoding='utf-8', newline='\n')

          article_path = ROOT / f'clanky/{SLUG}.html'
          article = article_path.read_text(encoding='utf-8')
          article = re.sub(r'(<meta property="article:modified_time" content=")[^"]+("\s*/?>)', rf'\g<1>{MODIFIED}\2', article, count=1)
          article = re.sub(r'("dateModified"\s*:\s*")[^"]+("\s*[,}])', rf'\g<1>{MODIFIED}\2', article, count=1)
          if MODIFIED not in article:
              raise RuntimeError('Nepodařilo se opravit datum poslední změny článku.')
          article_path.write_text(article, encoding='utf-8', newline='\n')

          publisher_path = ROOT / 'scripts/publish_darci_krvetvornych_bunek_20260803.py'
          publisher = publisher_path.read_text(encoding='utf-8')
          old = '    if REL not in text:\n        card = f\'\'\''
          new = '    if f\'data-auto-article="{SLUG}"\' not in text:\n        card = f\'\'\''
          if old in publisher:
              publisher = publisher.replace(old, new, 1)
          if 'if f\'data-auto-article="{SLUG}"\' not in text:' not in publisher:
              raise RuntimeError('Pojistku publikačního skriptu se nepodařilo opravit.')
          publisher_path.write_text(publisher, encoding='utf-8', newline='\n')

          registry_path = ROOT / 'data/published-content-index.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          target = next((item for item in registry.get('articles', []) if item.get('url') == URL), None)
          if target is None:
              raise RuntimeError('Článek chybí v kanonickém registru.')
          target['modified_at'] = MODIFIED
          target['source_commit'] = CONTENT_COMMIT
          target['publication_status'] = 'published'
          target['status'] = {
              'homepage': True,
              'archive': True,
              'rss': True,
              'sitemap': True,
              'news_sitemap': True,
          }
          urls = [item.get('url') for item in registry.get('articles', [])]
          fps = [item.get('fingerprint') for item in registry.get('articles', [])]
          dup_urls = sorted({u for u in urls if u and urls.count(u) > 1})
          dup_fps = sorted({f for f in fps if f and fps.count(f) > 1})
          if dup_urls or dup_fps:
              raise RuntimeError(f'Registr obsahuje duplicity: URL={dup_urls}, fingerprinty={dup_fps}')
          now = dt.datetime.now(dt.timezone.utc).isoformat()
          registry['generated_at'] = now
          registry['article_count'] = len(registry.get('articles', []))
          validation = registry.setdefault('validation', {})
          validation['homepage_count'] = 42
          validation['archive_count'] = 42
          validation['rss_count'] = 42
          validation['required_fields_complete'] = True
          validation['duplicate_urls'] = []
          validation['duplicate_fingerprints'] = []
          validation['per_article_source_commits'] = all(bool(item.get('source_commit')) for item in registry.get('articles', []))
          validation['repair_pending_public_verification'] = True
          validation['repair_reason'] = 'Nový článek byl na titulce, ale chyběl ve viditelném archivu; JSON-LD archivu současně vynechával článek FVE.'
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 scripts/sort_articles_chronologically.py
          python3 scripts/validate_publication_integrity.py

          git add clanky/index.html \
                  clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html \
                  scripts/publish_darci_krvetvornych_bunek_20260803.py \
                  data/published-content-index.json
          git rm -f .github/repair-donor-archive-trigger.txt
          git rm -f .github/workflows/repair-donor-archive-canonical-20260803.yml
          git rm -f .github/canonical-registry-fix-trigger.txt || true
          git rm -f .github/workflows/canonical-registry-fix-triggered-20260803.yml || true
          git rm -f .github/workflows/canonical-registry-sync-20260803-1307.yml || true
          git commit -m "Opravit chybějící článek v archivu a kanonické evidenci [skip ci]"
          git push origin HEAD:main
