name: Opravit stav kanonické evidence po chybě archivu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mark-canonical-archive-repair-pending-20260804.yml'

permissions:
  contents: write

concurrency:
  group: canonical-published-index-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Zapsat skutečný veřejný stav a čekající nasazení opravy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime, json, subprocess
          from pathlib import Path

          registry_path=Path('data/published-content-index.json')
          status_path=Path('.github/canonical-published-index-status.json')
          data=json.loads(registry_path.read_text(encoding='utf-8'))
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          target='https://nasekadan.cz/clanky/cisarsky-den-kadan-historie-2026.html'
          changes=[]
          for article in data['articles']:
              path=article.get('source_path')
              if path:
                  latest=subprocess.check_output(['git','log','-1','--format=%H','--',path],text=True).strip()
                  if latest and latest != article.get('source_commit'):
                      changes.append({'url':article['url'],'from':article.get('source_commit',''),'to':latest})
                      article['source_commit']=latest
              if article['url']==target:
                  article.setdefault('status',{})['homepage']=True
                  article['status']['archive']=False
                  article['status']['rss']=True
                  article['status']['sitemap']=True
                  article['status']['news_sitemap']=True
                  article['publication_status']='published_partial_distribution'

          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          data['generated_at']=now
          data['source_commit']=head
          data['article_count']=45
          validation=data.setdefault('validation',{})
          validation.update({
              'homepage_count':14,
              'archive_count':44,
              'archive_page_count':4,
              'rss_count':45,
              'sitemap_all_articles_present':True,
              'news_sitemap_recent_count':8,
              'deployment_health':'repair_deploy_pending',
              'required_fields_complete':True,
              'duplicate_urls':[],
              'duplicate_fingerprints':[],
              'per_article_source_commits':all(bool(a.get('source_commit')) for a in data['articles']),
              'repair_pending_public_verification':True,
              'rss_order_matches_archive':False,
              'public_audit_at':now,
              'public_repair_verification':{
                  'status':'pending_production_deploy',
                  'method':'live-web-plus-repository-structure-audit',
                  'homepage_articles':14,
                  'archive_articles':44,
                  'archive_pages':4,
                  'rss_articles':45,
                  'sitemap_articles':45,
                  'news_sitemap_articles':8,
                  'target_visible_on_homepage':True,
                  'target_visible_in_archive':False,
                  'repository_archive_repaired':True,
                  'repair_trigger_commit':'106ef514b7652e485586c235c284e2a3a5c4d293',
                  'repair_commit':'7ab6bfda33dc08577ec05c2c6a5e3ca23467bf30',
                  'production_deploy_state':'queued_or_pending',
                  'completed_at':now
              },
              'last_registry_refresh':{
                  'reason':'public archive omitted the 45th article although homepage, RSS, sitemaps and registry already included it; repository pagination was regenerated and deployment is pending',
                  'classification':'safe_repair_pending_public_verification',
                  'repaired_url':target,
                  'trigger_commit':'106ef514b7652e485586c235c284e2a3a5c4d293',
                  'repair_commit':'7ab6bfda33dc08577ec05c2c6a5e3ca23467bf30',
                  'changed_source_commits':changes,
                  'homepage_articles':14,
                  'archive_articles':44,
                  'archive_pages':4,
                  'rss_articles':45,
                  'sitemap_articles':45,
                  'news_sitemap_articles':8,
                  'completed_at':now
              }
          })
          registry_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          status={
              'status':'repair_pending_public_verification',
              'checked_at':now,
              'registry_publicly_verified':False,
              'article_count':45,
              'homepage_count':14,
              'archive_count':44,
              'archive_page_count':4,
              'rss_count':45,
              'sitemap_count':45,
              'news_sitemap_count':8,
              'duplicate_urls':[],
              'duplicate_fingerprints':[],
              'rss_order_matches_archive':False,
              'all_public_h1_checked':False,
              'changed_source_commits':changes,
              'significant_mismatch':{
                  'article':target,
                  'homepage':True,
                  'archive':False,
                  'repository_archive_repaired':True,
                  'repair_trigger_commit':'106ef514b7652e485586c235c284e2a3a5c4d293',
                  'repair_commit':'7ab6bfda33dc08577ec05c2c6a5e3ca23467bf30',
                  'production_deploy_state':'queued_or_pending'
              }
          }
          status_path.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Uložit opravenou evidenci
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/published-content-index.json .github/canonical-published-index-status.json
          git commit -m 'Označit opravu archivu jako čekající na veřejné nasazení [skip ci]'
          for n in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git pull --rebase origin main
            test "$n" != 5
            sleep $((n*4))
          done
      - name: Odstranit jednorázový zápis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main && git reset --hard origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/mark-canonical-archive-repair-pending-20260804.yml
          git add -A .github/workflows/mark-canonical-archive-repair-pending-20260804.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Odstranit jednorázový zápis čekající opravy [skip ci]'
            for n in 1 2 3 4 5; do
              git push origin HEAD:main && break
              git pull --rebase origin main
              test "$n" != 5
              sleep $((n*4))
            done
          fi
