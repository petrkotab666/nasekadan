name: Jednorázově opravit stavové commity po deployi

on:
  push:
    branches:
      - fix/deploy-source-status-loop-20260731
    paths:
      - '.github/fix-deploy-source-status-loop-trigger.txt'
      - '.github/workflows/fix-deploy-source-status-loop-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deploy-source-status-loop-20260731
          fetch-depth: 0

      - name: Přesměrovat provozní stav pouze do souhrnu běhu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          guard=Path('.github/workflows/publication-integrity-guard.yml')
          text=guard.read_text(encoding='utf-8')
          marker='      - name: Zapsat stav trvalé pojistky\n'
          if marker not in text:
              raise SystemExit('V guard workflow chybí očekávaný stavový krok.')
          text=text.split(marker,1)[0]+'''      - name: Zapsat stav trvalé pojistky do souhrnu běhu
        if: always() && steps.manifest.outputs.count != '0'
        shell: bash
        env:
          INITIAL: ${{ steps.initial.outcome }}
          REPAIR: ${{ steps.repair.outcome }}
          FINAL: ${{ steps.final.outcome }}
          FACEBOOK: ${{ steps.facebook.outcome }}
        run: |
          {
            echo '## Trvalá publikační pojistka'
            echo "- První veřejná kontrola: ${INITIAL:-skipped}"
            echo "- Samooprava: ${REPAIR:-not_needed}"
            echo "- Konečná veřejná kontrola: ${FINAL:-skipped}"
            echo "- Facebook: ${FACEBOOK:-not_needed}"
            echo "- Run ID: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
'''
          guard.write_text(text,encoding='utf-8',newline='\n')

          deploy=Path('.github/workflows/deploy-ovh.yml')
          text=deploy.read_text(encoding='utf-8')
          marker='      - name: Zapsat stav vlastního nasazení\n'
          if marker not in text:
              raise SystemExit('V deploy workflow chybí očekávaný stavový krok.')
          text=text.split(marker,1)[0]+'''      - name: Zapsat stav vlastního nasazení do souhrnu běhu
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          WATER_OUTCOME: ${{ steps.verify_water.outcome }}
        run: |
          {
            echo '## Kanonické nasazení Naše Kadaň'
            echo "- Deploy: ${DEPLOY_OUTCOME:-unknown}"
            echo "- Veřejná kontrola: ${WATER_OUTCOME:-unknown}"
            echo "- Trigger commit: $GITHUB_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
'''
          deploy.write_text(text,encoding='utf-8',newline='\n')
          PY

      - name: Uložit opravu do servisní větve
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň technická oprava'
          git config user.email 'info@nasekadan.cz'
          git add .github/workflows/publication-integrity-guard.yml .github/workflows/deploy-ovh.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Zabránit stavovým commitům rozbíjet shodu produkčního source'
          git push origin HEAD:fix/deploy-source-status-loop-20260731
