name: Ověřit statistiky posledních 25 článků

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/nasekadan-stats/**'
      - '.github/workflows/verify-stats-latest-25.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-stats-latest-25
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"

      - name: Nasadit a ověřit posledních 25 článků
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ssh -i "$RUNNER_TEMP/key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE' 2>&1 | tee "$RUNNER_TEMP/latest-25.txt"
          set -Eeuo pipefail
          sudo -n true
          cd /opt/nasekadan

          # Odstranit pouze osiřelý lock; na produkčním klonu neprobíhají ruční commity.
          sudo rm -f .git/index.lock
          git fetch --prune origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          set +e
          sudo bash .github/scripts/nasekadan-stats/install-stats.sh
          install_code=$?
          set -e

          if [[ "$install_code" -ne 0 ]]; then
            echo '=== STAV SLUŽBY PO NEÚSPĚŠNÉ INSTALACI ==='
            systemctl status nasekadan-stats-web.service --no-pager -l || true
            echo '=== POSLEDNÍ LOGY SLUŽBY ==='
            journalctl -u nasekadan-stats-web.service -n 120 --no-pager || true
            echo '=== RUČNÍ SPUŠTĚNÍ SERVERU ==='
            timeout 8 sudo -u www-data /usr/bin/python3 /usr/local/lib/nasekadan-stats/stats_server_v6.py || true
            exit "$install_code"
          fi

          sudo -u www-data /usr/bin/python3 /opt/nasekadan/.github/scripts/nasekadan-stats/verify_stats_latest_25.py
          systemctl is-active nasekadan-stats-web.service
          curl -fsS --max-time 5 http://127.0.0.1:3225/healthz
          echo 'ÚSPĚCH: nahoře je viditelné tlačítko a tabulka přesně 25 posledních článků.'
          REMOTE

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/latest-25.txt`, 'utf8'); } catch {}
            const ok = process.env.OUTCOME === 'success';
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[STATISTIKY 25 ČLÁNKŮ] ${ok ? 'Úspěšně nasazeno' : 'Nasazení selhalo'} ${new Date().toISOString()}`,
              body: `- Commit: \`${process.env.SOURCE_SHA}\`\n- Výsledek: **${process.env.OUTCOME || 'unknown'}**\n\n\`\`\`text\n${log.slice(-30000).replace(/```/g, '---')}\n\`\`\``
            });
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.data.number, state: 'closed', state_reason: 'completed'});

      - name: Selhat při neověřeném nasazení
        if: steps.verify.outcome != 'success'
        run: exit 1
