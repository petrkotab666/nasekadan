name: Ověřit statistiky posledních 25 článků

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/nasekadan-stats/**'
      - '.github/workflows/verify-stats-latest-25.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-stats-latest-25
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"

      - name: Nasadit a ověřit posledních 25 článků
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ssh -i "$RUNNER_TEMP/key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE' | tee "$RUNNER_TEMP/latest-25.txt"
          set -Eeuo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          sudo bash .github/scripts/nasekadan-stats/install-stats.sh

          sudo -u www-data bash -lc 'cd /usr/local/lib/nasekadan-stats && python3 - <<"PY"
          import json
          import re
          import sys
          sys.path.insert(0, "/opt/nasekadan/.github/scripts/nasekadan-stats")
          import stats_metrics_v5
          import stats_metrics_v6
          import stats_metrics_v7
          import stats_server as base

          stats_metrics_v5.install(base)
          stats_metrics_v6.install(base)
          stats_metrics_v7.install(base)
          body = base.render_dashboard().decode("utf-8", "replace")
          recent = stats_metrics_v7.latest_published_articles()
          assert len(recent) == 25, len(recent)
          assert "Posledních 25 publikovaných článků" in body
          table = re.search(r"<table id=\"recent-articles\">(.*?)</table>", body, re.S)
          assert table, "tabulka recent-articles chybí"
          row_count = table.group(1).count("<tr>") - 1
          assert row_count == 25, row_count
          pages = stats_metrics_v6.normalize_counter(stats_metrics_v6.read_persisted().get("pages"))
          output = [
              {
                  "published": item["published"].isoformat(),
                  "path": item["path"],
                  "title": item["title"],
                  "views": pages.get(item["path"], 0),
              }
              for item in recent
          ]
          print(json.dumps({"ok": True, "count": len(output), "articles": output}, ensure_ascii=False))
          PY'

          systemctl is-active nasekadan-stats-web.service
          curl -fsS --max-time 5 http://127.0.0.1:3225/healthz
          echo 'ÚSPĚCH: statistiky obsahují přesně 25 posledních publikovaných článků včetně data, zobrazení a podílů.'
          REMOTE

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/latest-25.txt`, 'utf8'); } catch {}
            const ok = process.env.OUTCOME === 'success';
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[STATISTIKY 25 ČLÁNKŮ] ${ok ? 'Úspěšně nasazeno' : 'Nasazení selhalo'} ${new Date().toISOString()}`,
              body: `- Commit: \`${process.env.SOURCE_SHA}\`\n- Výsledek: **${process.env.OUTCOME || 'unknown'}**\n\n\`\`\`text\n${log.slice(-30000).replace(/```/g, '---')}\n\`\`\``
            });
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.data.number, state: 'closed', state_reason: 'completed'});

      - name: Selhat při neověřeném nasazení
        if: steps.verify.outcome != 'success'
        run: exit 1
