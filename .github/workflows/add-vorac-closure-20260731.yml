name: Doplnit dovolenou kožní ambulance MUDr. Voráče

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-vorac-closure-20260731.yml'
      - 'scripts/add_vorac_closure_20260731.py'
      - '.github/vorac-closure-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-vorac-closure
  cancel-in-progress: true

jobs:
  update-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE: clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html
      URL: https://nasekadan.cz/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html

    steps:
      - name: Načíst hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit kožní ambulanci
        run: python3 scripts/add_vorac_closure_20260731.py

      - name: Ověřit obsah
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-vorac-srpen-2026' "$ARTICLE"
          grep -Fq 'dovolená od <strong>3. do 14. srpna 2026</strong>' "$ARTICLE"
          grep -Fq '474 944 246' "$ARTICLE"
          grep -Fq '731 379 374' "$ARTICLE"
          grep -Fq 'Kožní MUDr. Voráč: dovolená 3.–14. 8.' "$ARTICLE"

      - name: Uložit změnu do main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$ARTICLE" rss.xml; then
            echo 'Článek už obsahuje aktuální údaje.'
          else
            git config user.name 'Naše Kadaň – zdravotní přehled'
            git config user.email 'info@nasekadan.cz'
            git add "$ARTICLE" rss.xml
            git commit -m 'Doplnit dovolenou kožní ambulance MUDr. Voráče'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přímo na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$ARTICLE" rss.xml ubuntu@57.129.43.215:/tmp/
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 /tmp/prakticti-lekari-nemocnice-kadan-srpen-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/rss.xml /var/www/nasekadan/rss.xml
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/prakticti-lekari-nemocnice-kadan-srpen-2026.html nasekadan-web:/usr/share/nginx/html/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html
            sudo docker cp /tmp/rss.xml nasekadan-web:/usr/share/nginx/html/rss.xml
          fi
          rm -f /tmp/prakticti-lekari-nemocnice-kadan-srpen-2026.html /tmp/rss.xml
          REMOTE

      - name: Ověřit veřejnou stránku
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            curl -4 -kfsS --max-time 25 -H 'Cache-Control: no-cache, no-store' \
              "${URL}?vorac=${GITHUB_RUN_ID}-${attempt}-$(date +%s)" -o /tmp/vorac-live.html || true
            if grep -Fq 'data-vorac-srpen-2026' /tmp/vorac-live.html \
              && grep -Fq '3. do 14. srpna 2026' /tmp/vorac-live.html \
              && grep -Fq '474 944 246' /tmp/vorac-live.html \
              && grep -Fq '731 379 374' /tmp/vorac-live.html; then
              echo 'Veřejný článek potvrzuje dovolenou kožní ambulance MUDr. Voráče.'
              exit 0
            fi
            sleep 5
          done
          echo 'Veřejný článek změnu nepotvrdil.' >&2
          exit 1

      - name: Zapsat stav nasazení
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = '.github/vorac-closure-live-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'passed' : 'failed',
              checkedAtUtc: new Date().toISOString(),
              runId: context.runId,
              sourceSha: context.sha,
              serverDeploy: process.env.DEPLOY_OUTCOME || 'skipped',
              publicVerification: process.env.VERIFY_OUTCOME || 'skipped',
              publicUrl: 'https://nasekadan.cz/clanky/prakticti-lekari-nemocnice-kadan-srpen-2026.html'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat nasazení kožní ambulance MUDr. Voráče: ${status.status} [skip ci]`,
              content,
              ...(sha ? {sha} : {})
            });
