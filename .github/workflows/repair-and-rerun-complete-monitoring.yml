name: Opravit a znovu projet kompletní monitoring

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-and-rerun-complete-monitoring.yml'

permissions:
  contents: write

concurrency:
  group: repair-and-rerun-complete-monitoring
  cancel-in-progress: false

jobs:
  repair-and-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Načíst main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit síťovou odolnost monitoru
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/monitor_national_kadan.py')
          t = p.read_text(encoding='utf-8')

          if 'MONITOR_RELIABLE_FETCH_V2' not in t:
              t = t.replace(
                  'import argparse\nimport hashlib\nimport html\nimport json\nimport re\nimport unicodedata\n',
                  'import argparse\nimport hashlib\nimport html\nimport http.client\nimport json\nimport random\nimport re\nimport socket\nimport threading\nimport time\nimport unicodedata\n'
              )
              t = t.replace('from urllib.error import HTTPError\n', 'from urllib.error import HTTPError, URLError\n')
              old = '''def _request(url: str, user_agent: str) -> tuple[str, str]:\n    request = Request(\n        url,\n        headers={\n            "User-Agent": user_agent,\n            "Accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, text/html, application/xhtml+xml",\n            "Accept-Language": "cs,en;q=0.7",\n            "Cache-Control": "no-cache",\n        },\n    )\n    with urlopen(request, timeout=30) as response:\n        content_type = response.headers.get_content_type() or ""\n        charset = response.headers.get_content_charset() or "utf-8"\n        return response.read().decode(charset, errors="replace"), content_type\n\n\ndef fetch(url: str) -> tuple[str, str]:\n    try:\n        return _request(url, UA)\n    except HTTPError as exc:\n        if exc.code not in {403, 406, 429}:\n            raise\n        return _request(url, BROWSER_UA)\n'''
              new = '''# MONITOR_RELIABLE_FETCH_V2\n_TRANSIENT_HTTP_CODES = {403, 406, 408, 425, 429, 500, 502, 503, 504}\n_HOST_SEMAPHORES: dict[str, threading.Semaphore] = {\n    # Google News při desítkách RSS dotazů vrací dočasné 503. Dva souběžné\n    # požadavky udrží průchod rychlý, ale neodpálí throttling.\n    "news.google.com": threading.Semaphore(2),\n}\n\n\ndef _request(url: str, user_agent: str, timeout: int = 45) -> tuple[str, str]:\n    request = Request(\n        url,\n        headers={\n            "User-Agent": user_agent,\n            "Accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, text/html, application/xhtml+xml",\n            "Accept-Language": "cs-CZ,cs;q=0.9,en;q=0.6",\n            "Cache-Control": "no-cache",\n            "Pragma": "no-cache",\n        },\n    )\n    with urlopen(request, timeout=timeout) as response:\n        content_type = response.headers.get_content_type() or ""\n        charset = response.headers.get_content_charset() or "utf-8"\n        return response.read().decode(charset, errors="replace"), content_type\n\n\ndef fetch(url: str) -> tuple[str, str]:\n    host = urlsplit(url).netloc.lower().split(':', 1)[0]\n    attempts = 5 if host == "news.google.com" else 3\n    semaphore = _HOST_SEMAPHORES.get(host)\n    last_exc: Exception | None = None\n\n    for attempt in range(attempts):\n        acquired = False\n        try:\n            if semaphore is not None:\n                semaphore.acquire()\n                acquired = True\n                # Rozprostřít RSS dotazy i v rámci dvojice workerů.\n                time.sleep(0.25 + random.random() * 0.35)\n            ua = UA if attempt == 0 else BROWSER_UA\n            timeout = 45 if attempt < 2 else 60\n            return _request(url, ua, timeout=timeout)\n        except HTTPError as exc:\n            last_exc = exc\n            if exc.code not in _TRANSIENT_HTTP_CODES:\n                raise\n            retry_after = 0.0\n            try:\n                retry_after = float(exc.headers.get('Retry-After') or 0)\n            except (TypeError, ValueError):\n                retry_after = 0.0\n        except (URLError, TimeoutError, socket.timeout, ConnectionError,\n                ConnectionResetError, http.client.IncompleteRead, OSError) as exc:\n            last_exc = exc\n            retry_after = 0.0\n        finally:\n            if acquired and semaphore is not None:\n                semaphore.release()\n\n        if attempt + 1 < attempts:\n            backoff = max(retry_after, min(12.0, 1.2 * (2 ** attempt)))\n            time.sleep(backoff + random.random() * 0.6)\n\n    if last_exc is not None:\n        raise last_exc\n    raise RuntimeError(f"Nepodařilo se načíst {url}")\n'''
              if old not in t:
                  raise SystemExit('Nenašel jsem očekávaný blok fetch() v monitor_national_kadan.py')
              t = t.replace(old, new)
              p.write_text(t, encoding='utf-8')

          p = Path('scripts/monitor_all_kadansko.py')
          t = p.read_text(encoding='utf-8')
          if 'MONITOR_SECOND_PASS_V2' not in t:
              t = t.replace('import re\nfrom concurrent.futures import ThreadPoolExecutor\n', 'import re\nimport time\nfrom concurrent.futures import ThreadPoolExecutor\n')
              old = '''    with ThreadPoolExecutor(max_workers=min(MAX_WORKERS, len(sources))) as executor:\n        collected = list(executor.map(collect, sources))\n\n    source_status: list[dict[str, Any]] = []\n'''
              new = '''    with ThreadPoolExecutor(max_workers=min(MAX_WORKERS, len(sources))) as executor:\n        collected = list(executor.map(collect, sources))\n\n    # MONITOR_SECOND_PASS_V2\n    # Po prvním paralelním průchodu ještě jednou pomalu zkusit pouze selhané\n    # zdroje. Tím se jednorázový timeout/503 nestane falešným výpadkem celého\n    # monitoringu a současně nezpomalujeme zdroje, které fungují napoprvé.\n    initial_failed = sum(1 for _source, _items, error in collected if error)\n    failed_indexes = [index for index, (_source, _items, error) in enumerate(collected) if error]\n    if failed_indexes:\n        time.sleep(2.0)\n        for index in failed_indexes:\n            source, old_items, old_error = collected[index]\n            retried = collect(source)\n            _source, new_items, new_error = retried\n            if not new_error or len(new_items) > len(old_items):\n                collected[index] = retried\n            else:\n                collected[index] = (source, old_items, f"{old_error}; retry: {new_error}")\n    recovered_after_retry = initial_failed - sum(1 for _source, _items, error in collected if error)\n\n    source_status: list[dict[str, Any]] = []\n'''
              if old not in t:
                  raise SystemExit('Nenašel jsem očekávaný blok executor.map() v monitor_all_kadansko.py')
              t = t.replace(old, new)
              t = t.replace(
                  '        "failedSources": len(failed),\n        "itemsParsed": parsed_total,\n',
                  '        "failedSources": len(failed),\n        "initialFailedSources": initial_failed,\n        "recoveredSourcesAfterRetry": recovered_after_retry,\n        "itemsParsed": parsed_total,\n'
              )
              p.write_text(t, encoding='utf-8')
          PY

          python3 -m py_compile \
            scripts/monitor_national_kadan.py \
            scripts/monitor_all_kadansko.py \
            scripts/run_complete_regional_monitor.py

      - name: Trvale uložit opravu bez paralelního spuštění starého workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – monitoring repair'
          git config user.email 'info@nasekadan.cz'
          git add scripts/monitor_national_kadan.py scripts/monitor_all_kadansko.py
          if ! git diff --cached --quiet; then
            git commit -m 'Opravit retry a throttling kompletního monitoringu [skip ci]'
            for n in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((n*3))
            done
          fi

      - name: Znovu projet všech 213 zdrojů
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/complete-monitor-after-repair.json"
          python3 scripts/run_complete_regional_monitor.py \
            --state data/all-kadansko-monitoring-state.json \
            --status data/all-kadansko-monitoring-status.json \
            --output "$output"
          cp "$output" "$RUNNER_TEMP/monitor-output.json"

      - name: Vytvořit kontrolní report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status = json.loads(Path('data/all-kadansko-monitoring-status.json').read_text(encoding='utf-8'))
          output = json.loads(Path(os.environ['RUNNER_TEMP'] + '/monitor-output.json').read_text(encoding='utf-8'))
          failed = [s for s in status.get('sourceStatus', []) if s.get('status') == 'failed']
          report = {
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'repair': 'retry+host-throttling+slow-second-pass-v2',
              'sourceCount': status.get('sourceCount'),
              'checkedSources': status.get('checkedSources'),
              'failedSources': status.get('failedSources'),
              'initialFailedSources': status.get('initialFailedSources'),
              'recoveredSourcesAfterRetry': status.get('recoveredSourcesAfterRetry'),
              'itemsParsed': status.get('itemsParsed'),
              'uniqueItems': status.get('uniqueItems'),
              'newAlerts': status.get('newAlerts'),
              'alerts': output.get('alerts') or [],
              'failed': failed,
              'coverage': status.get('coverage') or {},
          }
          Path('reports/monitoring-repair-latest.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({k: report[k] for k in (
              'sourceCount','checkedSources','failedSources','initialFailedSources',
              'recoveredSourcesAfterRetry','itemsParsed','uniqueItems','newAlerts'
          )}, ensure_ascii=False))
          PY

      - name: Uložit nový stav a report
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --rebase origin main || true
          git config user.name 'Naše Kadaň – monitoring repair'
          git config user.email 'info@nasekadan.cz'
          git add \
            data/all-kadansko-monitoring-state.json \
            data/all-kadansko-monitoring-status.json \
            reports/monitoring-repair-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Prověřit celý monitoring po opravě [skip ci]'
            for n in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((n*3))
            done
            exit 1
          fi
