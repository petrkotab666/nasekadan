name: Nouzově publikovat Od hlubin k nebi přímo
run-name: Přímé nasazení článku Od hlubin k nebi na OVH

on:
  push:
    branches: [main]
    paths:
      - '.github/emergency-mural-direct-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-emergency-mural-direct
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Připravit a zapsat článek přímo do veřejného webu
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo chown -R ubuntu:ubuntu /opt/nasekadan
          git -C /opt/nasekadan fetch --prune origin main
          git -C /opt/nasekadan reset --hard origin/main
          cd /opt/nasekadan

          python3 - <<'PY'
try:
    import PIL
except Exception:
    raise SystemExit(2)
PY
          if [ $? -ne 0 ]; then python3 -m pip install --user Pillow; fi

          python3 scripts/materialize_mural_assets.py
          python3 scripts/normalize_footers.py --write --check
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/enforce_current_article_order.py
          python3 scripts/prepare_discovery.py

          ARTICLE='clanky/od-hlubin-k-nebi-kadan.html'
          test -s "$ARTICLE"
          grep -Fq '<h1>Od hlubin k nebi. Dva podchody na sídlišti A proměnila kadaňská autorka v obří atlas zvířat</h1>' "$ARTICLE"
          grep -Fq '/images/clanky/od-hlubin-k-nebi/ptaci-ara-zoborozec.webp' "$ARTICLE"
          grep -Fq '/images/clanky/od-hlubin-k-nebi/ptaci-cela-stena.webp' "$ARTICLE"

          ROOT=/var/www/nasekadan
          sudo mkdir -p "$ROOT/clanky" "$ROOT/images/clanky/od-hlubin-k-nebi" "$ROOT/social"
          sudo install -m 0644 "$ARTICLE" "$ROOT/$ARTICLE"
          sudo install -m 0644 images/clanky/od-hlubin-k-nebi/ptaci-ara-zoborozec.webp "$ROOT/images/clanky/od-hlubin-k-nebi/ptaci-ara-zoborozec.webp"
          sudo install -m 0644 images/clanky/od-hlubin-k-nebi/ptaci-cela-stena.webp "$ROOT/images/clanky/od-hlubin-k-nebi/ptaci-cela-stena.webp"
          sudo install -m 0644 index.html "$ROOT/index.html"
          for f in clanky/index.html clanky/strana-*.html rss.xml sitemap.xml news-sitemap.xml; do
            [ -f "$f" ] && sudo install -m 0644 "$f" "$ROOT/$f"
          done
          social_file=$(grep -o 'social/od-hlubin-k-nebi-kadan-[^"'"']*\.png' "$ARTICLE" | head -1 || true)
          if [ -n "$social_file" ] && [ -f "$social_file" ]; then
            sudo install -m 0644 "$social_file" "$ROOT/$social_file"
          fi
          sha=$(git rev-parse HEAD)
          printf 'site=nasekadan.cz\nstatus=ok\nsource=%s\ngenerated=%s\nmode=emergency-direct-mural\n' "$sha" "$(date -u +%FT%TZ)" | sudo tee "$ROOT/deployment-health.txt" >/dev/null
          sudo chmod -R a+rX "$ROOT/clanky" "$ROOT/images/clanky/od-hlubin-k-nebi" "$ROOT/social" "$ROOT/index.html" "$ROOT/rss.xml" "$ROOT/sitemap.xml" "$ROOT/news-sitemap.xml" "$ROOT/deployment-health.txt"
          REMOTE

      - name: Ověřit veřejné nasazení
        shell: bash
        run: |
          set -euo pipefail
          base='https://nasekadan.cz'
          slug='od-hlubin-k-nebi-kadan.html'
          q="mural-direct-${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsSL --max-time 40 "$base/clanky/$slug?$q" -o /tmp/article.html
          grep -Fq '<h1>Od hlubin k nebi. Dva podchody na sídlišti A proměnila kadaňská autorka v obří atlas zvířat</h1>' /tmp/article.html
          for img in ptaci-ara-zoborozec.webp ptaci-cela-stena.webp; do
            curl -4 -kfsSL --max-time 40 "$base/images/clanky/od-hlubin-k-nebi/$img?$q" -o "/tmp/$img"
            file "/tmp/$img" | grep -Fq 'Web/P image'
            curl -4 -kfsSI --max-time 40 "$base/images/clanky/od-hlubin-k-nebi/$img?$q" | tr -d '\r' | grep -Eqi '^content-type: image/webp$'
          done
          curl -4 -kfsSL --max-time 40 "$base/?$q" | grep -Fq "$slug"
          curl -4 -kfsSL --max-time 40 "$base/clanky/?$q" | grep -Fq "$slug"
          curl -4 -kfsSL --max-time 40 "$base/rss.xml?$q" | grep -Fq "$slug"
          curl -4 -kfsSL --max-time 40 "$base/sitemap.xml?$q" | grep -Fq "$slug"
          curl -4 -kfsSL --max-time 40 "$base/news-sitemap.xml?$q" | grep -Fq "$slug"

      - name: Zapsat potvrzení
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nasekadan-deploy-bot'
          git config user.email 'info@nasekadan.cz'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .github/deploy-status
          status=".github/deploy-status/od-hlubin-k-nebi-direct-${GITHUB_RUN_ID}.txt"
          printf 'article=clanky/od-hlubin-k-nebi-kadan.html\nmethod=emergency-direct\nwebp=verified\nverified_at=%s\n' "$(date -u +%FT%TZ)" > "$status"
          git add "$status"
          git commit -m 'Potvrdit přímé nasazení článku Od hlubin k nebi [skip ci]'
          git push origin HEAD:main
