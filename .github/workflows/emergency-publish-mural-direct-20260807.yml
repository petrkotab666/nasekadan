name: Obnovit úplný web a monotónní ochranu
run-name: Úplná monotónní obnova Naše Kadaň na OVH

on:
  push:
    branches: [main]
    paths:
      - '.github/emergency-mural-direct-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-emergency-mural-direct
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nainstalovat monotónní ochranu a obnovit celý web
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          LOCK_FILE=/tmp/nasekadan-production-deploy.lock
          sudo touch "$LOCK_FILE"
          sudo chmod a+rw "$LOCK_FILE"
          exec 9>"$LOCK_FILE"
          flock -w 1200 9

          sudo chown -R ubuntu:ubuntu /opt/nasekadan
          sudo rm -f /opt/nasekadan/.git/index.lock
          git -C /opt/nasekadan fetch --prune origin main
          git -C /opt/nasekadan reset --hard origin/main
          git -C /opt/nasekadan clean -fd
          cd /opt/nasekadan

          # Uvolnit společný zámek před instalátorem. Nový static-restore si jej
          # vezme sám a od této chvíle jej používají všechny serverové obnovy.
          flock -u 9
          sudo bash deploy/install-automation.sh

          # Po instalaci musí být celý veřejný document root monotónně úplný.
          python3 scripts/verify_published_article_set.py \
            --source /opt/nasekadan --target /var/www/nasekadan
          sudo systemctl is-active --quiet nasekadan-refresh.timer
          sudo systemctl is-active --quiet nasekadan-content-regression.path
          REMOTE

      - name: Ověřit úplný veřejný web
        shell: bash
        run: |
          set -euo pipefail
          base='https://nasekadan.cz'
          q="monotonic-recovery-${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsSL --max-time 40 "$base/published-articles-manifest.json?$q" -o /tmp/manifest.json
          curl -4 -kfsSL --max-time 40 "$base/clanky/?$q" -o /tmp/archive.html
          curl -4 -kfsSL --max-time 40 "$base/rss.xml?$q" -o /tmp/rss.xml
          curl -4 -kfsSL --max-time 40 "$base/sitemap.xml?$q" -o /tmp/sitemap.xml
          python3 - <<'PY'
import json
from pathlib import Path
p=json.loads(Path('/tmp/manifest.json').read_text(encoding='utf-8'))
required={
 'clanky/zzs-kadan-garaz-mycka-2026.html',
 'clanky/slavie-kadan-epp-plavci-120-tisic-2026.html',
 'clanky/od-hlubin-k-nebi-kadan.html',
 'clanky/mestska-policie-kadan-fakta-diskuse-2026.html',
 'clanky/gymnastika-kadan-treneri-prosinec-2026.html',
}
missing=required-set(p.get('articles', []))
assert not missing, missing
assert p.get('article_count', 0) >= len(required)
print('manifest article_count=',p['article_count'])
PY
          for slug in \
            zzs-kadan-garaz-mycka-2026.html \
            slavie-kadan-epp-plavci-120-tisic-2026.html \
            od-hlubin-k-nebi-kadan.html \
            mestska-policie-kadan-fakta-diskuse-2026.html \
            gymnastika-kadan-treneri-prosinec-2026.html; do
            grep -Fq "$slug" /tmp/archive.html
            grep -Fq "$slug" /tmp/rss.xml
            grep -Fq "$slug" /tmp/sitemap.xml
            curl -4 -kfsSL --max-time 40 "$base/clanky/$slug?$q" >/dev/null
          done

          # Facebook: ZZS musí ukazovat na vlastní lokální kartu a karta musí být
          # fyzicky dostupná jako obrázek na našem serveru.
          curl -4 -kfsSL --max-time 40 "$base/clanky/zzs-kadan-garaz-mycka-2026.html?$q" -o /tmp/zzs.html
          og=$(python3 - <<'PY'
from pathlib import Path
import re
text=Path('/tmp/zzs.html').read_text(encoding='utf-8')
m=re.search(r'<meta\b[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)',text,re.I)
assert m
print(m.group(1))
PY
          )
          case "$og" in https://nasekadan.cz/social/*) ;; *) echo "Neplatný OG: $og" >&2; exit 1;; esac
          curl -4 -kfsSL --max-time 40 "$og?$q" -o /tmp/zzs-og
          file /tmp/zzs-og | grep -Eqi 'PNG image data|JPEG image data|Web/P image'

      - name: Zapsat potvrzení
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nasekadan-deploy-bot'
          git config user.email 'info@nasekadan.cz'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .github/deploy-status
          status=".github/deploy-status/monotonic-recovery-${GITHUB_RUN_ID}.txt"
          printf 'mode=monotonic-full-recovery\narticles=verified\nzzs=verified\nslavie=verified\nfacebook_og=verified\nverified_at=%s\n' "$(date -u +%FT%TZ)" > "$status"
          git add "$status"
          git commit -m 'Potvrdit úplnou monotónní obnovu webu [skip ci]'
          git push origin HEAD:main
