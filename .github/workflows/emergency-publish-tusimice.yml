name: Nouzově dokončit publikaci jaderných Tušimic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-publish-tusimice.yml'
      - '.github/drafts/jaderne-tusimice-smr-voda-doprava-eia-2026.html'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  SLUG: jaderne-tusimice-smr-voda-doprava-eia-2026
  ARTICLE: clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
  DRAFT: .github/drafts/jaderne-tusimice-smr-voda-doprava-eia-2026.html
  EXPECTED_TEXT: 'Úplná EIA měla být na ministerstvu už 12. května'
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

concurrency:
  group: emergency-publish-tusimice
  cancel-in-progress: false

jobs:
  publish-repair-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Stáhnout hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit článek, sociální obrázek a přehledy
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DRAFT"
          cp "$DRAFT" "$ARTICLE"
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/enforce_article_visibility.py
          python3 scripts/sort_articles_chronologically.py

          social_url="$(python3 - <<'PY'
          import html,re
          from pathlib import Path
          text=Path('clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html').read_text(encoding='utf-8')
          m=re.search(r'<meta\s+property=["\']og:image["\']\s+content=["\']([^"\']+)',text,re.I)
          if not m:
              raise SystemExit('Chybí og:image')
          print(html.unescape(m.group(1)))
          PY
          )"
          social_image="social/${social_url##*/}"
          test -s "$social_image"
          echo "SOCIAL_URL=$social_url" >> "$GITHUB_ENV"
          echo "SOCIAL_IMAGE=$social_image" >> "$GITHUB_ENV"

          python3 - "$social_image" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          p=Path(sys.argv[1])
          with Image.open(p) as im:
              if im.format != 'PNG' or im.size != (1200,630):
                  raise SystemExit(f'Chybný sociální obrázek: {im.format}, {im.size}')
          if p.stat().st_size < 10000:
              raise SystemExit('Sociální obrázek je podezřele malý')
          PY

          grep -Fq "$EXPECTED_TEXT" "$ARTICLE"
          grep -Fq 'Chcete, aby v Tušimicích vznikla nová jaderná elektrárna?' "$ARTICLE"
          grep -Fq "/clanky/${SLUG}.html" index.html
          grep -Fq "/clanky/${SLUG}.html" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" sitemap.xml
          grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" news-sitemap.xml

      - name: Bezpečně uložit veřejnou verzi do main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň nouzový publikační automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- "$ARTICLE" "$SOCIAL_IMAGE" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt style.css
          if ! git diff --cached --quiet; then
            git commit -m 'Publikovat: jaderné Tušimice – opravný běh'
          fi
          # Generátory mohou měnit i jiné soubory. Tyto nestageované změny nesmí blokovat rebase.
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'push_ok=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 7))
          done
          echo 'push_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit přímo na OVH a do webového kontejneru
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-tusimice-emergency"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$SOCIAL_IMAGE" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$bundle/"

          for attempt in 1 2 3; do
            if scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-tusimice-emergency; then
              break
            fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep $((attempt * 8))
          done

          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 /tmp/nk-tusimice-emergency/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-tusimice-emergency/clanky/index.html /var/www/nasekadan/clanky/index.html
          find /tmp/nk-tusimice-emergency/social -maxdepth 1 -type f -name 'jaderne-tusimice-smr-voda-doprava-eia-2026-*.png' -exec sudo install -m 0644 {} /var/www/nasekadan/social/ \;
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do
            sudo install -m 0644 "/tmp/nk-tusimice-emergency/$f" "/var/www/nasekadan/$f"
          done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp /tmp/nk-tusimice-emergency/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp /tmp/nk-tusimice-emergency/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            for f in /tmp/nk-tusimice-emergency/social/*.png; do
              [[ -f "$f" ]] && sudo docker cp "$f" nasekadan-web:/usr/share/nginx/html/social/
            done
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do
              sudo docker cp "/tmp/nk-tusimice-emergency/$f" "nasekadan-web:/usr/share/nginx/html/$f"
            done
          fi
          sudo chmod -R a+rX /var/www/nasekadan
          grep -Fq 'Úplná EIA měla být na ministerstvu už 12. května' /var/www/nasekadan/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html
          grep -Fq '/clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html' /var/www/nasekadan/index.html
          rm -rf /tmp/nk-tusimice-emergency
          REMOTE

      - name: Veřejně ověřit web, RSS, sitemapy a obrázek
        id: web
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for attempt in $(seq 1 30); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/${SLUG}.html?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            image="$RUNNER_TEMP/tusimice-social-${attempt}.png"
            curl -4 -kfsS --max-time 25 "${SOCIAL_URL}?v=${stamp}-${attempt}" -o "$image" 2>/dev/null || true
            image_ok="$(python3 - "$image" <<'PY'
          import sys
          from pathlib import Path
          try:
              from PIL import Image
              p=Path(sys.argv[1])
              with Image.open(p) as im:
                  print('yes' if im.format=='PNG' and im.size==(1200,630) and p.stat().st_size>=10000 else 'no')
          except Exception:
              print('no')
          PY
            )"
            if grep -Fq "$EXPECTED_TEXT" <<<"$article" \
              && grep -Fq 'Chcete, aby v Tušimicích vznikla nová jaderná elektrárna?' <<<"$article" \
              && grep -Fq "$SOCIAL_URL" <<<"$article" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$home" \
              && grep -Fq "/clanky/${SLUG}.html" <<<"$archive" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$rss" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$sitemap" \
              && grep -Fq "https://nasekadan.cz/clanky/${SLUG}.html" <<<"$news" \
              && [[ "$image_ok" == yes ]]; then
              echo 'web_ok=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'web_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Počkat na standardní Facebook automat
        if: steps.web.outputs.web_ok == 'true'
        id: fbwait
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          marker="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          article='clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html'
          digest=hashlib.sha256(article.encode()).hexdigest()[:10]
          print(f'.github/facebook-published/{Path(article).stem}-{digest}.json')
          PY
          )"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 15); do
            git fetch -q origin main
            if git cat-file -e "origin/main:$marker" 2>/dev/null; then
              echo 'facebook_ok=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 12
          done
          echo 'facebook_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Přímá Facebook pojistka
        if: steps.web.outputs.web_ok == 'true' && steps.fbwait.outputs.facebook_ok != 'true'
        id: fbdirect
        continue-on-error: true
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
          FACEBOOK_WAIT_TIMEOUT: '600'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          python3 scripts/process_facebook_queue_live.py "$ARTICLE"

      - name: Uložit potvrzení Facebooku
        if: always() && steps.web.outputs.web_ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň Facebook pojistka'
          git config user.email 'info@nasekadan.cz'
          git add -A -- .github/facebook-publish-pending.txt .github/facebook-last-status.json .github/facebook-published 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Potvrdit Facebook: jaderné Tušimice'
            git reset --hard HEAD
            git clean -fd
            for attempt in 1 2 3 4; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 4 ]] && exit 1
              sleep $((attempt * 7))
            done
          fi

      - name: Konečně ověřit Facebook marker
        if: always() && steps.web.outputs.web_ok == 'true'
        id: fbfinal
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          marker='${{ steps.fbwait.outputs.marker }}'
          if [[ -z "$marker" ]]; then
            marker="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          article='clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html'
          digest=hashlib.sha256(article.encode()).hexdigest()[:10]
          print(f'.github/facebook-published/{Path(article).stem}-{digest}.json')
          PY
            )"
          fi
          for attempt in $(seq 1 18); do
            git fetch -q origin main
            if git cat-file -e "origin/main:$marker" 2>/dev/null; then
              echo 'facebook_ok=true' >> "$GITHUB_OUTPUT"
              git show "origin/main:$marker"
              exit 0
            fi
            sleep 10
          done
          echo 'facebook_ok=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Uzavřít nebo aktualizovat kontrolní issue
        if: always()
        uses: actions/github-script@v7
        env:
          WEB_OK: ${{ steps.web.outputs.web_ok }}
          FACEBOOK_OK: ${{ steps.fbfinal.outputs.facebook_ok }}
        with:
          script: |
            const webOk = process.env.WEB_OK === 'true';
            const facebookOk = process.env.FACEBOOK_OK === 'true';
            const issue_number = 278;
            if (webOk && facebookOk) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
                body: [
                  'Publikace článku o jaderných Tušimicích byla kompletně a veřejně ověřena.',
                  '',
                  '- Web: OVĚŘEN',
                  '- Titulní stránka a archiv: OVĚŘENY',
                  '- RSS, sitemap.xml a news-sitemap.xml: OVĚŘENY',
                  '- Sociální obrázek 1200 × 630: OVĚŘEN',
                  '- Facebook: OVĚŘEN publikačním markerem',
                  `- Opravný workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                ].join('\n')
              });
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: 'open',
                body: [
                  'Nouzový samoopravný běh zatím nepotvrdil kompletní publikaci.',
                  '',
                  `- Web: ${webOk ? 'OVĚŘEN' : 'NEOVĚŘEN'}`,
                  `- Facebook: ${facebookOk ? 'OVĚŘEN' : 'NEOVĚŘEN'}`,
                  `- Opravný workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                ].join('\n')
              });
            }

      - name: Selhat, dokud není vše ověřené
        if: steps.web.outputs.web_ok != 'true' || steps.fbfinal.outputs.facebook_ok != 'true'
        shell: bash
        run: |
          echo 'Web nebo Facebook ještě není kompletně ověřen.' >&2
          exit 1
