name: Najít všechny úvěrové záznamy Nemocnice Kadaň v Registru smluv

on:
  push:
    branches: [main]
    paths:
      - '.github/hospital-credit-all-records-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prohledat formulář Registru smluv bez fulltextu příloh
        shell: bash
        run: |
          set -euo pipefail
          OUT='research/nemocnice-kadan-neindexovane-20260730/uver-vsechny-zaznamy'
          mkdir -p "$OUT"
          URL='https://smlouvy.gov.cz/vyhledavani?subject_idnum=25479300&party_idnum=64948242&do=searchResultList-setLimit&searchResultList-limit=500'
          curl -k -L --fail --retry 4 -A 'Mozilla/5.0 NaseKadanResearch' "$URL" -o "$OUT/vysledky.html"
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          import re, json, urllib.request, ssl
          out=Path('research/nemocnice-kadan-neindexovane-20260730/uver-vsechny-zaznamy')
          html=out.joinpath('vysledky.html').read_text(encoding='utf-8',errors='replace')
          ids=[]
          for m in re.finditer(r'href=["\'](?:https://smlouvy\.gov\.cz)?/smlouva/(\d+)["\']',html,re.I):
              if m.group(1) not in ids: ids.append(m.group(1))
          ctx=ssl._create_unverified_context()
          records=[]
          for ident in ids:
              url=f'https://smlouvy.gov.cz/smlouva/{ident}'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 NaseKadanResearch'})
              try:
                  with urllib.request.urlopen(req,timeout=90,context=ctx) as r:
                      page=r.read().decode('utf-8','replace')
              except Exception as e:
                  records.append({'id':ident,'url':url,'error':str(e)}); continue
              text=re.sub(r'<script.*?</script>|<style.*?</style>',' ',page,flags=re.I|re.S)
              text=unescape(re.sub(r'<[^>]+>',' ',text))
              text=re.sub(r'\s+',' ',text).strip()
              records.append({'id':ident,'url':url,'text':text})
          out.joinpath('zaznamy.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          md=['# Všechny záznamy Nemocnice Kadaň × UniCredit Bank','',f'Nalezeno detailů: **{len(records)}**.','']
          for r in records:
              md += [f"## Verze {r['id']}",f"- {r['url']}",'',r.get('text',r.get('error','')),'']
          out.joinpath('PREHLED.md').write_text('\n'.join(md),encoding='utf-8')
          print('IDs',ids)
          PY
          git config user.name 'Naše Kadaň dokumentová rešerše'
          git config user.email 'info@nasekadan.cz'
          git add "$OUT"
          git commit -m 'Dohledat všechny úvěrové záznamy Nemocnice Kadaň' || true
          git pull --rebase origin main
          git push origin HEAD:main
