name: Export dalších městských skenů 2025

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-city-pdf-27-2025.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/research/hossner-fast-missing-docs-20260801/files/28_2025_106_ov.pdf
            .github/research/hossner-fast-missing-docs-20260801/files/34_2025_106_s.pdf
          sparse-checkout-cone-mode: false
      - name: Ověřit soubory
        run: ls -lh .github/research/hossner-fast-missing-docs-20260801/files/28_2025_106_ov.pdf .github/research/hossner-fast-missing-docs-20260801/files/34_2025_106_s.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: city-other-scans-2025
          path: |
            .github/research/hossner-fast-missing-docs-20260801/files/28_2025_106_ov.pdf
            .github/research/hossner-fast-missing-docs-20260801/files/34_2025_106_s.pdf
          retention-days: 1
