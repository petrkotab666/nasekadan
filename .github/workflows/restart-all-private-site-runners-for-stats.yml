name: Obnovit runnery pro statistiky všech webů

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restart-all-private-site-runners-for-stats.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH
        shell: bash
        run: |
          set -Eeuo pipefail; umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do value="${!name:-}"; if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"; break; fi; done
          test -s "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"
      - name: Restartovat a ověřit všechny runnery
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'sudo bash -s' > "$RUNNER_TEMP/out.txt" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          mapfile -t units < <(
            systemctl list-unit-files --type=service --no-legend 'actions.runner.*.service' 2>/dev/null | awk '{print $1}' | sort -u
          )
          echo "RUNNER_COUNT=${#units[@]}"
          test "${#units[@]}" -gt 0
          for unit in "${units[@]}"; do
            install -d -m 755 "/etc/systemd/system/${unit}.d"
            cat > "/etc/systemd/system/${unit}.d/20-private-stats-restart.conf" <<'EOF'
          [Unit]
          StartLimitIntervalSec=0

          [Service]
          Restart=always
          RestartSec=5
          EOF
            systemctl enable "$unit" >/dev/null 2>&1 || true
          done
          systemctl daemon-reload
          for unit in "${units[@]}"; do systemctl restart "$unit" || true; done
          sleep 12
          failed=0
          for unit in "${units[@]}"; do
            state=$(systemctl is-active "$unit" 2>/dev/null || true)
            printf '%-90s %s\n' "$unit" "$state"
            [[ "$state" == active ]] || failed=$((failed+1))
          done
          echo "FAILED_COUNT=$failed"
          test "$failed" -eq 0
          REMOTE
      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.repair.outcome }}
        with:
          script: |
            const fs=require('fs'); let out=''; try{out=fs.readFileSync(`${process.env.RUNNER_TEMP}/out.txt`,'utf8')}catch{}
            const ok=process.env.OUTCOME==='success';
            const issue=await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:`[RUNNERY PRO STATISTIKY] ${ok?'Úspěch':'Selhání'} ${new Date().toISOString()}`,body:'```text\n'+out.slice(-50000).replace(/```/g,'---')+'\n```'});
            if(ok) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.data.number,state:'closed',state_reason:'completed'});
      - name: Selhat při neověřené opravě
        if: steps.repair.outcome != 'success'
        run: exit 1
