name: Otestovat konečný sestavovací skript článku o sečení

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_greenery_publication_20260801.py'
      - '.github/drafts/sekani-travniku-kadan-spravci-vysky-2026.html.gz.b64'
      - '.github/drafts/sekani-travniku-kadan-spravci-vysky-2026.html.gz.b64.part2'
      - '.github/workflows/test-greenery-publication-helper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-greenery-publication-helper
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Spustit kompletní sestavení bez nasazení
        id: test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/prepare_greenery_publication_20260801.py
          test -s .github/greenery-publication-bundle.json
          grep -Fq 'clanky/sekani-travniku-kadan-spravci-vysky-2026.html' .github/facebook-publish-trigger.txt
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_OK: ${{ steps.test.outputs.ok }}
        with:
          script: |
            const path='.github/greenery-final-preflight-status.json';
            const ok=process.env.TEST_OK==='true';
            const payload={status:ok?'passed':'failed',checkedAtUtc:new Date().toISOString(),runId:context.runId,sourceSha:context.sha,scheduledFor:'2026-08-01T11:00:00+02:00'};
            const content=Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64');
            let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat konečný test článku o sečení: ${payload.status} [skip ci]`,content,...(sha?{sha}:{})});
