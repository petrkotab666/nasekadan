name: Ověření registrů revmatologie na živém webu

on:
  push:
    branches: [main]
    paths:
      - '.github/revma-registry-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ověřit veřejný článek
        id: check
        run: |
          set -euo pipefail
          url='https://nasekadan.cz/clanky/nova-revmatologicka-ambulance-kadan-podzim-2026.html'
          for attempt in $(seq 1 30); do
            page="$(curl -4 -kfsS --max-time 20 "${url}?registrycheck=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq 'data-revma-registry-context="1"' <<<"$page" \
              && grep -Fq 'revmatologicka-spolecnost.cz/centra-biologicke-lecby/' <<<"$page" \
              && grep -Fq 'akreditace.mzcr.cz/poskytovatele/view/42281' <<<"$page"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Zapsat výsledek kontroly
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const path = 'revma-registry-update-status.json';
            const status = {
              status: process.env.CHECK_OUTCOME === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              public_verification: process.env.CHECK_OUTCOME || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat ověření registrů revmatologie: ${status.status}`,
              content,
              ...(sha ? { sha } : {})
            });
