name: Obnovit dočasné připnutí článku o zimním stadionu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-stadium-pin-active-20260804-2000.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: restore-stadium-pin-active-20260804-2000
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zastavit starší konfliktní běhy kanonické pojistky
        shell: bash
        run: |
          set -euo pipefail
          for id in $(gh run list --workflow article-integrity-guard.yml --status in_progress --limit 20 --json databaseId --jq '.[].databaseId'); do
            gh run cancel "$id" || true
          done
          for id in $(gh run list --workflow article-integrity-guard.yml --status queued --limit 20 --json databaseId --jq '.[].databaseId'); do
            gh run cancel "$id" || true
          done
          for attempt in $(seq 1 12); do
            active="$(gh run list --workflow article-integrity-guard.yml --limit 20 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')"
            [[ "$active" = "0" ]] && exit 0
            sleep 5
          done
          echo 'Konfliktní kanonický běh se nepodařilo včas zastavit.' >&2
          exit 1

      - name: Obnovit zdrojové pravidlo připnutí a vygenerovat titulku
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – dočasné připnutí titulky'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PATCHPY'
          from pathlib import Path
          import re

          pin_href = '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          pin_until_iso = '2026-08-05T16:00:00+00:00'

          enforce_path = Path('scripts/enforce_article_visibility.py')
          enforce = enforce_path.read_text(encoding='utf-8')
          enforce, href_count = re.subn(
              r'^HOMEPAGE_PIN_HREF\s*=.*$',
              f'HOMEPAGE_PIN_HREF = {pin_href!r}',
              enforce,
              count=1,
              flags=re.M,
          )
          enforce, until_count = re.subn(
              r'^HOMEPAGE_PIN_UNTIL\s*=.*$',
              f"HOMEPAGE_PIN_UNTIL = datetime.fromisoformat('{pin_until_iso}')",
              enforce,
              count=1,
              flags=re.M,
          )
          if href_count != 1 or until_count != 1:
              raise SystemExit(f'Nejednoznačná konfigurace připnutí: href={href_count}, until={until_count}')
          compile(enforce, str(enforce_path), 'exec')
          enforce_path.write_text(enforce, encoding='utf-8', newline='\n')

          guard_path = Path('scripts/run_article_integrity_guard.sh')
          guard = guard_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"  # Každý běh znovu ruší historické připnutí titulky\..*?\n  # Odstraň pouze známé jednorázové nástroje",
              re.S,
          )
          replacement = r'''  # Do 5. srpna 2026 18:00 SELČ respektuj redakční připnutí článku
          # o zpřístupnění zimního stadionu. Po termínu se konfigurace sama vrátí
          # k běžnému chronologickému pořadí titulky.
          python3 - <<'PINPY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          path = Path('scripts/enforce_article_visibility.py')
          text = path.read_text(encoding='utf-8')
          pin_href = '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          pin_until_iso = '2026-08-05T16:00:00+00:00'
          active = datetime.now(timezone.utc) <= datetime.fromisoformat(pin_until_iso)
          href_value = f'HOMEPAGE_PIN_HREF = {pin_href!r}' if active else "HOMEPAGE_PIN_HREF = ''"
          until_value = (
              f"HOMEPAGE_PIN_UNTIL = datetime.fromisoformat('{pin_until_iso}')"
              if active else
              'HOMEPAGE_PIN_UNTIL = datetime.fromtimestamp(0, tz=timezone.utc)'
          )
          text, href_count = re.subn(r'^HOMEPAGE_PIN_HREF\s*=.*$', href_value, text, count=1, flags=re.M)
          text, until_count = re.subn(r'^HOMEPAGE_PIN_UNTIL\s*=.*$', until_value, text, count=1, flags=re.M)
          if href_count != 1 or until_count != 1:
              raise SystemExit(f'Chybí jednoznačná konfigurace titulky: href={href_count}, until={until_count}')
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8', newline='\n')
          PINPY

          # Odstraň pouze známé jednorázové nástroje'''
          guard, count = pattern.subn(replacement, guard, count=1)
          if count != 1:
              raise SystemExit(f'Blok kanonické pojistky nebyl jednoznačně nalezen: {count}')
          guard_path.write_text(guard, encoding='utf-8', newline='\n')
          PATCHPY

            python3 -m py_compile scripts/enforce_article_visibility.py scripts/enforce_all_article_visibility.py
            python3 scripts/enforce_all_article_visibility.py
            python3 scripts/ensure_weather_loader.py

            python3 - <<'VERIFY'
          from datetime import datetime, timezone
          from pathlib import Path
          import importlib.util
          import re
          from xml.etree import ElementTree as ET

          pin = '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          article = Path(pin.lstrip('/')).read_text(encoding='utf-8')
          if 'article:published_time" content="2026-08-03T22:05:00+02:00"' not in article:
              raise SystemExit('Původní datum článku se změnilo.')

          spec = importlib.util.spec_from_file_location('visibility', Path('scripts/enforce_article_visibility.py'))
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          items = []
          for path in Path('clanky').glob('*.html'):
              if path.name == 'index.html' or re.fullmatch(r'strana-\d+\.html', path.name):
                  continue
              item = module.article_info(path)
              if item:
                  items.append(item)
          items.sort(key=lambda item: item['dt'], reverse=True)
          latest = items[0]['href']
          if latest == pin:
              raise SystemExit('Připínaný článek neočekávaně změnil chronologickou pozici.')

          home = Path('index.html').read_text(encoding='utf-8')
          hero = re.search(r'<section class="wrap hero" id="clanky".*?</section>', home, re.S)
          if not hero or f'data-latest-article-href="{pin}"' not in hero.group(0):
              raise SystemExit('Článek není hlavním zvýrazněným článkem.')
          aside = re.search(r'<aside class="current-aside">.*?</aside>', hero.group(0), re.S)
          if not aside or f'href="{latest}"' not in aside.group(0):
              raise SystemExit(f'Boční blok neobsahuje nejnovější článek {latest}.')
          if '/pocasi.js' not in home:
              raise SystemExit('Na titulce chybí loader počasí.')

          archive = Path('clanky/index.html').read_text(encoding='utf-8')
          first_archive = re.search(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="([^"]+)"', archive, re.S)
          if not first_archive or first_archive.group(1) != latest:
              raise SystemExit('Archiv není v chronologickém pořadí.')

          rss = ET.parse('rss.xml').getroot()
          first_link = rss.findtext('./channel/item/link')
          if first_link != 'https://nasekadan.cz' + latest:
              raise SystemExit('RSS není v chronologickém pořadí.')
          print(latest)
          VERIFY

            git diff --check
            git add scripts/enforce_article_visibility.py scripts/run_article_integrity_guard.sh index.html clanky/index.html sitemap.xml
            find clanky -maxdepth 1 -type f -name 'strana-*.html' -print0 | xargs -0 -r git add --
            if ! git diff --cached --quiet; then
              git commit -m 'Obnovit připnutí zimního stadionu do 5. srpna 18:00'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$pushed" = 1

      - name: Nasadit pouze titulní stránku na OVH
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            index.html ubuntu@57.129.43.215:/tmp/nasekadan-index-stadium-pin.html
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          sudo install -m 0644 /tmp/nasekadan-index-stadium-pin.html /var/www/nasekadan/index.html
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nasekadan-index-stadium-pin.html nasekadan-web:/usr/share/nginx/html/index.html
          fi
          rm -f /tmp/nasekadan-index-stadium-pin.html
          REMOTE

      - name: Veřejně ověřit připnutí, chronologii a počasí
        shell: bash
        run: |
          set -euo pipefail
          pin='/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          latest="$(python3 - <<'PY'
          from pathlib import Path
          import importlib.util, re
          spec = importlib.util.spec_from_file_location('visibility', Path('scripts/enforce_article_visibility.py'))
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          items=[]
          for path in Path('clanky').glob('*.html'):
              if path.name == 'index.html' or re.fullmatch(r'strana-\d+\.html', path.name):
                  continue
              item=module.article_info(path)
              if item: items.append(item)
          items.sort(key=lambda x:x['dt'], reverse=True)
          print(items[0]['href'])
          PY
          )"
          ok=0
          for attempt in $(seq 1 15); do
            q="${GITHUB_RUN_ID}-$(date +%s)-${attempt}"
            home="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/?pincheck=$q" || true)"
            article="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz${pin}?pincheck=$q" || true)"
            archive="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/clanky/?pincheck=$q" || true)"
            rss="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/rss.xml?pincheck=$q" || true)"
            forecast="$(curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/api/pocasi-predpoved.json?pincheck=$q" || true)"
            if PIN="$pin" LATEST="$latest" HOME_HTML="$home" ARTICLE_HTML="$article" ARCHIVE_HTML="$archive" RSS_XML="$rss" FORECAST_JSON="$forecast" python3 - <<'PY'
          import json, os, re
          from xml.etree import ElementTree as ET
          pin=os.environ['PIN']; latest=os.environ['LATEST']
          home=os.environ['HOME_HTML']; article=os.environ['ARTICLE_HTML']; archive=os.environ['ARCHIVE_HTML']; rss=os.environ['RSS_XML']; forecast=os.environ['FORECAST_JSON']
          hero=re.search(r'<section class="wrap hero" id="clanky".*?</section>', home, re.S)
          assert hero and f'data-latest-article-href="{pin}"' in hero.group(0)
          aside=re.search(r'<aside class="current-aside">.*?</aside>', hero.group(0), re.S)
          assert aside and f'href="{latest}"' in aside.group(0)
          assert '/pocasi.js' in home
          assert 'article:published_time" content="2026-08-03T22:05:00+02:00"' in article
          first_archive=re.search(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?href="([^"]+)"', archive, re.S)
          assert first_archive and first_archive.group(1) == latest
          root=ET.fromstring(rss)
          assert root.findtext('./channel/item/link') == 'https://nasekadan.cz' + latest
          data=json.loads(forecast)
          assert isinstance(data.get('properties',{}).get('timeseries'), list) and len(data['properties']['timeseries']) > 0
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          echo "Připnutí i počasí veřejně ověřeny; boční článek: $latest"
