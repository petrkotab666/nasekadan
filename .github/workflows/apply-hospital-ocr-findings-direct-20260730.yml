name: Nasadit aktuální zjištění nemocnice samostatně

on:
  push:
    branches: [main]
    paths:
      - '.github/apply-hospital-ocr-findings-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE: clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Doplnit článek
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 scripts/update_hospital_latest_20260730_1429.py
          git config user.name 'Naše Kadaň aktualizace'
          git config user.email 'info@nasekadan.cz'
          git add "$ARTICLE"
          git commit -m 'Doplnit úvěrové a IT smlouvy a kontrolu ve 14:29' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Nasadit přímo na server
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          python3 scripts/enforce_article_visibility.py
          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          if [[ -z "$cid" ]]; then cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"; fi
          test -n "$cid"
          for file in index.html clanky/index.html clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html clanky/martin-kadlec-navrat-hokej-kadan-2026.html rss.xml sitemap.xml news-sitemap.xml; do
            sudo install -d -m 0755 "/var/www/nasekadan/$(dirname "$file")"
            sudo install -m 0644 "$file" "/var/www/nasekadan/$file"
            sudo docker exec "$cid" mkdir -p "/usr/share/nginx/html/$(dirname "$file")"
            sudo docker cp "$file" "$cid:/usr/share/nginx/html/$file"
          done
          REMOTE
      - name: Veřejně ověřit
        run: |
          set -euo pipefail
          for n in $(seq 1 30); do
            page="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/martin-kadlec-navrat-hokej-kadan-2026.html?latest=${GITHUB_SHA}-${n}" || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?latest=${GITHUB_SHA}-${n}" || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?latest=${GITHUB_SHA}-${n}" || true)"
            if grep -Fq 'Martin Kadlec po deseti letech' <<<"$page" \
              && grep -Fq 'martin-kadlec-navrat-hokej-kadan-2026.html' <<<"$home" \
              && grep -Fq 'martin-kadlec-navrat-hokej-kadan-2026.html' <<<"$archive"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
