name: Kanonicky obnovit publikaci KZK

on:
  issues:
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canonical-recover-kzk
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 507
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit publikaci v main
        shell: bash
        run: |
          set -euo pipefail
          test -s clanky/kulturni-zarizeni-kadan.html
          test -s social/kulturni-zarizeni-kadan-20260802.png
          grep -Fq 'Od Střelnice po klášter' clanky/kulturni-zarizeni-kadan.html
          grep -Fq '/clanky/kulturni-zarizeni-kadan.html' index.html
          grep -Fq '/clanky/kulturni-zarizeni-kadan.html' clanky/index.html
          grep -Fq 'https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html' rss.xml
          grep -Fq 'https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html' sitemap.xml
          grep -Fq 'https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html' news-sitemap.xml

      - name: Vybrat dostupný SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_key"
              chmod 600 "$RUNNER_TEMP/nasekadan_key"
              echo "secret=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'Chybí použitelný SSH klíč.' >&2
          exit 20

      - name: Obnovit soubory na kanonickém serveru
        id: deploy
        shell: bash
        run: |
          set +e
          ssh -i "$RUNNER_TEMP/nasekadan_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' 2>&1 <<'REMOTE' | tee "$RUNNER_TEMP/kzk-canonical-deploy.log"
          set -euxo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd

          files=(
            index.html
            clanky/index.html
            clanky/kulturni-zarizeni-kadan.html
            social/kulturni-zarizeni-kadan-20260802.png
            rss.xml
            sitemap.xml
            news-sitemap.xml
            site.js
            style.css
            footer.css
            mobile.css
            reklamy.js
            reklamy-sidebar.js
            reklamy-sidebar.css
            reklamy-oprava-obrazku.js
            obsah-doplnky.js
            ad-spacing-guard.js
            analytics.js
          )

          sudo mkdir -p /var/www/nasekadan/clanky /var/www/nasekadan/social
          for file in "${files[@]}"; do
            test -s "$file"
            sudo install -D -m 0644 "$file" "/var/www/nasekadan/$file"
          done
          sudo chmod -R a+rX /var/www/nasekadan

          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          if [[ -z "$cid" ]]; then
            cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"
          fi
          if [[ -n "$cid" ]]; then
            for file in "${files[@]}"; do
              dir="$(dirname "$file")"
              if [[ "$dir" != "." ]]; then sudo docker exec "$cid" mkdir -p "/usr/share/nginx/html/$dir"; fi
              sudo docker cp "$file" "$cid:/usr/share/nginx/html/$file"
            done
          fi

          grep -Fq 'Od Střelnice po klášter' /var/www/nasekadan/clanky/kulturni-zarizeni-kadan.html
          grep -Fq '/clanky/kulturni-zarizeni-kadan.html' /var/www/nasekadan/index.html
          grep -Fq '/clanky/kulturni-zarizeni-kadan.html' /var/www/nasekadan/clanky/index.html
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Veřejně ověřit článek a pořadí
        id: live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time, urllib.request
          base='https://nasekadan.cz'
          rel='/clanky/kulturni-zarizeni-kadan.html'
          absu=base+rel
          title='Od Střelnice po klášter. Co všechno pro Kadaň zajišťuje KZK'
          def get(path, attempt):
              url=base+path+('?' if '?' not in path else '&')+f'kzkcanonical={int(time.time()*1000)}-{attempt}'
              req=urllib.request.Request(url,headers={'User-Agent':'NaseKadan-KZK-Canonical/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode('utf-8','replace')
          last=''
          for attempt in range(1,25):
              try:
                  article=get(rel,attempt)
                  home=get('/',attempt)
                  archive=get('/clanky/',attempt)
                  rss=get('/rss.xml',attempt)
                  sitemap=get('/sitemap.xml',attempt)
                  news=get('/news-sitemap.xml',attempt)
                  assert title in article
                  assert 'id="konirna"' in article
                  assert 'data-promos data-context="sidebar"' in article
                  assert title in home and f'data-latest-article-href="{rel}"' in home
                  assert rel in archive
                  old='/clanky/petice-nemocnice-kadan-podpisova-mista-2026.html'
                  assert old not in archive or archive.find(rel) < archive.find(old)
                  i=rss.find('<item>'); j=rss.find('</item>',i)
                  assert i>=0 and j>i and absu in rss[i:j]
                  assert absu in sitemap and absu in news
                  print('Veřejný obsah a pořadí jsou správné.')
                  break
              except Exception as exc:
                  last=repr(exc)
                  time.sleep(min(5+attempt*2,20))
          else:
              raise SystemExit('Veřejná kontrola selhala: '+last)
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Nainstalovat Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Ověřit skutečně vykreslené reklamy
        id: ads
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1800}});
            await page.goto('https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html?ads='+Date.now(),{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(6000);
            const body=await page.locator('body').innerText();
            if(!body.includes('Od Střelnice po klášter')) throw new Error('Článek se nevykreslil.');
            const stream=await page.locator('.article-aside-adstream').count();
            const cards=await page.locator('[class*="article-aside-ad-"], .promo-card, .article-ad-auto').count();
            if(stream < 1 || cards < 1) throw new Error(`Reklamy se nevykreslily: stream=${stream}, cards=${cards}`);
            console.log(`adstream=${stream}, cards=${cards}`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat výsledek do issue 507
        if: always()
        uses: actions/github-script@v7
        env:
          KEY_OUTCOME: ${{ steps.key.outcome }}
          KEY_SECRET: ${{ steps.key.outputs.secret }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_CODE: ${{ steps.deploy.outputs.exit_code }}
          LIVE_OK: ${{ steps.live.outputs.ok }}
          ADS_OK: ${{ steps.ads.outputs.ok }}
        with:
          script: |
            const issue_number=507;
            const ok=process.env.LIVE_OK==='true' && process.env.ADS_OK==='true';
            let tail='';
            try { tail=require('fs').readFileSync(process.env.RUNNER_TEMP+'/kzk-canonical-deploy.log','utf8').slice(-1800); } catch {}
            const body=ok
              ? '✅ Článek KZK je veřejný, první na titulní straně i v archivu, první v RSS, uvedený v sitemap.xml a news-sitemap.xml a reklamy se skutečně vykreslují.\n\nhttps://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html'
              : `🚨 Kanonická obnova KZK selhala. SSH klíč: ${process.env.KEY_SECRET||'nenalezen'}, deploy: ${process.env.DEPLOY_OUTCOME||'skipped'} (${process.env.DEPLOY_CODE||'bez kódu'}), veřejný obsah: ${process.env.LIVE_OK||'false'}, reklamy: ${process.env.ADS_OK||'false'}.\n\nKonec diagnostiky:\n\`\`\`\n${tail}\n\`\`\``;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number,body});
            if(ok) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number,state:'closed',state_reason:'completed'});
