name: Odstranit poškozený snímek z článku o vedrech

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-broken-heat-image-now.yml

permissions:
  contents: write

concurrency:
  group: nasekadan-remove-broken-heat-image
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nahradit poškozenou fotografii informačním blokem
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html')
          text = path.read_text(encoding='utf-8')
          pattern = r'''\s*<figure class="article-photo">\s*<img src="/obrazky/koupaliste-kadan-oteviraci-doba-2026\.jpg\?v=20260728-2".*?</figure>\s*'''
          replacement = '''\n  <div class="callout"><strong>Otevírací dobu a ceny ověřujte podle aktuálního provozu</strong><p>Přehled běžné otevírací doby je uveden v tabulce výše. Při mimořádné akci nebo změně počasí se může provoz upravit; aktuální informace poskytne recepce koupaliště na čísle <a href="tel:+420774226912">774 226 912</a> nebo oficiální web provozovatele.</p></div>\n\n'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Poškozený obrázek nebyl v článku nalezen v očekávané podobě.')
          if 'koupaliste-kadan-oteviraci-doba-2026.jpg?v=20260728-2' in text:
              raise SystemExit('Odkaz na poškozený obrázek v článku stále zůstal.')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Zapsat opravu
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-broken-heat-image-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Odstranit poškozený snímek z článku o vedrech"
          git push origin HEAD:main

  deploy:
    needs: repair
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Nasadit a ověřit opravený článek
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash deploy/sync-production.sh
          HTML="$(mktemp)"
          curl -kfsS --resolve nasekadan.cz:443:127.0.0.1 \
            'https://nasekadan.cz/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html?fix=remove-broken-image' -o "$HTML"
          grep -Fq 'Otevírací dobu a ceny ověřujte podle aktuálního provozu' "$HTML"
          if grep -Fq 'koupaliste-kadan-oteviraci-doba-2026.jpg?v=20260728-2' "$HTML"; then
            echo 'Veřejná stránka stále obsahuje poškozený obrázek.' >&2
            exit 1
          fi
