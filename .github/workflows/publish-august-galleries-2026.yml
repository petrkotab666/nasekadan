name: Publikovat srpnový program galerií
run-name: Trvale nasadit srpnový program galerií

on:
  push:
    branches: [main]
    paths:
      - 'clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html'
      - '.github/workflows/publish-august-galleries-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-august-galleries-2026-permanent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sestavit článek a všechny veřejné přehledy
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          slug='srpen-kadanske-galerie-vystavy-workshop-2026.html'
          test -f "clanky/$slug"
          python3 -m pip install --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/normalize_footers.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/enforce_article_visibility.py
          python3 scripts/ensure_all_published_articles_in_rss.py
          python3 scripts/sort_articles_chronologically.py
          python3 scripts/enforce_latest_homepage_hero.py
          python3 scripts/prepare_discovery.py
          python3 scripts/clean_sitemap_technical_entries.py

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          slug = 'srpen-kadanske-galerie-vystavy-workshop-2026.html'
          url = f'https://nasekadan.cz/clanky/{slug}'
          path = Path('sitemap.xml')
          root = ET.fromstring(path.read_text(encoding='utf-8'))
          ns = 'http://www.sitemaps.org/schemas/sitemap/0.9'
          present = any((node.text or '').strip() == url for node in root.findall(f'{{{ns}}}url/{{{ns}}}loc'))
          if not present:
              entry = ET.SubElement(root, f'{{{ns}}}url')
              ET.SubElement(entry, f'{{{ns}}}loc').text = url
              ET.indent(root, space='  ')
              path.write_text("<?xml version='1.0' encoding='utf-8'?>\n" + ET.tostring(root, encoding='unicode') + '\n', encoding='utf-8')
          PY

          grep -Fq '/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html' index.html
          grep -Fq '/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html' clanky/index.html
          grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' rss.xml
          grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' sitemap.xml

      - name: Trvale uložit vygenerované soubory do main
        id: save
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Naše Kadaň – publikace galerií'
          git config user.email 'info@nasekadan.cz'
          for path in \
            clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html \
            index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml \
            social llms.txt llms-full.txt; do
            if [[ -e "$path" ]]; then
              git add -A -- "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Trvale zařadit srpnový program galerií do webu [skip ci]'
            saved=false
            for attempt in 1 2 3 4 5 6; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                saved=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            test "$saved" = true
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

          git fetch origin main
          git reset --hard origin/main
          for file in index.html clanky/index.html rss.xml sitemap.xml; do
            grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' "$file"
          done

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"
              selected="$name"
              break
            fi
          done
          test -n "$selected"
          test -s "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"

      - name: Nasadit aktuální main na OVH
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' index.html
          grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' clanky/index.html
          grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' rss.xml
          grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' sitemap.xml
          timeout 30m env NASEKADAN_SKIP_AUTOMATION_INSTALL=1 bash deploy/sync-production.sh
          REMOTE

      - name: Ověřit živou doménu bez cache
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          success=false
          for attempt in $(seq 1 40); do
            token="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html?verify=$token" -o /tmp/article.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?verify=$token" -o /tmp/home.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?verify=$token" -o /tmp/archive.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?verify=$token" -o /tmp/rss.xml || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?verify=$token" -o /tmp/sitemap.xml || true
            if grep -Fq 'Srpen v kadaňských galeriích nabídne houby' /tmp/article.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/home.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/archive.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/rss.xml \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/sitemap.xml; then
              success=true
              break
            fi
            sleep 10
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          test "$success" = true

      - name: Zapsat výsledek publikace
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD: ${{ steps.build.outcome }}
          SAVE: ${{ steps.save.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const ok = ['BUILD','SAVE','DEPLOY','VERIFY'].every(k => process.env[k] === 'success');
            const path = 'august-galleries-permanent-status.json';
            const status = {
              status: ok ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              run_id: context.runId,
              source_sha: context.sha,
              build: process.env.BUILD || 'skipped',
              source_saved: process.env.SAVE || 'skipped',
              deployment: process.env.DEPLOY || 'skipped',
              public_verification: process.env.VERIFY || 'skipped',
              article: 'https://nasekadan.cz/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat trvalou publikaci srpnových galerií: ${status.status} [skip ci]`,
              content,
              ...(sha ? {sha} : {})
            });
