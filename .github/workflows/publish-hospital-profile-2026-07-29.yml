name: Publikovat závěrečný profil Nemocnice Kadaň

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publikovat ihned
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-hospital-profile-2026-07-29
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit závěrečný díl
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          target='2026-07-29T03:00:00Z'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          force='${{ inputs.force || false }}'
          if [[ -f clanky/nemocnice-kadan-profil-sluzby-budoucnost.html ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$force" != 'true' && "$now" < "$target" ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 scripts/bootstrap_arc_med_draft.py
          python3 scripts/update_hospital_profile_municipal_support.py
          python3 scripts/add_syringe_teaser.py
          cp .github/drafts/nemocnice-kadan-profil-sluzby-budoucnost.html clanky/nemocnice-kadan-profil-sluzby-budoucnost.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('clanky/nemocnice-kadan-profil-sluzby-budoucnost.html')
          t=p.read_text(encoding='utf-8').replace('noindex,nofollow','index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1').replace('../../','../').replace('PŘIPRAVOVANÝ ZÁVĚREČNÝ DÍL','29. ČERVENCE 2026')
          t=re.sub(r'<div class="sidebox preview-note">.*?</div>','',t,count=1,flags=re.S)
          published='2026-07-29T05:00:00+02:00'
          if 'article:published_time' not in t:
              t=t.replace('</head>',f'<meta property="article:published_time" content="{published}"><meta property="article:modified_time" content="{published}">\n</head>',1)
          t=re.sub(r'("datePublished"\s*:\s*")([^"]*)',r'\g<1>'+published,t)
          t=re.sub(r'("dateModified"\s*:\s*")([^"]*)',r'\g<1>'+published,t)
          p.write_text(t,encoding='utf-8',newline='\n')
          PY
          python3 scripts/link_hospital_series.py
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Uložit veřejnou verzi
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- clanky/nemocnice-kadan-profil-sluzby-budoucnost.html clanky/arc-med-nemocnice-kadan.html clanky/avies-nemocnice-kadan.html clanky/nemocnice-kadan.html clanky/petice-nemocnice-kadan.html clanky/nemocnice-kadan-software-kyberbezpecnost.html scripts/link_hospital_series.py scripts/add_syringe_teaser.py style.css index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt social
          git commit -m 'Publikovat: závěrečný profil Nemocnice Kadaň'
          git pull --rebase origin main
          git push origin main
