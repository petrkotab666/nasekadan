name: Publikovat nedělní článek o softwaru

on:
  push:
    branches: [main]
    paths:
      - '.github/publish-software-article-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stáhnout hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit publikaci
        run: python3 .github/scripts/publish_software_article.py

      - name: Uložit publikaci
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add clanky/nemocnice-kadan-software-kyberbezpecnost.html clanky/petice-nemocnice-kadan.html index.html clanky/index.html rss.xml sitemap.xml
          if git diff --cached --quiet; then
            echo 'Publikace už byla v hlavní větvi připravena.'
          else
            git commit -m 'Publikovat: 64,7 milionu za software v Nemocnici Kadaň'
            git push origin main
          fi
