name: Opravit čitelnost ankety u alžbětinského kláštera

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_alzbetinsky_poll_contrast.py'
      - '.github/workflows/fix-alzbetinsky-poll-contrast.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-alzbetinsky-poll-contrast
  cancel-in-progress: true

env:
  ARTICLE: clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
  DRAFT: .github/drafts/alzbetinsky-klaster-kadan-20260803.html
  VERSION: 20260803-alzbetinsky-contrast-v1
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  repair-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Načíst main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit kontrast a ověřit zdroje
        run: |
          set -euo pipefail
          python3 scripts/fix_alzbetinsky_poll_contrast.py
          node --check site.js
          grep -Fq 'POLL_ALZBETINSKY_HIGH_CONTRAST_V1' site.js
          grep -Fq '[data-poll-id=\"alzbetinsky-klaster-kadan-2026\"] .poll-result-label' site.js
          grep -Fq "button.style.color = selected ? '#74152a' : '';" site.js
          grep -Fq "/site.js?v=${VERSION}" "$ARTICLE"
          grep -Fq "/site.js?v=${VERSION}" "$DRAFT"

      - name: Uložit trvalou opravu
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kontrast ankety'
          git config user.email 'info@nasekadan.cz'
          git add site.js "$ARTICLE" "$DRAFT" scripts/fix_alzbetinsky_poll_contrast.py
          if ! git diff --cached --quiet; then
            git commit -m 'Opravit čitelnost ankety u alžbětinského kláštera [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 5 ]] && exit 1
              sleep $((attempt * 4))
            done
          fi
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/fix_alzbetinsky_poll_contrast.py

      - name: Připravit SSH klíč
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then
            printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          elif [[ -n "${KEY2:-}" ]]; then
            printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          else
            echo 'Chybí SSH klíč pro OVH.' >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit opravu na OVH
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-alzbetinsky-contrast"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky"
          cp site.js "$bundle/site.js"
          cp "$ARTICLE" "$bundle/clanky/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-alzbetinsky-contrast
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -m 0644 /tmp/nk-alzbetinsky-contrast/site.js /var/www/nasekadan/site.js
          sudo install -m 0644 /tmp/nk-alzbetinsky-contrast/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html /var/www/nasekadan/clanky/
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-alzbetinsky-contrast/site.js nasekadan-web:/usr/share/nginx/html/site.js
            sudo docker cp /tmp/nk-alzbetinsky-contrast/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html nasekadan-web:/usr/share/nginx/html/clanky/
          fi
          grep -Fq 'POLL_ALZBETINSKY_HIGH_CONTRAST_V1' /var/www/nasekadan/site.js
          grep -Fq '/site.js?v=20260803-alzbetinsky-contrast-v1' /var/www/nasekadan/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
          rm -rf /tmp/nk-alzbetinsky-contrast
          REMOTE

      - name: Veřejně ověřit kontrast ankety
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock jsdom@24 >/dev/null
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 18); do
            article="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/$ARTICLE?v=${stamp}-${attempt}" || true)"
            js="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/site.js?v=${stamp}-${attempt}" || true)"
            if ARTICLE_HTML="$article" SITE_JS="$js" node <<'NODE'
          const {JSDOM}=await import('jsdom');
          const article=process.env.ARTICLE_HTML||'';
          const js=process.env.SITE_JS||'';
          if(!article.includes('/site.js?v=20260803-alzbetinsky-contrast-v1'))process.exit(1);
          if(!js.includes('POLL_ALZBETINSKY_HIGH_CONTRAST_V1'))process.exit(1);
          const dom=new JSDOM(article,{url:'https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html',runScripts:'outside-only',pretendToBeVisual:true});
          const w=dom.window;
          const first=w.document.querySelector('[data-poll-vote]');
          if(!first)process.exit(1);
          const choice=first.getAttribute('data-poll-vote');
          w.fetch=async()=>({ok:true,json:async()=>({ok:true,pollId:'alzbetinsky-klaster-kadan-2026',total:1,selected:choice,counts:{[choice]:1},percentages:{[choice]:100}})});
          w.eval(js);
          w.document.dispatchEvent(new w.Event('DOMContentLoaded',{bubbles:true}));
          await new Promise(r=>setTimeout(r,120));
          const selected=w.document.querySelector('[data-poll-vote][aria-pressed="true"]');
          const label=w.document.querySelector('.poll-result-label');
          const value=w.document.querySelector('.poll-result-value');
          const heading=w.document.querySelector('.poll-results-head strong');
          const status=w.document.querySelector('.poll-results-status');
          if(!selected||!label||!value||!heading||!status)process.exit(1);
          const compact=el=>w.getComputedStyle(el).color.replace(/\s/g,'');
          const colors={selected:compact(selected),label:compact(label),value:compact(value),heading:compact(heading),status:compact(status)};
          const ok=colors.selected==='rgb(116,21,42)' && colors.label==='rgb(255,255,255)' && colors.heading==='rgb(255,255,255)' && colors.value==='rgb(249,233,237)' && colors.status==='rgb(249,233,237)';
          console.log(colors);
          process.exit(ok?0:1);
NODE
            then
              exit 0
            fi
            sleep 5
          done
          echo 'Veřejný kontrast ankety nebyl potvrzen.' >&2
          exit 1
