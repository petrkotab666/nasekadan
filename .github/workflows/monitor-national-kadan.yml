name: Monitoring státu a celostátních zdrojů pro Kadaň — nahrazeno centrálním monitoringem

# Dřívější samostatný monitoring celostátních zdrojů je ponechán pouze pro
# ruční diagnostiku. Automatické kontroly státu, soudů, registrů i médií nyní
# provádí jediný centrální monitoring „Kompletní monitoring Kadaně“ se společnou
# deduplikací a stabilními fingerprinty.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Informace
        run: echo 'Automatický běh je vypnutý ve prospěch centrálního monitoringu Kadaně.'
