name: Uvolnit místo a nasadit opravenou titulku

on:
  push:
    branches: [main]
    paths:
      - '.github/emergency-free-space-deploy-homepage-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-emergency-free-space-homepage
  cancel-in-progress: true

jobs:
  cleanup-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit opravené zdroje
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in ('index.html', 'clanky/index.html'):
              text = Path(path).read_text(encoding='utf-8')
              cards = re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?</article>', text, re.I | re.S)
              if len(cards) < 3:
                  raise SystemExit(f'{path}: příliš málo karet')
              for card in cards:
                  visual = re.search(r'<div\b[^>]*class="[^"]*visual[^"]*"[^>]*>.*?</div>', card, re.I | re.S)
                  if not visual or 'background-image:' not in visual.group(0):
                      raise SystemExit(f'{path}: chybí náhledový obrázek')
                  if re.search(r'<strong\b', visual.group(0), re.I):
                      raise SystemExit(f'{path}: zdvojený titulek')
          print('Zdrojové soubory jsou opravené.')
          PY

      - name: Připravit SSH klíč
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Bezpečně uvolnit místo na serveru
        id: cleanup
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          echo '=== DISK PŘED ČIŠTĚNÍM ==='
          df -h / /tmp /var/www 2>/dev/null || true
          df -i / 2>/dev/null || true

          # Jen známé dočasné adresáře z nasazovacích úloh.
          sudo rm -rf /tmp/nk-* /tmp/nasekadan-* /tmp/card-* /tmp/*-deploy-* 2>/dev/null || true
          sudo find /tmp -xdev -mindepth 1 -maxdepth 1 -mtime +2 -exec rm -rf -- {} + 2>/dev/null || true
          sudo find /var/tmp -xdev -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf -- {} + 2>/dev/null || true

          # Bezpečné systémové cache a historické logy.
          sudo journalctl --vacuum-size=100M 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true

          # Aktivní kontejnery a jejich data se nemažou; zkrátí se jen přerostlé textové logy.
          sudo find /var/lib/docker/containers -type f -name '*-json.log' -size +20M \
            -exec sh -c ': > "$1"' _ {} \; 2>/dev/null || true
          sudo docker builder prune -af 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true

          echo '=== DISK PO ČIŠTĚNÍ ==='
          df -h / /tmp /var/www 2>/dev/null || true
          available_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "Volné místo: ${available_kb} KB"
          test "$available_kb" -ge 20480
          REMOTE

      - name: Nasadit titulku přímo do webového adresáře
        id: deploy
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215)
          "${SSH[@]}" 'sudo -n true && sudo install -d -m 0755 /var/www/nasekadan/clanky'
          cat index.html | "${SSH[@]}" 'sudo tee /var/www/nasekadan/index.html >/dev/null && sudo chmod 0644 /var/www/nasekadan/index.html && test -s /var/www/nasekadan/index.html'
          cat clanky/index.html | "${SSH[@]}" 'sudo tee /var/www/nasekadan/clanky/index.html >/dev/null && sudo chmod 0644 /var/www/nasekadan/clanky/index.html && test -s /var/www/nasekadan/clanky/index.html'
          "${SSH[@]}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if sudo docker ps --format '{{.Names}}' | grep -Fxq nasekadan-web; then
            sudo docker cp /var/www/nasekadan/index.html nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp /var/www/nasekadan/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker exec nasekadan-web test -s /usr/share/nginx/html/index.html
            sudo docker exec nasekadan-web test -s /usr/share/nginx/html/clanky/index.html
          fi
          REMOTE

      - name: Ověřit veřejný web a první náhledy
        id: verify
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in $(seq 1 36); do
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/index.html?homepagefix=${stamp}-${attempt}" -o /tmp/home.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/index.html?homepagefix=${stamp}-${attempt}" -o /tmp/archive.html || true
            if python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def inspect(path):
              text = Path(path).read_text(encoding='utf-8', errors='replace') if Path(path).exists() else ''
              cards = re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?</article>', text, re.I | re.S)
              if len(cards) < 3:
                  return False, []
              urls = []
              for card in cards:
                  visual = re.search(r'<div\b[^>]*class="[^"]*visual[^"]*"[^>]*>.*?</div>', card, re.I | re.S)
                  if not visual or 'background-image:' not in visual.group(0):
                      return False, []
                  if re.search(r'<strong\b', visual.group(0), re.I):
                      return False, []
                  m = re.search(r"url\('([^']+)'\)", visual.group(0))
                  if m:
                      urls.append(m.group(1))
              return True, urls[:3]

          home_ok, images = inspect('/tmp/home.html')
          archive_ok, _ = inspect('/tmp/archive.html')
          if not home_ok or not archive_ok or len(images) != 3:
              raise SystemExit(1)
          for image in images:
              url = image if image.startswith('http') else 'https://nasekadan.cz/' + image.lstrip('/')
              subprocess.run(['curl','-4','-kfsSI','--max-time','20',url], check=True, stdout=subprocess.DEVNULL)
          PY
            then
              echo 'Veřejná titulka i archiv jsou opravené a první tři náhledy jsou dostupné.'
              exit 0
            fi
            sleep 5
          done
          echo 'Veřejné ověření neprošlo.' >&2
          exit 1

      - name: Zapsat výsledek opravy
        if: always()
        uses: actions/github-script@v7
        env:
          CLEANUP: ${{ steps.cleanup.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'homepage-emergency-repair-status.json';
            const ok = process.env.CLEANUP === 'success' && process.env.DEPLOY === 'success' && process.env.VERIFY === 'success';
            const status = {
              status: ok ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              disk_cleanup: process.env.CLEANUP || 'skipped',
              server_deploy: process.env.DEPLOY || 'skipped',
              public_verification: process.env.VERIFY || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner:context.repo.owner, repo:context.repo.repo, path, ref:'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner, repo:context.repo.repo, path, branch:'main',
              message:`Zapsat stav nouzové opravy titulky: ${status.status}`,
              content, ...(sha ? {sha} : {})
            });
