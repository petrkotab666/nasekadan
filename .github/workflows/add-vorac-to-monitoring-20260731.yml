# dočasné nouzové využití ověřeného OVH kanálu
name: Okamžitě nasadit srpnový program galerií

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-vorac-to-monitoring-20260731.yml'
      - 'scripts/deploy_august_galleries_emergency.sh'
      - 'clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-august-galleries-emergency
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit článek přímo na OVH a veřejně ho ověřit
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/deploy_august_galleries_emergency.sh
          bash scripts/deploy_august_galleries_emergency.sh
          test -f /tmp/august-galleries-deploy-success

      - name: Zapsat ověřený stav
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
        with:
          script: |
            const path='august-galleries-live-status.json';
            const ok=process.env.DEPLOY==='success';
            const status={
              status:ok?'success':'failed',
              checked_at_utc:new Date().toISOString(),
              run_id:context.runId,
              source_sha:context.sha,
              deploy_outcome:process.env.DEPLOY||'skipped',
              article:'https://nasekadan.cz/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html',
              homepage:ok,
              archive:ok,
              rss:ok,
              sitemap:ok
            };
            const content=Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64');
            let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat ostré nasazení srpnového programu galerií: ${status.status} [skip ci]`,content,...(sha?{sha}:{})});

      - name: Potvrdit úspěšné nasazení
        if: steps.deploy.outcome != 'success'
        run: exit 1
