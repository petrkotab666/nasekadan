name: Přidat kožní ambulanci MUDr. Voráče do monitoringu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-vorac-to-monitoring-20260731.yml'
      - 'scripts/add_vorac_to_organizations_20260731.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-vorac-monitoring
  cancel-in-progress: true

jobs:
  update-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit ambulanci do adresáře
        run: python3 scripts/add_vorac_to_organizations_20260731.py

      - name: Ověřit data
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Kožní ambulance MUDr. Stanislava Voráče' data/organizations.json
          grep -Fq 'https://mudr-vorac.webnode.cz/' data/organizations.json

      - name: Uložit změnu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – monitoring organizací'
          git config user.email 'info@nasekadan.cz'
          git add data/organizations.json
          if git diff --cached --quiet; then
            echo 'Ambulance už je v adresáři.'
          else
            git commit -m 'Přidat kožní ambulanci MUDr. Voráče do monitoringu'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit adresář
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            data/organizations.json ubuntu@57.129.43.215:/tmp/organizations.json
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/data
          sudo install -m 0644 /tmp/organizations.json /var/www/nasekadan/data/organizations.json
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/organizations.json nasekadan-web:/usr/share/nginx/html/data/organizations.json
          fi
          rm -f /tmp/organizations.json
          REMOTE

      - name: Ověřit veřejný adresář
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          curl -4 -kfsS --max-time 30 "https://nasekadan.cz/data/organizations.json?vorac=${GITHUB_RUN_ID}-$(date +%s)" -o /tmp/org-live.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/org-live.json',encoding='utf-8'))
          text=json.dumps(data,ensure_ascii=False)
          assert 'Kožní ambulance MUDr. Stanislava Voráče' in text
          assert 'https://mudr-vorac.webnode.cz/' in text
          print('Veřejný adresář obsahuje kožní ambulanci MUDr. Voráče.')
          PY

      - name: Zapsat stav
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path='.github/vorac-monitoring-live-status.json';
            const ok=process.env.DEPLOY==='success'&&process.env.VERIFY==='success';
            const status={status:ok?'passed':'failed',checkedAtUtc:new Date().toISOString(),runId:context.runId,sourceSha:context.sha,serverDeploy:process.env.DEPLOY||'skipped',publicVerification:process.env.VERIFY||'skipped',publicUrl:'https://nasekadan.cz/organizace/'};
            const content=Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64');
            let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(current.data))sha=current.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat monitoring kožní ambulance MUDr. Voráče: ${status.status} [skip ci]`,content,...(sha?{sha}:{})});
