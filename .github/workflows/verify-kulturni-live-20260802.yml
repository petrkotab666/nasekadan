name: Jednorázově ověřit kulturní přehled 3.–9. srpna

on:
  push:
    branches: [main]
    paths:
      - '.github/verify-kulturni-live-20260802-trigger.txt'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Živá kontrola
        id: check
        shell: bash
        run: |
          set +e
          slug='kam-v-kadani-a-okoli-3-9-srpna-2026'
          path="/clanky/${slug}.html"
          url="https://nasekadan.cz${path}"
          expected='Kam v Kadani a okolí od 3. do 9. srpna: med, móda, dixieland, kino a koupání'
          result='failure'; detail=''
          for attempt in $(seq 1 24); do
            stamp="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            rm -f /tmp/nk-{article,home,archive,rss,sitemap,news,health,og}
            a=0; h=0; ar=0; r=0; s=0; n=0; dh=0; meta=0; og=0; surfaces=1
            curl -4 -kfsS --max-time 30 "${url}?verify=${stamp}" -o /tmp/nk-article && a=1
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/?verify=${stamp}" -o /tmp/nk-home && h=1
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/clanky/?verify=${stamp}" -o /tmp/nk-archive && ar=1
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/rss.xml?verify=${stamp}" -o /tmp/nk-rss && r=1
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/sitemap.xml?verify=${stamp}" -o /tmp/nk-sitemap && s=1
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/news-sitemap.xml?verify=${stamp}" -o /tmp/nk-news && n=1
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/deployment-health.txt?verify=${stamp}" -o /tmp/nk-health && dh=1
            if [ "$a" = 1 ] && grep -Fq "<h1>${expected}</h1>" /tmp/nk-article \
              && grep -Fq '<link rel="canonical" href="https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html">' /tmp/nk-article \
              && grep -Fq 'property="og:image:width" content="1200"' /tmp/nk-article \
              && grep -Fq 'property="og:image:height" content="630"' /tmp/nk-article \
              && grep -Fq 'NewsArticle' /tmp/nk-article; then meta=1; fi
            og_url="$(sed -n 's/.*property="og:image" content="\([^"]*\)".*/\1/p' /tmp/nk-article 2>/dev/null | head -n1)"
            if [ -n "$og_url" ] && curl -4 -kfsS --max-time 30 "${og_url}?verify=${stamp}" -o /tmp/nk-og; then
              python3 - <<'PY' && og=1
import struct
with open('/tmp/nk-og','rb') as f: b=f.read(24)
assert b[:8]==b'\x89PNG\r\n\x1a\n'
assert struct.unpack('>II',b[16:24])==(1200,630)
PY
            fi
            for f in /tmp/nk-home /tmp/nk-archive /tmp/nk-rss /tmp/nk-sitemap /tmp/nk-news; do
              [ -s "$f" ] && grep -Fq "$path" "$f" || surfaces=0
            done
            main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
            source_sha="$(sed -n 's/^source=//p' /tmp/nk-health 2>/dev/null | head -n1)"
            source=0; [ -n "$main_sha" ] && [ "$source_sha" = "$main_sha" ] && source=1
            detail="attempt=$attempt article=$a home=$h archive=$ar rss=$r sitemap=$s news=$n health=$dh metadata=$meta og=$og surfaces=$surfaces source_match=$source main=$main_sha source=$source_sha og_url=$og_url"
            echo "$detail"
            if [ "$a$h$ar$r$s$n$dh$meta$og$surfaces$source" = '11111111111' ]; then result='success'; break; fi
            sleep 15
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          [ "$result" = success ]
      - name: Zapsat výsledek do servisního issue
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.check.outputs.result }}
          DETAIL: ${{ steps.check.outputs.detail }}
        with:
          script: |
            const ok = process.env.RESULT === 'success';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 535, body: `${ok ? '✅ LIVE OVĚŘENÍ ÚSPĚŠNÉ' : '❌ LIVE OVĚŘENÍ NEÚSPĚŠNÉ'}\n\n\`${process.env.DETAIL || 'bez detailu'}\`\n\nRun: ${context.runId}`});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: 535, state: 'closed', state_reason: 'completed'});
