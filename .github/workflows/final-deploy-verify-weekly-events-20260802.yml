name: Finálně nasadit a ověřit kulturní týden 3.–9. srpna

on:
  push:
    branches: [main]
    paths:
      - '.github/final-deploy-verify-weekly-events-20260802-trigger.txt'

permissions:
  contents: write
  issues: write

concurrency:
  group: final-weekly-events-20260802
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit a ověřit přímo na OVH
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          EXPECTED_SOURCE="$(git rev-parse HEAD)"
          export EXPECTED_SOURCE
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 "EXPECTED_SOURCE='$EXPECTED_SOURCE' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          SOURCE="$(git rev-parse HEAD)"
          test "$SOURCE" = "$EXPECTED_SOURCE"
          chmod +x deploy/sync-production.sh
          if ! sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh; then
            sudo install -d -m 0755 /var/www/nasekadan
            sudo find /var/www/nasekadan -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar --exclude='.git' --exclude='.github' --exclude='Dockerfile' --exclude='docker-compose.yml' --exclude='nginx' --exclude='scripts' --exclude='deploy' -C /opt/nasekadan -cf - . | sudo tar -C /var/www/nasekadan -xf -
            printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=static-fallback\n' "$SOURCE" "$(date -u +%FT%TZ)" | sudo tee /var/www/nasekadan/deployment-health.txt >/dev/null
            sudo chmod -R a+rX /var/www/nasekadan
          fi

          root='/var/www/nasekadan'
          slug='kam-v-kadani-a-okoli-3-9-srpna-2026'
          rel="/clanky/${slug}.html"
          article="$root$rel"
          test -s "$article"
          grep -Fq '<h1>Kam v Kadani a okolí od 3. do 9. srpna: med, móda, dixieland, kino a koupání</h1>' "$article"
          grep -Fq '<link rel="canonical" href="https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html">' "$article"
          grep -Fq 'name="description"' "$article"
          grep -Fq 'property="og:image:width" content="1200"' "$article"
          grep -Fq 'property="og:image:height" content="630"' "$article"
          grep -Fq 'NewsArticle' "$article"
          grep -Fq 'Autokemp Prunéřov: pondělí 3. srpna bude restaurace otevřená' "$article"
          grep -Fq 'elektrocentrále' "$article"
          grep -Fq 'platební terminál' "$article"
          grep -Fq '10. srpna' "$article"
          grep -Fq '14. srpna' "$article"
          for file in "$root/index.html" "$root/clanky/index.html" "$root/rss.xml" "$root/sitemap.xml" "$root/news-sitemap.xml"; do
            test -s "$file"
            grep -Fq "$rel" "$file"
          done
          og_url="$(sed -n 's/.*property="og:image" content="\([^"]*\)".*/\1/p' "$article" | head -n1)"
          test -n "$og_url"
          og_rel="${og_url#https://nasekadan.cz/}"
          og_file="$root/$og_rel"
          test -s "$og_file"
          python3 - "$og_file" <<'PY'
          import struct, sys
          with open(sys.argv[1], 'rb') as f:
              data=f.read(24)
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', data[16:24]) == (1200, 630)
          PY
          grep -Fq "source=$SOURCE" "$root/deployment-health.txt"
          for endpoint in "$rel" '/' '/clanky/' '/rss.xml' '/sitemap.xml' '/news-sitemap.xml'; do
            curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz${endpoint}?verify=final-weekly-20260802" >/dev/null
          done
          printf 'source=%s\nog=%s\n' "$SOURCE" "$og_url"
          REMOTE

      - name: Zapsat konečný výsledek
        if: always()
        shell: bash
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          export CHECK_OUTCOME
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          ok = os.environ.get('CHECK_OUTCOME') == 'success'
          payload = {
            'status': 'passed' if ok else 'failed',
            'generatedAt': datetime.now(timezone.utc).isoformat(),
            'source': os.popen('git rev-parse HEAD').read().strip(),
            'article': 'https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html',
            'ogImage': 'https://nasekadan.cz/social/kam-v-kadani-a-okoli-3-9-srpna-2026-bff154b86a.png',
            'checks': {
              'article': ok,
              'homepage': ok,
              'archive': ok,
              'rss': ok,
              'sitemap': ok,
              'newsSitemap': ok,
              'og1200x630': ok,
              'seoMetadata': ok,
              'canonical': ok,
              'newsArticleJsonLd': ok,
              'autokempUpdate': ok,
              'deploymentHealth': ok
            }
          }
          Path('.github/weekly-events-live-final-status.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'Naše Kadaň finální kontrola'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/weekly-events-live-final-status.json
          git commit -m "Zapsat finální ověření kulturního týdne: ${CHECK_OUTCOME} [skip ci]" || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
          done
          if [[ "$CHECK_OUTCOME" == success ]]; then
            gh api repos/${GITHUB_REPOSITORY}/issues/535/comments -f body='✅ **FINÁLNÍ LIVE OVĚŘENÍ ÚSPĚŠNÉ** — článek, titulka, archiv, RSS, sitemap.xml, news-sitemap.xml, canonical, SEO metadata, NewsArticle JSON-LD, aktualizace Autokempu a skutečný PNG OG obrázek 1200 × 630 jsou potvrzené přímo na OVH.' >/dev/null
            gh api -X PATCH repos/${GITHUB_REPOSITORY}/issues/535 -f state=closed -f state_reason=completed >/dev/null
          else
            gh api repos/${GITHUB_REPOSITORY}/issues/535/comments -f body='❌ Finální serverová kontrola neprošla; podrobnost je v logu workflow.' >/dev/null
            exit 1
          fi
