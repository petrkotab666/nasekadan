name: Publikovat článek o Nechranicích

on:
  push:
    branches: [main]
    paths:
      - '.github/nechranice-publication-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Připravit článek a grafiku
        run: |
          python -m pip install --quiet Pillow
          python scripts/publish_nechranice_article.py
          python scripts/generate_social_cards.py --write --check
          git config user.name "Naše Kadaň automat"
          git config user.email "actions@users.noreply.github.com"
          git add clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml social/
          git commit -m "Publikovat článek o výcviku záchrany na Nechranicích"
          git push origin main
      - name: Nasadit přímo na OVH
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 index.html /var/www/nasekadan/index.html
          sudo install -m 0644 clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html /var/www/nasekadan/clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html
          sudo cp -a social/. /var/www/nasekadan/social/
          sudo install -m 0644 rss.xml sitemap.xml news-sitemap.xml /var/www/nasekadan/
          REMOTE
      - name: Ověřit zveřejnění
        run: |
          for n in $(seq 1 12); do
            if curl -fsS --max-time 20 "https://nasekadan.cz/clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html?check=$n" | grep -Fq 'Kadaňští hasiči cvičili na Nechranicích'; then
              curl -fsS --max-time 20 "https://nasekadan.cz/?check=$n" | grep -Fq 'hasici-kadan-vycvik-zachrana-voda-nechranice.html'
              exit 0
            fi
            sleep 5
          done
          exit 1
