name: Opravit formulaci programu Císařského dne

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cisarsky-den-program-wording-20260804.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-cisarsky-den-program-wording-20260804
  cancel-in-progress: false

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTICLE_FILE: clanky/cisarsky-den-kadan-historie-2026.html
      ARTICLE_URL: https://nasekadan.cz/clanky/cisarsky-den-kadan-historie-2026.html
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upravit článek, návrh a publikační pojistku
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          old = 'Podrobný časový rozpis bude vhodné do článku doplnit po jeho úplném zveřejnění.'
          new = 'Podrobný časový rozpis budeme do článku průběžně doplňovat po jeho zveřejnění.'
          targets = [
              Path('clanky/cisarsky-den-kadan-historie-2026.html'),
              Path('.github/drafts/cisarsky-den-kadan-historie-2026.html'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit(f'V {path} nebyla nalezena očekávaná formulace.')
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8', newline='\n')

          script = Path('scripts/publish_cisarsky_den_kadan_20260804.py')
          text = script.read_text(encoding='utf-8')
          anchor = '    text = DRAFT.read_text(encoding="utf-8")\n'
          guard = (
              '    text = text.replace(\n'
              '        "Podrobný časový rozpis bude vhodné do článku doplnit po jeho úplném zveřejnění.",\n'
              '        "Podrobný časový rozpis budeme do článku průběžně doplňovat po jeho zveřejnění.",\n'
              '    )\n'
          )
          if guard not in text:
              if anchor not in text:
                  raise SystemExit('V publikačním skriptu chybí bod pro vložení pojistky.')
              text = text.replace(anchor, anchor + guard, 1)
              script.write_text(text, encoding='utf-8', newline='\n')
          PY

          grep -Fq 'Podrobný časový rozpis budeme do článku průběžně doplňovat po jeho zveřejnění.' "$ARTICLE_FILE"
          ! grep -Fq 'bude vhodné do článku doplnit' "$ARTICLE_FILE"
          python3 -m py_compile scripts/publish_cisarsky_den_kadan_20260804.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ARTICLE_FILE" .github/drafts/cisarsky-den-kadan-historie-2026.html scripts/publish_cisarsky_den_kadan_20260804.py
          if ! git diff --cached --quiet; then
            git commit -m 'Opravit formulaci o průběžném doplňování programu [skip ci]'
            git push origin HEAD:main
          fi

      - name: Nasadit opravený článek na OVH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$ARTICLE_FILE" ubuntu@57.129.43.215:/tmp/cisarsky-den-kadan-historie-2026.html
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/cisarsky-den-kadan-historie-2026.html
          dst=/var/www/nasekadan/clanky/cisarsky-den-kadan-historie-2026.html
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 "$src" "$dst"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky
            sudo docker cp "$src" nasekadan-web:/usr/share/nginx/html/clanky/cisarsky-den-kadan-historie-2026.html
          fi
          rm -f "$src"
          REMOTE

      - name: Ověřit veřejnou formulaci
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          q="${GITHUB_RUN_ID}-$(date +%s)"
          html="$(curl -4 -kfsS -L --max-time 35 "$ARTICLE_URL?v=$q")"
          grep -Fq 'Podrobný časový rozpis budeme do článku průběžně doplňovat po jeho zveřejnění.' <<<"$html"
          ! grep -Fq 'bude vhodné do článku doplnit' <<<"$html"

      - name: Zapsat úspěšnou kontrolu
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const path = '.github/cisarsky-den-program-wording-status.json';
            const payload = {
              status: 'success',
              checked_at: new Date().toISOString(),
              article: process.env.ARTICLE_URL,
              wording: 'Podrobný časový rozpis budeme do článku průběžně doplňovat po jeho zveřejnění.',
              old_wording_absent: true,
              run_id: String(context.runId)
            };
            let sha;
            try {
              sha = (await github.rest.repos.getContent({owner, repo, path, ref: 'main'})).data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: 'Zapsat kontrolu formulace programu Císařského dne [skip ci]',
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64')
            });
