name: Jednorázově ověřit živý web Kadaně

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/verify-automation-kadan-20260802-0139.txt'
      - '.github/workflows/verify-automation-kadan-20260802-0139.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Živě ověřit HTTPS, články a source
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from __future__ import annotations
          import json, re, struct, subprocess, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base='https://nasekadan.cz'
          main_sha=subprocess.check_output(['git','ls-remote','origin','refs/heads/main'],text=True).split()[0]

          def article_info(path: Path):
              text=path.read_text(encoding='utf-8',errors='replace')
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',text,re.I): return None
              m=re.search(r'<meta[^>]+property=["\']article:published_time["\'][^>]+content=["\']([^"\']+)',text,re.I)
              if not m: m=re.search(r'"datePublished"\s*:\s*"([^"]+)"',text)
              if not m: return None
              try: dt=datetime.fromisoformat(m.group(1).replace('Z','+00:00'))
              except ValueError: return None
              h=re.search(r'<h1\b[^>]*>(.*?)</h1>',text,re.I|re.S)
              if not h: return None
              title=re.sub(r'<[^>]+>',' ',h.group(1)); title=re.sub(r'\s+',' ',title).strip()
              return {'path':'/clanky/'+path.name,'title':title,'published':dt.isoformat()}

          articles=[]
          for p in Path('clanky').glob('*.html'):
              if p.name=='index.html': continue
              x=article_info(p)
              if x: articles.append(x)
          articles.sort(key=lambda x:x['published'],reverse=True)
          latest=articles[:3]

          def get(path: str, binary=False):
              stamp=f'{int(time.time())}-{time.time_ns()}'
              sep='&' if '?' in path else '?'
              url=base+path+sep+'monitor='+stamp
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'NaseKadan-live-monitor/2026'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      data=r.read()
                      return {'ok':r.status==200,'status':r.status,'data':data if binary else data.decode('utf-8','replace')}
              except Exception as e:
                  return {'ok':False,'status':0,'data':b'' if binary else '', 'error':f'{type(e).__name__}: {e}'}

          paths={'home':'/','archive':'/clanky/','rss':'/rss.xml','sitemap':'/sitemap.xml','news':'/news-sitemap.xml','health':'/deployment-health.txt'}
          fetched={k:get(v) for k,v in paths.items()}
          checks=[]
          for a in latest:
              live=get(a['path'])
              url=base+a['path']
              checks.append({
                  **a,
                  'http':live.get('status'),
                  'h1':live.get('ok') and f"<h1>{a['title']}</h1>" in live.get('data',''),
                  'home':url in fetched['home'].get('data','') or a['path'] in fetched['home'].get('data',''),
                  'archive':url in fetched['archive'].get('data','') or a['path'] in fetched['archive'].get('data',''),
                  'rss':url in fetched['rss'].get('data',''),
                  'sitemap':url in fetched['sitemap'].get('data',''),
              })

          health=fetched['health'].get('data','')
          m=re.search(r'(?m)^source=([0-9a-f]{40})$',health)
          source=m.group(1) if m else None
          result={
              'observed_at':datetime.now(timezone.utc).isoformat(),
              'main':main_sha,
              'source':source,
              'source_matches':source==main_sha,
              'endpoints':{k:{'http':v.get('status'),'ok':v.get('ok'),'error':v.get('error')} for k,v in fetched.items()},
              'latest_articles':checks,
              'all_publication_checks':all(c['http']==200 and c['h1'] and c['home'] and c['archive'] and c['rss'] and c['sitemap'] for c in checks),
              'health_text':health[:500],
          }
          print('LIVE_MONITOR_RESULT='+json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
