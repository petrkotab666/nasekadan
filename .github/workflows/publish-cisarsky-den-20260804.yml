name: Připravit Císařský den 2026 k publikaci

on:
  pull_request:
    paths:
      - '.github/drafts/cisarsky-den-kadan-historie-2026.html'
      - 'scripts/publish_cisarsky_den_20260804.py'
      - 'tests/test_cisarsky_den_publication.py'
      - '.github/workflows/publish-cisarsky-den-20260804.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Napište přesně PUBLIKOVAT CISARSKY DEN 2026'
        required: true
        type: string
      create_release_commit:
        description: 'Vygenerovat publikační soubory do pracovní větve'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Ověřit syntaxi a statické pojistky
        run: |
          python -m py_compile scripts/publish_cisarsky_den_20260804.py
          python tests/test_cisarsky_den_publication.py
      - name: Zkušebně vygenerovat všechny publikační plochy
        run: python scripts/publish_cisarsky_den_20260804.py --dry-run
      - name: Zkontrolovat HTML a rozsah změn
        run: |
          git diff --check
          test -f clanky/cisarsky-den-kadan-historie-2026.html
          test -f social/cisarsky-den-kadan-2026-20260804.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('social/cisarsky-den-kadan-2026-20260804.png')
          assert Image.open(p).size == (1200,630)
          print('Sociální karta má 1200 × 630.')
          PY

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_release_commit == true
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Ověřit ruční potvrzení
        run: test '${{ inputs.confirmation }}' = 'PUBLIKOVAT CISARSKY DEN 2026'
      - name: Ověřit datumovou závoru
        run: |
          test "$(date -u +%s)" -ge "$(date -u -d '2026-08-04 16:00:00' +%s)"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Vygenerovat publikaci
        run: python scripts/publish_cisarsky_den_20260804.py
      - name: Poslední lokální kontrola
        run: |
          git diff --check
          python tests/test_cisarsky_den_publication.py
      - name: Uložit připravenou publikaci do pracovní větve
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clanky/cisarsky-den-kadan-historie-2026.html social/cisarsky-den-kadan-2026-20260804.png index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml
          git commit -m 'Připravit Císařský den 2026 k publikaci 4. srpna v 18:00'
          git push origin HEAD:${{ github.ref_name }}
