name: Hluboká rešerše lávky u Shellu v2

on:
  push:
    branches: [main]
    paths:
      - '.github/deep-research-lavka-shell-v2-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deep-research-lavka-shell-v2
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nainstalovat nástroje
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ces python3-bs4 python3-lxml file unzip

      - name: Projít otevřená data, stáhnout přílohy a OCR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/research/lavka-shell-v2
          mkdir -p .github/research/lavka-shell-v2/{raw,text,html}
          cat > /tmp/lavka_v2.py <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re, subprocess, time, unicodedata
          from pathlib import Path
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET
          import requests
          from bs4 import BeautifulSoup

          R=Path('.github/research/lavka-shell-v2'); RAW=R/'raw'; TEXT=R/'text'; HTML=R/'html'
          s=requests.Session(); s.headers['User-Agent']='NaseKadan deep research (+https://nasekadan.cz)'
          def get(u):
              e=None
              for i in range(5):
                  try:
                      r=s.get(u,timeout=90); r.raise_for_status(); return r
                  except Exception as x: e=x; time.sleep(2+2*i)
              raise e
          def norm(x):
              return re.sub(r'\s+',' ',unicodedata.normalize('NFKD',x or '').encode('ascii','ignore').decode().lower()).strip()
          def slug(x): return re.sub(r'[^a-z0-9]+','-',norm(x)).strip('-')[:110] or 'soubor'
          def localname(tag): return tag.rsplit('}',1)[-1]

          months=['2023_12','2024_04','2024_11','2025_08','2025_10','2026_03','2026_06','2026_07']
          matched=[]
          needles=['lavka pres silnici','svaty kopecek','svaty kopecek','lavky u shell','nasvetleni lavky','hornich svitidel']
          party_ids=['00261912','62242105','04794621','28738217']
          for m in months:
              url=f'https://data.smlouvy.gov.cz/dump_{m}.xml'
              dst=Path('/tmp')/f'dump_{m}.xml'
              try: dst.write_bytes(get(url).content)
              except Exception as e:
                  matched.append({'dump':url,'error':repr(e)}); continue
              for ev,el in ET.iterparse(dst,events=('end',)):
                  if localname(el.tag)!='zaznam': continue
                  raw=ET.tostring(el,encoding='unicode')
                  n=norm(' '.join(el.itertext()))
                  relevant=any(k in n for k in needles)
                  # Party IDs alone are too broad; require Kadaň plus a bridge/supervision/lighting context.
                  if not relevant and '00261912' in n and any(k in n for k in ['technickeho dozoru','koordinatora bozp','silnice group','messor']) and any(k in n for k in ['lavka','kopecek','568']): relevant=True
                  if relevant:
                      row={'dump':url,'xml':raw,'text':re.sub(r'\s+',' ',' '.join(el.itertext())).strip(),'attachments':[]}
                      for node in el.iter():
                          ln=localname(node.tag).lower(); val=(node.text or '').strip()
                          if val.startswith('http') and any(k in ln for k in ['odkaz','link','url']):
                              row['attachments'].append(val)
                      matched.append(row)
                  el.clear()
              dst.unlink(missing_ok=True)
          (R/'open-data-matches.json').write_text(json.dumps(matched,ensure_ascii=False,indent=2),encoding='utf-8')

          urls=[]
          for row in matched:
              for u in row.get('attachments',[]):
                  if u not in urls: urls.append(u)
          # Known detail pages; extract attachment links as a safety net.
          detail_ids=['34471149','34491001','38341648']
          # Search result pages provide IDs for June/July records.
          searches=[
            'https://smlouvy.gov.cz/vyhledavani?party_idnum=62242105&publication_date%5Bfrom%5D=2026-06-01&publication_date%5Bto%5D=2026-06-30&searchResultList-limit=100',
            'https://smlouvy.gov.cz/vyhledavani?party_idnum=04794621&publication_date%5Bfrom%5D=2026-07-01&publication_date%5Bto%5D=2026-07-31&searchResultList-limit=100',
          ]
          for i,u in enumerate(searches):
              r=get(u); (HTML/f'search-{i}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'lxml')
              for a in soup.select('a[href*="/smlouva/"]'):
                  href=a.get('href','')
                  m=re.search(r'/smlouva/(\d+)',href)
                  if not m: continue
                  row=a.find_parent('tr'); tx=norm(' '.join(row.stripped_strings) if row else a.get_text(' ',strip=True))
                  if any(k in tx for k in ['lavka','kopecek','568']): detail_ids.append(m.group(1))
          detail_ids=list(dict.fromkeys(detail_ids))
          records=[]
          for vid in detail_ids:
              u=f'https://smlouvy.gov.cz/smlouva/{vid}'
              try:r=get(u)
              except Exception as e: records.append({'id':vid,'error':repr(e)}); continue
              (HTML/f'detail-{vid}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'lxml'); rec={'id':vid,'url':u,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'attachments':[]}
              for a in soup.select('a[href*="/smlouva/soubor/"]'):
                  href=a.get('href'); full=requests.compat.urljoin(u,href)
                  if full not in urls: urls.append(full)
                  rec['attachments'].append({'name':a.get_text(' ',strip=True),'url':full})
              records.append(rec)
          (R/'detail-records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')

          downloads=[]
          for i,u in enumerate(urls,1):
              name=Path(urlparse(u).path).name or f'file-{i}'
              out=RAW/f'{i:03d}-{slug(name)}'
              try:
                  data=get(u).content; out.write_bytes(data)
                  downloads.append({'url':u,'path':str(out),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              except Exception as e: downloads.append({'url':u,'error':repr(e)})
          (R/'downloads.json').write_text(json.dumps(downloads,ensure_ascii=False,indent=2),encoding='utf-8')

          def run(cmd): return subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,check=False)
          extracts=[]
          for p in RAW.iterdir():
              mime=run(['file','-b','--mime-type',str(p)]).stdout.strip()
              txt=''; method='unsupported'
              out=TEXT/(p.name+'.txt')
              if mime=='application/pdf':
                  tmp=Path('/tmp')/(p.name+'.txt'); run(['pdftotext','-layout',str(p),str(tmp)])
                  txt=tmp.read_text(encoding='utf-8',errors='ignore') if tmp.exists() else ''; method='pdftotext'
                  if len(re.sub(r'\s+','',txt))<500:
                      method='ocr'; d=Path('/tmp')/('ocr-'+p.name); d.mkdir(exist_ok=True)
                      info=run(['pdfinfo',str(p)]).stdout; m=re.search(r'^Pages:\s+(\d+)',info,re.M); pages=min(int(m.group(1)) if m else 20,80)
                      run(['pdftoppm','-f','1','-l',str(pages),'-r','240','-jpeg',str(p),str(d/'p')])
                      chunks=[]
                      for im in sorted(d.glob('p-*.jpg')): chunks.append(run(['tesseract',str(im),'stdout','-l','ces+eng','--psm','6']).stdout)
                      txt='\n\n'.join(chunks)
              elif mime.startswith('text/') or mime in ['application/xml','application/json']:
                  txt=p.read_text(encoding='utf-8',errors='ignore'); method='text'
              if txt:
                  out.write_text(txt,encoding='utf-8')
              extracts.append({'file':str(p),'mime':mime,'method':method,'text':str(out) if txt else None,'chars':len(txt)})
          (R/'extracts.json').write_text(json.dumps(extracts,ensure_ascii=False,indent=2),encoding='utf-8')

          keys=['termin','dokonceni','predani','prevzeti','smluvni pokuta','prodleni','preruseni','harmonogram','mikropilot','koren','osvetleni','vyporadani','31. 5. 2026','31.05.2026','15. 7. 2026','15.07.2026','31. 8. 2026','31.08.2026','viceprace','meneprace','vada','nedodelek','zadrzne','staveniste','lhuta','dodatek c. 1','dodatek c. 2','shell','myci','ucinnost smlouvy','registr smluv','zahajeni praci','doba plneni']
          findings=[]
          for e in extracts:
              if not e.get('text'): continue
              raw=Path(e['text']).read_text(encoding='utf-8',errors='ignore'); n=norm(raw)
              hits=[]
              for k in keys:
                  st=0; count=0
                  while True:
                      pos=n.find(k,st)
                      if pos<0 or count>=12: break
                      # normalize changes length slightly; use normalized context itself for reliable content.
                      sn=n[max(0,pos-700):min(len(n),pos+1600)]
                      hits.append({'key':k,'snippet':sn}); st=pos+len(k); count+=1
              if hits: findings.append({'file':e['file'],'method':e['method'],'hits':hits})
          (R/'findings.json').write_text(json.dumps(findings,ensure_ascii=False,indent=2),encoding='utf-8')

          md=['# Hluboká rešerše lávky u Shellu v2','',f'Zpracováno {time.strftime("%Y-%m-%d %H:%M:%S UTC",time.gmtime())}','',f'- Otevřená data: {len([x for x in matched if x.get("xml")])} relevantních záznamů',f'- Detailní stránky: {len(records)}',f'- Stažené přílohy: {len([x for x in downloads if x.get("path")])}',f'- Extrahované dokumenty: {len([x for x in extracts if x.get("chars",0)>0])}','','## Relevantní záznamy otevřených dat']
          for x in matched:
              if x.get('text'): md.append('- '+x['text'][:1200])
          md += ['','## Dokumenty']
          for e in extracts: md.append(f"- `{e['file']}` – {e['mime']}, {e['method']}, {e['chars']} znaků")
          md += ['','## Výskyty zásadních ustanovení']
          for f in findings:
              md.append(f"### {f['file']} ({f['method']})")
              for h in f['hits']: md.append(f"- **{h['key']}** — {h['snippet'][:1800]}")
          (R/'README.md').write_text('\n'.join(md),encoding='utf-8')
          PY
          python3 /tmp/lavka_v2.py

      - name: Uložit výsledky
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/research/lavka-shell-v2/raw
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/research/lavka-shell-v2
          git commit -m 'Dokončit hlubokou OCR rešerši lávky u Shellu v2' || true
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep 3
          done
          exit 1
