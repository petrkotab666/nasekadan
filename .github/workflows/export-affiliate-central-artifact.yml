name: Export centrálních affiliate dat pro audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-affiliate-central-artifact.yml]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stáhnout centrální zdroje
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/affiliate-central
          curl -fsSL -H 'Cache-Control: no-cache' 'https://pojistime.to/assets/affiliate-database.json' -o /tmp/affiliate-central/affiliate-database.json
          curl -fsSL -H 'Cache-Control: no-cache' 'https://pojistime.to/assets/ehub-partner-assets/brainmarket.json' -o /tmp/affiliate-central/brainmarket.json
          python3 -m json.tool /tmp/affiliate-central/affiliate-database.json >/dev/null
          python3 -m json.tool /tmp/affiliate-central/brainmarket.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-central-source
          path: /tmp/affiliate-central
          retention-days: 1
      - name: Zapsat ID běhu
        shell: bash
        run: |
          printf '{"runId":%s,"sha":"%s"}\n' '${{ github.run_id }}' '${{ github.sha }}' > affiliate-central-export-run.json
          rm -f .github/workflows/export-affiliate-central-artifact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Uložit ID exportu centrálních affiliate dat [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
