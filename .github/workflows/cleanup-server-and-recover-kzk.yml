name: Uvolnit server a obnovit KZK

on:
  issues:
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cleanup-server-and-recover-kzk
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 507
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit soubory publikace
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            clanky/index.html
            clanky/kulturni-zarizeni-kadan.html
            social/kulturni-zarizeni-kadan-20260802.png
            rss.xml
            sitemap.xml
            news-sitemap.xml
            site.js
            style.css
            footer.css
            mobile.css
            reklamy.js
            reklamy-sidebar.js
            reklamy-sidebar.css
            reklamy-oprava-obrazku.js
            obsah-doplnky.js
            ad-spacing-guard.js
            analytics.js
          )
          for file in "${files[@]}"; do test -s "$file"; done
          grep -Fq 'Od Střelnice po klášter' clanky/kulturni-zarizeni-kadan.html

      - name: Vybrat dostupný SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_key"
              chmod 600 "$RUNNER_TEMP/nasekadan_key"
              echo "secret=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 20

      - name: Bezpečně uvolnit místo na serveru
        id: cleanup
        shell: bash
        run: |
          set +e
          ssh -i "$RUNNER_TEMP/nasekadan_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' 2>&1 <<'REMOTE' | tee "$RUNNER_TEMP/kzk-cleanup.log"
          set -euxo pipefail
          echo '=== DISK BEFORE ==='
          df -h /
          sudo du -xhd1 /var /opt 2>/dev/null | sort -h | tail -n 20 || true

          sudo rm -f /tmp/*.tar.gz /tmp/kzk-* /tmp/*publication* 2>/dev/null || true
          sudo find /var/tmp -maxdepth 1 -type f -mtime +1 -delete 2>/dev/null || true
          sudo apt-get clean || true
          sudo journalctl --vacuum-size=150M || true
          sudo docker builder prune -af || true
          sudo docker container prune -f || true
          sudo docker image prune -af || true
          sudo find /opt/nasekadan/.git/objects -type f -name 'tmp_*' -delete 2>/dev/null || true
          sudo find /opt/nasekadan/.git -type f -name '*.lock' -delete 2>/dev/null || true

          echo '=== DISK AFTER ==='
          df -h /
          avail="$(df -Pk / | awk 'NR==2{print $4}')"
          test "$avail" -ge 131072
          REMOTE
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Nasadit soubory proudem bez dočasného archivu
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            clanky/index.html
            clanky/kulturni-zarizeni-kadan.html
            social/kulturni-zarizeni-kadan-20260802.png
            rss.xml
            sitemap.xml
            news-sitemap.xml
            site.js
            style.css
            footer.css
            mobile.css
            reklamy.js
            reklamy-sidebar.js
            reklamy-sidebar.css
            reklamy-oprava-obrazku.js
            obsah-doplnky.js
            ad-spacing-guard.js
            analytics.js
          )

          tar -czf - "${files[@]}" | ssh -i "$RUNNER_TEMP/nasekadan_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'sudo mkdir -p /var/www/nasekadan && sudo tar -xzf - -C /var/www/nasekadan && sudo chmod -R a+rX /var/www/nasekadan'

          tar -czf - "${files[@]}" | ssh -i "$RUNNER_TEMP/nasekadan_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          if [[ -z "$cid" ]]; then cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"; fi
          if [[ -n "$cid" ]]; then
            sudo docker exec -i "$cid" tar -xzf - -C /usr/share/nginx/html
          else
            cat >/dev/null
          fi
          sudo nginx -t
          sudo systemctl reload nginx
          grep -Fq 'Od Střelnice po klášter' /var/www/nasekadan/clanky/kulturni-zarizeni-kadan.html
          REMOTE

      - name: Veřejně ověřit obsah a pořadí
        id: live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time, urllib.request
          base='https://nasekadan.cz'; rel='/clanky/kulturni-zarizeni-kadan.html'; absu=base+rel
          title='Od Střelnice po klášter. Co všechno pro Kadaň zajišťuje KZK'
          last=''
          def get(path,n):
              u=base+path+('?' if '?' not in path else '&')+f'kzkclean={int(time.time()*1000)}-{n}'
              req=urllib.request.Request(u,headers={'User-Agent':'NaseKadan-KZK-Cleanup/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r: return r.read().decode('utf-8','replace')
          for n in range(1,25):
              try:
                  article=get(rel,n); home=get('/',n); archive=get('/clanky/',n)
                  rss=get('/rss.xml',n); sm=get('/sitemap.xml',n); news=get('/news-sitemap.xml',n)
                  assert title in article and 'id="konirna"' in article and 'data-promos data-context="sidebar"' in article
                  assert title in home and f'data-latest-article-href="{rel}"' in home
                  assert rel in archive
                  old='/clanky/petice-nemocnice-kadan-podpisova-mista-2026.html'
                  assert old not in archive or archive.find(rel) < archive.find(old)
                  i=rss.find('<item>'); j=rss.find('</item>',i)
                  assert i>=0 and j>i and absu in rss[i:j]
                  assert absu in sm and absu in news
                  print('Veřejná publikace KZK je úplná.')
                  break
              except Exception as exc:
                  last=repr(exc); time.sleep(min(5+n*2,20))
          else: raise SystemExit('Veřejná kontrola selhala: '+last)
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Nainstalovat Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Ověřit vykreslené reklamy
        id: ads
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1800}});
            await page.goto('https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html?ads='+Date.now(),{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(6000);
            const body=await page.locator('body').innerText();
            if(!body.includes('Od Střelnice po klášter')) throw new Error('Článek se nevykreslil.');
            const stream=await page.locator('.article-aside-adstream').count();
            const cards=await page.locator('[class*="article-aside-ad-"], .promo-card, .article-ad-auto').count();
            if(stream<1 || cards<1) throw new Error(`Reklamy se nevykreslily: stream=${stream}, cards=${cards}`);
            console.log(`adstream=${stream}, cards=${cards}`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat výsledek do issue 507
        if: always()
        uses: actions/github-script@v7
        env:
          KEY_SECRET: ${{ steps.key.outputs.secret }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          CLEANUP_CODE: ${{ steps.cleanup.outputs.exit_code }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          LIVE_OK: ${{ steps.live.outputs.ok }}
          ADS_OK: ${{ steps.ads.outputs.ok }}
        with:
          script: |
            const issue_number=507;
            const ok=process.env.LIVE_OK==='true' && process.env.ADS_OK==='true';
            let tail=''; try {tail=require('fs').readFileSync(process.env.RUNNER_TEMP+'/kzk-cleanup.log','utf8').slice(-2500)} catch {}
            const body=ok
              ? '✅ Serverový disk byl bezpečně uvolněn a publikace KZK obnovena. Článek je veřejný, první na titulní straně i v archivu, první v RSS, v obou sitemapách a reklamy se skutečně vykreslují.\n\nhttps://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html'
              : `🚨 Obnova KZK po čištění serveru selhala. Klíč: ${process.env.KEY_SECRET||'nenalezen'}, čištění: ${process.env.CLEANUP_OUTCOME||'skipped'} (${process.env.CLEANUP_CODE||'bez kódu'}), deploy: ${process.env.DEPLOY_OUTCOME||'skipped'}, obsah: ${process.env.LIVE_OK||'false'}, reklamy: ${process.env.ADS_OK||'false'}.\n\nDiagnostika:\n\`\`\`\n${tail}\n\`\`\``;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number,body});
            if(ok) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number,state:'closed',state_reason:'completed'});
