# diagnostiku zdrojů; automatické kontroly, deduplikaci a doručení zajišťuje
# jediný centrální monitoring „Kompletní monitoring Kadaně“.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Informace
        run: echo 'Automatický běh je vypnutý, aby nevznikala duplicitní redakční upozornění.'
