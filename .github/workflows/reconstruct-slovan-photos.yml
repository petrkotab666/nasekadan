name: Sestavit fotografie Slovanu a lávky

on:
  push:
    branches: [main]
    paths:
      - '.image-parts/slovan-trigger.txt'

permissions:
  contents: write

concurrency:
  group: reconstruct-slovan-photos
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sestavit čtyři redakční fotografie
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          for base in slovan-lavka-hero-20260724 slovan-detail-20260724 lavka-shell-20260724 slovan-vstup-20260724; do
            cat .image-parts/${base}.part-* | tr -d '\n\r ' | base64 -d > assets/${base}.jpg
          done
          echo '6fd5d7171cba8577f6401e7b40cea4d9657a78b4ad4862faafc2b94bfa97edfd  assets/slovan-lavka-hero-20260724.jpg' | sha256sum -c -
          echo '1a10fd44da4f611f0d04baff2e18a6003ec180c06b13e90ac83b942871dee963  assets/slovan-detail-20260724.jpg' | sha256sum -c -
          echo 'a29657c7c695aa7c43272576c0abaaf99de72be81527ef9e82fa447322e93adb  assets/lavka-shell-20260724.jpg' | sha256sum -c -
          echo '3e7ca08bdf7bc7912a9539ba10c14845b12bbf359fa9447c62bb7e6bc6e90746  assets/slovan-vstup-20260724.jpg' | sha256sum -c -
          file assets/*.jpg

      - name: Uložit fotografie a odstranit přenosové části
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .image-parts
          git config user.name 'Naše Kadaň automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets .image-parts
          git commit -m 'Přidat vlastní fotografie Slovanu a lávky u Shellu'
          git push origin main
