name: Diagnostika úzkého nasazení počasí

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/inspect-hot-weather-trigger.txt'

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Načíst běhy úzkého nasazení
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'hot-deploy-weather-via-ssh.yml',
              branch: 'main',
              per_page: 10
            });
            const blocks = [];
            for (const run of response.data.workflow_runs || []) {
              const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: run.id, per_page: 100
              });
              const jobs = jobsResponse.data.jobs || [];
              const lines = [
                `- run \`${run.id}\`: **${run.status}/${run.conclusion || 'bez závěru'}**`,
                `  - commit: \`${run.head_sha}\``,
                `  - vytvořeno: ${run.created_at}, aktualizováno: ${run.updated_at}`,
                `  - ${run.html_url}`
              ];
              if (!jobs.length) lines.push('  - workflow zatím nevytvořil job');
              for (const job of jobs) {
                lines.push(`  - job \`${job.id}\` **${job.name}**: ${job.status}/${job.conclusion || 'bez závěru'}, runner=${job.runner_name || 'nepřidělen'}`);
                for (const step of job.steps || []) {
                  lines.push(`    - ${step.number}. ${step.name}: ${step.status}/${step.conclusion || 'bez závěru'}`);
                }
              }
              blocks.push(lines.join('\n'));
            }
            const body = ['## Úzké nasazení počasí', '', ...(blocks.length ? blocks : ['- Nebyl nalezen žádný běh.'])].join('\n');
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number, body
            });
