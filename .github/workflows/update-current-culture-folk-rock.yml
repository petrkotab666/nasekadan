name: Doplnit Folk Rock Festival do aktuálního kulturního přehledu

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_folk_rock_to_current_culture.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Doplnit festival do již zveřejněného článku
        run: python3 scripts/add_folk_rock_to_current_culture.py
      - name: Uložit změnu
        run: |
          set -euo pipefail
          git config user.name "Naše Kadaň automat"
          git config user.email "actions@users.noreply.github.com"
          git add clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          if git diff --cached --quiet; then
            echo 'Článek už festival obsahuje.'
            exit 0
          fi
          git commit -m "Doplnit Folk Rock Festival do aktuálního kulturního přehledu"
          git push origin main
