name: Opravit a ověřit článek o sečení nyní

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-greenery-publication-now.yml'
      - '.github/repair-greenery-now-trigger.txt'
      - 'scripts/repair_greenery_publication_now.sh'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: repair-greenery-publication-now
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publikovat, nasadit a veřejně ověřit vše včetně Facebooku
        id: repair
        env:
          KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
          KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
        shell: bash
        run: bash scripts/repair_greenery_publication_now.sh

      - name: Zapsat výsledek a spravovat výstrahu
        if: always()
        uses: actions/github-script@v7
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
        with:
          script: |
            const ok=process.env.REPAIR_OUTCOME==='success';
            const path='.github/greenery-repair-status.json';
            const payload={status:ok?'passed':'failed',checkedAtUtc:new Date().toISOString(),runId:context.runId,sourceSha:context.sha,article:'https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html',pollApi:ok?'verified':'unverified',browserVisibleCounts:ok,facebook:ok?'verified':'unverified'};
            const content=Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64');
            let sha;
            try{const cur=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(cur.data))sha=cur.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat opravu článku o sečení: ${payload.status} [skip ci]`,content,...(sha?{sha}:{})});
            const title='Publikace článku o sečení trávníků vyžaduje zásah';
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=issues.find(x=>!x.pull_request&&x.title===title);
            if(ok&&existing)await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed',state_reason:'completed'});
            if(!ok&&!existing)await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body:`Opravný běh nepotvrdil úplnou publikaci článku, ankety nebo Facebooku.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
