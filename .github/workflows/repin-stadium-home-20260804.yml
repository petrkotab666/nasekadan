name: Obnovit připnutí článku o zimáku

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: repin-stadium-home-20260804
  cancel-in-progress: false

jobs:
  repin:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'petrkotab666' && github.event.issue.title == '[ops] obnovit připnutí zimáku')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTICLE_REL: /clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html
      EXPECTED_H1: Kadaň otevřela zimní stadion lidem před vedrem. Přijít lze denně od 8 do 18 hodin
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Obnovit připnutí v repozitáři
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – titulka'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m py_compile scripts/pin_stadium_homepage_20260804.py
            python3 scripts/pin_stadium_homepage_20260804.py
            grep -Fq "data-latest-article-href=\"$ARTICLE_REL\"" index.html
            grep -Fq "<h1>$EXPECTED_H1</h1>" index.html
            grep -Fq 'Nejnovější původní publikace' index.html
            grep -Fq '/pocasi.js' index.html
            grep -Fq 'article:published_time" content="2026-08-03T22:05:00+02:00' clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html
            git add index.html
            if ! git diff --cached --quiet; then
              git commit -m 'Titulka: obnovit dočasné připnutí článku o zimáku'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1

      - name: Nasadit pouze titulní stránku na OVH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 index.html ubuntu@57.129.43.215:/tmp/nasekadan-index-pinned.html
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0644 /tmp/nasekadan-index-pinned.html /var/www/nasekadan/index.html
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nasekadan-index-pinned.html nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker exec nasekadan-web grep -Fq 'data-latest-article-href="/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html"' /usr/share/nginx/html/index.html
          fi
          grep -Fq 'data-latest-article-href="/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html"' /var/www/nasekadan/index.html
          rm -f /tmp/nasekadan-index-pinned.html
          REMOTE

      - name: Veřejně ověřit titulku a počasí
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            q="${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/?v=$q" -o /tmp/home.html || true
            if grep -Fq "data-latest-article-href=\"$ARTICLE_REL\"" /tmp/home.html \
              && grep -Fq "<h1>$EXPECTED_H1</h1>" /tmp/home.html \
              && grep -Fq 'Nejnovější původní publikace' /tmp/home.html \
              && grep -Fq '/pocasi.js' /tmp/home.html; then
              ok=1
              break
            fi
            echo "Titulka zatím není aktuální, pokus $attempt/6"
            sleep $((attempt * 4))
          done
          test "$ok" = 1

          weather_ok=0
          for attempt in 1 2 3; do
            q="${GITHUB_RUN_ID}-weather-$(date +%s)-$attempt"
            : >/tmp/weather.json
            code="$(curl -4 -kfsS -L --max-time 35 -w '%{http_code}' -o /tmp/weather.json "https://nasekadan.cz/api/pocasi-predpoved.json?v=$q" || true)"
            echo "Počasí HTTP: $code, bajtů: $(wc -c </tmp/weather.json)"
            if [ "$code" = 200 ] && python3 -m json.tool </tmp/weather.json >/dev/null 2>&1; then
              weather_ok=1
              break
            fi
            sleep 5
          done
          test "$weather_ok" = 1

      - name: Uzavřít požadavek
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Připnutí titulního článku bylo obnoveno v repozitáři i na živém webu a veřejně ověřeno včetně počasí. Run ${context.runId}.`});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});

      - name: Zapsat selhání
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Obnovení připnutí nebo veřejná kontrola selhaly. Run ${context.runId}.`});
