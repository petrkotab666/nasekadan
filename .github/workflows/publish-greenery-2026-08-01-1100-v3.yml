name: Zveřejnit sečení s funkční anketou v 11:00

on:
  workflow_dispatch:
    inputs:
      force:
        description: Zveřejnit nebo opravit ihned
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/greenery-poll-v3-trigger.txt'
      - '.github/workflows/publish-greenery-2026-08-01-1100-v3.yml'
      - 'scripts/install_poll_system_v2.py'
      - 'scripts/prepare_greenery_publication_20260801.py'
  schedule:
    - cron: '0 9 1 8 *'
    - cron: '7 9 1 8 *'
    - cron: '17 9 1 8 *'
    - cron: '30 9 1 8 *'
    - cron: '45 9 1 8 *'
    - cron: '0 10 1 8 *'
    - cron: '30 10 1 8 *'

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-greenery-poll-v3
  cancel-in-progress: false

env:
  SLUG: sekani-travniku-kadan-spravci-vysky-2026
  ARTICLE: clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  PUBLIC_URL: https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  POLL_ID: sekani-travniku-kadan-2026
  POLL_VERSION: 20260801-poll-system-v2
  TARGET_UTC: '2026-08-01T09:00:00Z'
  EXPECTED_TEXT: 'Sedm centimetrů je smluvní minimum jedné konkrétní lokality'
  KEY1: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
  KEY2: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit a otestovat společný hlasovací systém
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install_poll_system_v2.py
          python3 scripts/prepare_poll_cloud_deploy.py
          python3 -m py_compile newsletter/server.py scripts/install_poll_system_v2.py scripts/test_poll_system_v2.py scripts/prepare_greenery_publication_20260801.py
          python3 scripts/test_poll_system_v2.py
          grep -Fq '# BEGIN POLL_RESULTS_API' newsletter/server.py
          grep -Fq 'Průběžné výsledky' site.js
          grep -Fq 'poll-result-value' site.js
          grep -Fq 'POLL_SYSTEM_V2' scripts/prepare_greenery_publication_20260801.py
          grep -Fq 'POLL_V2_SUPERSEDED' .github/workflows/publish-greenery-2026-08-01-1100-v2.yml

      - name: Uložit předletovou opravu ankety a vypnutí starého harmonogramu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – příprava ankety'
          git config user.email 'info@nasekadan.cz'
          git add newsletter/server.py site.js \
            clanky/jaderne-tusimice-smr-voda-doprava-eia-2026.html \
            .github/drafts/jaderne-tusimice-smr-voda-doprava-eia-2026.html \
            .github/workflows/publish-greenery-2026-08-01-1100-v2.yml \
            scripts/install_poll_system_v2.py scripts/test_poll_system_v2.py \
            scripts/prepare_poll_cloud_deploy.py scripts/prepare_greenery_publication_20260801.py
          if ! git diff --cached --quiet; then
            git commit -m 'Připravit funkční ankety pro článek o sečení [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 5 ]] && exit 1
              sleep $((attempt * 5))
            done
          fi
          git fetch origin main
          git reset --hard origin/main

      - name: Ověřit neveřejný zdroj a rozhodnout, zda už publikovat
        id: timing
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/drafts/${SLUG}.html.gz.b64
          test -s .github/drafts/${SLUG}.html.gz.b64.part2
          cat .github/drafts/${SLUG}.html.gz.b64 .github/drafts/${SLUG}.html.gz.b64.part2 | base64 -d | gzip -dc > "$RUNNER_TEMP/greenery-source.html"
          grep -Fq '<meta name="robots" content="noindex,nofollow">' "$RUNNER_TEMP/greenery-source.html"
          grep -Fq 'data-poll-id="sekani-travniku-kadan-2026"' "$RUNNER_TEMP/greenery-source.html"
          grep -Fq "$EXPECTED_TEXT" "$RUNNER_TEMP/greenery-source.html"
          force='${{ inputs.force || false }}'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$force" != true && "$now" < "$TARGET_UTC" ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Předletová kontrola prošla; článek zůstává neveřejný do 11:00.'
            exit 0
          fi
          if [[ "${{ github.event_name }}" == schedule && "$(date -u +%F)" != 2026-08-01 ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"

      - name: Sestavit článek, sociální obrázek a všechny přehledy
        if: steps.timing.outputs.active == 'true'
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/install_poll_system_v2.py
          python3 scripts/prepare_greenery_publication_20260801.py
          python3 scripts/test_poll_system_v2.py
          test -s .github/greenery-publication-bundle.json
          grep -Fq "data-poll-id=\"${POLL_ID}\"" "$ARTICLE"
          grep -Fq "/site.js?v=${POLL_VERSION}" "$ARTICLE"
          ! grep -Fq '/api/analytics/pageview' "$ARTICLE"
          grep -Fq "$PUBLIC_URL" rss.xml
          grep -Fq "$PUBLIC_URL" sitemap.xml
          grep -Fq "$PUBLIC_URL" news-sitemap.xml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data=json.loads(Path('.github/greenery-publication-bundle.json').read_text(encoding='utf-8'))
          print('social_file='+data['socialFile'])
          print('social_url='+data['socialUrl'])
          PY

      - name: Uložit veřejnou verzi do main
        if: steps.timing.outputs.active == 'true'
        shell: bash
        env:
          SOCIAL_FILE: ${{ steps.prepare.outputs.social_file }}
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň publikační automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- \
            newsletter/server.py site.js "$ARTICLE" "$SOCIAL_FILE" \
            index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt \
            .github/facebook-publish-trigger.txt .github/greenery-publication-bundle.json \
            scripts/install_poll_system_v2.py scripts/prepare_greenery_publication_20260801.py
          if ! git diff --cached --quiet; then
            git commit -m 'Publikovat: sečení trávníků s funkční anketou'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 5 ]] && exit 1
              sleep $((attempt * 7))
            done
          fi
          git fetch origin main
          git reset --hard origin/main
          grep -Fq "$EXPECTED_TEXT" "$ARTICLE"
          grep -Fq "/site.js?v=${POLL_VERSION}" "$ARTICLE"

      - name: Připravit SSH klíč
        if: steps.timing.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEY1:-}" ]]; then printf '%s\n' "$KEY1" | tr -d '\r' > "$RUNNER_TEMP/ovh_key";
          elif [[ -n "${KEY2:-}" ]]; then printf '%s\n' "$KEY2" | tr -d '\r' > "$RUNNER_TEMP/ovh_key";
          else echo 'Chybí SSH klíč pro OVH.' >&2; exit 1; fi
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit web i hlasovací server na OVH
        if: steps.timing.outputs.active == 'true'
        id: deploy
        env:
          SOCIAL_FILE: ${{ steps.prepare.outputs.social_file }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nk-greenery-poll-v3"
          rm -rf "$bundle";mkdir -p "$bundle/clanky" "$bundle/social" "$bundle/newsletter"
          cp "$ARTICLE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$SOCIAL_FILE" "$bundle/social/"
          cp newsletter/server.py "$bundle/newsletter/server.py"
          cp site.js index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$bundle/"
          for attempt in 1 2 3; do
            if scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/nk-greenery-poll-v3; then break; fi
            [[ "$attempt" == 3 ]] && exit 1;sleep $((attempt*8))
          done
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social /opt/nasekadan/newsletter
          sudo install -m 0644 /tmp/nk-greenery-poll-v3/newsletter/server.py /opt/nasekadan/newsletter/server.py
          sudo install -m 0644 /tmp/nk-greenery-poll-v3/site.js /var/www/nasekadan/site.js
          sudo install -m 0644 /tmp/nk-greenery-poll-v3/clanky/sekani-travniku-kadan-spravci-vysky-2026.html /var/www/nasekadan/clanky/
          sudo install -m 0644 /tmp/nk-greenery-poll-v3/clanky/index.html /var/www/nasekadan/clanky/index.html
          find /tmp/nk-greenery-poll-v3/social -type f -maxdepth 1 -exec sudo install -m 0644 {} /var/www/nasekadan/social/ \;
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do sudo install -m 0644 "/tmp/nk-greenery-poll-v3/$f" "/var/www/nasekadan/$f";done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/nk-greenery-poll-v3/site.js nasekadan-web:/usr/share/nginx/html/site.js
            sudo docker cp /tmp/nk-greenery-poll-v3/clanky/sekani-travniku-kadan-spravci-vysky-2026.html nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp /tmp/nk-greenery-poll-v3/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
            for f in /tmp/nk-greenery-poll-v3/social/*; do sudo docker cp "$f" nasekadan-web:/usr/share/nginx/html/social/;done
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do sudo docker cp "/tmp/nk-greenery-poll-v3/$f" "nasekadan-web:/usr/share/nginx/html/$f";done
          fi
          sudo systemctl restart nasekadan-newsletter.service
          for attempt in $(seq 1 25);do curl -fsS --max-time 4 http://127.0.0.1:8765/health >/dev/null && break;[[ "$attempt" == 25 ]]&&exit 1;sleep 2;done
          sudo systemctl is-active --quiet nasekadan-newsletter.service
          grep -Fq '# BEGIN POLL_RESULTS_API' /opt/nasekadan/newsletter/server.py
          rm -rf /tmp/nk-greenery-poll-v3
          REMOTE

      - name: Ověřit web, databázové hlasování a skutečně viditelné výsledky
        if: steps.timing.outputs.active == 'true'
        id: verify
        env:
          SOCIAL_URL: ${{ steps.prepare.outputs.social_url }}
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$browser" ]] || exit 1
          stamp="${GITHUB_RUN_ID}-$(date +%s)";test_poll="healthcheck-greenery-${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 30);do
            article="$(curl -4 -kfsS --max-time 25 "${PUBLIC_URL}?v=${stamp}-${attempt}" 2>/dev/null||true)"
            js="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/site.js?v=${stamp}-${attempt}" 2>/dev/null||true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null||true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null||true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null||true)"
            actual="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/api/newsletter/poll/results?poll=${POLL_ID}&t=${stamp}-${attempt}" 2>/dev/null||true)"
            jar="$RUNNER_TEMP/greenery-poll-cookie.txt";rm -f "$jar"
            first="$(curl -4 -kfsS --max-time 25 -c "$jar" -A 'GreeneryPoll-A' -X POST https://nasekadan.cz/api/newsletter/poll/vote -H 'Content-Type: application/json' --data "{\"pollId\":\"${test_poll}\",\"choice\":\"vyssi\"}" 2>/dev/null||true)"
            second="$(curl -4 -kfsS --max-time 25 -b "$jar" -A 'GreeneryPoll-B' -X POST https://nasekadan.cz/api/newsletter/poll/vote -H 'Content-Type: application/json' --data "{\"pollId\":\"${test_poll}\",\"choice\":\"soucasny\"}" 2>/dev/null||true)"
            retained="$(curl -4 -kfsS --max-time 25 -b "$jar" "https://nasekadan.cz/api/newsletter/poll/results?poll=${test_poll}" 2>/dev/null||true)"
            image="$RUNNER_TEMP/greenery-poll.png";curl -4 -kfsS --max-time 25 "${SOCIAL_URL}?v=${stamp}-${attempt}" -o "$image" 2>/dev/null||true
            if ARTICLE_HTML="$article" JS="$js" HOME_HTML="$home" ARCHIVE_HTML="$archive" RSS_XML="$rss" ACTUAL="$actual" FIRST="$first" SECOND="$second" RETAINED="$retained" python3 - <<'PY'
          import json,os,sys
          try:a=json.loads(os.environ['ACTUAL']);f=json.loads(os.environ['FIRST']);s=json.loads(os.environ['SECOND']);r=json.loads(os.environ['RETAINED'])
          except Exception:raise SystemExit(1)
          checks=[
            'Sedm centimetrů je smluvní minimum jedné konkrétní lokality' in os.environ['ARTICLE_HTML'],
            'data-poll-id="sekani-travniku-kadan-2026"' in os.environ['ARTICLE_HTML'],
            '/site.js?v=20260801-poll-system-v2' in os.environ['ARTICLE_HTML'],
            '/api/analytics/pageview' not in os.environ['ARTICLE_HTML'],
            'Průběžné výsledky' in os.environ['JS'] and 'poll-result-value' in os.environ['JS'],
            '/clanky/sekani-travniku-kadan-spravci-vysky-2026.html' in os.environ['HOME_HTML'],
            '/clanky/sekani-travniku-kadan-spravci-vysky-2026.html' in os.environ['ARCHIVE_HTML'],
            'https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html' in os.environ['RSS_XML'],
            a.get('ok') is True and isinstance(a.get('counts'),dict) and isinstance(a.get('percentages'),dict),
            f.get('accepted') is True and f.get('total')==1 and f.get('selected')=='vyssi',
            s.get('accepted') is False and s.get('total')==1 and s.get('selected')=='vyssi',
            r.get('total')==1 and r.get('counts',{}).get('vyssi')==1 and r.get('percentages',{}).get('vyssi')==100.0,
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then
              python3 - "$image" <<'PY'
          import sys
          from PIL import Image
          with Image.open(sys.argv[1]) as im:assert im.format=='PNG' and im.size==(1200,630)
          PY
              "$browser" --headless=new --no-sandbox --disable-gpu --ignore-certificate-errors --virtual-time-budget=15000 --dump-dom "${PUBLIC_URL}?dom=${stamp}-${attempt}" > "$RUNNER_TEMP/greenery-dom.html" 2>/dev/null||true
              if grep -Fq 'Průběžné výsledky' "$RUNNER_TEMP/greenery-dom.html"&&grep -Eq '[0-9]+ hlas(ů|y)? celkem' "$RUNNER_TEMP/greenery-dom.html"&&grep -Fq 'poll-result-value' "$RUNNER_TEMP/greenery-dom.html";then
                echo 'web_ok=true' >> "$GITHUB_OUTPUT";echo 'HOTOVO: článek i viditelné sčítání ankety jsou veřejně ověřené.';exit 0
              fi
            fi
            sleep 6
          done
          echo 'web_ok=false' >> "$GITHUB_OUTPUT";exit 1

      - name: Zapsat stav a spravovat výstražný issue
        if: always() && steps.timing.outputs.active == 'true'
        uses: actions/github-script@v7
        env:
          WEB_OK: ${{ steps.verify.outputs.web_ok }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const ok=process.env.WEB_OK==='true';const path='.github/greenery-publication-status.json';
            const payload={status:ok?'passed':'failed',checkedAtUtc:new Date().toISOString(),runId:context.runId,sourceSha:context.sha,serverDeploy:process.env.DEPLOY_OUTCOME||'skipped',publicVerification:ok?'success':'failure',pollApi:ok?'success':'failure',browserVisibleCounts:ok,publicUrl:'https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html'};
            const content=Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64');let sha;
            try{const cur=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(cur.data))sha=cur.data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat publikaci článku o sečení: ${payload.status} [skip ci]`,content,...(sha?{sha}:{})});
            const title='Publikace článku o sečení trávníků vyžaduje zásah';const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});const existing=issues.find(x=>x.title===title);
            if(ok&&existing)await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,state:'closed'});
            if(!ok&&!existing)await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body:`Článek nebo jeho viditelné sčítání hlasů nebyly potvrzeny.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
