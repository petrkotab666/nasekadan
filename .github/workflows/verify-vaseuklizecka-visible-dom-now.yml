name: Ověřit viditelnou reklamu Vaše uklízečka
run-name: Kontrola vykresleného DOM a případná obnova produkce

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-vaseuklizecka-visible-dom-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-vaseuklizecka-dom-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Najít prohlížeč
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"

      - name: Ověřit vykreslený banner a při selhání jednou znovu nasadit
        id: check
        env:
          BROWSER: ${{ steps.browser.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          verify_dom() {
            local suffix="$1"
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=10000 --dump-dom \
              "https://nasekadan.cz/clanky/nemocnice-kadan-software-kyberbezpecnost.html?domcheck=${GITHUB_SHA}-${suffix}" \
              > /tmp/page.html 2>/tmp/chrome.log || true
            grep -Fq 'featured-cleaning-ad' /tmp/page.html \
              && grep -Fq 'vaseuklizecka-cisteni-wide-1200x400.webp' /tmp/page.html \
              && grep -Fq 'https://www.vaseuklizecka.cz/sluzby/cisteni-kobercu-a-calouneni/' /tmp/page.html \
              && grep -Fq '603 206 308' /tmp/page.html
          }

          if verify_dom before; then
            echo 'result=success' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

          for attempt in $(seq 1 10); do
            if verify_dom "after-$attempt"; then
              echo 'result=repaired' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

          cp /tmp/page.html /tmp/failed-page.html || true
          echo 'result=failed' >> "$GITHUB_OUTPUT"
          exit 42

      - name: Zapsat veřejně ověřený stav
        if: always()
        env:
          RESULT: ${{ steps.check.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          result=os.environ.get('RESULT') or 'failed'
          payload={
            'status':'success' if result in {'success','repaired'} else 'failed',
            'mode':result,
            'checked_at_utc':datetime.now(timezone.utc).isoformat(),
            'page':'https://nasekadan.cz/clanky/nemocnice-kadan-software-kyberbezpecnost.html',
            'rendered_dom_marker':'featured-cleaning-ad',
            'wide_banner':'/assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp',
            'target_url':'https://www.vaseuklizecka.cz/sluzby/cisteni-kobercu-a-calouneni/',
            'phone':'603 206 308',
            'source_commit':os.environ.get('GITHUB_SHA',''),
          }
          Path('vaseuklizecka-visible-dom-status.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f .github/workflows/verify-vaseuklizecka-visible-dom-now.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vaseuklizecka-visible-dom-status.json .github/workflows/verify-vaseuklizecka-visible-dom-now.yml
          git commit -m 'Zapsat ověření viditelné reklamy Vaše uklízečka'
          git pull --rebase origin main
          git push origin HEAD:main
