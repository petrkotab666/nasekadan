name: Dočasně připnout zimák podle redakčního pokynu

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-editorial-stadium-pin-20260805
  cancel-in-progress: false

jobs:
  pin:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'petrkotab666' && github.event.issue.title == '[editorial] Připnout zimák do 5. srpna 18:00')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      PIN_REL: /clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Připnout pouze titulku a zachovat chronologické kanály
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            archive_sha="$(git hash-object clanky/index.html)"
            rss_sha="$(git hash-object rss.xml)"
            sed -i "s|^HOMEPAGE_PIN_HREF =.*|HOMEPAGE_PIN_HREF = '$PIN_REL'|" scripts/enforce_article_visibility.py
            sed -i "s|^HOMEPAGE_PIN_UNTIL =.*|HOMEPAGE_PIN_UNTIL = datetime.fromisoformat('2026-08-05T18:00:00+02:00')|" scripts/enforce_article_visibility.py
            sed -i '/HOMEPAGE-PIN-EXPIRED-BY-NEW-PUBLICATION-20260804/d' scripts/enforce_article_visibility.py
            grep -Fq "HOMEPAGE_PIN_HREF = '$PIN_REL'" scripts/enforce_article_visibility.py
            grep -Fq "HOMEPAGE_PIN_UNTIL = datetime.fromisoformat('2026-08-05T18:00:00+02:00')" scripts/enforce_article_visibility.py
            python3 scripts/enforce_article_visibility.py
            git restore --source=HEAD --worktree -- clanky sitemap.xml
            git clean -f -- clanky/strana-*.html >/dev/null 2>&1 || true
            test "$(git hash-object clanky/index.html)" = "$archive_sha"
            test "$(git hash-object rss.xml)" = "$rss_sha"
            grep -Fq "data-latest-article-href=\"$PIN_REL\"" index.html
            grep -Fq '/pocasi.js' index.html
            git add index.html scripts/enforce_article_visibility.py
            changed="$(git diff --cached --name-only)"
            test -n "$changed"
            test "$(printf '%s\n' "$changed" | grep -Ev '^(index\.html|scripts/enforce_article_visibility\.py)$' | wc -l)" -eq 0
            git commit -m 'Dočasně připnout zimák do 5. srpna 18:00'
            if git push origin HEAD:main; then
              success=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$success" = 1
          git fetch origin main
          git reset --hard origin/main
          grep -Fq "data-latest-article-href=\"$PIN_REL\"" index.html
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Nasadit pouze titulní stránku
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 index.html ubuntu@57.129.43.215:/tmp/nasekadan-editorial-pin.html
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/nasekadan-editorial-pin.html
          sudo install -m 0644 "$src" /var/www/nasekadan/index.html
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp "$src" nasekadan-web:/usr/share/nginx/html/index.html
          fi
          rm -f "$src"
          REMOTE

      - name: Veřejně ověřit hlavní článek, boční blok a počasí
        shell: bash
        run: |
          set -euo pipefail
          expected_latest="$(python3 - <<'PY'
          from pathlib import Path
          from scripts.enforce_article_visibility import article_info
          pin = '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          items = []
          for path in Path('clanky').glob('*.html'):
              if path.name == 'index.html' or path.name.startswith('strana-'):
                  continue
              item = article_info(path)
              if item and item['href'] != pin:
                  items.append(item)
          items.sort(key=lambda item: item['dt'], reverse=True)
          if not items:
              raise SystemExit(1)
          print(items[0]['href'])
          PY
          )"
          test -n "$expected_latest"
          for attempt in $(seq 1 12); do
            q="${GITHUB_RUN_ID}-$(date +%s)-${attempt}"
            home="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/?editorial_pin=$q" || true)"
            aside="$(sed -n '/<aside class="current-aside">/,/<\/aside>/p' <<<"$home")"
            weather_ok=0
            if curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/api/pocasi-predpoved.json?editorial_pin=$q" | python3 -m json.tool >/dev/null; then
              weather_ok=1
            fi
            if grep -Fq "data-latest-article-href=\"$PIN_REL\"" <<<"$home" \
              && grep -Fq 'Kadaň otevřela zimní stadion lidem před vedrem' <<<"$home" \
              && grep -Fq "$expected_latest" <<<"$aside" \
              && ! grep -Fq "$PIN_REL" <<<"$aside" \
              && grep -Fq '/pocasi.js' <<<"$home" \
              && [ "$weather_ok" = 1 ]; then
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Uzavřít požadavek
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Redakční připnutí bylo obnoveno a veřejně ověřeno. Run ${context.runId}, commit ${{ steps.apply.outputs.source_sha }}.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Zapsat selhání
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Redakční připnutí se nepodařilo obnovit. Run ${context.runId}.`
            });
