name: Okamžitě nasadit propojení série Nemocnice Kadaň

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-hospital-series-live.yml'
      - '.github/hotfix-hospital-series-live.txt'
      - 'scripts/link_hospital_series.py'
      - 'clanky/nemocnice-kadan.html'
      - 'clanky/petice-nemocnice-kadan.html'
      - 'clanky/nemocnice-kadan-software-kyberbezpecnost.html'
      - 'clanky/avies-nemocnice-kadan.html'
      - 'style.css'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotfix-hospital-series-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Vybrat dostupný SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" > "$RUNNER_TEMP/nasekadan_key"
              chmod 600 "$RUNNER_TEMP/nasekadan_key"
              echo "secret=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'Chybí použitelný SSH klíč.' >&2
          exit 20

      - name: Přepsat aktuální HTML a CSS přímo v produkci
        id: deploy_server
        shell: bash
        run: |
          set +e
          ssh -i "$RUNNER_TEMP/nasekadan_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' 2>&1 <<'REMOTE' | tee "$RUNNER_TEMP/hospital-series-hotfix.log"
          set -euxo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          python3 scripts/link_hospital_series.py

          files=(
            style.css
            clanky/nemocnice-kadan.html
            clanky/petice-nemocnice-kadan.html
            clanky/nemocnice-kadan-software-kyberbezpecnost.html
            clanky/avies-nemocnice-kadan.html
          )

          sudo mkdir -p /var/www/nasekadan/clanky
          for file in "${files[@]}"; do
            sudo install -m 0644 "$file" "/var/www/nasekadan/$file"
          done

          cid="$(docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          if [[ -z "$cid" ]]; then
            cid="$(docker ps --filter publish=3224 -q | head -n1)"
          fi
          if [[ -n "$cid" ]]; then
            docker cp style.css "$cid:/usr/share/nginx/html/style.css"
            for file in clanky/nemocnice-kadan.html clanky/petice-nemocnice-kadan.html clanky/nemocnice-kadan-software-kyberbezpecnost.html clanky/avies-nemocnice-kadan.html; do
              docker cp "$file" "$cid:/usr/share/nginx/html/$file"
            done
          fi

          grep -Fq 'ARC-MED za 16 milionů: dva posudky a nejasné schválení' /var/www/nasekadan/clanky/avies-nemocnice-kadan.html
          grep -Fq 'data-arc-med-teaser' /var/www/nasekadan/clanky/avies-nemocnice-kadan.html
          grep -Fq 'Téměř 170 milionů za léčiva od AVIES' /var/www/nasekadan/clanky/nemocnice-kadan.html
          REMOTE
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Ověřit veřejný web
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            avies="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/avies-nemocnice-kadan.html?series=${GITHUB_SHA}-${attempt}" || true)"
            first="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/nemocnice-kadan.html?series=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq 'Vyjde v úterý 28. 7. v 5:00' <<<"$avies" \
              && grep -Fq 'data-arc-med-teaser' <<<"$avies" \
              && grep -Fq 'Téměř 170 milionů za léčiva od AVIES' <<<"$first" \
              && grep -Fq 'ARC-MED za 16 milionů' <<<"$first"; then
              echo 'Pětidílná série i zítřejší upoutávka jsou veřejně nasazené.'
              exit 0
            fi
            sleep 10
          done
          echo 'Veřejný web stále nevrací opravenou sérii.' >&2
          exit 30

      - name: Zapsat stav hotfixu
        if: always()
        uses: actions/github-script@v7
        env:
          KEY_OUTCOME: ${{ steps.key.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_server.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          KEY_SECRET: ${{ steps.key.outputs.secret }}
          DEPLOY_EXIT_CODE: ${{ steps.deploy_server.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const path = '.github/hotfix-hospital-series-status.json';
            const ok = process.env.KEY_OUTCOME === 'success' && process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success';
            let logTail = '';
            try {
              const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/hospital-series-hotfix.log', 'utf8');
              logTail = raw.slice(-6000);
            } catch {}
            const status = {
              status: ok ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ssh_key_secret_name: process.env.KEY_SECRET || null,
              server_deploy: process.env.DEPLOY_OUTCOME || 'skipped',
              server_exit_code: process.env.DEPLOY_EXIT_CODE || null,
              public_verification: process.env.VERIFY_OUTCOME || 'skipped',
              diagnostic_tail: logTail
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat diagnostiku hotfixu nemocniční série: ${status.status}`,
              content,
              ...(sha ? {sha} : {})
            });
