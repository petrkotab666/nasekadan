name: Vynutit nasazení článku o přeplněných koších
run-name: Produkční nasazení článku o přeplněných koších

on:
  push:
    branches: [main]
    paths:
      - '.github/force-deploy-bins-trigger.txt'
      - '.github/workflows/force-deploy-bins-article.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: force-deploy-bins-article
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Stáhnout nejnovější hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit aktuální main na produkční web
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash deploy/sync-production.sh

      - name: Ověřit zveřejněný článek
        shell: bash
        run: |
          set -euo pipefail
          curl -kfsS --max-time 30 'https://nasekadan.cz/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html' | grep -Fq 'Přetékající koše v Kadani budí kritiku'
          curl -kfsS --max-time 30 'https://nasekadan.cz/' | grep -Fq '/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html'
          curl -kfsS --max-time 30 'https://nasekadan.cz/clanky/' | grep -Fq '/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html'

      - name: Zapsat potvrzení úspěšného nasazení
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-confirmations
          SOURCE_SHA="$(curl -kfsS --max-time 30 'https://nasekadan.cz/deployment-health.txt' | sed -n 's/^source=//p' | head -n1)"
          GENERATED="$(curl -kfsS --max-time 30 'https://nasekadan.cz/deployment-health.txt' | sed -n 's/^generated=//p' | head -n1)"
          printf 'article=/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html\nsource=%s\ngenerated=%s\nverified=%s\n' \
            "$SOURCE_SHA" "$GENERATED" "$(date -u +%FT%TZ)" > deployment-confirmations/bins-article.txt
          git config user.name 'Naše Kadaň – produkční ověření'
          git config user.email 'info@nasekadan.cz'
          git add deployment-confirmations/bins-article.txt
          git commit -m 'Potvrdit produkční nasazení článku o koších' || exit 0
          git pull --rebase origin main
          git push origin main
