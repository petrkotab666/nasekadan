name: Obnovit heslo statistik z bezpečného serverového záznamu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-stats-password-from-server-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-stats-password-restore-now
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Obnovit hash hesla bez zveřejnění hesla
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          exec > >(tee "$RUNNER_TEMP/result.txt") 2>&1

          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"
              selected="$name"
              break
            fi
          done
          test -n "$selected" || { echo 'Není dostupný žádný SSH klíč.'; exit 20; }
          chmod 600 "$RUNNER_TEMP/key"
          echo "Použit dostupný SSH secret: $selected"

          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'sudo python3 -' <<'PY'
          from __future__ import annotations
          import os
          import re
          import sys
          from pathlib import Path

          app_dir = Path('/usr/local/lib/nasekadan-stats')
          login_file = Path('/opt/nasekadan-stats/login.txt')
          reset_file = Path('/opt/nasekadan-stats/reset-token.json')
          password_file = Path('/opt/nasekadan-stats/password.json')

          text = login_file.read_text(encoding='utf-8', errors='strict')
          match = re.search(r'(?mi)^\s*Heslo\s*:\s*(.+?)\s*$', text)
          if not match:
              raise SystemExit('V bezpečném serverovém záznamu nebylo nalezeno heslo.')
          password = match.group(1).strip()
          if len(password) < 10:
              raise SystemExit('Uložené heslo je neočekávaně krátké; obnova byla zastavena.')

          sys.path.insert(0, str(app_dir))
          import stats_server as base

          backup = password_file.with_suffix('.json.before-direct-restore')
          if password_file.exists():
              backup.write_bytes(password_file.read_bytes())
              os.chown(backup, 33, 33)
              os.chmod(backup, 0o600)

          base.save_password(password)
          os.chown(password_file, 33, 33)
          os.chmod(password_file, 0o600)
          try:
              reset_file.unlink()
          except FileNotFoundError:
              pass

          if not base.verify_password(password):
              raise SystemExit('Nově uložený hash neprošel interním ověřením.')
          print('Hash hesla byl bezpečně obnoven a interně ověřen; samotné heslo nebylo vypsáno.')
          PY

          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo systemctl restart nasekadan-stats-web.service
          sudo systemctl is-active --quiet nasekadan-stats-web.service
          for _ in $(seq 1 30); do
            health="$(curl -fsS --max-time 3 http://127.0.0.1:3225/healthz 2>/dev/null || true)"
            if printf '%s' "$health" | grep -Fq '"ok": true'; then
              echo 'Služba statistik po obnově hesla běží.'
              exit 0
            fi
            sleep 0.5
          done
          echo 'Služba po obnově hesla neprošla healthcheckem.' >&2
          exit 31
          REMOTE

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.restore.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const fs=require('fs'); let log='';
            try {log=fs.readFileSync(`${process.env.RUNNER_TEMP}/result.txt`,'utf8')} catch {}
            const ok=process.env.OUTCOME==='success';
            const issue=await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,
              title:`[STATISTIKY PŘÍMÁ OBNOVA HESLA] ${ok?'Opraveno':'Selhalo'} ${new Date().toISOString()}`,
              body:[`- Commit: \`${process.env.SOURCE_SHA}\``,`- Výsledek: **${process.env.OUTCOME}**`,'','```text',log.slice(-16000).replace(/```/g,'---'),'```'].join('\n')});
            if(ok) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.data.number,state:'closed',state_reason:'completed'});

      - name: Vyhodnotit
        if: steps.restore.outcome != 'success'
        run: exit 1
