name: Diagnostikovat Caddy ochranu statistik přes GitHub cloud

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ubuntu-recover-lastminuteslevy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose-caddy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Vybrat dostupný SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caddy-diagnostic"
          : > "$RUNNER_TEMP/caddy-diagnostic/result.txt"
          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s\n' "$value" > "$RUNNER_TEMP/caddy-diagnostic/id_key"
              selected="$name"
              break
            fi
          done
          test -n "$selected"
          chmod 600 "$RUNNER_TEMP/caddy-diagnostic/id_key"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Vypsat aktivní Caddy konfiguraci statistik
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/caddy-diagnostic/id_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE' | tee "$RUNNER_TEMP/caddy-diagnostic/result.txt"
          set -euo pipefail
          echo '=== CADDY SLUŽBA ==='
          systemctl is-active caddy || true
          sudo systemctl cat caddy | sed -n '1,180p' || true
          echo '=== CADDY SOUBORY ==='
          sudo find /etc/caddy /usr/local/etc/caddy /opt -maxdepth 5 -type f 2>/dev/null \
            | sort | head -n 300 || true
          echo '=== VÝSKYT STATISTIK / RESTRICTED / BASIC_AUTH ==='
          sudo grep -RniE 'statistiky|restricted|basic_auth|basicauth|forward_auth|3225' \
            /etc/caddy /usr/local/etc/caddy /opt 2>/dev/null \
            | head -n 400 || true
          echo '=== HLAVNÍ CADDYFILE ==='
          sudo sed -n '1,320p' /etc/caddy/Caddyfile 2>/dev/null || true
          echo '=== VEŘEJNÁ ODPOVĚĎ ==='
          curl -kisS --max-time 15 https://nasekadan.cz/statistiky/ | head -n 50 || true
          REMOTE

      - name: Zapsat diagnostiku do PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          KEY_NAME: ${{ steps.key.outputs.selected }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/caddy-diagnostic/result.txt`, 'utf8'); } catch {}
            const body = [
              '## Diagnostika Caddy ochrany statistik',
              '',
              `- SSH secret: \`${process.env.KEY_NAME || 'žádný'}\``,
              `- Výsledek: **${process.env.INSPECT_OUTCOME || 'neprovedeno'}**`,
              '',
              '```text',
              log.slice(-50000).replace(/```/g, '---'),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
