name: Diagnostikovat veřejnou ochranu statistik přes GitHub cloud

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ubuntu-recover-lastminuteslevy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Vybrat dostupný SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ovh-diagnostic"
          : > "$RUNNER_TEMP/ovh-diagnostic/result.txt"
          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s\n' "$value" > "$RUNNER_TEMP/ovh-diagnostic/id_key"
              selected="$name"
              break
            fi
          done
          test -n "$selected"
          chmod 600 "$RUNNER_TEMP/ovh-diagnostic/id_key"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Vypsat aktivní konfiguraci statistik
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh-diagnostic/id_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE' | tee "$RUNNER_TEMP/ovh-diagnostic/result.txt"
          set -euo pipefail
          echo '=== HOST A SLUŽBA ==='
          hostname
          systemctl is-active nasekadan-stats-web.service || true
          curl -fsS http://127.0.0.1:3225/healthz || true
          echo
          echo '=== SOUBORY OBSAHUJÍCÍ STATISTIKY / AUTH_BASIC / 3225 ==='
          sudo grep -RniE 'statistiky|auth_basic|3225|nasekadan-stats' \
            /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d /etc/nginx/snippets 2>/dev/null \
            | head -n 240 || true
          echo '=== AKTIVNÍ NGINX KONFIGURACE ==='
          sudo nginx -T 2>&1 \
            | grep -n -C 8 -E 'location.*statistiky|auth_basic|3225|nasekadan-statistiky' \
            | head -n 300 || true
          echo '=== ODPOVĚĎ PŘES LOKÁLNÍ NGINX ==='
          curl -kisS --max-time 15 --resolve nasekadan.cz:443:127.0.0.1 \
            https://nasekadan.cz/statistiky/ \
            | head -n 80 || true
          echo '=== ODPOVĚĎ Z VEŘEJNÉ DOMÉNY ==='
          curl -kisS --max-time 15 https://nasekadan.cz/statistiky/ \
            | head -n 80 || true
          REMOTE

      - name: Zapsat diagnostiku do PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          KEY_NAME: ${{ steps.key.outputs.selected }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/ovh-diagnostic/result.txt`, 'utf8'); } catch {}
            const body = [
              '## Diagnostika veřejné ochrany statistik',
              '',
              `- SSH secret: \`${process.env.KEY_NAME || 'žádný'}\``,
              `- Výsledek: **${process.env.INSPECT_OUTCOME || 'neprovedeno'}**`,
              '',
              '```text',
              log.slice(-50000).replace(/```/g, '---'),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
