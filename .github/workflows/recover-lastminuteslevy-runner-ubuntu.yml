name: Diagnostikovat veřejné endpointy resetu statistik

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ubuntu-recover-lastminuteslevy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Vybrat SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stats-endpoints"
          : > "$RUNNER_TEMP/stats-endpoints/result.txt"
          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s\n' "$value" > "$RUNNER_TEMP/stats-endpoints/id_key"
              selected="$name"
              break
            fi
          done
          test -n "$selected"
          chmod 600 "$RUNNER_TEMP/stats-endpoints/id_key"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Změřit jednotlivé veřejné endpointy
        id: probe
        shell: bash
        run: |
          set -u
          out="$RUNNER_TEMP/stats-endpoints/result.txt"
          probe_get() {
            name="$1"; url="$2"
            body="$RUNNER_TEMP/stats-endpoints/${name}.body"
            headers="$RUNNER_TEMP/stats-endpoints/${name}.headers"
            code="$(curl -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' \
              -H 'Cache-Control: no-cache' "$url" || echo CURL_ERROR)"
            {
              echo "=== $name ==="
              echo "URL: $url"
              echo "HTTP: $code"
              sed -n '1,20p' "$headers" 2>/dev/null || true
              echo 'BODY:'
              head -c 1800 "$body" 2>/dev/null || true
              echo
            } | tee -a "$out"
          }
          probe_get login "https://nasekadan.cz/statistiky/?endpoint-test=$GITHUB_RUN_ID"
          probe_get health "https://nasekadan.cz/statistiky/healthz?endpoint-test=$GITHUB_RUN_ID"
          probe_get forgot "https://nasekadan.cz/statistiky/zapomenute-heslo?endpoint-test=$GITHUB_RUN_ID"

          body="$RUNNER_TEMP/stats-endpoints/reset.body"
          headers="$RUNNER_TEMP/stats-endpoints/reset.headers"
          code="$(curl -sS --max-time 45 -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -D "$headers" -o "$body" -w '%{http_code}' --data '' \
            'https://nasekadan.cz/statistiky/zapomenute-heslo' || echo CURL_ERROR)"
          {
            echo '=== reset-post ==='
            echo "HTTP: $code"
            sed -n '1,30p' "$headers" 2>/dev/null || true
            echo 'BODY:'
            head -c 2500 "$body" 2>/dev/null || true
            echo
          } | tee -a "$out"
          exit 0

      - name: Načíst stav služby a poslední logy
        id: server
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/stats-endpoints/id_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE' | tee -a "$RUNNER_TEMP/stats-endpoints/result.txt"
          set -euo pipefail
          echo '=== SERVER SERVICE ==='
          systemctl is-active nasekadan-stats-web.service || true
          curl -sS -D - http://127.0.0.1:3225/healthz || true
          echo
          echo '=== SMTP KONFIGURACE BEZ HESLA ==='
          sudo awk -F= '/^(SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_TLS|NEWSLETTER_FROM)=/ {print $1"="$2} /^SMTP_PASSWORD=/ {print "SMTP_PASSWORD=<nastaveno:"(length($2)>0?"ano":"ne")">"}' /etc/nasekadan-newsletter.env 2>/dev/null || true
          echo '=== POSLEDNÍ LOGY SLUŽBY ==='
          sudo journalctl -u nasekadan-stats-web.service --since '-10 minutes' -n 160 --no-pager || true
          REMOTE

      - name: Zapsat diagnostiku do PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          KEY_NAME: ${{ steps.key.outputs.selected }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/stats-endpoints/result.txt`, 'utf8'); } catch {}
            const body = [
              '## Diagnostika endpointů obnovy hesla statistik',
              '',
              `- SSH secret: \`${process.env.KEY_NAME || 'žádný'}\``,
              '',
              '```text',
              log.slice(-55000).replace(/```/g, '---'),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
