name: Obnovit runner a přímo nasadit statistiky přes GitHub cloud

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ubuntu-recover-lastminuteslevy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  recover-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Vybrat dostupný SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ovh-recovery"
          : > "$RUNNER_TEMP/ovh-recovery/result.txt"
          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s\n' "$value" > "$RUNNER_TEMP/ovh-recovery/id_key"
              selected="$name"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo 'NO_SSH_KEY' | tee "$RUNNER_TEMP/ovh-recovery/result.txt"
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod 600 "$RUNNER_TEMP/ovh-recovery/id_key"
          echo "Použitelný SSH secret: $selected" | tee "$RUNNER_TEMP/ovh-recovery/result.txt"
          echo 'available=true' >> "$GITHUB_OUTPUT"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Restartovat runner na OVH
        id: restart
        if: steps.key.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh-recovery/id_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE' | tee -a "$RUNNER_TEMP/ovh-recovery/result.txt"
          set -euo pipefail
          echo "Host: $(hostname), čas: $(date -Is)"
          sudo -n true
          mapfile -t services < <(
            systemctl list-unit-files --type=service --no-legend 'actions.runner*' 2>/dev/null \
              | awk '{print $1}' \
              | while read -r service; do
                  if [[ "$service" == *lastminuteslevy* ]] || sudo systemctl cat "$service" 2>/dev/null | grep -qiE 'lastminuteslevy|/home/ubuntu/actions-runner(/|$)'; then
                    echo "$service"
                  fi
                done \
              | sort -u
          )
          if [ "${#services[@]}" -gt 0 ]; then
            printf 'Restartované služby:\n%s\n' "${services[*]}"
            for service in "${services[@]}"; do
              sudo systemctl reset-failed "$service" || true
              sudo systemctl restart "$service"
            done
            sleep 8
            for service in "${services[@]}"; do
              systemctl is-active "$service"
            done
          else
            echo 'Runner service nebyla nalezena; přímá instalace statistik bude pokračovat.'
          fi
          REMOTE

      - name: Přímo nainstalovat obnovu hesla statistik na OVH
        id: install
        if: steps.key.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh-recovery/id_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE' | tee -a "$RUNNER_TEMP/ovh-recovery/result.txt"
          set -euo pipefail
          sudo -n true
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git clone --depth 1 https://github.com/petrkotab666/nasekadan.git "$work/repo"
          sudo bash "$work/repo/.github/scripts/nasekadan-stats/install-stats.sh"
          echo 'Lokální health:'
          curl -fsS http://127.0.0.1:3225/healthz
          echo
          echo 'Veřejná přihlašovací stránka:'
          curl -kfsS --resolve nasekadan.cz:443:127.0.0.1 \
            'https://nasekadan.cz/statistiky/' | grep -F 'Zapomenuté heslo'
          REMOTE

      - name: Ověřit živou stránku a vyžádat testovací reset
        id: verify
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          login="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
            'https://nasekadan.cz/statistiky/?verify-cloud='"$GITHUB_RUN_ID")"
          grep -Fq 'Přihlášení ke statistikám' <<<"$login"
          grep -Fq 'Zapomenuté heslo' <<<"$login"

          health="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
            'https://nasekadan.cz/statistiky/healthz?verify-cloud='"$GITHUB_RUN_ID")"
          python3 - "$health" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get('ok') is True
          assert data.get('auth') == 'application'
          assert data.get('smtpConfigured') is True
          PY

          reset="$(curl -fsS --max-time 30 \
            -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data '' \
            'https://nasekadan.cz/statistiky/zapomenute-heslo')"
          grep -Eq 'Obnovovací odkaz (byl odeslán|už byl nedávno odeslán)' <<<"$reset"
          echo 'Veřejný login, SMTP i přijetí resetovacího e-mailu byly ověřeny.' | tee -a "$RUNNER_TEMP/ovh-recovery/result.txt"

      - name: Zapsat výsledek do PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          KEY_AVAILABLE: ${{ steps.key.outputs.available }}
          KEY_NAME: ${{ steps.key.outputs.selected }}
          RESTART_OUTCOME: ${{ steps.restart.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/ovh-recovery/result.txt`, 'utf8'); } catch {}
            const ok = process.env.INSTALL_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success';
            const body = [
              `## ${ok ? 'Obnova hesla statistik je nasazená a ověřená' : 'Nasazení obnovy hesla statistik selhalo'}`,
              '',
              `- SSH klíč dostupný: **${process.env.KEY_AVAILABLE || 'false'}**`,
              `- Použitý název secretu: \`${process.env.KEY_NAME || 'žádný'}\``,
              `- Restart runneru: **${process.env.RESTART_OUTCOME || 'neprovedeno'}**`,
              `- Přímá instalace na OVH: **${process.env.INSTALL_OUTCOME || 'neprovedeno'}**`,
              `- Veřejný login, SMTP a reset: **${process.env.VERIFY_OUTCOME || 'neprovedeno'}**`,
              '',
              '```text',
              log.slice(-30000),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

      - name: Vyhodnotit
        if: always()
        shell: bash
        env:
          AVAILABLE: ${{ steps.key.outputs.available }}
          INSTALL: ${{ steps.install.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          test "$AVAILABLE" = true
          test "$INSTALL" = success
          test "$VERIFY" = success
