name: Napojit reset statistik na funkční SMTP a ověřit jej

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ubuntu-recover-lastminuteslevy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  configure-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Vybrat SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stats-smtp"
          : > "$RUNNER_TEMP/stats-smtp/result.txt"
          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s\n' "$value" > "$RUNNER_TEMP/stats-smtp/id_key"
              selected="$name"
              break
            fi
          done
          test -n "$selected"
          chmod 600 "$RUNNER_TEMP/stats-smtp/id_key"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Vytvořit oddělenou SMTP konfiguraci statistik a nasadit ji
        id: configure
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/stats-smtp/id_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE' | tee "$RUNNER_TEMP/stats-smtp/result.txt"
          set -euo pipefail
          sudo -n true

          sudo python3 - <<'PY'
          from __future__ import annotations

          import os
          import shlex
          import tempfile
          from pathlib import Path

          source = Path('/etc/lastminuteslevy-alerts.env')
          target = Path('/etc/nasekadan-stats-email.env')

          def parse_env(path: Path) -> dict[str, str]:
              result: dict[str, str] = {}
              for raw in path.read_text(encoding='utf-8', errors='strict').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  if line.startswith('export '):
                      line = line[7:].lstrip()
                  key, value = line.split('=', 1)
                  key = key.strip()
                  value = value.strip()
                  try:
                      parts = shlex.split(value, posix=True)
                      value = parts[0] if len(parts) == 1 else value
                  except Exception:
                      value = value.strip('"').strip("'")
                  result[key] = value
              return result

          env = parse_env(source)
          host = env.get('SMTP_HOST') or env.get('MAIL_HOST')
          user = env.get('SMTP_USER') or env.get('SMTP_USERNAME') or env.get('MAIL_USER')
          password = env.get('SMTP_PASSWORD') or env.get('SMTP_PASS') or env.get('MAIL_PASSWORD')
          port = env.get('SMTP_PORT') or env.get('MAIL_PORT') or '465'
          tls = env.get('SMTP_TLS') or env.get('SMTP_SECURITY') or 'ssl'
          if not (host and user and password):
              raise SystemExit('Ve zdrojové konfiguraci chybí povinné SMTP položky nebo jejich podporované aliasy.')
          if user.strip().lower() != 'petrkotab@seznam.cz':
              raise SystemExit('Funkční SMTP účet není očekávaný vlastnický účet.')

          values = {
              'SMTP_HOST': host,
              'SMTP_PORT': port,
              'SMTP_USER': user,
              'SMTP_PASSWORD': password,
              'SMTP_TLS': tls,
              'NEWSLETTER_FROM': user,
              'SMTP_FROM': user,
              'EMAIL_FROM': user,
          }

          fd, tmp_name = tempfile.mkstemp(prefix='.nasekadan-stats-email.', dir='/etc', text=True)
          try:
              with os.fdopen(fd, 'w', encoding='utf-8') as handle:
                  for key, value in values.items():
                      escaped = value.replace('\\', '\\\\').replace('"', '\\"')
                      handle.write(f'{key}="{escaped}"\n')
              os.chmod(tmp_name, 0o600)
              os.chown(tmp_name, 0, 0)
              os.replace(tmp_name, target)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass

          print('Oddělená SMTP konfigurace statistik byla vytvořena pro petrkotab@seznam.cz; heslo nebylo vypsáno.')
          PY

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git clone --depth 1 https://github.com/petrkotab666/nasekadan.git "$work/repo"
          sudo bash "$work/repo/.github/scripts/nasekadan-stats/install-stats.sh"
          sudo systemctl daemon-reload
          sudo systemctl restart nasekadan-stats-web.service
          sleep 2
          systemctl is-active --quiet nasekadan-stats-web.service
          health="$(curl -fsS http://127.0.0.1:3225/healthz)"
          python3 - "$health" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get('ok') is True
          assert data.get('auth') == 'application'
          assert data.get('smtpConfigured') is True
          PY
          echo 'Lokální služba statistik je aktivní a SMTP je nakonfigurované.'
          REMOTE

      - name: Ověřit veřejný login a odeslat skutečný resetovací e-mail
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          login="$(curl -fsS --retry 4 --retry-delay 2 --max-time 25 \
            -H 'Cache-Control: no-cache' \
            'https://nasekadan.cz/statistiky/?verify-smtp='"$GITHUB_RUN_ID")"
          grep -Fq 'Přihlášení ke statistikám' <<<"$login"
          grep -Fq 'Zapomenuté heslo' <<<"$login"

          forgot="$(curl -fsS --retry 4 --retry-delay 2 --max-time 25 \
            'https://nasekadan.cz/statistiky/zapomenute-heslo')"
          grep -Fq 'petrkotab@seznam.cz' <<<"$forgot"

          response_file="$RUNNER_TEMP/stats-smtp/reset-response.html"
          status="$(curl -sS --retry 2 --retry-delay 2 --max-time 45 \
            -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -D "$RUNNER_TEMP/stats-smtp/reset-headers.txt" \
            -o "$response_file" \
            -w '%{http_code}' \
            --data '' \
            'https://nasekadan.cz/statistiky/zapomenute-heslo')"
          test "$status" = 200
          grep -Eq 'Obnovovací odkaz (byl odeslán|už byl nedávno odeslán)' "$response_file"

          preview_status="$(curl -kisS --max-time 20 https://nasekadan.cz/nahled/ | awk 'NR==1 {print $2}')"
          [[ "$preview_status" =~ ^(401|404|502|503)$ ]]

          echo 'ÚSPĚCH: SMTP server přijal resetovací e-mail výhradně pro petrkotab@seznam.cz.' \
            | tee -a "$RUNNER_TEMP/stats-smtp/result.txt"

      - name: Zapsat výsledek do PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          KEY_NAME: ${{ steps.key.outputs.selected }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`${process.env.RUNNER_TEMP}/stats-smtp/result.txt`, 'utf8'); } catch {}
            const ok = process.env.CONFIGURE_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success';
            const body = [
              `## ${ok ? 'Reset hesla statistik je kompletně funkční' : 'Napojení resetu na SMTP selhalo'}`,
              '',
              `- SSH secret: \`${process.env.KEY_NAME || 'žádný'}\``,
              `- Oddělená SMTP konfigurace a nasazení: **${process.env.CONFIGURE_OUTCOME || 'neprovedeno'}**`,
              `- Veřejný formulář a přijetí e-mailu SMTP serverem: **${process.env.VERIFY_OUTCOME || 'neprovedeno'}**`,
              '- Resetovací adresa je pevně omezena na `petrkotab@seznam.cz`.',
              '- Žádné SMTP heslo není ve výstupu uvedeno.',
              '',
              '```text',
              log.slice(-30000).replace(/```/g, '---'),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});

      - name: Vyhodnotit
        if: always()
        shell: bash
        env:
          CONFIGURE: ${{ steps.configure.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          test "$CONFIGURE" = success
          test "$VERIFY" = success
