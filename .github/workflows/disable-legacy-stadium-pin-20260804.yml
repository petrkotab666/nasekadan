name: Jednorázově odstranit staré připnutí zimního stadionu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-legacy-stadium-pin-20260804.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disable-legacy-stadium-pin-20260804
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Trvale vypnout historické připnutí v kanonickém generátoru
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – oprava generátoru'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/enforce_article_visibility.py')
          text = path.read_text(encoding='utf-8')
          old_href = "HOMEPAGE_PIN_HREF = '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'"
          old_until = "HOMEPAGE_PIN_UNTIL = datetime.fromisoformat('2026-08-05T18:00:00+02:00')"
          if old_href in text:
              text = text.replace(old_href, "HOMEPAGE_PIN_HREF = ''", 1)
          if old_until in text:
              text = text.replace(old_until, "HOMEPAGE_PIN_UNTIL = datetime.fromtimestamp(0, tz=timezone.utc)", 1)
          if "HOMEPAGE_PIN_HREF = ''" not in text or 'datetime.fromtimestamp(0, tz=timezone.utc)' not in text:
              raise SystemExit('Historické připnutí se nepodařilo bezpečně vypnout.')
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
            python3 -m py_compile scripts/enforce_article_visibility.py scripts/enforce_all_article_visibility.py
            python3 scripts/enforce_all_article_visibility.py
            git diff --check
            git add scripts/enforce_article_visibility.py index.html clanky/index.html sitemap.xml
            find clanky -maxdepth 1 -type f -name 'strana-*.html' -print0 | xargs -0 -r git add --
            if ! git diff --cached --quiet; then
              git commit -m 'Trvale vypnout staré připnutí zimního stadionu'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$pushed" = 1
