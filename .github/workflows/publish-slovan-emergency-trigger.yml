name: Nouzově spustit publikaci Slovanu

"on":
  push:
    paths:
      - '.github/dispatch/slovan-20260805.trigger'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-slovan-20260805
  cancel-in-progress: false

env:
  OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}

jobs:
  emergency:
    name: Okamžitá záchranná publikace a úplné ověření
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ověřit živý web a při neúplnosti publikaci dokončit
        shell: bash
        run: bash scripts/publish_slovan_runtime.sh rescue
      - name: Zapsat kritický incident při selhání
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const title = '[incident] Nouzová publikace Slovanu 5. srpna';
            const body = `Nouzový publikační běh nedokázal potvrdit úplnou veřejnou publikaci.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'open', per_page:100});
            const issue = existing.find(x => x.title === title);
            if (issue) await github.rest.issues.createComment({owner, repo, issue_number:issue.number, body});
            else await github.rest.issues.create({owner, repo, title, body});
