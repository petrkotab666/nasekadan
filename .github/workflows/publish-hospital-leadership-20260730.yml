name: Publikovat nové vedení Nemocnice Kadaň

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hospital-leadership-20260730.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hospital-leadership-20260730
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE: clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aktualizovat titulku, archiv a sociální grafiku
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python -m pip install --quiet Pillow
          python scripts/enforce_article_visibility.py
          python scripts/generate_social_cards.py --write --check
          git config user.name "Naše Kadaň automat"
          git config user.email "actions@users.noreply.github.com"
          git add "$ARTICLE" index.html clanky/index.html social/
          git commit -m "Nasadit zprávu o novém vedení Nemocnice Kadaň" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Nasadit do aktivního Dockeru i statického kořene
        id: deploy
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main

          files=(
            index.html
            clanky/index.html
            clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html
          )

          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          if [[ -z "$cid" ]]; then cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"; fi
          test -n "$cid"

          for file in "${files[@]}"; do
            sudo install -d -m 0755 "/var/www/nasekadan/$(dirname "$file")"
            sudo install -m 0644 "$file" "/var/www/nasekadan/$file"
            sudo docker exec "$cid" mkdir -p "/usr/share/nginx/html/$(dirname "$file")"
            sudo docker cp "$file" "$cid:/usr/share/nginx/html/$file"
          done

          sudo install -d -m 0755 /var/www/nasekadan/social
          sudo cp -a social/. /var/www/nasekadan/social/
          sudo docker exec "$cid" mkdir -p /usr/share/nginx/html/social
          sudo docker cp social/. "$cid:/usr/share/nginx/html/social/"

          curl -fsS http://127.0.0.1:3224/clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html | grep -Fq 'Nemocnice Kadaň mění vedení'
          curl -fsS http://127.0.0.1:3224/index.html | grep -Fq 'nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html'
          curl -fsS http://127.0.0.1:3224/clanky/index.html | grep -Fq 'nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html'
          REMOTE

      - name: Ověřit veřejné zveřejnění
        run: |
          set -euo pipefail
          for n in $(seq 1 24); do
            article="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/clanky/nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html?check=${GITHUB_SHA}-$n" || true)"
            home="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/?check=${GITHUB_SHA}-$n" || true)"
            archive="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/clanky/?check=${GITHUB_SHA}-$n" || true)"
            if grep -Fq 'Nemocnice Kadaň mění vedení' <<<"$article" \
              && grep -Fq 'nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html' <<<"$home" \
              && grep -Fq 'nemocnice-kadan-nove-vedeni-pavel-marek-jiri-vlas.html' <<<"$archive"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
