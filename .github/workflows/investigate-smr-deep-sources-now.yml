name: Prověřit hlubší zdroje SMR Tušimice

on:
  push:
    branches: [main]
    paths: ['.github/workflows/investigate-smr-deep-sources-now.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p "$RUNNER_TEMP/deep/raw" "$RUNNER_TEMP/deep/text"
      - id: collect
        continue-on-error: true
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/deep" <<'PY'
          import html,json,re,subprocess,sys,urllib.request,zipfile
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          from xml.etree import ElementTree as ET
          root=Path(sys.argv[1]); raw=root/'raw'; text=root/'text'
          ua='Mozilla/5.0 Chrome/126'; records=[]; log=[]; seen=set()
          def safe(s): return re.sub(r'[^A-Za-z0-9._-]+','_',s).strip('_')[-160:]
          def fetch(url,label,ref=''):
            if url in seen:return None
            seen.add(url); h={'User-Agent':ua,'Accept-Language':'cs,en;q=.7'}
            if ref:h['Referer']=ref
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=90) as r:
                data=r.read(); final=r.geturl(); ctype=r.headers.get_content_type() or ''
              ext=Path(urlsplit(final).path).suffix.lower() or ('.html' if 'html' in ctype else '.bin')
              p=raw/(safe(label)+ext); p.write_bytes(data)
              records.append({'label':label,'url':url,'final':final,'bytes':len(data),'file':p.name,'type':ctype})
              log.append(f'OK {label} {len(data)} {ctype} {final}'); return p
            except Exception as e:
              log.append(f'FAIL {label} {url}: {type(e).__name__}: {e}'); return None
          def links(p,base):
            s=p.read_text('utf-8',errors='replace'); out=[]
            for x in re.findall(r'href=["\']([^"\']+)',s,re.I):
              x=html.unescape(x)
              if not x.startswith(('#','javascript:','mailto:')):out.append(urljoin(base,x))
            return out
          for rid in ['26034643','26035439','28998080','32064228','32245712','26176155']:
            u=f'https://smlouvy.gov.cz/smlouva/{rid}'; p=fetch(u,f'rs_{rid}')
            if p:
              for n,x in enumerate(links(p,u)):
                if 'smlouvy.gov.cz' in x and any(e in x.lower() for e in ('.pdf','.docx','.xlsx','.zip')):fetch(x,f'rs_{rid}_att_{n}',u)
          fetch('https://eru.gov.cz/sites/default/files/obsah/prilohy/desetilety-plan-rozvoje-prenosove-soustavy-ceske-republiky-2025-205642346567.pdf','ceps_2025_2034')
          fetch('https://www.spcr.cz/sites/default/files/2026-05/pripominky%20SP%20CR%20lomy%20Libous%20a%20Bilina.pdf','spcr_libous')
          for label,u in [
            ('secr','https://www.svazenergetiky.cz/novinky/stanovisko-secr-k-navrhu-optimalniho-zpusobu-vyuziti-uzemi-zbytkovych-jam-lomu-l'),
            ('brezno','https://www.obecbrezno.cz/samosprava-obce/usneseni-ze-zasedani-zastupitelstva-obce-brezno/'),
            ('kadan_deska','https://www.mesto-kadan.cz/cs/system/uredni-deska-nova.html'),
            ('kadan_sitemap','https://www.mesto-kadan.cz/sitemap.xml'),
            ('kadan_up','https://gis.mesto-kadan.cz/portal/upd-kadan')]:
            p=fetch(u,label)
            if not p:continue
            for n,x in enumerate(links(p,u)):
              low=x.lower()
              take=any(e in low for e in ('.pdf','.docx'))
              if label=='brezno':take=take and any(y in low for y in ('2024','2025','2026'))
              if take:fetch(x,f'{label}_att_{n}',u)
          for r in records:
            p=raw/r['file']; out=text/(p.name+'.txt')
            try:
              if p.suffix.lower()=='.pdf':subprocess.run(['pdftotext','-layout',str(p),str(out)],timeout=240)
              elif p.suffix.lower()=='.docx':
                chunks=[]
                with zipfile.ZipFile(p) as z:
                  for n in z.namelist():
                    if n.startswith('word/') and n.endswith('.xml'):
                      node=ET.fromstring(z.read(n)); chunks.append(' '.join(e.text or '' for e in node.iter() if e.tag.endswith('}t')))
                out.write_text('\n'.join(chunks),encoding='utf-8')
              elif p.suffix.lower() in ('.html','.xml'):
                s=p.read_text('utf-8',errors='replace'); s=re.sub(r'<script\b.*?</script>|<style\b.*?</style>',' ',s,flags=re.I|re.S); s=re.sub(r'<[^>]+>',' ',s)
                out.write_text(re.sub(r'\s+',' ',html.unescape(s)),encoding='utf-8')
            except Exception as e:log.append(f'EXTRACT {p.name}: {e}')
          keys=['Tušimice','SMR','jaderný','Hradec','400 kV','V411','V412','ČEPS','připojen','vyvedení výkonu','nadrozměr','těžkých komponent','Nechranice','Libouš','AQUATIS','ČHMÚ','přečerpávací','štolov','majetkopráv','Kadaň']
          md=['# Hloubkový průchod zdrojů SMR Tušimice','']
          for p in sorted(text.glob('*.txt')):
            s=p.read_text('utf-8',errors='replace'); ls=s.splitlines(); hits=[]
            for i,l in enumerate(ls):
              if any(k.casefold() in l.casefold() for k in keys):
                q=re.sub(r'\s+',' ',' '.join(ls[max(0,i-2):i+3])).strip()[:1300]
                if q and q not in hits:hits.append(q)
              if len(hits)>=60:break
            md += [f'## {p.name}',f'Text: {len(s)} znaků','']+[f'- {h}' for h in hits]+['']
          (root/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'report.md').write_text('\n'.join(md),encoding='utf-8')
          (root/'download.log').write_text('\n'.join(log),encoding='utf-8')
          print(json.dumps({'downloads':len(records),'texts':len(list(text.glob("*.txt")))},ensure_ascii=False))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smr-tusimice-deep-sources
          path: ${{ runner.temp }}/deep/
          retention-days: 30
      - if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.collect.outcome }}
        with:
          script: |
            const fs=require('fs'), b=process.env.RUNNER_TEMP+'/deep/';
            const read=(p,n)=>{try{return fs.readFileSync(b+p,'utf8').slice(0,n)}catch{return ''}};
            const body=[`- Commit: \`${context.sha}\``,`- Výsledek: **${process.env.RESULT}**`,'',read('report.md',53000),'','## Zdroje','```json',read('records.json',7000),'```','','## Diagnostika','```text',read('download.log',3500),'```'].join('\n').slice(0,65000);
            const x=await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:`[SMR TUŠIMICE HLOUBKOVĚ] ${process.env.RESULT} ${new Date().toISOString()}`,body});
            if(process.env.RESULT==='success')await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:x.data.number,state:'closed',state_reason:'completed'});
