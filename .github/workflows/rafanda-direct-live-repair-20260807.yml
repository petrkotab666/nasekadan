name: Rafanda a Gymnastika – historický repair, pouze ruční audit

# Jednorázový přímý deploy z 7. 8. 2026 je definitivně odstřižen.
# Workflow už nemá automatický trigger, SSH secret ani právo měnit main/produkci.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit kanonický zdroj Rafandy a Gymnastiky
        shell: bash
        run: |
          set -euo pipefail
          raf='clanky/eso-market-rafanda-kadan-24-7.html'
          gym='clanky/gymnastika-kadan-treneri-prosinec-2026.html'
          test -s "$raf"
          test -s "$gym"
          for img in \
            images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp \
            images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp \
            images/clanky/eso-market-rafanda/pravidla-platba-kamery-v2.webp; do
            test -s "$img"
            grep -Fq "/$img" "$raf"
          done
          test -s social/gymnastika-kadan-treneri-prosinec-2026-v2.png
          grep -Fq '/social/gymnastika-kadan-treneri-prosinec-2026-v2.png' "$gym"
          git diff --exit-code
          echo 'OK: historický repair je audit-only; zdrojové soubory jsou kompletní.'
