name: Přímá oprava Rafandy a obrázku Gymnastiky na produkci

on:
  push:
    branches: [main]
    paths:
      - '.github/rafanda-direct-live-trigger.txt'
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/rafanda-direct-pr-trigger.txt'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: rafanda-gymnastika-direct-live-repair-20260807
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAFANDA: clanky/eso-market-rafanda-kadan-24-7.html
      GYM: clanky/gymnastika-kadan-treneri-prosinec-2026.html
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit zdrojové články a obrázky
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Pro Rafandu jde hlavně o dostupnější nákup' "$RAFANDA"
          grep -Fq '/images/clanky/eso-market-rafanda/pravidla-platba-kamery.webp' "$RAFANDA"
          grep -Fq '/social/gymnastika-kadan-treneri-prosinec-2026.png' "$GYM"
          for f in \
            images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp \
            images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp \
            images/clanky/eso-market-rafanda/pravidla-platba-kamery.webp \
            social/eso-market-rafanda-kadan-24-7.webp; do
            file "$f" | grep -Fq 'Web/P image'
            test "$(stat -c %s "$f")" -gt 10000
          done
          file social/gymnastika-kadan-treneri-prosinec-2026.png | grep -Fq 'PNG image data, 1200 x 630'
          test "$(stat -c %s social/gymnastika-kadan-treneri-prosinec-2026.png)" -gt 50000

      - name: Připravit cílený balík
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/nk-image-repair"
          rm -rf "$stage"
          mkdir -p "$stage/clanky" "$stage/images/clanky/eso-market-rafanda" "$stage/social"
          cp "$RAFANDA" "$stage/clanky/"
          cp "$GYM" "$stage/clanky/"
          cp images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp "$stage/images/clanky/eso-market-rafanda/"
          cp images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp "$stage/images/clanky/eso-market-rafanda/"
          cp images/clanky/eso-market-rafanda/pravidla-platba-kamery.webp "$stage/images/clanky/eso-market-rafanda/"
          cp social/eso-market-rafanda-kadan-24-7.webp "$stage/social/"
          cp social/gymnastika-kadan-treneri-prosinec-2026.png "$stage/social/"
          tar -C "$stage" -czf "$RUNNER_TEMP/nk-image-repair.tgz" .

      - name: Nasadit přímo na OVH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          opts=(-i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25)
          scp "${opts[@]}" "$RUNNER_TEMP/nk-image-repair.tgz" ubuntu@57.129.43.215:/tmp/nk-image-repair.tgz
          ssh "${opts[@]}" ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/var/www/nasekadan
          work="$(mktemp -d /tmp/nk-image-repair.XXXXXX)"
          trap 'rm -rf "$work" /tmp/nk-image-repair.tgz' EXIT
          tar -xzf /tmp/nk-image-repair.tgz -C "$work"
          sudo install -d -m 0755 "$root/clanky" "$root/images/clanky/eso-market-rafanda" "$root/social"
          sudo install -m 0644 "$work/clanky/eso-market-rafanda-kadan-24-7.html" "$root/clanky/eso-market-rafanda-kadan-24-7.html"
          sudo install -m 0644 "$work/clanky/gymnastika-kadan-treneri-prosinec-2026.html" "$root/clanky/gymnastika-kadan-treneri-prosinec-2026.html"
          sudo install -m 0644 "$work/images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp" "$root/images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp"
          sudo install -m 0644 "$work/images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp" "$root/images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp"
          sudo install -m 0644 "$work/images/clanky/eso-market-rafanda/pravidla-platba-kamery.webp" "$root/images/clanky/eso-market-rafanda/pravidla-platba-kamery.webp"
          sudo install -m 0644 "$work/social/eso-market-rafanda-kadan-24-7.webp" "$root/social/eso-market-rafanda-kadan-24-7.webp"
          sudo install -m 0644 "$work/social/gymnastika-kadan-treneri-prosinec-2026.png" "$root/social/gymnastika-kadan-treneri-prosinec-2026.png"
          sudo chmod -R a+rX "$root/clanky" "$root/images/clanky/eso-market-rafanda" "$root/social"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/images/clanky/eso-market-rafanda /usr/share/nginx/html/social
            sudo tar -C "$work" -czf - clanky images social | sudo docker exec -i nasekadan-web tar -xzf - -C /usr/share/nginx/html
          fi
          REMOTE

      - name: Ověřit živý web přes produkční Caddy
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25)
          ssh "${opts[@]}" ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          base='https://nasekadan.cz'
          get() { curl -kfsS -L --max-time 30 --resolve nasekadan.cz:443:127.0.0.1 "$base$1?repair=$(date +%s%N)"; }
          raf="$(get /clanky/eso-market-rafanda-kadan-24-7.html)"
          gym="$(get /clanky/gymnastika-kadan-treneri-prosinec-2026.html)"
          test "${#raf}" -gt 8000
          test "${#gym}" -gt 8000
          grep -Fq 'Pro Rafandu jde hlavně o dostupnější nákup' <<<"$raf"
          grep -Fq '/images/clanky/eso-market-rafanda/pravidla-platba-kamery.webp' <<<"$raf"
          grep -Fq '/social/gymnastika-kadan-treneri-prosinec-2026.png' <<<"$gym"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for rel in \
            /images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp \
            /images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp \
            /images/clanky/eso-market-rafanda/pravidla-platba-kamery.webp \
            /social/eso-market-rafanda-kadan-24-7.webp; do
            out="$tmp/$(basename "$rel")"
            curl -kfsS -L --max-time 30 --resolve nasekadan.cz:443:127.0.0.1 "$base$rel?repair=$(date +%s%N)" -o "$out"
            file "$out" | grep -Fq 'Web/P image'
            test "$(stat -c %s "$out")" -gt 10000
          done
          curl -kfsS -L --max-time 30 --resolve nasekadan.cz:443:127.0.0.1 "$base/social/gymnastika-kadan-treneri-prosinec-2026.png?repair=$(date +%s%N)" -o "$tmp/gym.png"
          file "$tmp/gym.png" | grep -Fq 'PNG image data, 1200 x 630'
          test "$(stat -c %s "$tmp/gym.png")" -gt 50000
          echo 'RAFANDA_GYMNASTIKA_LIVE_OK=1'
          REMOTE

      - name: Zapsat výsledek do servisního PR
        if: always() && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `✅ Rafanda i Gymnastika jsou opravené na produkci. Ověřen kompletní článek Rafandy, třetí WebP a plný PNG 1200×630 Gymnastiky. Run ${context.runId}.`
                : `❌ Cílená oprava Rafandy/Gymnastiky selhala. Run ${context.runId}.`
            });
