name: Nouzově nasadit článek o hřištích

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-deploy-current-main-20260804.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-playgrounds-article
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      ARTICLE_PATH: clanky/jak-se-kadan-stara-o-hriste-2026.html
      ARTICLE_URL: https://nasekadan.cz/clanky/jak-se-kadan-stara-o-hriste-2026.html
    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit ověřené údaje o Rafandě
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('clanky/jak-se-kadan-stara-o-hriste-2026.html')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r'<meta property="article:modified_time" content="[^"]+">',
              '<meta property="article:modified_time" content="2026-08-06T08:00:00+02:00">',
              text,
              count=1,
          )
          text = re.sub(
              r'"dateModified":"[^"]+"',
              '"dateModified":"2026-08-06T08:00:00+02:00"',
              text,
              count=1,
          )
          text = re.sub(r'AKTUALIZOVÁNO \d{1,2}:\d{2}', 'AKTUALIZOVÁNO 8:00', text, count=1)

          old = '<p>Investiční plán města uvádí také přípravu softballového hřiště a technické zázemí sportoviště Tatran. Samostatně se připravuje rekonstrukce hřiště na Rafandě. Veřejné smluvní podklady ukazují práci na projektové dokumentaci, ale pro úplný a aktuální popis rozsahu bude potřeba finální projekt a stavební povolení.</p>'
          new = '''<p>Investiční plán města uvádí také přípravu softballového hřiště a technické zázemí sportoviště Tatran.</p>
          <h3>Rafanda: projektová dokumentace má více navázaných záznamů</h3>
          <p><strong>Původní smlouva s ISONOE INVEST na projektovou dokumentaci rekonstrukce hřiště Rafanda byla uzavřena 8. listopadu 2024 za 692&nbsp;000 Kč bez DPH, tedy 837&nbsp;320 Kč včetně DPH.</strong> Registr smluv obsahuje také navázaný záznam uzavřený 25. dubna 2025 za 278&nbsp;400 Kč bez DPH, tedy 336&nbsp;864 Kč včetně DPH. Protože zveřejněná metadata sama nevysvětlují, zda jde o rozšíření, nahrazení části původního plnění nebo jinou smluvní úpravu, částky zatím nesčítáme jako konečnou cenu dokumentace. Pro přesný popis rozsahu i ceny je potřeba úplné znění navazujícího dokumentu, finální projekt a povolení stavby.</p>'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'Rafanda: projektová dokumentace má více navázaných záznamů' not in text:
              raise SystemExit('Nenalezen očekávaný odstavec o Rafandě.')

          anchor = '<li><a href="https://smlouvy.gov.cz/smlouva/38419402">Registr smluv: novostavba padelových kurtů v Kadani, kurt č. 1 v tenisovém areálu</a></li>\n'
          sources = '''<li><a href="https://smlouvy.gov.cz/smlouva/30927420">Registr smluv: projektová dokumentace rekonstrukce hřiště Rafanda, 692 000 Kč bez DPH</a></li>
          <li><a href="https://smlouvy.gov.cz/smlouva/33037396">Registr smluv: navázaný záznam k dokumentaci hřiště Rafanda, 278 400 Kč bez DPH</a></li>
          '''
          if 'smlouva/33037396' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Nelze bezpečně doplnit zdroje k Rafandě.')
              text = text.replace(anchor, sources + anchor, 1)

          required = (
              'AKTUALIZOVÁNO 8:00',
              'Rafanda: projektová dokumentace má více navázaných záznamů',
              '692&nbsp;000 Kč bez DPH',
              '278&nbsp;400 Kč bez DPH',
              'Ultimo Wave za 175&nbsp;087 Kč včetně DPH',
              'Součet činí 1 702 503,54 Kč včetně DPH.',
              'Ve dvou doložených lokalitách je 21 košů',
          )
          for item in required:
              if item not in text:
                  raise SystemExit(f'V článku chybí povinný údaj: {item}')
          if text.count('<tr><td>5.20</td>') != 1:
              raise SystemExit('Řádek hřiště 5.20 není právě jednou.')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Uložit doplnění do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – ověřené doplnění'
          git config user.email 'info@nasekadan.cz'
          if git diff --quiet -- "$ARTICLE_PATH"; then
            exit 0
          fi
          git add "$ARTICLE_PATH"
          git commit -m 'Doplnit smluvní údaje k hřišti Rafanda'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Načíst nejnovější článek a ověřit zdroj
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -Fq 'AKTUALIZOVÁNO 8:00' "$ARTICLE_PATH"
          grep -Fq 'Rafanda: projektová dokumentace má více navázaných záznamů' "$ARTICLE_PATH"
          grep -Fq '692&nbsp;000 Kč bez DPH' "$ARTICLE_PATH"
          grep -Fq '278&nbsp;400 Kč bez DPH' "$ARTICLE_PATH"
          grep -Fq 'Ultimo Wave za 175&nbsp;087 Kč včetně DPH' "$ARTICLE_PATH"
          grep -Fq 'Součet činí 1 702 503,54 Kč včetně DPH.' "$ARTICLE_PATH"
          test "$(grep -Fo '<tr><td>5.20</td>' "$ARTICLE_PATH" | wc -l | tr -d ' ')" = "1"

      - name: Nasadit článek přímo na OVH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          mkdir -p "$RUNNER_TEMP/playgrounds-hotfix/clanky"
          cp "$ARTICLE_PATH" "$RUNNER_TEMP/playgrounds-hotfix/clanky/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/playgrounds-hotfix" ubuntu@57.129.43.215:/tmp/nasekadan-playgrounds-hotfix
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/nasekadan-playgrounds-hotfix
          root=/var/www/nasekadan
          file=jak-se-kadan-stara-o-hriste-2026.html
          sudo install -d -m 0755 "$root/clanky"
          sudo install -m 0644 "$src/clanky/$file" "$root/clanky/$file"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky
            sudo docker cp "$src/clanky/$file" "nasekadan-web:/usr/share/nginx/html/clanky/$file"
            sudo docker exec nasekadan-web nginx -s reload || true
          fi
          rm -rf "$src"
          REMOTE

      - name: Veřejně ověřit aktualizovaný článek
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            q="${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            curl -4 -kfsS -L -H 'Cache-Control: no-cache' --max-time 40 "$ARTICLE_URL?v=$q" -o /tmp/playgrounds-live.html || true
            if python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/playgrounds-live.html').read_text(encoding='utf-8', errors='replace')
          required = (
              'AKTUALIZOVÁNO 8:00',
              'Rafanda: projektová dokumentace má více navázaných záznamů',
              '692&nbsp;000 Kč bez DPH',
              '278&nbsp;400 Kč bez DPH',
              'Ultimo Wave za 175&nbsp;087 Kč včetně DPH',
              'Součet činí 1 702 503,54 Kč včetně DPH.',
              'Ve dvou doložených lokalitách je 21 košů',
          )
          for item in required:
              assert item in text, item
          assert text.count('<tr><td>5.20</td>') == 1
          PY
            then
              ok=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$ok" = 1

      - name: Zapsat veřejný důkaz
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="$(git rev-parse HEAD)"
          success=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            export DEPLOYED_SHA="$deployed_sha"
            mkdir -p reports
            python3 - <<'PY'
          import datetime, json, os
          data = {
              'status': 'passed',
              'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'article': 'https://nasekadan.cz/clanky/jak-se-kadan-stara-o-hriste-2026.html',
              'source': os.environ['DEPLOYED_SHA'],
              'checks': ['updated-0800', 'rafanda-692000', 'rafanda-linked-278400', 'jesen-175087', 'chytre-1702503', 'discgolf-21', 'single-5.20'],
              'runId': os.environ.get('GITHUB_RUN_ID', ''),
          }
          open('reports/playgrounds-live-status.json', 'w', encoding='utf-8').write(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
            git config user.name 'Naše Kadaň – veřejná kontrola'
            git config user.email 'info@nasekadan.cz'
            git add reports/playgrounds-live-status.json
            if git diff --cached --quiet; then
              success=1
              break
            fi
            git commit -m 'Potvrdit veřejné nasazení článku o hřištích [skip ci]'
            if git push origin HEAD:main; then
              success=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$success" = 1
