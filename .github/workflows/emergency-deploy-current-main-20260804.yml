name: Nouzově nasadit článek o hřištích

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-deploy-current-main-20260804.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-playgrounds-article
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      ARTICLE_PATH: clanky/jak-se-kadan-stara-o-hriste-2026.html
      ARTICLE_URL: https://nasekadan.cz/clanky/jak-se-kadan-stara-o-hriste-2026.html
    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit cenu discgolfového hřiště v Jeseni
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('clanky/jak-se-kadan-stara-o-hriste-2026.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace('2026-08-06T07:45:00+02:00', '2026-08-06T07:55:00+02:00')
          text = text.replace('AKTUALIZOVÁNO 7:45', 'AKTUALIZOVÁNO 7:55')

          old_chytre = '''<div class="place"><h3>Chytré hřiště</h3><p>Areál otevřený v létě 2018 spojuje hru a poznávání. Má vodní model Nechranické přehrady a Kadaňského stupně, pískoviště s bagrem, amfiteátr, zvukové prvky i fotbalovou plochu. Později přibyla kuličková dráha za 101 515 Kč, prvek Hopsinky za 213 782 Kč a šest skákacích balónů za 138 509 Kč, vše včetně DPH. Tři doložená rozšíření tak stála dohromady 453 806 Kč.</p></div>'''
          new_chytre = '''<div class="place"><h3>Chytré hřiště</h3><p>Areál otevřený v létě 2018 spojuje hru a poznávání. Má vodní model Nechranické přehrady a Kadaňského stupně, pískoviště s bagrem, amfiteátr, zvukové prvky i fotbalovou plochu. Veřejné dokumenty dokládají nejméně osm přesně oceněných pozdějších zásahů: naučné prvky za 83 212 Kč, úpravu podzemní chodby za 497 582,08 Kč, skluzavku za 130 196 Kč, kuličkové hřiště za 101 515 Kč, tři herní prvky za 175 281 Kč, Hopsinky za 213 782 Kč, dřevěné bludiště za 362 426,46 Kč a šest skákacích balónů za 138 509 Kč. Součet činí 1 702 503,54 Kč včetně DPH. Nezahrnuje další dohledané práce bez bezpečně potvrzené ceny, například drenáž a tři posilovací prvky.</p></div>'''
          if old_chytre in text:
              text = text.replace(old_chytre, new_chytre, 1)
          elif 'Součet činí 1 702 503,54 Kč včetně DPH.' not in text:
              raise SystemExit('Nenalezen očekávaný blok Chytrého hřiště.')

          old_jesen = '''<p><strong>Menší hřiště je také v parčíku v Kadaňské Jeseni.</strong> Pracovník odboru životního prostředí města potvrdil, že vzniklo na přání místních obyvatel, přesný počet košů však v rozhovoru uváděl jen odhadem. Aktuální mapový záznam UDisc rozlišuje tři fyzické koše a čtyři výhoziště, z nichž je sestaven krátký devítijamkový okruh. Hřiště leží přibližně na souřadnicích 50.36655, 13.26480.</p>'''
          new_jesen = '''<p><strong>Menší hřiště je také v parčíku v Kadaňské Jeseni.</strong> Pracovník odboru životního prostředí města potvrdil, že vzniklo na přání místních obyvatel, přesný počet košů však v rozhovoru uváděl jen odhadem. Aktuální mapový záznam UDisc rozlišuje tři fyzické koše a čtyři výhoziště, z nichž je sestaven krátký devítijamkový okruh. Samotné vybudování hřiště město objednalo v říjnu 2024 u společnosti Ultimo Wave za 175&nbsp;087 Kč včetně DPH. Hřiště leží přibližně na souřadnicích 50.36655, 13.26480.</p>'''
          if old_jesen in text:
              text = text.replace(old_jesen, new_jesen, 1)
          elif 'Ultimo Wave za 175&nbsp;087 Kč včetně DPH' not in text:
              raise SystemExit('Nenalezen očekávaný odstavec Kadaňské Jeseně.')

          source_anchor = '<li><a href="https://udisc.com/courses/discgolf-kadanska-jesen-0TNS">UDisc: Kadaňská Jeseň, tři koše a čtyři výhoziště</a></li>\n'
          source_line = '<li>Registr smluv: vybudování discgolfového hřiště v Kadaňské Jeseni, Ultimo Wave, zveřejněno 23. října 2024, 175 087 Kč včetně DPH.</li>\n'
          if source_line not in text:
              if text.count(source_anchor) != 1:
                  raise SystemExit('Nelze bezpečně doplnit zdroj k discgolfu v Jeseni.')
              text = text.replace(source_anchor, source_anchor + source_line, 1)

          required = (
              'AKTUALIZOVÁNO 7:55',
              'Modernizace fotbalového areálu má dvě velké stavební části',
              'První padelový kurt v tenisovém areálu',
              'Nové dětské hřiště v Pokuticích',
              'Jak se síť hřišť rozvíjela dlouhodobě',
              'Součet činí 1 702 503,54 Kč včetně DPH.',
              'Ultimo Wave za 175&nbsp;087 Kč včetně DPH',
              'Ve dvou doložených lokalitách je 21 košů',
          )
          for item in required:
              if item not in text:
                  raise SystemExit(f'V článku chybí povinný údaj: {item}')
          if text.count('<tr><td>5.20</td>') != 1:
              raise SystemExit('Řádek hřiště 5.20 není právě jednou.')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Uložit doplnění do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – ověřené doplnění'
          git config user.email 'info@nasekadan.cz'
          if git diff --quiet -- "$ARTICLE_PATH"; then
            exit 0
          fi
          git add "$ARTICLE_PATH"
          git commit -m 'Doplnit cenu discgolfového hřiště v Kadaňské Jeseni'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Načíst nejnovější článek a ověřit zdroj
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -Fq 'AKTUALIZOVÁNO 7:55' "$ARTICLE_PATH"
          grep -Fq 'Součet činí 1 702 503,54 Kč včetně DPH.' "$ARTICLE_PATH"
          grep -Fq 'Ultimo Wave za 175&nbsp;087 Kč včetně DPH' "$ARTICLE_PATH"
          grep -Fq 'Ve dvou doložených lokalitách je 21 košů' "$ARTICLE_PATH"
          grep -Fq 'První padelový kurt v tenisovém areálu' "$ARTICLE_PATH"
          grep -Fq 'Nové dětské hřiště v Pokuticích' "$ARTICLE_PATH"
          test "$(grep -Fo '<tr><td>5.20</td>' "$ARTICLE_PATH" | wc -l | tr -d ' ')" = "1"

      - name: Nasadit článek přímo na OVH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          mkdir -p "$RUNNER_TEMP/playgrounds-hotfix/clanky"
          cp "$ARTICLE_PATH" "$RUNNER_TEMP/playgrounds-hotfix/clanky/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/playgrounds-hotfix" ubuntu@57.129.43.215:/tmp/nasekadan-playgrounds-hotfix
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/nasekadan-playgrounds-hotfix
          root=/var/www/nasekadan
          file=jak-se-kadan-stara-o-hriste-2026.html
          sudo install -d -m 0755 "$root/clanky"
          sudo install -m 0644 "$src/clanky/$file" "$root/clanky/$file"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky
            sudo docker cp "$src/clanky/$file" "nasekadan-web:/usr/share/nginx/html/clanky/$file"
          fi
          rm -rf "$src"
          REMOTE

      - name: Veřejně ověřit aktualizovaný článek
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            q="${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            curl -4 -kfsS -L --max-time 40 "$ARTICLE_URL?v=$q" -o /tmp/playgrounds-live.html || true
            if python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/playgrounds-live.html').read_text(encoding='utf-8', errors='replace')
          required = (
              'AKTUALIZOVÁNO 7:55',
              'Modernizace fotbalového areálu má dvě velké stavební části',
              'První padelový kurt v tenisovém areálu',
              'Nové dětské hřiště v Pokuticích',
              'Jak se síť hřišť rozvíjela dlouhodobě',
              'Součet činí 1 702 503,54 Kč včetně DPH.',
              'Ultimo Wave za 175&nbsp;087 Kč včetně DPH',
              'Ve dvou doložených lokalitách je 21 košů',
          )
          for item in required:
              assert item in text, item
          assert text.count('<tr><td>5.20</td>') == 1
          PY
            then
              ok=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$ok" = 1

      - name: Zapsat veřejný důkaz
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          export SOURCE_SHA_NOW="$source_sha"
          mkdir -p reports
          python3 - <<'PY'
          import datetime, json, os
          data = {
              'status': 'passed',
              'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'article': 'https://nasekadan.cz/clanky/jak-se-kadan-stara-o-hriste-2026.html',
              'source': os.environ['SOURCE_SHA_NOW'],
              'checks': ['updated-0755', 'football', 'padel', 'pokutice', 'long-term', 'chytre-1702503', 'jesen-175087', 'discgolf-21', 'single-5.20'],
              'runId': os.environ.get('GITHUB_RUN_ID', ''),
          }
          open('reports/playgrounds-live-status.json', 'w', encoding='utf-8').write(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'Naše Kadaň – veřejná kontrola'
          git config user.email 'info@nasekadan.cz'
          git add reports/playgrounds-live-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Potvrdit veřejné nasazení článku o hřištích [skip ci]'
          git push origin HEAD:main
