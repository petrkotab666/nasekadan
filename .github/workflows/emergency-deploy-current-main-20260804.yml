name: Nouzově nasadit článek o hřištích

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-deploy-current-main-20260804.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-playgrounds-article
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      ARTICLE_PATH: clanky/jak-se-kadan-stara-o-hriste-2026.html
      ARTICLE_URL: https://nasekadan.cz/clanky/jak-se-kadan-stara-o-hriste-2026.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit psí hřiště
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('clanky/jak-se-kadan-stara-o-hriste-2026.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'<meta property="article:modified_time" content="[^"]+">', '<meta property="article:modified_time" content="2026-08-06T08:10:00+02:00">', text, count=1)
          text = re.sub(r'"dateModified":"[^"]+"', '"dateModified":"2026-08-06T08:10:00+02:00"', text, count=1)
          text = re.sub(r'AKTUALIZOVÁNO \d{1,2}:\d{2}', 'AKTUALIZOVÁNO 8:10', text, count=1)

          anchor = '''<div class="place"><h3>Workout, Lanáček a dopravní hřiště</h3><p>Oficiální městský přehled uvádí dvě workoutová místa: za sportovní halou a v Rooseveltových sadech. V sadech město v roce 2025 objednalo pryžové plochy pod fitness prvky za 43 056 Kč bez DPH. Síť doplňuje bezplatný Lanáček u ZŠ Na Podlesí a dopravní hřiště pro kola, koloběžky a in-line brusle.</p></div>
          </div>'''
          replacement = '''<div class="place"><h3>Workout, Lanáček a dopravní hřiště</h3><p>Oficiální městský přehled uvádí dvě workoutová místa: za sportovní halou a v Rooseveltových sadech. V sadech město v roce 2025 objednalo pryžové plochy pod fitness prvky za 43 056 Kč bez DPH. Síť doplňuje bezplatný Lanáček u ZŠ Na Podlesí a dopravní hřiště pro kola, koloběžky a in-line brusle.</p></div>
          <div class="place"><h3>První psí hřiště</h3><p>Kadaň otevřela své první psí hřiště 28. května 2024 nedaleko autobusového nádraží. Smluvně doložený sponzorský příspěvek společnosti Nestlé Česko v rámci projektu Purina činil 239 459 Kč včetně DPH. Psí hřiště je samostatnou volnočasovou plochou a nezapočítáváme ho do městského údaje o 69 dětských hřištích a sportovištích.</p></div>
          </div>'''
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif '<h3>První psí hřiště</h3>' not in text:
              raise SystemExit('Nenalezeno bezpečné místo pro psí hřiště.')

          source_anchor = '<li><a href="https://www.prodiscgolf.cz/magazin/2026/03/11/jak-discgolf-vdechl-kadanskemu-lesoparku-zivot/">ProDiscgolf: rozhovor s pracovníkem města o vzniku a rozšíření hřiště</a></li>\n'
          source_lines = '''<li>Registr smluv: sponzorský finanční příspěvek Nestlé Česko na vybudování psího hřiště v Kadani, 239 459 Kč včetně DPH, zveřejněno 28. března 2024.</li>
          <li>Chomutovský deník: Kadaň otevřela první psí hřiště 28. května 2024 nedaleko autobusového nádraží.</li>
          '''
          if 'sponzorský finanční příspěvek Nestlé Česko na vybudování psího hřiště' not in text:
              if text.count(source_anchor) != 1:
                  raise SystemExit('Nelze doplnit zdroje k psímu hřišti.')
              text = text.replace(source_anchor, source_lines + source_anchor, 1)

          required = (
              'AKTUALIZOVÁNO 8:10',
              'Rafanda: projektová dokumentace má více navázaných záznamů',
              '<h3>První psí hřiště</h3>',
              '239 459 Kč včetně DPH',
              'Ultimo Wave za 175&nbsp;087 Kč včetně DPH',
              'Součet činí 1 702 503,54 Kč včetně DPH.',
              'Ve dvou doložených lokalitách je 21 košů',
          )
          for item in required:
              if item not in text:
                  raise SystemExit(f'Chybí povinný údaj: {item}')
          if text.count('<tr><td>5.20</td>') != 1:
              raise SystemExit('Řádek 5.20 není právě jednou.')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Uložit článek do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – ověřené doplnění'
          git config user.email 'info@nasekadan.cz'
          if ! git diff --quiet -- "$ARTICLE_PATH"; then
            git add "$ARTICLE_PATH"
            git commit -m 'Doplnit první psí hřiště do přehledu sportovišť'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 3))
              test "$attempt" -lt 5
            done
          fi

      - name: Načíst a zkontrolovat nejnovější zdroj
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -Fq 'AKTUALIZOVÁNO 8:10' "$ARTICLE_PATH"
          grep -Fq 'Rafanda: projektová dokumentace má více navázaných záznamů' "$ARTICLE_PATH"
          grep -Fq '<h3>První psí hřiště</h3>' "$ARTICLE_PATH"
          grep -Fq 'Ultimo Wave za 175&nbsp;087 Kč včetně DPH' "$ARTICLE_PATH"
          grep -Fq 'Součet činí 1 702 503,54 Kč včetně DPH.' "$ARTICLE_PATH"
          test "$(grep -Fo '<tr><td>5.20</td>' "$ARTICLE_PATH" | wc -l | tr -d ' ')" = "1"

      - name: Nasadit článek na OVH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          mkdir -p "$RUNNER_TEMP/playgrounds-hotfix/clanky"
          cp "$ARTICLE_PATH" "$RUNNER_TEMP/playgrounds-hotfix/clanky/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$RUNNER_TEMP/playgrounds-hotfix" ubuntu@57.129.43.215:/tmp/nasekadan-playgrounds-hotfix
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/nasekadan-playgrounds-hotfix
          file=jak-se-kadan-stara-o-hriste-2026.html
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 "$src/clanky/$file" "/var/www/nasekadan/clanky/$file"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky
            sudo docker cp "$src/clanky/$file" "nasekadan-web:/usr/share/nginx/html/clanky/$file"
            sudo docker exec nasekadan-web nginx -s reload || true
          fi
          rm -rf "$src"
          REMOTE

      - name: Veřejně ověřit článek
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            q="${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            curl -4 -kfsS -L -H 'Cache-Control: no-cache' --max-time 40 "$ARTICLE_URL?v=$q" -o /tmp/playgrounds-live.html || true
            if python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/playgrounds-live.html').read_text(encoding='utf-8', errors='replace')
          for item in (
              'AKTUALIZOVÁNO 8:10',
              'Rafanda: projektová dokumentace má více navázaných záznamů',
              '<h3>První psí hřiště</h3>',
              '239 459 Kč včetně DPH',
              'Ultimo Wave za 175&nbsp;087 Kč včetně DPH',
              'Součet činí 1 702 503,54 Kč včetně DPH.',
              'Ve dvou doložených lokalitách je 21 košů',
          ):
              assert item in text, item
          assert text.count('<tr><td>5.20</td>') == 1
          PY
            then ok=1; break; fi
            sleep $((attempt * 4))
          done
          test "$ok" = 1

      - name: Zapsat důkaz veřejného nasazení
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="$(git rev-parse HEAD)"
          success=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            export DEPLOYED_SHA="$deployed_sha"
            mkdir -p reports
            python3 - <<'PY'
          import datetime, json, os
          data = {
              'status': 'passed',
              'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'article': 'https://nasekadan.cz/clanky/jak-se-kadan-stara-o-hriste-2026.html',
              'source': os.environ['DEPLOYED_SHA'],
              'checks': ['updated-0810', 'rafanda', 'dog-playground-239459', 'jesen-175087', 'chytre-1702503', 'discgolf-21', 'single-5.20'],
              'runId': os.environ.get('GITHUB_RUN_ID', ''),
          }
          open('reports/playgrounds-live-status.json', 'w', encoding='utf-8').write(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
            git config user.name 'Naše Kadaň – veřejná kontrola'
            git config user.email 'info@nasekadan.cz'
            git add reports/playgrounds-live-status.json
            if git diff --cached --quiet; then success=1; break; fi
            git commit -m 'Potvrdit veřejné nasazení článku o hřištích [skip ci]'
            if git push origin HEAD:main; then success=1; break; fi
            sleep $((attempt * 3))
          done
          test "$success" = 1
