name: Opravit deployment-health kontrakt 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-deployment-health-contract-20260807.yml'

permissions:
  contents: write

concurrency:
  group: repair-deployment-health-contract-20260807
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit jediný kontrakt health souboru a jeho generátory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sync = Path('deploy/sync-production.sh')
          text = sync.read_text(encoding='utf-8')
          old1 = "cat > deployment-health.txt <<EOF\nsite=nasekadan.cz\nsource=$SOURCE_SHA\ngenerated=$(date -u +%FT%TZ)\nmode=canonical-ovh\nEOF"
          new1 = "cat > deployment-health.txt <<EOF\nsite=nasekadan.cz\nstatus=ok\nsource=$SOURCE_SHA\ngenerated=$(date -u +%FT%TZ)\nmode=canonical-ovh\nEOF"
          old2 = "printf 'site=nasekadan.cz\\nsource=%s\\ngenerated=%s\\nmode=canonical-ovh\\n' \\\n  \"$SOURCE_SHA\" \"$(date -u +%FT%TZ)\" | sudo tee \"$STAGE/deployment-health.txt\" >/dev/null"
          new2 = "printf 'site=nasekadan.cz\\nstatus=ok\\nsource=%s\\ngenerated=%s\\nmode=canonical-ovh\\n' \\\n  \"$SOURCE_SHA\" \"$(date -u +%FT%TZ)\" | sudo tee \"$STAGE/deployment-health.txt\" >/dev/null"
          if old1 not in text or old2 not in text:
              raise SystemExit('Bezpečná oprava zastavena: očekávané generátory deployment-health nebyly nalezeny přesně jednou.')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          sync.write_text(text, encoding='utf-8')

          health = Path('deployment-health.txt')
          h = health.read_text(encoding='utf-8')
          if 'status=ok' not in h:
              if not h.startswith('site=nasekadan.cz\n'):
                  raise SystemExit('Nečekaný formát deployment-health.txt')
              h = h.replace('site=nasekadan.cz\n', 'site=nasekadan.cz\nstatus=ok\n', 1)
              health.write_text(h, encoding='utf-8')

          rescue = Path('.github/workflows/rescue-mestska-policie-20260807-v2.yml')
          r = rescue.read_text(encoding='utf-8')
          old = "printf 'site=nasekadan.cz\\\\nsource=%s\\\\ngenerated=%s\\\\nmode=rescue-v2-mestska-policie-publication\\\\n'"
          new = "printf 'site=nasekadan.cz\\\\nstatus=ok\\\\nsource=%s\\\\ngenerated=%s\\\\nmode=rescue-v2-mestska-policie-publication\\\\n'"
          if old in r:
              rescue.write_text(r.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'status=ok' deployment-health.txt
          grep -Fq 'status=ok' deploy/sync-production.sh

          git config user.name 'Naše Kadaň – bezpečná oprava evidence'
          git config user.email 'info@nasekadan.cz'
          git rm .github/workflows/repair-deployment-health-contract-20260807.yml
          git add deployment-health.txt deploy/sync-production.sh .github/workflows/rescue-mestska-policie-20260807-v2.yml
          git commit -m 'Opravit deployment-health: obnovit povinný status=ok'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 5
            git pull --rebase origin main
            sleep $((attempt * 2))
          done

      - name: Nasadit opravený kanonický main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          source_sha="$(git rev-parse HEAD)"
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          tar --exclude=research --exclude=node_modules -czf "$RUNNER_TEMP/nasekadan-main.tgz" .
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$RUNNER_TEMP/nasekadan-main.tgz" ubuntu@57.129.43.215:/tmp/nasekadan-health-repair.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          work=/tmp/nasekadan-health-repair
          rm -rf "$work"
          mkdir -p "$work"
          tar -xzf /tmp/nasekadan-health-repair.tgz -C "$work"
          chmod +x "$work/deploy/sync-production.sh"
          sudo env GITHUB_WORKSPACE="$work" NASEKADAN_SKIP_AUTOMATION_INSTALL=1 bash "$work/deploy/sync-production.sh"
          rm -rf "$work" /tmp/nasekadan-health-repair.tgz
          REMOTE
          for attempt in $(seq 1 12); do
            q="health-repair-${GITHUB_RUN_ID}-$(date +%s%N)-$attempt"
            body="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/deployment-health.txt?v=$q" || true)"
            if grep -Fq 'status=ok' <<<"$body" && grep -Fq "source=$source_sha" <<<"$body"; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          exit 1
