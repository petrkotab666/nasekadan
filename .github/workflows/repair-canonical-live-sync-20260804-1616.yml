name: Opravit H1 registru a dokončit kanonickou synchronizaci

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: canonical-registry-h1-sync-20260804
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'petrkotab666' && github.event.issue.title == '[repair] canonical live sync 20260804-1616'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      BLOOD_URL: 'https://nasekadan.cz/clanky/nemocnice-kadan-kriticky-nedostatek-krve-0-rh-minus-2026.html'
      STADIUM_TITLE: 'Kadaň otevřela zimní stadion lidem před vedrem. Přijít lze denně od 8 do 18 hodin'
    steps:
      - name: Zapsat spuštění
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Oprava zastaralého H1 v kanonickém registru byla spuštěna. Run ${context.runId}.`
            });

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Srovnat registr s živým veřejným článkem
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonická evidence'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            BLOOD_URL="$BLOOD_URL" python3 - <<'PY'
          import html
          import json
          import os
          import re
          import ssl
          import subprocess
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = 'https://nasekadan.cz'
          target_url = os.environ['BLOOD_URL']
          source_path = Path('clanky/nemocnice-kadan-kriticky-nedostatek-krve-0-rh-minus-2026.html')
          source_text = source_path.read_text(encoding='utf-8')

          def normalize(value):
              return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', value))).strip()

          def extract(pattern, text, label):
              match = re.search(pattern, text, re.I | re.S)
              if not match:
                  raise SystemExit(f'Chybí {label}.')
              return normalize(match.group(1))

          source_h1 = extract(r'<h1[^>]*>(.*?)</h1>', source_text, 'zdrojové H1')
          source_title = extract(r'<title>(.*?)</title>', source_text, 'zdrojový title')
          source_title = re.sub(r'\s*\|\s*Naše Kadaň\s*$', '', source_title)
          modified_match = re.search(r'<meta[^>]+property=["\']article:modified_time["\'][^>]+content=["\']([^"\']+)', source_text, re.I)
          source_modified = modified_match.group(1) if modified_match else None

          request = urllib.request.Request(
              target_url + '?canonical-audit=' + str(int(time.time())),
              headers={'User-Agent': 'NaseKadanCanonicalAudit/1.0', 'Cache-Control': 'no-cache', 'Pragma': 'no-cache'},
          )
          with urllib.request.urlopen(request, timeout=40, context=ssl._create_unverified_context()) as response:
              live_text = response.read().decode('utf-8', errors='replace')
          live_h1 = extract(r'<h1[^>]*>(.*?)</h1>', live_text, 'živé H1')
          if live_h1 != source_h1:
              raise SystemExit(f'Veřejný web je zdrojem pravdy a neodpovídá mainu: live={live_h1!r}, source={source_h1!r}')

          registry_path = Path('data/published-content-index.json')
          data = json.loads(registry_path.read_text(encoding='utf-8'))
          articles = data.get('articles', [])
          if data.get('article_count') != len(articles) or len(articles) != 47:
              raise SystemExit('Registr nemá přesně 47 článků.')
          urls = [item['url'] for item in articles]
          fingerprints = [item['fingerprint'] for item in articles]
          if len(urls) != len(set(urls)) or len(fingerprints) != len(set(fingerprints)):
              raise SystemExit('Registr obsahuje duplicitní URL nebo fingerprint.')
          record = next((item for item in articles if item.get('url') == target_url), None)
          if record is None:
              raise SystemExit('Článek o krvi chybí v registru.')
          old_h1 = record.get('h1', '')
          old_title = record.get('title', '')
          record['h1'] = live_h1
          record['title'] = source_title
          if source_modified:
              record['modified_at'] = source_modified
          record['source_commit'] = subprocess.check_output(
              ['git', 'log', '-1', '--format=%H', '--', str(source_path)], text=True
          ).strip()
          record.setdefault('status', {}).update({
              'homepage': True,
              'archive': True,
              'rss': True,
              'sitemap': True,
              'news_sitemap': True,
          })

          replacements = {(old_h1, live_h1), (old_title, source_title)}
          changed_files = []
          for path in [Path('index.html'), Path('clanky/index.html'), Path('clanky/strana-2.html'), Path('clanky/strana-3.html'), Path('clanky/strana-4.html'), Path('rss.xml'), Path('news-sitemap.xml'), Path('llms.txt')]:
              text = path.read_text(encoding='utf-8')
              new_text = text
              for old, new in replacements:
                  if old and old != new:
                      new_text = new_text.replace(old, new)
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8', newline='\n')
                  changed_files.append(str(path))

          archive = '\n'.join(Path(path).read_text(encoding='utf-8') for path in ['clanky/index.html','clanky/strana-2.html','clanky/strana-3.html','clanky/strana-4.html'])
          rss = Path('rss.xml').read_text(encoding='utf-8')
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          news = Path('news-sitemap.xml').read_text(encoding='utf-8')
          ET.fromstring(rss)
          ET.fromstring(sitemap)
          ET.fromstring(news)
          missing_archive = [url for url in urls if url.replace(BASE, '') not in archive]
          missing_rss = [url for url in urls if url not in rss]
          missing_sitemap = [url for url in urls if url not in sitemap]
          if missing_archive or missing_rss or missing_sitemap:
              raise SystemExit(f'Nekompletní kanály: archiv={missing_archive}, rss={missing_rss}, sitemap={missing_sitemap}')
          if source_title not in archive or source_title not in rss:
              raise SystemExit('Aktuální titulek článku o krvi není v archivu nebo RSS.')
          if 'xmlns:image="http://www.google.com/schemas/sitemap-image/1.1"' not in news:
              raise SystemExit('News sitemap nemá image namespace.')

          now = datetime.now(timezone.utc).isoformat()
          validation = data.setdefault('validation', {})
          validation['repair_pending_public_verification'] = True
          validation['last_consistency_repair'] = {
              'classification': 'stale_registry_h1_after_published_article_update',
              'reason': 'Veřejný článek a main měly aktualizovaný H1, ale kanonický registr stále obsahoval původní titulek.',
              'updated_url': target_url,
              'old_h1': old_h1,
              'new_h1': live_h1,
              'source_commit': record['source_commit'],
              'changed_surfaces': changed_files,
              'method': 'verify-live-h1-update-registry-normalize-surfaces-deploy-and-full-public-audit',
              'status': 'pending',
              'started_at': now,
          }
          validation['rss_count'] = 47
          data['generated_at'] = now
          registry_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8').write(
              'new_h1=' + live_h1.replace('\n', ' ') + '\n' +
              'old_h1=' + old_h1.replace('\n', ' ') + '\n'
          )
          PY
            git add data/published-content-index.json index.html clanky/index.html clanky/strana-*.html rss.xml news-sitemap.xml llms.txt
            if ! git diff --cached --quiet; then
              git commit -m 'Evidence: srovnat H1 článku o kritickém nedostatku krve'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1
          git fetch origin main
          git reset --hard origin/main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "article_count=47" >> "$GITHUB_OUTPUT"

      - name: Nasadit celý kanonický publikační povrch
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/canonical-h1-sync"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social" "$bundle/data"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt "$bundle/"
          cp clanky/*.html "$bundle/clanky/"
          cp social/*.png "$bundle/social/"
          cp data/published-content-index.json "$bundle/data/"
          printf 'status=ok\nsource=%s\narticle_count=47\nrepair=registry-h1-sync\n' '${{ steps.prepare.outputs.source_sha }}' > "$bundle/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/canonical-h1-sync
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/canonical-h1-sync
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/clanky" "$root/social" "$root/data"
          sudo find "$root/clanky" -maxdepth 1 -type f -name 'strana-*.html' -delete
          for f in "$src"/clanky/*.html; do sudo install -m 0644 "$f" "$root/clanky/$(basename "$f")"; done
          for f in "$src"/social/*.png; do sudo install -m 0644 "$f" "$root/social/$(basename "$f")"; done
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo install -m 0644 "$src/$f" "$root/$f"; done
          sudo install -m 0644 "$src/data/published-content-index.json" "$root/data/published-content-index.json"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social /usr/share/nginx/html/data
            sudo docker exec nasekadan-web sh -c "find /usr/share/nginx/html/clanky -maxdepth 1 -type f -name 'strana-*.html' -delete"
            sudo docker cp "$src/clanky/." nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$src/social/." nasekadan-web:/usr/share/nginx/html/social/
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo docker cp "$src/$f" "nasekadan-web:/usr/share/nginx/html/$f"; done
            sudo docker cp "$src/data/published-content-index.json" nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
          fi
          rm -rf /tmp/canonical-h1-sync
          REMOTE

      - name: Veřejně ověřit 47 článků a všechny kanály
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          python3 - <<'PY'
          import concurrent.futures
          import html
          import json
          import re
          import ssl
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          BASE = 'https://nasekadan.cz'
          SOURCE = '${{ steps.prepare.outputs.source_sha }}'
          BLOOD_H1 = '${{ steps.prepare.outputs.new_h1 }}'
          ctx = ssl._create_unverified_context()

          def fetch(url, binary=False):
              last_error = None
              for attempt in range(1, 5):
                  separator = '&' if '?' in url else '?'
                  request = urllib.request.Request(
                      url + separator + f'v=${{ github.run_id }}-{int(time.time())}-{attempt}',
                      headers={'User-Agent': 'NaseKadanCanonicalAudit/1.0', 'Cache-Control': 'no-cache', 'Pragma': 'no-cache'},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=40, context=ctx) as response:
                          payload = response.read()
                          if response.status == 200:
                              return payload if binary else payload.decode('utf-8', errors='replace')
                  except Exception as exc:
                      last_error = exc
                  time.sleep(attempt * 3)
              raise RuntimeError(f'{url}: {last_error}')

          home = fetch(BASE + '/')
          archive_pages = [fetch(BASE + '/clanky/')]
          for page in range(2, 5):
              archive_pages.append(fetch(BASE + f'/clanky/strana-{page}.html'))
          archive = '\n'.join(archive_pages)
          rss = fetch(BASE + '/rss.xml')
          sitemap = fetch(BASE + '/sitemap.xml')
          news = fetch(BASE + '/news-sitemap.xml')
          registry = json.loads(fetch(BASE + '/data/published-content-index.json'))
          health = fetch(BASE + '/deployment-health.txt')
          weather = json.loads(fetch(BASE + '/api/pocasi-predpoved.json'))

          if '${{ env.STADIUM_TITLE }}' not in home or 'data-editorial-pin="stadium-cooling-20260805-1800"' not in home:
              raise RuntimeError('Titulka nemá aktuální připnutý článek.')
          if BLOOD_H1 not in home or BLOOD_H1 not in archive or BLOOD_H1 not in rss:
              raise RuntimeError('Aktuální H1 článku o krvi není ve všech veřejných přehledech.')
          if registry.get('article_count') != 47 or len(registry.get('articles', [])) != 47:
              raise RuntimeError('Veřejný registr nemá 47 článků.')
          urls = [item['url'] for item in registry['articles']]
          fingerprints = [item['fingerprint'] for item in registry['articles']]
          if len(urls) != len(set(urls)) or len(fingerprints) != len(set(fingerprints)):
              raise RuntimeError('Veřejný registr obsahuje duplicity.')
          missing_archive = [url for url in urls if url.replace(BASE, '') not in archive]
          missing_rss = [url for url in urls if url not in rss]
          missing_sitemap = [url for url in urls if url not in sitemap]
          if missing_archive or missing_rss or missing_sitemap:
              raise RuntimeError(f'Nekompletní živé kanály: archiv={missing_archive}, rss={missing_rss}, sitemap={missing_sitemap}')
          ET.fromstring(rss)
          ET.fromstring(sitemap)
          ET.fromstring(news)
          if 'xmlns:image="http://www.google.com/schemas/sitemap-image/1.1"' not in news:
              raise RuntimeError('News sitemap nemá image namespace.')
          if 'status=ok' not in health or f'source={SOURCE}' not in health or 'article_count=47' not in health:
              raise RuntimeError('deployment-health.txt neodpovídá nasazenému commitu.')
          if not isinstance(weather, dict):
              raise RuntimeError('Počasí není platný JSON objekt.')

          def normalize(value):
              return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', value))).strip()

          def check_h1(item):
              text = fetch(item['url'])
              match = re.search(r'<h1[^>]*>(.*?)</h1>', text, re.I | re.S)
              if not match:
                  return item['url'], 'chybí H1'
              live_h1 = normalize(match.group(1))
              if live_h1 != item['h1']:
                  return item['url'], f"{live_h1!r} != {item['h1']!r}"
              return None

          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(check_h1, registry['articles']):
                  if result:
                      failures.append(result)
          if failures:
              raise RuntimeError(f'Nesoulad veřejných H1: {failures[:5]}')
          social = fetch(BASE + '/social/klasterec-ochlazeni-zimni-stadion-kadan-2026-kadan-open-20260804.png', binary=True)
          if len(social) < 10000:
              raise RuntimeError('Sociální grafika je neúplná.')
          print(json.dumps({'status':'ok','articles':47,'all_h1':True,'updated_h1':BLOOD_H1}, ensure_ascii=False))
          PY

      - name: Potvrdit opravu v registru
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonická evidence'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            SOURCE_SHA='${{ steps.prepare.outputs.source_sha }}' python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('data/published-content-index.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc).isoformat()
          validation = data.setdefault('validation', {})
          repair = validation.setdefault('last_consistency_repair', {})
          repair.update({
              'classification': 'stale_registry_h1_after_published_article_update',
              'status': 'success',
              'source_commit': os.environ['SOURCE_SHA'],
              'completed_at': now,
              'public_verification': {
                  'homepage': True,
                  'archive_all_four_pages': True,
                  'rss_all_47_articles': True,
                  'sitemap_all_47_articles': True,
                  'news_sitemap_xml_well_formed': True,
                  'all_47_public_article_h1': True,
                  'registry_unique_and_complete': True,
                  'deployment_health': True,
                  'weather': True,
                  'social_graphic': True,
              },
          })
          validation['repair_pending_public_verification'] = False
          validation['public_audit_at'] = now
          validation['homepage_count'] = 14
          validation['archive_count'] = 47
          validation['rss_count'] = 47
          validation['deployment_health'] = 'verified'
          validation['deployment_health_source'] = os.environ['SOURCE_SHA']
          validation['canonical_duplicate_filter'] = True
          data['source_commit'] = os.environ['SOURCE_SHA']
          data['generated_at'] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            git add data/published-content-index.json
            if ! git diff --cached --quiet; then
              git commit -m 'Evidence: potvrdit opravu H1 kanonického registru'
            fi
            if git push origin HEAD:main; then
              pushed=1
              echo "evidence_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1

      - name: Nasadit finální evidenci
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          printf 'status=ok\nsource=%s\nevidence_commit=%s\narticle_count=47\nrepair=registry-h1-sync\n' '${{ steps.prepare.outputs.source_sha }}' '${{ steps.finalize.outputs.evidence_sha }}' > "$RUNNER_TEMP/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new data/published-content-index.json "$RUNNER_TEMP/deployment-health.txt" ubuntu@57.129.43.215:/tmp/
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0644 /tmp/published-content-index.json /var/www/nasekadan/data/published-content-index.json
          sudo install -m 0644 /tmp/deployment-health.txt /var/www/nasekadan/deployment-health.txt
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/published-content-index.json nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
            sudo docker cp /tmp/deployment-health.txt nasekadan-web:/usr/share/nginx/html/deployment-health.txt
          fi
          rm -f /tmp/published-content-index.json /tmp/deployment-health.txt
          REMOTE

      - name: Uzavřít opravu
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Kanonický registr byl srovnán s veřejným článkem. Zastaralé H1 „${{ steps.prepare.outputs.old_h1 }}“ bylo nahrazeno živým H1 „${{ steps.prepare.outputs.new_h1 }}“. Veřejně ověřeno 47 článků, čtyři strany archivu, úplné RSS a sitemap.xml, validní news-sitemap.xml, všechny H1, registr bez duplicit, deployment health, počasí a sociální grafika. Run ${context.runId}, obsahový commit ${{ steps.prepare.outputs.source_sha }}, evidenční commit ${{ steps.finalize.outputs.evidence_sha }}.`
            });
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});

      - name: Zapsat selhání
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Oprava H1 kanonického registru nebo veřejné ověření selhaly. Run ${context.runId}. Issue zůstává otevřené.`
            });
