name: Opravit živý kanonický povrch 20260804 1616

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: repair-canonical-live-sync-20260804-1616
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'petrkotab666' && github.event.issue.title == '[repair] canonical live sync 20260804-1616'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_TITLE: 'Kadaň otevřela zimní stadion lidem před vedrem. Přijít lze denně od 8 do 18 hodin'
      TARGET_REL: '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
      TARGET_SOCIAL: 'social/klasterec-ochlazeni-zimni-stadion-kadan-2026-kadan-open-20260804.png'
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Zapsat spuštění opravy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Oprava živého kanonického povrchu byla spuštěna. Run ${context.runId}.`
            });

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zapsat zjištěný nesoulad do registru
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonická evidence'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          registry_path = root / 'data/published-content-index.json'
          data = json.loads(registry_path.read_text(encoding='utf-8'))
          articles = data.get('articles', [])
          if data.get('article_count') != len(articles) or len(articles) < 47:
              raise SystemExit('Kanonický registr nemá očekávaný počet článků.')
          urls = [item.get('url') for item in articles]
          fingerprints = [item.get('fingerprint') for item in articles]
          if len(urls) != len(set(urls)) or len(fingerprints) != len(set(fingerprints)):
              raise SystemExit('Registr obsahuje duplicitní URL nebo fingerprint.')
          required = {'title','h1','url','published_at','modified_at','persons','organizations','places','cases','topics','fingerprint','status','source_commit'}
          for item in articles:
              missing = required - set(item)
              if missing:
                  raise SystemExit(f"Neúplný záznam {item.get('url')}: {sorted(missing)}")
          target = 'https://nasekadan.cz/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          record = next((item for item in articles if item.get('url') == target), None)
          if not record or record.get('h1') != 'Kadaň otevřela zimní stadion lidem před vedrem. Přijít lze denně od 8 do 18 hodin':
              raise SystemExit('Registr neobsahuje aktuální stav článku o zimním stadionu.')
          article_text = (root / record['source_path']).read_text(encoding='utf-8')
          if f"<h1>{record['h1']}</h1>" not in article_text:
              raise SystemExit('H1 článku v repozitáři neodpovídá registru.')
          validation = data.setdefault('validation', {})
          now = datetime.now(timezone.utc).isoformat()
          validation['repair_pending_public_verification'] = True
          validation['last_consistency_repair'] = {
              'classification': 'live_publication_surface_drift_from_canonical_main',
              'reason': 'Živá titulní stránka a archiv vracely zastaralý titulek článku o zimním stadionu a neodpovídaly aktuálnímu mainu ani kanonickému registru.',
              'affected_files': ['index.html','clanky/index.html','clanky/strana-2.html','clanky/strana-3.html','clanky/strana-4.html','rss.xml','sitemap.xml','news-sitemap.xml','data/published-content-index.json'],
              'method': 'deploy-current-canonical-main-surfaces-and-verify-all-public-articles',
              'status': 'pending',
              'started_at': now,
          }
          data['generated_at'] = now
          registry_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            git add data/published-content-index.json
            if ! git diff --cached --quiet; then
              git commit -m 'Evidence: zahájit opravu živého kanonického povrchu'
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1
          git fetch origin main
          git reset --hard origin/main
          source_sha="$(git rev-parse HEAD)"
          article_count="$(python3 -c "import json; d=json.load(open('data/published-content-index.json')); print(d['article_count'])")"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "article_count=$article_count" >> "$GITHUB_OUTPUT"

      - name: Nasadit aktuální kanonický obsah na OVH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/canonical-live-sync"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/social" "$bundle/data"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt "$bundle/"
          cp clanky/*.html "$bundle/clanky/"
          cp social/*.png "$bundle/social/"
          cp data/published-content-index.json "$bundle/data/"
          printf 'status=ok\nsource=%s\narticle_count=%s\nrepair=live-publication-surface-drift\n' '${{ steps.prepare.outputs.source_sha }}' '${{ steps.prepare.outputs.article_count }}' > "$bundle/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/canonical-live-sync
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/canonical-live-sync
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/clanky" "$root/social" "$root/data"
          sudo find "$root/clanky" -maxdepth 1 -type f -name 'strana-*.html' -delete
          for f in "$src"/clanky/*.html; do sudo install -m 0644 "$f" "$root/clanky/$(basename "$f")"; done
          for f in "$src"/social/*.png; do sudo install -m 0644 "$f" "$root/social/$(basename "$f")"; done
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo install -m 0644 "$src/$f" "$root/$f"; done
          sudo install -m 0644 "$src/data/published-content-index.json" "$root/data/published-content-index.json"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social /usr/share/nginx/html/data
            sudo docker exec nasekadan-web sh -c "find /usr/share/nginx/html/clanky -maxdepth 1 -type f -name 'strana-*.html' -delete"
            sudo docker cp "$src/clanky/." nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$src/social/." nasekadan-web:/usr/share/nginx/html/social/
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt deployment-health.txt; do sudo docker cp "$src/$f" "nasekadan-web:/usr/share/nginx/html/$f"; done
            sudo docker cp "$src/data/published-content-index.json" nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
          fi
          rm -rf /tmp/canonical-live-sync
          REMOTE

      - name: Veřejně ověřit celý publikační povrch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import html
          import json
          import re
          import ssl
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          BASE = 'https://nasekadan.cz'
          EXPECTED_SOURCE = '${{ steps.prepare.outputs.source_sha }}'
          EXPECTED_COUNT = int('${{ steps.prepare.outputs.article_count }}')
          TARGET_TITLE = 'Kadaň otevřela zimní stadion lidem před vedrem. Přijít lze denně od 8 do 18 hodin'
          ctx = ssl._create_unverified_context()
          stamp = f"${{ github.run_id }}-{int(time.time())}"

          def fetch(url, binary=False):
              sep = '&' if '?' in url else '?'
              req = urllib.request.Request(url + sep + 'v=' + stamp, headers={
                  'User-Agent': 'NaseKadanCanonicalAudit/1.0',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
              })
              with urllib.request.urlopen(req, timeout=40, context=ctx) as response:
                  data = response.read()
                  if response.status != 200:
                      raise RuntimeError(f'{url}: HTTP {response.status}')
                  return data if binary else data.decode('utf-8', errors='replace')

          home = fetch(BASE + '/')
          archive_pages = [fetch(BASE + '/clanky/')]
          for page in range(2, 5):
              archive_pages.append(fetch(BASE + f'/clanky/strana-{page}.html'))
          archive = '\n'.join(archive_pages)
          rss = fetch(BASE + '/rss.xml')
          sitemap = fetch(BASE + '/sitemap.xml')
          news = fetch(BASE + '/news-sitemap.xml')
          registry_text = fetch(BASE + '/data/published-content-index.json')
          health = fetch(BASE + '/deployment-health.txt')
          target_article = fetch(BASE + '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html')
          weather = json.loads(fetch(BASE + '/api/pocasi-predpoved.json'))
          registry = json.loads(registry_text)

          if TARGET_TITLE not in home or 'data-editorial-pin="stadium-cooling-20260805-1800"' not in home:
              raise RuntimeError('Živá titulka nemá aktualizovaný připnutý článek o zimním stadionu.')
          if TARGET_TITLE not in archive:
              raise RuntimeError('Živý archiv má zastaralý titulek článku o zimním stadionu.')
          if f'<h1>{TARGET_TITLE}</h1>' not in target_article:
              raise RuntimeError('Živý článek má nesprávné H1.')
          if 'nemocnice-kadan-kriticky-nedostatek-krve-0-rh-minus-2026.html' not in archive:
              raise RuntimeError('V živém archivu chybí článek o kritickém nedostatku krve.')
          if 'josef-suchy-klasterec-u18-kanada-hlinka-2026.html' not in archive:
              raise RuntimeError('V živém archivu chybí článek o Josefu Suchém.')
          if registry.get('article_count') != EXPECTED_COUNT or len(registry.get('articles', [])) != EXPECTED_COUNT:
              raise RuntimeError('Veřejný registr má nesprávný počet článků.')
          urls = [item['url'] for item in registry['articles']]
          fingerprints = [item['fingerprint'] for item in registry['articles']]
          if len(urls) != len(set(urls)) or len(fingerprints) != len(set(fingerprints)):
              raise RuntimeError('Veřejný registr obsahuje duplicity.')
          missing_archive = [url for url in urls if url.replace(BASE, '') not in archive]
          missing_rss = [url for url in urls if url not in rss]
          missing_sitemap = [url for url in urls if url not in sitemap]
          if missing_archive:
              raise RuntimeError(f'V archivu chybí {len(missing_archive)} URL.')
          if missing_rss:
              raise RuntimeError(f'V RSS chybí {len(missing_rss)} URL.')
          if missing_sitemap:
              raise RuntimeError(f'V sitemapě chybí {len(missing_sitemap)} URL.')
          ET.fromstring(rss)
          ET.fromstring(sitemap)
          ET.fromstring(news)
          if 'xmlns:image="http://www.google.com/schemas/sitemap-image/1.1"' not in news:
              raise RuntimeError('News sitemap nemá image namespace.')
          if 'status=ok' not in health or f'source={EXPECTED_SOURCE}' not in health or f'article_count={EXPECTED_COUNT}' not in health:
              raise RuntimeError('deployment-health.txt neodpovídá nasazenému commitu.')
          if not isinstance(weather, dict):
              raise RuntimeError('Počasí není platný JSON objekt.')

          def normalize(value):
              return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', value))).strip()

          def check_article(item):
              text = fetch(item['url'])
              match = re.search(r'<h1[^>]*>(.*?)</h1>', text, re.I | re.S)
              if not match:
                  return item['url'], 'chybí H1'
              live_h1 = normalize(match.group(1))
              if live_h1 != item['h1']:
                  return item['url'], f"H1: {live_h1!r} != {item['h1']!r}"
              return None

          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as executor:
              for result in executor.map(check_article, registry['articles']):
                  if result:
                      failures.append(result)
          if failures:
              raise RuntimeError(f'Nesoulad H1 u veřejných článků: {failures[:5]}')

          social = fetch(BASE + '/social/klasterec-ochlazeni-zimni-stadion-kadan-2026-kadan-open-20260804.png', binary=True)
          if len(social) < 10000:
              raise RuntimeError('Sociální grafika je neúplná.')
          print(json.dumps({
              'status': 'ok',
              'article_count': EXPECTED_COUNT,
              'archive_pages': len(archive_pages),
              'all_h1_verified': True,
              'source': EXPECTED_SOURCE,
          }, ensure_ascii=False))
          PY

      - name: Potvrdit opravu v kanonickém registru
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonická evidence'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            SOURCE_SHA='${{ steps.prepare.outputs.source_sha }}' python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('data/published-content-index.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc).isoformat()
          validation = data.setdefault('validation', {})
          repair = validation.setdefault('last_consistency_repair', {})
          repair.update({
              'classification': 'live_publication_surface_drift_from_canonical_main',
              'reason': 'Živá titulní stránka a archiv vracely zastaralý stav oproti aktuálnímu mainu a kanonickému registru.',
              'method': 'deploy-current-canonical-main-surfaces-and-verify-all-public-articles',
              'status': 'success',
              'source_commit': os.environ['SOURCE_SHA'],
              'completed_at': now,
              'public_verification': {
                  'homepage': True,
                  'archive_all_pages': True,
                  'all_public_article_h1': True,
                  'rss': True,
                  'sitemap': True,
                  'news_sitemap_xml_well_formed': True,
                  'registry': True,
                  'deployment_health': True,
                  'weather': True,
              },
          })
          validation['repair_pending_public_verification'] = False
          validation['public_audit_at'] = now
          validation['deployment_health'] = 'verified'
          validation['deployment_health_source'] = os.environ['SOURCE_SHA']
          validation['canonical_duplicate_filter'] = True
          data['source_commit'] = os.environ['SOURCE_SHA']
          data['generated_at'] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            git add data/published-content-index.json
            if ! git diff --cached --quiet; then
              git commit -m 'Evidence: potvrdit synchronizaci živého kanonického povrchu'
            fi
            if git push origin HEAD:main; then
              pushed=1
              echo "evidence_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1

      - name: Nasadit finální evidenci
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          printf 'status=ok\nsource=%s\nevidence_commit=%s\narticle_count=%s\nrepair=live-publication-surface-drift\n' '${{ steps.prepare.outputs.source_sha }}' '${{ steps.finalize.outputs.evidence_sha }}' '${{ steps.prepare.outputs.article_count }}' > "$RUNNER_TEMP/deployment-health.txt"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new data/published-content-index.json "$RUNNER_TEMP/deployment-health.txt" ubuntu@57.129.43.215:/tmp/
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0644 /tmp/published-content-index.json /var/www/nasekadan/data/published-content-index.json
          sudo install -m 0644 /tmp/deployment-health.txt /var/www/nasekadan/deployment-health.txt
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/published-content-index.json nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
            sudo docker cp /tmp/deployment-health.txt nasekadan-web:/usr/share/nginx/html/deployment-health.txt
          fi
          rm -f /tmp/published-content-index.json /tmp/deployment-health.txt
          REMOTE

      - name: Uzavřít opravu
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Významný nesoulad živého webu s kanonickým mainem byl bezpečně opraven a veřejně ověřen. Run ${context.runId}, obsahový commit ${{ steps.prepare.outputs.source_sha }}, evidenční commit ${{ steps.finalize.outputs.evidence_sha }}, článků: ${{ steps.prepare.outputs.article_count }}.`
            });
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});

      - name: Zapsat selhání
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Oprava nebo veřejné ověření selhaly. Run ${context.runId}. Issue zůstává otevřené.`
            });
