name: Doplnit fotografie z Facebooku do článku o koších

on:
  push:
    branches: [main]
    paths:
      - '.github/kos-facebook-images-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stáhnout fotografii a upravit článek
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          import html, re, urllib.request
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps

          article=Path('clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html')
          out=Path('images/clanky'); out.mkdir(parents=True,exist_ok=True)
          full=out/'kadan-pretekajici-kos-facebook.jpg'
          detail=out/'kadan-pretekajici-kos-detail.jpg'
          photo_id='10243275472011444'
          photo_url='https://www.facebook.com/photo?fbid=10243275472011444&set=gm.1557730802517994&idorvanity=442280287396390'
          post_url='https://www.facebook.com/groups/442280287396390/permalink/1557730802517994/'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=45) as r: return r.read(),r.headers.get('Content-Type','')

          data=None
          for url in [f'https://graph.facebook.com/{photo_id}/picture?type=large&redirect=true',f'https://graph.facebook.com/{photo_id}/picture?redirect=true']:
              try:
                  body,ctype=get(url)
                  if ctype.lower().startswith('image/') and len(body)>5000: data=body; break
              except Exception as e: print(url,e)
          if data is None:
              page,_=get(photo_url); page=page.decode('utf-8','ignore')
              m=re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',page,re.I) or re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',page,re.I)
              if not m: raise RuntimeError('Facebook neposkytl veřejný obrazový odkaz')
              data,ctype=get(html.unescape(m.group(1)).replace('\\/','/'))
              if not ctype.lower().startswith('image/') or len(data)<5000: raise RuntimeError('Stažený obsah není fotografie')

          with Image.open(BytesIO(data)) as src:
              im=ImageOps.exif_transpose(src).convert('RGB')
              if im.width<500: im=im.resize((900,round(im.height*900/im.width)),Image.Resampling.LANCZOS)
              im.thumbnail((1400,1800),Image.Resampling.LANCZOS)
              im.save(full,'JPEG',quality=88,optimize=True,progressive=True)
              ImageOps.fit(im,(1200,675),method=Image.Resampling.LANCZOS,centering=(.5,.78)).save(detail,'JPEG',quality=87,optimize=True,progressive=True)

          t=article.read_text(encoding='utf-8')
          if 'data-fb-photo-evidence="v1"' not in t:
              t=t.replace('2026-07-29T18:53:00+02:00','2026-07-29T19:58:00+02:00',2)
              css='''    .article-figure{margin:34px auto 40px;max-width:650px}.article-figure figcaption{margin-top:10px;font-size:14px;line-height:1.5;color:var(--muted)}\n    .article-photo{display:block;width:100%;height:auto;border-radius:20px;box-shadow:var(--shadow);background:#e7ecee}.article-photo-detail{aspect-ratio:16/9;object-fit:cover}\n    .fb-source-card{margin:30px 0 40px;border:1px solid #d8dee2;border-radius:18px;background:#fff;box-shadow:0 10px 28px #16242d12;overflow:hidden}.fb-source-head{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid #e4e8ea}.fb-source-avatar{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#a9232b;color:#fff;font-weight:800}.fb-source-head strong{display:block;font-size:17px}.fb-source-head span{display:block;color:var(--muted);font-size:13px;margin-top:2px}.fb-source-body{padding:20px}.fb-source-body p{font-size:16px;margin:0 0 13px}.fb-source-link{display:inline-block;margin-top:4px;font-weight:700}\n'''
              t=t.replace('    blockquote{margin:32px 0;padding:24px 28px;',css+'    blockquote{margin:32px 0;padding:24px 28px;',1)
              hero='  <div class="hero-visual"><strong><span class="hero-kicker">Spor o svoz a chování lidí</span>Přeplněné koše nejsou jen otázkou četnosti svozu. Debata ukazuje také na personální situaci technických služeb a nevhodné odkládání domovního či zahrádkářského odpadu.</strong></div>'
              fig=f'''\n\n  <figure class="article-figure" data-fb-photo-evidence="v1"><a href="{photo_url.replace('&','&amp;')}" target="_blank" rel="noopener noreferrer"><img class="article-photo" src="../images/clanky/{full.name}" alt="Přeplněný odpadkový koš a odpadky v trávě u zahrádkářské kolonie mezi Astrou a čerpací stanicí Shell" loading="eager" decoding="async"></a><figcaption>Přeplněný koš u zahrádkářské kolonie mezi Astrou a čerpací stanicí Shell. Zdroj: veřejný příspěvek Petry Pokorné ve skupině Kadaňské fórum.</figcaption></figure>'''
              if hero not in t: raise RuntimeError('Nenalezen hlavní obrazový blok')
              t=t.replace(hero,hero+fig,1)
              p='  <p>Fotografie odpadu rozházeného kolem malého pouličního koše se objevila ve facebookové skupině Kadaňské fórum. Autorka příspěvku Petra Pokorná uvedla, že kolem místa chodí přibližně tři týdny a během této doby podle své zkušenosti koš neviděla vyprázdněný.</p>'
              card=f'''\n\n  <div class="fb-source-card"><div class="fb-source-head"><span class="fb-source-avatar">PP</span><div><strong>Petra Pokorná</strong><span>Kadaňské fórum · veřejný příspěvek</span></div></div><div class="fb-source-body"><p>„Dnes zaměstnanci TS sekali trávu kolem zahrádkářské kolonie mezi Astrou a Shell, kde vede mimo jiné i cyklostezka navazující na budoucí novou trasu na Svaťáku.“</p><p>„Bohužel musím upozornit veřejně, že kolem odpadkového koše v tomto stavu chodím již tři týdny a vysypaný jsem ho během této doby ještě neviděla.“</p><a class="fb-source-link" href="{post_url}" target="_blank" rel="noopener noreferrer">Otevřít původní příspěvek na Facebooku</a></div></div>'''
              if p not in t: raise RuntimeError('Nenalezen úvodní odstavec')
              t=t.replace(p,p+card,1)
              p2='  <p>Na zveřejněném snímku je nádoba zaplněná až po okraj. Další plastové lahve, sáčky a obaly leží na trávě v jejím okolí. Fotografie dokládá stav v okamžiku pořízení, sama o sobě však neurčuje, kdy přesně proběhl poslední svoz.</p>'
              fig2=f'''\n\n  <figure class="article-figure"><a href="{photo_url.replace('&','&amp;')}" target="_blank" rel="noopener noreferrer"><img class="article-photo article-photo-detail" src="../images/clanky/{detail.name}" alt="Detail odpadků ležících v trávě kolem přeplněného koše" loading="lazy" decoding="async"></a><figcaption>Detail odpadu v okolí koše. Ze snímku nelze určit, kdo jej na místě odložil. Zdroj: Facebook / Kadaňské fórum.</figcaption></figure>'''
              if p2 not in t: raise RuntimeError('Nenalezen odstavec k detailu')
              t=t.replace(p2,p2+fig2,1)
              old='    <li>Veřejný příspěvek a diskuse ve facebookové skupině Kadaňské fórum, zveřejněné 29. července 2026; obrazový záznam má redakce k dispozici.</li>'
              new=f'    <li><a href="{post_url}" target="_blank" rel="noopener noreferrer">Veřejný příspěvek a diskuse ve facebookové skupině Kadaňské fórum, zveřejněné 29. července 2026</a>; obrazový záznam má redakce k dispozici.</li>'
              if old not in t: raise RuntimeError('Nenalezen zdroj Facebooku')
              article.write_text(t.replace(old,new,1),encoding='utf-8')

          for name in ['kadan-pretekajici-kos-facebook.svg','kos-facebook-01.svg','kos-facebook-02.svg','kos-facebook-03.svg','kos-facebook-01.b64']:
              p=out/name
              if p.exists(): p.unlink()
          PY
      - name: Uložit změny
        run: |
          set -euo pipefail
          grep -Fq 'data-fb-photo-evidence="v1"' clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html
          test -s images/clanky/kadan-pretekajici-kos-facebook.jpg
          test -s images/clanky/kadan-pretekajici-kos-detail.jpg
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Doplnit fotografie z Facebooku k článku o koších'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Nasadit článek a fotografie
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html \
            images/clanky/kadan-pretekajici-kos-facebook.jpg \
            images/clanky/kadan-pretekajici-kos-detail.jpg \
            ubuntu@57.129.43.215:/tmp/
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo cp /tmp/pretekajici-kose-kadan-technicke-sluzby-ridici.html /var/www/nasekadan/clanky/
          sudo cp /tmp/kadan-pretekajici-kos-facebook.jpg /tmp/kadan-pretekajici-kos-detail.jpg /var/www/nasekadan/images/clanky/
          sudo chmod 644 /var/www/nasekadan/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html /var/www/nasekadan/images/clanky/kadan-pretekajici-kos-*.jpg
          grep -Fq 'data-fb-photo-evidence="v1"' /var/www/nasekadan/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html
          REMOTE
      - name: Ověřit veřejný článek
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            body="$(curl -kfsS --max-time 20 "https://nasekadan.cz/clanky/pretekajici-kose-kadan-technicke-sluzby-ridici.html?fbfoto=${GITHUB_SHA}-${i}" || true)"
            if grep -Fq 'data-fb-photo-evidence="v1"' <<<"$body" \
              && curl -kfsS --max-time 20 -o /dev/null https://nasekadan.cz/images/clanky/kadan-pretekajici-kos-facebook.jpg; then
              exit 0
            fi
            sleep 10
          done
          exit 1
