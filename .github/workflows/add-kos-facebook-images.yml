name: Spustit ostré fotografie v článku o koších

on:
  push:
    branches: [main]
    paths:
      - '.github/kos-facebook-images-trigger.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-sharp-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Spustit hlavní obrazovou opravu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/fix-kos-images-sharp.yml/dispatches" \
            -f ref=main
