name: Nouzová hosted pojistka historie komunálních voleb Kadaň

on:
  schedule:
    - cron: '8 2 8 8 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-kadan-election-history-20260808-hosted-fallback
  cancel-in-progress: false

env:
  SLUG: komunalni-volby-kadan-historie-1990-2026
  ARTICLE_URL: https://nasekadan.cz/clanky/komunalni-volby-kadan-historie-1990-2026.html
  TITLE: '36 let komunálních voleb v Kadani: vítězové, čtyři starostové, kupování hlasů i boj o rok 2026'
  OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Povolit pouze 8. srpna 2026
        id: due
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == schedule && "$(date -u +%Y-%m-%d)" != "2026-08-08" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.due.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Ověřit, zda primární cesta už vše zveřejnila
        if: steps.due.outputs.run == 'true'
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          q="hosted-pre-${GITHUB_RUN_ID}-$(date +%s)"
          article="$(curl -4 -kfsS -L --max-time 30 "$ARTICLE_URL?v=$q" || true)"
          home="$(curl -4 -kfsS -L --max-time 30 "https://nasekadan.cz/?v=$q" || true)"
          rss="$(curl -4 -kfsS -L --max-time 30 "https://nasekadan.cz/rss.xml?v=$q" || true)"
          complete=0
          if grep -Fq "<h1>$TITLE</h1>" <<<"$article" \
            && grep -Fq 'Právní paradox roku 2010' <<<"$article" \
            && grep -Fq 'A co rok 2026? Kadaň jde do voleb po změně politické mapy' <<<"$article" \
            && grep -Fq "data-latest-article-href=\"/clanky/$SLUG.html\"" <<<"$home" \
            && [[ "$(grep -Fc "<link>$ARTICLE_URL</link>" <<<"$rss")" == 1 ]]; then
            complete=1
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Připravit zdroj jen pokud ještě není plný na main
        if: steps.due.outputs.run == 'true' && steps.precheck.outputs.complete != '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          git config user.name 'Naše Kadaň – hosted pojistka voleb'
          git config user.email 'info@nasekadan.cz'
          success=0
          for attempt in 1 2 3 4 5; do
            git fetch --prune origin main
            git reset --hard origin/main
            target="clanky/$SLUG.html"
            source_ready=0
            if [[ -f "$target" ]] \
              && grep -Fq "<h1>$TITLE</h1>" "$target" \
              && grep -Fq 'Právní paradox roku 2010' "$target" \
              && grep -Fq 'A co rok 2026? Kadaň jde do voleb po změně politické mapy' "$target"; then
              source_ready=1
            fi
            if [[ "$source_ready" == 0 ]]; then
              export ARTICLE_SOURCE_COMMIT="$(git rev-parse HEAD)"
              python3 scripts/publish_kadan_election_history_20260808_v2.py
              git diff --check
              git add "clanky/$SLUG.html" "social/$SLUG.png" \
                index.html clanky/index.html clanky/strana-*.html \
                rss.xml sitemap.xml news-sitemap.xml llms.txt \
                data/published-content-index.json data/article-integrity-manifest.json
              if ! git diff --cached --quiet; then
                git commit -m 'Publikovat 36 let komunálních voleb v Kadani'
                if ! git push origin HEAD:main; then
                  sleep $((attempt * 3))
                  continue
                fi
              fi
            fi
            success=1
            break
          done
          [[ "$success" == 1 ]]
          git fetch --prune origin main
          git reset --hard origin/main
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Připravit SSH klíč pro nouzový kanonický deploy
        if: steps.due.outputs.run == 'true' && steps.precheck.outputs.complete != '1'
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Na OVH spustit stejný kanonický deploy/sync-production.sh
        if: steps.due.outputs.run == 'true' && steps.precheck.outputs.complete != '1'
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25)
          ssh "${ssh_opts[@]}" ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          work=/tmp/nasekadan-election-hosted-fallback
          sudo rm -rf "$work"
          sudo git clone --depth 1 --branch main https://github.com/petrkotab666/nasekadan.git "$work"
          sudo env GITHUB_WORKSPACE="$work" NASEKADAN_SKIP_AUTOMATION_INSTALL=1 bash "$work/deploy/sync-production.sh"
          sudo rm -rf "$work"
          REMOTE

      - name: Veřejně potvrdit plný článek po nouzovém deployi
        if: steps.due.outputs.run == 'true' && steps.precheck.outputs.complete != '1'
        shell: bash
        run: |
          set -euo pipefail
          required=(
            '1990: první svobodné komunální volby' '1994: nastupuje ODS'
            '1998: jediná novodobá porážka ODS' '2002: návrat ODS a začátek Kulhánkovy éry'
            '2006: ODS prudce posiluje' '2010: téměř polovina hlasů — a největší volební aféra'
            'Právní paradox roku 2010' 'Krupka změnila právní pohled'
            'Trestní zákon tehdy na kupování hlasů nestačil' '2014: ODS drží Kadaň, podezření se vrací'
            '2018: vrchol dominance ODS' '2022: konec dvacetileté Kulhánkovy éry'
            'Čtyři starostové po revoluci' 'Co ukazuje více než třicet let voleb'
            'A co rok 2026? Kadaň jde do voleb po změně politické mapy'
          )
          success=0
          for attempt in $(seq 1 12); do
            q="hosted-${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            article="$(curl -4 -kfsS -L --max-time 40 "$ARTICLE_URL?v=$q" || true)"
            home="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/?v=$q" || true)"
            archive="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/clanky/?v=$q" || true)"
            rss="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/rss.xml?v=$q" || true)"
            sitemap="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/sitemap.xml?v=$q" || true)"
            news="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/news-sitemap.xml?v=$q" || true)"
            llms="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/llms.txt?v=$q" || true)"
            registry="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/data/published-content-index.json?v=$q" || true)"
            health="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/deployment-health.txt?v=$q" || true)"
            ok=1
            grep -Fq "<h1>$TITLE</h1>" <<<"$article" || ok=0
            grep -Fq '<meta name="robots" content="index,follow' <<<"$article" || ok=0
            grep -Fq "<link rel=\"canonical\" href=\"$ARTICLE_URL\">" <<<"$article" || ok=0
            grep -Fq "https://nasekadan.cz/social/$SLUG.png" <<<"$article" || ok=0
            for heading in "${required[@]}"; do grep -Fq "$heading" <<<"$article" || ok=0; done
            grep -Fq "data-latest-article-href=\"/clanky/$SLUG.html\"" <<<"$home" || ok=0
            grep -Fq "$SLUG.html" <<<"$archive" || ok=0
            [[ "$(grep -Fc "<link>$ARTICLE_URL</link>" <<<"$rss")" == 1 ]] || ok=0
            [[ "$(grep -Fc "<guid isPermaLink=\"true\">$ARTICLE_URL</guid>" <<<"$rss")" == 1 ]] || ok=0
            [[ "$(grep -Fc "<loc>$ARTICLE_URL</loc>" <<<"$sitemap")" == 1 ]] || ok=0
            [[ "$(grep -Fc "<loc>$ARTICLE_URL</loc>" <<<"$news")" == 1 ]] || ok=0
            grep -Fq "$SLUG.html" <<<"$llms" || ok=0
            grep -Fq "$SLUG.html" <<<"$registry" || ok=0
            grep -Eq '^source=[0-9a-f]{40}$' <<<"$health" || ok=0
            if [[ "$ok" == 1 ]]; then
              curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/social/$SLUG.png?v=$q" -o /tmp/elections-social.png
              python3 - <<'PY'
          from PIL import Image
          with Image.open('/tmp/elections-social.png') as im:
              assert im.format == 'PNG'
              assert im.size == (1200, 630)
          PY
              success=1; break
            fi
            sleep $((attempt * 4))
          done
          [[ "$success" == 1 ]]
          echo 'Nouzová hosted pojistka potvrdila plnou veřejnou publikaci.'

      - name: Primární cesta už byla kompletní
        if: steps.due.outputs.run == 'true' && steps.precheck.outputs.complete == '1'
        run: echo 'Nouzová hosted pojistka nic neměnila, protože veřejná publikace už byla kompletní.'
