name: Trvalé Facebook grafiky článků

on:
  push:
    branches: [main]
    paths:
      - 'clanky/*.html'
      - 'scripts/generate_social_cards.py'
      - '.github/workflows/persist-social-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-social-cards
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nainstalovat Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Vytvořit jedinečné 1200×630 grafiky a OG metadata
        run: |
          python scripts/generate_social_cards.py --write --check
          python - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for path in Path('clanky').glob('*.html'):
              text=path.read_text(encoding='utf-8', errors='replace')
              if 'NewsArticle' not in text or 'article-shell' not in text:
                  continue
              image=re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)', text, re.I)
              width=re.search(r'<meta[^>]+property=["\']og:image:width["\'][^>]+content=["\']1200["\']', text, re.I)
              height=re.search(r'<meta[^>]+property=["\']og:image:height["\'][^>]+content=["\']630["\']', text, re.I)
              title=re.search(r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)', text, re.I)
              if not image or '/social/' not in image.group(1) or image.group(1).endswith('/social-card.png') or not width or not height or not title:
                  bad.append(str(path))
          if bad:
              raise SystemExit('Články bez vlastní Facebook grafiky: ' + ', '.join(bad))
          PY

      - name: Uložit grafiky a metadata přímo do main
        run: |
          if git diff --quiet -- clanky social; then
            echo 'Všechny články už mají vlastní Facebook grafiku.'
            exit 0
          fi
          git config user.name 'Naše Kadaň automat'
          git config user.email 'actions@users.noreply.github.com'
          git add clanky social
          git commit -m 'Doplnit vlastní Facebook grafiky s titulky článků'
          git pull --rebase origin main
          git push origin main
