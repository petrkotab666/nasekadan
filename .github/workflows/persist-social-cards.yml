name: Trvalé Facebook grafiky článků

on:
  push:
    branches: [main]
    paths:
      - 'clanky/*.html'
      - 'scripts/generate_social_cards.py'
      - 'scripts/harden_facebook_meta.py'
      - '.github/workflows/persist-social-cards.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nasekadan-social-cards
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nainstalovat Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Vytvořit jedinečné 1200×630 grafiky
        run: python scripts/generate_social_cards.py --write --check

      - name: Vynutit Facebook-safe metadata a nový cache klíč
        run: python scripts/harden_facebook_meta.py --write --check

      - name: Uložit grafiky a metadata přímo do main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- clanky social; then
            echo 'Všechny články už mají správná Facebook metadata.'
          else
            git config user.name 'Naše Kadaň automat'
            git config user.email 'actions@users.noreply.github.com'
            git add clanky social
            git commit -m 'Opravit Facebook náhledy článků [skip ci]'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              test "$attempt" -lt 5
              sleep $((attempt*2))
            done
          fi

      - name: Spustit kanonický produkční deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run canonical-production-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
