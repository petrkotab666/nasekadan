name: Prověřit živé bannery Pojistime.to
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-pojistime-live.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Načíst živé soubory
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/probe"
          q="${GITHUB_SHA}-$(date +%s)"
          curl -fsS --max-time 25 "https://nasekadan.cz/?probe=$q" -o "$RUNNER_TEMP/probe/home" || true
          curl -fsS --max-time 25 "https://nasekadan.cz/reklamy-oprava-obrazku.js?probe=$q" -o "$RUNNER_TEMP/probe/js" || true
          curl -fsS --max-time 25 "https://nasekadan.cz/assets/affiliate-site-travel-overlay.json?probe=$q" -o "$RUNNER_TEMP/probe/overlay" || true
          for n in wide-a wide-b square tower; do curl -fsS --max-time 25 "https://nasekadan.cz/assets/reklamy/pojistime-family-$n.svg?probe=$q" -o "$RUNNER_TEMP/probe/$n" || true; done
      - name: Zapsat diagnostiku
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),read=p=>{try{return fs.readFileSync(p,'utf8')}catch{return ''}},r=`${process.env.RUNNER_TEMP}/probe`,home=read(`${r}/home`),js=read(`${r}/js`),overlay=read(`${r}/overlay`);
            const report={checked_at_utc:new Date().toISOString(),homepage_bytes:Buffer.byteLength(home),script_bytes:Buffer.byteLength(js),overlay_bytes:Buffer.byteLength(overlay),homepage_v3:home.includes('20260730-pojistime-rotation-3'),homepage_v2:home.includes('20260730-pojistime-rotation-2'),homepage_v1:home.includes('20260730-pojistime-rotation-1'),js_wide_a:js.includes('pojistime-family-wide-a'),js_wide_b:js.includes('pojistime-family-wide-b'),js_square:js.includes('pojistime-family-square'),js_tower:js.includes('pojistime-family-tower'),js_lastminuteslevy:js.includes('lastminuteslevy-cz'),overlay_lastminuteslevy:overlay.includes('lastminuteslevy-cz'),assets:Object.fromEntries(['wide-a','wide-b','square','tower'].map(n=>[n,{bytes:Buffer.byteLength(read(`${r}/${n}`)),svg:read(`${r}/${n}`).includes('<svg')}]))};
            const path='pojistime-live-probe.json',content=Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64');let sha;
            try{const c=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(c.data))sha=c.data.sha}catch(e){if(e.status!==404)throw e}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:'Zapsat diagnostiku živých bannerů Pojistime.to',content,...(sha?{sha}:{})});
