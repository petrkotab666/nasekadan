name: Publikovat článek o koupališti a skluzavce Niagara

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publikovat ihned
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-koupaliste-kadan-2026-07-31
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit článek
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          target='2026-07-31T03:00:00Z'
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          force='${{ inputs.force || false }}'
          if [[ -f clanky/koupaliste-kadan-skluzavka-niagara.html ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$force" != 'true' && "$now" < "$target" ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi

          python3 scripts/update_koupaliste_research_20260729.py
          python3 scripts/patch_koupaliste_final_council.py
          cp .github/drafts/koupaliste-kadan-skluzavka-niagara.html clanky/koupaliste-kadan-skluzavka-niagara.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('clanky/koupaliste-kadan-skluzavka-niagara.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace('noindex,nofollow', 'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1')
          t = t.replace('../../', '../')
          t = t.replace('PŘIPRAVOVANÝ ČLÁNEK', '31. ČERVENCE 2026')
          t = re.sub(r'<div class="sidebox preview-note">.*?</div>', '', t, count=1, flags=re.S)
          published = '2026-07-31T05:00:00+02:00'
          if 'article:published_time' not in t:
              t = t.replace('</head>', f'<meta property="article:published_time" content="{published}"><meta property="article:modified_time" content="{published}">\n</head>', 1)
          t = re.sub(r'("datePublished"\s*:\s*")([^"]*)', r'\g<1>' + published, t)
          t = re.sub(r'("dateModified"\s*:\s*")([^"]*)', r'\g<1>' + published, t)
          p.write_text(t, encoding='utf-8', newline='\n')
          PY
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/finalize_launch.py
          python3 scripts/prepare_discovery.py
          python3 scripts/normalize_search_snippets.py
          python3 scripts/sort_articles_chronologically.py
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Uložit veřejnou verzi
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň automat'
          git config user.email 'info@nasekadan.cz'
          git add -A -- \
            clanky/koupaliste-kadan-skluzavka-niagara.html \
            .github/drafts/koupaliste-kadan-research-2026.html \
            .github/drafts/pozemky-koupaliste-kadan.html \
            .github/drafts/koupaliste-kadan-skluzavka-niagara.html \
            index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt social style.css
          git commit -m 'Publikovat: skluzavka Niagara a koupaliště Kadaň'
          git pull --rebase origin main
          git push origin main
