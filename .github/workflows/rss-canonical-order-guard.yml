name: Kanonické pořadí RSS – pouze audit

# Audit kontroluje shodu RSS s články. Nic necommitne a nic nenahrává na OVH.
"on":
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-rss-canonical-order-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit RSS proti skutečně publikovaným článkům
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from email.utils import parsedate_to_datetime

          def pub(path):
              text=path.read_text(encoding='utf-8', errors='replace')
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', text, re.I):
                  return None
              m=re.search(r'article:published_time[^>]+content=["\']([^"\']+)', text, re.I)
              if not m:
                  m=re.search(r'"datePublished"\s*:\s*"([^"]+)"', text)
              if not m: return None
              dt=datetime.fromisoformat(m.group(1).replace('Z','+00:00'))
              if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
              if dt.astimezone(timezone.utc) > datetime.now(timezone.utc): return None
              return dt

          expected=[]
          for path in Path('clanky').glob('*.html'):
              if path.name == 'index.html' or re.fullmatch(r'strana-\d+\.html', path.name): continue
              dt=pub(path)
              if dt: expected.append((dt, f'https://nasekadan.cz/clanky/{path.name}'))
          expected.sort(reverse=True)
          expected_urls=[u for _,u in expected]

          rss=Path('rss.xml').read_text(encoding='utf-8')
          items=re.findall(r'<item>.*?</item>', rss, re.S)
          actual=[]
          for item in items:
              m=re.search(r'<link>\s*(https://nasekadan\.cz/clanky/[^<\s?]+\.html)\s*</link>', item)
              if m: actual.append(m.group(1))

          assert len(actual) == len(set(actual)), 'RSS obsahuje duplicitní články.'
          assert set(actual) == set(expected_urls), f'RSS a články se liší: RSS={len(actual)}, články={len(expected_urls)}'
          assert actual == expected_urls, 'RSS není v kanonickém chronologickém pořadí.'
          print(f'OK: RSS přesně odpovídá {len(expected_urls)} publikovaným článkům; audit nic nemění.')
          PY

      - name: Ověřit stejný stav veřejně
        shell: bash
        run: |
          set -euo pipefail
          q="rss-audit-${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsSL --max-time 40 "https://nasekadan.cz/rss.xml?$q" -o /tmp/live-rss.xml
          python3 - <<'PY'
          from pathlib import Path
          src=Path('rss.xml').read_text(encoding='utf-8')
          live=Path('/tmp/live-rss.xml').read_text(encoding='utf-8')
          def links(text):
              import re
              return re.findall(r'<link>\s*(https://nasekadan\.cz/clanky/[^<\s?]+\.html)\s*</link>', text)
          assert links(src) == links(live), 'Živé RSS neodpovídá main.'
          print(f'OK: veřejné RSS odpovídá main ({len(links(src))} článků).')
          PY

      - name: Nahlásit rozdíl bez samoopravy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[incident] RSS se liší od kanonického main – audit only'
          body="RSS audit zjistil rozdíl. Workflow záměrně nic nemění ani nenasazuje. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
