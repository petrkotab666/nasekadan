name: Nouzově nasadit Naše Kadaň přes GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nasekadan-pages-production
  cancel-in-progress: true

env:
  CUSTOM_DOMAIN: nasekadan.cz

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stáhnout aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Připravit veřejný web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            --exclude 'nginx/' \
            --exclude 'Dockerfile' \
            --exclude 'docker-compose.yml' \
            --exclude 'deploy/' \
            --exclude 'emergency-deploy-trigger.txt'

          printf '%s\n' "$CUSTOM_DOMAIN" > _site/CNAME
          touch _site/.nojekyll
          cat > _site/deployment-health.txt <<EOF
          site=nasekadan.cz
          source=$GITHUB_SHA
          generated=$(date -u +%FT%TZ)
          mode=github-pages-emergency
          EOF

          test -s _site/index.html
          test -s _site/inzerce/index.html
          grep -Fq 'Inzerce' _site/navigation.js
          grep -Fq 'Inzerce a ceník' _site/navigation.js
          grep -Fq 'Politická inzerce pro komunální volby' _site/inzerce/index.html

      - name: Povolit GitHub Pages z workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-current.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true)

          if [ "$code" = 404 ]; then
            method=POST
          else
            method=PUT
          fi

          api=$(curl -sS -o /tmp/pages-enable.json -w '%{http_code}' -X "$method" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true)

          echo "Pages API: GET=$code, $method=$api"
          cat /tmp/pages-enable.json || true
          test "$api" -ge 200
          test "$api" -lt 300

      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrát aktuální web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Zveřejnit web
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Nastavit vlastní doménu
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-domain.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "{\"cname\":\"$CUSTOM_DOMAIN\",\"build_type\":\"workflow\"}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true)
          echo "Nastavení domény: HTTP $code"
          cat /tmp/pages-domain.json || true
          test "$code" -ge 200
          test "$code" -lt 300

      - name: Ověřit novou stránku a patičku
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 60); do
            suffix="$GITHUB_RUN_ID-$attempt-$(date +%s)"
            page=$(curl -fsSL --max-time 20 "https://$CUSTOM_DOMAIN/inzerce/?deploy=$suffix" 2>/dev/null || true)
            nav=$(curl -fsSL --max-time 20 "https://$CUSTOM_DOMAIN/navigation.js?deploy=$suffix" 2>/dev/null || true)
            if printf '%s' "$page" | grep -Fq 'Politická inzerce pro komunální volby' \
              && printf '%s' "$nav" | grep -Fq 'Inzerce a ceník'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'Stránka /inzerce/ i úplná patička jsou veřejně dostupné.'
