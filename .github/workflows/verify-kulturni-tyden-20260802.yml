name: Jednorázově ověřit kulturní přehled 3.–9. srpna

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/verify-kulturni-tyden-20260802.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ověřit živý článek a publikační plochy
        shell: bash
        run: |
          set -u
          slug='kam-v-kadani-a-okoli-3-9-srpna-2026'
          path="/clanky/${slug}.html"
          url="https://nasekadan.cz${path}"
          expected_h1='Kam v Kadani a okolí od 3. do 9. srpna: med, móda, dixieland, kino a koupání'
          for attempt in $(seq 1 30); do
            stamp="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            rm -f /tmp/nk-{article,home,archive,rss,sitemap,news,health,og}
            article=no; home=no; archive=no; rss=no; sitemap=no; news=no; health=no; metadata=no; jsonld=no; og=no
            curl -4 -kfsS --max-time 30 "${url}?verify=${stamp}" -o /tmp/nk-article && article=yes || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/?verify=${stamp}" -o /tmp/nk-home && home=yes || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/clanky/?verify=${stamp}" -o /tmp/nk-archive && archive=yes || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/rss.xml?verify=${stamp}" -o /tmp/nk-rss && rss=yes || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/sitemap.xml?verify=${stamp}" -o /tmp/nk-sitemap && sitemap=yes || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/news-sitemap.xml?verify=${stamp}" -o /tmp/nk-news && news=yes || true
            curl -4 -kfsS --max-time 30 "https://nasekadan.cz/deployment-health.txt?verify=${stamp}" -o /tmp/nk-health && health=yes || true

            if [[ "$article" == yes ]] \
              && grep -Fq "<h1>${expected_h1}</h1>" /tmp/nk-article \
              && grep -Fq '<link rel="canonical" href="https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-3-9-srpna-2026.html">' /tmp/nk-article \
              && grep -Fq 'property="og:image:width" content="1200"' /tmp/nk-article \
              && grep -Fq 'property="og:image:height" content="630"' /tmp/nk-article \
              && grep -Fq '"@type":"NewsArticle"' /tmp/nk-article; then
              metadata=yes; jsonld=yes
            fi

            og_url="$(sed -n 's/.*property="og:image" content="\([^"]*\)".*/\1/p' /tmp/nk-article 2>/dev/null | head -n1)"
            if [[ -n "$og_url" ]] && curl -4 -kfsS --max-time 30 "${og_url}?verify=${stamp}" -o /tmp/nk-og; then
              python3 - <<'PY' && og=yes || true
import struct
p='/tmp/nk-og'
with open(p,'rb') as f:
    sig=f.read(24)
assert sig[:8] == b'\x89PNG\r\n\x1a\n', sig[:8]
w,h=struct.unpack('>II',sig[16:24])
assert (w,h)==(1200,630),(w,h)
print('OG_DIMENSIONS=1200x630')
PY
            fi

            surfaces=yes
            for file in /tmp/nk-home /tmp/nk-archive /tmp/nk-rss /tmp/nk-sitemap /tmp/nk-news; do
              [[ -s "$file" ]] && grep -Fq "$path" "$file" || surfaces=no
            done
            main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
            source_sha="$(sed -n 's/^source=//p' /tmp/nk-health 2>/dev/null | head -n1)"
            source_match=no; [[ -n "$main_sha" && "$source_sha" == "$main_sha" ]] && source_match=yes
            echo "attempt=$attempt article=$article home=$home archive=$archive rss=$rss sitemap=$sitemap news=$news health=$health metadata=$metadata jsonld=$jsonld og=$og surfaces=$surfaces main=$main_sha source=$source_sha source_match=$source_match"
            if [[ "$article" == yes && "$home" == yes && "$archive" == yes && "$rss" == yes && "$sitemap" == yes && "$news" == yes && "$health" == yes && "$metadata" == yes && "$jsonld" == yes && "$og" == yes && "$surfaces" == yes && "$source_match" == yes ]]; then
              echo "KULTURNI_TYDEN_LIVE_OK url=${url} og=${og_url} source=${source_sha}"
              exit 0
            fi
            sleep 15
          done
          echo 'KULTURNI_TYDEN_LIVE_FAILED' >&2
          cat /tmp/nk-health >&2 2>/dev/null || true
          exit 1
