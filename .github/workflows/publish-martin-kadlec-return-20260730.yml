name: Nasadit článek Martina Kadlece

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-martin-kadlec-return-20260730.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_KEY: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Nasadit článek na OVH
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 index.html /var/www/nasekadan/index.html
          sudo install -m 0644 clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 clanky/martin-kadlec-navrat-hokej-kadan-2026.html /var/www/nasekadan/clanky/martin-kadlec-navrat-hokej-kadan-2026.html
          sudo install -m 0644 rss.xml sitemap.xml news-sitemap.xml /var/www/nasekadan/
          REMOTE

      - name: Ověřit veřejný článek
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 12); do
            page="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/martin-kadlec-navrat-hokej-kadan-2026.html?check=${GITHUB_SHA}-${n}" || true)"
            home="$(curl -fsS --max-time 20 "https://nasekadan.cz/?check=${GITHUB_SHA}-${n}" || true)"
            if grep -Fq 'Martin Kadlec po deseti letech' <<<"$page" && grep -Fq 'martin-kadlec-navrat-hokej-kadan-2026.html' <<<"$home"; then
              echo 'Článek je veřejný a viditelný na titulní stránce.'
              exit 0
            fi
            sleep 5
          done
          exit 1
