name: Okamžitě nasadit článek Martina Kadlece

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-martin-kadlec-return-20260730.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Přímé nasazení aktuálního main na OVH
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 index.html /var/www/nasekadan/index.html
          sudo install -m 0644 clanky/index.html /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 clanky/martin-kadlec-navrat-hokej-kadan-2026.html /var/www/nasekadan/clanky/martin-kadlec-navrat-hokej-kadan-2026.html
          sudo install -m 0644 rss.xml sitemap.xml news-sitemap.xml /var/www/nasekadan/
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=martin-kadlec-direct\n' \
            "$(git rev-parse HEAD)" "$(date -u +%FT%TZ)" \
            | sudo tee /var/www/nasekadan/deployment-health.txt >/dev/null
          sudo chmod -R a+rX /var/www/nasekadan
          REMOTE

      - name: Ověřit veřejný článek
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_SHA}"
          for n in $(seq 1 24); do
            page="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/clanky/martin-kadlec-navrat-hokej-kadan-2026.html?check=${stamp}-${n}" || true)"
            home="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/?check=${stamp}-${n}" || true)"
            if grep -Fq 'Martin Kadlec po deseti letech' <<<"$page" && grep -Fq 'martin-kadlec-navrat-hokej-kadan-2026.html' <<<"$home"; then
              echo 'Článek je veřejný a viditelný na titulní stránce.'
              exit 0
            fi
            sleep 5
          done
          exit 1
