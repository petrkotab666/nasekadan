name: Doplnit vlastní zjištění k Císařskému dni

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[draft] original Cisarsky den findings'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 scripts/add_original_cisarsky_den_findings_20260801.py
          f=.github/drafts/cisarsky-den-kadan-historie-2026.html
          grep -Fq 'data-original-findings="contracts-v1"' "$f"
          grep -Fq 'Nejméně 614 956 Kč' "$f"
          grep -Fq '864 595 Kč' "$f"
          grep -Fq '2,8krát vyšší' "$f"
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň'
          git config user.email 'info@nasekadan.cz'
          git add .github/drafts/cisarsky-den-kadan-historie-2026.html
          git commit -m 'Doplnit vlastní zjištění k Císařskému dni [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ job.status }}'==='success';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:ok?'✅ Vlastní rekonstrukce nákladů, programu a přerušených ročníků byla uložena do neveřejného článku.':'❌ Uložení vlastních zjištění selhalo.'});
            if(ok) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
