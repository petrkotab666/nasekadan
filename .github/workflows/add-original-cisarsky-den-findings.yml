name: Doplnit vlastní zjištění k Císařskému dni

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: original-cisarsky-den-findings
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'petrkotab666' && github.event.issue.title == '[draft] original Cisarsky den findings')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit původní redakční zjištění
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/add_original_cisarsky_den_findings_20260801.py
          python3 scripts/add_original_cisarsky_den_findings_20260801.py
          file='.github/drafts/cisarsky-den-kadan-historie-2026.html'
          grep -Fq 'data-original-findings="contracts-v1"' "$file"
          grep -Fq 'Nejméně 614 956 Kč' "$file"
          grep -Fq '864 595 Kč' "$file"
          grep -Fq '30. ročník po tříleté pauze' "$file"
          grep -Fq 'sedm párů posilových vlaků' "$file"
          grep -Fq '2,8krát vyšší' "$file"
          test "$(wc -c < "$file")" -gt 24000

      - name: Uložit neveřejný návrh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň'
          git config user.email 'info@nasekadan.cz'
          git add .github/drafts/cisarsky-den-kadan-historie-2026.html
          if ! git diff --cached --quiet; then
            git commit -m 'Doplnit vlastní zjištění k Císařskému dni [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Ověřit hlavní větev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          file='.github/drafts/cisarsky-den-kadan-historie-2026.html'
          grep -Fq 'data-original-findings="contracts-v1"' "$file"
          grep -Fq 'Nejméně 614 956 Kč' "$file"
          grep -Fq '864 595 Kč' "$file"

      - name: Zapsat výsledek do issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? '✅ Neveřejný článek byl doplněn o vlastní rekonstrukci přerušené tradice, částečného programu roku 2026, minimálních doložených nákladů let 2025 a 2026, posilových vlaků a vývoje opakované položky KZK od roku 2018. Nic nebylo veřejně publikováno.'
                : '❌ Doplnění vlastních zjištění se nepodařilo dokončit. Issue zůstává otevřené.'
            });
            if (ok) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
