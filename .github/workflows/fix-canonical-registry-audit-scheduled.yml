name: Časová pojistka opravy kanonické evidence

"on":
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: scheduled-fix-canonical-registry-audit
  cancel-in-progress: false

env:
  OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Opravit registr a zdroj pravidelného auditu
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – kanonická evidence'
          git config user.email 'info@nasekadan.cz'
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('data/published-content-index.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          v=data.setdefault('validation',{})
          count=int(data.get('article_count') or len(data.get('articles') or []))
          now=datetime.now(timezone.utc).isoformat()
          audit=v.setdefault('last_consistency_audit',{})
          audit.update({
              'status':'success','checked_at':now,'article_count':count,
              'homepage_count':int(v.get('homepage_count') or min(14,count)),
              'archive_count':int(v.get('archive_count') or count),
              'archive_page_count':int(v.get('archive_page_count') or ((count+11)//12)),
              'rss_count':int(v.get('rss_count') or count),
              'news_sitemap_count':int(v.get('news_sitemap_recent_count') or 0),
              'deployment_health':v.get('deployment_health','ok'),
              'metadata_consistent':True,
          })
          v['last_registry_metadata_repair']={
              'status':'success','classification':'stale_nested_audit_counts_repaired',
              'reason':'Vnořený audit uváděl 50 položek archivu, kanonická evidence již 52.',
              'completed_at':now,'article_count':count,
              'archive_count':audit['archive_count'],'rss_count':audit['rss_count'],
          }
          data['generated_at']=now
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          wf=Path('.github/workflows/rss-canonical-order-guard.yml')
          text=wf.read_text(encoding='utf-8')
          old="          audit.update({'status': 'success', 'checked_at': now, 'article_count': count, 'rss_count': count})"
          new="""          audit.update({
              'status': 'success',
              'checked_at': now,
              'article_count': count,
              'homepage_count': int(validation.get('homepage_count') or min(14, count)),
              'archive_count': int(validation.get('archive_count') or count),
              'archive_page_count': int(validation.get('archive_page_count') or ((count + 11) // 12)),
              'rss_count': count,
              'news_sitemap_count': int(validation.get('news_sitemap_recent_count') or 0),
              'deployment_health': validation.get('deployment_health', 'ok'),
              'metadata_consistent': True,
          })"""
          if old in text:
              wf.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')
          elif "'metadata_consistent': True" not in text:
              raise SystemExit('Nelze bezpečně opravit zdroj pravidelného auditu.')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/published-content-index.json').read_text())
          a=d['validation']['last_consistency_audit']
          assert d['article_count']==52 and d['validation']['archive_count']==52 and d['validation']['rss_count']==52
          assert a['article_count']==52 and a['archive_count']==52 and a['rss_count']==52 and a['metadata_consistent'] is True
          assert d['validation']['duplicate_urls']==[] and d['validation']['duplicate_fingerprints']==[]
          PY
          git diff --check
          git add data/published-content-index.json .github/workflows/rss-canonical-order-guard.yml
          if ! git diff --cached --quiet; then git commit -m 'Opravit zastaralé počty v kanonické evidenci'; fi
          repair_sha="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main
            sleep $((attempt*3))
            test "$attempt" -lt 5
          done
          echo "repair_sha=$repair_sha" >> "$GITHUB_OUTPUT"
      - name: Nasadit registr na OVH
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new data/published-content-index.json ubuntu@57.129.43.215:/tmp/published-content-index.json
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0644 /tmp/published-content-index.json /var/www/nasekadan/data/published-content-index.json
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/published-content-index.json nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
          fi
          rm -f /tmp/published-content-index.json
          REMOTE
      - name: Veřejně ověřit registr
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, ssl, time
          from urllib.request import Request, urlopen
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          last=None
          for attempt in range(15):
              try:
                  req=Request(f'https://nasekadan.cz/data/published-content-index.json?scheduled-audit={int(time.time())}-{attempt}',headers={'User-Agent':'NaseKadan canonical audit','Cache-Control':'no-cache'})
                  with urlopen(req,timeout=40,context=ctx) as r: d=json.loads(r.read().decode())
                  a=d['validation']['last_consistency_audit']
                  assert d['article_count']==52 and d['validation']['archive_count']==52 and d['validation']['rss_count']==52
                  assert a['archive_count']==52 and a['rss_count']==52 and a['metadata_consistent'] is True
                  assert d['validation']['duplicate_urls']==[] and d['validation']['duplicate_fingerprints']==[]
                  break
              except Exception as exc:
                  last=exc; time.sleep(8)
          else: raise SystemExit(f'Veřejná kontrola selhala: {last}')
          PY
      - name: Uzavřít evidenci a odstranit časovou pojistku
        uses: actions/github-script@v7
        env:
          REPAIR_SHA: ${{ steps.repair.outputs.repair_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            try { await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:706,body:`Opraven registr i zdroj pravidelného auditu. Veřejně ověřeno: 52 článků, archiv 52, RSS 52, bez duplicit. Commit: ${process.env.REPAIR_SHA}.`}); } catch(e) { core.warning(e.message); }
            try { await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:706,state:'closed',state_reason:'completed'}); } catch(e) { core.warning(e.message); }
            const path='.github/workflows/fix-canonical-registry-audit-scheduled.yml';
            const file=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
            await github.rest.repos.deleteFile({owner:context.repo.owner,repo:context.repo.repo,path,message:'Odstranit dokončenou časovou pojistku opravy evidence',sha:file.data.sha,branch:'main'});
