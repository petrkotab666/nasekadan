name: Ověřit veřejné reklamy Vaše uklízečka

on:
  push:
    branches: [main]
    paths:
      - verify-vaseuklizecka-ads-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ověřit a případně znovu nasadit
        shell: bash
        run: |
          set -uo pipefail
          check_public() {
            local stamp js wide tower health
            stamp="$(date +%s%N)"
            js="$(curl -fsS --max-time 20 "https://nasekadan.cz/reklamy.js?v=$stamp" 2>/dev/null || true)"
            wide="$(curl -sS -o /tmp/wide.webp -w '%{http_code}' --max-time 20 "https://nasekadan.cz/assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp?v=$stamp" 2>/dev/null || true)"
            tower="$(curl -sS -o /tmp/tower.webp -w '%{http_code}' --max-time 20 "https://nasekadan.cz/assets/reklamy/vaseuklizecka-cisteni-tower-300x600.webp?v=$stamp" 2>/dev/null || true)"
            health="$(curl -fsS --max-time 20 "https://nasekadan.cz/deployment-health.txt?v=$stamp" 2>/dev/null || true)"
            grep -Fq "id:'uklizecka-cisteni'" <<<"$js" \
              && grep -Fq "id:'uklizecka-cisteni-tower'" <<<"$js" \
              && grep -Fq 'https://www.vaseuklizecka.cz/sluzby/cisteni-kobercu-a-calouneni/' <<<"$js" \
              && [ "$wide" = 200 ] && [ "$tower" = 200 ] \
              && [ -s /tmp/wide.webp ] && [ -s /tmp/tower.webp ] \
              && grep -Fq 'source=' <<<"$health"
          }

          success=false
          for i in $(seq 1 6); do
            if check_public; then success=true; break; fi
            sleep 10
          done

          if [ "$success" != true ] && [ -n "${SSH_KEY:-}" ]; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
            chmod 600 "$RUNNER_TEMP/ovh_key"
            ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE' || true
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE
            for i in $(seq 1 12); do
              if check_public; then success=true; break; fi
              sleep 10
            done
          fi

          python3 - "$success" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          ok=sys.argv[1].lower()=='true'
          data={
            'status':'success' if ok else 'failed',
            'checked_at_utc':datetime.now(timezone.utc).isoformat(),
            'target_url':'https://www.vaseuklizecka.cz/sluzby/cisteni-kobercu-a-calouneni/',
            'wide_banner':'/assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp',
            'tower_banner':'/assets/reklamy/vaseuklizecka-cisteni-tower-300x600.webp',
            'reklamy_js_marker':'uklizecka-cisteni',
            'public_verification':ok,
          }
          Path('vaseuklizecka-ads-public-status.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          rm -f .github/workflows/verify-vaseuklizecka-ads-public.yml verify-vaseuklizecka-ads-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Zapsat veřejné ověření reklam Vaše uklízečka'
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main
            sleep 3
          done
          [ "$success" = true ]
