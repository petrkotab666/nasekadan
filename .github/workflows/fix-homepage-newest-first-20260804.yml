name: Opravit pořadí titulky po nové publikaci

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-homepage-newest-first-20260804.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-homepage-newest-first-20260804
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEWEST_REL: /clanky/komunalni-volby-kadan-kandidaty-lhuta-2026.html
      STADIUM_REL: /clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ukončit staré připnutí a obnovit chronologickou titulku
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/enforce_article_visibility.py')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r"HOMEPAGE_PIN_UNTIL = datetime\.fromisoformat\('[^']+'\)",
              "HOMEPAGE_PIN_UNTIL = datetime.fromisoformat('2026-08-04T18:00:00+02:00')",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Nepodařilo se najít časový limit starého připnutí.')
          marker = '# HOMEPAGE-PIN-EXPIRED-BY-NEW-PUBLICATION-20260804'
          if marker not in text:
              text = text.replace('# HOMEPAGE-PIN-STADIUM-20260804', '# HOMEPAGE-PIN-STADIUM-20260804\n' + marker, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python3 scripts/enforce_article_visibility.py
          grep -Fq "data-latest-article-href=\"$NEWEST_REL\"" index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          newest = '/clanky/komunalni-volby-kadan-kandidaty-lhuta-2026.html'
          stadium = '/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html'
          home = Path('index.html').read_text(encoding='utf-8')
          hero = re.search(r'<section class="wrap hero".*?</section>', home, re.S)
          if not hero or newest not in hero.group(0):
              raise SystemExit('Nový článek není v hlavním hero bloku.')
          if stadium in hero.group(0).split('<aside', 1)[0]:
              raise SystemExit('Článek o zimním stadionu zůstal hlavním článkem.')
          archive = Path('clanky/index.html').read_text(encoding='utf-8')
          first = re.search(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?</article>', archive, re.S)
          if not first or newest not in first.group(0):
              raise SystemExit('Nový článek není první v archivu.')
          PY
          git add scripts/enforce_article_visibility.py index.html sitemap.xml clanky/index.html clanky/strana-*.html
          if ! git diff --cached --quiet; then
            git commit -m 'Opravit: nejnovější článek vrátit na první místo titulky'
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Nasadit opravenou titulku a archiv na OVH
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/homepage-order-fix"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky"
          cp index.html sitemap.xml "$bundle/"
          cp clanky/index.html clanky/strana-*.html "$bundle/clanky/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/homepage-order-fix
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          src=/tmp/homepage-order-fix
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/clanky"
          sudo install -m 0644 "$src/index.html" "$root/index.html"
          sudo install -m 0644 "$src/sitemap.xml" "$root/sitemap.xml"
          sudo install -m 0644 "$src/clanky/index.html" "$root/clanky/index.html"
          for f in "$src"/clanky/strana-*.html; do sudo install -m 0644 "$f" "$root/clanky/$(basename "$f")"; done
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp "$src/index.html" nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp "$src/sitemap.xml" nasekadan-web:/usr/share/nginx/html/sitemap.xml
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky
            sudo docker cp "$src/clanky/index.html" nasekadan-web:/usr/share/nginx/html/clanky/index.html
            for f in "$src"/clanky/strana-*.html; do sudo docker cp "$f" "nasekadan-web:/usr/share/nginx/html/clanky/$(basename "$f")"; done
          fi
          rm -rf /tmp/homepage-order-fix
          REMOTE

      - name: Veřejně ověřit pořadí
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          q="${GITHUB_RUN_ID}-$(date +%s)"
          home="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/?v=$q")"
          archive="$(curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/clanky/?v=$q")"
          grep -Fq "data-latest-article-href=\"$NEWEST_REL\"" <<<"$home"
          python3 - "$NEWEST_REL" "$STADIUM_REL" <<'PY' <<<"$home"
          import re, sys
          newest, stadium = sys.argv[1], sys.argv[2]
          text = sys.stdin.read()
          hero = re.search(r'<section class="wrap hero".*?</section>', text, re.S)
          if not hero or newest not in hero.group(0):
              raise SystemExit(1)
          if stadium in hero.group(0).split('<aside', 1)[0]:
              raise SystemExit(1)
          PY
          python3 - "$NEWEST_REL" <<'PY' <<<"$archive"
          import re, sys
          newest = sys.argv[1]
          text = sys.stdin.read()
          first = re.search(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?</article>', text, re.S)
          if not first or newest not in first.group(0):
              raise SystemExit(1)
          PY
          curl -4 -kfsS -L --max-time 35 "https://nasekadan.cz/api/pocasi-predpoved.json?v=$q" | python3 -m json.tool >/dev/null
