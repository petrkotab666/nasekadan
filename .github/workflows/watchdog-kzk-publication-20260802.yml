name: Nezávislá pojistka publikace KZK

on:
  schedule:
    - cron: '30 2 2 8 *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watchdog-kzk-20260802
  cancel-in-progress: false

env:
  ARTICLE_URL: https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Povolit pouze 2. srpna 2026
        shell: bash
        run: |
          test "$(date -u +%Y-%m-%d)" = "2026-08-02" || exit 0

      - name: Nezávisle zkontrolovat živý web
        id: live_before
        shell: bash
        run: |
          set +e
          html="$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${ARTICLE_URL}?watchdog=${GITHUB_RUN_ID}" 2>/dev/null)"
          if grep -Fq 'Od Střelnice po klášter' <<<"$html" && grep -Fq 'id="konirna"' <<<"$html"; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Stáhnout hlavní větev
        if: steps.live_before.outputs.present != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Znovu sestavit publikaci
        if: steps.live_before.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 scripts/publish_kzk_20260802.py
          git config user.name 'Naše Kadaň – KZK watchdog'
          git config user.email 'info@nasekadan.cz'
          git add clanky/kulturni-zarizeni-kadan.html social/kulturni-zarizeni-kadan-20260802.png index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml
          git commit -m 'Obnovit chybějící publikaci KZK [skip ci]' || true
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            [[ "$attempt" == 5 ]] && exit 1
            sleep $((attempt * 5))
          done
          git fetch origin main
          git reset --hard origin/main

      - name: Připravit SSH klíč
        if: steps.live_before.outputs.present != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"; break; fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nouzově nasadit přímo na server
        if: steps.live_before.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/kzk-watchdog.tar.gz" \
            clanky/kulturni-zarizeni-kadan.html social/kulturni-zarizeni-kadan-20260802.png \
            index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml \
            site.js style.css footer.css mobile.css reklamy.js reklamy-sidebar.js reklamy-sidebar.css \
            reklamy-oprava-obrazku.js obsah-doplnky.js ad-spacing-guard.js analytics.js
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/kzk-watchdog.tar.gz" ubuntu@57.129.43.215:/tmp/kzk-watchdog.tar.gz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo tar -xzf /tmp/kzk-watchdog.tar.gz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/kzk-watchdog.tar.gz nasekadan-web:/tmp/kzk-watchdog.tar.gz
            sudo docker exec nasekadan-web tar -xzf /tmp/kzk-watchdog.tar.gz -C /usr/share/nginx/html
            sudo docker exec nasekadan-web rm -f /tmp/kzk-watchdog.tar.gz
          fi
          rm -f /tmp/kzk-watchdog.tar.gz
          REMOTE

      - name: Konečná živá kontrola
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            article="$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${ARTICLE_URL}?final=${GITHUB_RUN_ID}-${attempt}" || true)"
            home="$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://nasekadan.cz/?final=${GITHUB_RUN_ID}-${attempt}" || true)"
            if grep -Fq 'Od Střelnice po klášter' <<<"$article" && \
               grep -Fq 'id="konirna"' <<<"$article" && \
               grep -Fq 'data-promos data-context="sidebar"' <<<"$article" && \
               grep -Fq '/clanky/kulturni-zarizeni-kadan.html' <<<"$home"; then
              echo 'ok=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Zapsat výsledek pojistky
        if: always()
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.verify.outputs.ok }}
          WAS_PRESENT: ${{ steps.live_before.outputs.present }}
        with:
          script: |
            const issue_number = 507;
            const ok = process.env.OK === 'true';
            const body = ok
              ? (process.env.WAS_PRESENT === 'true'
                  ? '✅ Nezávislá pojistka ve 4:30 potvrdila, že článek KZK je veřejný a správně zařazený.'
                  : '✅ Nezávislá pojistka zjistila chybějící publikaci KZK, znovu ji sestavila, nasadila a veřejně ověřila.')
              : '🚨 Nezávislá pojistka publikace KZK neprošla. Je nutná okamžitá ruční kontrola.';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number, body});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number, state: 'closed', state_reason: 'completed'});
