name: Pojistka obsahu a skutečné produkce Naše Kadaň
run-name: Přímá kontrola veřejného webu, automatická oprava a záložní upozornění

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'clanky/**'
      - 'rss.xml'
      - 'sitemap.xml'
      - 'production-content-manifest.json'
      - 'deploy/**'
      - 'scripts/verify_public_release.py'
      - 'scripts/upsert_github_issue.py'
      - '.github/workflows/production-content-watchdog.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-production-watchdog
  cancel-in-progress: false

jobs:
  protect:
    runs-on: [self-hosted, ovh, lastminuteslevy]
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
      WATCHDOG_FINGERPRINT: production-watchdog-current-main
    steps:
      - name: Načíst nejnovější main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Zjistit očekávaný commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git reset --hard origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Přímá kontrola skutečně veřejného webu
        id: initial
        shell: bash
        run: |
          set +e
          python3 scripts/verify_public_release.py \
            --root . \
            --base https://nasekadan.cz \
            --expected-sha '${{ steps.source.outputs.sha }}' \
            --cache-key '${{ github.run_id }}-before' \
            2>&1 | tee /tmp/nasekadan-watchdog-before.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Kanonicky opravit produkci
        id: repair
        if: steps.initial.outputs.code != '0'
        shell: bash
        run: |
          set +e
          export NASEKADAN_SKIP_AUTOMATION_INSTALL=1
          bash deploy/sync-production.sh 2>&1 | tee /tmp/nasekadan-watchdog-repair.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Závěrečná veřejná kontrola po opravě
        id: final
        if: steps.initial.outputs.code != '0'
        shell: bash
        run: |
          set +e
          expected='${{ steps.repair.outputs.sha }}'
          [ -n "$expected" ] || expected='${{ steps.source.outputs.sha }}'
          code=1
          for attempt in $(seq 1 6); do
            python3 scripts/verify_public_release.py \
              --root . \
              --base https://nasekadan.cz \
              --expected-sha "$expected" \
              --cache-key '${{ github.run_id }}-after-'"$attempt" \
              2>&1 | tee /tmp/nasekadan-watchdog-after.log
            code=${PIPESTATUS[0]}
            [ "$code" -eq 0 ] && break
            sleep 10
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "sha=$expected" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Uzavřít staré upozornění po úspěchu
        if: steps.initial.outputs.code == '0' || steps.final.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/watchdog-recovered.md <<EOF
          Veřejný web byl přímo ověřen proti aktuálnímu main.

          - Očekávaný commit: \`${{ steps.final.outputs.sha || steps.source.outputs.sha }}\`
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Kontrola proběhla přes živé HTTPS URL s cache-busting parametrem; stav nevychází pouze z interního JSON.
          EOF
          python3 scripts/upsert_github_issue.py \
            --fingerprint "$WATCHDOG_FINGERPRINT" \
            --title '[MONITORING KADAŇ] Produkční watchdog Naše Kadaň [production-watchdog-current-main]' \
            --body-file /tmp/watchdog-recovered.md \
            --close \
            --comment-existing

      - name: Vytvořit záložní upozornění při trvajícím selhání
        if: steps.initial.outputs.code != '0' && steps.final.outputs.code != '0'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ steps.final.outputs.sha }}'
          [ -n "$expected" ] || expected='${{ steps.source.outputs.sha }}'
          {
            echo '## Produkční watchdog Naše Kadaň selhal'
            echo
            echo "Veřejný web ani po jednom kanonickém opravném pokusu neprošel přímou kontrolou."
            echo
            echo "- Očekávaný commit: \`$expected\`"
            echo "- Výsledek deploye: \`${{ steps.repair.outputs.code }}\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '### Kontrola před opravou'
            echo '```'
            tail -n 120 /tmp/nasekadan-watchdog-before.log 2>/dev/null || true
            echo '```'
            echo
            echo '### Opravný pokus'
            echo '```'
            tail -n 160 /tmp/nasekadan-watchdog-repair.log 2>/dev/null || true
            echo '```'
            echo
            echo '### Závěrečná veřejná kontrola'
            echo '```'
            tail -n 160 /tmp/nasekadan-watchdog-after.log 2>/dev/null || true
            echo '```'
          } > /tmp/watchdog-failed.md

          python3 scripts/upsert_github_issue.py \
            --fingerprint "$WATCHDOG_FINGERPRINT" \
            --title '[MONITORING KADAŇ] Produkční watchdog Naše Kadaň [production-watchdog-current-main]' \
            --body-file /tmp/watchdog-failed.md \
            --assignee petrkotab666 \
            --comment-existing

          exit 1
