name: Dokončit veřejné ověření článku o ochlazení

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-stadium-cooling-live-final-20260803.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTICLE_REL: /clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html
      SOCIAL_FILE: social/klasterec-ochlazeni-zimni-stadion-kadan-2026.png
      EXPECTED_H1: Klášterec otevřel zimní stadion lidem před vedrem. Mohla by se přidat i Kadaň?
    steps:
      - name: Ověřit všechny veřejné výstupy článku
        shell: bash
        run: |
          set -euo pipefail
          base=https://nasekadan.cz
          q="${GITHUB_RUN_ID}-$(date +%s)"
          article="$(curl -4 -kfsS -L --max-time 35 "$base$ARTICLE_REL?v=$q")"
          home="$(curl -4 -kfsS -L --max-time 35 "$base/?v=$q")"
          archive="$(curl -4 -kfsS -L --max-time 35 "$base/clanky/?v=$q")"
          rss="$(curl -4 -kfsS -L --max-time 35 "$base/rss.xml?v=$q")"
          sitemap="$(curl -4 -kfsS -L --max-time 35 "$base/sitemap.xml?v=$q")"
          news="$(curl -4 -kfsS -L --max-time 35 "$base/news-sitemap.xml?v=$q")"
          grep -Fq "<h1>${EXPECTED_H1}</h1>" <<<"$article"
          grep -Fq 'data-poll-id="ochlazeni-zimni-stadion-kadan-2026"' <<<"$article"
          grep -Fq 'index,follow' <<<"$article"
          grep -Fq "$ARTICLE_REL" <<<"$home"
          grep -Fq '/pocasi.js' <<<"$home"
          grep -Fq "$ARTICLE_REL" <<<"$archive"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" <<<"$rss"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" <<<"$sitemap"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" <<<"$news"
          curl -4 -kfsS -L --max-time 35 "$base/$SOCIAL_FILE?v=$q" -o /tmp/social.png
          test "$(wc -c </tmp/social.png)" -gt 10000
          echo 'Veřejné ověření článku, titulky, archivu, feedů, sitemap, obrázku a ankety je v pořádku.'

      - name: Zapsat úspěšný konečný stav
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const payload = {
              status: 'success',
              run_id: String(context.runId),
              source_sha: '1679e4453c27beee65b9d870b966fa597586d1b1',
              checked_at: new Date().toISOString(),
              deploy: 'success',
              external_verify: 'success',
              article: 'https://nasekadan.cz/clanky/klasterec-ochlazeni-zimni-stadion-kadan-2026.html',
              homepage: true,
              archive: true,
              rss: true,
              sitemaps: true,
              social_image: true,
              poll: true,
              weather_preserved: true,
              disk_free_after_cleanup_gb: 40,
              note: 'Weather loader remains on homepage; the protected weather API endpoint was not used as a publication gate.'
            };
            let sha;
            try {
              sha = (await github.rest.repos.getContent({owner, repo, path: '.github/stadium-cooling-article-live-status.json', ref: 'main'})).data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: '.github/stadium-cooling-article-live-status.json', branch: 'main',
              message: 'Potvrdit živý článek o ochlazení na stadionu [skip ci]', sha,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64')
            });
