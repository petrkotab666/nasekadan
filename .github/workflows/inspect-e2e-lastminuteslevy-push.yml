name: Zjistit stav push E2E LastMinuteSlevy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/inspect-e2e-lastminuteslevy-push-trigger.txt'
  workflow_dispatch:

permissions:
  actions: read
  issues: read
  pull-requests: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Načíst stav push workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lms-inspect-push
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/e2e-lastminuteslevy-live-push.yml/runs?branch=main&per_page=10" \
            -o /tmp/lms-inspect-push/runs.json
          python3 - <<'PY' >/tmp/lms-inspect-push/report.txt
          import json
          d=json.load(open('/tmp/lms-inspect-push/runs.json'))
          runs=d.get('workflow_runs',[])
          print('RUNS')
          for r in runs:
              print(f"id={r.get('id')} event={r.get('event')} status={r.get('status')} conclusion={r.get('conclusion')} created={r.get('created_at')} sha={r.get('head_sha')} url={r.get('html_url')}")
          print()
          if runs:
              print('LATEST_ID='+str(runs[0].get('id')))
          PY
          run_id=$(python3 -c 'import json;d=json.load(open("/tmp/lms-inspect-push/runs.json"));print((d.get("workflow_runs") or [{}])[0].get("id", ""))')
          if [ -n "$run_id" ]; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" -o /tmp/lms-inspect-push/jobs.json
            python3 - <<'PY' >>/tmp/lms-inspect-push/report.txt
          import json
          d=json.load(open('/tmp/lms-inspect-push/jobs.json'))
          print('JOBS')
          for j in d.get('jobs',[]):
              print(f"job={j.get('name')} id={j.get('id')} status={j.get('status')} conclusion={j.get('conclusion')}")
              for s in j.get('steps') or []: print(f"  {s.get('number')} {s.get('name')} status={s.get('status')} conclusion={s.get('conclusion')}")
          PY
          fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/16/comments?per_page=100" -o /tmp/lms-inspect-push/comments.json
          python3 - <<'PY' >>/tmp/lms-inspect-push/report.txt
          import json
          d=json.load(open('/tmp/lms-inspect-push/comments.json'))
          print('\nISSUE COMMENTS='+str(len(d)))
          for c in d[-3:]:
              print(c.get('body','')[-20000:])
          PY

      - name: Zapsat do PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');let r='';try{r=fs.readFileSync('/tmp/lms-inspect-push/report.txt','utf8')}catch{}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`# Stav push E2E LastMinuteSlevy\n\n\`\`\`text\n${r.slice(-60000)}\n\`\`\``});
