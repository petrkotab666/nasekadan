name: Ověřit živou letní rotaci reklam
run-name: Veřejná kontrola zájezdů, klimatizací a ventilátorů

on:
  push:
    branches: [main]
    paths:
      - 'reklamy-oprava-obrazku.js'
      - 'assets/affiliate-site-travel-overlay.json'
      - 'index.html'
      - 'clanky/*.html'
      - '.github/workflows/verify-summer-ad-rotation-live.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-live-summer-ad-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Počkat na veřejné nasazení
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/summer-ad-check
          success=false
          for attempt in $(seq 1 36); do
            homepage="$(curl -fsS --max-time 20 "https://nasekadan.cz/?summer-ad-check=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            article="$(curl -fsS --max-time 20 "https://nasekadan.cz/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html?summer-ad-check=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            script="$(curl -fsS --max-time 20 "https://nasekadan.cz/reklamy-oprava-obrazku.js?summer-ad-check=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            overlay="$(curl -fsS --max-time 20 "https://nasekadan.cz/assets/affiliate-site-travel-overlay.json?summer-ad-check=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"

            printf '%s' "$homepage" > /tmp/summer-ad-check/homepage.html
            printf '%s' "$article" > /tmp/summer-ad-check/article.html
            printf '%s' "$script" > /tmp/summer-ad-check/reklamy-oprava-obrazku.js
            printf '%s' "$overlay" > /tmp/summer-ad-check/overlay.json

            if grep -Fq 'reklamy-oprava-obrazku.js?v=20260730-summer-rotation-1' /tmp/summer-ad-check/homepage.html \
              && grep -Fq 'reklamy-oprava-obrazku.js?v=20260730-summer-rotation-1' /tmp/summer-ad-check/article.html \
              && grep -Fq 'lastminuteslevy-cz' /tmp/summer-ad-check/reklamy-oprava-obrazku.js \
              && grep -Fq 'apollostore-cz' /tmp/summer-ad-check/reklamy-oprava-obrazku.js \
              && grep -Fq 'installFeaturedSeasonalBanner' /tmp/summer-ad-check/reklamy-oprava-obrazku.js \
              && python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/summer-ad-check/overlay.json').read_text(encoding='utf-8'))
          ids={row.get('id') for row in data.get('partners', [])}
          required={'lastminuteslevy-cz','atis-cz','ceskekormidlo-cz','excursia-cz','apollostore-cz','concept-cz','proalergiky-cz'}
          raise SystemExit(0 if required <= ids else 1)
          PY
            then
              success=true
              break
            fi
            sleep 25
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          test "$success" = true

      - name: Zapsat výsledek veřejné kontroly
        if: always()
        uses: actions/github-script@v7
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          LIVE_SUCCESS: ${{ steps.live.outputs.success }}
        with:
          script: |
            const fs = require('fs');
            const read = path => { try { return fs.readFileSync(path, 'utf8'); } catch { return ''; } };
            const homepage = read('/tmp/summer-ad-check/homepage.html');
            const article = read('/tmp/summer-ad-check/article.html');
            const script = read('/tmp/summer-ad-check/reklamy-oprava-obrazku.js');
            let overlay = null;
            try { overlay = JSON.parse(read('/tmp/summer-ad-check/overlay.json')); } catch {}
            const report = {
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              status: process.env.LIVE_SUCCESS === 'true' ? 'success' : 'failed',
              workflow_outcome: process.env.LIVE_OUTCOME || null,
              homepage_uses_summer_version: homepage.includes('reklamy-oprava-obrazku.js?v=20260730-summer-rotation-1'),
              heat_article_uses_summer_version: article.includes('reklamy-oprava-obrazku.js?v=20260730-summer-rotation-1'),
              live_script_has_lastminute: script.includes('lastminuteslevy-cz'),
              live_script_has_cooling: script.includes('apollostore-cz') && script.includes('concept-cz') && script.includes('proalergiky-cz'),
              live_script_has_rotation: script.includes('installFeaturedSeasonalBanner'),
              live_partner_ids: Array.isArray(overlay?.partners) ? overlay.partners.map(row => row.id) : []
            };
            const path = 'summer-ad-rotation-live-status.json';
            const content = Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat živou kontrolu letní rotace: ${report.status}`,
              content,
              ...(sha ? {sha} : {})
            });

      - name: Vyhodnotit
        if: always()
        shell: bash
        env:
          LIVE_SUCCESS: ${{ steps.live.outputs.success }}
        run: test "$LIVE_SUCCESS" = true
