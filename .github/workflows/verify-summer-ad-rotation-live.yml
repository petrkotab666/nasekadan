name: Ověřit živou letní rotaci reklam
run-name: Veřejná kontrola zájezdů, klimatizací a ventilátorů

on:
  push:
    branches: [main]
    paths:
      - 'reklamy-oprava-obrazku.js'
      - 'horko-feed.js'
      - 'assets/affiliate-site-travel-overlay.json'
      - 'index.html'
      - 'clanky/*.html'
      - '.github/workflows/verify-summer-ad-rotation-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-live-summer-ad-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Počkat na veřejné nasazení
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/summer-ad-check
          success=false
          for attempt in $(seq 1 36); do
            homepage="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/?summer-ad-check=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            article="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html?summer-ad-check=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            script="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/reklamy-oprava-obrazku.js?summer-ad-check=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            heat="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/horko-feed.js?summer-ad-check=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            overlay="$(curl -4 -kfsS --max-time 20 "https://nasekadan.cz/assets/affiliate-site-travel-overlay.json?summer-ad-check=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"

            printf '%s' "$homepage" > /tmp/summer-ad-check/homepage.html
            printf '%s' "$article" > /tmp/summer-ad-check/article.html
            printf '%s' "$script" > /tmp/summer-ad-check/reklamy-oprava-obrazku.js
            printf '%s' "$heat" > /tmp/summer-ad-check/horko-feed.js
            printf '%s' "$overlay" > /tmp/summer-ad-check/overlay.json

            if grep -Fq 'reklamy-oprava-obrazku.js?v=20260730-pojistime-rotation-4' /tmp/summer-ad-check/homepage.html \
              && grep -Fq 'reklamy-oprava-obrazku.js?v=20260730-pojistime-rotation-4' /tmp/summer-ad-check/article.html \
              && grep -Fq 'horko-feed.js?v=20260730-heat-rotation-1' /tmp/summer-ad-check/article.html \
              && ! grep -Fq 'lastminuteslevy-cz' /tmp/summer-ad-check/reklamy-oprava-obrazku.js \
              && grep -Fq 'apollostore-cz' /tmp/summer-ad-check/reklamy-oprava-obrazku.js \
              && grep -Fq 'installFeaturedSeasonalBanner' /tmp/summer-ad-check/reklamy-oprava-obrazku.js \
              && grep -Fq 'horko-apollostore' /tmp/summer-ad-check/horko-feed.js \
              && grep -Fq 'rotatingItems' /tmp/summer-ad-check/horko-feed.js \
              && python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/summer-ad-check/overlay.json').read_text(encoding='utf-8'))
          ids={row.get('id') for row in data.get('partners', [])}
          required={'atis-cz','ceskekormidlo-cz','excursia-cz','apollostore-cz','concept-cz','proalergiky-cz'}
          raise SystemExit(0 if required <= ids and 'lastminuteslevy-cz' not in ids else 1)
          PY
            then
              success=true
              break
            fi
            sleep 25
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          test "$success" = true

      - name: Zapsat výsledek veřejné kontroly do souhrnu běhu
        if: always()
        shell: bash
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          LIVE_SUCCESS: ${{ steps.live.outputs.success }}
        run: |
          {
            echo '## Živá kontrola letní reklamní rotace'
            echo "- Výsledek: ${LIVE_SUCCESS:-false}"
            echo "- Krok kontroly: ${LIVE_OUTCOME:-unknown}"
            echo "- Trigger commit: $GITHUB_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vyhodnotit
        if: always()
        shell: bash
        env:
          LIVE_SUCCESS: ${{ steps.live.outputs.success }}
        run: test "$LIVE_SUCCESS" = true
