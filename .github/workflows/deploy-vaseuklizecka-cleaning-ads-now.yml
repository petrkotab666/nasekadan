name: Okamžitě nasadit reklamy Vaše uklízečka
run-name: Nasazení bannerů čištění koberců a čalounění

on:
  push:
    branches: [main]
    paths:
      - ads-deploy-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-vaseuklizecka-ads-install
  cancel-in-progress: false

jobs:
  install-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      WIDE_BLOB: 7cb71e58e9de0c6b43bb66a5666afb226e4f566b
      TOWER_BLOB: 9ec919c6188aa82ae5415362a1a3a994edfbeb7d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Přidat bannery do reklamního systému
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/reklamy
          download_blob() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$1" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$2"
            test -s "$2"
          }
          download_blob "$WIDE_BLOB" assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp
          download_blob "$TOWER_BLOB" assets/reklamy/vaseuklizecka-cisteni-tower-300x600.webp

          python3 - <<'PY'
          from pathlib import Path
          p=Path('reklamy.js')
          s=p.read_text(encoding='utf-8')
          anchor="  {id:'uklizecka',title:'Vaše uklízečka',text:'Úklid domácností, firem, kanceláří a bytových domů na Kadaňsku.',url:'https://vaseuklizecka.cz',tag:'Místní služba',contexts:['home','sidebar','local','general']},"
          item="  {id:'uklizecka-cisteni',title:'Čištění koberců, sedaček a čalounění',text:'Hloubkové čištění koberců, sedaček a čalounění na Kadaňsku. Objednávky: 603 206 308.',url:'https://www.vaseuklizecka.cz/sluzby/cisteni-kobercu-a-calouneni/',banner:'/assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp',wideBanner:'/assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp',tag:'Místní služba',contexts:['home','sidebar','local','general'],weight:4},"
          if "id:'uklizecka-cisteni'" not in s:
              if anchor not in s: raise SystemExit('Chybí kotva uklizecka')
              s=s.replace(anchor,anchor+'\n'+item,1)
          if "id:'uklizecka-cisteni-tower'" not in s:
              marker="];\n\nconst usedPromoIds"
              pos=s.find(marker)
              if pos<0: raise SystemExit('Chybí tower kotva')
              tower="""  ,{
              id:'uklizecka-cisteni-tower',
              title:'Čištění koberců, sedaček a čalounění',
              url:'https://www.vaseuklizecka.cz/sluzby/cisteni-kobercu-a-calouneni/',
              image:'/assets/reklamy/vaseuklizecka-cisteni-tower-300x600.webp',
              width:300,
              height:600,
              contexts:['general','home','local','health','sidebar'],
              weight:4
            }
          """
              s=s[:pos]+tower+s[pos:]
          old="""function pickPromos(context,count,offset){
            const exact=promoItems.filter(item=>item.contexts.includes(context));
            const fallback=promoItems.filter(item=>!exact.includes(item));
            const pool=[...exact,...fallback];"""
          new="""function pickPromos(context,count,offset){
            const expand=item=>Array.from({length:Math.max(1,Number(item.weight)||1)},()=>item);
            const exact=promoItems.filter(item=>item.contexts.includes(context)).flatMap(expand);
            const exactIds=new Set(exact.map(item=>item.id));
            const fallback=promoItems.filter(item=>!exactIds.has(item.id)).flatMap(expand);
            const pool=[...exact,...fallback];"""
          if old in s: s=s.replace(old,new,1)
          s=s.replace("function renderBannerCard(item){\n  const title=escapeHtml(item.title);\n  const banner=safeHttpUrl(item.banner);","function renderBannerCard(item){\n  const title=escapeHtml(item.title);\n  const banner=safeHttpUrl(item.wideBanner||item.banner);",1)
          old="""function pickTowerCreative(context,offset=0){
            const pool=[
              ...towerCreativeItems.filter(item=>item.contexts.includes(context)),
              ...towerCreativeItems.filter(item=>!item.contexts.includes(context))
            ];"""
          new="""function pickTowerCreative(context,offset=0){
            const expand=item=>Array.from({length:Math.max(1,Number(item.weight)||1)},()=>item);
            const exact=towerCreativeItems.filter(item=>item.contexts.includes(context)).flatMap(expand);
            const exactIds=new Set(exact.map(item=>item.id));
            const pool=[...exact,...towerCreativeItems.filter(item=>!exactIds.has(item.id)).flatMap(expand)];"""
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          grep -Fq "id:'uklizecka-cisteni'" reklamy.js
          grep -Fq "id:'uklizecka-cisteni-tower'" reklamy.js
          grep -Fq '603 206 308' reklamy.js
          rm -f .github/workflows/deploy-vaseuklizecka-cleaning-ads-now.yml ads-deploy-trigger.txt
          printf '%s\n' "$(date -u +%FT%TZ) — bannery čištění koberců a čalounění" > emergency-deploy-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Nasadit reklamy na čištění koberců a čalounění'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main
            sleep 3
          done

      - name: Kanonicky nasadit na OVH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE=/opt/nasekadan bash deploy/sync-production.sh
          REMOTE

      - name: Veřejně ověřit bannery a odkaz
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          for attempt in $(seq 1 18); do
            js="$(curl -fsS --max-time 20 "https://nasekadan.cz/reklamy.js?v=$stamp-$attempt" || true)"
            wide_code="$(curl -sS -o /tmp/wide.webp -w '%{http_code}' --max-time 20 "https://nasekadan.cz/assets/reklamy/vaseuklizecka-cisteni-wide-1200x400.webp?v=$stamp-$attempt" || true)"
            tower_code="$(curl -sS -o /tmp/tower.webp -w '%{http_code}' --max-time 20 "https://nasekadan.cz/assets/reklamy/vaseuklizecka-cisteni-tower-300x600.webp?v=$stamp-$attempt" || true)"
            if grep -Fq 'uklizecka-cisteni' <<<"$js" \
              && grep -Fq 'https://www.vaseuklizecka.cz/sluzby/cisteni-kobercu-a-calouneni/' <<<"$js" \
              && [ "$wide_code" = 200 ] && [ "$tower_code" = 200 ] \
              && [ -s /tmp/wide.webp ] && [ -s /tmp/tower.webp ]; then
              echo 'Reklamy jsou veřejně nasazené a cílový odkaz je správný.'
              exit 0
            fi
            sleep 10
          done
          echo 'Veřejné ověření reklam neprošlo v časovém limitu.' >&2
          exit 1
