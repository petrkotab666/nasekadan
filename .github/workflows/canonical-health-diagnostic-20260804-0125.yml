name: Diagnostika deployment-health 2026-08-04 01:25

on:
  push:
    paths:
      - '.github/workflows/canonical-health-diagnostic-20260804-0125.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Načíst živý deployment-health
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime, json, ssl, time, urllib.request
          from pathlib import Path
          p=Path('.github/canonical-published-index-status.json')
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          ctx=ssl._create_unverified_context()
          req=urllib.request.Request('https://nasekadan.cz/deployment-health.txt?diagnostic='+str(time.time_ns()),headers={'User-Agent':'NaseKadanCanonicalAudit/health-diagnostic','Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
          with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
              raw=r.read().decode('utf-8','replace')
              data['deployment_health_http_status']=getattr(r,'status',None)
              data['deployment_health_content_type']=r.headers.get('Content-Type','')
          data['deployment_health_raw']=raw
          data['deployment_health_diagnostic_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(repr(raw))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/canonical-published-index-status.json
          git commit -m 'Zapsat živý obsah deployment-health pro kanonický audit [skip ci]'
          git push origin HEAD:main
      - name: Odstranit jednorázovou diagnostiku
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f .github/workflows/canonical-health-diagnostic-20260804-0125.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/canonical-health-diagnostic-20260804-0125.yml
          git commit -m 'Odstranit dokončenou diagnostiku deployment-health [skip ci]'
          git push origin HEAD:main
