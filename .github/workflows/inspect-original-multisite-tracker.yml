name: Načíst přesný originální tracker společných statistik

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-original-multisite-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH
        shell: bash
        run: |
          set -Eeuo pipefail; umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do value="${!name:-}"; if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"; break; fi; done
          test -s "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"
      - name: Načíst tracker a zkusit jeho požadavek
        shell: bash
        run: |
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@57.129.43.215 'bash -s' > "$RUNNER_TEMP/out.txt" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          echo '--- TRACKER WITH HOST ---'
          curl -sS --max-time 8 -D /tmp/h -H 'Host: dobreklima.cz' http://127.0.0.1:3226/tracker.js -o /tmp/t || true
          cat /tmp/h; echo BODY; cat /tmp/t; echo
          echo '--- SOURCE RELEVANT STRINGS ---'
          sudo strings /usr/local/lib/multisite-stats/multisite_stats_v2.py | grep -Ei 'hit\.gif|tracker\.js|searchParams|Chybi domena|query|site=|host=' | head -n 120 || true
          echo '--- DIRECT TEST VARIANTS ---'
          for query in \
            'site=dobreklima.cz&path=%2Ftest&ref=' \
            'host=dobreklima.cz&path=%2Ftest&ref=' \
            'domain=dobreklima.cz&path=%2Ftest&ref=' \
            'd=dobreklima.cz&p=%2Ftest&r='; do
              code=$(curl -sS --max-time 8 -H 'Host: dobreklima.cz' -o /tmp/b -w '%{http_code}' "http://127.0.0.1:3226/hit.gif?$query" || true)
              echo "$query => $code / $(wc -c < /tmp/b) / $(head -c 100 /tmp/b)"
          done
          REMOTE
      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); let out=''; try{out=fs.readFileSync(`${process.env.RUNNER_TEMP}/out.txt`,'utf8')}catch{}
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:`[ORIGINAL MULTISITE TRACKER] ${new Date().toISOString()}`,body:'```text\n'+out.slice(-40000).replace(/```/g,'---')+'\n```'});
