name: Spustit opravu obrázků článku o koších

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-kos-sharp-now.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Spustit hlavní obrazovou opravu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/fix-kos-images-sharp.yml/dispatches" \
            -f ref=main
