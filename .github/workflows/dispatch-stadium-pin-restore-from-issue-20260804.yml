name: Spustit obnovu připnutí zimního stadionu přes issue

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == '[pin] Obnovit článek o zimním stadionu na titulce'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Spustit hlavní obnovovací workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run restore-stadium-pin-active-20260804-2000.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for attempt in $(seq 1 20); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow restore-stadium-pin-active-20260804-2000.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 3
          done
          if [[ -z "$run_id" ]]; then
            gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body 'Obnovovací workflow se nepodařilo dohledat.'
            exit 1
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Obnova připnutí byla spuštěna. GitHub Actions run: ${run_id}"
