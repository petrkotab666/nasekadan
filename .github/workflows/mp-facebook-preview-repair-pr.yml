name: PR oprava Facebook náhledu MP

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nasekadan-mp-facebook-preview-pr
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.title == '[RUN] MP Facebook preview repair'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARTICLE_PATH: clanky/mestska-policie-kadan-fakta-diskuse-2026.html
      IMAGE_PATH: social/mestska-policie-kadan-fakta-diskuse-2026-v2.png
      FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
      FACEBOOK_PAGE_KEY: ${{ vars.FACEBOOK_PAGE_KEY }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
      FACEBOOK_WAIT_TIMEOUT: '900'
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}

    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Nasadit přesný článek a obrázek
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          tar -czf - "$ARTICLE_PATH" "$IMAGE_PATH" | ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'sudo mkdir -p /var/www/nasekadan/clanky /var/www/nasekadan/social; sudo tar -xzf - -C /var/www/nasekadan; sudo chmod -R a+rX /var/www/nasekadan'
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 "ARTICLE_PATH='$ARTICLE_PATH' IMAGE_PATH='$IMAGE_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          [[ -n "$cid" ]] || cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"
          if [[ -n "$cid" ]]; then
            sudo docker exec "$cid" mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp "/var/www/nasekadan/$ARTICLE_PATH" "$cid:/usr/share/nginx/html/$ARTICLE_PATH"
            sudo docker cp "/var/www/nasekadan/$IMAGE_PATH" "$cid:/usr/share/nginx/html/$IMAGE_PATH"
          fi
          REMOTE

      - name: Ověřit živý soubor a obnovit Facebook Open Graph cache
        id: guard
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refresh_facebook_previews_on_change.py --article "$ARTICLE_PATH" --timeout 900

      - name: Uložit marker po potvrzeném rescrape
        if: steps.guard.outcome == 'success'
        id: save
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň Facebook preview PR service'
          git config user.email 'info@nasekadan.cz'
          git add -A -- .github/facebook-published .github/facebook-preview-refresh-status.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Potvrdit obnovený Facebook náhled MP [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$attempt" = 5 ]] && exit 1
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*2))
          done

      - name: Zapsat výsledek do PR
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          GUARD: ${{ steps.guard.outcome }}
          SAVE: ${{ steps.save.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            let detail={};
            try{detail=JSON.parse(fs.readFileSync('.github/facebook-preview-refresh-status.json','utf8'))}catch{}
            const ok=process.env.DEPLOY==='success' && process.env.GUARD==='success' && (process.env.SAVE==='success' || process.env.SAVE==='skipped');
            const body=[
              ok ? 'MP_FACEBOOK_PREVIEW_REPAIR_OK' : 'MP_FACEBOOK_PREVIEW_REPAIR_FAIL',
              `deploy=${process.env.DEPLOY||'unknown'}`,
              `guard=${process.env.GUARD||'unknown'}`,
              `save=${process.env.SAVE||'unknown'}`,
              '```json',JSON.stringify(detail,null,2).slice(0,5000),'```'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
            if(!ok) core.setFailed('Oprava FB náhledu MP nebyla potvrzena.');
