name: Nasadit skutečnou třetí fotografii Rafandy

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/rafanda-real-photo-v3-trigger.txt'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: rafanda-real-photo-skutecna-20260807
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARTICLE: clanky/eso-market-rafanda-kadan-24-7.html
      OUT: images/clanky/eso-market-rafanda/pravidla-platba-kamery-skutecna.webp
      PUBLIC_PATH: /images/clanky/eso-market-rafanda/pravidla-platba-kamery-skutecna.webp
      EXPECTED_SHA: 6c007e0b2663db97c2bd9478036cd52f696feb97770cc8f9cce67444973bb8a0
      EXPECTED_SIZE: '9846'
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 40

      - name: Ověřit skutečný WebP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT"
          actual="$(sha256sum "$OUT" | awk '{print $1}')"
          size="$(stat -c %s "$OUT")"
          echo "SOURCE_SHA=$actual SIZE=$size"
          test "$actual" = "$EXPECTED_SHA"
          test "$size" = "$EXPECTED_SIZE"
          file "$OUT" | grep -Fq 'Web/P image'

      - name: Přepnout článek na skutečnou fotografii
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('clanky/eso-market-rafanda-kadan-24-7.html')
          text = p.read_text(encoding='utf-8')
          new = '/images/clanky/eso-market-rafanda/pravidla-platba-kamery-skutecna.webp'
          import re
          text = re.sub(r'/images/clanky/eso-market-rafanda/pravidla-platba-kamery[^" ]*\.webp', new, text)
          assert new in text
          assert 'Samostatný panel uvádí způsob platby' in text
          p.write_text(text, encoding='utf-8')
          PY

      - name: Uložit HTML opravu do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nasekadan-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$ARTICLE"
          if ! git diff --cached --quiet; then
            git commit -m 'Přepnout Rafandu na skutečnou třetí fotografii'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Připravit publikační balík
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -Fq "$PUBLIC_PATH" "$ARTICLE"
          test "$(sha256sum "$OUT" | awk '{print $1}')" = "$EXPECTED_SHA"
          stage="$RUNNER_TEMP/rafanda-skutecna"
          rm -rf "$stage"
          mkdir -p "$stage/clanky" "$stage/images/clanky/eso-market-rafanda"
          cp "$ARTICLE" "$stage/clanky/"
          cp "$OUT" "$stage/images/clanky/eso-market-rafanda/"
          tar -C "$stage" -czf "$RUNNER_TEMP/rafanda-skutecna.tgz" .

      - name: Nasadit přímo na OVH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          opts=(-i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25)
          scp "${opts[@]}" "$RUNNER_TEMP/rafanda-skutecna.tgz" ubuntu@57.129.43.215:/tmp/nk-rafanda-skutecna.tgz
          ssh "${opts[@]}" ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/var/www/nasekadan
          work="$(mktemp -d /tmp/nk-rafanda-skutecna.XXXXXX)"
          trap 'rm -rf "$work" /tmp/nk-rafanda-skutecna.tgz' EXIT
          tar -xzf /tmp/nk-rafanda-skutecna.tgz -C "$work"
          sudo install -d -m 0755 "$root/clanky" "$root/images/clanky/eso-market-rafanda"
          sudo install -m 0644 "$work/clanky/eso-market-rafanda-kadan-24-7.html" "$root/clanky/eso-market-rafanda-kadan-24-7.html"
          sudo install -m 0644 "$work/images/clanky/eso-market-rafanda/pravidla-platba-kamery-skutecna.webp" "$root/images/clanky/eso-market-rafanda/pravidla-platba-kamery-skutecna.webp"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/images/clanky/eso-market-rafanda
            sudo tar -C "$work" -czf - clanky images | sudo docker exec -i nasekadan-web tar -xzf - -C /usr/share/nginx/html
          fi
          REMOTE

      - name: Ověřit živý HTML a přesný hash fotografie
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25)
          ssh "${opts[@]}" ubuntu@57.129.43.215 "EXPECTED_SHA='$EXPECTED_SHA' EXPECTED_SIZE='$EXPECTED_SIZE' PUBLIC_PATH='$PUBLIC_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          base='https://nasekadan.cz'
          q="$(date +%s%N)"
          article="$(curl -kfsS -L --max-time 30 --resolve nasekadan.cz:443:127.0.0.1 "$base/clanky/eso-market-rafanda-kadan-24-7.html?repair=$q")"
          grep -Fq "$PUBLIC_PATH" <<<"$article"
          tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
          curl -kfsS -L --max-time 30 --resolve nasekadan.cz:443:127.0.0.1 "$base$PUBLIC_PATH?repair=$q" -o "$tmp"
          actual="$(sha256sum "$tmp" | awk '{print $1}')"
          size="$(stat -c %s "$tmp")"
          echo "LIVE_SHA=$actual SIZE=$size"
          test "$actual" = "$EXPECTED_SHA"
          test "$size" = "$EXPECTED_SIZE"
          file "$tmp" | grep -Fq 'Web/P image'
          echo RAFANDA_REAL_PHOTO_LIVE_OK=1
          REMOTE

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `✅ Třetí fotografie Rafandy je na produkci. Soubor v main i živá kopie mají SHA-256 6c007e0b2663db97c2bd9478036cd52f696feb97770cc8f9cce67444973bb8a0. Run ${context.runId}.`
                : `❌ Nasazení skutečné třetí fotografie Rafandy selhalo. Run ${context.runId}.`
            });
