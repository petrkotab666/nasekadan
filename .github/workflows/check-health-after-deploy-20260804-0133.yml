name: Ověřit deployment-health po nasazení 2026-08-04 01:33

on:
  push:
    paths:
      - '.github/workflows/check-health-after-deploy-20260804-0133.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Počkat a načíst veřejný stav
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          python3 <<'PY'
          import datetime, json, ssl, time, urllib.request
          from pathlib import Path
          p=Path('.github/canonical-published-index-status.json')
          d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          ctx=ssl._create_unverified_context()
          req=urllib.request.Request('https://nasekadan.cz/deployment-health.txt?after_deploy='+str(time.time_ns()),headers={'User-Agent':'NaseKadanCanonicalAudit/post-deploy','Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
          with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
              raw=r.read().decode('utf-8','replace')
              d['post_deploy_health_http_status']=getattr(r,'status',None)
          d['post_deploy_health_raw']=raw
          d['post_deploy_health_checked_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(raw)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/canonical-published-index-status.json
          git commit -m 'Zapsat deployment-health po kanonickém nasazení [skip ci]'
          git push origin HEAD:main
      - name: Odstranit jednorázovou kontrolu
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f .github/workflows/check-health-after-deploy-20260804-0133.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/check-health-after-deploy-20260804-0133.yml
          git commit -m 'Odstranit dokončenou kontrolu deployment-health [skip ci]'
          git push origin HEAD:main
