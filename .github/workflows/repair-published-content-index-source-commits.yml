name: Jednorázově opravit zdrojové commity registru

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-published-content-index-source-commits.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-published-content-index-source-commits
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit zdrojový commit ke každému veřejnému článku
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          index_path = Path('data/published-content-index.json')
          data = json.loads(index_path.read_text(encoding='utf-8'))
          articles = data.get('articles')
          if not isinstance(articles, list) or not articles:
              raise SystemExit('Registr neobsahuje seznam článků.')

          seen_urls = set()
          seen_fingerprints = set()
          required = (
              'title', 'h1', 'url', 'published_at', 'modified_at',
              'persons', 'organizations', 'places', 'cases', 'topics',
              'fingerprint', 'status', 'source_path', 'publication_status'
          )

          for article in articles:
              missing = [key for key in required if key not in article]
              if missing:
                  raise SystemExit(f"Článek {article.get('url', '<bez URL>')} postrádá: {', '.join(missing)}")
              if article['publication_status'] != 'published':
                  raise SystemExit(f"V kanonickém registru je neveřejná položka: {article['url']}")
              if article['url'] in seen_urls:
                  raise SystemExit(f"Duplicitní URL: {article['url']}")
              if article['fingerprint'] in seen_fingerprints:
                  raise SystemExit(f"Duplicitní fingerprint: {article['fingerprint']}")
              seen_urls.add(article['url'])
              seen_fingerprints.add(article['fingerprint'])

              source_path = Path(article['source_path'])
              if not source_path.is_file():
                  raise SystemExit(f"Chybí zdrojový soubor: {source_path}")
              commit = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%H', '--', str(source_path)],
                  text=True,
              ).strip()
              if not commit:
                  raise SystemExit(f"Nelze zjistit zdrojový commit: {source_path}")
              article['source_commit'] = commit

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          data['schema_version'] = '1.1'
          data['generated_at'] = datetime.now(ZoneInfo('Europe/Prague')).isoformat(timespec='seconds')
          data['source_commit'] = head
          data['article_count'] = len(articles)
          validation = data.setdefault('validation', {})
          validation['required_fields_complete'] = True
          validation['duplicate_urls'] = []
          validation['duplicate_fingerprints'] = []
          validation['per_article_source_commits'] = True

          index_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Ověřit výsledek a odstranit jednorázový workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/published-content-index.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/published-content-index.json').read_text(encoding='utf-8'))
          assert data['article_count'] == len(data['articles'])
          assert all(a.get('source_commit') for a in data['articles'])
          assert len({a['url'] for a in data['articles']}) == len(data['articles'])
          assert len({a['fingerprint'] for a in data['articles']}) == len(data['articles'])
          PY
          rm -f .github/workflows/repair-published-content-index-source-commits.yml

      - name: Uložit bezpečnou opravu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň evidence automat'
          git config user.email 'info@nasekadan.cz'
          git add data/published-content-index.json .github/workflows/repair-published-content-index-source-commits.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Doplnit zdrojový commit ke každému publikovanému článku'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            [[ "$attempt" == 5 ]] && exit 1
            sleep $((attempt * 5))
          done
