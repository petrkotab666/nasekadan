name: Nasadit Naše Kadaň na OVH
run-name: Monotónní produkční obnova přes vlastní runner

on:
  push:
    branches: [main]
    paths:
      - '.github/water-selfhosted-trigger.txt'
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/manual-production-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nasekadan-canonical-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nainstalovat monotónní ochranu a obnovit celý veřejný web
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/install-automation.sh
          sudo bash deploy/install-automation.sh

      - name: Ověřit úplnou množinu publikovaných článků na serveru
        id: verify_set
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/nasekadan
          python3 scripts/verify_published_article_set.py \
            --source /opt/nasekadan --target /var/www/nasekadan
          test -s /var/www/nasekadan/published-articles-manifest.json
          sudo systemctl is-active --quiet nasekadan-refresh.timer
          sudo systemctl is-active --quiet nasekadan-content-regression.path

      - name: Ověřit aktuální články přes veřejný nginx
        id: verify_live
        shell: bash
        run: |
          set -euo pipefail
          q="monotonic-${GITHUB_RUN_ID}-$(date +%s)"
          base='https://nasekadan.cz'
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "$base/published-articles-manifest.json?$q" -o /tmp/manifest.json
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "$base/?$q" -o /tmp/home.html
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "$base/clanky/?$q" -o /tmp/archive.html
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "$base/rss.xml?$q" -o /tmp/rss.xml
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "$base/sitemap.xml?$q" -o /tmp/sitemap.xml
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "$base/news-sitemap.xml?$q" -o /tmp/news-sitemap.xml
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/manifest.json').read_text(encoding='utf-8'))
          required={
            'clanky/komunalni-volby-kadan-historie-1990-2026.html',
            'clanky/novy-hrbitov-kadan-architektonicka-studie-2026.html',
            'clanky/zzs-kadan-garaz-mycka-2026.html',
            'clanky/slavie-kadan-epp-plavci-120-tisic-2026.html',
            'clanky/od-hlubin-k-nebi-kadan.html',
            'clanky/mestska-policie-kadan-fakta-diskuse-2026.html',
            'clanky/gymnastika-kadan-treneri-prosinec-2026.html',
          }
          missing=required-set(p.get('articles', []))
          assert not missing, missing
          assert p.get('article_count',0) >= len(required)
          print('Veřejný manifest článků:',p['article_count'])
          PY
          grep -Fq "novy-hrbitov-kadan-architektonicka-studie-2026.html" /tmp/home.html
          for slug in \
            komunalni-volby-kadan-historie-1990-2026.html \
            novy-hrbitov-kadan-architektonicka-studie-2026.html \
            zzs-kadan-garaz-mycka-2026.html \
            slavie-kadan-epp-plavci-120-tisic-2026.html \
            od-hlubin-k-nebi-kadan.html \
            mestska-policie-kadan-fakta-diskuse-2026.html \
            gymnastika-kadan-treneri-prosinec-2026.html; do
            grep -Fq "$slug" /tmp/archive.html
            grep -Fq "$slug" /tmp/rss.xml
            grep -Fq "$slug" /tmp/sitemap.xml
            grep -Fq "$slug" /tmp/news-sitemap.xml
            curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "$base/clanky/$slug?$q" >/dev/null
          done

      - name: Ověřit Facebook náhled ZZS
        id: verify_social
        shell: bash
        run: |
          set -euo pipefail
          q="og-${GITHUB_RUN_ID}-$(date +%s)"
          base='https://nasekadan.cz'
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 \
            "$base/clanky/zzs-kadan-garaz-mycka-2026.html?$q" -o /tmp/zzs.html
          og=$(python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/zzs.html').read_text(encoding='utf-8')
          m=re.search(r'<meta\b[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)',text,re.I)
          assert m
          print(m.group(1))
          PY
          )
          case "$og" in https://nasekadan.cz/social/*) ;; *) echo "OG není lokální: $og" >&2; exit 1;; esac
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "$og?$q" -o /tmp/og-image
          file /tmp/og-image | grep -Eqi 'PNG image data|JPEG image data|Web/P image'

      - name: Zapsat doklad úspěšné monotónní obnovy
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .github/deploy-status
          status=".github/deploy-status/monotonic-production-${GITHUB_RUN_ID}.txt"
          printf 'status=success\nmode=monotonic-production\narticles=verified\nfacebook_og=verified\nsource=%s\nverified_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "$status"
          git config user.name 'Naše Kadaň produkční audit'
          git config user.email 'info@nasekadan.cz'
          git add "$status"
          git commit -m 'Potvrdit monotónní produkční obnovu [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Souhrn běhu
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SET_OUTCOME: ${{ steps.verify_set.outcome }}
          LIVE_OUTCOME: ${{ steps.verify_live.outcome }}
          SOCIAL_OUTCOME: ${{ steps.verify_social.outcome }}
        run: |
          {
            echo '## Monotónní produkční obnova Naše Kadaň'
            echo "- Obnova: ${DEPLOY_OUTCOME:-unknown}"
            echo "- Úplnost článků: ${SET_OUTCOME:-unknown}"
            echo "- Živý web: ${LIVE_OUTCOME:-unknown}"
            echo "- Facebook OG: ${SOCIAL_OUTCOME:-unknown}"
            echo "- Trigger commit: $GITHUB_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Uzavřít ruční trigger
        if: always() && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok='${{ job.status }}' === 'success';
            const body=ok
              ? '✅ Monotónní produkční obnova prošla. Úplná množina publikovaných článků i Facebook OG náhled jsou ověřené.'
              : '❌ Monotónní produkční obnova nebo její veřejná kontrola selhala.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
            if(ok) await github.rest.pulls.update({owner:context.repo.owner,repo:context.repo.repo,pull_number:context.issue.number,state:'closed'});