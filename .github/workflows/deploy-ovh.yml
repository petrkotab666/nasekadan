name: Nasadit Naše Kadaň na OVH
run-name: Produkční nasazení aktuální větve main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/deploy-production-pr-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

# Všechny cesty do produkce používají stejný zámek. Starší čekající běh se
# zruší a každý spuštěný běh si před nasazením znovu stáhne aktuální main.
concurrency:
  group: nasekadan-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit jedinou kanonickou verzi webu
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/sync-production.sh
          bash deploy/sync-production.sh

      - name: Obnovit soukromé statistiky
        continue-on-error: true
        shell: bash
        run: sudo bash .github/scripts/nasekadan-stats/install-stats.sh
