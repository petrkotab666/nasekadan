name: Nasadit Naše Kadaň na OVH
run-name: Ruční záložní produkční nasazení

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Spustit ruční záložní deploy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash deploy/sync-production.sh
