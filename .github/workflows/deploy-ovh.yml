name: Nasadit Naše Kadaň na OVH
run-name: Okamžité produkční nasazení přes vlastní runner

on:
  push:
    branches: [main]
    paths:
      - '.github/water-selfhosted-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Spustit kanonický produkční deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/sync-production.sh
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash deploy/sync-production.sh

      - name: Ověřit článek o zákazu odběru vody
        id: verify_water
        shell: bash
        run: |
          set -euo pipefail
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 \
            'https://nasekadan.cz/clanky/zakaz-odberu-povrchovych-vod-kadansko-cervenec-2026.html?selfhosted=1' \
            | grep -Fq 'Kvůli suchu platí na Kadaňsku zákaz odběru vody'
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 \
            'https://nasekadan.cz/?selfhosted=1' \
            | grep -Fq 'zakaz-odberu-povrchovych-vod-kadansko-cervenec-2026.html'
          curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 \
            'https://nasekadan.cz/clanky/?selfhosted=1' \
            | grep -Fq 'zakaz-odberu-povrchovych-vod-kadansko-cervenec-2026.html'

      - name: Zapsat stav vlastního nasazení
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          WATER_OUTCOME: ${{ steps.verify_water.outcome }}
        with:
          script: |
            const path = '.github/water-selfhosted-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' && process.env.WATER_OUTCOME === 'success' ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              deploy: process.env.DEPLOY_OUTCOME || 'unknown',
              water_public_verify: process.env.WATER_OUTCOME || 'unknown'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat stav vlastního nasazení vody: ${status.status}`,
              content,
              ...(sha ? {sha} : {})
            });
