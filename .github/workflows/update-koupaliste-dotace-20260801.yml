name: Aktualizovat neveřejné drafty koupaliště

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/update_koupaliste_dotace_20260801.py'
      - '.github/workflows/update-koupaliste-dotace-20260801.yml'

permissions:
  contents: write

jobs:
  update-drafts:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Doplnit ověřený primární doklad
        run: |
          set -euo pipefail
          python3 scripts/update_koupaliste_dotace_20260801.py
          grep -Fq 'usnesením zastupitelstva města Kadaně č. 11/2026 ze dne 26. 2. 2026' .github/drafts/koupaliste-kadan-research-2026.html
          grep -Fq 'nejpozději do 31. 1. 2027' .github/drafts/pozemky-koupaliste-kadan.html
      - name: Uložit aktualizované drafty
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň monitoring'
          git config user.email 'info@nasekadan.cz'
          git add .github/drafts/koupaliste-kadan-research-2026.html .github/drafts/pozemky-koupaliste-kadan.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Doplnit usnesení a termín vyúčtování dotace na skluzavku'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
