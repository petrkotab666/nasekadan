name: Jednorázově opravit kanonický registr

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-index-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Opravit metadata registru
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          registry_path = Path('data/published-content-index.json')
          article_path = 'clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html'
          article_url = 'https://nasekadan.cz/clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html'

          data = json.loads(registry_path.read_text(encoding='utf-8'))

          article_commit = subprocess.check_output(
              ['git', 'log', '-1', '--format=%H', '--', article_path],
              text=True,
          ).strip()
          article_commit_iso = subprocess.check_output(
              ['git', 'show', '-s', '--format=%cI', article_commit],
              text=True,
          ).strip()
          article_modified = datetime.fromisoformat(article_commit_iso).astimezone(
              ZoneInfo('Europe/Prague')
          ).isoformat(timespec='seconds')

          relevant_commit = subprocess.check_output(
              [
                  'git', 'log', '-1', '--format=%H', '--',
                  'index.html', 'clanky/', 'rss.xml', 'sitemap.xml',
                  'news-sitemap.xml', 'deployment-health.txt'
              ],
              text=True,
          ).strip()

          matched = 0
          for article in data.get('articles', []):
              if article.get('url') == article_url:
                  article['modified_at'] = article_modified
                  article['source_commit'] = article_commit
                  matched += 1

          if matched != 1:
              raise SystemExit(f'Očekáván právě jeden článek, nalezeno: {matched}')

          data['generated_at'] = datetime.now(ZoneInfo('Europe/Prague')).isoformat(timespec='seconds')
          data['source_commit'] = relevant_commit
          data.setdefault('validation', {})['required_fields_complete'] = True
          data['validation']['per_article_source_commits'] = True

          registry_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Zapsat opravu a odstranit jednorázový workflow
        shell: bash
        run: |
          rm -f .github/workflows/canonical-index-reconcile-once.yml
          git config user.name 'Naše Kadaň – evidence článků'
          git config user.email 'noreply@nasekadan.cz'
          git add data/published-content-index.json .github/workflows/canonical-index-reconcile-once.yml
          if git diff --cached --quiet; then
            echo 'Registr již odpovídá zdrojům.'
            exit 0
          fi
          git commit -m 'Aktualizovat zdrojový commit a čas změny článku [skip ci]'
          git push
