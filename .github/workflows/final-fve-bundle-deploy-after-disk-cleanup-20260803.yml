name: Dokončit FVE publikaci po vyčištění OVH

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-fve-bundle-deploy-after-disk-cleanup-20260803.yml'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: final-fve-bundle-deploy-20260803
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE_REL: /clanky/fve-epr-letiste-bess-kadan-2026.html
      ARTICLE_FILE: clanky/fve-epr-letiste-bess-kadan-2026.html
      SOCIAL_REL: /social/fve-epr-letiste-baterie-kadan-20260803.png
      SOCIAL_FILE: social/fve-epr-letiste-baterie-kadan-20260803.png
      EXPECTED_H1: ČEZ chce u Kadaně postavit solární park s bateriemi. Jejich velikost, cena i platby městu zůstávají neznámé
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Připravit přesný balíček z nejnovějšího main
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          test -s "$ARTICLE_FILE"
          test -s "$SOCIAL_FILE"
          grep -Fq "<h1>${EXPECTED_H1}</h1>" "$ARTICLE_FILE"
          grep -Fq 'index,follow' "$ARTICLE_FILE"
          ! grep -Fq 'noindex' "$ARTICLE_FILE"
          grep -Fq '„Letiště“ je starý název lokality' "$ARTICLE_FILE"
          grep -Fq 'Solární park zatím není v provozu' "$ARTICLE_FILE"
          for f in index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt; do test -s "$f"; done
          for f in index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt; do grep -Fq 'fve-epr-letiste-bess-kadan-2026.html' "$f"; done
          bundle="$RUNNER_TEMP/fve-final-bundle"
          mkdir -p "$bundle/clanky" "$bundle/social"
          cp "$ARTICLE_FILE" "$bundle/clanky/"
          cp clanky/index.html "$bundle/clanky/index.html"
          cp "$SOCIAL_FILE" "$bundle/social/"
          cp index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt "$bundle/"
          printf 'status=ok\nsource=%s\narticle=https://nasekadan.cz%s\npublished_at=2026-08-03T10:30:00+02:00\nmode=final-bundle-after-disk-cleanup\n' "$source_sha" "$ARTICLE_REL" > "$bundle/deployment-health.txt"

      - name: Nahrát balíček přímo, bez zamčeného serverového Git repozitáře
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/fve-final-bundle"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/fve-final-bundle
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 "ARTICLE_REL='$ARTICLE_REL' SOCIAL_REL='$SOCIAL_REL' EXPECTED_H1='$EXPECTED_H1' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo -n true
          src=/tmp/fve-final-bundle
          root=/var/www/nasekadan
          sudo install -d -m 0755 "$root/clanky" "$root/social"
          sudo install -m 0644 "$src/clanky/fve-epr-letiste-bess-kadan-2026.html" "$root/clanky/"
          sudo install -m 0644 "$src/clanky/index.html" "$root/clanky/index.html"
          sudo install -m 0644 "$src/social/fve-epr-letiste-baterie-kadan-20260803.png" "$root/social/"
          for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt deployment-health.txt; do sudo install -m 0644 "$src/$f" "$root/$f"; done
          sudo chmod -R a+rX "$root"

          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/social
            sudo docker cp "$src/clanky/fve-epr-letiste-bess-kadan-2026.html" nasekadan-web:/usr/share/nginx/html/clanky/
            sudo docker cp "$src/clanky/index.html" nasekadan-web:/usr/share/nginx/html/clanky/index.html
            sudo docker cp "$src/social/fve-epr-letiste-baterie-kadan-20260803.png" nasekadan-web:/usr/share/nginx/html/social/
            for f in index.html rss.xml sitemap.xml news-sitemap.xml llms.txt robots.txt deployment-health.txt; do sudo docker cp "$src/$f" "nasekadan-web:/usr/share/nginx/html/$f"; done
          fi

          check(){ curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz$1?final-fve=$(date +%s)"; }
          article="$(check "$ARTICLE_REL")"
          home="$(check '/')"
          archive="$(check '/clanky/')"
          rss="$(check '/rss.xml')"
          sitemap="$(check '/sitemap.xml')"
          news="$(check '/news-sitemap.xml')"
          health="$(check '/deployment-health.txt')"
          check "$SOCIAL_REL" >/tmp/fve-final-social.png
          grep -Fq "<h1>${EXPECTED_H1}</h1>" <<<"$article"
          grep -Fq 'index,follow' <<<"$article"
          ! grep -Fq 'noindex' <<<"$article"
          grep -Fq "$ARTICLE_REL" <<<"$home"
          grep -Fq "$ARTICLE_REL" <<<"$archive"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" <<<"$rss"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" <<<"$sitemap"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" <<<"$news"
          grep -Fq '^status=ok' <<<"$health"
          python3 - <<'PY'
          import struct
          b=open('/tmp/fve-final-social.png','rb').read(24)
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', b[16:24])==(1200,630)
          PY
          rm -rf /tmp/fve-final-bundle /tmp/fve-final-social.png
          df -h /
          REMOTE

      - name: Nezávisle ověřit veřejný web a shodu s main
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          base=https://nasekadan.cz
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          tmp="$RUNNER_TEMP/fve-final-public"; mkdir -p "$tmp"
          get(){ curl -4 -kfsS -L --max-time 30 "$base$1?v=$stamp" -o "$2"; }
          get "$ARTICLE_REL" "$tmp/article"
          get '/' "$tmp/home"
          get '/clanky/' "$tmp/archive"
          get '/rss.xml' "$tmp/rss"
          get '/sitemap.xml' "$tmp/sitemap"
          get '/news-sitemap.xml' "$tmp/news"
          get "$SOCIAL_REL" "$tmp/social"
          get '/deployment-health.txt' "$tmp/health"
          grep -Fq "<h1>${EXPECTED_H1}</h1>" "$tmp/article"
          grep -Fq 'index,follow' "$tmp/article"
          ! grep -Fq 'noindex' "$tmp/article"
          grep -Fq "$ARTICLE_REL" "$tmp/home"
          grep -Fq "$ARTICLE_REL" "$tmp/archive"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" "$tmp/rss"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" "$tmp/sitemap"
          grep -Fq "https://nasekadan.cz$ARTICLE_REL" "$tmp/news"
          source_sha='${{ steps.prepare.outputs.source_sha }}'
          grep -Fq "source=$source_sha" "$tmp/health"
          remote_main="$(git ls-remote https://github.com/petrkotab666/nasekadan refs/heads/main | awk '{print $1}')"
          test "$source_sha" = "$remote_main"
          python3 - "$tmp/social" <<'PY'
          import struct,sys
          b=open(sys.argv[1],'rb').read(24)
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',b[16:24])==(1200,630)
          PY

      - name: Uzavřít nebo přesně aktualizovat incident
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$DEPLOY_OUTCOME" == success && "$VERIFY_OUTCOME" == success ]]; then
            gh issue comment 557 --repo "$GITHUB_REPOSITORY" --body "✅ Publikace FVE EPR Letiště je po vyčištění disku dokončena a nezávisle veřejně ověřena. Článek, správný H1, indexovatelnost, titulka, archiv, RSS, sitemap.xml, news-sitemap.xml, sociální PNG 1200 × 630 i deployment-health odpovídají main ${SOURCE_SHA}. Kontrolní běh: ${run_url}"
            gh issue close 557 --repo "$GITHUB_REPOSITORY" --reason completed || true
          else
            gh issue comment 557 --repo "$GITHUB_REPOSITORY" --body "❌ Přímé nasazení bez serverového Git repozitáře nebylo úplně ověřeno. Deploy: ${DEPLOY_OUTCOME}; veřejná kontrola: ${VERIFY_OUTCOME}; zdrojový main: ${SOURCE_SHA}; běh: ${run_url}. Disková cache byla před tím bezpečně uvolněna, ale incident zůstává otevřený."
            exit 1
          fi
