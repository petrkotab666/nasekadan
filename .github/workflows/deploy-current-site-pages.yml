name: Okamžitě nasadit aktuální Naši Kadaň na Pages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/pages-deploy-now-trigger.txt'
      - '.github/workflows/deploy-current-site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout aktuální zdroj
        uses: actions/checkout@v4

      - name: Připravit čistý statický web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          while IFS= read -r -d '' file; do
            case "$file" in
              .git*|.github/*|Dockerfile|docker-compose.yml|nginx/*|deploy/*|scripts/*|newsletter/*|lms-rescue/*|emergency-deploy-trigger.txt|pages-deploy-trigger.txt) continue ;;
            esac
            [ -f "$file" ] || continue
            mkdir -p "_site/$(dirname "$file")"
            cp -a "$file" "_site/$file"
          done < <(git ls-files -z)
          printf '%s\n' 'nasekadan.cz' > _site/CNAME
          touch _site/.nojekyll
          grep -F 'Nově zveřejněno: petice, 100 milionů a kyberbezpečnost' _site/clanky/nemocnice-kadan.html >/dev/null
          grep -F 'Petice rozjela volební spor' _site/clanky/petice-nemocnice-kadan.html >/dev/null

      - name: Nastavit Pages
        uses: actions/configure-pages@v5

      - name: Nahrát web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Nasadit web
        id: deployment
        uses: actions/deploy-pages@v4
