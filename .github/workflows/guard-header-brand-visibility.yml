name: Hlavička – celý název Naše Kadaň – pouze audit

# Historická samooprava byla odstraněna. Workflow už nesmí měnit CSS, články,
# main ani produkční server.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'style.css'
      - 'footer.css'
      - 'clanky/*.html'
      - '.github/workflows/guard-header-brand-visibility.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: header-brand-visibility-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit zdrojovou hlavičku bez změn
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<span>NAŠE <b>KADAŇ</b></span>' index.html
          grep -Fq '<span>NAŠE <b>KADAŇ</b></span>' clanky/slovan-druhy-pokus.html
          git diff --exit-code

      - name: Ověřit veřejnou hlavičku bez samoopravy
        shell: bash
        run: |
          set -euo pipefail
          q="header-audit-${GITHUB_RUN_ID}-$(date +%s)"
          curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/?$q" -o /tmp/home.html
          curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/clanky/slovan-druhy-pokus.html?$q" -o /tmp/article.html
          grep -Fq '<span>NAŠE <b>KADAŇ</b></span>' /tmp/home.html
          grep -Fq '<span>NAŠE <b>KADAŇ</b></span>' /tmp/article.html
          echo 'OK: hlavička je v pořádku; audit nic nezměnil.'

      - name: Nahlásit regresi bez opravy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[incident] Hlavička Naše Kadaň – audit zjistil regresi'
          body="Audit zjistil chybu hlavičky. Workflow nic nemění ani nenasazuje. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
