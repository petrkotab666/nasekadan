name: Zkontrolovat živé publikované články

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-live-publication-integrity.yml'
      - '.github/check-live-publication-integrity-trigger.txt'
      - 'scripts/check_live_publication_integrity.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/check-live-publication-integrity-pr.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-live-publication-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit zdrojové přehledy
        run: python3 scripts/validate_publication_integrity.py

      - name: Ověřit živý web, všechny URL, titulní stránku, archiv, sitemapu a RSS
        run: python3 scripts/check_live_publication_integrity.py
