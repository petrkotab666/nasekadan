name: Finálně nasadit Pojistime.to
run-name: Přímé dokončení bannerů Pojistime.to bez LastMinuteSlevy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-pojistime-banner-rotation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-pojistime-banner-rotation
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vygenerovat konečné soubory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          generator=Path('scripts/install_pojistime_banner_rotation.py')
          text=generator.read_text(encoding='utf-8')
          text=text.replace("VERSION='20260730-pojistime-rotation-1'","VERSION='20260730-pojistime-rotation-3'")
          text=text.replace("if 'pojistime-family-wide-a' not in t:t=t.replace(needle,inject,1)","if 'utm_campaign=pojistime_rotation_2026' not in t:t=t.replace(needle,inject,1)")
          generator.write_text(text,encoding='utf-8')
          spec=importlib.util.spec_from_file_location('banner_install',generator)
          module=importlib.util.module_from_spec(spec);assert spec.loader;spec.loader.exec_module(module)
          module.make_assets();module.patch_json();module.patch_js()
          for filename in ('scripts/ensure_summer_ad_rotation.py','scripts/normalize_articles.py'):
              path=Path(filename);value=path.read_text(encoding='utf-8')
              for old in ('20260730-summer-rotation-1','20260730-pojistime-rotation-1','20260730-pojistime-rotation-2'):
                  value=value.replace(old,'20260730-pojistime-rotation-3')
              path.write_text(value,encoding='utf-8')
          PY
          python3 scripts/ensure_summer_ad_rotation.py --write --check
          node --check reklamy-oprava-obrazku.js
          python3 -m json.tool assets/affiliate-site-travel-overlay.json >/dev/null
          for file in assets/reklamy/pojistime-family-wide-a.svg assets/reklamy/pojistime-family-wide-b.svg assets/reklamy/pojistime-family-square.svg assets/reklamy/pojistime-family-tower.svg; do test -s "$file"; grep -Fq '<svg' "$file"; done
          grep -Fq 'utm_campaign=pojistime_rotation_2026' reklamy-oprava-obrazku.js
          grep -Fq 'pojistime-family-tower' reklamy-oprava-obrazku.js
          ! grep -Fq 'lastminuteslevy-cz' reklamy-oprava-obrazku.js
          ! grep -Fq 'lastminuteslevy-cz' assets/affiliate-site-travel-overlay.json

      - name: Uložit do repozitáře
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/reklamy/pojistime-family-*.svg assets/affiliate-site-travel-overlay.json assets/affiliate-site-config.json reklamy-oprava-obrazku.js scripts/ensure_summer_ad_rotation.py scripts/normalize_articles.py -- '*.html' ':!nahled/**' ':!.github/**'
          if ! git diff --cached --quiet; then
            git commit -m 'Nasadit rotující bannery Pojistime.to bez LastMinuteSlevy'
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              git pull --rebase origin main
            done
            test "$pushed" = true
          fi

      - name: Připravit balíček a SSH
        shell: bash
        run: |
          set -Eeuo pipefail; umask 077
          tar -czf "$RUNNER_TEMP/pojistime-banners.tar.gz" reklamy-oprava-obrazku.js assets/affiliate-site-travel-overlay.json assets/reklamy/pojistime-family-wide-a.svg assets/reklamy/pojistime-family-wide-b.svg assets/reklamy/pojistime-family-square.svg assets/reklamy/pojistime-family-tower.svg
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"; break; fi
          done
          test -s "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"

      - name: Přenést a aktivovat na OVH
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$RUNNER_TEMP/pojistime-banners.tar.gz" ubuntu@57.129.43.215:/tmp/pojistime-banners.tar.gz
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo -n true
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp" /tmp/pojistime-banners.tar.gz' EXIT
          tar -xzf /tmp/pojistime-banners.tar.gz -C "$tmp"
          sudo install -d -m 0755 /var/www/nasekadan/assets/reklamy /var/www/nasekadan/assets
          sudo install -m 0644 "$tmp"/assets/reklamy/pojistime-family-*.svg /var/www/nasekadan/assets/reklamy/
          sudo install -m 0644 "$tmp/reklamy-oprava-obrazku.js" /var/www/nasekadan/reklamy-oprava-obrazku.js
          sudo install -m 0644 "$tmp/assets/affiliate-site-travel-overlay.json" /var/www/nasekadan/assets/affiliate-site-travel-overlay.json
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/var/www/nasekadan');version='20260730-pojistime-rotation-3'
          pattern=re.compile(r'(<script\b[^>]*\bsrc=["\'])([^"\']*?reklamy-oprava-obrazku\.js)(?:\?[^"\']*)?(["\'][^>]*>\s*</script>)',re.I)
          count=0
          for path in root.rglob('*.html'):
              if any(part in {'.git','.github','nahled','node_modules'} for part in path.relative_to(root).parts):continue
              try:text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              updated=pattern.sub(lambda m:f'{m.group(1)}{m.group(2)}?v={version}{m.group(3)}',text)
              if updated!=text:path.write_text(updated,encoding='utf-8');count+=1
          print(f'Veřejných HTML aktualizováno: {count}')
          PY
          sudo chmod -R a+rX /var/www/nasekadan
          sudo nginx -t
          sudo systemctl reload nginx
          grep -Fq 'pojistime-family-wide-a' /var/www/nasekadan/reklamy-oprava-obrazku.js
          grep -Fq 'pojistime-family-tower' /var/www/nasekadan/reklamy-oprava-obrazku.js
          ! grep -Fq 'lastminuteslevy-cz' /var/www/nasekadan/reklamy-oprava-obrazku.js
          ! grep -Fq 'lastminuteslevy-cz' /var/www/nasekadan/assets/affiliate-site-travel-overlay.json
          REMOTE

      - name: Ověřit z internetu
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/live";ok=false
          for attempt in $(seq 1 30); do
            q="${GITHUB_SHA}-${attempt}-$(date +%s)"
            curl -fsS --max-time 20 "https://nasekadan.cz/?pojistime=$q" -o "$RUNNER_TEMP/live/home" || true
            curl -fsS --max-time 20 "https://nasekadan.cz/reklamy-oprava-obrazku.js?pojistime=$q" -o "$RUNNER_TEMP/live/js" || true
            curl -fsS --max-time 20 "https://nasekadan.cz/assets/affiliate-site-travel-overlay.json?pojistime=$q" -o "$RUNNER_TEMP/live/overlay" || true
            for n in wide-a wide-b square tower; do curl -fsS --max-time 20 "https://nasekadan.cz/assets/reklamy/pojistime-family-$n.svg?pojistime=$q" -o "$RUNNER_TEMP/live/$n" || true; done
            if grep -Fq '20260730-pojistime-rotation-3' "$RUNNER_TEMP/live/home" && grep -Fq 'pojistime-family-wide-a' "$RUNNER_TEMP/live/js" && grep -Fq 'pojistime-family-wide-b' "$RUNNER_TEMP/live/js" && grep -Fq 'pojistime-family-square' "$RUNNER_TEMP/live/js" && grep -Fq 'pojistime-family-tower' "$RUNNER_TEMP/live/js" && ! grep -Fq 'lastminuteslevy-cz' "$RUNNER_TEMP/live/js" && ! grep -Fq 'lastminuteslevy-cz' "$RUNNER_TEMP/live/overlay" && grep -Fq '<svg' "$RUNNER_TEMP/live/wide-a" && grep -Fq '<svg' "$RUNNER_TEMP/live/wide-b" && grep -Fq '<svg' "$RUNNER_TEMP/live/square" && grep -Fq '<svg' "$RUNNER_TEMP/live/tower"; then ok=true;break;fi
            sleep 10
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT";test "$ok" = true

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.verify.outputs.ok }}
        with:
          script: |
            const fs=require('fs'),read=p=>{try{return fs.readFileSync(p,'utf8')}catch{return ''}},r=`${process.env.RUNNER_TEMP}/live`,js=read(`${r}/js`),overlay=read(`${r}/overlay`);
            const report={checked_at_utc:new Date().toISOString(),trigger_commit:context.sha,status:process.env.OK==='true'?'success':'failed',homepage_uses_pojistime_version:read(`${r}/home`).includes('20260730-pojistime-rotation-3'),live_rotation_has_wide:js.includes('pojistime-family-wide-a')&&js.includes('pojistime-family-wide-b'),live_rotation_has_square:js.includes('pojistime-family-square'),live_rotation_has_tower:js.includes('pojistime-family-tower'),lastminuteslevy_absent:!js.includes('lastminuteslevy-cz')&&!overlay.includes('lastminuteslevy-cz'),assets_public:['wide-a','wide-b','square','tower'].every(n=>read(`${r}/${n}`).includes('<svg'))};
            const path='pojistime-banner-live-status.json',content=Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64');let sha;
            try{const c=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(c.data))sha=c.data.sha}catch(e){if(e.status!==404)throw e}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:`Zapsat finální nasazení Pojistime.to: ${report.status}`,content,...(sha?{sha}:{})});

      - name: Výsledek
        if: always()
        env:
          OK: ${{ steps.verify.outputs.ok }}
        run: test "$OK" = true
