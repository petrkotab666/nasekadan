name: PR publikace článku o MVE Hradiště

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/mve-hradiste-publish-trigger.txt'
      - '.github/workflows/publish-mve-hradiste-pr-20260731.yml'
      - 'scripts/publish_mve_hradiste_20260731.py'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mve-hradiste-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vytvořit článek, obrázek a veřejné přehledy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet Pillow
          python scripts/publish_mve_hradiste_20260731.py

          slug='mve-hradiste-nova-vodni-elektrarna-2026'
          title='U Hradiště má vzniknout nová malá vodní elektrárna. Vodu přivede potrubí dlouhé 520 metrů'
          test -s "clanky/${slug}.html"
          test -s "social/${slug}.png"
          grep -Fq "<h1>${title}</h1>" "clanky/${slug}.html"
          grep -Fq '/clanky/mve-hradiste-nova-vodni-elektrarna-2026.html' index.html
          grep -Fq '/clanky/mve-hradiste-nova-vodni-elektrarna-2026.html' clanky/index.html
          grep -Fq 'https://nasekadan.cz/clanky/mve-hradiste-nova-vodni-elektrarna-2026.html' rss.xml
          grep -Fq 'https://nasekadan.cz/clanky/mve-hradiste-nova-vodni-elektrarna-2026.html' sitemap.xml
          grep -Fq 'https://nasekadan.cz/clanky/mve-hradiste-nova-vodni-elektrarna-2026.html' news-sitemap.xml

          python - "social/${slug}.png" <<'PY'
          import struct, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n')
          assert len(data) > 10000
          assert struct.unpack('>II', data[16:24]) == (1200, 630)
          PY

      - name: Uložit vygenerované soubory do servisní větve
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň publikační automat'
          git config user.email 'info@nasekadan.cz'
          git add \
            clanky/mve-hradiste-nova-vodni-elektrarna-2026.html \
            social/mve-hradiste-nova-vodni-elektrarna-2026.png \
            index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml \
            llms.txt robots.txt analytics.js 404.html style.css
          if git diff --cached --quiet; then
            echo 'Publikace je už v servisní větvi kompletní.'
            exit 0
          fi
          git commit -m 'Připravit článek o nové MVE Hradiště'
          git push origin "HEAD:${HEAD_REF}"
