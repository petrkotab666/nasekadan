name: Sjednotit patičku celého webu

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'style.css'
      - 'footer.css'
      - 'navigation.js'
      - 'Dockerfile'
      - 'scripts/normalize_footers.py'
      - '.github/footer-normalization-trigger.txt'
      - '.github/workflows/normalize-site-footer.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/footer-normalization-pr-trigger.txt'
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nasekadan-unified-footer
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stáhnout hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sjednotit všechny statické patičky
        id: normalize
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/normalize_footers.py --write --check 2>&1 | tee "$RUNNER_TEMP/footer-normalization-report.txt"

      - name: Zapsat diagnostiku do pull requestu
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          NORMALIZE_OUTCOME: ${{ steps.normalize.outcome }}
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync(`${process.env.RUNNER_TEMP}/footer-normalization-report.txt`, 'utf8');
            } catch (error) {
              report = `Diagnostický soubor se nepodařilo načíst: ${error.message}`;
            }
            const body = [
              '## Sjednocení patičky webu',
              '',
              `Výsledek normalizátoru: **${process.env.NORMALIZE_OUTCOME || 'neznámý'}**`,
              '',
              '```text',
              report.slice(-30000),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Uložit opravené stránky
        if: steps.normalize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – jednotná patička'
          git config user.email 'info@nasekadan.cz'

          while IFS= read -r -d '' file; do
            git add -- "$file"
          done < <(find . -type f -name '*.html' \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './.image-parts/*' \
            -not -path './lms-rescue/*' \
            -not -path './node_modules/*' -print0)

          if git diff --cached --quiet; then
            echo 'Patička je již na všech stránkách jednotná.'
            exit 0
          fi

          git commit -m 'Sjednotit patičku na všech stránkách webu'
          git pull --rebase origin main
          git push origin main

      - name: Závěrečná kontrola
        if: steps.normalize.outcome == 'success'
        run: python3 scripts/normalize_footers.py --check

      - name: Potvrdit úspěch normalizátoru
        if: steps.normalize.outcome != 'success'
        shell: bash
        run: |
          echo 'Sjednocení patičky selhalo; podrobnosti jsou v komentáři pull requestu.' >&2
          exit 1
