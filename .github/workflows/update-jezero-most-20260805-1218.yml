name: Doplnit zdroj e-Mostecko k článku o jezeře Most

on:
  push:
    branches: [main]
    paths:
      - 'ops/trigger-update-jezero-most-20260805-1218.txt'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-jezero-most-20260805-1218
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTICLE_URL: https://nasekadan.cz/clanky/jezero-most-patrani-dva-lide-bourka-2026.html
      ARTICLE_FILE: clanky/jezero-most-patrani-dva-lide-bourka-2026.html
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Doplnit potvrzující zdroj bez změny času vydání
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m py_compile scripts/update_jezero_most_20260805_1218.py
            python3 scripts/update_jezero_most_20260805_1218.py

            grep -Fq 'e-Mostecko – Na jezeře Most pokračuje rozsáhlá pátrací akce' "$ARTICLE_FILE"
            grep -Fq 'data-source-enrichment="emostecko-20260805"' "$ARTICLE_FILE"
            grep -Fq 'article:published_time" content="2026-08-05T10:50:00+02:00' "$ARTICLE_FILE"
            grep -Fq 'article:modified_time" content="2026-08-05T10:50:00+02:00' "$ARTICLE_FILE"
            grep -Fq '"modified_at": "2026-08-05T10:50:00+02:00"' data/published-content-index.json
            git diff --check

            git add "$ARTICLE_FILE" data/published-content-index.json
            if ! git diff --cached --quiet; then
              git commit -m 'Doplnit e-Mostecko jako potvrzující zdroj k jezeru Most'
            fi
            source_sha="$(git rev-parse HEAD)"

            SOURCE_SHA="$source_sha" ARTICLE_URL="$ARTICLE_URL" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('data/published-content-index.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          article=next((x for x in data.get('articles',[]) if x.get('url')==os.environ['ARTICLE_URL']),None)
          if article is None:
              raise SystemExit('Článek chybí v registru.')
          article['source_commit']=os.environ['SOURCE_SHA']
          data['source_commit']=os.environ['SOURCE_SHA']
          validation=data.setdefault('validation',{})
          validation['repair_pending_public_verification']=True
          enrichment=validation.setdefault('last_source_enrichment',{})
          enrichment['status']='pending_public_verification'
          enrichment['source_commit']=os.environ['SOURCE_SHA']
          enrichment['checked_at']=datetime.now(timezone.utc).isoformat()
          data['generated_at']=datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            printf 'status=ok\nsource=%s\narticle=%s\nchange=source-enrichment-only\n' "$source_sha" "$ARTICLE_URL" > deployment-health.txt
            git add data/published-content-index.json deployment-health.txt
            if ! git diff --cached --quiet; then
              git commit -m 'Evidence: zapsat doplnění zdroje e-Mostecko'
            fi
            final_sha="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              pushed=1
              echo "source_sha=$final_sha" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" = 1

      - name: Nasadit článek a evidenci na OVH
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/jezero-most-source-enrichment"
          rm -rf "$bundle"
          mkdir -p "$bundle/clanky" "$bundle/data"
          cp "$ARTICLE_FILE" "$bundle/clanky/"
          cp data/published-content-index.json "$bundle/data/"
          cp deployment-health.txt "$bundle/"
          tar -C "$bundle" -czf "$RUNNER_TEMP/jezero-most-source-enrichment.tgz" .
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$RUNNER_TEMP/jezero-most-source-enrichment.tgz" ubuntu@57.129.43.215:/tmp/jezero-most-source-enrichment.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          rm -rf /tmp/jezero-most-source-enrichment
          mkdir -p /tmp/jezero-most-source-enrichment
          tar -xzf /tmp/jezero-most-source-enrichment.tgz -C /tmp/jezero-most-source-enrichment
          src=/tmp/jezero-most-source-enrichment
          root=/var/www/nasekadan
          sudo install -m 0666 /dev/null /var/lock/nasekadan-content.lock
          exec 9>/var/lock/nasekadan-content.lock
          flock -x 9
          sudo install -d -m 0755 "$root/clanky" "$root/data"
          sudo install -m 0644 "$src/clanky/jezero-most-patrani-dva-lide-bourka-2026.html" "$root/clanky/jezero-most-patrani-dva-lide-bourka-2026.html"
          sudo install -m 0644 "$src/data/published-content-index.json" "$root/data/published-content-index.json"
          sudo install -m 0644 "$src/deployment-health.txt" "$root/deployment-health.txt"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker exec nasekadan-web mkdir -p /usr/share/nginx/html/clanky /usr/share/nginx/html/data
            sudo docker cp "$src/clanky/jezero-most-patrani-dva-lide-bourka-2026.html" nasekadan-web:/usr/share/nginx/html/clanky/jezero-most-patrani-dva-lide-bourka-2026.html
            sudo docker cp "$src/data/published-content-index.json" nasekadan-web:/usr/share/nginx/html/data/published-content-index.json
            sudo docker cp "$src/deployment-health.txt" nasekadan-web:/usr/share/nginx/html/deployment-health.txt
          fi
          rm -rf /tmp/jezero-most-source-enrichment /tmp/jezero-most-source-enrichment.tgz
          REMOTE

      - name: Veřejně ověřit doplnění zdroje
        shell: bash
        run: |
          set -euo pipefail
          sleep 6
          q="${GITHUB_RUN_ID}-$(date +%s)"
          article="$(curl -4 -kfsS -L --max-time 40 "$ARTICLE_URL?v=$q")"
          registry="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/data/published-content-index.json?v=$q")"
          health="$(curl -4 -kfsS -L --max-time 40 "https://nasekadan.cz/deployment-health.txt?v=$q")"
          grep -Fq 'e-Mostecko – Na jezeře Most pokračuje rozsáhlá pátrací akce' <<<"$article"
          grep -Fq 'data-source-enrichment="emostecko-20260805"' <<<"$article"
          grep -Fq 'article:published_time" content="2026-08-05T10:50:00+02:00' <<<"$article"
          grep -Fq 'article:modified_time" content="2026-08-05T10:50:00+02:00' <<<"$article"
          grep -Fq '"modified_at": "2026-08-05T10:50:00+02:00"' <<<"$registry"
          grep -Fq 'supporting_source_published_before_article' <<<"$registry"
          grep -Fq 'change=source-enrichment-only' <<<"$health"

      - name: Uzavřít nález jako zdrojové doplnění
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/issues/692/comments -f body="e-Mostecko bylo doplněno do zdrojové části existujícího článku. Čas vydání ani datum obsahové aktualizace nebyly posunuty, protože zdroj vyšel v 8:15, před naším článkem z 10:50, a nepřináší pozdější vývoj. Veřejná kontrola článku, registru a deployment-health proběhla úspěšně. Commit: ${{ steps.prepare.outputs.source_sha }}."
          gh api repos/${GITHUB_REPOSITORY}/issues/692 -X PATCH -f state=closed -f state_reason=completed >/dev/null

      - name: Zapsat selhání
        if: failure()
        shell: bash
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues/692/comments -f body="Doplnění zdroje e-Mostecko nebo veřejná kontrola selhaly. Nález zůstává otevřený. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
