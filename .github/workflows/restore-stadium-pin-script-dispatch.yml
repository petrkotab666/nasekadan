name: Ručně obnovit připnutí zimního stadionu

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Číslo řídicího issue
        required: true
        type: string

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zastavit konfliktní pojistku
        run: |
          gh run list --workflow article-integrity-guard.yml --limit 30 --json databaseId,status --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' | while read -r id; do
            [[ -n "$id" ]] && gh run cancel "$id" || true
          done
          sleep 8
      - name: Obnovit zdroj a odeslat změny
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – dočasné připnutí titulky'
          git config user.email 'info@nasekadan.cz'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m py_compile scripts/restore_stadium_pin_now.py scripts/verify_stadium_pin_live.py
            python3 scripts/restore_stadium_pin_now.py
            git diff --check
            git add scripts/enforce_article_visibility.py scripts/run_article_integrity_guard.sh index.html clanky/index.html sitemap.xml .github/stadium-pin-latest.txt
            find clanky -maxdepth 1 -type f -name 'strana-*.html' -print0 | xargs -0 -r git add --
            if ! git diff --cached --quiet; then git commit -m 'Obnovit připnutí zimního stadionu do 5. srpna 18:00'; fi
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep $((attempt * 4))
          done
          test "$pushed" = 1
      - name: Nasadit titulku
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 index.html ubuntu@57.129.43.215:/tmp/nasekadan-index-pin.html
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 "sudo install -m 0644 /tmp/nasekadan-index-pin.html /var/www/nasekadan/index.html && (sudo docker inspect nasekadan-web >/dev/null 2>&1 && sudo docker cp /tmp/nasekadan-index-pin.html nasekadan-web:/usr/share/nginx/html/index.html || true) && rm -f /tmp/nasekadan-index-pin.html"
      - name: Veřejně ověřit a uzavřít
        run: |
          set -euo pipefail
          python3 scripts/verify_stadium_pin_live.py
          latest="$(cat .github/stadium-pin-latest.txt)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Připnutí bylo obnoveno a veřejně ověřeno. Boční článek: ${latest}. Archiv, RSS, původní datum i počasí jsou v pořádku. Run ${GITHUB_RUN_ID}."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
      - name: Zapsat chybu
        if: failure()
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Obnova připnutí selhala. Run ${GITHUB_RUN_ID}."
