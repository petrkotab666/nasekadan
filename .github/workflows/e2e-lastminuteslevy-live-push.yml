name: Push E2E živého LastMinuteSlevy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-lastminuteslevy-live-push.yml'
      - '.github/e2e-lastminuteslevy-live-push-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Nainstalovat Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Ověřit živý web
        id: e2e
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee /tmp/lms-e2e.json
          import { chromium } from 'playwright';
          const out={ok:false,errors:[],consoleErrors:[],failedRequests:[]};let browser;
          try{
            browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.on('pageerror',e=>out.errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')out.consoleErrors.push(m.text())});
            page.on('requestfailed',r=>out.failedRequests.push({url:r.url(),error:r.failure()?.errorText||''}));
            const response=await page.goto(`https://www.lastminuteslevy.cz/?e2e-push=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            out.http=response?.status()||0;
            await page.waitForSelector('#catalogFilterV3 .cf7-panel',{timeout:180000});
            await page.waitForFunction(()=>{const f=document.querySelector('#catalogFilterV3');const status=document.querySelector('[data-search-status]')?.textContent||'';return f?.dataset.bootstrapState==='ready'&&(Number(f.dataset.catalogTotalOffers||0)>2000000||Number(status.replace(/\D/g,''))>2000000)},{timeout:180000});
            out.initial=await page.evaluate(()=>{const main=document.querySelector('main#hlavni-obsah'),search=document.querySelector('#nabidky'),results=document.querySelector('#vysledky'),f=document.querySelector('#catalogFilterV3');return{first:main?.firstElementChild?.id||'',searchBeforeResults:Boolean(search&&results&&(search.compareDocumentPosition(results)&Node.DOCUMENT_POSITION_FOLLOWING)),total:Number(f?.dataset.catalogTotalOffers||0),loaded:Number(f?.dataset.catalogLoadedOffers||0),status:document.querySelector('[data-search-status]')?.textContent?.trim()||'',bootstrap:f?.dataset.bootstrapState||'',groups:[...f.querySelectorAll('.cf7-group[data-group]')].map(n=>n.dataset.group),countries:[...f.querySelectorAll('input[name="countries"]')].map(i=>({value:i.value,disabled:i.disabled,count:Number((i.closest('.cf7-option')?.querySelector('[data-facet-count]')?.textContent||'').replace(/\D/g,'')||0)})),adBeforeSearch:[...document.querySelectorAll('[data-slevomat-home-section],.lms-slevomat-home')].some(ad=>Boolean(ad.compareDocumentPosition(search)&Node.DOCUMENT_POSITION_FOLLOWING)),runtime:document.documentElement.dataset.performanceRuntime||'',mode:document.documentElement.dataset.catalogMode||''}});
            const required=['countries','tripTypes','sports','transports','departures','providers','boards','categories','freshness','travelers'];
            if(out.initial.first!=='nabidky')throw new Error(`První obsah není vyhledávač: ${out.initial.first}`);
            if(!out.initial.searchBeforeResults)throw new Error('Vyhledávač není před výsledky');
            if(out.initial.total<=2000000)throw new Error(`Katalog má jen ${out.initial.total}`);
            if(out.initial.bootstrap!=='ready')throw new Error(`Bootstrap: ${out.initial.bootstrap}`);
            for(const n of required)if(!out.initial.groups.includes(n))throw new Error(`Chybí filtr ${n}`);
            if(out.initial.adBeforeSearch)throw new Error('Reklama je před vyhledávačem');
            const country=out.initial.countries.find(x=>!x.disabled&&x.count>0);if(!country)throw new Error('Žádná země s kladným počtem');out.country=country;
            await page.evaluate(value=>{const input=[...document.querySelectorAll('input[name="countries"]')].find(i=>i.value===value);if(!input)throw new Error('Země nenalezena');input.click()},country.value);
            await page.waitForFunction(()=>{const status=document.querySelector('[data-search-status]')?.textContent||'';return document.querySelectorAll('#offersGrid .catalog-offer-card').length>0&&!/Načítám|\b0\s+nabídek\b/i.test(status)},{timeout:240000});
            out.final=await page.evaluate(()=>{const results=document.querySelector('#vysledky'),ad=document.querySelector('[data-slevomat-home-section],.lms-slevomat-home'),f=document.querySelector('#catalogFilterV3');return{cards:document.querySelectorAll('#offersGrid .catalog-offer-card').length,status:document.querySelector('[data-search-status]')?.textContent?.trim()||'',resultInfo:document.querySelector('#resultInfo')?.textContent?.trim()||'',bootstrap:f?.dataset.bootstrapState||'',total:Number(f?.dataset.catalogTotalOffers||0),adPresent:Boolean(ad),adAfterResults:!ad||Boolean(results&&(results.compareDocumentPosition(ad)&Node.DOCUMENT_POSITION_FOLLOWING)),source:document.documentElement.dataset.catalogDataSource||'',router:window.__LMS_CATALOG_ROUTER_DIAGNOSTICS__||null}});
            if(out.final.cards<1)throw new Error('Žádné výsledkové karty');
            if(/\b0\s+nabídek\b/i.test(out.final.status))throw new Error(`Falešná nula: ${out.final.status}`);
            if(!out.final.adAfterResults)throw new Error('Reklama není za výsledky');
            if(out.final.bootstrap!=='ready')throw new Error(`Bootstrap po filtru: ${out.final.bootstrap}`);
            out.ok=true;
          }catch(error){out.errors.push(String(error?.stack||error))}finally{if(browser)await browser.close()}
          console.log(JSON.stringify(out,null,2));if(!out.ok)process.exitCode=1;
          NODE

      - name: Zapsat report do issue
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const fs=require('fs');let report='';try{report=fs.readFileSync('/tmp/lms-e2e.json','utf8')}catch{}
            const body=`## E2E kontrola ${new Date().toISOString()}\n\nVýsledek: **${process.env.OUTCOME}**\n\n\`\`\`json\n${report.slice(-60000)}\n\`\`\``;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:16,body});

      - name: Vyhodnotit
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.e2e.outcome }}
        run: test "$OUTCOME" = success
