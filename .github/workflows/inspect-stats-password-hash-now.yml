name: Zjistit přesný formát hashe hesla statistik

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-stats-password-hash-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Dekódovat zdroj a vypsat jen autentizační funkce
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"; selected="$name"; break; fi
          done
          test -n "$selected"
          chmod 600 "$RUNNER_TEMP/key"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'sudo python3 -' > "$RUNNER_TEMP/hash.txt" 2>&1 <<'PY'
          from pathlib import Path
          import base64, gzip, re

          packed = Path('/usr/local/lib/nasekadan-stats/stats_server.py').read_text(encoding='utf-8')
          match = re.search(r'base64\.b64decode\("([A-Za-z0-9+/=]+)"\)', packed)
          if not match:
              raise SystemExit('Komprimovaný zdroj nebyl rozpoznán.')
          source = gzip.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          lines = source.splitlines()
          needles = ('password.json','hash_password','verify_password','check_password','set_password','PASSWORD_FILE','PASSWORD_PATH','pbkdf','scrypt','bcrypt','compare_digest','login.txt','reset-token.json')
          selected = set()
          for idx, line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles):
                  for j in range(max(0, idx-8), min(len(lines), idx+18)):
                      selected.add(j)
          for j in sorted(selected):
              line = lines[j]
              line = re.sub(r'(?i)(password|heslo|token|secret)(\s*=\s*)["\'][^"\']+["\']', r'\1\2"[REDACTED]"', line)
              print(f'{j+1:04d}: {line}')
          PY

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); let log='';
            try {log=fs.readFileSync(`${process.env.RUNNER_TEMP}/hash.txt`,'utf8')} catch {}
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,
              title:`[STATISTIKY PASSWORD HASH] ${new Date().toISOString()}`,
              body:'```text\n'+log.slice(-24000).replace(/```/g,'---')+'\n```'});
