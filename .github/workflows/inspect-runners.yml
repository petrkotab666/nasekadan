name: Zjistit stav self-hosted runnerů

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/inspect-runners-trigger.txt'
  workflow_dispatch:

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vypsat pouze relevantní aktivní běhy
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, branch: 'main', per_page: 100
            });
            const activeStates = new Set(['queued','in_progress','waiting','pending','requested']);
            const words = ['statistik', 'OVH', 'Nasadit', 'nasadit', 'Rychlé publikování', 'ordinací', 'feed', 'snímek', 'obrázky'];
            const relevant = runs.filter(run => activeStates.has(run.status) && words.some(word => run.name.includes(word)));
            const lines = relevant.length ? relevant.map(run => [
              `- ID \`${run.id}\`, #${run.run_number} **${run.name}**`,
              `  - stav: ${run.status}`,
              `  - commit: \`${run.head_sha.slice(0,7)}\``,
              `  - vytvořeno: ${run.created_at}`,
              `  - aktualizováno: ${run.updated_at}`,
              `  - ${run.html_url}`
            ].join('\n')) : ['- Žádný relevantní aktivní běh.'];
            const body = ['## Relevantní aktivní běhy', '', ...lines].join('\n');
            await github.rest.issues.createComment({owner, repo, issue_number: context.issue.number, body});
