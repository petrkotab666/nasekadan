name: Chránit publikované články před zmizením

on:
  push:
    branches: [main]
    paths:
      - 'clanky/**'
      - 'index.html'
      - 'sitemap.xml'
      - 'rss.xml'
      - 'scripts/ensure_publication_integrity.py'
      - 'scripts/ensure_newest_article_indexes.py'
      - 'scripts/validate_publication_integrity.py'
      - '.github/publication-integrity-trigger.txt'
      - '.github/workflows/protect-published-articles.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/run-publication-integrity-pr.txt'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nasekadan-publication-integrity
  cancel-in-progress: false

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Stáhnout aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Obnovit všechny chybějící vazby publikovaných článků
        run: |
          set -euo pipefail
          python3 scripts/ensure_publication_integrity.py
          python3 scripts/ensure_newest_article_indexes.py

      - name: Ověřit titulní stránku, archiv, sitemapu a RSS
        run: python3 scripts/validate_publication_integrity.py

      - name: Trvale uložit automatickou opravu
        id: save
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – ochrana článků'
          git config user.email 'info@nasekadan.cz'
          git add index.html clanky/index.html sitemap.xml rss.xml

          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Publikované články jsou kompletní; není co opravovat.'
            exit 0
          fi

          git commit -m 'Obnovit trvalou dostupnost všech publikovaných článků'
          saved=false
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              saved=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "saved=$saved" >> "$GITHUB_OUTPUT"
          if [[ "$saved" != true ]]; then
            echo 'Přehledy jsou sestavené v pracovním prostoru, ale kvůli souběhu se zatím neuložily do main. Produkční nasazení pokračuje.' >&2
          fi

      - name: Závěrečná kontrola po opravě
        run: python3 scripts/validate_publication_integrity.py

      - name: Zjistit stav srpnového článku na živém webu
        id: gallery_live
        shell: bash
        run: |
          set -Eeuo pipefail
          token="${GITHUB_RUN_ID}-pre-$(date +%s)"
          curl -fsS --max-time 20 "https://nasekadan.cz/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html?guard=$token" -o /tmp/gallery-pre-article.html || true
          curl -fsS --max-time 20 "https://nasekadan.cz/?guard=$token" -o /tmp/gallery-pre-home.html || true
          curl -fsS --max-time 20 "https://nasekadan.cz/clanky/?guard=$token" -o /tmp/gallery-pre-archive.html || true
          curl -fsS --max-time 20 "https://nasekadan.cz/rss.xml?guard=$token" -o /tmp/gallery-pre-rss.xml || true
          if grep -Fq 'Srpen v kadaňských galeriích nabídne houby' /tmp/gallery-pre-article.html \
            && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/gallery-pre-home.html \
            && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/gallery-pre-archive.html \
            && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/gallery-pre-rss.xml; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Sestavit kompletní balíček srpnového článku
        if: steps.gallery_live.outputs.already != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html
          python3 -m pip install --quiet Pillow
          python3 scripts/normalize_articles.py --write --check
          python3 scripts/normalize_footers.py --write --check
          python3 scripts/generate_social_cards.py --write --check
          python3 scripts/enforce_article_visibility.py
          python3 scripts/ensure_all_published_articles_in_rss.py
          python3 scripts/sort_articles_chronologically.py
          python3 scripts/enforce_latest_homepage_hero.py
          python3 scripts/prepare_discovery.py
          python3 scripts/clean_sitemap_technical_entries.py
          for file in index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml; do
            test -f "$file"
            grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' "$file"
          done
          grep -Fq 'Srpen v kadaňských galeriích nabídne houby' clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html

      - name: Připravit SSH klíč pro OVH
        if: steps.gallery_live.outputs.already != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          selected=''
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_key"
              selected="$name"
              break
            fi
          done
          test -n "$selected"
          test -s "$RUNNER_TEMP/nasekadan_key"
          chmod 600 "$RUNNER_TEMP/nasekadan_key"
          echo "Použit SSH klíč: $selected"

      - name: Nasadit srpnový článek přímo na OVH
        if: steps.gallery_live.outputs.already != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          social_file=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html').read_text(encoding='utf-8')
          match=re.search(r'https://nasekadan\.cz/(social/[^"\']+)',text)
          if not match:
              raise SystemExit('V článku chybí sociální obrázek')
          print(match.group(1))
          PY
          )
          test -f "$social_file"
          tar -czf "$RUNNER_TEMP/august-galleries-release.tgz" \
            index.html clanky/index.html clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html \
            rss.xml sitemap.xml news-sitemap.xml "$social_file" llms.txt llms-full.txt
          scp -i "$RUNNER_TEMP/nasekadan_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/august-galleries-release.tgz" ubuntu@57.129.43.215:/tmp/august-galleries-release.tgz
          ssh -i "$RUNNER_TEMP/nasekadan_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          tar -xzf /tmp/august-galleries-release.tgz -C "$tmp"
          sudo install -d -m 0755 /var/www/nasekadan/clanky /var/www/nasekadan/social
          sudo install -m 0644 "$tmp/index.html" /var/www/nasekadan/index.html
          sudo install -m 0644 "$tmp/clanky/index.html" /var/www/nasekadan/clanky/index.html
          sudo install -m 0644 "$tmp/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html" /var/www/nasekadan/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html
          sudo install -m 0644 "$tmp/rss.xml" /var/www/nasekadan/rss.xml
          sudo install -m 0644 "$tmp/sitemap.xml" /var/www/nasekadan/sitemap.xml
          sudo install -m 0644 "$tmp/news-sitemap.xml" /var/www/nasekadan/news-sitemap.xml
          sudo install -m 0644 "$tmp/llms.txt" /var/www/nasekadan/llms.txt
          sudo install -m 0644 "$tmp/llms-full.txt" /var/www/nasekadan/llms-full.txt
          sudo cp -a "$tmp/social/." /var/www/nasekadan/social/
          sudo chmod -R a+rX /var/www/nasekadan
          sudo nginx -t
          sudo systemctl reload nginx
          rm -rf "$tmp" /tmp/august-galleries-release.tgz
          REMOTE

      - name: Veřejně ověřit srpnový článek
        id: gallery_verify
        shell: bash
        run: |
          set -Eeuo pipefail
          success=false
          for attempt in $(seq 1 36); do
            token="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            curl -fsS --max-time 20 "https://nasekadan.cz/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html?verify=$token" -o /tmp/gallery-article.html || true
            curl -fsS --max-time 20 "https://nasekadan.cz/?verify=$token" -o /tmp/gallery-home.html || true
            curl -fsS --max-time 20 "https://nasekadan.cz/clanky/?verify=$token" -o /tmp/gallery-archive.html || true
            curl -fsS --max-time 20 "https://nasekadan.cz/rss.xml?verify=$token" -o /tmp/gallery-rss.xml || true
            curl -fsS --max-time 20 "https://nasekadan.cz/sitemap.xml?verify=$token" -o /tmp/gallery-sitemap.xml || true
            if grep -Fq 'Srpen v kadaňských galeriích nabídne houby' /tmp/gallery-article.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/gallery-home.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/gallery-archive.html \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/gallery-rss.xml \
              && grep -Fq 'srpen-kadanske-galerie-vystavy-workshop-2026.html' /tmp/gallery-sitemap.xml; then
              success=true
              break
            fi
            sleep 8
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          test "$success" = true

      - name: Zapsat ověření a vrátit hodinový interval
        if: always() && steps.gallery_verify.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner;
            const repo=context.repo.repo;
            const statusPath='august-galleries-live-status.json';
            const workflowPath='.github/workflows/protect-published-articles.yml';
            const status={
              status:'success',
              checked_at_utc:new Date().toISOString(),
              run_id:context.runId,
              trigger:context.eventName,
              article:'https://nasekadan.cz/clanky/srpen-kadanske-galerie-vystavy-workshop-2026.html',
              homepage:true,
              archive:true,
              rss:true,
              sitemap:true
            };
            let statusSha;
            try{const response=await github.rest.repos.getContent({owner,repo,path:statusPath,ref:'main'});if(!Array.isArray(response.data))statusSha=response.data.sha}catch(error){if(error.status!==404)throw error}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:statusPath,branch:'main',message:'Zapsat úspěšné nasazení srpnového programu galerií',content:Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64'),...(statusSha?{sha:statusSha}:{})});
            const current=await github.rest.repos.getContent({owner,repo,path:workflowPath,ref:'main'});
            if(!Array.isArray(current.data)){
              const raw=Buffer.from(current.data.content.replace(/\n/g,''),'base64').toString('utf8');
              const restored=raw.replace("- cron: '*/5 * * * *'","- cron: '23 * * * *'");
              if(restored!==raw){
                await github.rest.repos.createOrUpdateFileContents({owner,repo,path:workflowPath,branch:'main',message:'Vrátit hodinový režim ochrany publikovaných článků',content:Buffer.from(restored).toString('base64'),sha:current.data.sha});
              }
            }
