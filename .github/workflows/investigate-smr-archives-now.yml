name: Prověřit archivy a přílohy SMR Tušimice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/investigate-smr-archives-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Stáhnout, rozbalit a analyzovat veřejné podklady
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full poppler-utils unzip file
          BASE="$RUNNER_TEMP/smr"
          mkdir -p "$BASE/raw" "$BASE/extracted" "$BASE/text"
          LOG="$BASE/log.txt"
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'

          get() {
            local url="$1" out="$2" ref="${3:-}"
            echo "DOWNLOAD $out" | tee -a "$LOG"
            local args=(-fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -A "$UA")
            [[ -n "$ref" ]] && args+=(-e "$ref")
            if curl "${args[@]}" -o "$out" "$url" 2>>"$LOG"; then
              file "$out" | tee -a "$LOG"
              stat -c '%n | %s B' "$out" | tee -a "$LOG"
            else
              echo "FAILED $url" | tee -a "$LOG"
              rm -f "$out"
            fi
          }

          get 'https://portal.cenia.cz/eiasea/download/RUlBX01aUDUzMV9vem5hbWVuaURPQ180NTgwMDg3OTA3OTYyNDEzNzUxLjd6/MZP531_oznameni.7z' "$BASE/raw/MZP531_oznameni.7z"
          get 'https://portal.cenia.cz/eiasea/download/RUlBX01aUDUzMV9tZXppc3RPem5hbWVuaURPQ18yODkwNDQ1NzMzMzQ1MTU0NDgwLjd6/MZP531_mezistOznameni.7z' "$BASE/raw/MZP531_mezistOznameni.7z"

          NEN='https://nen.nipez.cz/verejne-zakazky/detail-zakazky/N006-24-V00022141/zadavaci-dokumentace'
          curl -fsSL -A "$UA" -c "$BASE/cookies" "$NEN" -o "$BASE/raw/nen.html" || true
          for x in \
            '2303464694 NEN_technicka_specifikace.docx' \
            '2303464655 NEN_harmonogram.docx' \
            '2303464663 NEN_cenova_specifikace.docx' \
            '2303464743 NEN_seznam_poddodavatelu.docx' \
            '2303464721 NEN_protiplneni.docx'; do
            set -- $x; id="$1"; name="$2"
            if curl -fL --retry 3 --connect-timeout 20 --max-time 120 -A "$UA" -e "$NEN" -b "$BASE/cookies" \
              -o "$BASE/raw/$name" "https://nen.nipez.cz/file?id=$id" 2>>"$LOG"; then
              file "$BASE/raw/$name" | tee -a "$LOG"
              if ! file "$BASE/raw/$name" | grep -qiE 'Microsoft Word|Zip archive'; then
                echo "INVALID $name" | tee -a "$LOG"; rm -f "$BASE/raw/$name"
              fi
            else
              echo "NEN_FAILED $id $name" | tee -a "$LOG"; rm -f "$BASE/raw/$name"
            fi
          done

          for a in "$BASE"/raw/*.7z; do
            [[ -f "$a" ]] || continue
            d="$BASE/extracted/$(basename "$a" .7z)"; mkdir -p "$d"
            7z x -y -o"$d" "$a" >>"$LOG" 2>&1
          done
          cp "$BASE"/raw/*.docx "$BASE/extracted/" 2>/dev/null || true
          find "$BASE/extracted" -type f -printf '%P | %s B\n' | sort > "$BASE/file-list.txt"

          python3 - "$BASE" <<'PY'
          import json,re,sys,zipfile,subprocess
          from pathlib import Path
          from xml.etree import ElementTree as ET
          base=Path(sys.argv[1]); root=base/'extracted'; out=base/'text'; out.mkdir(exist_ok=True)
          for p in root.rglob('*'):
              if not p.is_file(): continue
              rel=str(p.relative_to(root)).replace('/','__')
              try:
                  if p.suffix.lower()=='.docx':
                      pieces=[]
                      with zipfile.ZipFile(p) as z:
                          for n in z.namelist():
                              if n.startswith('word/') and n.endswith('.xml'):
                                  x=ET.fromstring(z.read(n)); pieces += [e.text for e in x.iter() if e.tag.endswith('}t') and e.text]
                      (out/(rel+'.txt')).write_text('\n'.join(pieces),encoding='utf-8')
                  elif p.suffix.lower()=='.pdf':
                      target=out/(rel+'.txt')
                      subprocess.run(['pdftotext','-layout',str(p),str(target)],check=False)
                  elif p.suffix.lower() in {'.txt','.csv'}:
                      (out/(rel+'.txt')).write_bytes(p.read_bytes())
              except Exception as e:
                  (out/(rel+'.error.txt')).write_text(repr(e),encoding='utf-8')

          keys=['harmonogram','cenová specifikace','poddodavatel','AQUATIS','vodohospodář','Nechranice','Libouš','Hradec 400','400 kV','ČEPS','vyvedení výkonu','chladicí','odběr vody','tritium','havarijní','geolog','seism','pracovníků','náklady','cena','termín','milník','Rolls-Royce','Tušimice','ETU','SMR']
          report=[]
          for p in sorted(out.glob('*.txt')):
              text=p.read_text(encoding='utf-8',errors='replace'); lines=text.splitlines(); hits=[]
              for i,line in enumerate(lines):
                  if any(k.casefold() in line.casefold() for k in keys):
                      s=re.sub(r'\s+',' ',' '.join(lines[max(0,i-1):i+2])).strip()
                      if s and s not in hits: hits.append(s[:1000])
                  if len(hits)>=45: break
              report.append({'file':p.name,'chars':len(text),'hits':hits})
          (base/'analysis.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          md=['# Rozbalené podklady SMR Tušimice','']
          for r in report:
              md += [f"## {r['file']}",f"Text: {r['chars']} znaků",'']+[f'- {x}' for x in r['hits']]+['']
          (base/'report.md').write_text('\n'.join(md),encoding='utf-8')
          print(json.dumps({'files':len(report),'matched':sum(bool(r['hits']) for r in report)},ensure_ascii=False))
          PY

          sha256sum "$BASE"/raw/* 2>/dev/null > "$BASE/hashes.txt" || true
          echo 'DONE' | tee -a "$LOG"

      - name: Uložit úplný výsledek
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smr-tusimice-archives-analysis
          path: |
            ${{ runner.temp }}/smr/log.txt
            ${{ runner.temp }}/smr/file-list.txt
            ${{ runner.temp }}/smr/hashes.txt
            ${{ runner.temp }}/smr/analysis.json
            ${{ runner.temp }}/smr/report.md
          retention-days: 30

      - name: Zapsat výsledek do issue
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        with:
          script: |
            const fs=require('fs'), b=process.env.RUNNER_TEMP+'/smr';
            const r=(p,n)=>{try{return fs.readFileSync(p,'utf8').slice(0,n)}catch{return ''}};
            const files=r(b+'/file-list.txt',18000), report=r(b+'/report.md',42000), log=r(b+'/log.txt',8000);
            const body=[`- Commit: \`${context.sha}\``,`- Běh: **${process.env.OUTCOME}**`,'','## Soubory','```text',files,'```','',report,'','## Diagnostika','```text',log,'```','', '_Úplné výstupy jsou v artefaktu `smr-tusimice-archives-analysis`._'].join('\n').slice(0,65000);
            const issue=await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:`[SMR TUŠIMICE ARCHIVY] ${new Date().toISOString()}`,body});
            if(report.length) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.data.number,state:'closed',state_reason:'completed'});

# Druhý commit záměrně spouští workflow po jeho založení.
