name: Ověřit aktuální centrální affiliate hashe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/affiliate-central-hash-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stáhnout zdroje a spočítat hashe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from datetime import datetime, timezone
          urls = {
              'database': 'https://pojistime.to/assets/affiliate-database.json',
              'overlay': 'https://pojistime.to/assets/ehub-partner-assets/brainmarket.json',
          }
          raw = {}
          for key, url in urls.items():
              req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Affiliate-audit-probe/1.0'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  raw[key] = response.read()
          db = json.loads(raw['database'])
          payload = {
              'checkedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'centralUpdatedAt': db.get('updatedAt'),
              'databaseSha256': hashlib.sha256(raw['database']).hexdigest(),
              'combinedSha256': hashlib.sha256(raw['database'] + b'\0' + raw['overlay']).hexdigest(),
              'databaseBytes': len(raw['database']),
              'overlayBytes': len(raw['overlay']),
          }
          open('affiliate-central-live-hash.json','w',encoding='utf-8').write(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          print(payload)
          PY
      - name: Uložit výsledek a uklidit workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/affiliate-central-hash-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Uložit aktuální centrální affiliate hashe [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
