name: Doplnit Památky v kapse do kulturního přehledu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-pamatky-v-kapse-current-culture.yml'
      - 'scripts/add_pamatky_v_kapse_to_culture.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-pamatky-v-kapse
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE: clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html

    steps:
      - name: Načíst aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Doplnit společnou vstupenku
        run: python3 scripts/add_pamatky_v_kapse_to_culture.py

      - name: Ověřit obsah článku
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-pamatky-v-kapse' "$ARTICLE"
          grep -Fq 'Památky v kapse: jedna vstupenka za 150 Kč na celý den' "$ARTICLE"
          grep -Fq 'Mikulovickou neboli Svatou bránu' "$ARTICLE"
          grep -Fq 'Městské muzeum v Kadani – společná vstupenka Památky v kapse' "$ARTICLE"

      - name: Uložit změnu do main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$ARTICLE"; then
            echo 'Článek už obsahuje aktuální blok.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$ARTICLE"
            git commit -m 'Doplnit Památky v kapse do kulturního přehledu'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit článek přímo na OVH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ovh_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo chown -R ubuntu:ubuntu /opt/nasekadan
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          grep -Fq 'data-pamatky-v-kapse' clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          grep -Fq 'Památky v kapse: jedna vstupenka za 150 Kč na celý den' clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          sudo install -D -m 0644 \
            clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html \
            /var/www/nasekadan/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html
          SOURCE_SHA="$(git rev-parse HEAD)"
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=direct-pamatky-v-kapse\n' \
            "$SOURCE_SHA" "$(date -u +%FT%TZ)" | sudo tee /var/www/nasekadan/deployment-health.txt >/dev/null
          REMOTE

      - name: Ověřit veřejnou stránku
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html'
          for attempt in $(seq 1 36); do
            curl -4 -kfsS --max-time 25 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "${URL}?pamatky_v_kapse=${GITHUB_RUN_ID}-${attempt}-$(date +%s)" \
              -o /tmp/culture-live.html || true
            if grep -Fq 'data-pamatky-v-kapse' /tmp/culture-live.html 2>/dev/null \
              && grep -Fq 'Památky v kapse: jedna vstupenka za 150 Kč na celý den' /tmp/culture-live.html 2>/dev/null \
              && grep -Fq 'Mikulovickou neboli Svatou bránu' /tmp/culture-live.html 2>/dev/null; then
              echo 'Památky v kapse jsou veřejně viditelné.'
              exit 0
            fi
            sleep 5
          done
          echo 'Veřejný článek nový blok nepotvrdil.' >&2
          exit 1

      - name: Zapsat stav nasazení
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = '.github/pamatky-v-kapse-live-status.json';
            const status = {
              status: process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'passed' : 'failed',
              checkedAtUtc: new Date().toISOString(),
              runId: context.runId,
              sourceSha: context.sha,
              serverDeploy: process.env.DEPLOY_OUTCOME || 'skipped',
              publicVerification: process.env.VERIFY_OUTCOME || 'skipped',
              publicUrl: 'https://nasekadan.cz/clanky/kam-v-kadani-a-okoli-27-cervence-2-srpna-2026.html'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Zapsat nasazení Památek v kapse: ${status.status} [skip ci]`,
              content,
              ...(sha ? {sha} : {})
            });
