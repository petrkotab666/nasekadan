name: Nasadit obnovu hesla statistik

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/nasekadan-stats/**'
      - '.github/workflows/deploy-stats-password-reset.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasekadan-stats-auth
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Nainstalovat bezpečné přihlášení statistik
        shell: bash
        run: |
          set -euo pipefail
          sudo bash .github/scripts/nasekadan-stats/install-stats.sh
      - name: Ověřit přihlášení a e-mailový reset
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS http://127.0.0.1:3225/healthz)"
          python3 - "$health" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get('ok') is True
          assert data.get('auth') == 'application'
          assert data.get('smtpConfigured') is True, 'SMTP pro reset hesla není nastavené'
          PY
          curl -kfsS --resolve nasekadan.cz:443:127.0.0.1 \
            https://nasekadan.cz/statistiky/ | grep -Fq 'Zapomenuté heslo'
          curl -kfsS --resolve nasekadan.cz:443:127.0.0.1 \
            https://nasekadan.cz/statistiky/zapomenute-heslo | grep -Fq 'petrkotab@seznam.cz'
          echo 'Ověřeno: vlastní přihlášení i reset pouze na petrkotab@seznam.cz jsou aktivní.'
