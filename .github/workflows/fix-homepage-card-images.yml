name: Opravit náhledové obrázky karet článků

on:
  push:
    branches: [main]
    paths:
      - '.github/fix-homepage-card-images-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-fix-homepage-card-images
  cancel-in-progress: true

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vygenerovat karty s obrázky a bez zdvojených titulků
        run: |
          set -euo pipefail
          python3 scripts/enforce_article_visibility.py
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re

          def cards(path):
              text = Path(path).read_text(encoding='utf-8')
              return re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?</article>', text, re.I | re.S)

          for path in ('index.html', 'clanky/index.html'):
              blocks = cards(path)
              if not blocks:
                  raise SystemExit(f'{path}: nebyly nalezeny karty článků')
              for block in blocks:
                  visual = re.search(r'<div\b[^>]*class="[^"]*visual[^"]*"[^>]*>.*?</div>', block, re.I | re.S)
                  if not visual or 'background-image:' not in visual.group(0):
                      raise SystemExit(f'{path}: karta bez náhledového obrázku')
                  if re.search(r'<strong\b', visual.group(0), re.I):
                      raise SystemExit(f'{path}: zdvojený titulek ve vizuálu')

          home = cards('index.html')
          for block in home[:3]:
              m = re.search(r"url\('([^']+)'\)", block)
              if not m:
                  raise SystemExit('Titulka: u jedné z prvních tří karet chybí URL obrázku')
              url = m.group(1)
              parsed = urlparse(url)
              local = parsed.path.lstrip('/') if parsed.scheme else url.lstrip('/')
              if not Path(local).is_file():
                  raise SystemExit(f'Titulka: obrázek není v repozitáři: {local}')
          print('Lokální kontrola karet a prvních tří obrázků prošla.')
          PY

      - name: Uložit opravu do repozitáře
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html clanky/index.html
          if git diff --cached --quiet; then
            echo 'Zdrojové přehledy už byly opravené.'
            exit 0
          fi
          git commit -m 'Opravit obrázky a duplicitu titulků na kartách článků'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

      - name: Připravit SSH klíč
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit opravenou titulku a archiv
        id: deploy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nk-card-fix/clanky"
          cp index.html "$RUNNER_TEMP/nk-card-fix/index.html"
          cp clanky/index.html "$RUNNER_TEMP/nk-card-fix/clanky/index.html"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r \
            "$RUNNER_TEMP/nk-card-fix" ubuntu@57.129.43.215:/tmp/nk-card-fix
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo install -d -m 0755 /var/www/nasekadan/clanky
          sudo install -m 0644 /tmp/nk-card-fix/index.html /var/www/nasekadan/index.html
          sudo install -m 0644 /tmp/nk-card-fix/clanky/index.html /var/www/nasekadan/clanky/index.html
          if sudo docker ps --format '{{.Names}}' | grep -Fxq nasekadan-web; then
            sudo docker cp /tmp/nk-card-fix/index.html nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp /tmp/nk-card-fix/clanky/index.html nasekadan-web:/usr/share/nginx/html/clanky/index.html
          fi
          rm -rf /tmp/nk-card-fix
          REMOTE

      - name: Ověřit veřejný web a skutečné obrázky
        id: verify
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in $(seq 1 24); do
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/index.html?cardfix=${stamp}-${attempt}" -o /tmp/home.html || true
            curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/index.html?cardfix=${stamp}-${attempt}" -o /tmp/archive.html || true
            if python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def check(path):
              text = Path(path).read_text(encoding='utf-8', errors='replace') if Path(path).exists() else ''
              blocks = re.findall(r'<article\b[^>]*class="[^"]*article-card[^"]*"[^>]*>.*?</article>', text, re.I | re.S)
              if len(blocks) < 3:
                  return False, []
              images = []
              for block in blocks:
                  visual = re.search(r'<div\b[^>]*class="[^"]*visual[^"]*"[^>]*>.*?</div>', block, re.I | re.S)
                  if not visual or 'background-image:' not in visual.group(0) or re.search(r'<strong\b', visual.group(0), re.I):
                      return False, []
                  m = re.search(r"url\('([^']+)'\)", visual.group(0))
                  if m:
                      images.append(m.group(1))
              return True, images[:3]

          ok_home, images = check('/tmp/home.html')
          ok_archive, _ = check('/tmp/archive.html')
          if not (ok_home and ok_archive and len(images) == 3):
              raise SystemExit(1)
          for image in images:
              url = image if image.startswith('http') else 'https://nasekadan.cz/' + image.lstrip('/')
              subprocess.run(['curl','-4','-kfsSI','--max-time','20',url], check=True, stdout=subprocess.DEVNULL)
          PY
            then
              echo 'Veřejná titulka i archiv mají obrázky, bez zdvojených titulků, a první tři obrázky odpovídají.'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Zapsat stav opravy
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const path = 'homepage-card-images-status.json';
            const ok = process.env.DEPLOY === 'success' && process.env.VERIFY === 'success';
            const status = {
              status: ok ? 'success' : 'failed',
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              run_id: context.runId,
              server_deploy: process.env.DEPLOY || 'skipped',
              public_verification: process.env.VERIFY || 'skipped'
            };
            const content = Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',
              message:`Zapsat stav opravy náhledů článků: ${status.status}`,
              content,...(sha?{sha}:{})
            });
