name: Prohledat všechna dokumentová média Hossnerova webu

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scan-hossner-media-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Vypsat a stáhnout všechna dokumentová média
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ces
          python3 -m pip install --quiet requests
          mkdir -p media-output/files media-output/text
          cat > /tmp/scan.py <<'PY'
          import json,re,requests,subprocess,hashlib,urllib.parse
          from pathlib import Path
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 NaseKadan document research'
          out=Path('media-output'); media=[]
          for page in range(1,30):
              r=s.get(f'https://petrhossnerkadan.cz/wp-json/wp/v2/media?per_page=100&page={page}',timeout=60)
              if r.status_code==400: break
              r.raise_for_status(); arr=r.json()
              if not arr: break
              media.extend(arr)
              if len(arr)<100: break
          docs=[]
          for m in media:
              url=m.get('source_url',''); mime=m.get('mime_type','')
              if mime.startswith('application/') or re.search(r'\.(pdf|docx?|rtf|txt)(?:\?|$)',url,re.I):
                  docs.append({'id':m.get('id'),'date':m.get('date'),'modified':m.get('modified'),'slug':m.get('slug'),'title':(m.get('title') or {}).get('rendered'),'caption':(m.get('caption') or {}).get('rendered'),'description':(m.get('description') or {}).get('rendered'),'post':m.get('post'),'mime_type':mime,'url':url})
          (out/'all-document-media.json').write_text(json.dumps(docs,ensure_ascii=False,indent=2),encoding='utf-8')
          hits=[]
          for i,d in enumerate(docs,1):
              url=d['url']
              try:
                  r=s.get(url,timeout=90); r.raise_for_status(); data=r.content
                  name=Path(urllib.parse.urlparse(url).path).name or f'doc-{i}'
                  name=re.sub(r'[^A-Za-z0-9._-]+','_',urllib.parse.unquote(name))
                  p=out/'files'/name; p.write_bytes(data)
                  text=''
                  if p.suffix.lower()=='.pdf':
                      q=subprocess.run(['pdftotext','-layout',str(p),'-'],capture_output=True,text=True); text=q.stdout
                      if len(re.sub(r'\s+','',text))<100 and len(data)<15000000:
                          tmp=Path('/tmp')/('ocr-'+hashlib.sha1(url.encode()).hexdigest()[:8]); tmp.mkdir(exist_ok=True)
                          subprocess.run(['pdftoppm','-f','1','-l','80','-r','150','-jpeg',str(p),str(tmp/'p')],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                          parts=[]
                          for img in sorted(tmp.glob('p-*.jpg')):
                              z=subprocess.run(['tesseract',str(img),'stdout','-l','ces+eng','--psm','6'],capture_output=True,text=True); parts.append(z.stdout)
                          text='\n'.join(parts)
                  (out/'text'/(name+'.txt')).write_text(text,encoding='utf-8',errors='replace')
                  combined=' '.join(str(d.get(k) or '') for k in d)+' '+text
                  pats=['tőgl','tögl','togel','tógl','vladimír','24. 7. 2024','24.7.2024','souběh funkcí','dodatečným schválením','právní stanovisko']
                  found=[x for x in pats if x.lower() in combined.lower()]
                  if found: hits.append({**d,'file':str(p),'bytes':len(data),'found':found,'snippet':re.sub(r'\s+',' ',text)[:5000]})
              except Exception as e:
                  d['error']=repr(e)
          (out/'hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'MEDIA_TOTAL={len(media)} DOCUMENTS={len(docs)} HITS={len(hits)}')
          print('===== DOCUMENT MEDIA =====')
          for d in docs: print(json.dumps(d,ensure_ascii=False))
          print('===== HITS =====')
          print(json.dumps(hits,ensure_ascii=False,indent=2))
          PY
          python3 /tmp/scan.py
      - name: Uložit výsledek
        uses: actions/upload-artifact@v4
        with:
          name: hossner-document-media
          path: media-output
          retention-days: 1
