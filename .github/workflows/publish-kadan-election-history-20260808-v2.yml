name: Publikovat historii komunálních voleb Kadaň 2026 v2

on:
  push:
    branches: [main]
    paths:
      - 'data/publish-kadan-elections-20260808-v2.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-kadan-election-history-20260808-v2
  cancel-in-progress: false

env:
  SLUG: komunalni-volby-kadan-historie-1990-2026
  ARTICLE_URL: https://nasekadan.cz/clanky/komunalni-volby-kadan-historie-1990-2026.html
  TITLE: '36 let komunálních voleb v Kadani: vítězové, čtyři starostové, kupování hlasů i boj o rok 2026'
  OVH_KEY_A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  OVH_KEY_B: ${{ secrets.KEY_OVH_SSH_PRIVATE_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vygenerovat článek, PNG a všechny publikační povrchy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          git config user.name 'Naše Kadaň – historie voleb'
          git config user.email 'info@nasekadan.cz'
          success=0
          for attempt in 1 2 3 4 5; do
            git fetch --prune origin main
            git reset --hard origin/main
            export ARTICLE_SOURCE_COMMIT="$(git rev-parse HEAD)"
            python3 scripts/publish_kadan_election_history_20260808_v2.py
            git diff --check
            git add "clanky/$SLUG.html" "social/$SLUG.png" \
              index.html clanky/index.html clanky/strana-*.html \
              rss.xml sitemap.xml news-sitemap.xml llms.txt \
              data/published-content-index.json data/article-integrity-manifest.json
            if git diff --cached --quiet; then
              success=1
              break
            fi
            git commit -m 'Dokončit publikaci 36 let komunálních voleb v Kadani'
            if git push origin HEAD:main; then
              success=1
              break
            fi
            sleep $((attempt * 3))
          done
          [[ "$success" == 1 ]]
          git fetch --prune origin main
          git reset --hard origin/main
          test -f "clanky/$SLUG.html"
          test -f "social/$SLUG.png"
          grep -Fq "data-latest-article-href=\"/clanky/$SLUG.html\"" index.html
          grep -Fq "$SLUG.html" clanky/index.html
          grep -Fq "$ARTICLE_URL" rss.xml
          grep -Fq "$ARTICLE_URL" sitemap.xml
          grep -Fq "$ARTICLE_URL" news-sitemap.xml
          grep -Fq "$SLUG.html" llms.txt
          echo "DEPLOYED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -euo pipefail
          key="${OVH_KEY_A:-${OVH_KEY_B:-}}"
          test -n "$key"
          printf '%s\n' "$key" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit celý aktuální main na OVH
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=research --exclude=node_modules -czf "$RUNNER_TEMP/nasekadan-main.tgz" .
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/nasekadan-main.tgz" ubuntu@57.129.43.215:/tmp/nasekadan-election-final.tgz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          work=/tmp/nasekadan-election-final
          rm -rf "$work"
          mkdir -p "$work"
          tar -xzf /tmp/nasekadan-election-final.tgz -C "$work"
          chmod +x "$work/deploy/sync-production.sh"
          sudo env GITHUB_WORKSPACE="$work" NASEKADAN_SKIP_AUTOMATION_INSTALL=1 bash "$work/deploy/sync-production.sh"
          rm -rf "$work" /tmp/nasekadan-election-final.tgz
          REMOTE

      - name: Veřejně ověřit článek a kanály
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 15); do
            q="final-${GITHUB_RUN_ID}-$(date +%s)-$attempt"
            article="$(curl -4 -kfsSL --max-time 35 "$ARTICLE_URL?v=$q" || true)"
            home="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/?v=$q" || true)"
            archive="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/clanky/?v=$q" || true)"
            rss="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/rss.xml?v=$q" || true)"
            sitemap="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/sitemap.xml?v=$q" || true)"
            news="$(curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/news-sitemap.xml?v=$q" || true)"
            ok=1
            grep -Fq "<h1>$TITLE</h1>" <<<"$article" || ok=0
            grep -Fq 'Právní paradox roku 2010' <<<"$article" || ok=0
            grep -Fq 'A co rok 2026? Kadaň jde do voleb po změně politické mapy' <<<"$article" || ok=0
            grep -Fq "social/$SLUG.png" <<<"$article" || ok=0
            grep -Fq "data-latest-article-href=\"/clanky/$SLUG.html\"" <<<"$home" || ok=0
            grep -Fq "$SLUG.html" <<<"$archive" || ok=0
            [[ "$(grep -Fc "<link>$ARTICLE_URL</link>" <<<"$rss")" == 1 ]] || ok=0
            [[ "$(grep -Fc "<loc>$ARTICLE_URL</loc>" <<<"$sitemap")" == 1 ]] || ok=0
            [[ "$(grep -Fc "<loc>$ARTICLE_URL</loc>" <<<"$news")" == 1 ]] || ok=0
            if [[ "$ok" == 1 ]]; then success=1; break; fi
            sleep 4
          done
          [[ "$success" == 1 ]]
          curl -4 -kfsSL --max-time 35 "https://nasekadan.cz/social/$SLUG.png?v=${GITHUB_RUN_ID}" -o /tmp/social.png
          python3 - <<'PY'
          from PIL import Image
          with Image.open('/tmp/social.png') as im:
              assert im.format == 'PNG'
              assert im.size == (1200, 630)
          PY
          echo 'HOTOVO: dnešní článek je veřejně publikovaný na titulce, v archivu, RSS a sitemapách.'
