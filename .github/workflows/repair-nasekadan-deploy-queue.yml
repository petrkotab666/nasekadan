name: Opravit frontu nasazení Naše Kadaň
run-name: Diagnostika runneru a restart produkčního deploye

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-nasekadan-deploy-queue.yml'
      - '.github/repair-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: nasekadan-deploy-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prověřit runnery, vyčistit frontu a spustit nový deploy
        id: repair
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const report = {
              checked_at_utc: new Date().toISOString(),
              trigger_commit: context.sha,
              runners: [],
              cancelled_runs: [],
              dispatch: null,
              latest_deploy_run: null,
              errors: []
            };

            try {
              const runners = await github.paginate(github.rest.actions.listSelfHostedRunnersForRepo, {
                owner, repo, per_page: 100
              });
              report.runners = runners.map(r => ({
                id: r.id,
                name: r.name,
                os: r.os,
                status: r.status,
                busy: r.busy,
                labels: (r.labels || []).map(l => l.name)
              }));
            } catch (error) {
              report.errors.push(`list-runners: ${error.status || ''} ${error.message}`);
            }

            for (const workflow_id of ['deploy-ovh.yml', 'emergency-deploy-ovh.yml']) {
              try {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id, branch: 'main', per_page: 100
                });
                for (const run of runs) {
                  if (['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status)) {
                    try {
                      await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                      report.cancelled_runs.push({ id: run.id, workflow_id, status: run.status, head_sha: run.head_sha });
                    } catch (error) {
                      if (error.status !== 409) report.errors.push(`cancel-${run.id}: ${error.status || ''} ${error.message}`);
                    }
                  }
                }
              } catch (error) {
                report.errors.push(`list-runs-${workflow_id}: ${error.status || ''} ${error.message}`);
              }
            }

            await new Promise(resolve => setTimeout(resolve, 5000));

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'deploy-ovh.yml', ref: 'main'
              });
              report.dispatch = { workflow: 'deploy-ovh.yml', ref: 'main', created: true };
            } catch (error) {
              report.dispatch = { workflow: 'deploy-ovh.yml', ref: 'main', created: false };
              report.errors.push(`dispatch: ${error.status || ''} ${error.message}`);
            }

            await new Promise(resolve => setTimeout(resolve, 25000));

            try {
              const latest = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'deploy-ovh.yml', branch: 'main', per_page: 5
              });
              const run = latest.data.workflow_runs?.[0];
              if (run) {
                report.latest_deploy_run = {
                  id: run.id,
                  status: run.status,
                  conclusion: run.conclusion,
                  event: run.event,
                  head_sha: run.head_sha,
                  created_at: run.created_at,
                  updated_at: run.updated_at,
                  html_url: run.html_url
                };
              }
            } catch (error) {
              report.errors.push(`latest-run: ${error.status || ''} ${error.message}`);
            }

            const path = 'runner-diagnostic.json';
            const content = Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main',
              message: 'Zapsat diagnostiku produkčního runneru',
              content,
              ...(sha ? { sha } : {})
            });

            core.setOutput('online', String(report.runners.some(r => r.status === 'online')));
            core.setOutput('runner_count', String(report.runners.length));
            core.setOutput('cancelled_count', String(report.cancelled_runs.length));
            core.setOutput('dispatch_created', String(report.dispatch?.created === true));
            core.setOutput('latest_status', String(report.latest_deploy_run?.status || 'unknown'));

      - name: Shrnutí
        shell: bash
        env:
          ONLINE: ${{ steps.repair.outputs.online }}
          RUNNER_COUNT: ${{ steps.repair.outputs.runner_count }}
          CANCELLED_COUNT: ${{ steps.repair.outputs.cancelled_count }}
          DISPATCH_CREATED: ${{ steps.repair.outputs.dispatch_created }}
          LATEST_STATUS: ${{ steps.repair.outputs.latest_status }}
        run: |
          echo "Počet runnerů: $RUNNER_COUNT"
          echo "Některý runner online: $ONLINE"
          echo "Zrušené staré běhy: $CANCELLED_COUNT"
          echo "Nový deploy spuštěn: $DISPATCH_CREATED"
          echo "Stav nejnovějšího deploye po 25 sekundách: $LATEST_STATUS"
          test "$DISPATCH_CREATED" = true
