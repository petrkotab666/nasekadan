name: Pojistka viditelnosti článků – pouze audit

# DŮLEŽITÉ: tento workflow NESMÍ měnit main ani produkční /var/www.
# Jediným zdrojem produkčního obsahu je kanonický deploy aktuálního main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'clanky/**'
      - 'index.html'
      - 'rss.xml'
      - 'sitemap.xml'
      - 'news-sitemap.xml'
      - 'images/clanky/**'
      - 'social/**'
      - 'scripts/enforce_article_visibility.py'
      - '.github/workflows/article-visibility-guard.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: article-visibility-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ověřit zdroj bez jakéhokoli zápisu
        shell: bash
        run: |
          set -euo pipefail
          mp='mestska-policie-kadan-fakta-diskuse-2026.html'
          gym='gymnastika-kadan-treneri-prosinec-2026.html'
          eso='eso-market-rafanda-kadan-24-7.html'

          test -f "clanky/$mp"
          test -f "clanky/$gym"
          test -f "clanky/$eso"
          test -f images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp
          test -f images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp
          test -f images/clanky/eso-market-rafanda/pravidla-platba-kamery-v2.webp

          grep -Fq "data-latest-article-href=\"/clanky/$mp\"" index.html
          grep -Fq "/clanky/$gym" index.html
          grep -Fq "/clanky/$eso" index.html
          grep -Fq "/clanky/$mp" clanky/index.html
          grep -Fq "/clanky/$gym" clanky/index.html
          grep -Fq "/clanky/$eso" clanky/index.html
          grep -Fq "https://nasekadan.cz/clanky/$mp" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/$gym" rss.xml
          grep -Fq "https://nasekadan.cz/clanky/$eso" rss.xml

          python3 -m py_compile scripts/enforce_article_visibility.py
          git diff --exit-code
          echo 'OK: zdrojový main je konzistentní. Audit nic nemění.'

      - name: Ověřit veřejný web bez opravování
        shell: bash
        run: |
          set -euo pipefail
          base='https://nasekadan.cz'
          mp='mestska-policie-kadan-fakta-diskuse-2026.html'
          gym='gymnastika-kadan-treneri-prosinec-2026.html'
          eso='eso-market-rafanda-kadan-24-7.html'
          q="audit-${GITHUB_RUN_ID}-$(date +%s)"

          curl -4 -kfsSL --max-time 40 "$base/?$q" -o /tmp/home.html
          curl -4 -kfsSL --max-time 40 "$base/clanky/?$q" -o /tmp/archive.html
          curl -4 -kfsSL --max-time 40 "$base/clanky/$eso?$q" -o /tmp/eso.html
          curl -4 -kfsSL --max-time 40 "$base/images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp?$q" -o /tmp/eso1.webp
          curl -4 -kfsSL --max-time 40 "$base/images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp?$q" -o /tmp/eso2.webp
          curl -4 -kfsSL --max-time 40 "$base/images/clanky/eso-market-rafanda/pravidla-platba-kamery-v2.webp?$q" -o /tmp/eso3.webp

          grep -Fq "data-latest-article-href=\"/clanky/$mp\"" /tmp/home.html
          grep -Fq "/clanky/$gym" /tmp/home.html
          grep -Fq "/clanky/$eso" /tmp/archive.html
          grep -Fq '/images/clanky/eso-market-rafanda/prodejna-rafanda-24-7.webp' /tmp/eso.html
          grep -Fq '/images/clanky/eso-market-rafanda/navod-vstup-nakup-odchod.webp' /tmp/eso.html
          grep -Fq '/images/clanky/eso-market-rafanda/pravidla-platba-kamery-v2.webp' /tmp/eso.html
          test -s /tmp/eso1.webp
          test -s /tmp/eso2.webp
          test -s /tmp/eso3.webp
          echo 'OK: veřejný web je aktuální a všechny tři fotografie Rafandy jsou dostupné.'

      - name: Nahlásit regresi bez zásahu do produkce
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[incident] Regrese článků nebo fotografií – audit only'
          body="Audit zjistil rozdíl mezi kanonickým main a živým webem. Tento workflow produkci záměrně neopravuje ani nepřepisuje. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
