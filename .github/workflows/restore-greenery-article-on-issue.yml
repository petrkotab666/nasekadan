name: Obnovit zmizelý článek o sečení

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: restore-greenery-article-production
  cancel-in-progress: true

env:
  SLUG: sekani-travniku-kadan-spravci-vysky-2026
  ARTICLE: clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  PUBLIC_URL: https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'petrkotab666' && github.event.issue.title == '[repair] restore greenery article')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vrátit článek na titulní stranu
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ensure_greenery_homepage.py
          test -s "$ARTICLE"
          grep -Fq 'Sedm centimetrů i dvě seče ročně' "$ARTICLE"
          grep -Fq 'data-auto-article="sekani-travniku-kadan-spravci-vysky-2026"' index.html
          grep -Fq '/clanky/sekani-travniku-kadan-spravci-vysky-2026.html' clanky/index.html

      - name: Uložit trvalou opravu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň opravný automat'
          git config user.email 'info@nasekadan.cz'
          git add index.html scripts/ensure_greenery_homepage.py
          if ! git diff --cached --quiet; then
            git commit -m 'Vrátit článek o sečení na titulní stranu [skip ci]'
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 4 ]] && exit 1
              sleep $((attempt * 4))
            done
          fi

      - name: Připravit SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"; break; fi
          done
          test -s "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"

      - name: Nasadit článek, titulní stranu a archiv
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/greenery-ui.tar.gz" "$ARTICLE" index.html clanky/index.html
          scp -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/greenery-ui.tar.gz" ubuntu@57.129.43.215:/tmp/greenery-ui.tar.gz
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo tar -xzf /tmp/greenery-ui.tar.gz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/greenery-ui.tar.gz nasekadan-web:/tmp/greenery-ui.tar.gz
            sudo docker exec nasekadan-web tar -xzf /tmp/greenery-ui.tar.gz -C /usr/share/nginx/html
            sudo docker exec nasekadan-web rm -f /tmp/greenery-ui.tar.gz
          fi
          grep -Fq 'Sedm centimetrů i dvě seče ročně' /var/www/nasekadan/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
          grep -Fq 'data-auto-article="sekani-travniku-kadan-spravci-vysky-2026"' /var/www/nasekadan/index.html
          rm -f /tmp/greenery-ui.tar.gz
          REMOTE

      - name: Veřejně ověřit článek, titulku a archiv
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          article_ok=false; home_ok=false; archive_ok=false
          for attempt in $(seq 1 15); do
            article="$(curl -4 -kfsS --max-time 25 "${PUBLIC_URL}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            grep -Fq 'Sedm centimetrů i dvě seče ročně' <<<"$article" && article_ok=true || article_ok=false
            grep -Fq "$SLUG" <<<"$home" && home_ok=true || home_ok=false
            grep -Fq "$SLUG" <<<"$archive" && archive_ok=true || archive_ok=false
            if [[ "$article_ok" == true && "$home_ok" == true && "$archive_ok" == true ]]; then
              echo 'ok=true' >> "$GITHUB_OUTPUT"
              echo 'article=true' >> "$GITHUB_OUTPUT"
              echo 'home=true' >> "$GITHUB_OUTPUT"
              echo 'archive=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo 'ok=false' >> "$GITHUB_OUTPUT"
          echo "article=$article_ok" >> "$GITHUB_OUTPUT"
          echo "home=$home_ok" >> "$GITHUB_OUTPUT"
          echo "archive=$archive_ok" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Zapsat výsledek do issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFIED: ${{ steps.verify.outputs.ok }}
          ARTICLE_OK: ${{ steps.verify.outputs.article }}
          HOME_OK: ${{ steps.verify.outputs.home }}
          ARCHIVE_OK: ${{ steps.verify.outputs.archive }}
        with:
          script: |
            const ok = process.env.DEPLOY === 'success' && process.env.VERIFIED === 'true';
            const body = ok
              ? '✅ Článek o sečení je znovu veřejný, vrácený na titulní stranu a viditelný v archivu.\n\nhttps://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html'
              : `❌ Obnova nebyla potvrzena. Nasazení: ${process.env.DEPLOY || 'unknown'}; článek: ${process.env.ARTICLE_OK || 'false'}; titulní strana: ${process.env.HOME_OK || 'false'}; archiv: ${process.env.ARCHIVE_OK || 'false'}.`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});
