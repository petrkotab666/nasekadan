name: Obnovit zmizelý článek o sečení

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: restore-greenery-article-production
  cancel-in-progress: true

env:
  SLUG: sekani-travniku-kadan-spravci-vysky-2026
  ARTICLE: clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  PUBLIC_URL: https://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'petrkotab666' && github.event.issue.title == '[repair] restore greenery article')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Obnovit záznam článku na titulní straně
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ensure_greenery_homepage.py
          grep -Fq 'data-auto-article="sekani-travniku-kadan-spravci-vysky-2026"' index.html
          grep -Fq 'href="/clanky/sekani-travniku-kadan-spravci-vysky-2026.html"' index.html
          grep -Fq '<p class="aside-date">1. 8. 2026 v 11:00</p>' index.html

      - name: Uložit trvalou opravu titulní strany
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň opravný automat'
          git config user.email 'info@nasekadan.cz'
          git add index.html scripts/ensure_greenery_homepage.py
          if ! git diff --cached --quiet; then
            git commit -m 'Vrátit článek o sečení na titulní stranu [skip ci]'
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
              [[ "$attempt" == 4 ]] && exit 1
              sleep $((attempt * 4))
            done
          fi

      - name: Připravit článek a aktuální přehledy
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ARTICLE"
          grep -Fq 'Sedm centimetrů i dvě seče ročně' "$ARTICLE"
          files=("$ARTICLE" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml llms.txt site.js)
          for file in "${files[@]}"; do test -s "$file"; done
          social="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('clanky/sekani-travniku-kadan-spravci-vysky-2026.html').read_text(encoding='utf-8')
          m=re.search(r'https://nasekadan\.cz/(social/[^\"?]+)',text)
          print(m.group(1) if m else '')
          PY
          )"
          if [[ -n "$social" && -f "$social" ]]; then files+=("$social"); fi
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/greenery-files.txt"
          tar -czf "$RUNNER_TEMP/greenery-restore.tar.gz" -T "$RUNNER_TEMP/greenery-files.txt"
          echo "social=$social" >> "$GITHUB_OUTPUT"

      - name: Připravit SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"; break; fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit aktuální soubory na produkci
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/greenery-restore.tar.gz" ubuntu@57.129.43.215:/tmp/greenery-restore.tar.gz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo tar -xzf /tmp/greenery-restore.tar.gz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/greenery-restore.tar.gz nasekadan-web:/tmp/greenery-restore.tar.gz
            sudo docker exec nasekadan-web tar -xzf /tmp/greenery-restore.tar.gz -C /usr/share/nginx/html
            sudo docker exec nasekadan-web rm -f /tmp/greenery-restore.tar.gz
          fi
          grep -Fq 'Sedm centimetrů i dvě seče ročně' /var/www/nasekadan/clanky/sekani-travniku-kadan-spravci-vysky-2026.html
          grep -Fq 'data-auto-article="sekani-travniku-kadan-spravci-vysky-2026"' /var/www/nasekadan/index.html
          rm -f /tmp/greenery-restore.tar.gz
          REMOTE

      - name: Veřejně ověřit návrat článku
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          ok=false
          for attempt in $(seq 1 15); do
            article="$(curl -4 -kfsS --max-time 25 "${PUBLIC_URL}?v=${stamp}-${attempt}" 2>/dev/null || true)"
            home="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            archive="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/clanky/?v=${stamp}-${attempt}" 2>/dev/null || true)"
            rss="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/rss.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            sitemap="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            news="$(curl -4 -kfsS --max-time 25 "https://nasekadan.cz/news-sitemap.xml?v=${stamp}-${attempt}" 2>/dev/null || true)"
            if grep -Fq 'Sedm centimetrů i dvě seče ročně' <<<"$article" \
              && grep -Fq "$SLUG" <<<"$home" \
              && grep -Fq "$SLUG" <<<"$archive" \
              && grep -Fq "$SLUG" <<<"$rss" \
              && grep -Fq "$SLUG" <<<"$sitemap" \
              && grep -Fq "$SLUG" <<<"$news"; then
              ok=true
              break
            fi
            sleep 6
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [[ "$ok" == true ]]

      - name: Zapsat výsledek do issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFIED: ${{ steps.verify.outputs.ok }}
        with:
          script: |
            const ok = process.env.DEPLOY === 'success' && process.env.VERIFIED === 'true';
            const body = ok
              ? '✅ Článek o sečení je znovu veřejný a vrácený na titulní stranu. Ověřen je článek, titulní stránka, archiv, RSS, sitemap i news sitemap.\n\nhttps://nasekadan.cz/clanky/sekani-travniku-kadan-spravci-vysky-2026.html'
              : `❌ Obnova nebyla potvrzena. Nasazení: ${process.env.DEPLOY || 'unknown'}, veřejná kontrola: ${process.env.VERIFIED || 'false'}.`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});
