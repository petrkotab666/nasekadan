name: Opravit popis odběru krvetvorných buněk

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-donor-wording-now-20260803.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      ARTICLE: clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
      EXPECTED: Krvetvorné buňky jí odebrali pomocí separátoru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit článek i publikační skript
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/fix_donor_article_wording_20260803.py
          grep -Fq "<h2>${EXPECTED}</h2>" "$ARTICLE"
          grep -Fq 'Při samotném odběru proudila krev přes separátor' "$ARTICLE"
          ! grep -Fq 'Samotný odběr proběhl ze' "$ARTICLE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ARTICLE" scripts/publish_darci_krvetvornych_bunek_20260803.py
          git commit -m 'Opravit popis odběru krvetvorných buněk'
          git push origin HEAD:main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Nasadit opravený článek
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$ARTICLE" ubuntu@57.129.43.215:/tmp/donor-article-wording-fixed.html
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 "EXPECTED='$EXPECTED' bash -s" <<'REMOTE'
          set -euo pipefail
          root=/var/www/nasekadan/clanky
          sudo install -m 0644 /tmp/donor-article-wording-fixed.html "$root/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/donor-article-wording-fixed.html nasekadan-web:/usr/share/nginx/html/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
          fi
          html="$(curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 'https://nasekadan.cz/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html?wordingfix=1')"
          grep -Fq "<h2>${EXPECTED}</h2>" <<<"$html"
          grep -Fq 'Při samotném odběru proudila krev přes separátor' <<<"$html"
          ! grep -Fq 'Samotný odběr proběhl ze' <<<"$html"
          rm -f /tmp/donor-article-wording-fixed.html
          REMOTE

      - name: Ověřit zvenku
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -4 -kfsS -L --max-time 30 'https://nasekadan.cz/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html?external-wordingfix='"$GITHUB_RUN_ID")"
          grep -Fq "<h2>${EXPECTED}</h2>" <<<"$html"
          grep -Fq 'Při samotném odběru proudila krev přes separátor' <<<"$html"
          ! grep -Fq 'Samotný odběr proběhl ze' <<<"$html"

      - name: Zapsat stav opravy
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ steps.patch.outputs.source_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const deploy=process.env.DEPLOY_OUTCOME||'skipped';
            const verify=process.env.VERIFY_OUTCOME||'skipped';
            const status=deploy==='success'&&verify==='success'?'success':'failure';
            const payload={status,run_id:String(context.runId),source_sha:process.env.SOURCE_SHA||'',checked_at:new Date().toISOString(),deploy,external_verify:verify,old_wording_present:false,new_wording_present:status==='success'};
            let sha;
            try { const old=await github.rest.repos.getContent({owner,repo,path:'.github/donor-wording-fix-status.json',ref:'main'}); sha=old.data.sha; }
            catch(e){ if(e.status!==404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'.github/donor-wording-fix-status.json',branch:'main',message:`Zapsat stav opravy formulace: ${status} [skip ci]`,sha,content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64')});
