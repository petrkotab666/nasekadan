name: Prověřit přímé rozhraní společných statistik

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-multisite-server-direct.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Připravit SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/key"; break; fi
          done
          test -s "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"

      - name: Načíst přímé odpovědi služby
        shell: bash
        run: |
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' > "$RUNNER_TEMP/out.txt" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          echo '--- SERVICE ---'
          systemctl is-active multisite-stats.service || true
          echo '--- TRACKER ---'
          curl -fsS --max-time 5 http://127.0.0.1:3226/tracker.js || true
          echo
          echo '--- ROOT HOST HEADER ---'
          curl -fsS --max-time 5 -H 'X-Stats-Host: dobreklima.cz' http://127.0.0.1:3226/ | grep -Eo '<title>[^<]+|Statistiky webu [^<]+' | head -n 10 || true
          echo '--- ROOT QUERY SITE ---'
          curl -fsS --max-time 5 'http://127.0.0.1:3226/?site=dobreklima.cz' | grep -Eo '<title>[^<]+|Statistiky webu [^<]+' | head -n 10 || true
          echo '--- ROOT QUERY HOST + HEADER ---'
          curl -fsS --max-time 5 -H 'X-Stats-Host: dilynazakazku.cz' 'http://127.0.0.1:3226/?site=dobreklima.cz' | grep -Eo '<title>[^<]+|Statistiky webu [^<]+' | head -n 10 || true
          echo '--- NGINX NASEKADAN BLOCKS ---'
          sudo nginx -T 2>/dev/null | grep -nE 'server_name .*nasekadan|_nkstats|multisite-statistiky' | head -n 80 || true
          REMOTE

      - name: Zapsat výsledek
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); let out='';
            try { out=fs.readFileSync(`${process.env.RUNNER_TEMP}/out.txt`,'utf8'); } catch {}
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,
              title:`[MULTISITE DIRECT] ${new Date().toISOString()}`,
              body:'```text\n'+out.slice(-30000).replace(/```/g,'---')+'\n```'});
