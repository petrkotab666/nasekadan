name: Ověření SEO a AI sestavení

on:
  push:
    branches:
      - seo-ai-indexing-20260725

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ověřit generátor a výstupy
        run: |
          python -m py_compile scripts/prepare_discovery.py
          python scripts/prepare_discovery.py
          python scripts/prepare_discovery.py
          python - <<'PY'
          from pathlib import Path
          import json, re
          import xml.etree.ElementTree as ET

          root = Path('.')
          ET.parse(root / 'sitemap.xml')
          ET.parse(root / 'news-sitemap.xml')

          assert (root / 'llms.txt').read_text(encoding='utf-8').startswith('# Naše Kadaň')
          assert 'news-sitemap.xml' in (root / 'robots.txt').read_text(encoding='utf-8')
          assert 'data-nasekadan-discovery="1"' in (root / 'index.html').read_text(encoding='utf-8')

          for path in root.rglob('*.html'):
              if any(part in {'.git', '.github', '.image-parts', 'nahled', 'scripts', 'tools'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              for raw in re.findall(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', text, re.I | re.S):
                  json.loads(raw)

          for path in (root / 'nahled').glob('*.html') if (root / 'nahled').exists() else []:
              assert 'data-nasekadan-discovery="1"' not in path.read_text(encoding='utf-8')
          PY

      - name: Sestavit produkční image
        run: docker build -t nasekadan-seo-test .

      - name: Ověřit produkční soubory v image
        run: |
          cid=$(docker create nasekadan-seo-test)
          docker cp "$cid:/usr/share/nginx/html/robots.txt" /tmp/robots.txt
          docker cp "$cid:/usr/share/nginx/html/news-sitemap.xml" /tmp/news-sitemap.xml
          docker cp "$cid:/usr/share/nginx/html/llms.txt" /tmp/llms.txt
          docker cp "$cid:/usr/share/nginx/html/4779abb8964b2f9f65ae960f08f74e6a.txt" /tmp/indexnow-key.txt
          docker rm "$cid"
          grep -q 'news-sitemap.xml' /tmp/robots.txt
          grep -q '<news:news>' /tmp/news-sitemap.xml
          grep -q '^# Naše Kadaň' /tmp/llms.txt
          grep -q '^4779abb8964b2f9f65ae960f08f74e6a$' /tmp/indexnow-key.txt
