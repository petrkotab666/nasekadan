name: Vrátit klášter a doplnit výzvu dárcům

on:
  push:
    branches: [main]
    paths:
      - 'scripts/restore_klaster_and_donor_appeal_20260803.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-klaster-donor-appeal-20260803
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KLASTER_REL: /clanky/alzbetinsky-klaster-kadan-pacienti-lecebna-1966.html
      DONOR_REL: /clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
      KLASTER_H1: Kam odešli poslední pacienti? Skrytý příběh kadaňského kláštera
      APPEAL_H2: Dejte někomu šanci na další život
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Opravit zdrojové a veřejné soubory
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/restore_klaster_and_donor_appeal_20260803.py
          test "$(grep -o 'data-auto-article="alzbetinsky-klaster-kadan-pacienti-lecebna-1966"' index.html | wc -l)" -eq 1
          grep -Fq "$KLASTER_REL" index.html
          grep -Fq '/pocasi.js' index.html
          grep -Fq 'data-donor-appeal="1"' clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
          grep -Fq "<h2>${APPEAL_H2}</h2>" clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html
          grep -Fq 'restore_klaster_and_donor_appeal_20260803.py' scripts/publish_darci_krvetvornych_bunek_20260803.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html scripts/publish_darci_krvetvornych_bunek_20260803.py
          git commit -m 'Vrátit článek o klášteře a doplnit výzvu dárcům'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3
            git fetch origin main
            git rebase origin/main
          done
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Nasadit malý opravný balíček
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"
          bundle="$RUNNER_TEMP/klaster-donor-repair"
          mkdir -p "$bundle/clanky"
          cp index.html "$bundle/index.html"
          cp clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html "$bundle/clanky/"
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -r "$bundle" ubuntu@57.129.43.215:/tmp/klaster-donor-repair
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 "KLASTER_REL='$KLASTER_REL' DONOR_REL='$DONOR_REL' KLASTER_H1='$KLASTER_H1' APPEAL_H2='$APPEAL_H2' bash -s" <<'REMOTE'
          set -euo pipefail
          src=/tmp/klaster-donor-repair
          root=/var/www/nasekadan
          sudo install -m 0644 "$src/index.html" "$root/index.html"
          sudo install -m 0644 "$src/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html" "$root/clanky/"
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp "$src/index.html" nasekadan-web:/usr/share/nginx/html/index.html
            sudo docker cp "$src/clanky/zaregistrovala-se-v-kadani-darovala-krvetvorne-bunky-2026.html" nasekadan-web:/usr/share/nginx/html/clanky/
          fi
          check(){ curl -kfsS --max-time 25 --resolve nasekadan.cz:443:127.0.0.1 "https://nasekadan.cz$1?repair=$(date +%s)"; }
          home="$(check '/')"
          donor="$(check "$DONOR_REL")"
          klaster="$(check "$KLASTER_REL")"
          archive="$(check '/clanky/')"
          grep -Fq 'data-auto-article="alzbetinsky-klaster-kadan-pacienti-lecebna-1966"' <<<"$home"
          grep -Fq '/pocasi.js' <<<"$home"
          grep -Fq "<h2>${APPEAL_H2}</h2>" <<<"$donor"
          grep -Fq 'data-donor-appeal="1"' <<<"$donor"
          grep -Fq "<h1>${KLASTER_H1}</h1>" <<<"$klaster"
          grep -Fq "$KLASTER_REL" <<<"$archive"
          rm -rf /tmp/klaster-donor-repair
          REMOTE

      - name: Ověřit veřejný web zvenku
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          home="$(curl -4 -kfsS -L --max-time 30 "https://nasekadan.cz/?v=$stamp")"
          donor="$(curl -4 -kfsS -L --max-time 30 "https://nasekadan.cz${DONOR_REL}?v=$stamp")"
          klaster="$(curl -4 -kfsS -L --max-time 30 "https://nasekadan.cz${KLASTER_REL}?v=$stamp")"
          archive="$(curl -4 -kfsS -L --max-time 30 "https://nasekadan.cz/clanky/?v=$stamp")"
          grep -Fq 'data-auto-article="alzbetinsky-klaster-kadan-pacienti-lecebna-1966"' <<<"$home"
          grep -Fq '/pocasi.js' <<<"$home"
          grep -Fq "<h2>${APPEAL_H2}</h2>" <<<"$donor"
          grep -Fq 'pomoci zachránit lidský život' <<<"$donor"
          grep -Fq "<h1>${KLASTER_H1}</h1>" <<<"$klaster"
          grep -Fq "$KLASTER_REL" <<<"$archive"

      - name: Zapsat stav opravy
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ steps.patch.outputs.source_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const deploy=process.env.DEPLOY_OUTCOME||'skipped';
            const verify=process.env.VERIFY_OUTCOME||'skipped';
            const status=deploy==='success'&&verify==='success'?'success':'failure';
            const payload={status,run_id:String(context.runId),source_sha:process.env.SOURCE_SHA||'',checked_at:new Date().toISOString(),deploy,external_verify:verify,klaster_visible_on_home:status==='success',klaster_article_live:status==='success',donor_appeal_live:status==='success',weather_preserved:status==='success'};
            let sha;
            try { const old=await github.rest.repos.getContent({owner,repo,path:'.github/klaster-donor-appeal-status.json',ref:'main'}); sha=old.data.sha; }
            catch(e){ if(e.status!==404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'.github/klaster-donor-appeal-status.json',branch:'main',message:`Zapsat stav kláštera a výzvy dárcům: ${status} [skip ci]`,sha,content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64')});
