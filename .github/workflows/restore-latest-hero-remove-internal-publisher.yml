name: Vrátit nejnovější článek na první místo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-latest-hero-remove-internal-publisher.yml

permissions:
  contents: write

concurrency:
  group: nasekadan-restore-latest-hero
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vrátit chronologicky nejnovější článek do hlavní pozice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          from email.utils import parsedate_to_datetime, format_datetime

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          hero_and_aside = '''  <section class="wrap hero" id="clanky">
            <article class="lead" data-heat-article-hero>
              <div class="photo" style="background:linear-gradient(rgba(14,34,45,.18),rgba(14,34,45,.58)),url('/obrazky/koupaliste-kadan-budova-2026.jpg?v=20260728-2') center/cover no-repeat"><span>POČASÍ · PRAKTICKÁ KADAŇ</span><strong>AŽ 35 °C</strong></div>
              <div class="copy">
                <small>KADAŇ · 28. 07. 2026 · 17:45</small>
                <h1>Kadaň čekají tropické dny. Ve čtvrtek může být až 35 stupňů</h1>
                <p>Kde se zchladit, jak bude otevřené koupaliště a proč může být nová skluzavka během největšího horka dočasně uzavřena.</p>
                <a class="btn" href="/clanky/kadan-tropicke-dny-koupaliste-cervenec-2026.html">Přečíst praktický přehled →</a>
              </div>
            </article>
            <aside class="current-aside">
              <p class="aside-label">DALŠÍ AKTUÁLNÍ ČLÁNEK</p>
              <p class="aside-date">28. 7. 2026 v 11:30</p>
              <h2>Odstávky elektřiny omezí provoz restaurace v Autokempu Prunéřov</h2>
              <p>Ve dvou termínech otevře restaurace až po 18. hodině, potřetí po 16. hodině. Recepce zůstane otevřená.</p>
              <a class="aside-button" href="/clanky/odstavky-elektriny-autokemp-prunerov-srpen-2026.html">Přečíst praktické informace →</a>
              <div class="aside-links">
                <a href="/clanky/arc-med-nemocnice-kadan.html">ARC-MED za 16 milionů</a>
                <a href="/clanky/hasici-kadan-vycvik-zachrana-voda-nechranice.html">Výcvik hasičů na Nechranicích</a>
                <a href="/clanky/">Všechny články podle data</a>
              </div>
            </aside>
          </section>'''

          text, count = re.subn(
              r'  <section class="wrap hero" id="clanky">.*?  </section>',
              hero_and_aside,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Nepodařilo se opravit hlavní blok titulní stránky.')
          index.write_text(text, encoding='utf-8', newline='\n')

          rss = Path('rss.xml')
          xml = rss.read_text(encoding='utf-8')
          dates = []
          for raw in re.findall(r'<pubDate>(.*?)</pubDate>', xml, flags=re.S):
              try:
                  dates.append(parsedate_to_datetime(raw.strip()))
              except Exception:
                  pass
          if not dates:
              raise SystemExit('RSS neobsahuje platná data článků.')
          newest = max(dates)
          xml = re.sub(
              r'<lastBuildDate>.*?</lastBuildDate>',
              f'<lastBuildDate>{format_datetime(newest)}</lastBuildDate>',
              xml,
              count=1,
              flags=re.S,
          )
          rss.write_text(xml, encoding='utf-8', newline='\n')

          if 'Kadaň čekají tropické dny. Ve čtvrtek může být až 35 stupňů' not in text:
              raise SystemExit('Nejnovější článek není v hlavním bloku.')
          if 'Interní ambulance Nemocnice Kadaň bude tři týdny uzavřená' in text.split('<section class="wrap hero"', 1)[1].split('</section>', 1)[0]:
              raise SystemExit('Starší článek zůstal v hlavním bloku.')
          PY

          python3 scripts/sort_articles_chronologically.py

          # Jednorázový automat pro článek z 25. července už nesmí znovu přepsat titulku.
          rm -f .github/workflows/publish-internal-ambulance.yml
          rm -f .github/publish-internal-ambulance-trigger.txt
          rm -f scripts/publish_internal_ambulance.py

      - name: Zapsat opravu do hlavní větve
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-latest-hero-remove-internal-publisher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Vrátit nejnovější článek na první místo"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

  deploy:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit aktuální main přímo na produkci
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OVH_KEY"
          printf '%s\n' "$OVH_KEY" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_key"
          chmod 600 "$RUNNER_TEMP/nasekadan_key"

          ssh -i "$RUNNER_TEMP/nasekadan_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd
          SHA="$(git rev-parse HEAD)"
          sudo install -d -m 0755 /var/www/nasekadan
          sudo find /var/www/nasekadan -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar --exclude='.git' --exclude='.github' --exclude='Dockerfile' \
              --exclude='docker-compose.yml' --exclude='nginx' --exclude='scripts' \
              --exclude='deploy' -cf - . | sudo tar -C /var/www/nasekadan -xf -
          printf 'site=nasekadan.cz\nsource=%s\ngenerated=%s\nmode=static-latest-hero-fix\n' \
            "$SHA" "$(date -u +%FT%TZ)" | sudo tee /var/www/nasekadan/deployment-health.txt >/dev/null
          sudo chmod -R a+rX /var/www/nasekadan
          REMOTE

          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          for attempt in $(seq 1 20); do
            curl -4 -kfsS --max-time 20 "https://nasekadan.cz/?hero=$stamp-$attempt" -o /tmp/home.html || true
            curl -4 -kfsS --max-time 20 "https://nasekadan.cz/clanky/?hero=$stamp-$attempt" -o /tmp/archive.html || true
            if grep -Fq 'Kadaň čekají tropické dny. Ve čtvrtek může být až 35 stupňů' /tmp/home.html \
              && grep -Fq 'data-heat-article-hero' /tmp/home.html \
              && grep -Fq 'kadan-tropicke-dny-koupaliste-cervenec-2026.html' /tmp/archive.html; then
              echo 'Nejnovější článek je znovu první na titulní stránce.'
              exit 0
            fi
            sleep 5
          done
          echo 'Veřejná kontrola opraveného pořadí neprošla.' >&2
          exit 1
