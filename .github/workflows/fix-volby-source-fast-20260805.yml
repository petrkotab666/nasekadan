name: Opravit URL otevřených dat volby.cz

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-volby-source-fast-20260805.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-volby-source-fast-20260805
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Opravit kanonickou adresu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/city-sources.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          target='https://www.volby.cz/opendata/opendata.htm'
          found=False
          for item in data.get('sources',[]):
              if item.get('name') in {
                  'Volby.cz – otevřená data komunálních voleb',
                  'Volby.cz – otevřená data pro volební výsledky',
              } or str(item.get('url','')).rstrip('/')=='https://www.volby.cz/opendata':
                  item['name']='Volby.cz – otevřená data pro volební výsledky'
                  item['url']=target
                  item['category']='Volby a otevřená data'
                  found=True
          if not found:
              data.setdefault('sources',[]).append({
                  'name':'Volby.cz – otevřená data pro volební výsledky',
                  'url':target,
                  'category':'Volby a otevřená data',
              })
          data['updatedAt']='2026-08-05'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool data/city-sources.json >/dev/null
          grep -F 'https://www.volby.cz/opendata/opendata.htm' data/city-sources.json >/dev/null
          git config user.name 'nasekadan-monitor-bot'
          git config user.email 'nasekadan-monitor-bot@users.noreply.github.com'
          git add data/city-sources.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'monitoring: opravit adresu otevřených dat volby.cz'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
