name: Okamžitě nasadit výsledky ankety SMR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/poll-results-pr-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-poll-results-pr
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Stáhnout aktuální hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nasadit a veřejně ověřit živé výsledky
        shell: bash
        run: bash scripts/deploy_poll_results.sh
