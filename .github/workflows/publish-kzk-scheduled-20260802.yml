name: Zveřejnit KZK v neděli ve 4 ráno

on:
  schedule:
    - cron: '0 2 2 8 *'
    - cron: '12 2 2 8 *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-kzk-20260802
  cancel-in-progress: false

env:
  ARTICLE_URL: https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html
  ARTICLE_PATH: clanky/kulturni-zarizeni-kadan.html
  SOCIAL_PATH: social/kulturni-zarizeni-kadan-20260802.png
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Povolit pouze plánované datum
        shell: bash
        run: |
          set -euo pipefail
          test "$(date -u +%Y-%m-%d)" = "2026-08-02" || {
            echo 'Mimo jednorázové publikační datum, končím bez změny.'
            exit 0
          }

      - name: Stáhnout nejnovější hlavní větev
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Připravit článek a všechny veřejné plochy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 -m py_compile scripts/publish_kzk_20260802.py scripts/ensure_recent_home_articles_20260801.py
          python3 scripts/publish_kzk_20260802.py
          grep -Fq 'Od Střelnice po klášter' "$ARTICLE_PATH"
          grep -Fq 'id="konirna"' "$ARTICLE_PATH"
          grep -Fq 'Kadaňský pohádkový festival není akcí KZK' "$ARTICLE_PATH"
          grep -Fq 'data-promos data-context="sidebar"' "$ARTICLE_PATH"
          test -s "$SOCIAL_PATH"

      - name: Uložit publikaci do main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naše Kadaň – plánovaná publikace'
          git config user.email 'info@nasekadan.cz'
          git add "$ARTICLE_PATH" "$SOCIAL_PATH" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml scripts/ensure_recent_home_articles_20260801.py
          git commit -m 'Zveřejnit nedělní článek o KZK [skip ci]' || true
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            [[ "$attempt" == 5 ]] && exit 1
            sleep $((attempt * 5))
          done
          git fetch origin main
          git reset --hard origin/main
          test -s "$ARTICLE_PATH"

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
              break
            fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Nasadit článek a přehledy na OVH
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/kzk-publication.tar.gz" \
            "$ARTICLE_PATH" "$SOCIAL_PATH" index.html clanky/index.html rss.xml sitemap.xml news-sitemap.xml \
            site.js style.css footer.css mobile.css reklamy.js reklamy-sidebar.js reklamy-sidebar.css \
            reklamy-oprava-obrazku.js obsah-doplnky.js ad-spacing-guard.js analytics.js
          scp -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$RUNNER_TEMP/kzk-publication.tar.gz" ubuntu@57.129.43.215:/tmp/kzk-publication.tar.gz
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          sudo tar -xzf /tmp/kzk-publication.tar.gz -C /var/www/nasekadan
          sudo chmod -R a+rX /var/www/nasekadan
          if sudo docker inspect nasekadan-web >/dev/null 2>&1; then
            sudo docker cp /tmp/kzk-publication.tar.gz nasekadan-web:/tmp/kzk-publication.tar.gz
            sudo docker exec nasekadan-web tar -xzf /tmp/kzk-publication.tar.gz -C /usr/share/nginx/html
            sudo docker exec nasekadan-web rm -f /tmp/kzk-publication.tar.gz
          fi
          grep -Fq 'Od Střelnice po klášter' /var/www/nasekadan/clanky/kulturni-zarizeni-kadan.html
          grep -Fq '/clanky/kulturni-zarizeni-kadan.html' /var/www/nasekadan/index.html
          rm -f /tmp/kzk-publication.tar.gz
          REMOTE

      - name: Veřejně ověřit úplnou publikaci
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time, urllib.request
          base='https://nasekadan.cz'
          checks={
            '/clanky/kulturni-zarizeni-kadan.html':['Od Střelnice po klášter','id="konirna"','Kadaňský pohádkový festival není akcí KZK','data-promos data-context="sidebar"'],
            '/':['/clanky/kulturni-zarizeni-kadan.html','data-latest-article-href="/clanky/kulturni-zarizeni-kadan.html"'],
            '/clanky/':['/clanky/kulturni-zarizeni-kadan.html'],
            '/rss.xml':['https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html'],
            '/sitemap.xml':['https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html'],
            '/news-sitemap.xml':['https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html'],
          }
          for path, markers in checks.items():
            last=''
            for attempt in range(8):
              url=base+path+('?' if '?' not in path else '&')+'kzk_verify='+str(int(time.time()*1000))
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'NaseKadan-KZK-Verify/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=25) as response:
                  last=response.read().decode('utf-8','replace')
                if all(marker in last for marker in markers): break
              except Exception as exc: last=str(exc)
              time.sleep(4+attempt*2)
            else: raise SystemExit(f'{path}: kontrola selhala: {last[:300]}')
          image=urllib.request.urlopen(base+'/social/kulturni-zarizeni-kadan-20260802.png?kzk=1',timeout=25).read()
          if len(image)<10000: raise SystemExit('Sociální obrázek je neúplný.')
          print('Veřejná publikace KZK je úplná.')
          PY
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Ověřit vykreslení článku a reklam v prohlížeči
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          output="$RUNNER_TEMP/kzk.dom.html"
          timeout 60s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1440,1200 --virtual-time-budget=10000 --dump-dom \
            "https://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html?render=${GITHUB_RUN_ID}" > "$output"
          grep -Fq 'Od Střelnice po klášter' "$output"
          grep -Fq 'article-aside-adstream' "$output"
          grep -Eq 'article-aside-ad-|promo-card|article-ad-auto' "$output"
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat výsledek do issue
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OK: ${{ steps.verify.outputs.ok }}
          BROWSER_OK: ${{ steps.browser.outputs.ok }}
        with:
          script: |
            const issue_number = 507;
            const ok = process.env.VERIFY_OK === 'true' && process.env.BROWSER_OK === 'true';
            const body = ok
              ? '✅ Článek o KZK byl zveřejněn, je první na titulní straně, je v archivu, RSS a obou sitemapách. Ověřeno bylo i skutečné vykreslení reklam.\n\nhttps://nasekadan.cz/clanky/kulturni-zarizeni-kadan.html'
              : '❌ Plánovaná publikace KZK nebyla kompletně ověřena. Záložní watchdog provede další nezávislý pokus.';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number, body});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number, state: 'closed', state_reason: 'completed'});
