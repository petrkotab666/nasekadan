name: Nouzově obnovit úplný web přes issue 507

on:
  issues:
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasekadan-emergency-monotonic-restore
  cancel-in-progress: false

env:
  KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
  KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
  KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 507
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Připravit SSH klíč
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/ovh_key"
              break
            fi
          done
          test -s "$RUNNER_TEMP/ovh_key"
          chmod 600 "$RUNNER_TEMP/ovh_key"

      - name: Obnovit úplný aktuální main na OVH
        id: restore
        shell: bash
        run: |
          set +e
          ssh -i "$RUNNER_TEMP/ovh_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ubuntu@57.129.43.215 'bash -s' >"$RUNNER_TEMP/restore.log" 2>&1 <<'REMOTE'
          set -euo pipefail
          LOCK=/tmp/nasekadan-production-deploy.lock
          sudo touch "$LOCK"
          sudo chmod a+rw "$LOCK"
          exec 9>"$LOCK"
          flock -w 300 9
          sudo chown -R ubuntu:ubuntu /opt/nasekadan
          sudo rm -f /opt/nasekadan/.git/index.lock
          git -C /opt/nasekadan fetch --prune origin main
          git -C /opt/nasekadan reset --hard origin/main
          git -C /opt/nasekadan clean -fd
          flock -u 9
          sudo bash /opt/nasekadan/deploy/install-automation.sh
          cd /opt/nasekadan
          python3 scripts/verify_published_article_set.py --source . --target /var/www/nasekadan
          grep -Fq 'zzs-kadan-garaz-mycka-2026.html' /var/www/nasekadan/clanky/index.html
          grep -Fq 'slavie-kadan-epp-plavci-120-tisic-2026.html' /var/www/nasekadan/clanky/index.html
          grep -Fq 'mestska-policie-kadan-fakta-diskuse-2026.html' /var/www/nasekadan/clanky/index.html
          grep -Fq 'gymnastika-kadan-treneri-prosinec-2026.html' /var/www/nasekadan/clanky/index.html
          REMOTE
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/restore.log"
          exit 0

      - name: Veřejně ověřit články a Facebook kartu
        id: live
        if: steps.restore.outputs.rc == '0'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          stamp="restore-${GITHUB_RUN_ID}-$(date +%s)"
          base='https://nasekadan.cz'
          curl -4 -kfsSL --max-time 40 "$base/?$stamp" -o /tmp/home.html
          curl -4 -kfsSL --max-time 40 "$base/clanky/?$stamp" -o /tmp/archive.html
          curl -4 -kfsSL --max-time 40 "$base/rss.xml?$stamp" -o /tmp/rss.xml
          curl -4 -kfsSL --max-time 40 "$base/sitemap.xml?$stamp" -o /tmp/sitemap.xml
          curl -4 -kfsSL --max-time 40 "$base/news-sitemap.xml?$stamp" -o /tmp/news.xml
          curl -4 -kfsSL --max-time 40 "$base/clanky/zzs-kadan-garaz-mycka-2026.html?$stamp" -o /tmp/zzs.html
          curl -4 -kfsSL --max-time 40 "$base/clanky/slavie-kadan-epp-plavci-120-tisic-2026.html?$stamp" -o /tmp/slavie.html
          for name in zzs-kadan-garaz-mycka-2026.html slavie-kadan-epp-plavci-120-tisic-2026.html od-hlubin-k-nebi-kadan.html mestska-policie-kadan-fakta-diskuse-2026.html gymnastika-kadan-treneri-prosinec-2026.html; do
            grep -Fq "$name" /tmp/archive.html
            grep -Fq "$name" /tmp/rss.xml
            grep -Fq "$name" /tmp/sitemap.xml
          done
          grep -Fq '16,5 milionu' /tmp/zzs.html
          grep -Fq '120 000 Kč' /tmp/slavie.html
          og=$(python3 - <<'PY'
import re
from pathlib import Path
text=Path('/tmp/zzs.html').read_text(encoding='utf-8')
m=re.search(r'<meta\b[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)',text,re.I)
assert m
print(m.group(1))
PY
          )
          case "$og" in https://nasekadan.cz/social/*) ;; *) echo "OG není lokální: $og" >&2; exit 1;; esac
          curl -4 -kfsSL --max-time 40 "$og?$stamp" -o /tmp/og
          test -s /tmp/og
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Zapsat výsledek do issue 507
        if: always()
        uses: actions/github-script@v7
        env:
          RESTORE_RC: ${{ steps.restore.outputs.rc }}
          LIVE: ${{ steps.live.outcome }}
        with:
          script: |
            const ok=process.env.RESTORE_RC === '0' && process.env.LIVE === 'success';
            const body=ok
              ? '✅ Úplná monotónní obnova dokončena. ZZS, Slávie, Od hlubin k nebi, Městská policie a Gymnastika jsou veřejně ověřené v archivu, RSS a sitemapě; ZZS má lokální Facebook OG obrázek.'
              : `❌ Úplná obnova selhala. Server exit=${process.env.RESTORE_RC || 'unknown'}, veřejná kontrola=${process.env.LIVE || 'unknown'}.`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:507,body});
            if(ok) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:507,state:'closed',state_reason:'completed'});

      - name: Selhat při neúspěchu
        if: always()
        shell: bash
        run: |
          test "${{ steps.restore.outputs.rc }}" = '0'
          test "${{ steps.live.outcome }}" = 'success'
