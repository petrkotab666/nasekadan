name: Nasadit statická data počasí na OVH
run-name: Nasazení počasí s desetiminutovým serverovým časovačem

on:
  push:
    branches: [main]
    paths:
      - '.github/weather-static-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasekadan-weather-static-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEY_OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      KEY_OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      KEY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KEY_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KEY_VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      KEY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KEY_SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KEY_SSH_KEY: ${{ secrets.SSH_KEY }}
      KEY_OVH_PRIVATE_KEY: ${{ secrets.OVH_PRIVATE_KEY }}
    steps:
      - name: Vybrat SSH klíč
        id: key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in KEY_OVH_SSH_KEY KEY_OVH_SSH_PRIVATE_KEY KEY_SSH_PRIVATE_KEY KEY_VPS_SSH_KEY KEY_VPS_SSH_PRIVATE_KEY KEY_DEPLOY_SSH_KEY KEY_SERVER_SSH_KEY KEY_SSH_KEY KEY_OVH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" | tr -d '\r' > "$RUNNER_TEMP/nasekadan_key"
              chmod 600 "$RUNNER_TEMP/nasekadan_key"
              echo "secret=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 20

      - name: Nasadit soubory, statické zdroje a časovač
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/nasekadan_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            ubuntu@57.129.43.215 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/nasekadan
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd

          sudo install -D -m 0644 pocasi/index.html /var/www/nasekadan/pocasi/index.html
          sudo install -D -m 0644 pocasi.js /var/www/nasekadan/pocasi.js
          sudo install -D -m 0644 navigation.js /var/www/nasekadan/navigation.js
          sudo install -D -m 0644 upoutavky.js /var/www/nasekadan/upoutavky.js

          cid="$(sudo docker ps --filter name=^/nasekadan-web$ -q | head -n1)"
          [[ -n "$cid" ]] || cid="$(sudo docker ps --filter publish=3224 -q | head -n1)"
          [[ -n "$cid" ]]

          sudo docker exec "$cid" mkdir -p /usr/share/nginx/html/pocasi /usr/share/nginx/html/api/chmi-pocasi
          sudo docker cp pocasi/index.html "$cid:/usr/share/nginx/html/pocasi/index.html"
          sudo docker cp pocasi.js "$cid:/usr/share/nginx/html/pocasi.js"
          sudo docker cp navigation.js "$cid:/usr/share/nginx/html/navigation.js"
          sudo docker cp upoutavky.js "$cid:/usr/share/nginx/html/upoutavky.js"
          sudo docker cp nginx/default.conf "$cid:/etc/nginx/conf.d/default.conf"
          sudo docker exec "$cid" nginx -t
          sudo docker exec "$cid" nginx -s reload

          chmod +x deploy/install-weather-proxy.sh deploy/update-weather-data.sh deploy/install-weather-timer.sh
          sudo bash deploy/install-weather-proxy.sh
          sudo bash deploy/install-weather-timer.sh

          sudo systemctl is-active --quiet nasekadan-weather.timer
          sudo systemctl is-active --quiet nasekadan-weather.service || sudo systemctl show -p Result nasekadan-weather.service | grep -Fq 'Result=success'
          test -s /var/www/nasekadan/api/pocasi-predpoved.json
          ls /var/www/nasekadan/api/chmi-pocasi/10m-0-20000-0-11438-*.json >/dev/null
          curl -fsS --max-time 15 http://127.0.0.1:3224/api/pocasi-predpoved.json >/dev/null
          REMOTE

      - name: Ověřit veřejná data
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base='https://nasekadan.cz'
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          page="$(mktemp)"; script="$(mktemp)"; forecast="$(mktemp)"; observation="$(mktemp)"

          curl -kfsS --max-time 35 "$base/pocasi/?verify=$nonce" -o "$page"
          grep -Fq 'Počasí v Kadani' "$page"
          curl -kfsS --max-time 35 "$base/pocasi.js?verify=$nonce" -o "$script"
          grep -Fq '/api/pocasi-predpoved.json' "$script"
          curl -kfsS --max-time 35 "$base/api/pocasi-predpoved.json?verify=$nonce" -o "$forecast"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); s=d.get('properties',{}).get('timeseries',[]); assert isinstance(s,list) and len(s)>=24; print(f'Předpověď: {len(s)} kroků')" "$forecast"

          today="$(TZ=Europe/Prague date +%Y%m%d)"; yesterday="$(TZ=Europe/Prague date -d yesterday +%Y%m%d)"; found=false
          for day in "$today" "$yesterday"; do
            if curl -kfsS --max-time 35 "$base/api/chmi-pocasi/10m-0-20000-0-11438-${day}.json?verify=$nonce" -o "$observation" \
              && python3 -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); assert isinstance(d,dict) and d" "$observation"; then found=true; break; fi
          done
          [[ "$found" == true ]]
          rm -f "$page" "$script" "$forecast" "$observation"

      - name: Ověřit skutečné vykreslení v Chromium
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const nonce=Date.now();
            await page.goto(`https://nasekadan.cz/?weather=${nonce}`,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForSelector('#weather-strip .nk-weather-strip__now strong',{timeout:45000});
            const strip=await page.locator('#weather-strip').innerText();
            if(!strip.includes('Kadaň právě teď')||!strip.includes('°C'))throw new Error(strip);
            await page.goto(`https://nasekadan.cz/pocasi/?weather=${nonce}`,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForSelector('.nk-weather-hero .nk-weather-current strong',{timeout:45000});
            const detail=await page.locator('#weather-app').innerText();
            if(!detail.includes('°C')||!detail.includes('Předpověď na sedm dní')||!detail.includes('Nejbližších 24 hodin'))throw new Error(detail.slice(0,500));
            console.log(strip.replace(/\s+/g,' '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Zapsat stav
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          KEY_SECRET: ${{ steps.key.outputs.secret }}
        run: |
          set -u
          status=failure
          [[ "$DEPLOY_OUTCOME" == success && "$VERIFY_OUTCOME" == success && "$BROWSER_OUTCOME" == success ]] && status=success
          git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git status-repo
          cd status-repo
          STATUS="$status" DEPLOY="$DEPLOY_OUTCOME" VERIFY="$VERIFY_OUTCOME" BROWSER="$BROWSER_OUTCOME" KEY="$KEY_SECRET" RUN="$GITHUB_RUN_ID" SHA="$GITHUB_SHA" python3 -c "import json,os;from datetime import datetime,timezone;from pathlib import Path;p={'status':os.environ['STATUS'],'source_sha':os.environ['SHA'],'run_id':os.environ['RUN'],'checked_at':datetime.now(timezone.utc).isoformat(),'ssh_key':os.environ['KEY'],'deploy':os.environ['DEPLOY'],'data_verify':os.environ['VERIFY'],'browser_verify':os.environ['BROWSER'],'update_interval_minutes':10,'page':'https://nasekadan.cz/pocasi/'};Path('.github/weather-live-status.json').write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/weather-live-status.json; git commit -m "Zapsat stav živého počasí: $status [skip ci]" || exit 0
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
