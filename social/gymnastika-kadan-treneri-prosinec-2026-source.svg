<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gymnastika Kadaň – chybějí trenéři</title>
  <desc id="desc">Redakční grafika Naše Kadaň k článku o nedostatku trenérů v kadaňské gymnastice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132d42"/>
      <stop offset="0.58" stop-color="#214f68"/>
      <stop offset="1" stop-color="#397c83"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efefea" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#07131d" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1115" cy="76" r="230" fill="#ffffff" opacity="0.035"/>
  <circle cx="1040" cy="590" r="305" fill="#ffffff" opacity="0.035"/>
