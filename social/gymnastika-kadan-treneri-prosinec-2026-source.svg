    <text x="72" y="276" font-size="67" font-weight="900" letter-spacing="-1.8">CHYBĚJÍ</text>
    <text x="72" y="350" font-size="67" font-weight="900" letter-spacing="-1.8">TRENÉŘI</text>
    <text x="72" y="413" font-size="25" font-weight="600" opacity="0.92">Oddíl nyní nepřijímá nové děti.</text>
